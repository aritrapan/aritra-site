<script>
  var gcTimer = setInterval(function () {
    if (window.goatcounter && window.goatcounter.visit_count) {
      clearInterval(gcTimer);
      window.goatcounter.visit_count({
        append: '#visit-count',
        path: 'TOTAL',
        no_branding: true,
        attr: { width: '140', height: '18' },
        style: 'div { display: inline-block; vertical-align: baseline; border: none; background: transparent; padding: 0; margin: 0; line-height: 1; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 13px; color: #6b7280; } #gcvc-for { display: none; }'
      });
    }
  }, 100);
</script>
<script data-goatcounter="https://aritrapan.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
