<script>
  var gcTimer = setInterval(function () {
    if (window.goatcounter && window.goatcounter.visit_count) {
      clearInterval(gcTimer);
      window.goatcounter.visit_count({
        append: '#visit-count',
        path: 'TOTAL',
        no_branding: true,
        attr: { width: '240', height: '28' },
        style: 'div { border: none; background: transparent; padding: 0; margin: 0; text-align: left; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 13px; color: #6b7280; } #gcvc-for { display: none; } #gcvc-views { font-weight: 600; } #gcvc-views::after { content: " site visits"; font-weight: 400; }'
      });
    }
  }, 100);
</script>
<script data-goatcounter="https://aritrapan.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
