{id:"g_innov", p:"teach", l:"Teaching philosophy and innovations", d:[`In recent years, I have implemented several innovative teaching methods to create engaging and impactful learning experiences.`]},
{id:"t_story", p:"g_innov", l:"Storytelling instead of presentations", tag:"Teaching innovation",
 d:[`Replaced traditional project presentations with storytelling through drama or other creative methods (no PowerPoint allowed) to simplify complex techniques and processes, applied in Machine Learning and SQL courses.`], r:["m_sql"]},
{id:"t_dynamic", p:"g_innov", l:"Dynamic, problem-driven teaching", tag:"Teaching innovation",
 d:[`Adopted a hands-on, problem-driven teaching style for SQL courses, starting from real-world data analysis and gradually moving through understanding, defining, modeling, and executing solutions. Students engage in group projects from day one, exploring problems and datasets, bypassing the conventional chapter-by-chapter flow.`], r:["m_sql"]},
{id:"t_genai", p:"g_innov", l:"Generative AI as virtual consultant", tag:"Teaching innovation",
 d:[`Introduced Generative AI tools in the MIS course as virtual consultants to discuss cases and business problems. Students also practice live prompt engineering to interact effectively with these tools and address their queries.`], r:["m_prompt","t_media"]},
{id:"t_noppt", p:"g_innov", l:"No PowerPoint policy", tag:"Teaching innovation",

 d:[`West Bengal Joint Entrance Examination 2004: state rank 360 (Engineering); 80th in state, Secondary Board examination.`]},
{id:"h_cert", p:"hon", l:"Certifications", tag:"Certifications",
 b:[`Certified Microsoft Innovative Educator`,`Machine Learning (Stanford, Coursera)`,`The Data Scientist's Toolbox and R Programming (Johns Hopkins, Coursera)`,`Kaggle R Tutorial on Machine Learning, Introduction to Machine Learning, and Plotly and R (DataCamp)`,`Text Mining and NLP in R, Data Mining & NLP in R, and Data Science in Python (Udemy)`,`Try R and Try Python (Code School)`]},
{id:"h_memb", p:"hon", l:"Professional memberships", tag:"Memberships",
 b:[`Member, IEEE`,`Life Member, Operational Research Society of India`,`Member, Institution of Engineers (India)`,`Fellow, All India Council for Robotics & Automation`,`Member, IEEE Intelligent Transportation Systems Society`,`Member, IEEE Technology and Engineering Management Society`]},
{id:"h_lang", p:"hon", l:"Languages", tag:"Languages", d:[`English, Bengali, Hindi.`]},
{id:"g_refs", p:"hon", l:"References"},
{id:"ref_jain", p:"g_refs", l:"Dr. Nikunj Kumar Jain", tag:"Reference", d:[`Associate Professor, Operations and Production Management, Indian Institute of Management Nagpur.`]},
{id:"ref_das", p:"g_refs", l:"Dr. Santanu Das", tag:"Reference", d:[`Professor, Financial Management, Indian Institute of Forest Management Bhopal.`]},
{id:"ref_ray", p:"g_refs", l:"Dr. Sougata Ray", tag:"Reference", d:[`Associate Professor, Finance and Accounting, IMI Bhubaneswar.`]},

];
/* ===================== END OF CV CONTENT ===================== */

const HUB_COLOR = { me:"#1f4e79", appt:"#2c6aa0", ind:"#c0622d", edu:"#7556a8", pubs:"#1c8a6e", pipe:"#7a9a2e",
  teach:"#b98a12", meth:"#1f9bb0", lead:"#b0413e", talks:"#c0589a", hon:"#6f7782" };
const LENS = { all:null, hire:["appt","pubs","lead","edu","teach"], collab:["pubs","pipe","meth","talks"], student:["teach","meth","ind","talks"] };

/* ---------- build the tree ---------- */
const N = new Map();
CV.forEach(n => { n.children = []; n.rel = new Set(); N.set(n.id, n); });
CV.forEach(n => { if (n.p) N.get(n.p).children.push(n); });
CV.forEach(n => (n.r || []).forEach(t => { const o = N.get(t); if (o) { n.rel.add(t); o.rel.add(n.id); } }));
CV.forEach(n => { n.co = new Map(); });
CV.forEach(w => { if(!/^(p_|cf_)/.test(w.id)) return;
  const ppl=[...w.rel].filter(id=>id.startsWith("ca_"));
  ppl.forEach(a => ppl.forEach(b => { if(a!==b){ const m=N.get(a).co; m.set(b,(m.get(b)||0)+1); } })); });
function ancestors(n){ const a=[]; let c=n; while(c.p){ c=N.get(c.p); a.unshift(c); } return a; }
CV.forEach(n => { const a = ancestors(n); n.depth = a.length; n.hub = n.depth===0 ? "me" : (n.depth===1 ? n.id : a[1].id);
  n.color = HUB_COLOR[n.hub] || "#666"; n.count = 0; });
function countLeaves(n){ if(!n.children.length) return 1; let c=0; n.children.forEach(k=>c+=countLeaves(k)); n.count=c; return c; }
countLeaves(N.get("me"));
CV.forEach(n => { n.search = [n.l, n.f||"", n.tag||"", n.m||"", (n.d||[]).join(" "), (n.b||[]).join(" ")].join(" ").toLowerCase(); });

/* ---------- state ---------- */
const S = { expanded:new Set(["me"]), selected:"me", multi:false, conn:true, lens:"all", history:[], query:"" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function childDist(n){ return Math.max(85, Math.min(240, 17*n.children.length + 30)); }
function reach(n){ let m=0; n.children.forEach(c=>{ if(S.expanded.has(c.id)) m=Math.max(m,reach(c)); }); return childDist(n) + 45 + m; }
function radius(n){ if(n.depth===0) return 32; if(n.depth===1) return 24; return n.children.length ? 15 : 8; }
function collapse(n){ S.expanded.delete(n.id); n.children.forEach(collapse); }
function expand(n){
  if(!n.children.length) return;
  if(!S.multi && n.p) N.get(n.p).children.forEach(s => { if(s!==n) collapse(s); });
  S.expanded.add(n.id);
}
function treeVisible(){
  const out=[]; (function walk(n){ out.push(n); if(S.expanded.has(n.id)) n.children.forEach(walk); })(N.get("me")); return out;
}
function select(id, push=true){
  if(push && S.selected && S.selected!==id){ S.history.push(S.selected); if(S.history.length>60) S.history.shift(); }
  S.selected=id;
  try{ history.replaceState(null,"","#"+id); }catch(e){}
}
function navigate(id, push=true){
  const n=N.get(id); if(!n) return;
  ancestors(n).forEach(expand); expand(n);
  select(id,push); update(true);
}
function clickNode(n){
  const vis = new Set(treeVisible().map(x=>x.id));
  if(!vis.has(n.id)){ navigate(n.id); return; }
  if(n.children.length){
    if(S.expanded.has(n.id) && S.selected===n.id && n.id!=="me") collapse(n); else expand(n);
  }
  select(n.id); update(true);
}

/* ---------- graph ---------- */
const HAS_D3 = typeof d3 !== "undefined";
let svg, vp, gL, gN, zoom, sim, linkSel, nodeSel, fitTimers=[];
if(!HAS_D3){ document.body.classList.add("list","nograph"); }
else {
svg = d3.select("#graph"); vp = d3.select("#vp"); gL = d3.select("#links"); gN = d3.select("#nodes");
zoom = d3.zoom().scaleExtent([0.25,3]).on("zoom", e => vp.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);
sim = d3.forceSimulation()
  .force("link", d3.forceLink().id(d=>d.id)
     .distance(l => l.co ? 80 : l.cross ? 150 : (l.source.depth===0 ? 180 : childDist(l.source)) + (S.expanded.has(l.target.id) ? reach(l.target) : 0))
     .strength(l => l.co ? 0.35 : l.cross ? (l.ghost ? 0.35 : 0.01) : 0.9))
  .force("charge", d3.forceManyBody().strength(d => -260 - 9*radius(d)).distanceMax(520))
  .force("collide", d3.forceCollide().radius(d => radius(d) + (d.depth<=1 ? 36 : 38)).strength(1).iterations(2))
  .force("x", d3.forceX(0).strength(0.035)).force("y", d3.forceY(0).strength(0.035))
  .on("tick", ticked);
linkSel = gL.selectAll("line"); nodeSel = gN.selectAll("g.node");
svg.on("click",()=>{ document.getElementById("hint").style.display="none"; });
}

function wrap(s,max,maxLines){
  const out=[]; let cur="";
  s.split(/\s+/).forEach(w => { if(cur && (cur+" "+w).length>max){ out.push(cur); cur=w; } else cur = cur ? cur+" "+w : w; });
  if(cur) out.push(cur);
  if(out.length>maxLines){ out.length=maxLines; out[maxLines-1]=out[maxLines-1].replace(/[\s,;:(]*\S{0,2}$/,"")+"…"; }
  return out;
}
function seed(n, from){
  if(n.x!==undefined) return;
  const a = Math.random()*Math.PI*2, base = from || {x:0,y:0};
  let dx=Math.cos(a), dy=Math.sin(a);
  if(from && (from.x||from.y)){ const m=Math.hypot(from.x,from.y)||1; dx = from.x/m*0.8 + dx*0.6; dy = from.y/m*0.8 + dy*0.6; }
  n.x = base.x + dx*70; n.y = base.y + dy*70;
}
function update(refit){
  if(!HAS_D3){ renderPanel(); renderCrumbs(); return; }
  const tv = treeVisible(), tvSet = new Set(tv.map(n=>n.id));
  if(!tvSet.has(S.selected)){ let c=N.get(S.selected); while(c && !tvSet.has(c.id)) c=N.get(c.p); S.selected = c ? c.id : "me"; }
  const sel = N.get(S.selected);
  const ghosts = S.conn ? [...sel.rel].filter(id=>!tvSet.has(id)).map(id=>N.get(id)) : [];
  const nodes = tv.concat(ghosts), vis = new Set(nodes.map(n=>n.id)), ghostSet = new Set(ghosts.map(n=>n.id));
  const root=N.get("me"); root.fx=0; root.fy=0; root.x=0; root.y=0;
  root.children.forEach((h,i) => { if(h.x===undefined){ const a=-Math.PI/2+i*2*Math.PI/root.children.length; h.x=190*Math.cos(a); h.y=190*Math.sin(a); } });
  tv.forEach(n => { if(!n.p || n.depth<2 || n.x!==undefined) return;
    const par=N.get(n.p), gp=N.get(par.p)||{x:0,y:0}, k=par.children.length, i=par.children.indexOf(n);
    const out=Math.atan2(par.y-gp.y, par.x-gp.x), span=2*Math.PI*k/(k+1), a=out+(k>1 ? (i/(k-1)-0.5)*span : 0), d=childDist(par);
    n.x=par.x+d*Math.cos(a); n.y=par.y+d*Math.sin(a); });
  ghosts.forEach(n => seed(n, sel));
  const links=[];
  tv.forEach(n => { if(n.p) links.push({source:n.p, target:n.id, cross:false, key:n.p+">"+n.id, color:n.color}); });
  if(S.conn){
    const seen=new Set();
    nodes.forEach(n => n.rel.forEach(t => { if(!vis.has(t)) return; const k=[n.id,t].sort().join("~"); if(seen.has(k)) return; seen.add(k);
      links.push({source:n.id, target:t, cross:true, key:k, ghost:ghostSet.has(n.id)||ghostSet.has(t)}); }));
  }
  tv.forEach(n => n.co.forEach((w,t) => { if(n.id<t && tvSet.has(t)) links.push({source:n.id, target:t, co:true, w, key:"co:"+n.id+"~"+t}); }));
  const lens = LENS[S.lens], q = S.query;
  const dimmed = n => lens && n.depth>0 && !lens.includes(n.hub) && n.id!==S.selected && !sel.rel.has(n.id);

  linkSel = gL.selectAll("line").data(links, d=>d.key).join("line")
    .attr("class", d => "link"+(d.cross?" cross":"")+(d.co?" co":"")).attr("stroke", d => d.cross?null:(d.co?HUB_COLOR.pubs:d.color))
    .style("stroke-width", d => d.co ? (1.2+1.8*d.w)+"px" : null);
  nodeSel = gN.selectAll("g.node").data(nodes, d=>d.id).join(
    enter => { const g = enter.append("g").attr("tabindex",0).attr("role","button");
      g.append("circle").attr("class","sel"); g.append("circle").attr("class","body"); g.append("text").attr("class","in").attr("dy","0.35em");
      g.append("text").attr("class","lab");
      g.on("click",(e,d)=>{ e.stopPropagation(); clickNode(d); })
       .on("keydown",(e,d)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); clickNode(d); } })
       .call(d3.drag().on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
         .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
         .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); if(d.id!=="me"){ d.fx=null; d.fy=null; } }));
      return g; });
  nodeSel.attr("class", d => "node"+(d.depth===0?" root":d.depth===1?" hub":"")+(d.id===S.selected?" selected":"")+(ghostSet.has(d.id)?" ghost":"")
      +(dimmed(d)?" dim":"")+(q && d.search.includes(q)?" match":""))
    .attr("aria-label", d => d.l + (d.children.length ? ", "+d.count+" items" : ""));
  nodeSel.each(function(d){
    const g=d3.select(this), r=radius(d), open=S.expanded.has(d.id), has=d.children.length>0;
    g.select("circle.body").attr("r",r).attr("fill",d.color).attr("fill-opacity", has && open && d.depth>0 ? 0.28 : 1)
      .attr("stroke",d.color).attr("stroke-width", has ? 2.5 : 1);
    g.select("circle.sel").attr("r",r+5);
    g.select("text.in").text(d.depth===0 ? "AP" : (has && !open ? d.count : ""));
    const lines = wrap(d.l, d.depth<=1 ? 16 : 20, d.depth<=1 ? 2 : 3), t=g.select("text.lab"); t.selectAll("tspan").remove();
    lines.forEach((ln,i)=> t.append("tspan").attr("x",0).attr("y", r+14+i*12.5).text(ln));
  });
  linkSel.classed("dim", d => { const s=N.get(d.source.id||d.source), t=N.get(d.target.id||d.target); return dimmed(s)||dimmed(t); });
  sim.nodes(nodes); sim.force("link").links(links); sim.alpha(0.9).restart();
  renderPanel(); renderCrumbs();
  if(refit){ fitTimers.forEach(clearTimeout); fitTimers=[setTimeout(()=>fit(500),450), setTimeout(()=>fit(600),1400)]; }
}
function ticked(){
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
function fit(dur){
  if(!HAS_D3) return;
  let ns=sim.nodes(); if(!ns.length) return;
  const cur=N.get(S.selected);
  if(cur && cur.depth>0){
    const keep=new Set([cur.id, cur.p]); cur.children.forEach(c=>keep.add(c.id)); cur.rel.forEach(id=>keep.add(id));
    if(!cur.children.length || !S.expanded.has(cur.id)) N.get(cur.p).children.forEach(c=>keep.add(c.id));
    const f=ns.filter(n=>keep.has(n.id)); if(f.length>1) ns=f;
  }
  const el=document.getElementById("graphwrap"), w=el.clientWidth||900, h=el.clientHeight||600;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  ns.forEach(n=>{ const r=radius(n); x0=Math.min(x0,n.x-r-62); x1=Math.max(x1,n.x+r+62); y0=Math.min(y0,n.y-r-48); y1=Math.max(y1,n.y+r+54); });
  const k=Math.max(0.3,Math.min(1.5, 0.96*Math.min(w/(x1-x0), h/(y1-y0))));
  const t=d3.zoomIdentity.translate(w/2-k*(x0+x1)/2, h/2-k*(y0+y1)/2).scale(k);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  (reduce||!dur ? svg : svg.transition().duration(dur)).call(zoom.transform,t);
}

/* ---------- detail panel, breadcrumb ---------- */
function bodyHtml(n){
  let h="";
  if(n.m) h+=`<div class="meta">${esc(n.m)}</div>`;
  (n.d||[]).forEach(p=>h+=`<p>${esc(p)}</p>`);
  if(n.b) h+="<ul>"+n.b.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>";
  if(n.u) h+=`<p><a href="${esc(n.u)}" target="_blank" rel="noopener">${esc(n.ul||n.u)}</a></p>`;
  return h;
}
function chip(n){ return `<button class="chip" data-go="${n.id}"><i style="background:${n.color}"></i>${esc(n.l)}</button>`; }
function renderPanel(){
  const n=N.get(S.selected), hubName = n.depth>1 ? N.get(n.hub).l : "";
  let h=`<div class="tag">${esc(n.tag || hubName || (n.depth===1?"Section":""))}</div><h2>${esc(n.f||n.l)}</h2>`+bodyHtml(n);
  if(n.children.length) h+=`<h3>Inside this section (${n.count})</h3><div class="chips">${n.children.map(chip).join("")}</div>`;
  if(n.co.size) h+=`<h3>Worked together with</h3><div class="chips">${[...n.co].map(([id,w])=>{ const o=N.get(id); return `<button class="chip" data-go="${id}"><i style="background:${o.color}"></i>${esc(o.l)} · ${w} joint work${w>1?"s":""}</button>`; }).join("")}</div>`;
  if(n.rel.size) h+=`<h3>Connected to</h3><div class="chips">${[...n.rel].map(id=>chip(N.get(id))).join("")}</div>`;
  const p=document.getElementById("panel"); p.innerHTML=h; p.scrollTop=0;
}
document.getElementById("panel").addEventListener("click", e => { const b=e.target.closest("[data-go]"); if(b) navigate(b.dataset.go); });
function renderCrumbs(){
  const n=N.get(S.selected), path=ancestors(n).concat([n]);
  document.getElementById("crumbs").innerHTML = path.map((x,i)=> i<path.length-1 ? `<button data-go="${x.id}">${esc(x.l)}</button> › ` : esc(x.l)).join("");
}
document.getElementById("crumbs").addEventListener("click", e => { const b=e.target.closest("[data-go]"); if(b) navigate(b.dataset.go); });

/* ---------- list view ---------- */
function listHtml(n){
  if(n.children.length) return `<details ${n.depth<1?"open":""} id="L_${n.id}"><summary>${esc(n.f||n.l)} <span class="lbl">(${n.count})</span></summary>${bodyHtml(n)}${n.children.map(listHtml).join("")}</details>`;
  return `<div class="leaf" id="L_${n.id}"><b>${esc(n.f||n.l)}</b>${bodyHtml(n)}</div>`;
}
document.getElementById("listview").innerHTML =
  `<p><button class="btn" id="lOpen">Expand all</button> <button class="btn" id="lClose">Collapse all</button></p>` + listHtml(N.get("me"));
document.getElementById("lOpen").onclick = () => document.querySelectorAll("#listview details").forEach(d=>d.open=true);
document.getElementById("lClose").onclick = () => document.querySelectorAll("#listview details").forEach(d=>d.open = d.id==="L_me");

/* ---------- controls ---------- */
function setView(list){
  document.body.classList.toggle("list",list);
  document.getElementById("vGraph").setAttribute("aria-pressed",!list); document.getElementById("vList").setAttribute("aria-pressed",list);
  if(!list) setTimeout(()=>fit(0),50);
}
document.getElementById("vGraph").onclick=()=>setView(false);
document.getElementById("vList").onclick=()=>setView(true);
document.querySelectorAll("#lens button").forEach(b => b.onclick = () => {
  S.lens=b.dataset.lens; document.querySelectorAll("#lens button").forEach(x=>x.setAttribute("aria-pressed",x===b)); update(false); });
const tConn=document.getElementById("tConn"), tMulti=document.getElementById("tMulti");
tConn.onclick=()=>{ S.conn=!S.conn; tConn.setAttribute("aria-pressed",S.conn); update(true); };
tMulti.onclick=()=>{ S.multi=!S.multi; tMulti.setAttribute("aria-pressed",S.multi); };
document.getElementById("bFit").onclick=()=>fit(500);
document.getElementById("bBack").onclick=()=>{ const id=S.history.pop(); if(id) navigate(id,false); };
document.getElementById("bReset").onclick=()=>{ S.expanded=new Set(["me"]); S.history=[]; S.query=""; document.getElementById("search").value=""; select("me",false); update(true); };
if(CONFIG.pdfUrl){ const a=document.getElementById("bPdf"); a.href=CONFIG.pdfUrl; a.hidden=false; a.setAttribute("download",""); }

const sInput=document.getElementById("search"), sRes=document.getElementById("results");
function runSearch(){
  const q=sInput.value.trim().toLowerCase(); S.query=q;
  if(q.length<2){ sRes.style.display="none"; S.query=""; update(false); return; }
  const toks=q.split(/\s+/), hits=CV.filter(n=>n.id!=="me" && toks.every(t=>n.search.includes(t)))
    .sort((a,b)=> (b.l.toLowerCase().includes(q)-a.l.toLowerCase().includes(q)) || a.depth-b.depth).slice(0,14);
  S.query = toks.length===1 ? q : "";
  sRes.innerHTML = hits.length ? hits.map(n=>`<button data-go="${n.id}">${esc(n.l)}<small>${esc(n.depth>1?N.get(n.hub).l:"Section")}</small></button>`).join("")
    : `<button disabled>No match found</button>`;
  sRes.style.display="block"; update(false);
}
sInput.addEventListener("input",runSearch);
sInput.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const b=sRes.querySelector("[data-go]"); if(b){ pick(b.dataset.go); } } if(e.key==="Escape"){ sRes.style.display="none"; } });
function pick(id){
  sRes.style.display="none";
  if(document.body.classList.contains("list")){
    const el=document.getElementById("L_"+id); if(!el) return;
    let p=el; while(p && p.id!=="listview"){ if(p.tagName==="DETAILS") p.open=true; p=p.parentElement; }
    el.scrollIntoView({block:"center"});
  } else navigate(id);
}
sRes.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) pick(b.dataset.go); });
document.addEventListener("click",e=>{ if(!e.target.closest(".searchwrap")) sRes.style.display="none"; });
window.addEventListener("resize",()=>{ if(!document.body.classList.contains("list")) fit(0); });
window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if(N.has(id) && id!==S.selected) navigate(id); });

/* ---------- start ---------- */
const startId = N.has(location.hash.slice(1)) ? location.hash.slice(1) : "me";
if(startId!=="me"){ ancestors(N.get(startId)).forEach(expand); S.selected=startId; }
if(window.innerWidth<520 && startId==="me"){ /* phones open on the network; the list is one tap away */ }
update(true);
</script>
