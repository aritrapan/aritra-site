  output-dir: _site
  resources:
    - robots.txt
    - CNAME
    - publications.bib
    - img/
    - taas/
    - "play/**"
    - cv-network.html

website:
  title: "Aritra Pan"
  site-url: https://aritra.ai
  description: "Aritra Pan — Associate Professor of Data Science, Madras School of Economics. Ethical AI and AI governance, applied NLP, generative AI in management education."
  favicon: img/favicon.png
  image: img/cards/home.jpg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  google-analytics: ""
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - text: Teaching
        menu:
          - href: teaching.qmd
            text: Courses
          - href: workshops.qmd
            text: Workshops and training
      - href: play.qmd
        text: Learn by Playing
      - href: blog.qmd
        text: Blog
      - href: opportunities.qmd
        text: Work with me
      - href: off-the-clock.qmd
        text: Off the Clock
    right:
      - icon: google
        href: https://scholar.google.co.in/citations?user=m9SYPDMAAAAJ
        aria-label: Google Scholar
      - icon: linkedin
        href: https://in.linkedin.com/in/aritrapan
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:aritra.pan@mse.ac.in
        aria-label: Email
  page-footer:
    left: "© 2022–2026 Aritra Pan"
    # left: '© 2022–2026 Aritra Pan <span id="visit-count"></span>'
    center: "[ORCID 0000-0001-5740-0804](https://orcid.org/0000-0001-5740-0804) · [Scopus 57214111533](https://www.scopus.com/authid/detail.uri?authorId=57214111533)"
    right: "Built with [Quarto](https://quarto.org)"
  page-navigation: false
  search:
    location: navbar
    type: overlay

format:
  html:
    theme:
      light: [flatly, styles.scss]
      dark: [darkly, dark.scss, styles.scss]
    toc: false
    include-in-header: schema.html
    include-after-body: counter.html
    link-external-newwindow: true
    smooth-scroll: true
    lang: en
