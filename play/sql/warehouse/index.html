       ROUND(SUM(f.net_amount), 2) AS revenue,
       ROUND(100.0 * SUM(f.net_amount)
             / SUM(SUM(f.net_amount)) OVER (), 2) AS share_pct
FROM fact_sales f
JOIN dim_product p ON p.product_key = f.product_key
WHERE f.order_status = 'Delivered'
GROUP BY p.category
ORDER BY revenue DESC;</div>The window is evaluated after GROUP BY, over the seven grouped rows. A scalar subquery <code>(SELECT SUM(net_amount) FROM fact_sales WHERE order_status = 'Delivered')</code> as the denominator works too.`},
{t:"sql",db:"saralstar",q:"Interview classic (Pareto and ABC). Rank products by Delivered revenue (ties broken by product_key). For each: product_name, cumulative share of revenue in % (including itself, rounded to 2 decimals), and abc_class: 'A' if the cumulative share is at most 80, 'B' if at most 95, else 'C' (classify on the unrounded share). Sort by revenue, highest first, then product_key.",
 answer:"WITH r AS (SELECT p.product_key, p.product_name, SUM(f.net_amount) AS revenue FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key WHERE f.order_status = 'Delivered' GROUP BY p.product_key, p.product_name), c AS (SELECT product_key, product_name, revenue, 100.0 * SUM(revenue) OVER (ORDER BY revenue DESC, product_key ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) / SUM(revenue) OVER () AS cum_pct FROM r) SELECT product_name, ROUND(cum_pct, 2) AS cum_pct, CASE WHEN cum_pct <= 80 THEN 'A' WHEN cum_pct <= 95 THEN 'B' ELSE 'C' END AS abc_class FROM c ORDER BY revenue DESC, product_key",ordered:true,rows:8,
 hint:"CTE 1: revenue per product. CTE 2: running SUM ordered by revenue DESC, product_key, divided by the total. Then CASE on the share.",why:`The Mixer Grinder alone is 12.32% of revenue; 19 of the 41 products are class A, 12 are B and 10 are C. That is flatter than the "80/20" rule of thumb, which is why you compute it instead of assuming it.<div class="formula">WITH r AS (SELECT p.product_key, p.product_name,
                  SUM(f.net_amount) AS revenue
           FROM fact_sales f
           JOIN dim_product p ON p.product_key = f.product_key
           WHERE f.order_status = 'Delivered'
           GROUP BY p.product_key, p.product_name),
     c AS (SELECT product_key, product_name, revenue,
                  100.0 * SUM(revenue) OVER (ORDER BY revenue DESC, product_key
                          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
                  / SUM(revenue) OVER () AS cum_pct
           FROM r)
SELECT product_name, ROUND(cum_pct, 2) AS cum_pct,
       CASE WHEN cum_pct &lt;= 80 THEN 'A'
            WHEN cum_pct &lt;= 95 THEN 'B' ELSE 'C' END AS abc_class
FROM c
ORDER BY revenue DESC, product_key;</div>The lab draws this curve. Class A products get the closest stock and price monitoring; class C are candidates for review.`},
{t:"sql",db:"saralstar",q:"Interview classic (YoY). Delivered revenue for July, August and September of 2025 and of 2026, side by side. Return month_num, rev_2025, rev_2026 (both rounded to 2 decimals) and yoy_pct = 100 × (rev_2026 − rev_2025) / rev_2025 rounded to 2 decimals, sorted by month_num.",
 answer:"SELECT d.month_num, ROUND(SUM(CASE WHEN d.year = 2025 THEN f.net_amount END), 2) AS rev_2025, ROUND(SUM(CASE WHEN d.year = 2026 THEN f.net_amount END), 2) AS rev_2026, ROUND(100.0 * (SUM(CASE WHEN d.year = 2026 THEN f.net_amount END) - SUM(CASE WHEN d.year = 2025 THEN f.net_amount END)) / SUM(CASE WHEN d.year = 2025 THEN f.net_amount END), 2) AS yoy_pct FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key WHERE f.order_status = 'Delivered' AND d.month_num IN (7, 8, 9) GROUP BY d.month_num ORDER BY d.month_num",ordered:true,
 hint:"Pivot the two years with SUM(CASE WHEN d.year = 2025 THEN f.net_amount END), grouped by month_num. Or: monthly totals, then LAG() OVER (PARTITION BY month_num ORDER BY year).",why:`Three rows; compare each month with the same month a year earlier.<div class="formula">SELECT d.month_num,
  ROUND(SUM(CASE WHEN d.year = 2025 THEN f.net_amount END), 2) AS rev_2025,
  ROUND(SUM(CASE WHEN d.year = 2026 THEN f.net_amount END), 2) AS rev_2026,
  ROUND(100.0 * (SUM(CASE WHEN d.year = 2026 THEN f.net_amount END)
               - SUM(CASE WHEN d.year = 2025 THEN f.net_amount END))
        / SUM(CASE WHEN d.year = 2025 THEN f.net_amount END), 2) AS yoy_pct
FROM fact_sales f
JOIN dim_date d ON d.date_key = f.date_key
WHERE f.order_status = 'Delivered' AND d.month_num IN (7, 8, 9)
GROUP BY d.month_num
ORDER BY d.month_num;</div>Comparing with the same month last year removes seasonality, which a month-over-month change does not.`},
{t:"sql",db:"saralstar",q:"Month-over-month. For every month with sales: year_month, Delivered revenue, the previous month's revenue (NULL for the first month) and mom_pct = 100 × (revenue − previous) / previous; all three money/percent values rounded to 2 decimals. Sort by year_month.",
 answer:"WITH m AS (SELECT d.year_month, SUM(f.net_amount) AS revenue FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key WHERE f.order_status = 'Delivered' GROUP BY d.year_month) SELECT year_month, ROUND(revenue, 2) AS revenue, ROUND(LAG(revenue) OVER (ORDER BY year_month), 2) AS prev_revenue, ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY year_month)) / LAG(revenue) OVER (ORDER BY year_month), 2) AS mom_pct FROM m ORDER BY year_month",ordered:true,rows:7,
 hint:"Monthly totals in a CTE, then LAG(revenue) OVER (ORDER BY year_month).",why:`15 rows from 2025-07 to 2026-09; the first has NULL previous revenue and NULL change.<div class="formula">WITH m AS (SELECT d.year_month, SUM(f.net_amount) AS revenue
           FROM fact_sales f
           JOIN dim_date d ON d.date_key = f.date_key
           WHERE f.order_status = 'Delivered'
           GROUP BY d.year_month)
SELECT year_month, ROUND(revenue, 2) AS revenue,
       ROUND(LAG(revenue) OVER (ORDER BY year_month), 2) AS prev_revenue,
       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY year_month))
             / LAG(revenue) OVER (ORDER BY year_month), 2) AS mom_pct
FROM m
ORDER BY year_month;</div>Compute the change from the unrounded values; rounding first can move the percentage by a hundredth.`},
{t:"mcq",q:"Which four perspectives does the balanced scorecard measure with KPIs?",opts:["Financial, business process, customer, learning and growth","Revenue, cost, margin, cash","Product, region, channel, date","Volume, variety, velocity, value"],a:0,
 hint:"It is \"balanced\" because finance is only one of the four.",why:"Kaplan and Norton's scorecard balances financial results (past performance) with three perspectives managers can influence now: business processes, customers, and learning and growth. Product, region, channel and date are dimensions; volume, variety and velocity describe big data (File 8)."}
]});

L.push({id:"l7",badge:"Clean Loader",code:"File 7",title:"From raw feed to clean fact",topics:"ETL vs ELT, staging, data profiling, standardising, de-duplicating, validating, INSERT … SELECT loads, surrogate key lookup, data quality",
story:`<b>The marketplace feed.</b> SaralMart now also sells through a partner marketplace, which sends a file of orders every night. Last night's file landed in <code>raw_orders_feed</code>: 244 rows, typed by hand on the partner's side. Arjun Nair from Finance has already found "Cochin" and "Kochi" as two cities in his spreadsheet. Your job is the warehouse's front door: nothing enters a fact table until it has been profiled, cleaned and checked.`,
brief:`<p><span class="term">ETL (extract, transform, load)</span> copies data out of the source systems, transforms it in a staging area, and loads it into the warehouse. <span class="term">ELT (extract, load, transform)</span> loads the raw data first and transforms it inside the warehouse with SQL, common when the warehouse has plenty of computing power (cloud warehouses, File 8). Either way, the transform steps are the same, and in this file you write them in SQL (Structured Query Language) on a <span class="term">staging table</span>.</p>
<div class="formula">1 profile      COUNT(*), COUNT(DISTINCT key), NULLs per column, MIN/MAX, odd formats
2 standardise  TRIM, UPPER/LOWER, mapping tables (ref_city_alias), date formats
3 de-duplicate keep one row per business key (MIN(feed_row) or ROW_NUMBER() = 1)
4 validate     reject rows that break rules: missing date, unknown product, qty ≤ 0
5 look up keys natural key → surrogate key (product_id → product_key)
6 load         INSERT INTO target (…) SELECT … FROM cleaned rows</div>
<p><span class="term">Data quality</span> means the data are accurate, complete, consistent across systems, valid (in the allowed format and range), unique, and timely. Most errors enter at input (Laudon &amp; Laudon, ch. 6). A <span class="term">data quality audit</span> is a systematic check of a data set against those properties; <span class="term">data cleansing</span> (also called data scrubbing) is the work of finding and fixing what the audit flags: wrong values, gaps, inconsistent formats and duplicates.</p>
<p>Profiling and validating dates needs care. SQLite stores dates as ISO text, and <code>date(x)</code> returns NULL for text it cannot read but quietly rolls an impossible day forward: <code>date('2026-09-31')</code> is '2026-10-01'. A safe validity test is <code>date(x) = x</code>. A DD/MM/YYYY value is rebuilt with substr before testing.</p>
<div class="formula">substr(d, 7, 4) || '-' || substr(d, 4, 2) || '-' || substr(d, 1, 2)   -- '13/08/2026' → '2026-08-13'</div>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite. In MySQL, parse a non-ISO date with STR_TO_DATE(d, '%d/%m/%Y'); an impossible date such as 2026-09-31 is rejected (NULL or an error, depending on the server's SQL mode) rather than rolled forward. Concatenate with CONCAT(a, b) in MySQL, where || means OR by default; CONCAT also works here. INSERT INTO t (…) SELECT … works in both.</span></div>`,
refs:"Laudon &amp; Laudon (2022), ch. 6 (assuring data quality, data quality audits, data cleansing) · Kimball &amp; Ross (2013), the chapters on ETL subsystems · SQLite documentation, \"Date And Time Functions\" (sqlite.org/lang_datefunc.html) and \"INSERT\" (sqlite.org/lang_insert.html) · MySQL 8.0 Reference Manual, \"INSERT ... SELECT Statement\".",
lab:root=>{whLabETL(root);whFeedPanel(root);},
qs:[
{t:"sql",db:"saralstar",q:"Profile the feed. Return one row: total_rows, distinct_refs (distinct order_ref), missing_dates (order_date NULL or blank), missing_city (city NULL), missing_amount (amount NULL).",
 answer:"SELECT COUNT(*) AS total_rows, COUNT(DISTINCT order_ref) AS distinct_refs, SUM(CASE WHEN order_date IS NULL OR TRIM(order_date) = '' THEN 1 ELSE 0 END) AS missing_dates, SUM(CASE WHEN city IS NULL THEN 1 ELSE 0 END) AS missing_city, COUNT(*) - COUNT(amount) AS missing_amount FROM raw_orders_feed",
 hint:"COUNT(column) skips NULLs, so COUNT(*) − COUNT(amount) counts the NULL amounts. A blank string is not NULL.",why:`244 rows but only 220 distinct order references: 24 rows are repeats.<div class="formula">SELECT COUNT(*) AS total_rows,
       COUNT(DISTINCT order_ref) AS distinct_refs,
       SUM(CASE WHEN order_date IS NULL OR TRIM(order_date) = ''
                THEN 1 ELSE 0 END) AS missing_dates,
       SUM(CASE WHEN city IS NULL THEN 1 ELSE 0 END) AS missing_city,
       COUNT(*) - COUNT(amount) AS missing_amount
FROM raw_orders_feed;</div>COUNT(*) − COUNT(order_date) would miss the blank strings: they are present, just empty.`},
{t:"sql",db:"saralstar",q:"Interview classic (find duplicates). List each <code>order_ref</code> that appears more than once, with the number of copies. Return order_ref and copies, sorted by order_ref.",
 answer:"SELECT order_ref, COUNT(*) AS copies FROM raw_orders_feed GROUP BY order_ref HAVING COUNT(*) > 1 ORDER BY order_ref",ordered:true,
 hint:"GROUP BY the business key, HAVING COUNT(*) &gt; 1.",why:`24 references, each sent twice.<div class="formula">SELECT order_ref, COUNT(*) AS copies
FROM raw_orders_feed
GROUP BY order_ref
HAVING COUNT(*) > 1
ORDER BY order_ref;</div>The feed_row differs, so SELECT DISTINCT * would not remove them; de-duplicate on the business key.`},
{t:"sql",db:"saralstar",q:"Standardise cities. Map each feed row's city through <code>ref_city_alias</code> on LOWER(TRIM(city)); rows with no match (including NULL) count as 'Unknown'. Return city_name and feed_rows, sorted by feed_rows (highest first), then city_name.",
 answer:"SELECT COALESCE(a.city_name, 'Unknown') AS city_name, COUNT(*) AS feed_rows FROM raw_orders_feed r LEFT JOIN ref_city_alias a ON a.alias = LOWER(TRIM(r.city)) GROUP BY COALESCE(a.city_name, 'Unknown') ORDER BY feed_rows DESC, city_name",ordered:true,
 hint:"LEFT JOIN keeps unmatched rows; COALESCE turns their NULL into 'Unknown'.",why:`The many spellings (PUNE, '  Pune ', Cochin, Vizag, Bhubaneshwar, …) collapse into 14 cities plus Unknown.<div class="formula">SELECT COALESCE(a.city_name, 'Unknown') AS city_name,
       COUNT(*) AS feed_rows
FROM raw_orders_feed r
LEFT JOIN ref_city_alias a ON a.alias = LOWER(TRIM(r.city))
GROUP BY COALESCE(a.city_name, 'Unknown')
ORDER BY feed_rows DESC, city_name;</div>A mapping table is better than a long CASE: when a new spelling appears, ETL adds one row instead of editing code.`},
{t:"sql",db:"saralstar",q:"Validate dates. Classify every row's order_date as 'missing' (NULL or blank), 'iso' (a valid YYYY-MM-DD date, i.e. date(order_date) = order_date), 'dmy' (DD/MM/YYYY that converts to a valid date) or 'invalid' (anything else). Return date_status and feed_rows.",
 answer:"SELECT CASE WHEN order_date IS NULL OR TRIM(order_date) = '' THEN 'missing' WHEN date(order_date) = order_date THEN 'iso' WHEN order_date LIKE '__/__/____' AND date(substr(order_date, 7, 4) || '-' || substr(order_date, 4, 2) || '-' || substr(order_date, 1, 2)) = substr(order_date, 7, 4) || '-' || substr(order_date, 4, 2) || '-' || substr(order_date, 1, 2) THEN 'dmy' ELSE 'invalid' END AS date_status, COUNT(*) AS feed_rows FROM raw_orders_feed GROUP BY date_status",
 hint:"CASE in order: missing first, then iso, then dmy (rebuild the ISO text with substr and test it the same way), else invalid.",why:`iso 163, dmy 49, missing 24, invalid 8 (2026-09-31, 2026-02-30, 2026-08-32).<div class="formula">SELECT CASE
  WHEN order_date IS NULL OR TRIM(order_date) = '' THEN 'missing'
  WHEN date(order_date) = order_date               THEN 'iso'
  WHEN order_date LIKE '__/__/____'
   AND date(substr(order_date,7,4) || '-' || substr(order_date,4,2) || '-' || substr(order_date,1,2))
     = substr(order_date,7,4) || '-' || substr(order_date,4,2) || '-' || substr(order_date,1,2)
                                                   THEN 'dmy'
  ELSE 'invalid' END AS date_status,
  COUNT(*) AS feed_rows
FROM raw_orders_feed
GROUP BY date_status;</div>Testing only <code>date(order_date) IS NOT NULL</code> would pass 2026-09-31 and 2026-02-30, which SQLite rolls into October and March.`},
{t:"sql",db:"saralstar",q:"Referential check. Standardise each product_code to a number (trim, upper-case, remove 'P' and '-', CAST to INTEGER). How many feed rows have a code that matches no <code>product_id</code> in dim_product? Return one number.",
 answer:"SELECT COUNT(*) AS orphan_rows FROM raw_orders_feed r WHERE NOT EXISTS (SELECT 1 FROM dim_product p WHERE p.product_id = CAST(REPLACE(REPLACE(UPPER(TRIM(r.product_code)), 'P', ''), '-', '') AS INTEGER))",
 hint:"CAST(REPLACE(REPLACE(UPPER(TRIM(product_code)), 'P', ''), '-', '') AS INTEGER), then NOT EXISTS against dim_product.",why:`A few rows carry the code P-999, which no product has.<div class="formula">SELECT COUNT(*) AS orphan_rows
FROM raw_orders_feed r
WHERE NOT EXISTS (
  SELECT 1 FROM dim_product p
  WHERE p.product_id = CAST(REPLACE(REPLACE(UPPER(TRIM(r.product_code)),
                                     'P', ''), '-', '') AS INTEGER));</div>Comparing the raw text with 'P-' || product_id would flag every '201', 'p201' and ' P-201 ' as an orphan too: standardise before you validate.<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite, which accepts CAST(x AS INTEGER). MySQL's CAST has no INTEGER target: write CAST(x AS SIGNED) (or UNSIGNED) there. TRIM, UPPER and REPLACE are the same in both.</span></div>`},
{t:"sql",db:"saralstar",setup:"CREATE TABLE clean_feed (order_ref TEXT PRIMARY KEY, order_date TEXT NOT NULL, city_name TEXT NOT NULL, product_key INTEGER NOT NULL, qty INTEGER NOT NULL, amount NUMERIC NOT NULL);",q:"The load. A table <code>clean_feed(order_ref, order_date, city_name, product_key, qty, amount)</code> exists (empty, order_ref is its primary key). Load it with INSERT … SELECT: one row per order_ref (the copy with the lowest feed_row); order_date as ISO text (ISO rows as they are, DD/MM/YYYY converted; reject missing or invalid); city_name standardised via ref_city_alias ('Unknown' if no match); product_key looked up from the standardised code (reject orphans); reject qty NULL or ≤ 0 and amount NULL.",
 answer:"INSERT INTO clean_feed (order_ref, order_date, city_name, product_key, qty, amount) WITH first_copy AS (SELECT * FROM raw_orders_feed r WHERE r.feed_row = (SELECT MIN(r2.feed_row) FROM raw_orders_feed r2 WHERE r2.order_ref = r.order_ref)), std AS (SELECT order_ref, CASE WHEN date(order_date) = order_date THEN order_date WHEN order_date LIKE '__/__/____' AND date(substr(order_date, 7, 4) || '-' || substr(order_date, 4, 2) || '-' || substr(order_date, 1, 2)) = substr(order_date, 7, 4) || '-' || substr(order_date, 4, 2) || '-' || substr(order_date, 1, 2) THEN substr(order_date, 7, 4) || '-' || substr(order_date, 4, 2) || '-' || substr(order_date, 1, 2) END AS order_date, COALESCE((SELECT a.city_name FROM ref_city_alias a WHERE a.alias = LOWER(TRIM(fc.city))), 'Unknown') AS city_name, CAST(REPLACE(REPLACE(UPPER(TRIM(product_code)), 'P', ''), '-', '') AS INTEGER) AS product_id, qty, amount FROM first_copy fc) SELECT s.order_ref, s.order_date, s.city_name, p.product_key, s.qty, s.amount FROM std s JOIN dim_product p ON p.product_id = s.product_id WHERE s.order_date IS NOT NULL AND s.qty > 0 AND s.amount IS NOT NULL",
 check:"SELECT * FROM clean_feed ORDER BY order_ref",rows:10,
 starter:"INSERT INTO clean_feed (order_ref, order_date, city_name, product_key, qty, amount)\nWITH first_copy AS (\n  SELECT * FROM raw_orders_feed r\n  WHERE r.feed_row = (SELECT MIN(r2.feed_row) FROM raw_orders_feed r2\n                      WHERE r2.order_ref = r.order_ref)\n)\nSELECT …",
 hint:"Build it in CTEs: first_copy (dedupe) → std (standardised date, city, product_id) → final SELECT that joins dim_product and filters. The INNER JOIN to dim_product rejects orphans by itself.",why:`171 of the 220 distinct orders load; the rest are rejected for a missing or invalid date, an unknown product, a bad quantity or a missing amount.<div class="formula">INSERT INTO clean_feed (order_ref, order_date, city_name, product_key, qty, amount)
WITH first_copy AS (
  SELECT * FROM raw_orders_feed r
  WHERE r.feed_row = (SELECT MIN(r2.feed_row) FROM raw_orders_feed r2
                      WHERE r2.order_ref = r.order_ref)),
std AS (
  SELECT order_ref,
    CASE WHEN date(order_date) = order_date THEN order_date
         WHEN order_date LIKE '__/__/____'
          AND date(substr(order_date,7,4)||'-'||substr(order_date,4,2)||'-'||substr(order_date,1,2))
            = substr(order_date,7,4)||'-'||substr(order_date,4,2)||'-'||substr(order_date,1,2)
         THEN substr(order_date,7,4)||'-'||substr(order_date,4,2)||'-'||substr(order_date,1,2)
    END AS order_date,
    COALESCE((SELECT a.city_name FROM ref_city_alias a
              WHERE a.alias = LOWER(TRIM(fc.city))), 'Unknown') AS city_name,
    CAST(REPLACE(REPLACE(UPPER(TRIM(product_code)),'P',''),'-','') AS INTEGER) AS product_id,
    qty, amount
  FROM first_copy fc)
SELECT s.order_ref, s.order_date, s.city_name, p.product_key, s.qty, s.amount
FROM std s
JOIN dim_product p ON p.product_id = s.product_id
WHERE s.order_date IS NOT NULL AND s.qty > 0 AND s.amount IS NOT NULL;</div>Skip the de-duplication and the primary key on order_ref stops the load with a UNIQUE constraint error: constraints are the last line of data quality defence. A NULL qty fails <code>qty &gt; 0</code> (the comparison is NULL, not true), so it is rejected without a separate test. In MySQL the same load needs CONCAT() instead of ||, STR_TO_DATE(order_date, '%d/%m/%Y') instead of the substr rebuild, and CAST(… AS SIGNED) instead of CAST(… AS INTEGER).`},
{t:"mcq",q:"How does ELT differ from ETL?",opts:["ELT loads the raw data into the warehouse first and transforms it there, usually with SQL","ELT skips the transform step entirely","ELT transforms the data inside the source system before extracting it","ELT is ETL run in reverse, from the warehouse back to the sources"],a:0,
 hint:"Same three letters, different order.",why:"In ELT the warehouse does the transforming after loading, which suits warehouses with plenty of processing power and keeps the raw copy available. The transforms (standardise, dedupe, validate) still happen."}
]});

L.push({id:"l8",badge:"Lake Ranger",code:"File 8",title:"Beyond the warehouse",topics:"Big data, data lakes, Hadoop (HDFS, MapReduce), Spark, cloud warehouses, NoSQL families, when SQL still fits, data governance",
story:`<b>The vendor visit.</b> Three vendors pitch the board on the same afternoon: one says "put everything in a data lake", one says "relational databases cannot scale, go NoSQL", one says "move the warehouse to the cloud". Mr Thomas asks you to sit in, then write one page on what each would and would not change for SaralMart, and who decides what data may be used at all.`,
brief:`<p><span class="term">Big data</span> is the name for data that outgrow an ordinary DBMS (database management system), in sheer size or in the mix of forms they take; the usual summary is volume, variety (clicks, logs, text, images, sensor readings) and velocity (the speed at which they arrive). Laudon &amp; Laudon (ch. 6) describe the tools that grew around it:</p>
<div class="formula">data lake         raw structured and unstructured data in native format, structure decided
                  when read ("schema on read"); a warehouse fixes it on load ("schema on write")
Hadoop            open-source framework: HDFS (Hadoop Distributed File System) spreads files over
                  many cheap servers; MapReduce splits a job into map tasks on every node and
                  reduce tasks that combine their outputs
Spark             open-source engine for distributed processing that keeps working data in memory
in-memory         the data sit in RAM (random-access memory) instead of on disk
analytic platform hardware and software tuned for analytical queries, often rented as a cloud service
cloud warehouse   a managed warehouse service; typically columnar storage, compute that scales
                  separately from storage, pay per use</div>
<p><span class="term">NoSQL</span> ("not only SQL") databases drop the fixed relational schema to scale across many machines or to fit data that are not tables. Four families:</p>
<div class="formula">key-value     a key → an opaque value           cart:4711 → {…}; session stores, caches
document      a key → a nested document         an order with its lines inside; catalogues
              (often JSON: JavaScript Object Notation)
wide-column   rows with many, sparse columns    sensor readings by device and time
graph         nodes and edges                   who referred whom; recommendations</div>
<p><b>When SQL still fits:</b> structured business records (orders, payments, ledgers, HR), questions that join several entities, multi-row transactions that must be ACID (atomic, consistent, isolated, durable: Module 7), and a warehouse for reporting. Many NoSQL and big-data systems now offer SQL interfaces, and Spark and cloud warehouses are queried with SQL. The relational model (Codd, 1970) remains the default for business records.</p>
<p><span class="term">Data governance</span> is the set of policies and procedures for managing data as a company resource: who may see, share or change what, who is responsible for its accuracy (data stewards), how it is secured, and where it may go. In SQL this becomes views that hide columns, permissions (Module 7), documented definitions of each KPI, and lineage: being able to say which source rows produced a number.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite, whose JSON functions are json_object(), json_array() and json_group_array() (with ORDER BY inside the aggregate from SQLite 3.44). MySQL 8.0 has JSON_OBJECT(), JSON_ARRAY() and JSON_ARRAYAGG(); the order of elements in JSON_ARRAYAGG is not guaranteed. MySQL also offers a JSON column type, so one relational database can hold documents too.</span></div>`,
refs:"Laudon &amp; Laudon (2022), ch. 6 (big data, Hadoop, in-memory computing, analytic platforms, data lakes, NoSQL and cloud databases, data governance) and ch. 12 · Codd, \"A Relational Model of Data for Large Shared Data Banks\", <i>Communications of the ACM</i> 13(6), 1970 · SQLite documentation, \"JSON Functions And Operators\" (sqlite.org/json1.html) · MySQL 8.0 Reference Manual, \"JSON Functions\".",
lab:root=>{whLabMapReduce(root);whLabShapes(root);},
qs:[
{t:"mcq",q:"What distinguishes a data lake from a data warehouse?",opts:["A lake keeps raw data in native format and imposes structure when the data are read; a warehouse cleans and structures data when they are loaded","A lake is a warehouse that uses NoSQL","A lake stores only summarised data","A lake cannot hold structured data"],a:0,
 hint:"Schema on read versus schema on write.",why:"The lake postpones the work: everything goes in as it arrives (structured or not), and each user decides how to read it. The warehouse does the work up front (ETL), so its users all see the same cleaned, conformed data."},
{t:"mcq",q:"SaralMart wants to store each shopper's cart, looked up only by a session id, millions of times a day. Which NoSQL family fits best?",opts:["Key-value","Graph","Wide-column","A star schema"],a:0,
 hint:"One key in, one value out, nothing else.",why:"A key-value store does exactly one thing fast: get and put a value by its key. Graph stores suit relationships (referrals, recommendations); wide-column stores suit sparse, very wide data such as sensor time series."},
{t:"sql",db:"saralstar",q:"Document model. Build ONE JSON document for order 5013 with keys in this order: order_id, status, lines; lines is an array of objects {product, qty} (product_name and qty), in product_key order. Return one value.",
 answer:"SELECT json_object('order_id', f.order_id, 'status', f.order_status, 'lines', json_group_array(json_object('product', p.product_name, 'qty', f.qty) ORDER BY f.product_key)) AS order_doc FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key WHERE f.order_id = 5013 GROUP BY f.order_id, f.order_status",
 hint:"json_object('order_id', …, 'status', …, 'lines', json_group_array(json_object('product', …, 'qty', …) ORDER BY f.product_key)), grouped by the order.",why:`One string holding the whole order, its three lines nested inside.<div class="formula">SELECT json_object(
         'order_id', f.order_id,
         'status',   f.order_status,
         'lines',    json_group_array(
                       json_object('product', p.product_name, 'qty', f.qty)
                       ORDER BY f.product_key)) AS order_doc
FROM fact_sales f
JOIN dim_product p ON p.product_key = f.product_key
WHERE f.order_id = 5013
GROUP BY f.order_id, f.order_status;</div>That is what a document database stores: the order and its lines together, read in one lookup, at the cost of repeating product names in every order.`},
{t:"sql",db:"saralstar",q:"The MapReduce job in the lab counts Delivered order lines per region (map: emit (region, 1) for each line; reduce: add them up). Write the same job as one SQL query on the full fact table. Return region (dim_customer.region) and lines.",
 answer:"SELECT c.region, COUNT(*) AS lines FROM fact_sales f JOIN dim_customer c ON c.customer_key = f.customer_key WHERE f.order_status = 'Delivered' GROUP BY c.region",
 hint:"Map = the rows with their region; shuffle = GROUP BY; reduce = COUNT(*).",why:`Seven regions; West has the most lines (1,772).<div class="formula">SELECT c.region, COUNT(*) AS lines
FROM fact_sales f
JOIN dim_customer c ON c.customer_key = f.customer_key
WHERE f.order_status = 'Delivered'
GROUP BY c.region;</div>GROUP BY is the same idea as map, shuffle and reduce. Distributed engines run it across many machines, and many of them accept SQL like this directly.`},
{t:"sql",db:"saralstar",q:"Governance. The data policy says analysts may see a customer's segment and region but only the initial of the name. Create a view <code>analyst_customers</code> with cust_id, masked_name (first letter of cust_name followed by '***'), segment, region, for current rows of real customers only (no guest row).",
 answer:"CREATE VIEW analyst_customers AS SELECT cust_id, substr(cust_name, 1, 1) || '***' AS masked_name, segment, region FROM dim_customer WHERE is_current = 1 AND cust_id IS NOT NULL",
 check:"SELECT * FROM analyst_customers ORDER BY cust_id",rows:5,
 hint:"CREATE VIEW … AS SELECT …; substr(cust_name, 1, 1) || '***'; WHERE is_current = 1 AND cust_id IS NOT NULL.",why:`600 rows, one per customer, with names masked like "A***".<div class="formula">CREATE VIEW analyst_customers AS
SELECT cust_id,
       substr(cust_name, 1, 1) || '***' AS masked_name,
       segment, region
FROM dim_customer
WHERE is_current = 1 AND cust_id IS NOT NULL;</div>In MySQL, write CONCAT(SUBSTR(cust_name, 1, 1), '***') and then GRANT SELECT on the view (not the table) to the analysts' role (Module 7); SQLite has no accounts, so the view is the whole lesson here.`},
{t:"mcq",q:"For which SaralMart need is a relational database with SQL still the clear choice?",opts:["Recording payments, where an order and its payment rows must be written together or not at all, and joined later for reports","Storing raw clickstream logs until someone decides what to do with them","Caching each shopper's session by id","Finding chains of customers who referred one another, many levels deep"],a:0,
 hint:"Which need asks for multi-row ACID transactions and joins?",why:"Payments are structured records that must stay consistent across tables (atomic transactions) and be joined for reporting: the relational sweet spot. Raw logs suit a lake, sessions a key-value store, and deep referral chains a graph database (though a recursive CTE can also walk them)."},
{t:"mcq",q:"In Hadoop, what do HDFS and MapReduce do?",opts:["HDFS stores files across the nodes of a cluster; MapReduce splits processing into map tasks on many nodes and reduce tasks that combine the results","HDFS is a NoSQL query language; MapReduce draws dashboards","HDFS compresses a warehouse into memory; MapReduce is the SQL optimiser","HDFS and MapReduce are two names for the same storage layer"],a:0,
 hint:"One stores, one computes.",why:"The Hadoop Distributed File System spreads large files over many inexpensive servers; MapReduce breaks a big job into pieces that run where the data sit, then combines them. Spark later kept intermediate data in memory to make such jobs faster."}
]});

/* ---------- the board meeting ---------- */
const BOARD=[
{t:"mcq",q:"fact_inventory_monthly records closing_units per product per month-end. Which sum is meaningful?",opts:["Closing units across all products for one month-end","Closing units for one product across all fifteen month-ends","Closing units across all products and all months","None: stock can never be summed"],a:0,why:"Stock is semi-additive: it adds across products at one point in time, but not across time, where the same units would be counted at every month-end."},
{t:"mcq",q:"A customer moves from Jaipur to Kochi. Under SCD type 2, what happens in dim_customer?",opts:["The old row is closed (valid_to set, is_current = 0) and a new row with a new surrogate key is added","The city in the existing row is overwritten","A column previous_city is added","The customer's past fact rows are re-pointed to the new row"],a:0,why:"Type 2 keeps history by versioning the row. Past facts keep the old key, so they stay in Jaipur's region (as-was)."},
{t:"num",q:"In SQLite, what does SELECT 100 * 7 / 120 return?",a:5,tol:0.001,why:"Both operands are integers, so SQLite truncates: 700 / 120 = 5. MySQL returns 5.8333. Write 100.0 * 7 / 120 for 5.83 in both."},
{t:"mcq",q:"SQLite has no WITH ROLLUP. How do you add yearly subtotals to a year-and-quarter report here?",opts:["UNION ALL a second query grouped by year only, with NULL in the quarter column","Add HAVING year IS NOT NULL","Use GROUP BY year, quarter, NULL","Use DISTINCT on the year column"],a:0,why:"Each subtotal level is its own GROUP BY; UNION ALL stacks them. That is also how MySQL makes cube-style totals, since it has ROLLUP but not CUBE."},
{t:"mcq",q:"Which query gives the average order value when the fact grain is one order line?",opts:["SUM(net_amount) / COUNT(DISTINCT order_id)","AVG(net_amount)","SUM(net_amount) / COUNT(*)","AVG(DISTINCT net_amount)"],a:0,why:"AVG(net_amount) and SUM/COUNT(*) both average lines. Orders are counted with COUNT(DISTINCT order_id)."},
{t:"mcq",q:"Why does a star schema keep region inside dim_customer instead of in a separate region table?",opts:["Fewer joins for every report; the dimension is small and loaded by ETL, so the redundancy causes few update problems","Because SQL cannot join more than two tables","To save disk space","Because regions never change"],a:0,why:"Denormalised dimensions trade a little redundancy for simpler, faster queries. The snowflake keeps region separate and needs two extra joins."},
{t:"mcq",q:"An ETL rule keeps only feed rows where date(order_date) IS NOT NULL. Which bad value still gets through in SQLite?",opts:["'2026-09-31', which SQLite rolls forward to 2026-10-01","NULL","An empty string","'13/08/2026'"],a:0,why:"date() returns NULL for text it cannot parse, but normalises an impossible day. Test date(x) = x instead."},
{t:"mcq",q:"Which NoSQL family is built for questions like \"customers within three referral steps of customer 4711\"?",opts:["Graph","Key-value","Document","Wide-column"],a:0,why:"Graph databases store relationships as edges and traverse them directly. In SQL, the same walk is a recursive CTE (Module 4)."}
];

async function whQ(sql){const r=await SQLX.exec(WH_DB,sql);const s=r.results.filter(x=>x.columns.length);return s.length?s[s.length-1]:{columns:[],values:[]};}

/* a step player: Play / Pause, Step, Speed, Reset; render(i, t) draws step i at progress t (0..1) */
function whPlayer(root,o){
  const wrap=el("div",{class:"flow"});root.appendChild(wrap);
  const bar=el("div",{class:"flowbar"});wrap.appendChild(bar);
  bar.appendChild(SB.text("span",o.title,"eyebrow"));
  const ctr=el("div",{class:"ctrls"});bar.appendChild(ctr);
  const play=whBtn(ctr,"Play"),step=whBtn(ctr,"Step ▸",true);
  let speed=1;speedSeg(ctr,v=>{speed=v;},[1,2,4]);
  const rst=whBtn(ctr,"Reset",true);
  const stage=el("div",{class:"svgbox"});wrap.appendChild(stage);
  const cap=el("p",{class:"note","aria-live":"polite"});wrap.appendChild(cap);
  const n=o.steps;let i=0,t=1,playing=false,run=null,last=0,hold=0;const HOLD=o.hold||1100,DUR=o.dur||1100;
  function show(){o.render(i,REDUCED?1:t,stage);cap.textContent=`Step ${i+1} of ${n}. `+o.caption(i);if(i===n-1&&t>=1&&o.onEnd)o.onEnd();if(o.onStep)o.onStep(i);}
  function label(){play.textContent=playing?"Pause":(i>=n-1&&t>=1?"Replay":"Play");}
  function stop(){if(run){run.stop();run=null;}}
  function start(){if(!run){last=performance.now();run=loop(tick);}}
  function tick(){const now=performance.now(),dt=Math.min(80,now-last);last=now;
    if(t<1){t=REDUCED?1:Math.min(1,t+dt*speed/DUR);show();}
    else if(playing){hold+=dt*speed;if(hold>=HOLD){hold=0;if(i<n-1){i++;t=REDUCED?1:0;show();}else{playing=false;label();}}}
    else stop();}
  play.addEventListener("click",()=>{if(playing){playing=false;label();return;}if(i>=n-1&&t>=1){i=0;t=1;show();}playing=true;hold=HOLD;label();start();});
  step.addEventListener("click",()=>{playing=false;if(t<1){t=1;show();}else if(i<n-1){i++;t=REDUCED?1:0;show();start();}label();});
  rst.addEventListener("click",()=>{playing=false;stop();i=0;t=1;show();label();});
  show();label();
  if(o.autoplay&&!REDUCED)play.click();
  return {stage,reset(){rst.click();},cap};
}

/* a tiny keyframe scene on an SVG: frames are objects {id: props}; numbers tween, the rest switch half-way.
   props: k ("box" | "text" | "line" | "dot"), x, y, w, h, x2, y2, r, op, rx, fill, stroke, sw, dash, text, size, anchor, weight, tc */
function whScene(svg){
  const items=new Map();const NUM=["x","y","w","h","x2","y2","op","r"];
  function get(id,p){let it=items.get(id);if(it)return it;const k=p.k||"box";let node,rect=null,txt=null;
    if(k==="line")node=sv("line",{});else if(k==="dot")node=sv("circle",{});else if(k==="text"){node=sv("text",{});txt=node;}
    else{node=sv("g",{});rect=sv("rect",{});txt=sv("text",{});node.append(rect,txt);}
    svg.appendChild(node);it={k,node,rect,txt};items.set(id,it);return it;}
  function setT(n,P,defAnchor){const s=P.text==null?"":String(P.text);if(n.textContent!==s)n.textContent=s;n.setAttribute("font-size",P.size||11);n.setAttribute("text-anchor",P.anchor||defAnchor);n.setAttribute("font-weight",P.weight||400);n.style.fill=P.tc||(P.k==="text"&&P.fill)||"var(--ink)";}
  function apply(it,P){const n=it.node;n.style.display="";n.setAttribute("opacity",String(Math.max(0,Math.min(1,P.op==null?1:P.op))));
    if(it.k==="line"){n.setAttribute("x1",P.x);n.setAttribute("y1",P.y);n.setAttribute("x2",P.x2);n.setAttribute("y2",P.y2);n.style.stroke=P.stroke||"var(--line)";n.style.strokeWidth=P.sw||1.5;if(P.dash)n.setAttribute("stroke-dasharray",P.dash);else n.removeAttribute("stroke-dasharray");}
    else if(it.k==="dot"){n.setAttribute("cx",P.x);n.setAttribute("cy",P.y);n.setAttribute("r",P.r||3);n.style.fill=P.fill||"var(--muted)";}
    else if(it.k==="text"){setT(n,P,"start");n.setAttribute("x",P.x);n.setAttribute("y",P.y);}
    else{const r=it.rect;r.setAttribute("x",P.x);r.setAttribute("y",P.y);r.setAttribute("width",Math.max(0,P.w||0));r.setAttribute("height",Math.max(0,P.h||0));r.setAttribute("rx",P.rx==null?4:P.rx);r.style.fill=P.fill||"var(--surface)";r.style.stroke=P.stroke||"none";r.style.strokeWidth=P.sw||1;
      const a=P.anchor||"middle";setT(it.txt,P,"middle");it.txt.setAttribute("x",a==="middle"?P.x+(P.w||0)/2:a==="end"?P.x+(P.w||0)-5:P.x+5);it.txt.setAttribute("y",P.y+(P.h||0)/2+(P.size||11)*0.36);}}
  return function draw(prev,cur,t){const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const seen=new Set();
    for(const id in cur){seen.add(id);const b=cur[id],a=prev&&prev[id];const A=a||Object.assign({},b,{op:0});const P=Object.assign({},(t<.5&&a)?a:b);
      NUM.forEach(k=>{let va=A[k],vb=b[k];if(k==="op"){if(va==null)va=1;if(vb==null)vb=1;}if(va==null)va=vb;if(vb==null)vb=va;if(va!=null)P[k]=va+(vb-va)*e;});
      apply(get(id,b),P);}
    if(prev)for(const id in prev){if(seen.has(id))continue;seen.add(id);const a=prev[id];const P=Object.assign({},a);P.op=(a.op==null?1:a.op)*(1-e);apply(get(id,a),P);}
    items.forEach((it,id)=>{if(!seen.has(id))it.node.style.display="none";});};
}
function whFramesPlayer(root,o){ // o: {title, W, H, label, frames:[{...}], captions:[...], onEnd, autoplay, onStep}
  let draw=null;
  const p=whPlayer(root,{title:o.title,steps:o.frames.length,autoplay:o.autoplay,onEnd:o.onEnd,onStep:o.onStep,dur:o.dur,hold:o.hold,caption:i=>o.captions[i],
    render:(i,t,stage)=>{if(!draw){const s=whSvg(stage,o.W,o.H,o.label);draw=whScene(s);}draw(i>0?o.frames[i-1]:null,o.frames[i],i===0?1:t);}});
  return p;
}

/* ---------- File 1: two workloads on the same rows ---------- */
function whLabWorkloads(root){
  root.appendChild(SB.text("p","The same 9,366 order lines, one square each. Four everyday order-system (OLTP) statements touch a few rows each; one report (OLAP) has to read them all.","note"));
  const box=el("div");root.appendChild(box);
  Promise.all([whQ("SELECT group_concat(code, '') FROM (SELECT channel_key || CASE WHEN order_status = 'Delivered' THEN 'd' ELSE 'x' END AS code FROM fact_sales ORDER BY sales_key)"),
    whQ("SELECT order_id, group_concat(sales_key) FROM fact_sales WHERE order_id IN (5432, 6100, 7777) GROUP BY order_id ORDER BY order_id"),
    whQ("SELECT ch.channel_key, ch.channel_name, SUM(f.net_amount) FROM fact_sales f JOIN dim_channel ch ON ch.channel_key = f.channel_key WHERE f.order_status = 'Delivered' GROUP BY ch.channel_key, ch.channel_name ORDER BY ch.channel_key")])
  .then(([codes,ords,rev])=>{
    const str=String((codes.values[0]||[""])[0]||"");const N=Math.floor(str.length/2);const ch=new Uint8Array(N),dl=new Uint8Array(N);
    for(let k=0;k<N;k++){ch[k]=+str[2*k]||0;dl[k]=str[2*k+1]==="d"?1:0;}
    const keys={};ords.values.forEach(v=>{keys[v[0]]=String(v[1]||"").split(",").map(x=>(+x)-1).filter(x=>x>=0&&x<N);});
    const tx=[{sql:"INSERT INTO order_items … (a new order, 2 lines)",rows:[N-2,N-1]},{sql:"UPDATE orders SET status = 'Delivered' WHERE order_id = 5432",rows:keys[5432]||[]},
      {sql:"SELECT status FROM orders WHERE order_id = 6100",rows:keys[6100]||[]},{sql:"UPDATE payments SET … WHERE order_id = 7777",rows:keys[7777]||[]}];
    const chans=rev.values.map(v=>({k:+v[0],name:String(v[1]),rev:+v[2]||0}));const mxr=Math.max(1,...chans.map(c=>c.rev));
    const W=720,H=300;let g=null,cv=null;const COLS=118,CW=3;
    const ccol=k=>k===1?"--accent":k===2?"--gold":"--ok";
    function draw(i,t,stage){if(!g){cv=el("canvas",{"aria-label":"Grid of 9,366 order lines; a few light up for each transaction, then a scan sweeps all of them"});stage.appendChild(cv);g=canvasSetup(cv,W,H);}
      const C={ink:cssVar("--ink"),muted:cssVar("--muted"),line:cssVar("--line"),sunk:cssVar("--sunk"),acc:cssVar("--accent"),gold:cssVar("--gold"),ok:cssVar("--ok"),fraud:cssVar("--fraud")};
      g.clearRect(0,0,W,H);g.fillStyle=C.sunk;g.fillRect(0,0,W,H);
      const scan=i>=5?(i===5?t:1)*N:0;
      for(let k=0;k<N;k++){const x=20+(k%COLS)*CW,y=40+Math.floor(k/COLS)*CW;
        if(k<scan)g.fillStyle=dl[k]?cssVar(ccol(ch[k])):C.muted;else g.fillStyle=C.line;g.fillRect(x,y,CW-0.6,CW-0.6);}
      let touched=0;
      for(let s=1;s<=Math.min(i,4);s++){const cur=(s===i&&i<=4);tx[s-1].rows.forEach(k=>{const x=20+(k%COLS)*CW,y=40+Math.floor(k/COLS)*CW;g.fillStyle=cur?C.fraud:C.gold;const rr=cur?3+4*(1-Math.abs(1-2*t)):3;g.beginPath();g.arc(x+1.2,y+1.2,rr,0,Math.PI*2);g.fill();});touched+=tx[s-1].rows.length;}
      if(i===5&&t<1){const k=Math.min(N-1,Math.floor(scan));const y=40+Math.floor(k/COLS)*CW;g.fillStyle=C.acc;g.fillRect(16,y-1,COLS*CW+8,2);}
      g.font="600 12px IBM Plex Mono, monospace";g.fillStyle=C.ink;g.fillText("fact_sales: "+ind(N)+" order lines",20,28);
      g.font="11px IBM Plex Mono, monospace";
      g.fillStyle=C.ink;g.fillText("Order system (OLTP)",400,28);
      for(let s=1;s<=Math.min(i,4);s++){g.fillStyle=s===i?C.fraud:C.muted;const line=tx[s-1].sql;g.textAlign="left";g.fillText(line.length>36?line.slice(0,35)+"…":line,400,28+s*17);g.textAlign="right";g.fillText(tx[s-1].rows.length+" row"+(tx[s-1].rows.length===1?"":"s"),712,28+s*17);g.textAlign="left";}
      g.fillStyle=C.ink;g.fillText("Rows touched by OLTP: "+touched,400,118);
      g.fillText("Rows read by the report (OLAP): "+ind(Math.floor(scan)),400,136);
      if(i>=5){g.fillStyle=C.ink;g.font="600 11px IBM Plex Mono, monospace";g.fillText("Revenue by channel (Delivered)",400,166);g.font="11px IBM Plex Mono, monospace";
        const f=i===5?t:1;chans.forEach((c,j)=>{const y=180+j*30,w=150*c.rev/mxr*f;g.fillStyle=cssVar(ccol(c.k));g.fillRect(470,y,w,18);g.fillStyle=C.ink;g.fillText(c.name,400,y+13);if(i===6)g.fillText(whK(c.rev),476+w,y+13);});}
      [[C.acc,"App"],[C.gold,"Web"],[C.ok,"Phone"],[C.muted,"not delivered"]].forEach(([c,l],j)=>{const x=20+[0,50,100,166][j];g.fillStyle=c;g.fillRect(x,H-14,8,8);g.fillStyle=C.muted;g.fillText(l,x+12,H-6);});
    }
    whPlayer(box,{title:"OLTP and OLAP on the same rows",steps:7,dur:1400,render:draw,caption:i=>[
      "fact_sales drawn as 9,366 squares, oldest order line top-left. The order system holds the same lines in its own tables.",
      "OLTP: a new order arrives; INSERT writes its 2 lines.",
      `OLTP: order 5432 is delivered; UPDATE changes its ${tx[1].rows.length} line(s).`,
      `OLTP: a customer checks order 6100; SELECT reads its ${tx[2].rows.length} line(s) through the primary key.`,
      `OLTP: a payment for order 7777 is recorded. Four statements, ${tx.reduce((s,x)=>s+x.rows.length,0)} rows in total.`,
      "OLAP: \"revenue by channel\". With no filter that an index could use, the query reads every one of the 9,366 lines.",
      "Three numbers from 9,366 rows. Run that during the sale on the order system and checkout waits; run it on the warehouse and nobody notices."][i]});
  }).catch(e=>whErr(box,e));
}

/* ---------- OLAP builder sandbox (File 5) ---------- */
const WH_OLAP={
  rows:{region:["Region","c.region","c"],department:["Department","p.department","p"],category:["Category","p.category","p"],channel:["Channel","ch.channel_name","ch"],quarter:["Quarter","d.year_quarter","d"],month:["Month","d.year_month","d"],weekday:["Day of week","d.day_name","d"]},
  cols:{none:["(no pivot)"],channel:["Channel","ch.channel_name","ch",["App","Web","Phone"]],quarter:["Quarter","d.year_quarter","d",WH_Q],department:["Department","p.department","p",WH_DEP],channel_type:["Channel type","ch.channel_type","ch",["Self-service","Assisted"]]},
  meas:{revenue:["Revenue (SUM net_amount)","SUM(f.net_amount)","f.net_amount"],units:["Units (SUM qty)","SUM(f.qty)","f.qty"],lines:["Order lines (COUNT)","COUNT(*)","1"],orders:["Orders (COUNT DISTINCT)","COUNT(DISTINCT f.order_id)",null],margin:["Margin % (from sums)","100.0 * (SUM(f.net_amount) - SUM(f.cost_amount)) / SUM(f.net_amount)",null]},
  JOIN:{c:"JOIN dim_customer c ON c.customer_key = f.customer_key",p:"JOIN dim_product p ON p.product_key = f.product_key",ch:"JOIN dim_channel ch ON ch.channel_key = f.channel_key",d:"JOIN dim_date d ON d.date_key = f.date_key"}
};
function whOlapSql(rk,ck,mk,slice,sub){const O=WH_OLAP,R=O.rows[rk],Cc=O.cols[ck],M=O.meas[mk];const need=new Set([R[2]]);if(ck!=="none")need.add(Cc[2]);if(slice!=="all")need.add("d");
  const joins=["c","p","ch","d"].filter(k=>need.has(k)).map(k=>O.JOIN[k]).join("\n");
  const where="WHERE f.order_status = 'Delivered'"+(slice!=="all"?"\n  AND d.year_quarter = '"+WH_Q[+slice]+"'":"");
  let note="";
  if(ck!=="none"){let expr=M[2];if(!expr){expr="f.net_amount";note="-- pivoting needs an additive measure; showing revenue\n";}
    const cols=Cc[3].map(v=>`  ROUND(SUM(CASE WHEN ${Cc[1]} = '${v}' THEN ${expr} ELSE 0 END), 2) AS "${v}"`).join(",\n");
    return note+`SELECT ${R[1]} AS "${R[0]}",\n${cols}\nFROM fact_sales f\n${joins}\n${where}\nGROUP BY ${R[1]}\nORDER BY ${R[1]};`;}
  const base=`FROM fact_sales f\n${joins}\n${where}`;
  if(!sub)return `SELECT ${R[1]} AS "${R[0]}", ROUND(${M[1]}, 2) AS value\n${base}\nGROUP BY ${R[1]}\nORDER BY ${R[1]};`;
  return `SELECT label, value FROM (\n  SELECT 0 AS lvl, ${R[1]} AS label, ROUND(${M[1]}, 2) AS value\n  ${base.replace(/\n/g,"\n  ")}\n  GROUP BY ${R[1]}\n  UNION ALL\n  SELECT 1, 'Total', ROUND(${M[1]}, 2)\n  ${base.replace(/\n/g,"\n  ")}\n)\nORDER BY lvl, label;`;}

  SB.panel(root,"OLAP query builder",{

      const mk=(label,opts,def)=>{const lab=el("label");lab.appendChild(SB.text("span",label));const s=el("select");Object.entries(opts).forEach(([k,v])=>{const o=el("option",{value:k});o.textContent=v;s.appendChild(o);});s.value=def;lab.appendChild(s);row.appendChild(lab);return s;};
      const rs=mk("Rows (drill level)",Object.fromEntries(Object.entries(WH_OLAP.rows).map(([k,v])=>[k,v[0]])),"department");
      const cs=mk("Columns (pivot)",Object.fromEntries(Object.entries(WH_OLAP.cols).map(([k,v])=>[k,v[0]])),"none");
      const ms=mk("Measure",Object.fromEntries(Object.entries(WH_OLAP.meas).map(([k,v])=>[k,v[0]])),"revenue");
      const ss=mk("Slice (quarter)",Object.assign({all:"all quarters"},Object.fromEntries(WH_Q.map((q,i)=>[String(i),q]))),"all");
      const lab=el("label");const cb=el("input",{type:"checkbox"});lab.appendChild(cb);lab.appendChild(SB.text("span"," add a total row (UNION ALL)"));row.appendChild(lab);
      const brow=el("div",{class:"btnrow"});p.appendChild(brow);const go=whBtn(brow,"Build and run");
      p.appendChild(SB.text("p","The builder writes ordinary SQL into the console below; edit it and run it again as you like. Each choice is one OLAP move: rows = drill level, columns = pivot, quarter = slice.","note"));
      const host=el("div");p.appendChild(host);const con=SQLX.console(host,{db:WH_DB,starter:"",rows:9});
      const build=()=>{con.set(whOlapSql(rs.value,cs.value,ms.value,ss.value,cb.checked));con.run();};
      go.addEventListener("click",build);[rs,cs,ms,ss,cb].forEach(x=>x.addEventListener("change",build));build();},
    generate:p=>whGenStarPane(p),
    own:p=>{p.appendChild(SB.text("p","Load your own table (for example a sales export with a few category columns and an amount) and try the same moves on it: GROUP BY for drill levels, WHERE for slices, SUM(CASE WHEN …) for a pivot, UNION ALL for totals.","note"));SQLX.yourData(p);}
  },"Build roll-ups, slices and pivots on the real warehouse, on a star you generate, or on your own table.");
}

function whNumIn(parent,label,val,lo,hi){const lab=el("label");lab.appendChild(SB.text("span",label));const i=el("input",{type:"number",min:String(lo),max:String(hi),step:"1",value:String(val)});lab.appendChild(i);parent.appendChild(lab);return ()=>{let v=parseInt(i.value,10);if(!Number.isFinite(v))v=val;v=Math.max(lo,Math.min(hi,v));i.value=String(v);return v;};}
function whIso(daysFrom2026){const d=new Date(Date.UTC(2026,0,1)+daysFrom2026*86400000);return d.toISOString().slice(0,10);}
function whGenStarSql(o){const r=rng(o.seed);const CAT=["Grocery","Kitchen","Home","Toys"],REG=["North","South","East","West"],DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const out=["CREATE TABLE dim_product (product_key INTEGER PRIMARY KEY, product_name TEXT NOT NULL, category TEXT NOT NULL, list_price NUMERIC NOT NULL);",
    "CREATE TABLE dim_customer (customer_key INTEGER PRIMARY KEY, cust_name TEXT NOT NULL, region TEXT NOT NULL);",
    "CREATE TABLE dim_date (date_key INTEGER PRIMARY KEY, full_date TEXT NOT NULL, year_month TEXT NOT NULL, day_name TEXT NOT NULL);",
    "CREATE TABLE fact_sales (sales_key INTEGER PRIMARY KEY, date_key INTEGER NOT NULL REFERENCES dim_date(date_key), product_key INTEGER NOT NULL REFERENCES dim_product(product_key), customer_key INTEGER NOT NULL REFERENCES dim_customer(customer_key), qty INTEGER NOT NULL, net_amount NUMERIC NOT NULL);"];
  const price=[0];for(let p=1;p<=o.prods;p++){const pr=50+Math.round(r()*1950);price.push(pr);out.push(`INSERT INTO dim_product VALUES (${p}, 'Product ${p}', '${CAT[Math.floor(r()*4)]}', ${pr});`);}
  out.push("INSERT INTO dim_customer VALUES (0, 'Guest checkout', 'Unknown');");
  for(let c=1;c<=o.custs;c++)out.push(`INSERT INTO dim_customer VALUES (${c}, 'Customer ${c}', '${REG[Math.floor(r()*4)]}');`);
  const keys=[];for(let k=0;k<o.days;k++){const iso=whIso(k),key=+iso.replace(/-/g,"");keys.push(key);out.push(`INSERT INTO dim_date VALUES (${key}, '${iso}', '${iso.slice(0,7)}', '${DN[new Date(iso+"T00:00:00Z").getUTCDay()]}');`);}
  for(let s=1;s<=o.lines;s++){const p=1+Math.floor(r()*o.prods),c=r()*100<o.guest?0:1+Math.floor(r()*o.custs),q=1+Math.floor(r()*r()*4),disc=[0,0,0,0.05,0.1][Math.floor(r()*5)];
    out.push(`INSERT INTO fact_sales VALUES (${s}, ${keys[Math.floor(r()*keys.length)]}, ${p}, ${c}, ${q}, ${(q*price[p]*(1-disc)).toFixed(2)});`);}
  return out.join("\n");}

function whGenFeedSql(o){const r=rng(o.seed);const CITY=["Pune","Kochi","Lucknow","Jaipur","Indore","Surat"],ALIAS={Kochi:"Cochin",Pune:"Poona"};
  const out=["CREATE TABLE raw_feed (feed_row INTEGER PRIMARY KEY, order_ref TEXT, order_date TEXT, city TEXT, qty INTEGER, amount NUMERIC);","CREATE TABLE ref_city_alias (alias TEXT PRIMARY KEY, city_name TEXT NOT NULL);"];
  CITY.forEach(c=>out.push(`INSERT INTO ref_city_alias VALUES ('${c.toLowerCase()}', '${c}');`));Object.entries(ALIAS).forEach(([c,a])=>out.push(`INSERT INTO ref_city_alias VALUES ('${a.toLowerCase()}', '${c}');`));
  let fr=1;for(let i=0;i<o.rows;i++){const ref="R-"+(1001+i);const day=1+Math.floor(r()*28),mon=1+Math.floor(r()*12);const mm=String(mon).padStart(2,"0"),dd=String(day).padStart(2,"0");
    let date=r()*100<o.missing?"NULL":(r()<0.2?`'${dd}/${mm}/2026'`:`'2026-${mm}-${dd}'`);
    let city=CITY[Math.floor(r()*CITY.length)];if(r()*100<o.messy){const k=Math.floor(r()*4);city=k===0?city.toUpperCase():k===1?city.toLowerCase():k===2?"  "+city+" ":(ALIAS[city]||city.toUpperCase());}
    let qty=1+Math.floor(r()*4);if(r()*100<o.badqty)qty=[0,-1][Math.floor(r()*2)];const amt=(Math.max(qty,0)*(100+Math.floor(r()*900))).toFixed(2);
    const line=`, '${ref}', ${date}, '${city}', ${qty}, ${amt});`;out.push(`INSERT INTO raw_feed VALUES (${fr++}`+line);if(r()*100<o.dup)out.push(`INSERT INTO raw_feed VALUES (${fr++}`+line);}
  return out.join("\n");}

  (async()=>{
    const k=(await whQ(KPI)).values[0]||[];const rev=+k[0]||0,ord=+k[1]||0;
    [["Revenue (Delivered)",whK(rev)],["Delivered orders",ind(ord)],["AOV (average order value)","₹"+ind((rev/Math.max(1,ord)).toFixed(2))],["Return rate (orders)",(+k[2]||0).toFixed(2)+"%"],["Gross margin",(+k[3]||0).toFixed(2)+"%"],["YoY, Jul–Sep",(+k[4]||0).toFixed(2)+"%"]].forEach(([l,v])=>{const d=el("div");d.appendChild(SB.text("span",l));d.appendChild(SB.text("b",v));tiles.appendChild(d);});

    const cls=c=>c<=80?"A":c<=95?"B":"C";const nA=P.filter(x=>cls(x.cum)==="A").length,nB=P.filter(x=>cls(x.cum)==="B").length;
    let s=null,bars=[],line=null,dots=[],g80=null,g95=null,ann=null,l80=null,l95=null;
    function init(stage){s=whSvg(stage,W,H,"Pareto chart: product revenue bars in descending order with the cumulative share line and the 80% and 95% cut-offs");
      s.appendChild(sv("line",{x1:x0,y1:y1,x2:x1,y2:y1,style:"stroke:var(--ink)"}));s.appendChild(sv("line",{x1:x0,y1:y0,x2:x0,y2:y1,style:"stroke:var(--ink)"}));s.appendChild(sv("line",{x1:x1,y1:y0,x2:x1,y2:y1,style:"stroke:var(--ink)"}));
      [0,0.5,1].forEach(f=>{const t=sv("text",{x:x0-4,y:y1-f*(y1-y0)+4,"font-size":10,"text-anchor":"end"});t.textContent=whK(mx*f);s.appendChild(t);const u=sv("text",{x:x1+3,y:y1-f*(y1-y0)+4,"font-size":10});u.textContent=Math.round(100*f)+"%";s.appendChild(u);});
      const xl=sv("text",{x:(x0+x1)/2,y:H-24,"font-size":10,"text-anchor":"middle"});xl.textContent="41 products, highest Delivered revenue first";s.appendChild(xl);
      P.forEach((p,i)=>{const r=sv("rect",{x:x0+i*bw+1,width:Math.max(1,bw-2),y:y1,height:0,style:"fill:var(--line)"});const tt=sv("title");tt.textContent=p.name+": "+whK(p.rev)+", cumulative "+p.cum.toFixed(1)+"%";r.appendChild(tt);s.appendChild(r);bars.push(r);});
      g80=sv("line",{x1:x0,x2:x1,y1:y1-0.8*(y1-y0),y2:y1-0.8*(y1-y0),style:"stroke:var(--fraud);stroke-dasharray:5 4",opacity:0});g95=sv("line",{x1:x0,x2:x1,y1:y1-0.95*(y1-y0),y2:y1-0.95*(y1-y0),style:"stroke:var(--gold);stroke-dasharray:5 4",opacity:0});s.append(g80,g95);

    whPlayer(box,{title:"Pareto and ABC classes",steps:5,dur:1600,render,onEnd:()=>award("pareto"),caption:i=>[
      "Axes: revenue on the left, cumulative share on the right. One slot per product.",

  })().catch(e=>whErr(box,e));

function qstate(lid,i){S.ans[lid]=S.ans[lid]||{};S.ans[lid][i]=S.ans[lid][i]||{tries:0,done:false,first:false,hint:false,got:0};return S.ans[lid][i];}
function levelDone(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done);}
function levelStars(lv){if(!levelDone(lv))return 0;const f=lv.qs.filter((q,i)=>S.ans[lv.id][i].first).length;return f===lv.qs.length?3:(f>=lv.qs.length/2?2:1);}
function attempted(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].tries>0);}
function unlocked(idx){if(S.unlockAll||idx===0)return true;const prev=L[idx-1];return levelDone(prev)||attempted(prev);}
function boardUnlocked(){return S.unlockAll||L.filter(levelDone).length>=COURSE.boardUnlock;}

function updProg(lv){const n=lv.qs.filter((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done).length;const e=$("#qprog");if(e)e.textContent=`${n} of ${lv.qs.length} solved`;}

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/[₹,\s]/g,"");let isPct=false;if(s.endsWith("%")){isPct=true;s=s.slice(0,-1);}let v=parseFloat(s);if(isPct)v/=100;return v;}
function numOK(v,q){if(Number.isNaN(v))return false;if(Math.abs(v-q.a)<=q.tol)return true;if(q.a<1&&v>1&&Math.abs(v/100-q.a)<=q.tol)return true;return false;}

function question(lv,q,i){
  const st=qstate(lv.id,i);
  const box=el("div",{class:"q"});
  box.innerHTML=`<div class="qhead"><span class="eyebrow">Challenge ${i+1}</span><span class="eyebrow" data-x></span></div><p class="qtext">${q.q}</p>`;
  const fb=el("div");
  const tag=box.querySelector("[data-x]");
  const setTag=()=>{tag.textContent=st.done?`+${st.got} XP`:(st.hint?"hint used · 75 XP":"100 XP");};
  setTag();
  const solve=(correct)=>{
    st.tries++;
    if(correct){
      st.done=true;st.first=(st.tries===1&&!st.hint);
      let gain=st.tries===1?100:st.tries===2?50:20; if(st.hint)gain=Math.max(0,gain-25); st.got=gain;
      if(st.tries===1){S.streak++;S.best=Math.max(S.best,S.streak);if(S.streak>=5)award("streak5");}
      save(); addXP(gain,"Challenge "+(i+1));
      fb.innerHTML=`<div class="fb ok"><b>Correct.</b><span>${q.why}</span></div>`;
      setTag(); updProg(lv); checkLevel(lv); const hbx=box.querySelector("[data-hint]"); if(hbx)hbx.hidden=true;
    } else {
      S.streak=0;save();renderStrip();
      fb.innerHTML=`<div class="fb no"><b>Not yet.</b><span>${st.tries>=2?"Look at the hint, or rework it in the lab, then try again.":"Try again; the lab above has what you need."}</span></div>`;
    }
  };
  if(q.t==="sql"){
    SQLX.challenge(box,q,st,solve,fb);
  } else if(q.t==="mcq"){
    const order=shuffled(q.opts.length,lv.id.charCodeAt(1)*31+i*17);
    const opts=el("div",{class:"opts"});
    order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);
      if(st.done){b.disabled=true;if(k===q.a)b.classList.add("right");}
      b.addEventListener("click",()=>{if(st.done)return;const c=(k===q.a);b.classList.add(c?"right":"wrong");if(c)opts.querySelectorAll("button").forEach(x=>x.disabled=true);else b.disabled=true;solve(c);});
      opts.appendChild(b);});
    box.appendChild(opts);
  } else {
    const row=el("div",{class:"numrow"});
    const inp=el("input",{type:"text",inputmode:"decimal",id:`in-${lv.id}-${i}`,"aria-label":"Your answer",placeholder:q.ph||"e.g. 0.123"});
    const go=el("button",{class:"btn small",type:"button"},"Check");
    if(st.done){inp.disabled=true;go.disabled=true;inp.value=String(+q.a.toFixed(4));}
    const check=()=>{if(st.done)return;const v=parseNum(inp.value);if(Number.isNaN(v)){fb.innerHTML=`<div class="fb no"><b>Enter a number.</b><span>Decimals (0.25) and percentages (25%) both work.</span></div>`;return;}const c=numOK(v,q);if(c){inp.disabled=true;go.disabled=true;}solve(c);};
    go.addEventListener("click",check);inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
    row.append(inp,go);box.appendChild(row);
  }
  if(q.hint){const hb=el("button",{class:"btn ghost small",type:"button","data-hint":"1"},"Show hint (−25 XP)");
    if(st.done)hb.hidden=true;
    hb.addEventListener("click",()=>{st.hint=true;save();setTag();hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;});
    const r=el("div",{class:"btnrow"});r.appendChild(hb);box.appendChild(r);
    if(st.hint&&!st.done){hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;}
  }
  if(st.done)fb.innerHTML=`<div class="fb ok"><b>Solved.</b><span>${q.why}</span></div>`;
  box.appendChild(fb);
  return box;
}
function checkLevel(lv){if(!levelDone(lv))return;const was=S.badges.includes(lv.id);award(lv.id);
  if(lv.qs.every((q,i)=>S.ans[lv.id][i].first))award("clean");
  if(!was){addXP(150,"Case file cleared");}}

function board(){
  stopAll();if(!boardUnlocked()){location.hash="";return;}
  const app=$("#app");app.innerHTML="";
  const d=el("div",{class:"dossier"});
  const back=el("button",{class:"back",type:"button"},"← Back to the desk");back.addEventListener("click",()=>{location.hash="";});d.appendChild(back);
  d.appendChild(el("div",{},`<p class="eyebrow">Final</p><h1 style="margin-top:8px">${COURSE.boardTitle||"The board meeting"}</h1><p class="note" style="margin-top:8px">${BOARD.length} questions from across the files. One attempt each, no hints. Score ${COURSE.boardPass} or more to earn ${COURSE.topRank}. XP is awarded on your first sitting only.</p>`));
  const p=el("section",{class:"panel"});d.appendChild(p);app.appendChild(d);
  const run={i:0,score:0,first:!S.board};
  const show=()=>{
    if(run.i>=BOARD.length){
      const pass=run.score>=COURSE.boardPass;
      S.board={score:Math.max(run.score,S.board?S.board.score:0)};save();
      if(run.first)addXP(run.score*100,"Board meeting");
      if(pass)award("board");
      p.innerHTML=`<h2>${pass?"The board is satisfied.":"The board wants another look."}</h2><p>You scored <b class="mono">${run.score} / ${BOARD.length}</b>. ${pass?"You are now "+COURSE.topRank+".":"Revisit the case files, then reconvene."}</p>`;
      const r=el("div",{class:"btnrow"});const a=el("button",{class:"btn",type:"button"},"Reconvene");a.addEventListener("click",board);const b=el("button",{class:"btn ghost",type:"button"},"Back to the desk");b.addEventListener("click",()=>{location.hash="";});r.append(a,b);p.appendChild(r);renderStrip();return;}
    const q=BOARD[run.i];p.innerHTML=`<div class="qhead"><span class="eyebrow">Question ${run.i+1} of ${BOARD.length}</span><span class="eyebrow">Score ${run.score}</span></div><p class="qtext">${q.q}</p>`;
    const fb=el("div");const next=el("button",{class:"btn",type:"button"},run.i<BOARD.length-1?"Next question →":"See the verdict");next.hidden=true;next.addEventListener("click",()=>{run.i++;show();});
    const done=(c)=>{if(c)run.score++;fb.innerHTML=`<div class="fb ${c?"ok":"no"}"><b>${c?"Correct.":"Not quite."}</b><span>${q.why}</span></div>`;next.hidden=false;};
    if(q.t==="mcq"){const o=el("div",{class:"opts"});const order=shuffled(q.opts.length,run.i*7+3);
      order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);b.addEventListener("click",()=>{o.querySelectorAll("button").forEach((x,ix)=>{x.disabled=true;if(order[ix]===q.a)x.classList.add("right");});if(k!==q.a)b.classList.add("wrong");done(k===q.a);});o.appendChild(b);});p.appendChild(o);}
    else{const r=el("div",{class:"numrow"});const inp=el("input",{type:"text",inputmode:"decimal",id:"board-in-"+run.i,"aria-label":"Your answer",placeholder:"e.g. 0.5"});const g=el("button",{class:"btn small",type:"button"},"Submit");
      const sub=()=>{const v=parseNum(inp.value);if(Number.isNaN(v))return;inp.disabled=true;g.disabled=true;done(numOK(v,q));};g.addEventListener("click",sub);inp.addEventListener("keydown",e=>{if(e.key==="Enter")sub();});r.append(inp,g);p.appendChild(r);}
    p.appendChild(fb);p.appendChild(next);
  };
  show();window.scrollTo(0,0);
}
/* ---------- router ---------- */
function route(){const h=location.hash.replace("#","");const lv=L.find(x=>x.id===h);if(lv)level(lv);else if(h==="board")board();else home();}
window.addEventListener("hashchange",route);
renderStrip();route();
try{window.__course={L,BOARD};}catch(e){}

})();
</script>
