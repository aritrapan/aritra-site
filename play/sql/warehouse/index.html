<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>SaralMart Insight Hall</title>
<meta name="description" content="Data warehouses, star schemas, OLAP roll-ups, BI queries, data quality, NoSQL and big data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case desk. Sticky status strip (rank, XP, streak); a live transaction-flow
   simulation as the hero; case files as a grid; an opened file is a single-column dossier:
   story, theory, lab, challenges. */
:root{
  --bg:#EAEFF4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#13233A; --muted:#566880; --line:#C9D3DF;
  --accent:#1F5FA8; --accent-soft:#DCE7F5; --gold:#A86E06; --gold-soft:#F6E7C8;
  --fraud:#B3263E; --fraud-soft:#F7DCE1; --ok:#1B7349; --ok-soft:#D7EFE2;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.strip .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .rank{font:700 1.05rem/1.1 var(--display)}
.xpbox{flex:1 1 220px;display:flex;flex-direction:column;gap:5px;min-width:0}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
.xpmeta{display:flex;justify-content:space-between;font:400 .8rem/1 var(--mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 11px;font:600 .82rem/1.2 var(--mono);white-space:nowrap}
a.chip{text-decoration:none;color:var(--accent)}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}

/* hero */
.hero{display:grid;gap:18px;padding-block:30px 10px}
.hero p.lede{font-size:1.08rem;max-width:62ch;margin-top:12px}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:8px;max-width:62ch}
.herotop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:720px){.herotop{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:.92rem}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ticket .row:last-child{border-bottom:0;padding-bottom:0}
.ticket .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flow simulation */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0}
.flow canvas{width:100%;height:auto;display:block;max-width:100%;border-radius:6px}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.flowbar .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.flowstats div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:1px}
.flowstats span{font-size:.72rem;color:var(--muted)}
.flowstats b{font:600 1.05rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font:600 .8rem/1.2 var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:transform .15s,border-color .15s}
.case:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.55}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .tag{font:600 .72rem/1 var(--mono);letter-spacing:.1em;color:var(--accent)}
.case h3{font-size:1.25rem}
.case .nick{font-size:.9rem;color:var(--muted)}
.case .topics{font-size:.85rem;color:var(--muted);margin-top:auto}
.stars{font-size:1rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.stamp{font:700 .7rem/1 var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok)} .stamp.lock{color:var(--muted)} .stamp.open{color:var(--accent)}
.case.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case.boss .tag,.case.boss .nick,.case.boss .topics{color:var(--bg);opacity:.8}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.badge b{font:600 .95rem/1.2 var(--display);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.badge.got b{color:var(--ink)}
.badge .seal{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}

/* dossier */
.dossier{display:grid;gap:22px;padding-block:24px}
.back{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);display:grid;gap:14px;min-width:0}
.panel>h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .eyebrow{color:var(--accent)}
.brief{display:grid;gap:12px;max-width:70ch}
.brief .term{font-weight:600}
.story{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;max-width:70ch}
.story b{font-style:normal}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.92rem;white-space:pre;line-height:1.5}
.refs{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* labs */
.labgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.labgrid{grid-template-columns:1fr}}
svg text{fill:var(--ink);font-family:var(--mono)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
.ctrl{display:grid;gap:6px}
.ctrl label{font-size:.88rem;color:var(--muted)}
.ctrl output{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.readout span{font-size:.76rem;color:var(--muted)}
.readout b{font:600 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.up{color:var(--fraud);font-weight:600}.down{color:var(--ok);font-weight:600}
.target{font:700 1.6rem/1.1 var(--mono);color:var(--accent)}
.regbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-size:.86rem}
.regbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.door{width:30%;aspect-ratio:3/4;max-width:120px;border:2px solid var(--line);background:var(--sunk);border-radius:8px 8px 2px 2px;
  font:700 1.4rem/1 var(--display);display:grid;place-items:center}
.door.pick{border-color:var(--accent);background:var(--accent-soft)}
.door.open{background:var(--bg);color:var(--muted);border-style:dashed}
.door.prize{border-color:var(--gold);background:var(--gold-soft)}
.doors{display:flex;gap:10px;justify-content:flex-start}
.mixbar{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.85rem}
.mixtrack{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mixtrack i{display:block;height:100%;transition:width .8s ease;font:600 .72rem/30px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
.mixtrack i.u{background:var(--accent-soft)}.mixtrack i.c{background:var(--line)}.mixtrack i.n{background:var(--fraud);color:var(--surface)}

/* challenges */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.q:first-of-type{border-top:0;padding-top:0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .eyebrow{white-space:nowrap}
.qtext{font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fraud);background:var(--fraud-soft)}
.opt[disabled]{cursor:default}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:12em}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--fraud-soft);border:1px solid var(--fraud)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b{font-family:var(--display);font-size:1rem}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;max-width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.toast b{color:var(--gold-soft)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sheet .formula{font-size:.84rem}
.sheet h3{font-size:1rem;margin-bottom:6px}
.sandbox{border:1px dashed var(--accent);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;background:var(--sunk);min-width:0;margin-top:14px}
.sb-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sb-head .eyebrow{color:var(--accent)}
.sb-tabs button{border:0;background:transparent;padding:5px 12px;font:600 .8rem/1.2 var(--mono)}
.sb-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sb-pane{display:grid;gap:10px;min-width:0}
.sb-params{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.sb-params label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sb-params input,.sb-params select{width:9.5em;max-width:100%}
.sandbox textarea{width:100%;max-width:100%;font:400 .88rem/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.sandbox input[type=file]{font-size:.82rem;max-width:100%}
.sqlx-console{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.sqlx-console{grid-template-columns:1fr}}
.sqlx-main{display:grid;gap:8px;min-width:0}
.sqlx-editor{width:100%;max-width:100%;font:400 .92rem/1.5 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
.sqlx-editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.sqlx-out{display:grid;gap:8px;min-width:0}
.sqlx-grid{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sqlx-grid table{font:400 .84rem/1.35 var(--mono)}
.sqlx-grid th{position:sticky;top:0;background:var(--sunk);text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink)}
.sqlx-grid td,.sqlx-grid th{white-space:nowrap;text-align:left}
.sqlx-grid td.num{text-align:right}
.sqlx-null{color:var(--muted);font-style:italic}
.sqlx-schema{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}
.sqlx-table summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sqlx-table ul{margin:4px 0 6px;padding-left:12px;list-style:none;display:grid;gap:2px}
.sqlx-col{all:unset;cursor:pointer;font:600 .8rem/1.3 var(--mono);color:var(--accent)}
.sqlx-col:focus-visible{outline:2px solid var(--accent)}
.sqlx-ch{display:grid;gap:8px;min-width:0}
.mysqlnote{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.mysqlnote b{font:600 .72rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
code,.code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){.panel .svgbox>svg,.panel .svgbox>canvas{min-width:600px;max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip" id="strip">
    <div class="who"><span class="eyebrow">Analyst rank</span><span class="rank" id="rank">Trainee Analyst</span></div>
    <div class="xpbox"><div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
      <div class="xpmeta"><span id="xptext">0 XP</span><span id="xpnext"></span></div></div>
    <span class="chip" id="streakchip" title="Correct first-try answers in a row">Streak <b id="streak">0</b></span>
    <span class="chip" title="Badges earned">Badges <b id="badgecount">0</b></span>
    <a class="chip" href="../" id="hublink">All modules</a>
  </div>
  <main id="app"></main>
  <div class="foot">
    <span>SaralMart Insight Hall · part of <a href="../">SQL, played</a>, a free course you play. Built by <a href="https://aritra.ai" target="_blank" rel="noopener">Aritra Pan</a>. Free to use in teaching.</span>
    <span>Module 8 · Warehouses and beyond</span>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>window.SQLX_LIB="../lib/";</script>
<script>
(function(){
"use strict";
/* ---------- sandbox toolkit (shared by every module) ----------
   Three levels of free play next to a lab:
     1. controls on the real data   2. generate your own data   3. bring your own data
   SAFETY: everything runs in the visitor's browser. Uploaded or pasted text is never sent anywhere,
   never stored, never put in the URL, and never inserted as HTML: it is only parsed into numbers and
   short labels, which are always displayed with textContent (SB.text / SB.table). Size caps keep phones responsive. */
const SB=(function(){
  const MAX_BYTES=2*1024*1024, MAX_ROWS=5000, MAX_COLS=50, MAX_LABEL=40;
  const used=()=>{try{award("explorer");}catch(e){}};
  /* safe text node helpers */
  function text(tag,str,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(str);return e;}
  /* control characters, bidirectional embedding/override/isolate controls (U+202A–202E, U+2066–2069, which could
     reorder the surrounding sentence on screen) and invisible U+200B, U+2060, U+FEFF are removed; ZWJ/ZWNJ stay (Indic scripts) */
  function cleanLabel(s){s=String(s==null?"":s).replace(/[\u0000-\u001f\u007f-\u009f\u200b\u202a-\u202e\u2060\u2066-\u2069\ufeff]/g,"").trim();return s.length>MAX_LABEL?s.slice(0,MAX_LABEL)+"…":s;}
  /* parse delimited text into {header:[...], rows:[[...]], note} — all values stay plain strings */
  function parse(str){
    str=String(str||"");if(str.length>MAX_BYTES)str=str.slice(0,MAX_BYTES);
    let lines=str.replace(/\r\n?/g,"\n").split("\n").map(l=>l.trim()).filter(l=>l.length);
    let truncated=false;if(lines.length>MAX_ROWS+1){lines=lines.slice(0,MAX_ROWS+1);truncated=true;}
    const note=()=>truncated?`Only the first ${ind(MAX_ROWS)} rows were read.`:"";
    if(!lines.length)return{header:[],rows:[],note:"Nothing to read."};
    // pick a delimiter that splits the first lines into the same number (>1) of fields
    let delim=null,best=1;
    for(const d of [",","\t",";","|"]){const c=lines.slice(0,20).map(l=>splitLine(l,d).length);if(c.every(x=>x===c[0])&&c[0]>best){best=c[0];delim=d;}}

/* ===== Module 8: SaralMart Insight Hall — data warehouses and business intelligence ===== */
/* Database: saralstar (data/gen_saralstar.py, fixed seed), a star schema built from the saralmart order system.
   Every number shown in a lab comes from a query run in the visitor's browser (SQLX.exec). */

/* ---------- levels ---------- */
const L=[];
L.push({id:"l1",badge:"Hall Pass",code:"File 1",title:"Two jobs for the same data",topics:"OLTP vs OLAP, data warehouse, data mart, business intelligence, why a separate store",
story:`<b>Monday, the Insight Hall.</b> SaralMart's order system has run the business for fifteen months. Finance now wants "revenue by region by quarter, every Monday", and the last time someone ran that on the live order database, checkout slowed down for twenty minutes. The Chief Data Officer, Meenal Rao, has had a copy of the data rebuilt for analysis and handed you the keys: "Learn the hall first. Then start answering."`,
brief:`<p>Two very different jobs touch the same business data. <span class="term">OLTP (online transaction processing)</span> runs the business: thousands of short transactions per hour, each inserting or updating a handful of rows (one order, one payment, one status change). <span class="term">OLAP (online analytical processing)</span> analyses the business: a few long queries that read and summarise a great many rows ("revenue by region by quarter").</p>
<div class="formula">               OLTP (order system)            OLAP (warehouse)
Purpose        run the business               analyse the business
Typical work   many small INSERT/UPDATE       few large SELECT … GROUP BY
Rows per query 1 to 10                        thousands to billions
Design         normalised (3NF), few repeats  denormalised star schema
Data           current values                 current + history, read-mostly</div>
<p>A <span class="term">data warehouse</span> gathers data from many operational systems, cleans and integrates it, and keeps both today's values and their history, so that people who make decisions anywhere in the firm can analyse it; it is read, not edited. A <span class="term">data mart</span> is a smaller store cut from it for one group (a sales mart, a marketing mart). <span class="term">BI (business intelligence)</span> is the umbrella term for the data, tools and analysis (reports, dashboards, queries, data mining) that turn this store into decisions (Laudon &amp; Laudon, ch. 6 and 12).</p>
<p>Why not just query the order system? Long scans compete with checkout for the same disks, memory and locks; the order system keeps only today's values (a customer's current city, not where she lived in March); and its tables are designed to make writes safe, so even simple questions need many joins. The warehouse is loaded from the operational systems by <span class="term">ETL (extract, transform, load)</span>, which File 7 builds.</p>
<p>SaralMart's warehouse, <code>saralstar</code>, has one central <span class="term">fact table</span>, <code>fact_sales</code> (one row per order line: 9,366 rows), surrounded by <span class="term">dimension tables</span> that describe each sale: <code>dim_date</code>, <code>dim_product</code>, <code>dim_customer</code>, <code>dim_channel</code>. The schema panel in the lab lists them all. Finance counts revenue as <code>net_amount</code> on lines whose <code>order_status = 'Delivered'</code>; every file uses that rule unless a question says otherwise.</p>
<div class="formula">SELECT ch.channel_name, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_channel ch ON ch.channel_key = f.channel_key
WHERE f.order_status = 'Delivered'
GROUP BY ch.channel_name;</div>`,
refs:"Laudon &amp; Laudon, <i>Management Information Systems: Managing the Digital Firm</i> (17th ed., Pearson, 2022), ch. 6 \"Foundations of Business Intelligence: Databases and Information Management\" and ch. 12 \"Enhancing Decision Making\" · Kimball &amp; Ross, <i>The Data Warehouse Toolkit</i> (3rd ed., 2013) · Silberschatz, Korth &amp; Sudarshan, <i>Database System Concepts</i> (7th ed., 2019), the chapter on data analytics.",
lab:root=>{whLabWorkloads(root);whConsolePanel(root,{title:"The Insight Hall",gen:true});},
qs:[
{t:"mcq",q:"Which of these is an OLAP (online analytical processing) workload?",opts:["Revenue by region and quarter for five quarters, read from all 9,366 order lines","Recording that order 5123 has just been paid","Changing one customer's delivery address","Showing a customer the status of her latest order"],a:0,
 hint:"OLAP reads and summarises many rows; OLTP changes or reads a few.",why:"The revenue report scans every order line and groups them. The other three each touch one or two rows: classic OLTP (online transaction processing)."},
{t:"sql",db:"saralstar",q:"Your first warehouse query. How many rows (order lines) does <code>fact_sales</code> hold for each <code>order_status</code>? Return order_status and the number of lines.",
 answer:"SELECT order_status, COUNT(*) AS order_lines FROM fact_sales GROUP BY order_status",
 starter:"SELECT order_status, COUNT(*) AS order_lines\nFROM fact_sales\n",
 hint:"GROUP BY order_status and COUNT(*).",why:`Four statuses; Delivered has 7,783 lines.<div class="formula">SELECT order_status, COUNT(*) AS order_lines
FROM fact_sales
GROUP BY order_status;</div>Each row of fact_sales is one order line, so COUNT(*) counts lines. COUNT(DISTINCT order_id) would count orders instead.`},
{t:"sql",db:"saralstar",q:"Finance's first request: Delivered revenue by channel. Return <code>channel_name</code> and revenue (SUM of net_amount, rounded to 2 decimals), highest revenue first.",
 answer:"SELECT ch.channel_name, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_channel ch ON ch.channel_key = f.channel_key WHERE f.order_status = 'Delivered' GROUP BY ch.channel_name ORDER BY revenue DESC",ordered:true,
 hint:"Join fact_sales to dim_channel on channel_key, keep order_status = 'Delivered', group by channel_name.",why:`App leads with ₹5,163,070.22, then Web and Phone.<div class="formula">SELECT ch.channel_name, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_channel ch ON ch.channel_key = f.channel_key
WHERE f.order_status = 'Delivered'
GROUP BY ch.channel_name
ORDER BY revenue DESC;</div>One join from the fact to the dimension that holds the label: that is the typical shape of a warehouse query.`},
{t:"mcq",q:"What is a data mart?",opts:["A focused subset of the warehouse for one group of users, such as a sales mart","A backup copy of the operational database","A store that keeps raw files exactly as they arrived, to be given structure later","The staging area where ETL cleans the data"],a:0,
 hint:"Think of the warehouse as the whole library and the mart as one reading room.",why:"A data mart serves one department or user group with a narrower slice of the warehouse's data, often already summarised. Raw files in native format describe a data lake (File 8); the staging area belongs to ETL (File 7)."},
{t:"mcq",q:"Why did SaralMart build a separate warehouse instead of running reports on the order system?",opts:["Long analytical scans compete with checkout for the same resources, and the order system keeps only current values, not history","SQL cannot aggregate normalised tables","The order system's tables cannot be joined","A warehouse is faster for every kind of query, including single-row updates"],a:0,
 hint:"Two reasons: load and history.",why:"Separating the workloads protects checkout from twenty-minute scans, and the warehouse can keep history (a customer's old city, File 4) that the order system overwrites. Warehouses are not faster for single-row updates; they are built for reads."},
{t:"sql",db:"saralstar",q:"How many distinct orders and how many order lines fall in each calendar year? Return <code>year</code> (from dim_date), orders, order_lines.",
 answer:"SELECT d.year, COUNT(DISTINCT f.order_id) AS orders, COUNT(*) AS order_lines FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key GROUP BY d.year",
 hint:"Join to dim_date on date_key; COUNT(DISTINCT order_id) for orders, COUNT(*) for lines.",why:`2025 (July to December) has 1,706 orders, 2026 (January to September) has 2,494.<div class="formula">SELECT d.year, COUNT(DISTINCT f.order_id) AS orders,
       COUNT(*) AS order_lines
FROM fact_sales f
JOIN dim_date d ON d.date_key = f.date_key
GROUP BY d.year;</div>An order with three products is three fact rows, so lines outnumber orders. The date_key is a number like 20250714, so <code>f.date_key / 10000</code> (integer division) also gives the year.<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite, where / between two integers truncates, so 20250714 / 10000 is 2025. In MySQL / returns a decimal (2025.0714); write 20250714 DIV 10000 there.</span></div>`}
]});

L.push({id:"l2",badge:"Grain Keeper",code:"File 2",title:"Facts, dimensions and the grain",topics:"Fact and dimension tables, grain, additive, semi-additive and non-additive measures, surrogate keys, unknown members, the date dimension",
story:`<b>The disputed total.</b> Two analysts brought two "total stock" numbers to the same meeting: one said 2,026 units, the other 31,164. Both summed the same column. Ishaan Verma from the warehouse team sighs: "One of you added up the same shelf fifteen times. Before you write another query, learn what one row of each table means."`,
brief:`<p>Dimensional modelling (Kimball &amp; Ross) splits a warehouse into two kinds of table. A <span class="term">fact table</span> records measurements of a business event: numbers you add up (quantity, net amount, cost). A <span class="term">dimension table</span> holds the descriptive context you filter and group by: who, what, when, where, how (customer, product, date, region, channel).</p>
<p>The first design decision is the <span class="term">grain</span>: exactly what one fact row represents. In <code>fact_sales</code> it is <b>one order line</b> (one product in one order). Declare the grain before choosing columns; every measure in the table must be true at that grain. <code>order_id</code> sits in the fact row without a dimension table of its own: a <span class="term">degenerate dimension</span>. (<code>order_status</code> is kept there too, for simplicity.)</p>
<p>Measures differ in how they may be summed:</p>
<div class="formula">additive       sums across every dimension          qty, net_amount, cost_amount
semi-additive  sums across some dimensions, not time  closing_units (stock on hand)
non-additive   never sum; recompute from parts        discount, unit_price, margin %</div>
<p><code>fact_inventory_monthly</code> is a <span class="term">periodic snapshot</span>: one row per product per month-end. Stock can be summed across products for one month, but adding September's stock to August's counts the same units twice; use the latest month, or an average. Ratios such as margin % are computed from summed parts: 100 × (SUM(net) − SUM(cost)) / SUM(net), not AVG of line ratios.</p>
<p>Dimensions are joined on <span class="term">surrogate keys</span>: meaningless integers the warehouse assigns (<code>product_key</code>), instead of the source system's <span class="term">natural (business) key</span> (<code>product_id</code>). Surrogates survive source-system changes and let one customer have several versions (File 4). Instead of NULL foreign keys, missing context points to an <span class="term">unknown member</span> row: guest checkouts use <code>customer_key = 0</code> ("Guest checkout", region "Unknown").</p>
<p>The <span class="term">date dimension</span> has one row per calendar day (<code>date_key</code> 20250701 … 20261031) with year, quarter, month, day name, weekend flag and fiscal year (April to March). Because it lists every day, including days with no sales, it is the calendar for finding gaps. <code>fact_sales</code> uses it twice, for order date and delivery date: a <span class="term">role-playing dimension</span>.</p>`,
refs:"Kimball &amp; Ross, <i>The Data Warehouse Toolkit</i> (3rd ed., 2013), the dimensional modelling primer and the retail sales and inventory case studies · Laudon &amp; Laudon (2022), ch. 6 · SQLite documentation, \"Aggregate Functions\" (sqlite.org/lang_aggfunc.html).",
lab:root=>{whLabGrain(root);whConsole(root,"SELECT month_key, SUM(closing_units) AS stock_units\nFROM fact_inventory_monthly\nGROUP BY month_key\nORDER BY month_key;");},
qs:[
{t:"mcq",q:"What is the grain of <code>fact_sales</code>?",opts:["One row per product per order (one order line)","One row per order","One row per customer per day","One row per product per month"],a:0,
 hint:"Look at sales_key, order_id and product_key together.",why:"Each row carries one order_id and one product_key: one order line. The monthly snapshot, fact_inventory_monthly, has the grain one product per month-end."},
{t:"sql",db:"saralstar",q:"Units sold (SUM of qty) per <code>department</code>, counting every line that was not cancelled. Return department and units, sorted by department name.",
 answer:"SELECT p.department, SUM(f.qty) AS units FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key WHERE f.order_status <> 'Cancelled' GROUP BY p.department ORDER BY p.department",ordered:true,
 hint:"Join dim_product on product_key; WHERE order_status &lt;&gt; 'Cancelled'.",why:`Daily Needs 4,359, Home and Kitchen 4,499, Lifestyle 5,043.<div class="formula">SELECT p.department, SUM(f.qty) AS units
FROM fact_sales f
JOIN dim_product p ON p.product_key = f.product_key
WHERE f.order_status &lt;&gt; 'Cancelled'
GROUP BY p.department
ORDER BY p.department;</div>qty is additive: summing it across products, dates and customers always means something.`},
{t:"mcq",q:"Which <code>fact_sales</code> column is non-additive, so that summing it across rows means nothing?",opts:["discount (a fraction of the price)","qty","net_amount","cost_amount"],a:0,
 hint:"Would adding 0.10 and 0.05 give a discount of 15%?",why:"Two lines with 10% and 5% discount did not get a 15% discount. Fractions, prices and percentages are non-additive: recompute them from additive parts (for example SUM of discount amounts over SUM of gross amounts)."},
{t:"sql",db:"saralstar",q:"The disputed total. What was the total closing stock (SUM of <code>closing_units</code>, all products) at the latest month-end in <code>fact_inventory_monthly</code>? Return one number.",
 answer:"SELECT SUM(closing_units) AS stock_units FROM fact_inventory_monthly WHERE month_key = (SELECT MAX(month_key) FROM fact_inventory_monthly)",
 hint:"closing_units is semi-additive: sum across products for ONE month_key, the largest.",why:`2,026 units at 30 September 2026.<div class="formula">SELECT SUM(closing_units) AS stock_units
FROM fact_inventory_monthly
WHERE month_key = (SELECT MAX(month_key)
                   FROM fact_inventory_monthly);</div>The other analyst's 31,164 summed all fifteen month-ends, counting every unit that sat on a shelf for several months again and again.`},
{t:"sql",db:"saralstar",q:"Gross margin % by <code>category</code> for Delivered lines, computed from the summed amounts: 100 × (SUM(net_amount) − SUM(cost_amount)) / SUM(net_amount), rounded to 2 decimals. Return category and margin_pct, highest margin first.",
 answer:"SELECT p.category, ROUND(100.0 * (SUM(f.net_amount) - SUM(f.cost_amount)) / SUM(f.net_amount), 2) AS margin_pct FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key WHERE f.order_status = 'Delivered' GROUP BY p.category ORDER BY margin_pct DESC",ordered:true,
 hint:"Do not average the line-level margins; divide the sums.",why:`Electronics 39.36%, Kitchen 37.32%, … Toys 28.40%.<div class="formula">SELECT p.category,
       ROUND(100.0 * (SUM(f.net_amount) - SUM(f.cost_amount))
             / SUM(f.net_amount), 2) AS margin_pct
FROM fact_sales f
JOIN dim_product p ON p.product_key = f.product_key
WHERE f.order_status = 'Delivered'
GROUP BY p.category
ORDER BY margin_pct DESC;</div>AVG of the line ratios gives every line equal weight, so a ₹90 jaggery line counts as much as a ₹3,200 mixer grinder. That average ranks Grocery (31.73) above Home (30.71); the true margins rank them the other way (29.41 against 32.00).`},
{t:"sql",db:"saralstar",q:"Guest checkouts point to the unknown member <code>customer_key = 0</code>. What percentage of Delivered revenue came from guests? Return one number rounded to 2 decimals.",
 answer:"SELECT ROUND(100.0 * SUM(CASE WHEN customer_key = 0 THEN net_amount ELSE 0 END) / SUM(net_amount), 2) AS guest_share_pct FROM fact_sales WHERE order_status = 'Delivered'",
 hint:"Conditional aggregation: SUM(CASE WHEN customer_key = 0 THEN net_amount ELSE 0 END) over SUM(net_amount).",why:`4.55%.<div class="formula">SELECT ROUND(100.0 * SUM(CASE WHEN customer_key = 0
                             THEN net_amount ELSE 0 END)
             / SUM(net_amount), 2) AS guest_share_pct
FROM fact_sales
WHERE order_status = 'Delivered';</div>Because guests have a real dimension row, an inner join to dim_customer keeps them; with a NULL key they would silently vanish from every joined report.`},
{t:"sql",db:"saralstar",q:"Interview classic (gaps). Using <code>dim_date</code> as the calendar, how many days from 2025-07-01 to 2026-09-30 had no order placed on the Phone channel? Return one number.",
 answer:"SELECT COUNT(*) AS days_without_phone FROM dim_date d WHERE d.full_date BETWEEN '2025-07-01' AND '2026-09-30' AND NOT EXISTS (SELECT 1 FROM fact_sales f JOIN dim_channel ch ON ch.channel_key = f.channel_key WHERE f.date_key = d.date_key AND ch.channel_name = 'Phone')",
 hint:"Start from dim_date (it has every day), keep the date range, and use NOT EXISTS (or LEFT JOIN … IS NULL) against Phone sales.",why:`267 of the 457 days.<div class="formula">SELECT COUNT(*) AS days_without_phone
FROM dim_date d
WHERE d.full_date BETWEEN '2025-07-01' AND '2026-09-30'
  AND NOT EXISTS (SELECT 1
                  FROM fact_sales f
                  JOIN dim_channel ch ON ch.channel_key = f.channel_key
                  WHERE f.date_key = d.date_key
                    AND ch.channel_name = 'Phone');</div>A fact table cannot show a day on which nothing happened; the date dimension can. Without the date range you would also count the 31 October days the calendar already holds (298).`}
]});

L.push({id:"l3",badge:"Star Mapper",code:"File 3",title:"Star, snowflake and galaxy",topics:"Star schema, snowflake schema, denormalisation, conformed dimensions, drill-across, fact constellation, Kimball vs Inmon",
story:`<b>The architecture review.</b> Rahul Menon, who designed the order system, objects to the warehouse: "<code>dim_customer</code> repeats 'Maharashtra, West' on every Pune customer. That is exactly the redundancy we normalised away." The warehouse team answers that it is on purpose. You are asked to show both designs on the same data and say which one answers Finance's questions with fewer joins.`,
brief:`<p>A <span class="term">star schema</span> has one fact table in the centre and one flat, <span class="term">denormalised</span> table per dimension around it. <code>dim_customer</code> carries <code>city_name</code>, <code>state</code> and <code>region</code> as plain columns; <code>dim_product</code> carries <code>category</code> and <code>department</code>. Any report is the fact plus one join per dimension it needs.</p>
<p>A <span class="term">snowflake schema</span> normalises the dimensions into sub-tables, as Module 6 would recommend for an operational database: <code>dim_customer → dim_city → dim_region</code> and <code>dim_product → dim_category</code>. Less repetition, but "revenue by region" now needs three joins instead of one. Both exist in <code>saralstar</code>, so you can compare them.</p>
<div class="formula">-- star: one join
SELECT c.region, SUM(f.net_amount) FROM fact_sales f
JOIN dim_customer c ON c.customer_key = f.customer_key GROUP BY c.region;
-- snowflake: three joins, same numbers
SELECT r.region_name, SUM(f.net_amount) FROM fact_sales f
JOIN dim_customer c ON c.customer_key = f.customer_key
JOIN dim_city ci    ON ci.city_key    = c.city_key
JOIN dim_region r   ON r.region_key   = ci.region_key GROUP BY r.region_name;</div>
<p>Why accept redundancy? Dimension tables are small (633 customer rows against 9,366 facts) and change rarely, and the warehouse is loaded by ETL, not edited by users, so the update anomalies that normalisation prevents (Module 6) hardly arise. Fewer joins make queries simpler for analysts and BI tools.</p>
<p>A <span class="term">conformed dimension</span> means the same thing, with the same keys, in every fact table that uses it. <code>dim_product</code> and <code>dim_date</code> serve both <code>fact_sales</code> and <code>fact_inventory_monthly</code>. Several fact tables sharing conformed dimensions form a <span class="term">galaxy</span> or <span class="term">fact constellation</span>. To compare two facts (<span class="term">drill-across</span>), aggregate each to a common grain first, then join the results. Joining two fact tables row to row multiplies rows (the fan-out trap of Module 3).</p>
<p>Two design philosophies: <span class="term">Kimball</span> (bottom-up) builds dimensional data marts on conformed dimensions and lets the warehouse be their union; <span class="term">Inmon</span> (top-down) builds one normalised enterprise warehouse first and derives data marts from it.</p>`,
refs:"Kimball &amp; Ross (2013), the chapters on dimensional modelling techniques and on conformed dimensions (the enterprise data warehouse bus architecture) · Laudon &amp; Laudon (2022), ch. 6 · Elmasri &amp; Navathe, <i>Fundamentals of Database Systems</i> (7th ed., 2016), the chapter on data warehousing.",
lab:root=>{whLabSnowflake(root);whConsole(root,"SELECT r.region_name, ROUND(SUM(f.net_amount), 2) AS revenue\nFROM fact_sales f\nJOIN dim_customer c ON c.customer_key = f.customer_key\nJOIN dim_city ci ON ci.city_key = c.city_key\nJOIN dim_region r ON r.region_key = ci.region_key\nWHERE f.order_status = 'Delivered'\nGROUP BY r.region_name;");},
qs:[
{t:"sql",db:"saralstar",q:"Star join. Delivered revenue by <code>region</code>, using the flat region column of <code>dim_customer</code>. Return region and revenue rounded to 2 decimals, highest first.",
 answer:"SELECT c.region, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_customer c ON c.customer_key = f.customer_key WHERE f.order_status = 'Delivered' GROUP BY c.region ORDER BY revenue DESC",ordered:true,
 hint:"One join: fact_sales to dim_customer on customer_key.",why:`West ₹1,934,628.14 leads; "Unknown" (guests and customers with no city) is ₹676,485.19.<div class="formula">SELECT c.region, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_customer c ON c.customer_key = f.customer_key
WHERE f.order_status = 'Delivered'
GROUP BY c.region
ORDER BY revenue DESC;</div>The snowflake path through dim_city and dim_region returns the same seven rows.`},
{t:"sql",db:"saralstar",q:"Snowflake join. Delivered revenue by <code>department</code>, walking <code>fact_sales → dim_product → dim_category</code> and using <code>dim_category.department</code>. Return department and revenue rounded to 2 decimals, highest first.",
 answer:"SELECT cat.department, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key JOIN dim_category cat ON cat.category_key = p.category_key WHERE f.order_status = 'Delivered' GROUP BY cat.department ORDER BY revenue DESC",ordered:true,
 hint:"Two joins: product_key, then category_key.",why:`Home and Kitchen ₹4,341,994.04, Lifestyle ₹3,013,234.52, Daily Needs ₹1,114,250.56.<div class="formula">SELECT cat.department, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_product p    ON p.product_key    = f.product_key
JOIN dim_category cat ON cat.category_key = p.category_key
WHERE f.order_status = 'Delivered'
GROUP BY cat.department
ORDER BY revenue DESC;</div>The star version (dim_product.department) needs one join less and gives the same answer.`},
{t:"mcq",q:"For \"revenue by region\", how many joins does the star schema need, and how many the snowflake (fact → customer → city → region)?",opts:["1 and 3","1 and 2","3 and 1","2 and 4"],a:0,
 hint:"Count the ON clauses in the two queries of the theory.",why:"The star has region inside dim_customer: one join. The snowflake moves it two tables further out: three joins. Same answer, more work for the analyst and the optimiser."},
{t:"sql",db:"saralstar",q:"Drill-across a galaxy. For each <code>category</code>: units sold in September 2026 (SUM of qty from fact_sales, by order date, not cancelled) and closing stock at 30 September 2026 (SUM of closing_units from fact_inventory_monthly, month_key 20260930). Return category, units_sold, closing_stock, sorted by category.",
 answer:"WITH s AS (SELECT p.category, SUM(f.qty) AS units_sold FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key JOIN dim_date d ON d.date_key = f.date_key WHERE d.year_month = '2026-09' AND f.order_status <> 'Cancelled' GROUP BY p.category), i AS (SELECT p.category, SUM(m.closing_units) AS closing_stock FROM fact_inventory_monthly m JOIN dim_product p ON p.product_key = m.product_key WHERE m.month_key = 20260930 GROUP BY p.category) SELECT s.category, s.units_sold, i.closing_stock FROM s JOIN i ON i.category = s.category ORDER BY s.category",ordered:true,
 hint:"Aggregate each fact table to category level in its own CTE (common table expression), then join the two small results on category.",why:`Seven rows, from Electronics to Toys.<div class="formula">WITH s AS (SELECT p.category, SUM(f.qty) AS units_sold
           FROM fact_sales f
           JOIN dim_product p ON p.product_key = f.product_key
           JOIN dim_date d    ON d.date_key    = f.date_key
           WHERE d.year_month = '2026-09'
             AND f.order_status &lt;&gt; 'Cancelled'
           GROUP BY p.category),
     i AS (SELECT p.category, SUM(m.closing_units) AS closing_stock
           FROM fact_inventory_monthly m
           JOIN dim_product p ON p.product_key = m.product_key
           WHERE m.month_key = 20260930
           GROUP BY p.category)
SELECT s.category, s.units_sold, i.closing_stock
FROM s JOIN i ON i.category = s.category
ORDER BY s.category;</div>Joining fact_sales directly to fact_inventory_monthly on product_key repeats each product's stock once per September sales line, inflating closing_stock many times over: the fan-out trap.`},
{t:"sql",db:"saralstar",q:"Reconciliation across conformed dimensions. For each month of 2026-Q3 (<code>year_month</code>), compare units sold from fact_sales (not cancelled, by order date) with <code>sold_units</code> from fact_inventory_monthly. Return year_month, from_sales, from_snapshot, sorted by year_month.",
 answer:"WITH s AS (SELECT d.year_month, SUM(f.qty) AS from_sales FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key WHERE d.year_quarter = '2026-Q3' AND f.order_status <> 'Cancelled' GROUP BY d.year_month), i AS (SELECT d.year_month, SUM(m.sold_units) AS from_snapshot FROM fact_inventory_monthly m JOIN dim_date d ON d.date_key = m.month_key WHERE d.year_quarter = '2026-Q3' GROUP BY d.year_month) SELECT s.year_month, s.from_sales, i.from_snapshot FROM s JOIN i ON i.year_month = s.year_month ORDER BY s.year_month",ordered:true,
 hint:"Both facts reach dim_date: fact_sales by date_key, the snapshot by month_key (a month-end date). Aggregate each by year_month, then join.",why:`The two sources agree month by month, which is what a reconciliation check should show.<div class="formula">WITH s AS (SELECT d.year_month, SUM(f.qty) AS from_sales
           FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key
           WHERE d.year_quarter = '2026-Q3'
             AND f.order_status &lt;&gt; 'Cancelled'
           GROUP BY d.year_month),
     i AS (SELECT d.year_month, SUM(m.sold_units) AS from_snapshot
           FROM fact_inventory_monthly m
           JOIN dim_date d ON d.date_key = m.month_key
           WHERE d.year_quarter = '2026-Q3'
           GROUP BY d.year_month)
SELECT s.year_month, s.from_sales, i.from_snapshot
FROM s JOIN i ON i.year_month = s.year_month
ORDER BY s.year_month;</div>Because dim_date is conformed, "2026-08" means the same month in both facts.`},
{t:"mcq",q:"Which description matches Kimball's approach to building a warehouse?",opts:["Bottom-up: build dimensional data marts on shared, conformed dimensions; the warehouse is their union","Top-down: build one normalised enterprise warehouse first, then derive marts","Keep all raw data in its native format and decide the structure when it is read","Store every table fully normalised to BCNF and add no redundancy"],a:0,
 hint:"Kimball is associated with the star schema and the data mart.",why:"Kimball's bottom-up approach delivers business-process marts quickly and integrates them through conformed dimensions. The top-down option is Inmon's; the native-format option describes a data lake."}
]});

L.push({id:"l4",badge:"Time Keeper",code:"File 4",title:"When dimensions change",topics:"Slowly changing dimensions: type 0, 1, 2 and 3, effective dates, current-row flag, as-was vs as-is reporting, surrogate key lookup",
story:`<b>The region that moved.</b> The North region's manager, Gurpreet Kaur, complains that her March numbers shrank after the CRM (customer relationship management) team corrected a batch of addresses. Ananya Sheikh, one of her best customers, moved from Chandigarh to Pune in March. "Her January orders were in my region. Why are they in West now?" They are not, in this warehouse. Find out why.`,
brief:`<p>Dimension attributes change: customers move, products are re-categorised, segments are upgraded. How the warehouse handles each attribute is its <span class="term">SCD (slowly changing dimension)</span> type (Kimball &amp; Ross):</p>
<div class="formula">type 0  keep the original value forever          signup_date
type 1  overwrite; no history kept                 a corrected spelling
type 2  add a new row (new surrogate key)          city, region, segment
type 3  add a "previous value" column              old_region next to region</div>
<p>In <code>dim_customer</code>, city and segment are <b>type 2</b>. Each version of a customer is its own row with its own <code>customer_key</code>, plus <code>valid_from</code>, <code>valid_to</code> (9999-12-31 for the open version) and <code>is_current</code>. The natural key <code>cust_id</code> is the same in every version. When Ananya moved on 2026-03-16, ETL closed her old row (valid_to 2026-03-15, is_current 0) and inserted a new one. Her old sales still point to the old key, so they stay in North.</p>
<p>When a sale is loaded, ETL looks up the key that was valid on the order date:</p>
<div class="formula">SELECT customer_key FROM dim_customer
WHERE cust_id = 105 AND '2026-01-20' BETWEEN valid_from AND valid_to;</div>
<p>That gives two ways to report. <span class="term">As-was</span> (historical truth): join the fact on its stored key. <span class="term">As-is</span> (restated to today's attributes): join through the natural key to the current row.</p>
<div class="formula">-- as-is: every sale under the customer's current region
SELECT cur.region, SUM(f.net_amount)
FROM fact_sales f
JOIN dim_customer v   ON v.customer_key = f.customer_key
JOIN dim_customer cur ON cur.cust_id = v.cust_id AND cur.is_current = 1
GROUP BY cur.region;</div>
<p>Type 1 is an ordinary UPDATE: every version gets the new value and history is lost. In MySQL a type 1 load is often written as an upsert.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite. An upsert here is INSERT … ON CONFLICT (customer_key) DO UPDATE SET segment = excluded.segment; in MySQL it is INSERT … ON DUPLICATE KEY UPDATE segment = VALUES(segment) (newer MySQL 8.0 releases prefer a row alias: … AS new ON DUPLICATE KEY UPDATE segment = new.segment). An UPDATE that reads another table is UPDATE t SET … FROM other WHERE … here (SQLite 3.33 or later) and UPDATE t JOIN other ON … SET … in MySQL; a correlated subquery in SET works in both.</span></div>`,
refs:"Kimball &amp; Ross (2013), the slowly changing dimension techniques (types 0 to 7) · SQLite documentation, \"UPSERT\" (sqlite.org/lang_upsert.html) and \"UPDATE\" (sqlite.org/lang_update.html) · MySQL 8.0 Reference Manual, \"INSERT ... ON DUPLICATE KEY UPDATE Statement\".",
lab:root=>{whLabSCD(root);whConsole(root,"SELECT customer_key, cust_id, cust_name, city_name, region,\n       valid_from, valid_to, is_current\nFROM dim_customer\nWHERE cust_id IN (105, 113, 138)\nORDER BY cust_id, valid_from;");},
qs:[
{t:"sql",db:"saralstar",q:"How many customers (distinct <code>cust_id</code>) have more than one version in <code>dim_customer</code>? Return one number.",
 answer:"SELECT COUNT(*) AS customers_with_history FROM (SELECT cust_id FROM dim_customer WHERE cust_id IS NOT NULL GROUP BY cust_id HAVING COUNT(*) > 1) AS h",
 hint:"GROUP BY cust_id HAVING COUNT(*) &gt; 1, then count the groups.",why:`32 customers: 18 moved city and 14 were upgraded from Regular to Premium.<div class="formula">SELECT COUNT(*) AS customers_with_history
FROM (SELECT cust_id FROM dim_customer
      WHERE cust_id IS NOT NULL
      GROUP BY cust_id
      HAVING COUNT(*) > 1) AS h;</div>Here every changed customer changed once, so counting rows with is_current = 0 gives the same 32. The alias AS h is optional here; MySQL requires one on every subquery in FROM.`},
{t:"sql",db:"saralstar",q:"Point-in-time lookup, as ETL does it. Which <code>customer_key</code> was valid for customer 113 on 2026-01-15? Return one value.",
 answer:"SELECT customer_key FROM dim_customer WHERE cust_id = 113 AND '2026-01-15' BETWEEN valid_from AND valid_to",
 hint:"The date must fall between valid_from and valid_to of the version.",why:`Key 14 (Guwahati, valid until 2026-06-13).<div class="formula">SELECT customer_key
FROM dim_customer
WHERE cust_id = 113
  AND '2026-01-15' BETWEEN valid_from AND valid_to;</div>The dates are ISO text (YYYY-MM-DD), so text comparison orders them correctly. Taking is_current = 1 would give key 15, the version that began in June.`},
{t:"sql",db:"saralstar",q:"As-is report. Delivered revenue by region, with every sale restated to the customer's CURRENT region (guests drop out, since they have no cust_id). Return region and revenue rounded to 2 decimals, highest first.",
 answer:"SELECT cur.region, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_customer v ON v.customer_key = f.customer_key JOIN dim_customer cur ON cur.cust_id = v.cust_id AND cur.is_current = 1 WHERE f.order_status = 'Delivered' GROUP BY cur.region ORDER BY revenue DESC",ordered:true,
 hint:"Join dim_customer twice: once on the fact's key (the version), once on cust_id with is_current = 1 (today's row).",why:`West ₹1,913,333.23, North ₹1,716,846.37, East ₹1,611,464.03, South ₹1,607,777.41, …<div class="formula">SELECT cur.region, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_customer v   ON v.customer_key = f.customer_key
JOIN dim_customer cur ON cur.cust_id = v.cust_id
                     AND cur.is_current = 1
WHERE f.order_status = 'Delivered'
GROUP BY cur.region
ORDER BY revenue DESC;</div>Compared with the as-was report (File 3), East and South swap places: the movers carried their past sales with them. Neither view is wrong; they answer different questions.`},
{t:"sql",db:"saralstar",q:"Apply a type 2 change. Customer 120 moves to Kochi (city_key 2, state Kerala, region South) on 2026-10-01. Close the current row (valid_to '2026-09-30', is_current 0) and insert a new current row with <code>customer_key</code> 633 (the next free key), copying name, segment and signup_date, valid from 2026-10-01 to 9999-12-31.",
 answer:"UPDATE dim_customer SET valid_to = '2026-09-30', is_current = 0 WHERE cust_id = 120 AND is_current = 1; INSERT INTO dim_customer (customer_key, cust_id, cust_name, segment, signup_date, city_key, city_name, state, region, valid_from, valid_to, is_current) SELECT 633, cust_id, cust_name, segment, signup_date, 2, 'Kochi', 'Kerala', 'South', '2026-10-01', '9999-12-31', 1 FROM dim_customer WHERE cust_id = 120 AND valid_to = '2026-09-30'",
 check:"SELECT customer_key, cust_id, cust_name, segment, signup_date, city_key, city_name, state, region, valid_from, valid_to, is_current, (SELECT COUNT(*) FROM dim_customer) AS total_rows FROM dim_customer WHERE cust_id = 120 ORDER BY customer_key",rows:6,
 hint:"Two statements: UPDATE the open row, then INSERT … SELECT from that row so the unchanged attributes are copied.",why:`Customer 120 now has two rows: key 22 (Surat, closed 2026-09-30) and key 633 (Kochi, current).<div class="formula">UPDATE dim_customer
SET valid_to = '2026-09-30', is_current = 0
WHERE cust_id = 120 AND is_current = 1;

INSERT INTO dim_customer (customer_key, cust_id, cust_name, segment,
       signup_date, city_key, city_name, state, region,
       valid_from, valid_to, is_current)
SELECT 633, cust_id, cust_name, segment, signup_date,
       2, 'Kochi', 'Kerala', 'South',
       '2026-10-01', '9999-12-31', 1
FROM dim_customer
WHERE cust_id = 120 AND valid_to = '2026-09-30';</div>Real ETL wraps the pair in one transaction (Module 7), so no reader ever sees a customer with zero or two current rows.`},
{t:"sql",db:"saralstar",q:"Management decides that segment should have been type 1 after all. For every non-current row (<code>is_current = 0</code>), overwrite <code>segment</code> with the segment of the same customer's current row.",
 answer:"UPDATE dim_customer SET segment = (SELECT cur.segment FROM dim_customer cur WHERE cur.cust_id = dim_customer.cust_id AND cur.is_current = 1) WHERE is_current = 0",
 check:"SELECT customer_key, segment FROM dim_customer ORDER BY customer_key",rows:5,
 hint:"A correlated subquery in SET: for each old row, fetch the current row's segment by cust_id.",why:`The 14 upgraded customers now show Premium in both versions; their history is gone.<div class="formula">UPDATE dim_customer
SET segment = (SELECT cur.segment
               FROM dim_customer cur
               WHERE cur.cust_id = dim_customer.cust_id
                 AND cur.is_current = 1)
WHERE is_current = 0;</div>That is the price of type 1: a report of "Premium revenue in 2025" now includes sales made while these customers were Regular. The rows still exist because city remains type 2.<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite, where the correlated subquery may read the table being updated. MySQL refuses that (error 1093); write it as a self-join there: UPDATE dim_customer old JOIN dim_customer cur ON cur.cust_id = old.cust_id AND cur.is_current = 1 SET old.segment = cur.segment WHERE old.is_current = 0.</span></div>`},
{t:"sql",db:"saralstar",q:"Interview classic (customers with no orders). How many real customers (cust_id not NULL) have no fact rows under ANY of their versions? Return one number.",
 answer:"SELECT COUNT(DISTINCT c.cust_id) AS customers_without_orders FROM dim_customer c WHERE c.cust_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM fact_sales f JOIN dim_customer v ON v.customer_key = f.customer_key WHERE v.cust_id = c.cust_id)",
 hint:"Match facts to customers through cust_id (all versions), not through one customer_key.",why:`125 customers.<div class="formula">SELECT COUNT(DISTINCT c.cust_id) AS customers_without_orders
FROM dim_customer c
WHERE c.cust_id IS NOT NULL
  AND NOT EXISTS (SELECT 1
                  FROM fact_sales f
                  JOIN dim_customer v ON v.customer_key = f.customer_key
                  WHERE v.cust_id = c.cust_id);</div>Checking each row's own customer_key gives 136: it also counts versions without sales (for example a customer who ordered only after moving), which are not customers without orders.`},
{t:"mcq",q:"Which pairing of attribute and SCD type is the usual choice?",opts:["Correcting a misspelt name: type 1; the customer's region for historical sales reports: type 2","Correcting a misspelt name: type 2; region: type 1","Both type 1, because history is never needed","Both type 3, because it keeps every past value"],a:0,
 hint:"Would anyone want to report on the misspelling?",why:"A correction should replace the wrong value everywhere (type 1). A move is a real change, and past sales should stay where they happened (type 2). Type 3 keeps only one previous value, not the full history."}
]});

L.push({id:"l5",badge:"Cube Turner",code:"File 5",title:"Slice, dice, roll up, drill down",topics:"The data cube, roll-up, drill-down, slice, dice, pivot, subtotals with WITH ROLLUP and UNION ALL, GROUPING(), cube-style totals",
story:`<b>The Monday pack.</b> Finance wants one table with quarterly revenue, a subtotal for each year and a grand total at the bottom; the category team wants Lifestyle in North and South only; the CEO wants channels as columns. Devika Pillai, head of planning, calls them "views of the same cube" and asks you to produce all of them from the one fact table.`,
brief:`<p>Analysts picture a star schema as a <span class="term">data cube</span> (a multidimensional view): each axis is a dimension (product, region, quarter) and each cell holds a measure (revenue). <span class="term">OLAP (online analytical processing)</span> operations move around the cube:</p>
<div class="formula">roll-up     climb a hierarchy, fewer rows      month → quarter → year
drill-down  go down a hierarchy, more detail   department → category → product
slice       fix one dimension to one value     WHERE year_quarter = '2026-Q2'
dice        keep a sub-cube on several dims    WHERE department = 'Lifestyle'
                                                AND region IN ('North','South')
pivot       turn a dimension into columns      SUM(CASE WHEN channel_name = 'App' …)</div>
<p>In SQL (Structured Query Language), every level of the cube is a GROUP BY. Subtotals are rows from a coarser GROUP BY. MySQL adds them with <code>WITH ROLLUP</code>, which returns the detail rows, one subtotal per year (quarter shown as NULL) and a grand total (both NULL). <code>GROUPING(col)</code> returns 1 on rows where that column was rolled up, so a real NULL can be told apart from a subtotal marker.</p>
<div class="formula">-- MySQL 8.0
SELECT d.year, d.quarter, SUM(f.net_amount) AS revenue,
       GROUPING(d.quarter) AS is_subtotal
FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key
GROUP BY d.year, d.quarter WITH ROLLUP;

-- portable (and the way to write it here): one GROUP BY per level
SELECT d.year, d.quarter, SUM(f.net_amount) FROM … GROUP BY d.year, d.quarter
UNION ALL
SELECT d.year, NULL,      SUM(f.net_amount) FROM … GROUP BY d.year
UNION ALL
SELECT NULL,   NULL,      SUM(f.net_amount) FROM …;</div>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite, which has no ROLLUP, CUBE, GROUPING SETS or GROUPING(): write one GROUP BY per level and stack them with UNION ALL, adding a literal column such as 'subtotal' if you need a marker. MySQL 8.0 has WITH ROLLUP and GROUPING() but no CUBE or GROUPING SETS, so the UNION ALL pattern is also how MySQL produces cube-style totals (every combination of subtotals). Other systems offer GROUP BY CUBE(…) for that.</span></div>
<p>A <span class="term">pivot</span> uses conditional aggregation, which works everywhere: one <code>SUM(CASE WHEN … THEN … ELSE 0 END)</code> per output column.</p>`,
refs:"MySQL 8.0 Reference Manual, \"GROUP BY Modifiers\" (WITH ROLLUP) and \"Miscellaneous Functions\" (GROUPING()) · SQLite documentation, \"SELECT\" (sqlite.org/lang_select.html) · Laudon &amp; Laudon (2022), ch. 6 (multidimensional data analysis) and ch. 12 (drill down, pivot tables) · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020).",
lab:root=>{whLabCube(root);whOlapPanel(root);},
qs:[
{t:"sql",db:"saralstar",q:"Slice. Delivered revenue by <code>department</code> for the quarter 2026-Q2 only. Return department and revenue rounded to 2 decimals.",
 answer:"SELECT p.department, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key JOIN dim_date d ON d.date_key = f.date_key WHERE f.order_status = 'Delivered' AND d.year_quarter = '2026-Q2' GROUP BY p.department",
 hint:"Fix the date dimension with WHERE d.year_quarter = '2026-Q2'.",why:`Three rows; Home and Kitchen leads with ₹908,423.25.<div class="formula">SELECT p.department, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_product p ON p.product_key = f.product_key
JOIN dim_date d    ON d.date_key    = f.date_key
WHERE f.order_status = 'Delivered'
  AND d.year_quarter = '2026-Q2'
GROUP BY p.department;</div>A slice removes one axis of the cube by fixing it to a single value.`},
{t:"sql",db:"saralstar",q:"Dice. Delivered revenue for department 'Lifestyle', regions North and South, quarters 2026-Q2 and 2026-Q3 together, by region and category. Return region, category, revenue rounded to 2 decimals.",
 answer:"SELECT c.region, p.category, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key JOIN dim_customer c ON c.customer_key = f.customer_key JOIN dim_date d ON d.date_key = f.date_key WHERE f.order_status = 'Delivered' AND p.department = 'Lifestyle' AND c.region IN ('North', 'South') AND d.year_quarter IN ('2026-Q2', '2026-Q3') GROUP BY c.region, p.category",
 hint:"IN (…) for each dimension; mixing AND with OR without brackets is the classic mistake.",why:`Six cells: 2 regions × 3 Lifestyle categories.<div class="formula">SELECT c.region, p.category, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_product p  ON p.product_key  = f.product_key
JOIN dim_customer c ON c.customer_key = f.customer_key
JOIN dim_date d     ON d.date_key     = f.date_key
WHERE f.order_status = 'Delivered'
  AND p.department = 'Lifestyle'
  AND c.region IN ('North', 'South')
  AND d.year_quarter IN ('2026-Q2', '2026-Q3')
GROUP BY c.region, p.category;</div>Written as <code>… AND c.region = 'North' OR c.region = 'South' …</code>, AND binds first and South's sales of every department and quarter leak in.`},
{t:"sql",db:"saralstar",q:"Roll-up with subtotals (what MySQL's WITH ROLLUP returns). Delivered revenue by <code>year</code> and <code>quarter</code>, plus one subtotal row per year (quarter NULL) and a grand total row (year and quarter NULL). Return year, quarter, revenue rounded to 2 decimals; row order does not matter.",
 answer:"SELECT d.year, d.quarter, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key WHERE f.order_status = 'Delivered' GROUP BY d.year, d.quarter UNION ALL SELECT d.year, NULL, ROUND(SUM(f.net_amount), 2) FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key WHERE f.order_status = 'Delivered' GROUP BY d.year UNION ALL SELECT NULL, NULL, ROUND(SUM(f.net_amount), 2) FROM fact_sales f WHERE f.order_status = 'Delivered'",rows:7,
 hint:"Three SELECTs with GROUP BY year, quarter / GROUP BY year / no GROUP BY, joined with UNION ALL. Put NULL in the rolled-up columns.",why:`Eight rows: five quarters, two year subtotals (2025: ₹3,429,813.18; 2026: ₹5,039,665.94) and the grand total ₹8,469,479.12.<div class="formula">SELECT d.year, d.quarter, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key
WHERE f.order_status = 'Delivered'
GROUP BY d.year, d.quarter
UNION ALL
SELECT d.year, NULL, ROUND(SUM(f.net_amount), 2)
FROM fact_sales f JOIN dim_date d ON d.date_key = f.date_key
WHERE f.order_status = 'Delivered'
GROUP BY d.year
UNION ALL
SELECT NULL, NULL, ROUND(SUM(f.net_amount), 2)
FROM fact_sales f
WHERE f.order_status = 'Delivered';</div>In MySQL: <code>GROUP BY d.year, d.quarter WITH ROLLUP</code>. UNION ALL, not UNION: duplicates must not be removed.`},
{t:"sql",db:"saralstar",q:"Pivot. One row per region (dim_customer.region, leaving out 'Unknown'), with Delivered revenue in three columns App, Web, Phone (in that order), each rounded to 2 decimals. Return region, app, web, phone, sorted by region.",
 answer:"SELECT c.region, ROUND(SUM(CASE WHEN ch.channel_name = 'App' THEN f.net_amount ELSE 0 END), 2) AS app, ROUND(SUM(CASE WHEN ch.channel_name = 'Web' THEN f.net_amount ELSE 0 END), 2) AS web, ROUND(SUM(CASE WHEN ch.channel_name = 'Phone' THEN f.net_amount ELSE 0 END), 2) AS phone FROM fact_sales f JOIN dim_customer c ON c.customer_key = f.customer_key JOIN dim_channel ch ON ch.channel_key = f.channel_key WHERE f.order_status = 'Delivered' AND c.region <> 'Unknown' GROUP BY c.region ORDER BY c.region",ordered:true,
 hint:"GROUP BY region; one SUM(CASE WHEN channel_name = '…' THEN net_amount ELSE 0 END) per channel column.",why:`Six regions × three channel columns.<div class="formula">SELECT c.region,
  ROUND(SUM(CASE WHEN ch.channel_name = 'App'   THEN f.net_amount ELSE 0 END), 2) AS app,
  ROUND(SUM(CASE WHEN ch.channel_name = 'Web'   THEN f.net_amount ELSE 0 END), 2) AS web,
  ROUND(SUM(CASE WHEN ch.channel_name = 'Phone' THEN f.net_amount ELSE 0 END), 2) AS phone
FROM fact_sales f
JOIN dim_customer c ON c.customer_key = f.customer_key
JOIN dim_channel ch ON ch.channel_key = f.channel_key
WHERE f.order_status = 'Delivered' AND c.region &lt;&gt; 'Unknown'
GROUP BY c.region
ORDER BY c.region;</div>SQLite (and PostgreSQL) also accept <code>SUM(f.net_amount) FILTER (WHERE ch.channel_name = 'App')</code>; MySQL does not, so CASE is the portable form.`},
{t:"sql",db:"saralstar",q:"Cube-style totals. Delivered revenue by <code>channel_type</code> (dim_channel) and <code>department</code> (dim_product) with EVERY subtotal: each (type, department) pair, each type alone (department NULL), each department alone (type NULL), and the grand total (both NULL). Return channel_type, department, revenue rounded to 2 decimals; row order does not matter.",
 answer:"WITH b AS (SELECT ch.channel_type, p.department, f.net_amount FROM fact_sales f JOIN dim_channel ch ON ch.channel_key = f.channel_key JOIN dim_product p ON p.product_key = f.product_key WHERE f.order_status = 'Delivered') SELECT channel_type, department, ROUND(SUM(net_amount), 2) AS revenue FROM b GROUP BY channel_type, department UNION ALL SELECT channel_type, NULL, ROUND(SUM(net_amount), 2) FROM b GROUP BY channel_type UNION ALL SELECT NULL, department, ROUND(SUM(net_amount), 2) FROM b GROUP BY department UNION ALL SELECT NULL, NULL, ROUND(SUM(net_amount), 2) FROM b",rows:8,
 hint:"Put the joined, filtered rows in a CTE, then UNION ALL four GROUP BYs: (type, dept), (type), (dept), ().",why:`12 rows = 2 × 3 pairs + 2 + 3 + 1.<div class="formula">WITH b AS (SELECT ch.channel_type, p.department, f.net_amount
           FROM fact_sales f
           JOIN dim_channel ch ON ch.channel_key = f.channel_key
           JOIN dim_product p  ON p.product_key  = f.product_key
           WHERE f.order_status = 'Delivered')
SELECT channel_type, department, ROUND(SUM(net_amount), 2) FROM b
GROUP BY channel_type, department
UNION ALL SELECT channel_type, NULL, ROUND(SUM(net_amount), 2) FROM b GROUP BY channel_type
UNION ALL SELECT NULL, department, ROUND(SUM(net_amount), 2) FROM b GROUP BY department
UNION ALL SELECT NULL, NULL, ROUND(SUM(net_amount), 2) FROM b;</div>WITH ROLLUP would give only 9 of these rows: it never produces "department alone", because it removes columns from the right only. With n dimensions a full cube has 2ⁿ grouping levels.`},
{t:"sql",db:"saralstar",q:"Drill-down. Within department 'Home and Kitchen' and quarter 2026-Q3, Delivered revenue by <code>category</code> and month (<code>year_month</code>). Return category, year_month, revenue rounded to 2 decimals, sorted by category, then year_month.",
 answer:"SELECT p.category, d.year_month, ROUND(SUM(f.net_amount), 2) AS revenue FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key JOIN dim_date d ON d.date_key = f.date_key WHERE f.order_status = 'Delivered' AND p.department = 'Home and Kitchen' AND d.year_quarter = '2026-Q3' GROUP BY p.category, d.year_month ORDER BY p.category, d.year_month",ordered:true,
 hint:"Two hierarchies go one level down at once: department → category and quarter → month.",why:`Six rows: Home and Kitchen in July, August, September.<div class="formula">SELECT p.category, d.year_month, ROUND(SUM(f.net_amount), 2) AS revenue
FROM fact_sales f
JOIN dim_product p ON p.product_key = f.product_key
JOIN dim_date d    ON d.date_key    = f.date_key
WHERE f.order_status = 'Delivered'
  AND p.department = 'Home and Kitchen'
  AND d.year_quarter = '2026-Q3'
GROUP BY p.category, d.year_month
ORDER BY p.category, d.year_month;</div>Drilling down is just adding a finer column to GROUP BY; rolling up is removing one.`},
{t:"mcq",q:"In MySQL, a WITH ROLLUP query returns a row where <code>GROUPING(d.quarter) = 1</code>. What is that row?",opts:["A subtotal: quarter was rolled up, so the row totals all quarters of its year","A detail row for a quarter whose value is NULL in dim_date","An error row that ROLLUP could not compute","The first quarter of each year"],a:0,
 hint:"GROUPING() exists to tell a subtotal's NULL from a real NULL.",why:"GROUPING(col) is 1 on rows where col was aggregated away by ROLLUP and 0 on detail rows. SQLite has no GROUPING(); with the UNION ALL pattern, add a literal column such as 'subtotal' to each branch instead."}
]});

L.push({id:"l6",badge:"Board Reader",code:"File 6",title:"KPIs the board reads",topics:"KPIs, balanced scorecard, dashboards, average order value, return rate, contribution %, Pareto and ABC analysis, year-over-year and month-over-month growth",
story:`<b>The dashboard brief.</b> The board meets on Friday. Its chair, Mr Joseph Thomas, wants one screen: how big the business is, how healthy it is, which few products carry it, and whether this quarter beat last year's. "Not forty charts. A handful of numbers I can trust, and the ability to drill down when one looks odd."`,
brief:`<p>A <span class="term">KPI (key performance indicator)</span> is a number the firm's leadership has picked to track progress towards one of its goals. In the <span class="term">balanced scorecard</span> (Kaplan and Norton, 1992), KPIs cover four perspectives: financial, business process, customer, and learning and growth. A <span class="term">dashboard</span> shows a few KPIs on one screen, with <span class="term">drill-down</span> to the detail behind each (Laudon &amp; Laudon, ch. 12).</p>
<p>Every KPI needs a written definition, or two analysts will compute two numbers:</p>
<div class="formula">revenue              SUM(net_amount), Delivered lines
AOV (average order   revenue / COUNT(DISTINCT order_id)   -- orders, not lines
  value)
return rate %        100 × returned orders / (delivered + returned orders)
contribution %       100 × SUM(x) / SUM(SUM(x)) OVER ()
YoY (year-over-year) 100 × (this year − last year) / last year
MoM (month-over-month) the same with the previous month, via LAG()</div>
<p>Window functions (Module 5) do most of the work. <code>SUM(SUM(f.net_amount)) OVER ()</code> is the grand total placed next to each group: the inner SUM is the GROUP BY aggregate, the outer one is a window over all groups. A running total ordered by revenue gives the <span class="term">Pareto</span> curve: typically a minority of products earns most of the revenue. <span class="term">ABC analysis</span> labels them: class A up to 80% of cumulative revenue, B up to 95%, C the rest.</p>
<div class="formula">SUM(revenue) OVER (ORDER BY revenue DESC, product_key
                   ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  / SUM(revenue) OVER ()                         -- cumulative share</div>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game uses SQLite. Division of two integers truncates here: 100 * 7 / 120 is 5. MySQL's / returns a decimal (5.8333). Write 100.0 * … so both give the same answer. Window functions, LAG and frames work alike in MySQL 8.0 and SQLite 3.25 or later. For month labels, strftime('%Y-%m', full_date) here is DATE_FORMAT(full_date, '%Y-%m') in MySQL, though a date dimension already has year_month.</span></div>`,
refs:"Laudon &amp; Laudon (2022), ch. 12 \"Enhancing Decision Making\" (KPIs, the balanced scorecard, dashboards, drill down) · Kaplan &amp; Norton, \"The Balanced Scorecard: Measures That Drive Performance\", <i>Harvard Business Review</i> (1992) · SQLite documentation, \"Window Functions\" (sqlite.org/windowfunctions.html) · MySQL 8.0 Reference Manual, \"Window Functions\" · Molinaro &amp; de Graaf (2020).",
lab:root=>{whLabPareto(root);whConsole(root,"SELECT d.year_month, ROUND(SUM(f.net_amount), 2) AS revenue\nFROM fact_sales f\nJOIN dim_date d ON d.date_key = f.date_key\nWHERE f.order_status = 'Delivered'\nGROUP BY d.year_month\nORDER BY d.year_month;");},
qs:[
{t:"sql",db:"saralstar",q:"KPI tile: AOV (average order value) for Delivered orders = Delivered revenue / number of distinct Delivered orders. Return one number rounded to 2 decimals.",
 answer:"SELECT ROUND(SUM(net_amount) / COUNT(DISTINCT order_id), 2) AS aov FROM fact_sales WHERE order_status = 'Delivered'",
 hint:"Divide by COUNT(DISTINCT order_id), not by the number of lines.",why:`₹2,428.87 per order.<div class="formula">SELECT ROUND(SUM(net_amount) / COUNT(DISTINCT order_id), 2) AS aov
FROM fact_sales
WHERE order_status = 'Delivered';</div>AVG(net_amount) gives the average LINE value (about ₹1,088), because the fact grain is one order line.`},
{t:"sql",db:"saralstar",q:"Return rate by channel: 100 × (distinct Returned orders) / (distinct Delivered or Returned orders), rounded to 2 decimals. Return channel_name and return_rate_pct, sorted by channel_name.",
 answer:"SELECT ch.channel_name, ROUND(100.0 * COUNT(DISTINCT CASE WHEN f.order_status = 'Returned' THEN f.order_id END) / COUNT(DISTINCT CASE WHEN f.order_status IN ('Delivered', 'Returned') THEN f.order_id END), 2) AS return_rate_pct FROM fact_sales f JOIN dim_channel ch ON ch.channel_key = f.channel_key GROUP BY ch.channel_name ORDER BY ch.channel_name",ordered:true,
 hint:"COUNT(DISTINCT CASE WHEN … THEN order_id END) counts orders that meet a condition. Multiply by 100.0, not 100.",why:`App 5.87%, Phone 7.39%, Web 5.57%.<div class="formula">SELECT ch.channel_name,
  ROUND(100.0 * COUNT(DISTINCT CASE WHEN f.order_status = 'Returned'
                                    THEN f.order_id END)
        / COUNT(DISTINCT CASE WHEN f.order_status IN ('Delivered', 'Returned')
                              THEN f.order_id END), 2) AS return_rate_pct
FROM fact_sales f
JOIN dim_channel ch ON ch.channel_key = f.channel_key
GROUP BY ch.channel_name
ORDER BY ch.channel_name;</div>With 100 instead of 100.0, SQLite divides two integers and truncates (5 instead of 5.83); MySQL would not.`},
{t:"sql",db:"saralstar",q:"Contribution %. Each <code>category</code>'s Delivered revenue and its share of the total. Return category, revenue rounded to 2 decimals, share_pct rounded to 2 decimals, highest revenue first.",
 answer:"SELECT p.category, ROUND(SUM(f.net_amount), 2) AS revenue, ROUND(100.0 * SUM(f.net_amount) / SUM(SUM(f.net_amount)) OVER (), 2) AS share_pct FROM fact_sales f JOIN dim_product p ON p.product_key = f.product_key WHERE f.order_status = 'Delivered' GROUP BY p.category ORDER BY revenue DESC",ordered:true,
 hint:"SUM(SUM(f.net_amount)) OVER () is the grand total next to every group.",why:`Kitchen (26.62%) and Home (24.64%) together earn just over half of the revenue.<div class="formula">SELECT p.category,
