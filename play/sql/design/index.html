 hint:"Partial: a non-key column decided by part of the composite key.",why:"city depends on learner_id alone, half of the key. enrolled_on needs both halves (full dependency). city → state and instructor_id → instructor_email have non-key determinants: transitive dependencies, the subject of third normal form (File 7)."},
{t:"mcq",q:"Which chain is a <b>transitive</b> dependency in enrolment_flat?",opts:["course_code → instructor_id → instructor_email","learner_id → learner_name","(learner_id, course_code) → batch_code","learner_id → course_code"],a:0,
 hint:"Transitive: key → non-key column → another non-key column.",why:"course_code (part of the key) determines instructor_id, a non-key column, which in turn determines the email. learner_id → course_code does not even hold: a learner takes several courses."},
{t:"sql",db:DBN,q:"Is full_name a candidate key of learners? Interview classic (duplicates): list each full_name shared by more than one learner, with how many learners have it, sorted by full_name.",answer:"SELECT full_name, COUNT(*) FROM learners GROUP BY full_name HAVING COUNT(*) > 1 ORDER BY full_name",ordered:true,
 hint:"GROUP BY full_name HAVING COUNT(*) > 1.",why:`<code>SELECT full_name, COUNT(*) FROM learners GROUP BY full_name HAVING COUNT(*) &gt; 1 ORDER BY full_name;</code> returns eight names shared by two learners each. Here the data disproves full_name → learner_id; even if it had returned nothing, people can share a name, so a name is never a key.`},
{t:"sql",db:DBN,q:"Test city → state in <code>enrolment_flat</code>: return the number of cities that appear with more than one state (one number).",answer:"SELECT COUNT(*) FROM (SELECT city FROM enrolment_flat GROUP BY city HAVING COUNT(DISTINCT state) > 1) AS bad",
 hint:"Wrap the GROUP BY … HAVING test in a subquery and count its rows.",why:`<code>SELECT COUNT(*) FROM (SELECT city FROM enrolment_flat GROUP BY city HAVING COUNT(DISTINCT state) &gt; 1) AS bad;</code> gives 0: no counter-example. (The alias AS bad is optional here; MySQL requires every subquery in FROM to have one.) The rule holds in this data, and it holds in the business too (a city is in one state), which is why File 7 moves it into its own table.`},
{t:"mcq",q:"LearnSphere launches AI Literacy (AI101) next month, with an instructor but no learners yet. It cannot be recorded in enrolment_flat. Which anomaly is this?",opts:["An insert anomaly","An update anomaly","A delete anomaly","No anomaly: courses without learners should not be stored"],a:0,
 hint:"You are trying to add a fact and the table will not let you.",why:"Every row of enrolment_flat is an enrolment, and its key needs a learner_id, so a course alone has nowhere to go (the lab shows the real NOT NULL error). The catalogue then lives in a separate spreadsheet, and there are two versions of the truth."}
]});

L.push({id:"l7",badge:"Decomposer",code:"File 7",title:"Taking it apart: 1NF to BCNF",topics:"First, second and third normal form, Boyce–Codd normal form; decomposition with CREATE TABLE … AS SELECT DISTINCT; lossless join and how to verify it; dependency preservation; splitting multi-valued cells; denormalisation",
story:`<b>Retiring the register.</b> The platform team finally gets permission to replace the legacy register with proper tables. The rule from the head of data is short: nothing may be lost, and every fact must end up in exactly one place. You will take the sheet apart one normal form at a time, and then prove, with a query rather than a promise, that joining the pieces gives back exactly the rows you started with.`,
brief:`<p><span class="term">Normalisation</span> reorganises tables so that each fact is stored once. Each <span class="term">normal form</span> (NF) removes one kind of trouble (Codd defined the first three in 1970 and 1971; Boyce–Codd normal form, a stricter 3NF, followed in 1974):</p>
<div class="formula">1NF   every cell holds one value; no repeating groups; rows have a key
2NF   1NF, and no non-key column depends on part of a composite key
3NF   2NF, and no non-key column depends on another non-key column
BCNF  for every non-trivial FD X → Y, X is a super key
      ("every determinant is a candidate key")</div>
<p>The usual memory aid for 3NF: every non-key column depends on the key, the whole key, and nothing but the key. <code>enrolment_sheet</code> breaks 1NF: course_codes holds 'SQL101, VZ201'. Splitting gives <code>enrolment_flat</code>, one row per (learner, course), which is in 1NF but has partial dependencies (learner details on learner_id alone) and transitive ones (state on city; instructor email on instructor_id). Each dependency becomes its own table, keyed by its determinant:</p>
<div class="formula">CREATE TABLE ls_city       AS SELECT DISTINCT city, state FROM enrolment_flat;
CREATE TABLE ls_learner    AS SELECT DISTINCT learner_id, learner_name, learner_phone, city FROM enrolment_flat;
CREATE TABLE ls_instructor AS SELECT DISTINCT instructor_id, instructor_name, instructor_email FROM enrolment_flat;
CREATE TABLE ls_course     AS SELECT DISTINCT course_code, course_title, course_fee, instructor_id FROM enrolment_flat;
CREATE TABLE ls_batch      AS SELECT DISTINCT batch_code, batch_slot FROM enrolment_flat;
CREATE TABLE ls_enrol      AS SELECT learner_id, course_code, batch_code, enrolled_on FROM enrolment_flat;</div>
<p>A split of R into R1 and R2 is a <span class="term">lossless join</span> decomposition when joining them gives back exactly R. It is guaranteed when the shared columns are a key of R1 or of R2 (city is the key of ls_city, so splitting off city → state is safe). Split on a column that is a key of neither and the join invents <span class="term">spurious rows</span>. Verify in SQL: the original EXCEPT the re-join, and the re-join EXCEPT the original, must both be empty. A decomposition also should preserve dependencies, so each rule can be checked in one table; 3NF can always manage both, BCNF sometimes cannot.</p>
<p>BCNF bites when a table has overlapping candidate keys. In <code>mentoring (learner_id, subject, mentor)</code> the key is (learner_id, subject), and each mentor teaches one subject: mentor → subject. Every column is prime, so it is in 3NF, but mentor is not a key, so it is not in BCNF. Split it into mentor_subject (mentor, subject) and learner_mentor (learner_id, mentor).</p>
<p>Fix the data before you split it: Kabir Rao's two emails would produce two instructor rows for one id. And <span class="term">denormalisation</span>, putting redundancy back on purpose for fast reading, is the warehouse's trade (Module 8): normalise for clean writes, denormalise for fast reads.</p>
${MN("All of this is standard SQL; CREATE TABLE … AS SELECT, SELECT DISTINCT and EXCEPT run the same in MySQL 8.0 (EXCEPT needs 8.0.31 or later; before that use NOT EXISTS). Splitting a comma-separated cell is product-specific: here a recursive CTE (common table expression) with instr() and substr(), or json_each(); MySQL 8.0 has recursive CTEs too (with LOCATE and SUBSTRING) and JSON_TABLE. MySQL's CTAS keeps NOT NULL but, like SQLite's, drops keys and foreign keys, so add them afterwards with ALTER TABLE; in SQLite that means writing CREATE TABLE with constraints and then INSERT … SELECT.")}`,
refs:"Codd, <i>Communications of the ACM</i> 13(6) (1970) · Elmasri & Navathe (2016), chapters on functional dependencies and normalisation, and on relational database design algorithms · Silberschatz, Korth & Sudarshan (2019), chapter <i>Relational Database Design</i> · Ramakrishnan & Gehrke (2003), chapter <i>Schema Refinement and Normal Forms</i> · SQLite documentation: <i>The WITH Clause</i> (sqlite.org/lang_with.html).",
lab:root=>{labDecompose(root);},
qs:[
{t:"sql",db:DBN,q:"Which rows of <code>enrolment_sheet</code> break 1NF in the course_codes column (more than one code in the cell)? Return sheet_row and learner_name, by sheet_row.",answer:"SELECT sheet_row, learner_name FROM enrolment_sheet WHERE course_codes LIKE '%,%' ORDER BY sheet_row",ordered:true,
 hint:"A comma inside the cell means a list.",why:`<code>SELECT sheet_row, learner_name FROM enrolment_sheet WHERE course_codes LIKE '%,%' ORDER BY sheet_row;</code> gives 15 of the 24 rows. A query such as SUM(course_fees) on this sheet silently reads only the first number of each list.`},
{t:"sql",db:DBN,q:"Split the cells: return one row per (sheet_row, course code) from <code>enrolment_sheet.course_codes</code> (codes are separated by a comma and a space). Two columns, sorted by sheet_row, then code.",
 starter:"WITH RECURSIVE split(sheet_row, code, rest) AS (\n  SELECT sheet_row, '', course_codes || ', ' FROM enrolment_sheet\n  UNION ALL\n  SELECT sheet_row, substr(rest, 1, instr(rest, ', ') - 1), substr(rest, instr(rest, ', ') + 2)\n  FROM split WHERE rest <> ''\n)\nSELECT ...",rows:7,
 answer:"WITH RECURSIVE split(sheet_row, code, rest) AS (SELECT sheet_row, '', course_codes || ', ' FROM enrolment_sheet UNION ALL SELECT sheet_row, substr(rest, 1, instr(rest, ', ') - 1), substr(rest, instr(rest, ', ') + 2) FROM split WHERE rest <> '') SELECT sheet_row, code FROM split WHERE code <> '' ORDER BY sheet_row, code",ordered:true,
 hint:"The starter peels one code off rest per step. Finish with SELECT sheet_row, code FROM split WHERE code <> '' ORDER BY sheet_row, code.",why:`The recursive CTE (common table expression, Module 4) peels the first code off the remaining text in each step; the anchor row has an empty code, which the final WHERE drops. 43 rows come out, exactly the number of rows in enrolment_flat: the 1NF version of the sheet. Shorter but product-specific: <code>SELECT sheet_row, value FROM enrolment_sheet, json_each('["' || replace(course_codes, ', ', '","') || '"]') ORDER BY 1, 2</code>.${MN("Here || joins text. In MySQL || means OR by default, so write CONCAT(course_codes, ', '); substr and instr exist there too (or SUBSTRING and LOCATE). MySQL has no json_each; its JSON_TABLE() does the same job.")}`},
{t:"sql",db:DBN,q:"2NF, part one. Create <code>ls_learner</code> with learner_id, learner_name, learner_phone and city (in that order), one row per learner, from enrolment_flat.",answer:"CREATE TABLE ls_learner AS SELECT DISTINCT learner_id, learner_name, learner_phone, city FROM enrolment_flat",
 check:"SELECT * FROM ls_learner ORDER BY learner_id",ordered:true,
 hint:"CREATE TABLE ... AS SELECT DISTINCT ...",why:`<code>CREATE TABLE ls_learner AS SELECT DISTINCT learner_id, learner_name, learner_phone, city FROM enrolment_flat;</code> 43 rows collapse to 24 learners. state stays out: it depends on city, not on the learner (the 3NF step puts it in ls_city).`},
{t:"sql",db:DBN,setup:"UPDATE enrolment_flat SET instructor_email = 'kabir.rao@learnsphere.example' WHERE instructor_id = 2;",
 q:"The setup has repaired Kabir Rao's email. Break the transitive chain course_code → instructor_id → instructor details: create <code>ls_instructor</code> (instructor_id, instructor_name, instructor_email) and <code>ls_course</code> (course_code, course_title, course_fee, instructor_id), one row per instructor and per course.",
 answer:"CREATE TABLE ls_instructor AS SELECT DISTINCT instructor_id, instructor_name, instructor_email FROM enrolment_flat; CREATE TABLE ls_course AS SELECT DISTINCT course_code, course_title, course_fee, instructor_id FROM enrolment_flat;",
 check:"SELECT 'i', instructor_id, instructor_name, instructor_email FROM ls_instructor UNION ALL SELECT 'c', course_code, course_title, course_fee || ' / ' || instructor_id FROM ls_course ORDER BY 1, 2",ordered:true,
 hint:"Two CREATE TABLE … AS SELECT DISTINCT statements.",why:`<code>CREATE TABLE ls_instructor AS SELECT DISTINCT instructor_id, instructor_name, instructor_email FROM enrolment_flat; CREATE TABLE ls_course AS SELECT DISTINCT course_code, course_title, course_fee, instructor_id FROM enrolment_flat;</code> gives 5 instructors and 6 courses. Each email now lives in one row. Without the repair, ls_instructor would get two rows for instructor 2, and a PRIMARY KEY on instructor_id would refuse the second.`},
{t:"sql",db:DBN,setup:"UPDATE enrolment_flat SET instructor_email = 'kabir.rao@learnsphere.example' WHERE instructor_id = 2; CREATE TABLE ls_city AS SELECT DISTINCT city, state FROM enrolment_flat; CREATE TABLE ls_learner AS SELECT DISTINCT learner_id, learner_name, learner_phone, city FROM enrolment_flat; CREATE TABLE ls_instructor AS SELECT DISTINCT instructor_id, instructor_name, instructor_email FROM enrolment_flat; CREATE TABLE ls_course AS SELECT DISTINCT course_code, course_title, course_fee, instructor_id FROM enrolment_flat; CREATE TABLE ls_batch AS SELECT DISTINCT batch_code, batch_slot FROM enrolment_flat; CREATE TABLE ls_enrol AS SELECT learner_id, course_code, batch_code, enrolled_on FROM enrolment_flat;",
 q:"The setup has built the six 3NF tables listed in the theory (ls_city, ls_learner, ls_instructor, ls_course, ls_batch, ls_enrol). Prove nothing was lost: re-join them to rebuild all 14 columns of enrolment_flat, in its column order (learner_id, course_code, learner_name, learner_phone, city, state, course_title, course_fee, instructor_id, instructor_name, instructor_email, batch_code, batch_slot, enrolled_on), sorted by learner_id, then course_code.",rows:6,
 answer:"SELECT e.learner_id, e.course_code, l.learner_name, l.learner_phone, l.city, c.state, co.course_title, co.course_fee, co.instructor_id, i.instructor_name, i.instructor_email, e.batch_code, b.batch_slot, e.enrolled_on FROM ls_enrol AS e JOIN ls_learner AS l ON l.learner_id = e.learner_id JOIN ls_city AS c ON c.city = l.city JOIN ls_course AS co ON co.course_code = e.course_code JOIN ls_instructor AS i ON i.instructor_id = co.instructor_id JOIN ls_batch AS b ON b.batch_code = e.batch_code ORDER BY e.learner_id, e.course_code",ordered:true,
 hint:"Start from ls_enrol; join learner on learner_id, city on city, course on course_code, instructor on instructor_id, batch on batch_code.",why:`Start from ls_enrol and join each table on its key: learner_id, then city, course_code, instructor_id, batch_code. 43 rows come back, identical to the repaired register. The formal proof: <code>SELECT COUNT(*) FROM (SELECT * FROM enrolment_flat EXCEPT SELECT … the re-join …) AS diff</code> is 0, and so is the reverse EXCEPT.`},
{t:"num",q:"A wrong split: suppose enrolment_flat were broken into A = (learner_id, city) and B = (city, course_code), each with DISTINCT rows, and then joined back on city. How many rows would the join produce? (The original has 43.)",a:105,tol:0,ph:"e.g. 60",
 hint:"Run it: SELECT COUNT(*) FROM (SELECT DISTINCT learner_id, city FROM enrolment_flat) a JOIN (SELECT DISTINCT city, course_code FROM enrolment_flat) b USING (city).",why:"105 rows instead of 43: every learner in a city is paired with every course anyone in that city took. city is a key of neither A nor B, so the join invents 62 spurious rows. Decompositions on a non-key never lose rows; they add rows that were never true."},
{t:"sql",db:DBN,q:"BCNF. In mentoring (learner_id, subject, mentor) the key is (learner_id, subject) and mentor → subject. Create <code>mentor_subject</code> (mentor PRIMARY KEY, subject NOT NULL) and <code>learner_mentor</code> (learner_id, mentor, PRIMARY KEY (learner_id, mentor)), and fill both from mentoring.",
 answer:"CREATE TABLE mentor_subject (mentor TEXT PRIMARY KEY, subject TEXT NOT NULL); CREATE TABLE learner_mentor (learner_id INTEGER, mentor TEXT REFERENCES mentor_subject(mentor), PRIMARY KEY (learner_id, mentor)); INSERT INTO mentor_subject SELECT DISTINCT mentor, subject FROM mentoring; INSERT INTO learner_mentor SELECT learner_id, mentor FROM mentoring;",
 check:"SELECT 'ms', mentor, subject FROM mentor_subject UNION ALL SELECT 'lm', learner_id, mentor FROM learner_mentor ORDER BY 1, 2, 3",ordered:true,
 hint:"Create both tables with their keys, then two INSERT … SELECT statements (DISTINCT for mentor_subject).",why:`Create mentor_subject (mentor TEXT PRIMARY KEY, subject TEXT NOT NULL) and learner_mentor (learner_id INTEGER, mentor TEXT REFERENCES mentor_subject(mentor), PRIMARY KEY (learner_id, mentor)), then <code>INSERT INTO mentor_subject SELECT DISTINCT mentor, subject FROM mentoring; INSERT INTO learner_mentor SELECT learner_id, mentor FROM mentoring;</code> Six mentor facts are now stored once each, and a new mentor can be recorded before anyone is assigned. The price: the rule "a learner has one mentor per subject" can no longer be checked inside one table, a loss of dependency preservation.`}
]});

L.push({id:"l8",badge:"Modeller",code:"File 8",title:"From whiteboard to tables: ER modelling",topics:"Entities, attributes and relationships; cardinality and participation; Chen and crow's-foot notation; mapping 1:1, 1:N and M:N relationships, weak entities, multi-valued attributes and recursive relationships to tables",
story:`<b>The next feature.</b> Product has a whiteboard full of boxes: instructor profiles, wishlists, prerequisites, a support desk. Your job is the translation: from the whiteboard's entities and lines to tables, keys and foreign keys that enforce exactly the rules drawn, no more and no less. Get a cardinality backwards and the database will forbid something the business needs, or allow something it must not.`,
brief:`<p>The <span class="term">Entity–Relationship</span> (ER) model (Chen, 1976) describes data before tables exist. An <span class="term">entity</span> is a thing with its own identity (LEARNER, COURSE). An <span class="term">attribute</span> describes it: simple, composite (an address), multi-valued (a learner's several phones) or derived (age from date of birth: store the date, compute the age). A <span class="term">relationship</span> connects entities (a learner ENROLS IN a course) and may have attributes of its own (enrolled_on). A <span class="term">weak entity</span> has no identity of its own: lesson 3 exists in every course, so a LESSON is identified by its course plus its number.</p>
<p><span class="term">Cardinality</span> says how many: 1:1, 1:N or M:N. Ask in both directions: can one learner take many courses? Yes. Can one course have many learners? Yes. So M:N. <span class="term">Participation</span> says whether every instance must take part: every course must have an instructor (total, drawn as a double line in Chen notation) but a learner may have no enrolment yet (partial). Chen notation draws entities as rectangles, relationships as diamonds and attributes as ovals; crow's-foot notation, common in tools, marks "many" with a three-pronged foot and "one" with a bar.</p>
<div class="formula">entity                    → table; key attribute → PRIMARY KEY
1:N  (instructor teaches course) → FK on the N side: courses.instructor_id
      total participation of the N side → that FK is NOT NULL
1:1  (instructor has profile)    → FK with UNIQUE, or share the primary key
M:N  (learner enrols in course)  → junction table enrolments(learner_id, course_id,
                                    enrolled_on, ...) with PRIMARY KEY (learner_id, course_id)
weak entity (lesson of course)   → PRIMARY KEY (course_id, lesson_no), FK ON DELETE CASCADE
multi-valued attribute (phones)  → own table learner_phones(learner_id, phone)
recursive M:N (course requires course) → course_prereqs(course_id, prereq_id), both FKs to courses
recursive 1:N (agent supervises agent) → supervisor_id column referencing the same table</div>
<p>The most common mistake is putting the foreign key on the "one" side: a course_id column in instructors would let each instructor teach one course. The second is storing M:N as course1, course2, course3 columns, which breaks 1NF and fails the learner with four courses.</p>
${MN("The DDL that an ER diagram becomes is the same in MySQL, with MySQL types (INT AUTO_INCREMENT, VARCHAR(n), DATE) and with every foreign key written as a table-level FOREIGN KEY (col) REFERENCES parent(key) clause: MySQL 8.0 parses a REFERENCES placed after a column's type but ignores it, while SQLite enforces both forms. One more difference matters for M:N junction tables: in MySQL each foreign key needs an index on the child column, and InnoDB creates one automatically if none exists; SQLite does not require one, but queries that follow the relationship are faster with an index (Module 7).")}`,
refs:"Chen, <i>ACM Transactions on Database Systems</i> 1(1) (1976) · Elmasri & Navathe (2016), chapters <i>Data Modeling Using the Entity–Relationship (ER) Model</i> and <i>Relational Database Design by ER- and EER-to-Relational Mapping</i> · Silberschatz, Korth & Sudarshan (2019), chapter <i>Database Design Using the E-R Model</i> · Laudon & Laudon (2022), ch. 6.",
lab:root=>{labER(root);},
qs:[
{t:"mcq",q:"One instructor teaches many courses; each course has exactly one instructor. Where does the foreign key go?",opts:["courses.instructor_id, NOT NULL, referring to instructors","instructors.course_id, referring to courses","A junction table instructor_course(instructor_id, course_id)","Both tables get a foreign key to each other"],a:0,
 hint:"Which side can there be many of?",why:"In a 1:N relationship the N side carries the key of the 1 side. NOT NULL encodes total participation (every course has an instructor). A course_id column in instructors would allow only one course per instructor; a junction table would wrongly allow several instructors per course."},
{t:"sql",db:DBN,q:"1:1. Each instructor has at most one profile, and each profile belongs to exactly one instructor. Create <code>instructor_profiles</code>: profile_id INTEGER PRIMARY KEY; instructor_id INTEGER, compulsory, unique, referring to instructors(instructor_id) with ON DELETE CASCADE; bio TEXT; website TEXT.",
 answer:"CREATE TABLE instructor_profiles (profile_id INTEGER PRIMARY KEY, instructor_id INTEGER NOT NULL UNIQUE REFERENCES instructors(instructor_id) ON DELETE CASCADE, bio TEXT, website TEXT)",
 check:"INSERT OR IGNORE INTO instructor_profiles (profile_id, instructor_id, bio) VALUES (1, 3, 'first'), (2, 3, 'second'), (3, 4, 'third'), (4, NULL, 'nobody'); SELECT profile_id, instructor_id, bio FROM instructor_profiles UNION ALL SELECT \"table\", \"from\", on_delete FROM pragma_foreign_key_list('instructor_profiles')",
 hint:"instructor_id INTEGER NOT NULL UNIQUE REFERENCES instructors(instructor_id) ON DELETE CASCADE.",why:`<code>CREATE TABLE instructor_profiles (profile_id INTEGER PRIMARY KEY, instructor_id INTEGER NOT NULL UNIQUE REFERENCES instructors(instructor_id) ON DELETE CASCADE, bio TEXT, website TEXT);</code> UNIQUE turns a 1:N foreign key into 1:1: the checker's second profile for instructor 3 is rejected, and so is a profile for nobody. The other design makes instructor_id itself the primary key of the profile table (the lab draws that one).`},
{t:"sql",db:DBN,q:"M:N. A learner can wishlist many courses and a course can be on many wishlists. Create <code>wishlist</code>: learner_id and course_id, both INTEGER NOT NULL, referring to learners and courses with ON DELETE CASCADE; added_on TEXT; and a composite primary key on (learner_id, course_id).",
 answer:"CREATE TABLE wishlist (learner_id INTEGER NOT NULL REFERENCES learners(learner_id) ON DELETE CASCADE, course_id INTEGER NOT NULL REFERENCES courses(course_id) ON DELETE CASCADE, added_on TEXT, PRIMARY KEY (learner_id, course_id))",
 check:"INSERT OR IGNORE INTO wishlist (learner_id, course_id) VALUES (1, 101), (1, 101), (1, 102), (2, 101); SELECT learner_id, course_id, added_on FROM wishlist UNION ALL SELECT \"table\", \"from\", on_delete FROM pragma_foreign_key_list('wishlist')",
 hint:"Two column FKs and a table-level PRIMARY KEY (learner_id, course_id).",why:`<code>CREATE TABLE wishlist (learner_id INTEGER NOT NULL REFERENCES learners(learner_id) ON DELETE CASCADE, course_id INTEGER NOT NULL REFERENCES courses(course_id) ON DELETE CASCADE, added_on TEXT, PRIMARY KEY (learner_id, course_id));</code> The composite key is the business rule "a course is on a wishlist at most once": the checker's duplicate (1, 101) is ignored. A M:N relationship always becomes two 1:N relationships through a junction table.`},
{t:"sql",db:DBN,q:"Interview classic (self-join through a recursive relationship). List every course together with each of its prerequisites: the course's title and the prerequisite's title, sorted by course title, then prerequisite title.",
 answer:"SELECT c.title, p.title FROM course_prereqs AS cp JOIN courses AS c ON c.course_id = cp.course_id JOIN courses AS p ON p.course_id = cp.prereq_id ORDER BY c.title, p.title",ordered:true,
 hint:"Join courses twice, with two aliases: once on course_id, once on prereq_id.",why:`<code>SELECT c.title, p.title FROM course_prereqs cp JOIN courses c ON c.course_id = cp.course_id JOIN courses p ON p.course_id = cp.prereq_id ORDER BY c.title, p.title;</code> gives 12 pairs. COURSE relates to itself, so one table plays two roles, and each role needs its own alias.`},
{t:"sql",db:DBN,q:"Interview classic (both of two). Through the junction table, find the learners enrolled in both SQL Basics (course 101) and Python Foundations (course 103): learner_id and full_name, by learner_id.",
 answer:"SELECT l.learner_id, l.full_name FROM learners AS l WHERE l.learner_id IN (SELECT learner_id FROM enrolments WHERE course_id = 101) AND l.learner_id IN (SELECT learner_id FROM enrolments WHERE course_id = 103) ORDER BY l.learner_id",ordered:true,
 hint:"Two IN subqueries; or INTERSECT (MySQL 8.0.31 or later); or GROUP BY learner_id HAVING COUNT(DISTINCT course_id) = 2 over course_id IN (101, 103).",why:`<code>SELECT learner_id, full_name FROM learners WHERE learner_id IN (SELECT learner_id FROM enrolments WHERE course_id = 101) AND learner_id IN (SELECT learner_id FROM enrolments WHERE course_id = 103) ORDER BY learner_id;</code> A single WHERE course_id = 101 AND course_id = 103 on enrolments finds nothing: no single row has two course ids.`},
{t:"sql",db:DBN,q:"Lessons are a weak entity, keyed by (course_id, lesson_no). Find the courses whose lessons add up to more than 300 minutes: course_code, title, number of lessons and total minutes, sorted by total minutes from highest, then course_code.",
 answer:"SELECT c.course_code, c.title, COUNT(*) AS lessons, SUM(l.minutes) AS total_minutes FROM courses AS c JOIN lessons AS l ON l.course_id = c.course_id GROUP BY c.course_id, c.course_code, c.title HAVING SUM(l.minutes) > 300 ORDER BY total_minutes DESC, c.course_code",ordered:true,
 hint:"JOIN lessons, GROUP BY the course, HAVING SUM(minutes) > 300.",why:`<code>SELECT c.course_code, c.title, COUNT(*), SUM(l.minutes) FROM courses c JOIN lessons l ON l.course_id = c.course_id GROUP BY c.course_id, c.course_code, c.title HAVING SUM(l.minutes) &gt; 300 ORDER BY SUM(l.minutes) DESC, c.course_code;</code> The weak entity's key starts with its owner's key, which is why every lesson row can be joined to exactly one course.`},

const BOARD=[
{t:"mcq",q:"Which MySQL column type should hold a course fee such as 4999.50?",opts:["DECIMAL(10,2)","FLOAT","VARCHAR(10)","INT"],a:0,why:"DECIMAL stores exact decimal values, which money needs; FLOAT is approximate binary floating point, VARCHAR cannot be summed reliably, and INT loses the paise. SQLite has no exact decimal type: there, round results or store whole paise as INTEGER."},
{t:"mcq",q:"Which statement about UNIQUE and PRIMARY KEY is true in standard SQL?",opts:["A PRIMARY KEY is unique and never NULL; a UNIQUE column may hold several NULLs","Both forbid NULLs","A table may have several PRIMARY KEYs but only one UNIQUE column","UNIQUE allows exactly one NULL"],a:0,why:"Entity integrity: the primary key identifies every row, so it is unique and not NULL. UNIQUE enforces an alternate key and, because NULL is never equal to NULL, allows many NULLs (in both MySQL and SQLite)."},
{t:"num",q:"R(A, B, C, D, E) has the dependencies A → B, B → C and (A, D) → E. How many attributes are in the closure {A}⁺?",a:3,tol:0,why:"{A}⁺ starts as {A}; A → B adds B; B → C adds C; (A, D) → E needs D, which A does not reach. So {A}⁺ = {A, B, C}: 3 attributes. {A, D}⁺ is all five, so (A, D) is a key."},
{t:"mcq",q:"In MySQL, how does TRUNCATE TABLE t differ from DELETE FROM t?",opts:["TRUNCATE is DDL: it empties the whole table at once, cannot take a WHERE and resets the AUTO_INCREMENT counter","TRUNCATE keeps the rows and removes the columns","TRUNCATE can delete selected rows faster than DELETE","They are identical"],a:0,why:"DELETE is DML, row by row, and may have a WHERE; TRUNCATE drops and recreates the table's contents, resets AUTO_INCREMENT and commits immediately. SQLite has no TRUNCATE: write DELETE FROM t without a WHERE."},
{t:"mcq",q:"How is a many-to-many relationship between learners and courses stored?",opts:["A junction table holding both keys, with a composite primary key on the pair","A course_id column in learners","Columns course1, course2, course3 in learners","A comma-separated list of course codes in learners"],a:0,why:"The junction table turns M:N into two 1:N relationships, carries the relationship's own attributes (enrolled_on, status) and its composite key forbids enrolling twice. The other options break 1NF or allow only one course."},
{t:"mcq",q:"A table is in 3NF but not in BCNF. What must be true?",opts:["Some determinant is not a super key, and the column it determines is prime (part of a candidate key)","It has a repeating group","A non-key column depends on part of the key","It has no candidate key"],a:0,why:"3NF allows X → A when A is prime; BCNF does not. The classic case is mentor → subject in mentoring(learner_id, subject, mentor), where subject belongs to the key (learner_id, subject)."},
{t:"mcq",q:"R(A, B, C) is split into R1(A, B) and R2(B, C). When is the join of R1 and R2 guaranteed to give back exactly R?",opts:["When B is a key of R1 or of R2 (B → A or B → C holds)","Always, because no column was dropped","Only when A is the key of R","Never: decompositions always lose rows"],a:0,why:"The shared columns must determine one side (Heath's theorem). Otherwise the join pairs rows that never belonged together and adds spurious rows; it never loses rows, it invents them."},
{t:"num",q:"A learner has 3 enrolments, each with 2 payments. enrolments references learners ON DELETE CASCADE, and payments references enrolments ON DELETE CASCADE. How many rows in total does DELETE FROM learners WHERE learner_id = … remove, counting the learner?",a:10,tol:0,why:"1 learner + 3 enrolments + 3 × 2 payments = 10 rows, from one statement. CASCADE ripples through every level."}
];

const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const lerp=(a,b,t)=>a+(b-a)*t;

/* A step player: Play/Pause, Step, Speed, Reset. render(i,t): i steps completed, t = progress of step i+1. */
function Player(root,o){
  const box=el("div",{class:"flow"});root.appendChild(box);
  const bar=el("div",{class:"flowbar"});box.appendChild(bar);
  bar.appendChild(SB.text("span",o.title,"eyebrow"));
  const ct=el("div",{class:"ctrls"});bar.appendChild(ct);
  const play=btn(ct,"Play"),stepB=btn(ct,"Step",true),sp=el("span");ct.appendChild(sp);const rs=btn(ct,"Reset",true);
  const stage=el("div",{class:"stage"});box.appendChild(stage);
  let i=0,t=0,playing=false,speed=1,run=null,n=o.n;
  const show=()=>o.render(i,t);
  function label(){play.textContent=playing?"Pause":(i>=n?"Replay":"Play");}
  function setPlay(v){playing=v;if(v&&!run)run=loop(frame);if(!v&&run){run.stop();run=null;}label();}
  function adv(){i++;t=0;if(o.onStep)o.onStep(i);}
  function frame(){if(i>=n){setPlay(false);return;}t+=speed/(o.frames||40);while(t>=1&&i<n){const rest=t-1;adv();t=rest;}if(i>=n){t=0;show();setPlay(false);return;}show();}
  function reset(){setPlay(false);i=0;t=0;if(o.onReset)o.onReset();show();label();}
  play.addEventListener("click",()=>{if(playing){setPlay(false);return;}if(i>=n)reset();if(REDUCED){while(i<n)adv();show();label();return;}setPlay(true);});
  stepB.addEventListener("click",()=>{if(i>=n)return;setPlay(false);adv();show();label();});
  rs.addEventListener("click",reset);
  speedSeg(sp,v=>{speed=v;},[1,2,4]);
  show();
  return {stage,box,reset,setN(v){n=v;reset();},play(){if(!REDUCED&&!playing&&i<n)setPlay(true);},get i(){return i;}};
}

/* ---------- hero: the legacy register normalised row by row ---------- */
function HeroNorm(root){
  root.classList.add("flow");
  root.innerHTML=`<div class="flowbar"><span class="eyebrow">Live: the legacy register, normalised one row at a time</span><div class="ctrls">
      <button class="btn small" data-play type="button">Play</button>
      <div class="seg" role="group" aria-label="Speed"><button type="button" data-sp="1" aria-pressed="true">1×</button><button type="button" data-sp="4" aria-pressed="false">4×</button><button type="button" data-sp="16" aria-pressed="false">16×</button></div>
      <button class="btn ghost small" data-reset type="button">Reset</button></div></div>
    <canvas aria-label="Rows of a flat enrolment register are read one at a time; each value flies to the normalised table that owns it, which stores each fact only once"></canvas>
    <div class="flowstats"><div><span>Register rows read</span><b data-k>0</b></div><div><span>Cells in the register</span><b data-c1>0</b></div><div><span>Cells after normalising</span><b data-c2>0</b></div><div><span>Repeated facts skipped</span><b data-dup>0</b></div><div><span>Conflicts found</span><b data-cf>0</b></div></div>`;
  const W=720,H=300,c=root.querySelector("canvas"),g=canvasSetup(c,W,H);
  const COLS=["learner_id","course_code","learner_name","learner_phone","city","state","course_title","course_fee","instructor_id","instructor_name","instructor_email","batch_code","batch_slot","enrolled_on"];
  const TB=[{name:"learners",key:[0],vals:[2,3,4]},{name:"cities",key:[4],vals:[5]},{name:"courses",key:[1],vals:[6,7,8]},{name:"instructors",key:[8],vals:[9,10]},{name:"batches",key:[11],vals:[12]},{name:"enrolments",key:[0,1],vals:[11,13]}];
  const HOME=[0,2,0,0,1,1,2,2,3,3,3,4,4,5];
  const BX=TB.map((_,j)=>({x:330+(j%2)*195,y:14+Math.floor(j/2)*92,w:180,h:80}));
  let rows=[],ST=[],CUM=[],k=0,t=0,speed=1,playing=!REDUCED,run=null,msg="Loading the register…";
  function prep(){const maps=TB.map(()=>new Map());let dup=0,cf=0;ST=[];CUM=[];
    rows.forEach(r=>{const st=TB.map((tb,j)=>{const key=tb.key.map(x=>r[x]).join("|"),val=tb.vals.map(x=>r[x]).join("|");const m=maps[j];
        if(!m.has(key)){m.set(key,val);return "new";}if(m.get(key)===val){dup++;return "dup";}cf++;return "conflict";});
      ST.push(st);CUM.push({n:maps.map(m=>m.size),dup,cf,cells:maps.reduce((s,m,j)=>s+m.size*(TB[j].key.length+TB[j].vals.length),0)});});}
  const col=()=>({ink:cssVar("--ink"),muted:cssVar("--muted"),line:cssVar("--line"),sunk:cssVar("--sunk"),surf:cssVar("--surface"),acc:cssVar("--accent"),ok:cssVar("--ok"),bad:cssVar("--fraud"),gold:cssVar("--gold")});
  const chipPos=i=>({x:12+(i%2)*152,y:40+Math.floor(i/2)*35});
  function draw(){const C=col();g.clearRect(0,0,W,H);g.fillStyle=C.sunk;g.fillRect(0,0,W,H);
    g.font="11px IBM Plex Mono, monospace";
    if(!rows.length){g.fillStyle=C.muted;g.fillText(msg,14,24);return;}
    const done=k>=rows.length,r=rows[Math.min(k,rows.length-1)],shown=done?CUM[rows.length-1]:(k?CUM[k-1]:{n:TB.map(()=>0),dup:0,cf:0,cells:0});
    const ph=done?1:t, commit=!done&&ph>=0.85, cum=commit?CUM[k]:shown, st=done?null:ST[k];
    g.fillStyle=C.ink;g.font="600 11px IBM Plex Mono, monospace";g.fillText(done?`all ${rows.length} register rows read`:`enrolment_flat · row ${k+1} of ${rows.length}`,12,24);
    COLS.forEach((cn,i)=>{const p=chipPos(i);const a=done?0.35:ph<0.3?ease(ph/0.3):ph<0.85?0.35:0.35;
      g.globalAlpha=a;g.fillStyle=C.surf;g.fillRect(p.x,p.y,146,30);g.strokeStyle=C.line;g.strokeRect(p.x+0.5,p.y+0.5,146,30);
      g.fillStyle=C.muted;g.font="9px IBM Plex Mono, monospace";g.fillText(cn,p.x+5,p.y+11);g.fillStyle=C.ink;g.font="11px IBM Plex Mono, monospace";g.fillText(clip(r[i],19),p.x+5,p.y+25);g.globalAlpha=1;});
    if(!done&&ph>=0.3&&ph<0.85){const q=ease((ph-0.3)/0.55);COLS.forEach((cn,i)=>{const p=chipPos(i),b=BX[HOME[i]];const x=lerp(p.x+73,b.x+b.w/2,q),y=lerp(p.y+15,b.y+b.h/2,q);
      g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fillStyle=C.acc;g.fill();});}
    TB.forEach((tb,j)=>{const b=BX[j];g.fillStyle=C.surf;g.fillRect(b.x,b.y,b.w,b.h);
      let sc=C.line,lw=1,label="";if(commit&&st){const s=st[j];sc=s==="new"?C.ok:s==="dup"?C.muted:C.bad;lw=s==="dup"?1.5:3;label=s==="new"?"new fact stored":s==="dup"?"already stored, skipped":"conflict: same key, other value";}
      g.strokeStyle=sc;g.lineWidth=lw;g.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);g.lineWidth=1;
      g.fillStyle=C.ink;g.font="600 12px IBM Plex Mono, monospace";g.fillText(tb.name,b.x+8,b.y+18);
      g.font="11px IBM Plex Mono, monospace";g.fillStyle=C.muted;g.fillText(`${cum.n[j]} rows · ${tb.key.length+tb.vals.length} cols`,b.x+8,b.y+36);
      if(label){g.fillStyle=sc===C.bad?C.bad:C.ink;g.fillText(label,b.x+8,b.y+60);}});
    root.querySelector("[data-k]").textContent=ind(done?rows.length:k+(commit?1:0));
    root.querySelector("[data-c1]").textContent=ind((done?rows.length:k+(commit?1:0))*14);
    root.querySelector("[data-c2]").textContent=ind(cum.cells);root.querySelector("[data-dup]").textContent=ind(cum.dup);root.querySelector("[data-cf]").textContent=ind(cum.cf);}
  function step(){if(!rows.length){draw();return;}if(k>=rows.length){play(false);draw();return;}t+=speed/70;while(t>=1&&k<rows.length){t-=1;k++;}if(k>=rows.length){t=0;play(false);}draw();}
  function play(v){playing=v;root.querySelector("[data-play]").textContent=v?"Pause":(k>=rows.length&&rows.length?"Replay":"Play");if(v&&!run)run=loop(step);if(!v&&run){run.stop();run=null;}}
  root.querySelector("[data-play]").addEventListener("click",()=>{if(playing){play(false);return;}if(k>=rows.length){k=0;t=0;}if(REDUCED){k=rows.length;t=0;draw();play(false);return;}play(true);});

  draw();

}

/* ---------- File 1: type affinity sorter ---------- */
const AFF_VALS=["'42'","42","4.5","'4.50'","'abc'","'2026-09-01'","TRUE","NULL"];
const AFF_MODES=[
 {name:"Ordinary table",table:"aff",ddl:"CREATE TABLE aff (c_int INT, c_text VARCHAR(20), c_real REAL, c_num DECIMAL(8,2), c_none);",cols:[["c_int","INT"],["c_text","VARCHAR(20)"],["c_real","REAL"],["c_num","DECIMAL(8,2)"],["c_none","(no type)"]]},
 {name:"STRICT table",table:"affs",ddl:"CREATE TABLE affs (c_int INT, c_text TEXT, c_real REAL, c_any ANY, c_blob BLOB) STRICT;",cols:[["c_int","INT"],["c_text","TEXT"],["c_real","REAL"],["c_any","ANY"],["c_blob","BLOB"]]}];

function labAffinity(root){
  const LDB="lab_design_types";
  root.appendChild(el("p",{class:"note"},"Eight values are inserted, one at a time, into five columns with different declared types. The colour of each cell is the storage class SQLite really used, read back with typeof(). Switch to a STRICT table and watch values get refused instead of converted."));
  const top=el("div",{class:"btnrow"});root.appendChild(top);
  let mode=0,res=null,s=null,out=null;const ddlBox=codeBox(root,AFF_MODES[0].ddl);
  const pl=Player(root,{title:"Values meet column types",n:AFF_VALS.length*5,frames:22,render});
  s=svgBox(pl.stage,660,290,"Grid of values against declared column types, coloured by the storage class SQLite used");
  out=noteP(pl.stage,"");
  seg(top,AFF_MODES.map(m=>m.name),i=>{mode=i;ddlBox.textContent=AFF_MODES[i].ddl;load();},"Table kind");
  async function load(){res=null;pl.reset();out.textContent="Running the inserts…";
    try{await SQLX.addDBText(LDB,AFF_MODES.map(m=>m.ddl).join("\n"));const m=AFF_MODES[mode];const R=[];
      for(const v of AFF_VALS){const row=[];for(const [cn] of m.cols){const sql=`DELETE FROM ${m.table}; INSERT INTO ${m.table} (${cn}) VALUES (${v}); SELECT typeof(${cn}), quote(${cn}) FROM ${m.table};`;
          try{const r=lastSet(await SQLX.exec(LDB,sql)).values[0];row.push({cls:r[0],val:r[1],sql:`INSERT INTO ${m.table} (${cn}) VALUES (${v});`});}
          catch(e){row.push({cls:"rejected",val:e.message,sql:`INSERT INTO ${m.table} (${cn}) VALUES (${v});`});}}
        R.push(row);}
      res=R;out.textContent="Press Play, or Step through the cells.";pl.reset();}catch(e){out.textContent="Could not run the lab: "+e.message;}}
  function render(i,t){if(!s)return;clear(s);const m=AFF_MODES[mode];const x0=120,cw=106,y0=46,rh=30;
    m.cols.forEach(([cn,ty],j)=>{s.appendChild(T(x0+j*cw+cw/2,18,cn,{"text-anchor":"middle","font-weight":600}));s.appendChild(T(x0+j*cw+cw/2,33,ty,{"text-anchor":"middle",style:"fill:var(--muted)","font-size":10}));});
    AFF_VALS.forEach((v,r)=>{s.appendChild(T(8,y0+r*rh+19,v,{"font-family":"IBM Plex Mono, monospace"}));
      m.cols.forEach((_,j)=>{const idx=r*5+j;const x=x0+j*cw+3,y=y0+r*rh+3;s.appendChild(sv("rect",{x,y,width:cw-6,height:rh-6,rx:4,style:"fill:var(--surface);stroke:var(--line)"}));
        if(res&&idx<i){const c=res[r][j];s.appendChild(sv("rect",{x,y,width:cw-6,height:rh-6,rx:4,style:`fill:${CLS_FILL[c.cls]||"var(--sunk)"};stroke:var(--line)`}));
          s.appendChild(T(x+(cw-6)/2,y+16,c.cls==="rejected"?"refused":c.cls+" "+clip(c.val,8),{"text-anchor":"middle","font-size":10,style:c.cls==="rejected"?"fill:var(--fraud)":"fill:var(--ink)"}));}});});
    if(res&&i<AFF_VALS.length*5){const r=Math.floor(i/5),j=i%5;const x=lerp(70,x0+j*cw+cw/2,ease(t)),y=y0+r*rh+15;
      s.appendChild(sv("circle",{cx:x,cy:y,r:7,style:"fill:var(--accent)"}));}
    if(res&&i>0){const r=Math.floor((i-1)/5),j=(i-1)%5;const c=res[r][j];out.textContent=c.sql+"  →  "+(c.cls==="rejected"?"refused: "+c.val:"stored as "+c.cls+" "+c.val);}
    else if(res)out.textContent="Press Play, or Step through the cells.";}
  load();
  root.appendChild(SQLX.mysqlNote("MySQL has no affinity: a value that does not fit the column's type is converted if it can be (the text '42' into an INT column becomes 42) and otherwise rejected in strict mode, which is what the STRICT table imitates. TRUE is stored as 1 in both products."));
}

  const pl=Player(root,{title:"The decomposition machine",n:5,frames:90,render,onStep:i=>{if(i===5)award("lossless");}});
  s=svgBox(pl.stage,680,300,"Tables as boxes of column chips; at each normal form the chips move into new tables keyed by their determinants");
  ro=el("div",{class:"readout"});pl.stage.appendChild(ro);out=noteP(pl.stage,"");
  function stages(){const n=N;return [
    [{name:"enrolment_sheet",rows:n.sheet,keys:["sheet_row"],bad:["phones","course_codes","course_titles","course_fees","instructors","batch_codes","payments"],cols:["sheet_row","learner_name","phones","city","state","course_codes","course_titles","course_fees","instructors","batch_codes","payments"]}],
    [{name:"enrolment_flat",rows:n.flat,keys:["learner_id","course_code"],cols:FLATC}],
    [{name:"learners",rows:n.l2,keys:["learner_id"],cols:["learner_id","learner_name","learner_phone","city","state"]},{name:"courses",rows:n.c2,keys:["course_code"],cols:["course_code","course_title","course_fee","instructor_id","instructor_name","instructor_email"],warn:n.c2>n.codes},{name:"enrolments",rows:n.flat,keys:["learner_id","course_code"],cols:["learner_id","course_code","batch_code","batch_slot","enrolled_on"]}],
    [{name:"learners",rows:n.l2,keys:["learner_id"],cols:["learner_id","learner_name","learner_phone","city","state"]},{name:"courses",rows:n.codes,keys:["course_code"],cols:["course_code","course_title","course_fee","instructor_id","instructor_name","instructor_email"]},{name:"enrolments",rows:n.flat,keys:["learner_id","course_code"],cols:["learner_id","course_code","batch_code","batch_slot","enrolled_on"]}],
    [{name:"learners",rows:n.t[0],keys:["learner_id"],cols:["learner_id","learner_name","learner_phone","city"]},{name:"cities",rows:n.t[1],keys:["city"],cols:["city","state"]},{name:"courses",rows:n.t[2],keys:["course_code"],cols:["course_code","course_title","course_fee","instructor_id"]},
     {name:"instructors",rows:n.t[3],keys:["instructor_id"],cols:["instructor_id","instructor_name","instructor_email"]},{name:"enrolments",rows:n.t[4],keys:["learner_id","course_code"],cols:["learner_id","course_code","batch_code","enrolled_on"]},{name:"batches",rows:n.t[5],keys:["batch_code"],cols:["batch_code","batch_slot"]}]];}
  function place(L){const many=L.length>1;const per=L.length>3?3:L.length;const w=many?Math.floor((680-12)/per)-10:300;
    let maxH=0;L.forEach((b,k)=>{b.w=w;b.h=30+b.cols.length*15+4;b.x=many?6+(k%per)*(w+10):190;maxH=Math.max(maxH,b.h);});
    L.forEach((b,k)=>{b.y=8+Math.floor(k/per)*(maxH+10);});return L;}
  function chipXY(b,c){const k=b.cols.indexOf(c);return {x:b.x+6,y:b.y+28+k*15};}
  function drawBox(b,op){const g=sv("g",{style:`opacity:${op}`});s.appendChild(g);g.appendChild(sv("rect",{x:b.x,y:b.y,width:b.w,height:b.h,rx:6,style:`fill:var(--surface);stroke:${b.warn?"var(--fraud)":"var(--line)"};stroke-width:${b.warn?2:1}`}));
    g.appendChild(T(b.x+6,b.y+16,b.name,{"font-weight":600}));g.appendChild(T(b.x+b.w-6,b.y+16,`${b.rows} rows`,{"text-anchor":"end",style:"fill:var(--muted)","font-size":10}));}
  function drawChip(x,y,w,c,b,op){const key=b.keys.includes(c),bad=(b.bad||[]).includes(c);const g=sv("g",{style:`opacity:${op}`});s.appendChild(g);
    g.appendChild(sv("rect",{x,y,width:w,height:13,rx:3,style:`fill:${bad?"var(--fraud-soft)":key?"var(--accent-soft)":"var(--sunk)"}`}));g.appendChild(T(x+4,y+10,c+(key?"  (key)":""),{"font-size":9,"font-weight":key?600:400}));}
  function render(i,t){if(!s)return;clear(s);if(!N){out.textContent="Running the decomposition queries…";return;}
    const SS=stages().map(place);const q=ease(t);const A=SS[Math.min(i,SS.length-1)],B=i<SS.length-1?SS[i+1]:null;
    if(!B||t===0){A.forEach(b=>{drawBox(b,1);b.cols.forEach(c=>{const p=chipXY(b,c);drawChip(p.x,p.y,b.w-12,c,b,1);});});}
    else{A.forEach(b=>drawBox(b,1-q));B.forEach(b=>{drawBox(b,q);b.cols.forEach(c=>{const to=chipXY(b,c);let src=A.find(a=>a.name===b.name&&a.cols.includes(c))||A.find(a=>a.cols.includes(c));let from=null,sc=c;
        if(!src&&DEC_ALIAS[c]){sc=DEC_ALIAS[c];src=A.find(a=>a.cols.includes(sc));}if(src)from=chipXY(src,sc);

    const st=Math.min(5,i+(t>0.5?1:0));const cur=SS[Math.min(st,SS.length-1)];

    [["Stage",["0NF","1NF","2NF","2NF, repaired","3NF","3NF, verified"][st]],["Tables",String(cur.length)],["Rows stored",ind(cur.reduce((a,b)=>a+b.rows,0))],["Cells stored",ind(cells)]].forEach(([k,v])=>{const d=el("div");d.appendChild(SB.text("span",k));d.appendChild(SB.text("b",v));ro.appendChild(d);});
    const n=N;out.textContent=[
      `0NF: enrolment_sheet has ${n.sheet} rows, and seven columns hold lists such as 'SQL101, VZ201'. SQL cannot sum, join or constrain a list.`,
      `1NF: one row per learner and course. Splitting the sheet's lists gives ${n.split} rows, exactly the ${n.flat} rows of enrolment_flat. Key: (learner_id, course_code).`,
      `2NF: what depends on half the key moves out. learners ${n.l2} rows; enrolments ${n.flat}; courses ${n.c2} rows for only ${n.codes} course codes: instructor 2's two emails make two versions of a course.`,
      `Repair first: ${n.fix} rows carried the minority email. One UPDATE restores instructor_id → instructor_email, and courses drops to ${n.codes} rows.`,
      `3NF: the transitive chains city → state, instructor_id → name and email, batch_code → batch_slot get tables of their own. Each fact is stored once.`,
      `Lossless: the six-table join returns ${n.join} rows; register EXCEPT join = ${n.ex1} rows and join EXCEPT register = ${n.ex2} rows. BCNF bonus: mentoring's ${n.m1} rows hold only ${n.m2} mentor → subject facts, the redundancy the BCNF split removes.`][st];}
  (async()=>{let ok=false;try{const r=await SQLX.exec(DBN,DEC_SQL);const v=allSets(r).map(x=>x.values[0]);
      N={sheet:v[0][0],split:v[1][0],flat:v[2][0],l2:v[3][0],c2:v[4][0],codes:v[5][0],fix:v[6][0],t:v[7],join:v[8][0],ex1:v[9][0],ex2:v[10][0],m1:v[11][0],m2:v[11][1]};ok=true;}
    catch(e){out.textContent="Could not run the lab: "+e.message;}
    try{await SQLX.exec(DBN,"ROLLBACK TO lab_dec; RELEASE lab_dec;");}catch(e){}
    if(ok)pl.reset();})();
}

  root.appendChild(el("p",{class:"note"},"The whiteboard, drawn one decision at a time in Chen notation (rectangles for entities, diamonds for relationships, ovals for attributes; double lines for total participation, double shapes for weak entities and multi-valued attributes). Each step writes the DDL it implies; the last step runs it."));
  const pl=Player(root,{title:"From ER diagram to CREATE TABLE",n:ER_DDL.length,frames:70,render,onStep:i=>{if(i===ER_DDL.length)runDDL();},onReset:()=>{if(res)clear(res);}});
  s=svgBox(pl.stage,680,340,"An entity-relationship diagram of instructors, profiles, courses, lessons, learners and enrolments, drawn step by step");
  out=noteP(pl.stage,"");ddl=el("div",{class:"formula"});pl.stage.appendChild(ddl);res=el("div");pl.stage.appendChild(res);
  async function runDDL(){const all=ER_DDL.map(x=>x[1]).filter(Boolean).join("\n");
    try{await SQLX.addDBText(LDB,"");await SQLX.reset(LDB);await SQLX.exec(LDB,all);
      const r=await SQLX.exec(LDB,"SELECT m.name AS child_table, f.\"from\" AS fk_column, f.\"table\" AS parent_table, f.on_delete FROM sqlite_master AS m, pragma_foreign_key_list(m.name) AS f WHERE m.type = 'table' ORDER BY m.rowid, f.id;");
      clear(res);res.appendChild(SB.text("p","Eight tables created. Their foreign keys, read back from SQLite:","eyebrow"));const g=el("div");res.appendChild(g);SQLX.grid(g,r);award("architect");}
    catch(e){SQLX.errorBox(res,e.message,all);}}
  function shape(e,p){const op=Math.min(1,p*1.6);const g=sv("g",{style:`opacity:${op}`});s.appendChild(g);

    if(e.k==="ent"||e.k==="weak"){g.appendChild(sv("rect",{x:e.x,y:e.y,width:120,height:40,rx:2,style:`fill:${fill};stroke:${ink};stroke-width:1.5`}));if(e.k==="weak")g.appendChild(sv("rect",{x:e.x+4,y:e.y+4,width:112,height:32,rx:1,style:`fill:none;stroke:${ink}`}));

    else if(e.k==="lab"){g.appendChild(T(e.x,e.y,e.t,{"font-weight":600,style:"fill:var(--accent)"}));}}

    if(e.k==="dline"){const dx=e.y2-e.y1,dy=e.x1-e.x2,len=Math.hypot(dx,dy)||1,ox=2*dx/len,oy=2*dy/len;[1,-1].forEach(sg=>s.appendChild(sv("line",{x1:e.x1+sg*ox,y1:e.y1+sg*oy,x2:x2+sg*ox,y2:y2+sg*oy,style:"stroke:var(--ink);stroke-width:1.2"})));}

function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffled(n,seed){const o=[...Array(n).keys()];const r=rng(seed);for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[o[k],o[j]]=[o[j],o[k]];}return o;}
const lnFact=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s;};
const binomPMF=(k,n,p)=>Math.exp(lnFact(n)-lnFact(k)-lnFact(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p));
const poisPMF=(k,l)=>Math.exp(k*Math.log(l)-l-lnFact(k));
const normPDF=(x,m,s)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
function sampleAmount(r){const u=r()*100;let lo=0,hi=AMTK.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(AMTK[m]<=u)lo=m;else hi=m;}const t=(u-AMTK[lo])/(AMTK[hi]-AMTK[lo]);return AMTV[lo]+(AMTV[hi]-AMTV[lo])*t;}
function sampleDaily(r){const u=r()*90;let c=0;for(const x of Object.keys(DAILY)){c+=DAILY[x];if(u<c)return +x;}return 17;}
function canvasSetup(c,w,h){const dpr=Math.min(2,window.devicePixelRatio||1);c.width=w*dpr;c.height=h*dpr;c.style.aspectRatio=`${w} / ${h}`;const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);return g;}
const runners=new Set(); // active animation loops, stopped on navigation
function loop(fn){let id,on=true;const step=()=>{if(!on)return;fn();id=requestAnimationFrame(step);};id=requestAnimationFrame(step);const h={stop(){on=false;cancelAnimationFrame(id);runners.delete(h);}};runners.add(h);return h;}
function stopAll(){[...runners].forEach(r=>r.stop());}

/* ---------- state ---------- */
const KEY=(COURSE.storePrefix||"stats-play-")+COURSE.key;
const fresh=()=>Object.assign({xp:0,streak:0,best:0,badges:[],ans:{},board:null,unlockAll:false,lab:{}},COURSE.freshExtra?COURSE.freshExtra():{});
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
const save=()=>{try{S.summary={title:COURSE.title,xp:S.xp,cleared:L.filter(levelDone).length,total:L.length,badges:S.badges.length,board:S.board?S.board.score:null,boardTotal:BOARD.length};localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

const RANKS=COURSE.ranks;
const BADGES=[...L.map((lv,i)=>[lv.id,lv.badge,"Cleared file "+(i+1)]),["streak5","Hot Hand","Five first-try answers in a row"],["clean","Clean Sheet","A whole file, first try, no hints"],...(COURSE.badges||[]),["explorer","Sandbox Explorer","Opened a sandbox and played with your own settings or data"],["board",COURSE.topRank,"Passed the board meeting ("+COURSE.boardPass+" of "+BOARD.length+")"]];

function toast(html){const t=el("div",{class:"toast"},html);$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3200);}
function addXP(n,why){if(n<=0)return;S.xp+=n;save();toast(`<b>+${n} XP</b> · ${why}`);renderStrip();}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);save();const b=BADGES.find(x=>x[0]===id);toast(`Badge earned: <b>${b[1]}</b>`);renderStrip();}
function rankOf(){if(S.badges.includes("board"))return [COURSE.topRank,null];let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null;}}return [r[1],nx];}
function renderStrip(){const [r,nx]=rankOf();$("#rank").textContent=r;$("#xptext").textContent=ind(S.xp)+" XP";
  if(nx){const lo=RANKS.find(x=>x[1]===r)[0];$("#xpfill").style.width=Math.min(100,100*(S.xp-lo)/(nx[0]-lo))+"%";$("#xpnext").textContent=ind(nx[0]-S.xp)+" XP to "+nx[1];}
  else{$("#xpfill").style.width="100%";$("#xpnext").textContent=S.badges.includes("board")?"Top rank reached":"Pass the board meeting for "+COURSE.topRank;}
  $("#streak").textContent=S.streak;$("#streakchip").classList.toggle("hot",S.streak>=3);$("#badgecount").textContent=S.badges.length+" / "+BADGES.length;}

function speedSeg(root,onchange,opts=[1,4,16]){const s=el("div",{class:"seg",role:"group","aria-label":"Speed"});opts.forEach((v,i)=>{const b=el("button",{type:"button","aria-pressed":i===0},v+"×");b.addEventListener("click",()=>{s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));onchange(v);});s.appendChild(b);});root.appendChild(s);return s;}

/* ---------- unlocking and progress ---------- */
function qstate(lid,i){S.ans[lid]=S.ans[lid]||{};S.ans[lid][i]=S.ans[lid][i]||{tries:0,done:false,first:false,hint:false,got:0};return S.ans[lid][i];}
function levelDone(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done);}
function levelStars(lv){if(!levelDone(lv))return 0;const f=lv.qs.filter((q,i)=>S.ans[lv.id][i].first).length;return f===lv.qs.length?3:(f>=lv.qs.length/2?2:1);}
function attempted(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].tries>0);}
function unlocked(idx){if(S.unlockAll||idx===0)return true;const prev=L[idx-1];return levelDone(prev)||attempted(prev);}
function boardUnlocked(){return S.unlockAll||L.filter(levelDone).length>=COURSE.boardUnlock;}

/* ---------- views ---------- */
function home(){
  stopAll();const app=$("#app");app.innerHTML="";
  const cleared=L.filter(levelDone).length;
  const hero=el("section",{class:"hero"});
  hero.innerHTML=`<div class="herotop"><div><p class="eyebrow">${COURSE.eyebrow}</p>
    <h1>${COURSE.title}</h1>
    <p class="lede">${COURSE.lede}</p>
    <p class="meta">${COURSE.meta||"First-try answers earn full XP; hints cost 25. Progress is saved in this browser only."}</p></div>
    <div class="ticket" aria-label="Your desk">
      <div class="row"><span>Case files cleared</span><span>${cleared} / ${L.length}</span></div>
      <div class="row"><span>Stars</span><span>${L.reduce((s,l)=>s+levelStars(l),0)} / ${3*L.length}</span></div>
      <div class="row"><span>Best streak</span><span>${S.best}</span></div>
      <div class="row"><span>Board meeting</span><span>${S.board?S.board.score+" / "+BOARD.length:(boardUnlocked()?"Ready":"Locked")}</span></div>
    </div></div>`;
  if(COURSE.hero){const hz=el("div");hero.appendChild(hz);app.appendChild(hero);COURSE.hero(hz);if(COURSE.heroNote)hero.appendChild(el("p",{class:"note"},COURSE.heroNote));}
  else app.appendChild(hero);
  const g=el("div",{class:"cases"});
  L.forEach((lv,i)=>{
    const ok=unlocked(i),done=levelDone(lv),st=levelStars(lv);
    const b=el("button",{class:"case",type:"button"});if(!ok)b.disabled=true;
    b.innerHTML=`<div class="top"><span class="tag">CASE FILE ${i+1}</span>
      <span class="stamp ${done?"ok":ok?"open":"lock"}">${done?"CLEARED":ok?"OPEN":"LOCKED"}</span></div>
      <h3>${lv.title}</h3><div class="stars" aria-label="${st} of 3 stars">${"★".repeat(st)}<span class="off">${"★".repeat(3-st)}</span></div>
      <p class="topics">${lv.topics}</p>`;
    b.addEventListener("click",()=>{location.hash=lv.id;});
    g.appendChild(b);
  });
  const bb=el("button",{class:"case boss",type:"button"});if(!boardUnlocked())bb.disabled=true;
  bb.innerHTML=`<div class="top"><span class="tag">FINAL · ${(COURSE.boardTitle||"The board meeting").toUpperCase()}</span><span class="stamp">${S.board?S.board.score+" / 8":boardUnlocked()?"READY":"LOCKED"}</span></div>
    <h3>${COURSE.boardCard||"Face the board"}</h3><p class="nick">${BOARD.length} questions, one attempt each. Score ${COURSE.boardPass} or more to become ${COURSE.topRank}.</p>
    <p class="topics">Unlocks after ${COURSE.boardUnlock} case files are cleared.</p>`;
  bb.addEventListener("click",()=>{location.hash="board";});
  g.appendChild(bb);
  app.appendChild(el("div",{class:"section-h"},`<h2>Case files</h2><span class="note">Each file unlocks when you have answered every question in the one before.</span>`));
  app.appendChild(g);
  app.appendChild(el("div",{class:"section-h"},`<h2>Badges</h2><span class="note">${S.badges.length} of ${BADGES.length} earned</span>`));
  const bg=el("div",{class:"badges"});
  BADGES.forEach(([id,name,desc])=>{const got=S.badges.includes(id);bg.appendChild(el("div",{class:"badge"+(got?" got":"")},`<span class="seal">${got?"EARNED":"NOT YET"}</span><b>${name}</b><span>${desc}</span>`));});
  app.appendChild(bg);
  app.appendChild(el("div",{class:"section-h"},`<h2>Formula sheet</h2><span class="note">Everything the ${L.length} files use, on one card.</span>`));
  app.appendChild(formulaSheet());
  app.appendChild(el("div",{class:"section-h"},`<h2>Desk settings</h2>`));
  const t=el("div",{class:"panel"});
  t.innerHTML=`<label class="confirm"><input type="checkbox" id="unlockall" ${S.unlockAll?"checked":""}> Open every case file now (for revision; XP still counts)</label>
    <div class="confirm" id="resetbox"><button class="btn ghost small" id="reset" type="button">Reset my progress</button></div>
    <p class="note">${COURSE.settingsNote||"Teaching with this page? Students can play on their own, and every number can be reproduced from the fixed data set."}</p>`;
  app.appendChild(t);
  $("#unlockall").addEventListener("change",e=>{S.unlockAll=e.target.checked;save();home();});
  $("#reset").addEventListener("click",()=>{const box=$("#resetbox");box.innerHTML=`<span>Erase all XP, badges and answers?</span>`;
    const y=el("button",{class:"btn small",type:"button"},"Yes, reset");const n=el("button",{class:"btn ghost small",type:"button"},"Keep my progress");
    y.addEventListener("click",()=>{S=fresh();save();renderStrip();home();toast("Progress reset");});n.addEventListener("click",home);box.append(y,n);});
  window.scrollTo(0,0);
}

function formulaSheet(){
  const s=el("div",{class:"sheet"});
  COURSE.formulas.forEach(([h,f])=>{const d=el("div",{class:"panel"});d.innerHTML=`<h3>${h}</h3><div class="formula">${f}</div>`;s.appendChild(d);});
  return s;
}
function level(lv){
  stopAll();const idx=L.indexOf(lv);
  if(!unlocked(idx)){location.hash="";return;}
  const app=$("#app");app.innerHTML="";
  const d=el("div",{class:"dossier"});
  const back=el("button",{class:"back",type:"button"},"← Back to the desk");back.addEventListener("click",()=>{location.hash="";});
  d.appendChild(back);
  d.appendChild(el("div",{},`<p class="eyebrow">Case file ${idx+1} of ${L.length}</p><h1 style="margin-top:8px">${lv.title}</h1><p class="note" style="margin-top:8px">${lv.topics}</p>`));
  const p0=el("section",{class:"panel"});p0.innerHTML=`<h3><span class="eyebrow">The case</span></h3><p class="story">${lv.story}</p>`;d.appendChild(p0);
  const p1=el("section",{class:"panel"});p1.innerHTML=`<h3><span class="eyebrow">Theory, briefly</span></h3><div class="brief">${lv.brief}</div><p class="refs">Further reading: ${lv.refs}</p>`;d.appendChild(p1);
  const p2=el("section",{class:"panel"});p2.innerHTML=`<h3><span class="eyebrow">Lab</span></h3>`;const lb=el("div");p2.appendChild(lb);d.appendChild(p2);
  const p3=el("section",{class:"panel"});p3.innerHTML=`<h3><span class="eyebrow">Challenges</span> <span class="note" id="qprog"></span></h3>`;
  lv.qs.forEach((q,i)=>p3.appendChild(question(lv,q,i)));
  d.appendChild(p3);
  const nx=el("div",{class:"btnrow"});
  if(idx<L.length-1){const b=el("button",{class:"btn",type:"button"},"Next case file →");b.addEventListener("click",()=>{if(unlocked(idx+1))location.hash=L[idx+1].id;else toast("Answer every question here to unlock the next file");});nx.appendChild(b);}
  else{const b=el("button",{class:"btn",type:"button"},"Go to the board meeting →");b.addEventListener("click",()=>{if(boardUnlocked())location.hash="board";else toast("Clear "+COURSE.boardUnlock+" case files to unlock the board");});nx.appendChild(b);}
  d.appendChild(nx);
  app.appendChild(d);
  lv.lab(lb);
  updProg(lv);
  window.scrollTo(0,0);
}
function updProg(lv){const n=lv.qs.filter((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done).length;const e=$("#qprog");if(e)e.textContent=`${n} of ${lv.qs.length} solved`;}

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/[₹,\s]/g,"");let isPct=false;if(s.endsWith("%")){isPct=true;s=s.slice(0,-1);}let v=parseFloat(s);if(isPct)v/=100;return v;}
function needDec(q){return Math.max(0,Math.ceil(Math.log10(0.5/q.tol)-1e-9));}
function tooRounded(raw,v,q){if(Number.isNaN(v)||!(q.tol>0))return false;let t=String(raw).trim().replace(/[₹,\s]/g,"");const pct=t.endsWith("%");if(pct)t=t.slice(0,-1);const m=t.match(/\.(\d+)$/);const d=m?m[1].length:0;let a=q.a,w=v;if(pct||(q.a<1&&v>1&&!pct)){a=q.a*100;w=pct?v*100:v;}const unit=Math.pow(10,-d),tolS=(a===q.a)?q.tol:q.tol*100;if(unit<=tolS*2)return false;return Math.abs(w-a)<=unit/2+1e-9;}
function roundMsg(q){const n=needDec(q);return `Your number is the right value rounded too far. Give it to ${n} decimal place${n===1?"":"s"}${q.a<1&&n>2?` (or as a percentage to ${n-2} decimal place${n-2===1?"":"s"})`:""}.`;}
function numOK(v,q){if(Number.isNaN(v))return false;if(Math.abs(v-q.a)<=q.tol)return true;if(q.a<1&&v>1&&Math.abs(v/100-q.a)<=q.tol)return true;return false;}

function question(lv,q,i){
  const st=qstate(lv.id,i);
  const box=el("div",{class:"q"});
  box.innerHTML=`<div class="qhead"><span class="eyebrow">Challenge ${i+1}</span><span class="eyebrow" data-x></span></div><p class="qtext">${q.q}</p>`;
  const fb=el("div");
  const tag=box.querySelector("[data-x]");
  const setTag=()=>{tag.textContent=st.done?`+${st.got} XP`:(st.hint?"hint used · 75 XP":"100 XP");};
  setTag();
  const solve=(correct)=>{
    st.tries++;
    if(correct){
      st.done=true;st.first=(st.tries===1&&!st.hint);
      let gain=st.tries===1?100:st.tries===2?50:20; if(st.hint)gain=Math.max(0,gain-25); st.got=gain;
      if(st.tries===1){S.streak++;S.best=Math.max(S.best,S.streak);if(S.streak>=5)award("streak5");}
      save(); addXP(gain,"Challenge "+(i+1));
      fb.innerHTML=`<div class="fb ok"><b>Correct.</b><span>${q.why}</span></div>`;
      setTag(); updProg(lv); checkLevel(lv); const hbx=box.querySelector("[data-hint]"); if(hbx)hbx.hidden=true;
    } else {
      S.streak=0;save();renderStrip();
      fb.innerHTML=`<div class="fb no"><b>Not yet.</b><span>${st.tries>=2?"Look at the hint, or rework it in the lab, then try again.":"Try again; the lab above has what you need."}</span></div>`;
    }
  };
  if(q.t==="sql"){
    SQLX.challenge(box,q,st,solve,fb);
  } else if(q.t==="mcq"){
    const order=shuffled(q.opts.length,lv.id.charCodeAt(1)*31+i*17);
    const opts=el("div",{class:"opts"});
    order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);
      if(st.done){b.disabled=true;if(k===q.a)b.classList.add("right");}
      b.addEventListener("click",()=>{if(st.done)return;const c=(k===q.a);b.classList.add(c?"right":"wrong");if(c)opts.querySelectorAll("button").forEach(x=>x.disabled=true);else b.disabled=true;solve(c);});
      opts.appendChild(b);});
    box.appendChild(opts);
  } else {
    const row=el("div",{class:"numrow"});
    const inp=el("input",{type:"text",inputmode:"decimal",id:`in-${lv.id}-${i}`,"aria-label":"Your answer",placeholder:q.ph||"e.g. 0.123"});
    const go=el("button",{class:"btn small",type:"button"},"Check");
    if(st.done){inp.disabled=true;go.disabled=true;inp.value=String(+q.a.toFixed(4));}
    const check=()=>{if(st.done)return;const v=parseNum(inp.value);if(Number.isNaN(v)){fb.innerHTML=`<div class="fb no"><b>Enter a number.</b><span>Decimals (0.25) and percentages (25%) both work.</span></div>`;return;}const c=numOK(v,q);if(!c&&tooRounded(inp.value,v,q)){fb.innerHTML=`<div class="fb no"><b>Close.</b><span>${roundMsg(q)} This try is not counted.</span></div>`;return;}if(c){inp.disabled=true;go.disabled=true;}solve(c);};
    go.addEventListener("click",check);inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
    row.append(inp,go);box.appendChild(row);
  }
  if(q.hint){const hb=el("button",{class:"btn ghost small",type:"button","data-hint":"1"},"Show hint (−25 XP)");
    if(st.done)hb.hidden=true;
    hb.addEventListener("click",()=>{st.hint=true;save();setTag();hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;});
    const r=el("div",{class:"btnrow"});r.appendChild(hb);box.appendChild(r);
    if(st.hint&&!st.done){hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;}
  }
  if(st.done)fb.innerHTML=`<div class="fb ok"><b>Solved.</b><span>${q.why}</span></div>`;
  box.appendChild(fb);
  return box;
}
function checkLevel(lv){if(!levelDone(lv))return;const was=S.badges.includes(lv.id);award(lv.id);
  if(lv.qs.every((q,i)=>S.ans[lv.id][i].first))award("clean");
  if(!was){addXP(150,"Case file cleared");}}

function board(){
  stopAll();if(!boardUnlocked()){location.hash="";return;}
  const app=$("#app");app.innerHTML="";
  const d=el("div",{class:"dossier"});
  const back=el("button",{class:"back",type:"button"},"← Back to the desk");back.addEventListener("click",()=>{location.hash="";});d.appendChild(back);
  d.appendChild(el("div",{},`<p class="eyebrow">Final</p><h1 style="margin-top:8px">${COURSE.boardTitle||"The board meeting"}</h1><p class="note" style="margin-top:8px">${BOARD.length} questions from across the files. One attempt each, no hints. Score ${COURSE.boardPass} or more to earn ${COURSE.topRank}. XP is awarded on your first sitting only.</p>`));
  const p=el("section",{class:"panel"});d.appendChild(p);app.appendChild(d);
  const run={i:0,score:0,first:!S.board};
  const show=()=>{
    if(run.i>=BOARD.length){
      const pass=run.score>=COURSE.boardPass;
      S.board={score:Math.max(run.score,S.board?S.board.score:0)};save();
      if(run.first)addXP(run.score*100,"Board meeting");
      if(pass)award("board");
      p.innerHTML=`<h2>${pass?"The board is satisfied.":"The board wants another look."}</h2><p>You scored <b class="mono">${run.score} / ${BOARD.length}</b>. ${pass?"You are now "+COURSE.topRank+".":"Revisit the case files, then reconvene."}</p>`;
      const r=el("div",{class:"btnrow"});const a=el("button",{class:"btn",type:"button"},"Reconvene");a.addEventListener("click",board);const b=el("button",{class:"btn ghost",type:"button"},"Back to the desk");b.addEventListener("click",()=>{location.hash="";});r.append(a,b);p.appendChild(r);renderStrip();return;}
    const q=BOARD[run.i];p.innerHTML=`<div class="qhead"><span class="eyebrow">Question ${run.i+1} of ${BOARD.length}</span><span class="eyebrow">Score ${run.score}</span></div><p class="qtext">${q.q}</p>`;
    const fb=el("div");const next=el("button",{class:"btn",type:"button"},run.i<BOARD.length-1?"Next question →":"See the verdict");next.hidden=true;next.addEventListener("click",()=>{run.i++;show();});
    const done=(c)=>{if(c)run.score++;fb.innerHTML=`<div class="fb ${c?"ok":"no"}"><b>${c?"Correct.":"Not quite."}</b><span>${q.why}</span></div>`;next.hidden=false;};
    if(q.t==="mcq"){const o=el("div",{class:"opts"});const order=shuffled(q.opts.length,run.i*7+3);
      order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);b.addEventListener("click",()=>{o.querySelectorAll("button").forEach((x,ix)=>{x.disabled=true;if(order[ix]===q.a)x.classList.add("right");});if(k!==q.a)b.classList.add("wrong");done(k===q.a);});o.appendChild(b);});p.appendChild(o);}
    else{const r=el("div",{class:"numrow"});const inp=el("input",{type:"text",inputmode:"decimal",id:"board-in-"+run.i,"aria-label":"Your answer",placeholder:"e.g. 0.5"});const g=el("button",{class:"btn small",type:"button"},"Submit");
      const sub=()=>{const v=parseNum(inp.value);if(Number.isNaN(v))return;if(!numOK(v,q)&&tooRounded(inp.value,v,q)){fb.innerHTML=`<div class="fb no"><b>Close.</b><span>${roundMsg(q)} Not submitted yet.</span></div>`;return;}inp.disabled=true;g.disabled=true;done(numOK(v,q));};g.addEventListener("click",sub);inp.addEventListener("keydown",e=>{if(e.key==="Enter")sub();});r.append(inp,g);p.appendChild(r);}
    p.appendChild(fb);p.appendChild(next);
  };
  show();window.scrollTo(0,0);
}
/* ---------- router ---------- */
function route(){const h=location.hash.replace("#","");const lv=L.find(x=>x.id===h);if(lv)level(lv);else if(h==="board")board();else home();}
window.addEventListener("hashchange",route);
renderStrip();route();
try{window.__course={L,BOARD};}catch(e){}

})();
</script>
