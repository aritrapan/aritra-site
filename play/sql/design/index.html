<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>LearnSphere Build Room</title>
<meta name="description" content="CREATE, ALTER, data types, constraints, INSERT, UPDATE, DELETE, foreign-key actions, 1NF to BCNF, ER to tables.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case desk. Sticky status strip (rank, XP, streak); a live transaction-flow
   simulation as the hero; case files as a grid; an opened file is a single-column dossier:
   story, theory, lab, challenges. */
:root{
  --bg:#EAEFF4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#13233A; --muted:#566880; --line:#C9D3DF;
  --accent:#1F5FA8; --accent-soft:#DCE7F5; --gold:#A86E06; --gold-soft:#F6E7C8;
  --fraud:#B3263E; --fraud-soft:#F7DCE1; --ok:#1B7349; --ok-soft:#D7EFE2;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.strip .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .rank{font:700 1.05rem/1.1 var(--display)}
.xpbox{flex:1 1 220px;display:flex;flex-direction:column;gap:5px;min-width:0}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
.xpmeta{display:flex;justify-content:space-between;font:400 .8rem/1 var(--mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 11px;font:600 .82rem/1.2 var(--mono);white-space:nowrap}
a.chip{text-decoration:none;color:var(--accent)}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}

/* hero */
.hero{display:grid;gap:18px;padding-block:30px 10px}
.hero p.lede{font-size:1.08rem;max-width:62ch;margin-top:12px}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:8px;max-width:62ch}
.herotop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:720px){.herotop{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:.92rem}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ticket .row:last-child{border-bottom:0;padding-bottom:0}
.ticket .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flow simulation */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0}
.flow canvas{width:100%;height:auto;display:block;max-width:100%;border-radius:6px}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.flowbar .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.flowstats div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:1px}
.flowstats span{font-size:.72rem;color:var(--muted)}
.flowstats b{font:600 1.05rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font:600 .8rem/1.2 var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:transform .15s,border-color .15s}
.case:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.55}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .tag{font:600 .72rem/1 var(--mono);letter-spacing:.1em;color:var(--accent)}
.case h3{font-size:1.25rem}
.case .nick{font-size:.9rem;color:var(--muted)}
.case .topics{font-size:.85rem;color:var(--muted);margin-top:auto}
.stars{font-size:1rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.stamp{font:700 .7rem/1 var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok)} .stamp.lock{color:var(--muted)} .stamp.open{color:var(--accent)}
.case.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case.boss .tag,.case.boss .nick,.case.boss .topics{color:var(--bg);opacity:.8}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.badge b{font:600 .95rem/1.2 var(--display);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.badge.got b{color:var(--ink)}
.badge .seal{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}

/* dossier */
.dossier{display:grid;gap:22px;padding-block:24px}
.back{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);display:grid;gap:14px;min-width:0}
.panel>h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .eyebrow{color:var(--accent)}
.brief{display:grid;gap:12px;max-width:70ch}
.brief .term{font-weight:600}
.story{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;max-width:70ch}
.story b{font-style:normal}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.92rem;white-space:pre;line-height:1.5}
.refs{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* labs */
.labgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.labgrid{grid-template-columns:1fr}}
svg text{fill:var(--ink);font-family:var(--mono)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
.ctrl{display:grid;gap:6px}
.ctrl label{font-size:.88rem;color:var(--muted)}
.ctrl output{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.readout span{font-size:.76rem;color:var(--muted)}
.readout b{font:600 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.up{color:var(--fraud);font-weight:600}.down{color:var(--ok);font-weight:600}
.target{font:700 1.6rem/1.1 var(--mono);color:var(--accent)}
.regbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-size:.86rem}
.regbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.door{width:30%;aspect-ratio:3/4;max-width:120px;border:2px solid var(--line);background:var(--sunk);border-radius:8px 8px 2px 2px;
  font:700 1.4rem/1 var(--display);display:grid;place-items:center}
.door.pick{border-color:var(--accent);background:var(--accent-soft)}
.door.open{background:var(--bg);color:var(--muted);border-style:dashed}
.door.prize{border-color:var(--gold);background:var(--gold-soft)}
.doors{display:flex;gap:10px;justify-content:flex-start}
.mixbar{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.85rem}
.mixtrack{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mixtrack i{display:block;height:100%;transition:width .8s ease;font:600 .72rem/30px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
.mixtrack i.u{background:var(--accent-soft)}.mixtrack i.c{background:var(--line)}.mixtrack i.n{background:var(--fraud);color:var(--surface)}

/* challenges */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.q:first-of-type{border-top:0;padding-top:0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .eyebrow{white-space:nowrap}
.qtext{font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fraud);background:var(--fraud-soft)}
.opt[disabled]{cursor:default}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:12em}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--fraud-soft);border:1px solid var(--fraud)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b{font-family:var(--display);font-size:1rem}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;max-width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.toast b{color:var(--gold-soft)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sheet .formula{font-size:.84rem}
.sheet h3{font-size:1rem;margin-bottom:6px}
.sandbox{border:1px dashed var(--accent);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;background:var(--sunk);min-width:0;margin-top:14px}
.sb-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sb-head .eyebrow{color:var(--accent)}
.sb-tabs button{border:0;background:transparent;padding:5px 12px;font:600 .8rem/1.2 var(--mono)}
.sb-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sb-pane{display:grid;gap:10px;min-width:0}
.sb-params{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.sb-params label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sb-params input,.sb-params select{width:9.5em;max-width:100%}
.sandbox textarea{width:100%;max-width:100%;font:400 .88rem/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.sandbox input[type=file]{font-size:.82rem;max-width:100%}
.sqlx-console{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.sqlx-console{grid-template-columns:1fr}}
.sqlx-main{display:grid;gap:8px;min-width:0}
.sqlx-editor{width:100%;max-width:100%;font:400 .92rem/1.5 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
.sqlx-editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.sqlx-out{display:grid;gap:8px;min-width:0}
.sqlx-grid{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sqlx-grid table{font:400 .84rem/1.35 var(--mono)}
.sqlx-grid th{position:sticky;top:0;background:var(--sunk);text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink)}
.sqlx-grid td,.sqlx-grid th{white-space:nowrap;text-align:left}
.sqlx-grid td.num{text-align:right}
.sqlx-null{color:var(--muted);font-style:italic}
.sqlx-schema{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}
.sqlx-table summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sqlx-table ul{margin:4px 0 6px;padding-left:12px;list-style:none;display:grid;gap:2px}
.sqlx-col{all:unset;cursor:pointer;font:600 .8rem/1.3 var(--mono);color:var(--accent)}
.sqlx-col:focus-visible{outline:2px solid var(--accent)}
.sqlx-ch{display:grid;gap:8px;min-width:0}
.mysqlnote{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.mysqlnote b{font:600 .72rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
code,.code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.panel>*{min-width:0}
.btnrow .seg{flex-wrap:wrap;border-radius:14px}
.flow .stage{display:grid;gap:10px;min-width:0}
.flow .stage .formula{font-size:.8rem}
.flow .stage .svgbox svg text{font-family:var(--mono)}
@media (max-width:600px){.panel .svgbox>svg,.panel .svgbox>canvas{min-width:600px;max-width:none}}

</style>
</head>
<body>
<div class="wrap">
  <div class="strip" id="strip">
    <div class="who"><span class="eyebrow">Analyst rank</span><span class="rank" id="rank">Trainee Analyst</span></div>
    <div class="xpbox"><div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
      <div class="xpmeta"><span id="xptext">0 XP</span><span id="xpnext"></span></div></div>
    <span class="chip" id="streakchip" title="Correct first-try answers in a row">Streak <b id="streak">0</b></span>
    <span class="chip" title="Badges earned">Badges <b id="badgecount">0</b></span>
    <a class="chip" href="../" id="hublink">All modules</a>
  </div>
  <main id="app"></main>
  <div class="foot">
    <span>LearnSphere Build Room · part of <a href="../">SQL, played</a>, a free course you play. Built by <a href="https://aritra.ai" target="_blank" rel="noopener">Aritra Pan</a>. Free to use in teaching.</span>
    <span>Module 6 · Building databases</span>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>window.SQLX_LIB="../lib/";</script>
<script>
(function(){
"use strict";
/* ---------- sandbox toolkit (shared by every module) ----------
   Three levels of free play next to a lab:
     1. controls on the real data   2. generate your own data   3. bring your own data
   SAFETY: everything runs in the visitor's browser. Uploaded or pasted text is never sent anywhere,
   never stored, never put in the URL, and never inserted as HTML: it is only parsed into numbers and
   short labels, which are always displayed with textContent (SB.text / SB.table). Size caps keep phones responsive. */
const SB=(function(){
  const MAX_BYTES=2*1024*1024, MAX_ROWS=5000, MAX_COLS=50, MAX_LABEL=40;
  const used=()=>{try{award("explorer");}catch(e){}};
  /* safe text node helpers */
  function text(tag,str,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(str);return e;}
  /* control characters, bidirectional embedding/override/isolate controls (U+202A–202E, U+2066–2069, which could
     reorder the surrounding sentence on screen) and invisible U+200B, U+2060, U+FEFF are removed; ZWJ/ZWNJ stay (Indic scripts) */
  function cleanLabel(s){s=String(s==null?"":s).replace(/[\u0000-\u001f\u007f-\u009f\u200b\u202a-\u202e\u2060\u2066-\u2069\ufeff]/g,"").trim();return s.length>MAX_LABEL?s.slice(0,MAX_LABEL)+"…":s;}
  /* parse delimited text into {header:[...], rows:[[...]], note} — all values stay plain strings */
  function parse(str){
    str=String(str||"");if(str.length>MAX_BYTES)str=str.slice(0,MAX_BYTES);
    let lines=str.replace(/\r\n?/g,"\n").split("\n").map(l=>l.trim()).filter(l=>l.length);
    let truncated=false;if(lines.length>MAX_ROWS+1){lines=lines.slice(0,MAX_ROWS+1);truncated=true;}
    const note=()=>truncated?`Only the first ${ind(MAX_ROWS)} rows were read.`:"";
    if(!lines.length)return{header:[],rows:[],note:"Nothing to read."};

  /* ---- MySQL vs SQLite: friendly translations shown when a student writes MySQL-only syntax ---- */
  const MYSQL=[

    [/\bCURDATE\s*\(\s*\)|\bCURRENT_DATE\s*\(\s*\)/i,"CURDATE() is MySQL. In SQLite write date('now') (or CURRENT_DATE without brackets)."],
    [/\bDATE_FORMAT\s*\(/i,"DATE_FORMAT(d, '%Y-%m') is MySQL. In SQLite write strftime('%Y-%m', d). Most % codes match; minutes are %M in SQLite but %i in MySQL."],
    [/\bDATEDIFF\s*\(/i,"DATEDIFF(a, b) is MySQL (days from b to a). In SQLite write julianday(a) - julianday(b)."],
    [/\bDATE_ADD\s*\(|\bDATE_SUB\s*\(|\bINTERVAL\s+\d/i,"DATE_ADD(d, INTERVAL 7 DAY) is MySQL. In SQLite write date(d, '+7 days') (or '-1 month', '+1 year')."],

    [/\bAUTO_INCREMENT\b/i,"AUTO_INCREMENT is MySQL. In SQLite an INTEGER PRIMARY KEY column is filled automatically (add AUTOINCREMENT only if numbers must never be reused)."],
    [/\bENUM\s*\(/i,"ENUM(...) is MySQL. In SQLite use TEXT with CHECK (col IN ('a','b','c'))."],
    [/\bSHOW\s+(TABLES|DATABASES|COLUMNS|CREATE)/i,"SHOW TABLES is MySQL. Here use the schema panel, or: SELECT name FROM sqlite_master WHERE type = 'table';  For columns: PRAGMA table_info(table_name);"],
    [/^\s*(DESCRIBE|DESC)\s+\w/im,"DESCRIBE t is MySQL. In SQLite write PRAGMA table_info(t);"],
    [/^\s*USE\s+\w/im,"USE database is MySQL. This game has one database open at a time, so leave it out."],
    [/\bWITH\s+ROLLUP\b/i,"GROUP BY ... WITH ROLLUP is MySQL. SQLite has no ROLLUP: add the subtotal rows with UNION ALL of a second, less detailed GROUP BY."],
    [/\bGROUP_CONCAT\s*\([^)]*\bSEPARATOR\b/i,"GROUP_CONCAT(x SEPARATOR ', ') is MySQL. In SQLite the separator is the second argument: GROUP_CONCAT(x, ', ')."],

  /* result comparison */
  function norm(v){if(v===null||v===undefined)return '∅';if(typeof v==='number'){const x=Math.round(v*100)/100;return 'n:'+(Object.is(x,-0)?0:x);}const s=String(v).trim();if(/^-?\d+(\.\d+)?$/.test(s)){const x=Math.round(parseFloat(s)*100)/100;return 'n:'+x;}return 's:'+s;}

    if(stu.total!==ans.total)return {ok:false,msg:`Your result has ${ind(stu.total)} row${stu.total===1?'':'s'}; the expected one has ${ind(ans.total)}.`};
    const A=stu.values.map(r=>r.map(norm).join('␟')),B=ans.values.map(r=>r.map(norm).join('␟'));

L.push({id:"l1",badge:"Blueprint Reader",code:"File 1",title:"Blueprints and data types",topics:"Conceptual, logical and physical design; DDL and DML; CREATE TABLE; MySQL data types; SQLite type affinity and STRICT tables; reading a schema",
story:`<b>Day 1 in the Build Room.</b> LearnSphere sells online courses to learners across the country. It began life as one shared spreadsheet, and the spreadsheet is still around: a legacy register nobody dares to delete. The platform team now wants proper tables for everything new, starting with a badges table for course milestones. Before you build anything, you need to read what is already there, and to know what a column type actually promises.`,
brief:`<p>Database design happens in three layers. <span class="term">Conceptual design</span> names the things the business cares about (learners, courses, instructors, enrolments) and how they relate, with no software in sight. <span class="term">Logical design</span> turns that into tables, keys and relationships; normalisation (Files 6 and 7) lives here. <span class="term">Physical design</span> is the actual SQL (Structured Query Language) for one product: data types, constraints, indexes.</p>
<p>Modules 0 to 5 used the query part of SQL. This module adds two more parts: <span class="term">DDL</span> (Data Definition Language: CREATE, ALTER, DROP), which builds and changes structure, and <span class="term">DML</span> (Data Manipulation Language: INSERT, UPDATE, DELETE), which changes rows.</p>
<div class="formula">CREATE TABLE badges (
  badge_id    INTEGER PRIMARY KEY,
  badge_name  TEXT    NOT NULL,
  points      INTEGER NOT NULL,
  awarded_on  TEXT
);
CREATE TABLE IF NOT EXISTS t (...);      -- no error if t already exists
CREATE TABLE t2 AS SELECT ... ;          -- CTAS: structure and rows from a query
DROP TABLE IF EXISTS t2;</div>
<p>In MySQL every column has a strict <span class="term">data type</span>: <code>INT</code>/<code>BIGINT</code> for whole numbers, <code>DECIMAL(p, s)</code> for exact money (p digits, s after the point), <code>FLOAT</code>/<code>DOUBLE</code> for approximate numbers, <code>VARCHAR(n)</code> for text up to n characters, <code>CHAR(n)</code> for fixed-length codes, <code>TEXT</code> for long text, <code>DATE</code>, <code>DATETIME</code>/<code>TIMESTAMP</code>, <code>BOOLEAN</code> (a synonym for <code>TINYINT(1)</code>) and <code>ENUM('a','b')</code> for a fixed list.</p>
<p>SQLite works differently. A value, not a column, has a <span class="term">storage class</span>: NULL, INTEGER, REAL, TEXT or BLOB. A column only has a <span class="term">type affinity</span>, a preference worked out from the words in its declared type: a name containing INT gives INTEGER affinity; CHAR, CLOB or TEXT gives TEXT; BLOB or no type gives BLOB; REAL, FLOA or DOUB gives REAL; anything else (DECIMAL, BOOLEAN, DATE) gives NUMERIC. A value that fits the preference is converted; one that does not is stored as it is. <code>typeof(x)</code> shows what was stored. Since version 3.37 a table declared <code>STRICT</code> accepts only the types INT, INTEGER, REAL, TEXT, BLOB and ANY, and rejects values that do not fit.</p>
${MN("VARCHAR(40), DECIMAL(8,2), DATE and BOOLEAN are accepted here, but only as hints: SQLite does not enforce the length, keeps 12.345 in a DECIMAL(8,2) column as the floating-point 12.345, stores dates as 'YYYY-MM-DD' text and TRUE as 1. MySQL (in its default strict mode) rejects a string longer than n, rounds DECIMAL to s places and validates dates. To list tables MySQL has SHOW TABLES and DESCRIBE t; here use SELECT name FROM sqlite_master WHERE type = 'table' and PRAGMA table_info(t), or its query form SELECT * FROM pragma_table_info('t').")}`,
refs:"SQLite documentation: <i>CREATE TABLE</i>, <i>Datatypes In SQLite</i> and <i>STRICT Tables</i> (sqlite.org/lang_createtable.html, datatype3.html, stricttables.html) · MySQL 8.0 Reference Manual, chapter <i>Data Types</i> and <i>CREATE TABLE Statement</i> · Silberschatz, Korth & Sudarshan, <i>Database System Concepts</i> (7th ed., 2019), chapters on introductory and intermediate SQL · Laudon & Laudon, <i>Management Information Systems</i> (17th ed., 2022), ch. 6.",
lab:root=>{labAffinity(root);sbTypes(root);},
qs:[
{t:"sql",db:DBN,q:"Read the schema: list every table in the learnsphere database, alphabetically. One column: the table name. (In MySQL: SHOW TABLES.)",answer:"SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name",ordered:true,
 hint:"sqlite_master has one row per table, index and view; its column type says which.",why:`<code>SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name;</code> returns 12 tables. Without the WHERE you would also get the automatic indexes SQLite builds for PRIMARY KEY and UNIQUE columns (sqlite_autoindex_…).`},
{t:"sql",db:DBN,q:"Describe the courses table: each column's name and declared type, in column order. (In MySQL: DESCRIBE courses.)",answer:"SELECT name, type FROM pragma_table_info('courses') ORDER BY cid",ordered:true,
 hint:"pragma_table_info('courses') is a table you can SELECT from; cid is the column position.",why:`<code>SELECT name, type FROM pragma_table_info('courses') ORDER BY cid;</code> shows 8 columns. fee is declared NUMERIC (SQLite has no exact decimal type); launched_on is TEXT holding 'YYYY-MM-DD'.`},
{t:"mcq",q:"In this game you run <code>CREATE TABLE t (code VARCHAR(3)); INSERT INTO t VALUES ('ABCDEFG');</code> What happens?",opts:["The full 'ABCDEFG' is stored: SQLite does not enforce the length","'ABC' is stored: the value is cut to 3 characters","The INSERT fails with an error","NULL is stored"],a:0,
 hint:"VARCHAR contains CHAR, so the column gets TEXT affinity. What does affinity say about length?",why:"Affinity decides the storage class, not the size. SQLite stores all seven characters. MySQL in strict mode rejects the row (\"Data too long for column\"); with strict mode off it would cut the value to 'ABC' and warn. Declare a STRICT table with a CHECK (length(code) <= 3) if the rule matters here."},
{t:"sql",db:DBN,q:"Create the table <code>badges</code> with four columns: badge_id INTEGER PRIMARY KEY, badge_name TEXT NOT NULL, points INTEGER NOT NULL, awarded_on TEXT (may be empty).",answer:"CREATE TABLE badges (badge_id INTEGER PRIMARY KEY, badge_name TEXT NOT NULL, points INTEGER NOT NULL, awarded_on TEXT)",
 check:"SELECT name, upper(type), CASE WHEN pk > 0 THEN 1 ELSE \"notnull\" END, pk FROM pragma_table_info('badges') ORDER BY cid",ordered:true,
 hint:"CREATE TABLE badges ( column type constraints, ... );",why:`<code>CREATE TABLE badges (badge_id INTEGER PRIMARY KEY, badge_name TEXT NOT NULL, points INTEGER NOT NULL, awarded_on TEXT);</code> The checker reads the structure back with pragma_table_info. In MySQL you would write badge_id INT AUTO_INCREMENT PRIMARY KEY, badge_name VARCHAR(60) NOT NULL and awarded_on DATE.`},
{t:"sql",db:DBN,setup:"CREATE TABLE probe (a INT, b VARCHAR(10), c REAL, d DECIMAL(8,2), e BOOLEAN); INSERT INTO probe VALUES ('42', 42, '3', '12.50', 'yes');",q:"The setup created <code>probe (a INT, b VARCHAR(10), c REAL, d DECIMAL(8,2), e BOOLEAN)</code> and inserted one row: <code>('42', 42, '3', '12.50', 'yes')</code>. Return the storage class SQLite actually used for each of the five values, as five columns a to e.",answer:"SELECT typeof(a), typeof(b), typeof(c), typeof(d), typeof(e) FROM probe",
 hint:"typeof(column) names the storage class of the stored value.",why:`<code>SELECT typeof(a), typeof(b), typeof(c), typeof(d), typeof(e) FROM probe;</code> gives integer, text, real, real, text. The text '42' became an integer (INTEGER affinity), the number 42 became text (TEXT affinity), '3' became 3.0, '12.50' became 12.5 (NUMERIC affinity), and 'yes' stayed text because it does not look like a number. A BOOLEAN column happily holds the word 'yes'.`},
{t:"sql",db:DBN,q:"Create a STRICT table <code>fee_log</code>: log_id INTEGER PRIMARY KEY, course_id INTEGER NOT NULL, fee REAL NOT NULL, changed_on TEXT NOT NULL.",answer:"CREATE TABLE fee_log (log_id INTEGER PRIMARY KEY, course_id INTEGER NOT NULL, fee REAL NOT NULL, changed_on TEXT NOT NULL) STRICT",
 check:"SELECT t.strict, p.name, upper(p.type) FROM pragma_table_list AS t, pragma_table_info('fee_log') AS p WHERE t.name = 'fee_log' ORDER BY p.cid",ordered:true,
 hint:"The word STRICT goes after the closing bracket of the column list.",why:`<code>CREATE TABLE fee_log (log_id INTEGER PRIMARY KEY, course_id INTEGER NOT NULL, fee REAL NOT NULL, changed_on TEXT NOT NULL) STRICT;</code> Now INSERT INTO fee_log VALUES (1, 101, 'free', '2026-10-01') fails with "cannot store TEXT value in REAL column", which is how MySQL behaves by default. STRICT needs SQLite 3.37 or later; MySQL has no such keyword because it is always typed.`},
{t:"sql",db:DBN,q:"Use CREATE TABLE … AS SELECT to make <code>course_catalogue</code> holding course_code, title and fee (in that order) of every Beginner course.",answer:"CREATE TABLE course_catalogue AS SELECT course_code, title, fee FROM courses WHERE level = 'Beginner'",
 check:"SELECT * FROM course_catalogue ORDER BY 1",ordered:true,
 hint:"CREATE TABLE name AS SELECT ... FROM courses WHERE ...;",why:`<code>CREATE TABLE course_catalogue AS SELECT course_code, title, fee FROM courses WHERE level = 'Beginner';</code> copies 8 rows. CTAS (CREATE TABLE AS SELECT) copies column names and rows but not the constraints: the new table has no PRIMARY KEY, UNIQUE or CHECK. The same statement works in MySQL.`}
]});

L.push({id:"l2",badge:"Rule Keeper",code:"File 2",title:"House rules: keys and constraints",topics:"Entity, referential and domain integrity; PRIMARY KEY, NOT NULL, UNIQUE, CHECK, DEFAULT, FOREIGN KEY; super, candidate, alternate and surrogate keys; AUTO_INCREMENT vs INTEGER PRIMARY KEY",
story:`<b>The sign-up form import.</b> Marketing collected forty sign-ups on an old web form and dumped them into <code>signup_import</code>, a table with no rules at all. Some people submitted twice, two forgot their names, one chose a plan called "Gold" that does not exist. Before any of it reaches <code>learners</code>, you need to know exactly which rules the real table enforces, and which rows would break them.`,
brief:`<p>A design is only a promise until the database keeps it. <span class="term">Constraints</span> make it keep three kinds of promise: <span class="term">entity integrity</span> (every row has a unique, non-empty identifier), <span class="term">referential integrity</span> (a reference points at a row that exists) and <span class="term">domain integrity</span> (each value comes from its allowed set).</p>
<div class="formula">CREATE TABLE learners (
  learner_id  INTEGER PRIMARY KEY,                -- unique + not null
  full_name   TEXT NOT NULL,                      -- compulsory
  email       TEXT UNIQUE,                        -- no two alike (NULLs allowed)
  city_id     INTEGER REFERENCES cities(city_id), -- FOREIGN KEY
  signup_date TEXT NOT NULL,
  plan        TEXT NOT NULL DEFAULT 'Free'
              CHECK (plan IN ('Free','Plus','Pro'))
);
-- table-level forms, with names:
CONSTRAINT pk_enrol PRIMARY KEY (learner_id, course_id)
CONSTRAINT chk_pct  CHECK (progress_pct BETWEEN 0 AND 100)
FOREIGN KEY (learner_id, course_id) REFERENCES enrolments (learner_id, course_id)</div>
<p>Keys come in a family. A <span class="term">super key</span> is any set of columns that identifies a row; a <span class="term">candidate key</span> is a minimal one (drop any column and it stops identifying); the <span class="term">primary key</span> (PK) is the candidate key you choose; the others are <span class="term">alternate keys</span>, enforced with UNIQUE. A <span class="term">composite key</span> has several columns, like (learner_id, course_id) in enrolments. A <span class="term">foreign key</span> (FK) is a column whose values must exist as a key in another table. A <span class="term">surrogate key</span> is a meaningless number the system generates; a <span class="term">natural key</span> is a real-world identifier such as an email. Emails and phone numbers change, so they make good alternate keys and poor primary keys.</p>
<p>A CHECK fails only when its condition is false. NULL makes it unknown, so <code>CHECK (plan IN (...))</code> lets NULL through; add NOT NULL to forbid it. For the same reason UNIQUE allows any number of NULLs: two unknowns are never provably equal.</p>
${MN("MySQL fills a surrogate key with INT AUTO_INCREMENT PRIMARY KEY. In SQLite a column declared exactly INTEGER PRIMARY KEY is filled automatically with the largest existing value plus 1, so a deleted top number can be reused; adding AUTOINCREMENT prevents reuse (MySQL's counter also never goes back after DELETE). MySQL's ENUM('Free','Plus','Pro') is written here as TEXT with CHECK (plan IN (...)). MySQL enforces CHECK from version 8.0.16 (older versions parsed and ignored it). SQLite enforces foreign keys only when PRAGMA foreign_keys = ON, which is off by default in every new connection; this game switches it on. One SQLite quirk: a PRIMARY KEY that is not INTEGER PRIMARY KEY accepts NULL unless you also write NOT NULL. Foreign keys: here a REFERENCES written right after a column's type works; MySQL 8.0 parses such an inline REFERENCES but ignores it, so in MySQL write the table-level form, FOREIGN KEY (city_id) REFERENCES cities(city_id), which works in both.")}`,
refs:"SQLite documentation: <i>CREATE TABLE</i> (constraints), <i>SQLite Autoincrement</i>, <i>SQLite Foreign Key Support</i> (sqlite.org/lang_createtable.html, autoinc.html, foreignkeys.html) · MySQL 8.0 Reference Manual: <i>CHECK Constraints</i>, <i>Using AUTO_INCREMENT</i> · Elmasri & Navathe, <i>Fundamentals of Database Systems</i> (7th ed., 2016), chapter on the relational data model and relational database constraints · Codd, <i>Communications of the ACM</i> 13(6) (1970).",
lab:root=>{labGate(root);sbConstraints(root);},
qs:[
{t:"sql",db:DBN,q:"Create <code>coupons</code>: coupon_code TEXT PRIMARY KEY; pct_off INTEGER, compulsory, between 5 and 50 inclusive; max_uses INTEGER, compulsory, default 100; course_id INTEGER referring to courses(course_id).",answer:"CREATE TABLE coupons (coupon_code TEXT PRIMARY KEY, pct_off INTEGER NOT NULL CHECK (pct_off BETWEEN 5 AND 50), max_uses INTEGER NOT NULL DEFAULT 100, course_id INTEGER REFERENCES courses(course_id))",
 check:"INSERT OR IGNORE INTO coupons (coupon_code, pct_off) VALUES ('WELCOME10', 10), ('HUGE90', 90), ('WELCOME10', 20), ('NOPCT', NULL); SELECT coupon_code, pct_off, max_uses FROM coupons UNION ALL SELECT \"table\", \"from\", \"to\" FROM pragma_foreign_key_list('coupons')",
 hint:"Column constraints follow the type: NOT NULL CHECK (...), NOT NULL DEFAULT 100, REFERENCES courses(course_id).",why:`<code>CREATE TABLE coupons (coupon_code TEXT PRIMARY KEY, pct_off INTEGER NOT NULL CHECK (pct_off BETWEEN 5 AND 50), max_uses INTEGER NOT NULL DEFAULT 100, course_id INTEGER REFERENCES courses(course_id));</code> The checker fires four probe rows with INSERT OR IGNORE: only WELCOME10 at 10% survives, with max_uses filled in as 100. HUGE90 breaks the CHECK, the second WELCOME10 breaks the PRIMARY KEY, NOPCT breaks NOT NULL.`},
{t:"mcq",q:"<code>learners.email</code> is declared UNIQUE, yet four learners have no email (NULL). Is that a violation?",opts:["No: UNIQUE allows any number of NULLs, because NULL is never equal to NULL","Yes: the second NULL should have been rejected","Only the first NULL is allowed; the others are silently converted to ''","It depends on whether email is the primary key"],a:0,
 hint:"Is NULL = NULL true?",why:"UNIQUE rejects a value equal to an existing one. NULL = NULL is unknown, not true, so NULLs never clash. MySQL and SQLite agree. To forbid missing emails as well, write email TEXT NOT NULL UNIQUE."},
{t:"sql",db:DBN,q:"Interview classic (duplicates). Before email could be a UNIQUE column of the import, find the emails in <code>signup_import</code> that appear more than once, ignoring missing emails. Return the email and how many times it appears, sorted by email.",answer:"SELECT email, COUNT(*) AS copies FROM signup_import WHERE email IS NOT NULL GROUP BY email HAVING COUNT(*) > 1 ORDER BY email",ordered:true,
 hint:"GROUP BY email HAVING COUNT(*) > 1, and keep the NULL group out.",why:`<code>SELECT email, COUNT(*) FROM signup_import WHERE email IS NOT NULL GROUP BY email HAVING COUNT(*) > 1 ORDER BY email;</code> gives 4 emails; rohan.fernandes appears three times. GROUP BY puts all NULLs into one group, so without the WHERE the two missing emails would show up as a "duplicate" that UNIQUE would in fact allow.`},
{t:"sql",db:DBN,q:"Domain check. Which import rows would be rejected by the column definition <code>plan TEXT NOT NULL CHECK (plan IN ('Free','Plus','Pro'))</code>? Return import_id and plan, by import_id.",answer:"SELECT import_id, plan FROM signup_import WHERE plan IS NULL OR plan NOT IN ('Free','Plus','Pro') ORDER BY import_id",ordered:true,
 hint:"Two rules: the CHECK catches values outside the list; NOT NULL catches the missing one. NOT IN alone never matches NULL.",why:`<code>SELECT import_id, plan FROM signup_import WHERE plan IS NULL OR plan NOT IN ('Free','Plus','Pro') ORDER BY import_id;</code> gives rows 10 ('Gold'), 18 ('pro') and 26 (NULL). Note 'pro': SQLite compares text case-sensitively, so it fails. In MySQL the default collation is case-insensitive, so 'pro' would pass the same CHECK; an ENUM column would store it as 'Pro'.`},
{t:"sql",db:DBN,setup:"CREATE TABLE tickets_a (ticket_id INTEGER PRIMARY KEY, topic TEXT); CREATE TABLE tickets_b (ticket_id INTEGER PRIMARY KEY AUTOINCREMENT, topic TEXT); INSERT INTO tickets_a (topic) VALUES ('login'), ('refund'), ('video'); INSERT INTO tickets_b (topic) VALUES ('login'), ('refund'), ('video');",
 q:"The setup made two support-ticket tables with three tickets each (ids 1, 2, 3): <code>tickets_a (ticket_id INTEGER PRIMARY KEY, topic TEXT)</code> and <code>tickets_b (ticket_id INTEGER PRIMARY KEY AUTOINCREMENT, topic TEXT)</code>. In both, delete the ticket with the highest id, then insert one ticket with topic 'certificate' and let SQLite choose its id.",
 answer:"DELETE FROM tickets_a WHERE ticket_id = (SELECT MAX(ticket_id) FROM tickets_a); DELETE FROM tickets_b WHERE ticket_id = (SELECT MAX(ticket_id) FROM tickets_b); INSERT INTO tickets_a (topic) VALUES ('certificate'); INSERT INTO tickets_b (topic) VALUES ('certificate');",
 check:"SELECT 'a', ticket_id, topic FROM tickets_a UNION ALL SELECT 'b', ticket_id, topic FROM tickets_b",
 hint:"Four statements. Do not give ticket_id a value in the INSERTs.",why:`Delete with <code>WHERE ticket_id = (SELECT MAX(ticket_id) FROM ...)</code>, then <code>INSERT INTO tickets_a (topic) VALUES ('certificate');</code> and the same for tickets_b. tickets_a gives the new ticket id 3 again (largest existing id + 1); tickets_b gives it 4, because AUTOINCREMENT remembers the highest id ever used. MySQL's AUTO_INCREMENT behaves like tickets_b.${MN("MySQL refuses a DELETE whose subquery reads the same table (error 1093). There, find the id first (SELECT MAX(ticket_id) …) and delete it by value, or wrap the subquery in a derived table: WHERE ticket_id = (SELECT m FROM (SELECT MAX(ticket_id) AS m FROM tickets_a) AS x).")}`},
{t:"mcq",q:"In learners, both learner_id and email identify a learner, and learner_id is the primary key. What is email, in the language of keys?",opts:["An alternate key: a candidate key that was not chosen as primary","A foreign key","A composite key","Not a key at all, because it can be NULL"],a:0,
 hint:"Both are minimal identifiers; only one can be crowned.",why:"Both are candidate keys; the one not chosen is an alternate key, enforced with UNIQUE. (Strictly, a candidate key should also be NOT NULL; the platform allows a learner without an email, so email identifies only those who have one.) Choosing the surrogate learner_id over the natural email is the usual practice because emails change."},
{t:"sql",db:DBN,q:"Interview classic (parents without children). List instructor_id and full_name of the instructors who are not the instructor of any course, by instructor_id.",answer:"SELECT i.instructor_id, i.full_name FROM instructors AS i LEFT JOIN courses AS c ON c.instructor_id = i.instructor_id WHERE c.course_id IS NULL ORDER BY i.instructor_id",ordered:true,
 hint:"LEFT JOIN courses and keep the rows where no course matched; or NOT EXISTS. Careful with NOT IN: courses.instructor_id has a NULL.",why:`<code>SELECT i.instructor_id, i.full_name FROM instructors i LEFT JOIN courses c ON c.instructor_id = i.instructor_id WHERE c.course_id IS NULL ORDER BY i.instructor_id;</code> gives Anita Saikia (11) and Vivek Shah (12). <code>WHERE instructor_id NOT IN (SELECT instructor_id FROM courses)</code> returns nothing at all, because Text Analytics has a NULL instructor: the NOT IN NULL trap from Module 4.`}
]});

L.push({id:"l3",badge:"Renovator",code:"File 3",title:"Renovations: ALTER, DROP and the rebuild",topics:"ALTER TABLE ADD, RENAME and DROP COLUMN; what SQLite cannot alter; the table rebuild pattern; DROP TABLE; DELETE vs TRUNCATE vs DROP",
story:`<b>The schema has to move.</b> Product wants every course to carry a teaching language. Support renamed "phone" to "mobile" on every form and wants the column to match. And the old price list, which someone built with fees stored as text, needs a real primary key and a rule that fees are positive. Some of this is one line of SQL. Some of it, in SQLite, means rebuilding a table while it stays in use.`,
brief:`<p><code>ALTER TABLE</code> changes structure without losing rows. Every SQL (Structured Query Language) product supports adding and renaming; what else it supports varies.</p>
<div class="formula">ALTER TABLE courses ADD COLUMN language TEXT NOT NULL DEFAULT 'English';
ALTER TABLE learners RENAME COLUMN phone TO mobile;
ALTER TABLE enrolment_flat DROP COLUMN batch_slot;
ALTER TABLE signup_import RENAME TO signup_staging;
DROP TABLE IF EXISTS course_catalogue;     -- structure and rows gone
DELETE FROM mentoring;                     -- rows gone, structure kept</div>
<p>SQLite's ALTER TABLE can only rename a table, rename a column, add a column and drop a column. An added column cannot be PRIMARY KEY or UNIQUE, and NOT NULL needs a non-NULL DEFAULT (the existing rows need a value). A column cannot be dropped if it is a key, UNIQUE, indexed, used in a foreign key or named in a table-level CHECK. Anything else, such as changing a type or adding a constraint, uses the <span class="term">table rebuild pattern</span>: create the new table, copy the rows with INSERT … SELECT, drop the old table, rename the new one.</p>
<div class="formula">CREATE TABLE price_list_new (course_code TEXT PRIMARY KEY,
                             fee REAL NOT NULL CHECK (fee > 0));
INSERT INTO price_list_new SELECT course_code, fee FROM price_list;
DROP TABLE price_list;
ALTER TABLE price_list_new RENAME TO price_list;</div>
<p><span class="term">DELETE</span> is DML (Data Manipulation Language): it removes the rows a WHERE picks, or all rows. <span class="term">TRUNCATE</span> (MySQL) is DDL (Data Definition Language): it empties the whole table at once and resets the AUTO_INCREMENT counter. <span class="term">DROP</span> removes the table itself. A table that other tables still reference cannot simply be dropped.</p>
${MN("MySQL also has ALTER TABLE ... MODIFY COLUMN fee DECIMAL(10,2) NOT NULL (change a type), CHANGE COLUMN old new type (rename and retype), ADD CONSTRAINT chk CHECK (...), DROP CHECK chk and ALTER COLUMN x SET DEFAULT v. None of these exist in SQLite: use the rebuild pattern (the SQLite documentation describes a twelve-step version that also switches foreign keys off and recreates indexes and triggers). TRUNCATE TABLE t does not exist here: write DELETE FROM t (without a WHERE, SQLite can usually clear the table in one fast step, its truncate optimisation, but it does not reset an AUTOINCREMENT counter). In MySQL, DDL statements commit immediately and cannot be undone; dropping a table that a foreign key references fails with error 3730. In SQLite a DROP TABLE first deletes the rows, so it fails with \"FOREIGN KEY constraint failed\" while child rows still point at it.")}`,
refs:"SQLite documentation: <i>ALTER TABLE</i> (including \"Making Other Kinds Of Table Schema Changes\"), <i>DROP TABLE</i>, <i>DELETE</i> (sqlite.org/lang_altertable.html, lang_droptable.html, lang_delete.html) · MySQL 8.0 Reference Manual: <i>ALTER TABLE Statement</i>, <i>TRUNCATE TABLE Statement</i> · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020).",
lab:root=>{labRebuild(root);},
qs:[
{t:"sql",db:DBN,q:"Add a column <code>language</code> to courses: text, compulsory, with default 'English'.",answer:"ALTER TABLE courses ADD COLUMN language TEXT NOT NULL DEFAULT 'English'",
 check:"INSERT INTO courses (course_id, course_code, title, category, level, fee, launched_on) VALUES (199, 'ZZ999', 'Probe', 'Data', 'Beginner', 1, '2026-10-01'); INSERT OR IGNORE INTO courses (course_id, course_code, title, category, level, fee, launched_on, language) VALUES (198, 'ZZ998', 'Probe two', 'Data', 'Beginner', 1, '2026-10-01', NULL); SELECT course_id, language FROM courses WHERE course_id IN (101, 198, 199) ORDER BY course_id",ordered:true,
 hint:"ALTER TABLE courses ADD COLUMN name type constraints;",why:`<code>ALTER TABLE courses ADD COLUMN language TEXT NOT NULL DEFAULT 'English';</code> Existing rows get 'English' at once. The checker inserts one course without a language (it gets the default) and one with NULL (NOT NULL rejects it). Without the DEFAULT, SQLite refuses: "Cannot add a NOT NULL column with default value NULL".`},
{t:"sql",db:DBN,q:"Rename the column <code>phone</code> of learners to <code>mobile</code>.",answer:"ALTER TABLE learners RENAME COLUMN phone TO mobile",
 check:"SELECT name FROM pragma_table_info('learners') ORDER BY cid",ordered:true,
 hint:"ALTER TABLE ... RENAME COLUMN old TO new;",why:`<code>ALTER TABLE learners RENAME COLUMN phone TO mobile;</code> keeps the data and the column position. The same statement works in MySQL 8.0; older MySQL used CHANGE COLUMN phone mobile VARCHAR(15).`},
{t:"sql",db:DBN,q:"batch_slot in <code>enrolment_flat</code> only repeats what batch_code already tells you. Drop the column.",answer:"ALTER TABLE enrolment_flat DROP COLUMN batch_slot",
 check:"SELECT name FROM pragma_table_info('enrolment_flat') ORDER BY cid",ordered:true,
 hint:"ALTER TABLE ... DROP COLUMN ...;",why:`<code>ALTER TABLE enrolment_flat DROP COLUMN batch_slot;</code> (SQLite 3.35 or later). The table keeps 13 columns. File 7 explains why batch_slot belongs in a batches table, keyed by batch_code.`},
{t:"mcq",q:"Which of these statements does SQLite refuse?",opts:["ALTER TABLE learners ADD COLUMN referral_code TEXT UNIQUE","ALTER TABLE learners ADD COLUMN referral_code TEXT DEFAULT 'none'","ALTER TABLE learners RENAME COLUMN phone TO mobile","ALTER TABLE learners DROP COLUMN phone"],a:0,
 hint:"An added column must not need an index built over existing rows.",why:"SQLite answers \"Cannot add a UNIQUE column\". Add the column without UNIQUE and then CREATE UNIQUE INDEX on it (indexes are Module 7), or rebuild the table. MySQL accepts ADD COLUMN ... UNIQUE directly."},
{t:"sql",db:DBN,setup:"CREATE TABLE price_list (course_code TEXT, fee TEXT); INSERT INTO price_list VALUES ('SQL101', '4999'), ('PY101', '5999'), ('ST101', '4499');",
 q:"The setup made <code>price_list (course_code TEXT, fee TEXT)</code> with three rows. Rebuild it so that course_code is the PRIMARY KEY and fee is REAL NOT NULL CHECK (fee &gt; 0). Keep the three rows, the table name and the column order.",
 answer:"CREATE TABLE price_list_new (course_code TEXT PRIMARY KEY, fee REAL NOT NULL CHECK (fee > 0)); INSERT INTO price_list_new (course_code, fee) SELECT course_code, fee FROM price_list; DROP TABLE price_list; ALTER TABLE price_list_new RENAME TO price_list;",
 check:"INSERT OR IGNORE INTO price_list VALUES ('SQL101', 1), ('BAD1', -5), ('NULL1', NULL); SELECT course_code, fee, typeof(fee) FROM price_list ORDER BY course_code",ordered:true,
 hint:"Four statements: CREATE the new table, INSERT … SELECT, DROP the old, RENAME the new.",why:`<code>CREATE TABLE price_list_new (course_code TEXT PRIMARY KEY, fee REAL NOT NULL CHECK (fee > 0)); INSERT INTO price_list_new SELECT course_code, fee FROM price_list; DROP TABLE price_list; ALTER TABLE price_list_new RENAME TO price_list;</code> REAL affinity turns the text '4999' into 4999.0 during the copy (typeof says real). The checker's probes are all rejected: a duplicate key, a negative fee, a NULL fee. In MySQL (with course_code declared as a VARCHAR) one statement does it: ALTER TABLE price_list MODIFY fee DECIMAL(10,2) NOT NULL, ADD PRIMARY KEY (course_code), ADD CHECK (fee > 0).`},
{t:"sql",db:DBN,q:"Empty the <code>mentoring</code> table but keep its structure. (In MySQL you might write TRUNCATE TABLE mentoring.)",answer:"DELETE FROM mentoring",
 check:"SELECT COUNT(*), (SELECT COUNT(*) FROM pragma_table_info('mentoring')) FROM mentoring",
 hint:"There is no TRUNCATE in SQLite.",why:`<code>DELETE FROM mentoring;</code> removes all 38 rows and keeps the 3 columns. DROP TABLE mentoring would remove the structure too, and the checker's SELECT would then fail with "no such table".`},
{t:"mcq",q:"In this game, what does <code>DROP TABLE courses;</code> do?",opts:["It fails with \"FOREIGN KEY constraint failed\" and the table keeps all its rows, because enrolments still refer to courses","It drops courses and every enrolment that referred to them","It drops courses and leaves the enrolments pointing at nothing","It drops courses and sets enrolments.course_id to NULL"],a:0,
 hint:"SQLite performs a DELETE FROM courses before dropping, and enrolments.course_id is ON DELETE RESTRICT.",why:"With foreign keys on, SQLite first deletes the rows, which the RESTRICT rule on enrolments refuses, so the whole DROP fails and nothing changes. (Lessons and prerequisites would have cascaded, but the statement never gets that far.) MySQL refuses even earlier, with error 3730, because a foreign key references the table."}
]});

L.push({id:"l4",badge:"Loader",code:"File 4",title:"The loading bay: INSERT, UPDATE, DELETE, upsert",topics:"Multi-row INSERT, INSERT … SELECT, UPDATE and DELETE with WHERE, correlated UPDATE, upsert: ON CONFLICT vs ON DUPLICATE KEY UPDATE, INSERT IGNORE, REPLACE; safe updates; removing duplicates",
story:`<b>Three new instructors, forty sign-ups and a progress feed.</b> Faculty onboarding has new instructors to add. The clean part of the sign-up import has to reach <code>learners</code>. The video player sends a nightly feed of progress figures, some for enrolments that exist and some for brand-new ones. And Finance has approved a fee rise for Advanced courses only. Every one of these is a statement that changes rows, and every one of them is one missing WHERE away from changing all of them.`,
brief:`<p>The three DML (Data Manipulation Language) statements:</p>
<div class="formula">INSERT INTO instructors (instructor_id, full_name, email, dept, joined_on)
VALUES (13, 'Meenal Desai', 'meenal.desai@learnsphere.example', 'Design', '2026-10-01'),
       (14, 'Rohit Bansal', 'rohit.bansal@learnsphere.example', 'Data', '2026-10-01');
INSERT INTO archive_table (a, b) SELECT a, b FROM t WHERE ...;   -- many rows at once
UPDATE courses SET fee = ROUND(fee * 1.08) WHERE level = 'Advanced';
UPDATE courses SET total_minutes =
       (SELECT SUM(minutes) FROM lessons l WHERE l.course_id = courses.course_id);
DELETE FROM enrolments WHERE status = 'Dropped' AND ... ;</div>
<p>Columns left out of an INSERT get their DEFAULT, or NULL. Before any UPDATE or DELETE, run a SELECT with the same WHERE and look at the rows it picks: the WHERE is the only thing between you and the whole table. A statement is atomic: if one row of a multi-row INSERT breaks a constraint, none of its rows are kept.</p>
<p>An <span class="term">upsert</span> inserts a row, or updates it if its key already exists. SQLite writes it as <code>ON CONFLICT (key) DO UPDATE SET col = excluded.col</code>, where <code>excluded</code> is the row that failed to go in; <code>DO NOTHING</code> skips it. <code>INSERT OR IGNORE</code> skips conflicting rows. <code>REPLACE</code> (INSERT OR REPLACE) deletes the old row and inserts the new one, so columns you did not supply fall back to their defaults and ON DELETE CASCADE children of the old row are deleted with it.</p>
${MN("MySQL writes the upsert as INSERT INTO t (...) VALUES (...) AS new ON DUPLICATE KEY UPDATE col = new.col (older code uses VALUES(col)). INSERT IGNORE is MySQL's INSERT OR IGNORE; REPLACE INTO exists in both and deletes then inserts in both. In SQLite, an INSERT ... SELECT ... ON CONFLICT needs a WHERE clause in the SELECT (WHERE true will do), otherwise ON is read as part of a join. MySQL's safe-update mode (SET sql_safe_updates = 1, switched on by default in some MySQL clients) refuses an UPDATE or DELETE whose WHERE does not use a key column; SQLite has no such guard. MySQL updates from a join with UPDATE a JOIN b ON ... SET ...; SQLite 3.33+ has UPDATE a SET ... FROM b WHERE ...")}`,
refs:"SQLite documentation: <i>INSERT</i>, <i>UPSERT</i>, <i>UPDATE</i>, <i>DELETE</i> and <i>The ON CONFLICT Clause</i> (sqlite.org/lang_insert.html, lang_upsert.html, lang_update.html, lang_delete.html, lang_conflict.html) · MySQL 8.0 Reference Manual: <i>INSERT ... ON DUPLICATE KEY UPDATE Statement</i>, <i>REPLACE Statement</i> · Molinaro & de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), chapter on inserting, updating and deleting.",
lab:root=>{labUpsert(root);sbUpsert(root);},
qs:[
{t:"sql",db:DBN,q:"Add three instructors in one INSERT: (13, 'Meenal Desai', 'meenal.desai@learnsphere.example', 'Design', '2026-10-01'), (14, 'Rohit Bansal', 'rohit.bansal@learnsphere.example', 'Data', '2026-10-01') and (15, 'Lata Krishnan', 'lata.krishnan@learnsphere.example', 'Business', '2026-10-05'). The columns are instructor_id, full_name, email, dept, joined_on.",
 answer:"INSERT INTO instructors (instructor_id, full_name, email, dept, joined_on) VALUES (13, 'Meenal Desai', 'meenal.desai@learnsphere.example', 'Design', '2026-10-01'), (14, 'Rohit Bansal', 'rohit.bansal@learnsphere.example', 'Data', '2026-10-01'), (15, 'Lata Krishnan', 'lata.krishnan@learnsphere.example', 'Business', '2026-10-05')",
 check:"SELECT * FROM instructors WHERE instructor_id >= 13 ORDER BY instructor_id",ordered:true,
 hint:"One VALUES keyword, three bracketed rows separated by commas.",why:`<code>INSERT INTO instructors (instructor_id, full_name, email, dept, joined_on) VALUES (13, ...), (14, ...), (15, ...);</code> Naming the columns makes the statement survive a later ALTER TABLE ... ADD COLUMN. All three rows pass dept's CHECK and email's UNIQUE.`},
{t:"sql",db:DBN,q:"Interview-style data load. Copy the clean rows of <code>signup_import</code> into learners. Clean means: full_name is neither NULL nor ''; email is not NULL and not already used in learners; plan is exactly 'Free', 'Plus' or 'Pro'; city_name exists in cities; signup_date matches LIKE '____-__-__'. If an email appears more than once in the import, load only its row with the smallest import_id. Use learner_id = 1000 + import_id, phone NULL and the city_id from cities.",
 answer:"INSERT INTO learners (learner_id, full_name, email, phone, city_id, signup_date, plan) SELECT 1000 + s.import_id, s.full_name, s.email, NULL, c.city_id, s.signup_date, s.plan FROM signup_import AS s JOIN cities AS c ON c.city_name = s.city_name WHERE s.full_name IS NOT NULL AND s.full_name <> '' AND s.email IS NOT NULL AND s.email NOT IN (SELECT email FROM learners WHERE email IS NOT NULL) AND s.plan IN ('Free', 'Plus', 'Pro') AND s.signup_date LIKE '____-__-__' AND s.import_id = (SELECT MIN(s2.import_id) FROM signup_import AS s2 WHERE s2.email = s.email)",
 check:"SELECT learner_id, full_name, email, city_id, plan, signup_date FROM learners WHERE learner_id > 1000 ORDER BY learner_id",ordered:true,
 hint:"INSERT INTO learners (...) SELECT ... FROM signup_import JOIN cities ... WHERE ...; learners.email contains NULLs, so a bare NOT IN (SELECT email FROM learners) matches nothing.",why:`<code>INSERT INTO learners (learner_id, full_name, email, phone, city_id, signup_date, plan) SELECT 1000 + s.import_id, s.full_name, s.email, NULL, c.city_id, s.signup_date, s.plan FROM signup_import s JOIN cities c ON c.city_name = s.city_name WHERE s.full_name &lt;&gt; '' AND s.email IS NOT NULL AND s.email NOT IN (SELECT email FROM learners WHERE email IS NOT NULL) AND s.plan IN ('Free','Plus','Pro') AND s.signup_date LIKE '____-__-__' AND s.import_id = (SELECT MIN(import_id) FROM signup_import s2 WHERE s2.email = s.email);</code> loads 22 rows. The JOIN drops the two unknown cities; the other rules drop the missing names and emails, the invalid plans ('Gold', 'pro', NULL), the '12/08/2026' date, the emails that already belong to learners and the later copies of repeated emails.`},
{t:"sql",db:DBN,q:"Finance approves an 8% fee rise for Advanced courses only, rounded to the nearest rupee: <code>ROUND(fee * 1.08)</code>.",answer:"UPDATE courses SET fee = ROUND(fee * 1.08) WHERE level = 'Advanced'",
 check:"SELECT course_id, fee FROM courses ORDER BY course_id",ordered:true,
 hint:"UPDATE ... SET ... WHERE level = 'Advanced'.",why:`<code>UPDATE courses SET fee = ROUND(fee * 1.08) WHERE level = 'Advanced';</code> changes 3 rows: Machine Learning goes from 12,999 to 14,039. Preview first with SELECT course_id, fee, ROUND(fee * 1.08) FROM courses WHERE level = 'Advanced'.`},
{t:"sql",db:DBN,setup:"ALTER TABLE courses ADD COLUMN total_minutes INTEGER;",q:"The setup added an empty column <code>courses.total_minutes</code>. Fill it, for every course, with the total minutes of that course's lessons.",
 answer:"UPDATE courses SET total_minutes = (SELECT SUM(l.minutes) FROM lessons AS l WHERE l.course_id = courses.course_id)",
 check:"SELECT course_id, total_minutes FROM courses ORDER BY course_id",ordered:true,
 hint:"A correlated subquery in SET: SUM(minutes) FROM lessons WHERE lessons.course_id = courses.course_id.",why:`<code>UPDATE courses SET total_minutes = (SELECT SUM(minutes) FROM lessons l WHERE l.course_id = courses.course_id);</code> runs the subquery once per course. Without the correlation every course would get the grand total of all lessons. Storing a total like this is a deliberate redundancy: it must be refreshed whenever lessons change.`},
{t:"sql",db:DBN,q:"Delete every enrolment with status 'Dropped' that has no payment at all.",answer:"DELETE FROM enrolments WHERE status = 'Dropped' AND NOT EXISTS (SELECT 1 FROM payments AS p WHERE p.learner_id = enrolments.learner_id AND p.course_id = enrolments.course_id)",
 check:"SELECT (SELECT COUNT(*) FROM enrolments), (SELECT COUNT(*) FROM enrolments WHERE status = 'Dropped'), (SELECT COUNT(*) FROM payments)",
 hint:"NOT EXISTS (SELECT 1 FROM payments p WHERE p.learner_id = enrolments.learner_id AND p.course_id = enrolments.course_id).",why:`<code>DELETE FROM enrolments WHERE status = 'Dropped' AND NOT EXISTS (SELECT 1 FROM payments p WHERE p.learner_id = enrolments.learner_id AND p.course_id = enrolments.course_id);</code> removes 16 rows and leaves every payment in place. Deleting all Dropped enrolments would also have cascaded away the payments of those who had paid.`},
{t:"sql",db:DBN,setup:"CREATE TABLE progress_feed (learner_id INTEGER, course_id INTEGER, progress_pct INTEGER); INSERT INTO progress_feed VALUES (12, 101, 95), (17, 114, 60), (45, 101, 10), (133, 103, 5);",
 q:"The nightly <code>progress_feed (learner_id, course_id, progress_pct)</code> has four rows. Apply it to enrolments as an upsert: where the pair already exists, set progress_pct to the feed's value and change nothing else; where it is new, insert it with enrolled_on '2026-10-01' and status 'Active'.",
 answer:"INSERT INTO enrolments (learner_id, course_id, enrolled_on, status, progress_pct) SELECT learner_id, course_id, '2026-10-01', 'Active', progress_pct FROM progress_feed WHERE true ON CONFLICT (learner_id, course_id) DO UPDATE SET progress_pct = excluded.progress_pct",
 check:"SELECT (SELECT COUNT(*) FROM payments), e.learner_id, e.course_id, e.enrolled_on, e.status, e.progress_pct FROM enrolments AS e WHERE (e.learner_id, e.course_id) IN (SELECT learner_id, course_id FROM progress_feed) ORDER BY e.learner_id, e.course_id",ordered:true,
 hint:"INSERT … SELECT … FROM progress_feed WHERE true ON CONFLICT (learner_id, course_id) DO UPDATE SET progress_pct = excluded.progress_pct.",why:`<code>INSERT INTO enrolments (learner_id, course_id, enrolled_on, status, progress_pct) SELECT learner_id, course_id, '2026-10-01', 'Active', progress_pct FROM progress_feed WHERE true ON CONFLICT (learner_id, course_id) DO UPDATE SET progress_pct = excluded.progress_pct;</code> updates two enrolments and inserts two. INSERT OR REPLACE would look similar but delete and re-insert the existing rows: their enrolled_on would change and their payments would cascade away (the checker counts payments).`},
{t:"sql",db:DBN,q:"Interview classic (delete duplicates, keep one). In <code>signup_import</code>, delete the later copies of every repeated email, keeping the row with the smallest import_id. Leave rows with a missing email alone.",
 answer:"DELETE FROM signup_import WHERE email IS NOT NULL AND import_id NOT IN (SELECT MIN(import_id) FROM signup_import WHERE email IS NOT NULL GROUP BY email)",
 check:"SELECT import_id FROM signup_import ORDER BY import_id",ordered:true,
 hint:"Keep MIN(import_id) per email; delete the rest. Keep the NULL emails out of both the GROUP BY and the DELETE.",why:`<code>DELETE FROM signup_import WHERE email IS NOT NULL AND import_id NOT IN (SELECT MIN(import_id) FROM signup_import WHERE email IS NOT NULL GROUP BY email);</code> removes 5 rows (11, 19, 27, 33, 38) and keeps 35. Equivalent: <code>DELETE FROM signup_import WHERE EXISTS (SELECT 1 FROM signup_import s2 WHERE s2.email = signup_import.email AND s2.import_id &lt; signup_import.import_id)</code>, or ROW_NUMBER() OVER (PARTITION BY email ORDER BY import_id) &gt; 1 from Module 5.${MN("Both forms run here. MySQL refuses a DELETE whose subquery reads the table being deleted from (error 1093); wrap the subquery in a derived table, NOT IN (SELECT m FROM (SELECT MIN(import_id) AS m FROM signup_import WHERE email IS NOT NULL GROUP BY email) AS keep), or use DELETE s FROM signup_import s JOIN signup_import s2 ON s2.email = s.email AND s2.import_id &lt; s.import_id.")}`}
]});

L.push({id:"l5",badge:"Ripple Tamer",code:"File 5",title:"Chain reactions: foreign-key actions",topics:"ON DELETE CASCADE, SET NULL, RESTRICT and NO ACTION; ON UPDATE; composite and self-referencing foreign keys; PRAGMA foreign_keys; constraint probes and orphan audits",
story:`<b>The deletion requests.</b> A learner has asked for their account to be erased. An instructor is leaving. A course is being retired. Each is a single DELETE on a parent row, and each sets off a different chain reaction, because LearnSphere's foreign keys were written with different actions. Before anyone presses Enter, you want to know which rows will vanish, which will be orphaned, and which deletions the database will refuse.`,
brief:`<p>A foreign key says what happens to child rows when their parent row is deleted or its key is changed. The <span class="term">referential actions</span>:</p>
<div class="formula">REFERENCES parent(key) ON DELETE CASCADE    -- delete the children too
REFERENCES parent(key) ON DELETE SET NULL   -- keep the children, blank the reference
REFERENCES parent(key) ON DELETE RESTRICT   -- refuse to delete the parent
REFERENCES parent(key) ON DELETE NO ACTION  -- the default: refuse (checked at the end of the statement)
REFERENCES parent(key) ON UPDATE CASCADE    -- a changed key is copied into the children</div>
<p>LearnSphere uses all of them:</p>
<div class="formula">enrolments.learner_id   → learners     ON DELETE CASCADE
payments (learner_id, course_id) → enrolments ON DELETE CASCADE   (composite foreign key)
courses.instructor_id   → instructors  ON DELETE SET NULL
enrolments.course_id    → courses      ON DELETE RESTRICT
lessons.course_id       → courses      ON DELETE CASCADE
course_prereqs (course_id, prereq_id) → courses ON DELETE CASCADE (self-referencing)</div>
<p>So deleting a learner removes their enrolments, and through them their payments: a two-level ripple. CASCADE is convenient and dangerous; RESTRICT forces the person deleting to deal with the children first, in the right order. SET NULL needs a nullable column: on a NOT NULL column the delete fails.</p>
<p>A constraint can be validated from two sides. <span class="term">Probes</span> are statements that must fail (a duplicate key, an orphan child). <span class="term">Audits</span> are queries that must return nothing, such as an anti-join that looks for children without a parent, which matters for data loaded while checks were off.</p>
${MN("MySQL's InnoDB engine always enforces foreign keys (unless SET FOREIGN_KEY_CHECKS = 0) and treats NO ACTION exactly like RESTRICT; it rejects ON DELETE SET DEFAULT, which SQLite supports. SQLite checks foreign keys only after PRAGMA foreign_keys = ON in each connection (this game does it for you), and offers PRAGMA foreign_key_check to list existing violations. The errors differ: MySQL reports 1451 (cannot delete a parent row) and 1452 (cannot add a child row); SQLite says \"FOREIGN KEY constraint failed\" for both.")}`,
refs:"SQLite documentation: <i>SQLite Foreign Key Support</i> (sqlite.org/foreignkeys.html) and <i>PRAGMA foreign_key_check</i> (sqlite.org/pragma.html) · MySQL 8.0 Reference Manual: <i>FOREIGN KEY Constraints</i> · Elmasri & Navathe (2016), chapter on the relational data model and relational database constraints · Laudon & Laudon (2022), ch. 6.",
lab:root=>{labRipple(root);},
qs:[
{t:"num",q:"Learner 17 asks to be erased: <code>DELETE FROM learners WHERE learner_id = 17;</code> How many rows of payments disappear with them? Use the lab, or count first.",a:4,tol:0,ph:"e.g. 4",
 hint:"Enrolments cascade from learners, and payments cascade from enrolments. Count payments WHERE learner_id = 17.",why:"Learner 17 has 3 enrolments; one was paid in two instalments, so 4 payment rows go. One DELETE on learners removes 1 + 3 + 4 = 8 rows in three tables. Run SELECT COUNT(*) FROM payments WHERE learner_id = 17 before, not after."},
{t:"sql",db:DBN,q:"Kabir Rao (instructor 2) is leaving. Hand his courses to Vivek Shah (instructor 12) first, then delete Kabir's instructor row.",
 answer:"UPDATE courses SET instructor_id = 12 WHERE instructor_id = 2; DELETE FROM instructors WHERE instructor_id = 2;",
 check:"SELECT course_id, instructor_id FROM courses UNION ALL SELECT 'instructors left', COUNT(*) FROM instructors",
 hint:"Order matters: UPDATE courses first. ON DELETE SET NULL would otherwise blank his courses.",why:`<code>UPDATE courses SET instructor_id = 12 WHERE instructor_id = 2; DELETE FROM instructors WHERE instructor_id = 2;</code> Delete first and the SET NULL action leaves SQL Basics and Advanced SQL with no instructor; the later UPDATE then finds nothing to change.`},
{t:"sql",db:DBN,q:"Retire course 117 (Text Analytics). enrolments.course_id is ON DELETE RESTRICT, so remove the course's enrolments first (their payments cascade), then the course itself (its lessons and prerequisite links cascade).",
 answer:"DELETE FROM enrolments WHERE course_id = 117; DELETE FROM courses WHERE course_id = 117;",
 check:"SELECT (SELECT COUNT(*) FROM courses), (SELECT COUNT(*) FROM enrolments), (SELECT COUNT(*) FROM payments), (SELECT COUNT(*) FROM lessons), (SELECT COUNT(*) FROM course_prereqs)",
 hint:"Two DELETEs, children first.",why:`<code>DELETE FROM enrolments WHERE course_id = 117; DELETE FROM courses WHERE course_id = 117;</code> One DELETE on courses alone fails with "FOREIGN KEY constraint failed". In total the two statements remove 1 course, 7 enrolments, their payments, the course's lessons and its prerequisite link to Machine Learning.`},
{t:"sql",db:DBN,setup:"PRAGMA foreign_keys = OFF; INSERT INTO enrolments VALUES (151, 101, '2026-10-02', 'Active', 0), (160, 113, '2026-10-02', 'Active', 0); PRAGMA foreign_keys = ON;",
 q:"Orphan audit. Somebody loaded two enrolments while foreign keys were switched off (the setup replays it). List learner_id and course_id of the enrolments whose learner does not exist in learners, by learner_id.",
 answer:"SELECT e.learner_id, e.course_id FROM enrolments AS e LEFT JOIN learners AS l ON l.learner_id = e.learner_id WHERE l.learner_id IS NULL ORDER BY e.learner_id",ordered:true,
 hint:"An anti-join: LEFT JOIN learners and keep the rows with no match; or NOT EXISTS.",why:`<code>SELECT e.learner_id, e.course_id FROM enrolments e LEFT JOIN learners l ON l.learner_id = e.learner_id WHERE l.learner_id IS NULL ORDER BY e.learner_id;</code> finds (151, 101) and (160, 113). SQLite can also list them for you: SELECT * FROM pragma_foreign_key_check('enrolments'). Turning the check back on does not repair rows already loaded.`},
{t:"sql",db:DBN,q:"Create <code>certificates</code>: cert_id INTEGER PRIMARY KEY; learner_id INTEGER NOT NULL referring to learners(learner_id), where deleting a learner deletes their certificates; course_id INTEGER NOT NULL referring to courses(course_id), where deleting a course is refused while certificates exist; issued_on TEXT NOT NULL.",
 answer:"CREATE TABLE certificates (cert_id INTEGER PRIMARY KEY, learner_id INTEGER NOT NULL REFERENCES learners(learner_id) ON DELETE CASCADE, course_id INTEGER NOT NULL REFERENCES courses(course_id) ON DELETE RESTRICT, issued_on TEXT NOT NULL)",
 check:"SELECT \"table\", \"from\", on_delete FROM pragma_foreign_key_list('certificates') ORDER BY \"from\"",ordered:true,
 hint:"REFERENCES learners(learner_id) ON DELETE CASCADE, REFERENCES courses(course_id) ON DELETE RESTRICT.",why:`<code>CREATE TABLE certificates (cert_id INTEGER PRIMARY KEY, learner_id INTEGER NOT NULL REFERENCES learners(learner_id) ON DELETE CASCADE, course_id INTEGER NOT NULL REFERENCES courses(course_id) ON DELETE RESTRICT, issued_on TEXT NOT NULL);</code> The checker reads pragma_foreign_key_list. In MySQL write the two keys as table-level clauses, FOREIGN KEY (learner_id) REFERENCES learners(learner_id) ON DELETE CASCADE and FOREIGN KEY (course_id) REFERENCES courses(course_id) ON DELETE RESTRICT: MySQL silently ignores a REFERENCES written after a column's type. A learner's right to be erased and a course's paper trail pull in opposite directions; the actions write that business decision down.`},
{t:"mcq",q:"A colleague runs a script in a fresh SQLite connection that deletes a course with enrolments, and no error appears. What is the most likely reason?",opts:["Foreign-key enforcement was off: SQLite needs PRAGMA foreign_keys = ON in every new connection","The enrolments were deleted by CASCADE","SQLite never enforces RESTRICT","The course had no lessons"],a:0,
 hint:"What is SQLite's default for foreign keys?",why:"For backward compatibility SQLite ships with foreign-key enforcement off in each connection. The delete went through and left orphan enrolments, which only an audit (or PRAGMA foreign_key_check) will reveal. MySQL's InnoDB would have refused with error 1451."},
{t:"mcq",q:"Suppose courses.instructor_id were declared <code>NOT NULL REFERENCES instructors(instructor_id) ON DELETE SET NULL</code>. What would deleting an instructor who teaches courses do?",opts:["Fail with \"NOT NULL constraint failed\": SET NULL cannot write NULL into a NOT NULL column","Set the column to NULL anyway","Delete the courses instead","Delete the instructor and leave the courses pointing at the old id"],a:0,
 hint:"The action tries to write NULL. Which other constraint is watching?",why:"The SET NULL action runs as an update of the child rows, and that update breaks NOT NULL, so the whole DELETE fails. Total participation (every course must have an instructor) and SET NULL contradict each other: choose RESTRICT or reassign first, as you did for Kabir Rao."}
]});

L.push({id:"l6",badge:"Dependency Detective",code:"File 6",title:"Who determines what: dependencies and anomalies",topics:"Functional dependencies, determinants, Armstrong's axioms and closure, full, partial and transitive dependency, prime attributes; insert, update and delete anomalies; testing a dependency with SQL",
story:`<b>Two emails for one person.</b> Statements to Kabir Rao's learners bounce, and nobody can say which of his two email addresses is right. The legacy register <code>enrolment_flat</code> stores his email in fourteen rows; somebody updated two of them. That is not a typo problem, it is a design problem: the table lets one fact live in many places. To fix the design you first need a precise way to say which column decides which.`,
brief:`<p>A <span class="term">functional dependency</span> (FD) X → Y ("X determines Y") holds in a table when any two rows that agree on X also agree on Y: know X and there is exactly one Y. X is the <span class="term">determinant</span>. In <code>enrolment_flat</code>, keyed by (learner_id, course_code):</p>
<div class="formula">learner_id      → learner_name, learner_phone, city
city            → state
course_code     → course_title, course_fee, instructor_id
instructor_id   → instructor_name, instructor_email
batch_code      → batch_slot
(learner_id, course_code) → batch_code, enrolled_on</div>
<p>FDs follow <span class="term">Armstrong's axioms</span>: reflexivity (if Y ⊆ X then X → Y), augmentation (X → Y gives XZ → YZ) and transitivity (X → Y and Y → Z give X → Z). The <span class="term">closure</span> X⁺ is every attribute X determines by repeated use of the rules; X is a super key when X⁺ is the whole table. Attributes inside some candidate key are <span class="term">prime</span>.</p>
<p>A non-key column has a <span class="term">full dependency</span> on the key if it needs all of it (enrolled_on needs both learner and course); a <span class="term">partial dependency</span> if part of a composite key is enough (learner_name needs only learner_id); a <span class="term">transitive dependency</span> if it hangs off another non-key column (course_code → instructor_id → instructor_email).</p>
<p>Partial and transitive dependencies cause <span class="term">anomalies</span>. <b>Update</b>: an instructor's email sits in 14 rows; change 12 and the table contradicts itself. <b>Insert</b>: a new course cannot be recorded until a learner enrols, because the key needs a learner_id. <b>Delete</b>: remove Pune's only learner and the table forgets that Pune is in Maharashtra.</p>
<p>An FD is a business rule, not a pattern in today's rows. Data can disprove one: <code>SELECT X FROM t GROUP BY X HAVING COUNT(DISTINCT Y) &gt; 1</code> lists the X values that break X → Y. An empty result is evidence, never proof.</p>
${MN("Everything in this file is standard SQL and runs the same way in MySQL. One difference matters for FD tests on text: MySQL's default collation compares text case-insensitively, so 'Pune' and 'PUNE' count as one value in COUNT(DISTINCT city) there and as two here.")}`,
refs:"Codd, <i>Communications of the ACM</i> 13(6) (1970) · Elmasri & Navathe (2016), chapter <i>Basics of Functional Dependencies and Normalization for Relational Databases</i> · Silberschatz, Korth & Sudarshan (2019), chapter <i>Relational Database Design</i> · Ramakrishnan & Gehrke, <i>Database Management Systems</i> (3rd ed., 2003), chapter <i>Schema Refinement and Normal Forms</i>.",
lab:root=>{labAnomaly(root);sbFD(root);},
qs:[
{t:"sql",db:DBN,q:"The update anomaly, counted: how many rows of <code>enrolment_flat</code> store an email for instructor 2? Return one number.",answer:"SELECT COUNT(*) FROM enrolment_flat WHERE instructor_id = 2",
 hint:"COUNT(*) with WHERE instructor_id = 2.",why:`<code>SELECT COUNT(*) FROM enrolment_flat WHERE instructor_id = 2;</code> gives 14. One fact, 14 copies: an email change needs 14 updates, and the register shows that 2 of them were done separately.`},
{t:"sql",db:DBN,q:"Test instructor_id → instructor_email on the data. For each instructor_id in <code>enrolment_flat</code> that maps to more than one distinct email, return the instructor_id and the number of distinct emails.",answer:"SELECT instructor_id, COUNT(DISTINCT instructor_email) FROM enrolment_flat GROUP BY instructor_id HAVING COUNT(DISTINCT instructor_email) > 1",
 hint:"GROUP BY the determinant; HAVING COUNT(DISTINCT dependent) > 1.",why:`<code>SELECT instructor_id, COUNT(DISTINCT instructor_email) FROM enrolment_flat GROUP BY instructor_id HAVING COUNT(DISTINCT instructor_email) &gt; 1;</code> returns (2, 2). The business rule says one email per instructor; the data now disagrees with itself, which is exactly what a table that stores one fact many times allows.`},
{t:"mcq",q:"enrolment_flat's key is (learner_id, course_code). Which dependency is <b>partial</b>?",opts:["learner_id → city","(learner_id, course_code) → enrolled_on","city → state","instructor_id → instructor_email"],a:0,
