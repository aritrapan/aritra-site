const NEWS_SETUP="CREATE TABLE newsletter (signup_id INTEGER PRIMARY KEY, email TEXT NOT NULL, signed_on TEXT NOT NULL);\nINSERT INTO newsletter (email, signed_on) SELECT email, signup_date FROM customers WHERE email IS NOT NULL AND cust_id % 3 = 0;\nINSERT INTO newsletter (email, signed_on) SELECT UPPER(email), DATE(signup_date, '+30 days') FROM customers WHERE email IS NOT NULL AND cust_id % 21 = 0;\nINSERT INTO newsletter (email, signed_on) SELECT '  ' || email, DATE(signup_date, '+60 days') FROM customers WHERE email IS NOT NULL AND cust_id % 33 = 0;";
L.push({id:"l6",badge:"String Surgeon",code:"File 6",title:"Cutting text",topics:"LENGTH, UPPER and LOWER, SUBSTR, INSTR, TRIM, REPLACE, || concatenation; MySQL SUBSTRING, LOCATE, CHAR_LENGTH, CONCAT; grouping by a text expression; duplicate emails",
story:`<b>The newsletter import.</b> Marketing has merged three sign-up sheets into one table. Some people typed their email in capitals, some pasted it with spaces in front, and the mailing tool will happily send them the same offer three times. Marketing also wants a domain report and the most common first names for a personalised campaign.`,
brief:`<p>Aggregates collapse many rows into one. <span class="term">Scalar functions</span> (single-row functions) do the opposite: one value in, one value out, for every row. They can be nested (evaluated inside out) and used in SELECT, WHERE, GROUP BY and ORDER BY. Positions in SQL (Structured Query Language) strings start at <b>1</b>.</p>
<div class="formula">LENGTH('Pune')                 4        number of characters
UPPER('pune') · LOWER('PUNE')  'PUNE' · 'pune'
SUBSTR('SaralMart', 1, 5)      'Saral'  start at 1, take 5
SUBSTR('SaralMart', 6)         'Mart'   from 6 to the end
SUBSTR('SaralMart', -4)        'Mart'   negative start counts from the end
INSTR('a@b.in', '@')           2        position of '@', 0 if absent
TRIM('  a  ') · LTRIM · RTRIM  'a'      removes spaces at the ends
REPLACE('a b c', ' ', '-')     'a-b-c'
'Pune' || ', ' || 'MH'         'Pune, MH'   concatenation</div>
<p>Splitting at a separator combines two of them: the domain of an email is <code>SUBSTR(email, INSTR(email, '@') + 1)</code>, and the first name is <code>SUBSTR(cust_name, 1, INSTR(cust_name, ' ') - 1)</code>. Group by such an expression like any column.</p>
<p><span class="term">Normalising before comparing</span>: to treat ' Asha@Mail.in' and 'asha@mail.in' as the same email, compare LOWER(TRIM(email)). In SQLite, = on text is case-sensitive; LIKE is case-insensitive for the letters A–Z. With NULL, || gives NULL: 'a' || NULL is NULL.</p>
${MN("MySQL spells several of these differently. SUBSTRING(s, pos, len) (SUBSTR also works); LOCATE('@', email), with the arguments the other way round from INSTR(email, '@'), although MySQL also has INSTR in the SQLite order; LEFT(s, n) and RIGHT(s, n), which SQLite lacks (use SUBSTR(s, 1, n) and SUBSTR(s, -n)). LENGTH counts <i>bytes</i> in MySQL, so LENGTH('₹100') is 6 there and 4 here; MySQL's CHAR_LENGTH counts characters. In MySQL || means OR by default, so concatenate with CONCAT(a, b); this SQLite build has CONCAT too, but it skips NULL arguments, while MySQL's CONCAT returns NULL if any argument is NULL. MySQL's default collation makes = case-insensitive ('ab' = 'AB' is true), so a duplicate check may pass there and fail here: LOWER(TRIM(…)) works in both. SQLite's UPPER and LOWER change only the letters A–Z.")}`,
refs:"SQLite documentation, <i>Built-In Scalar SQL Functions</i> (sqlite.org/lang_corefunc.html) · MySQL 8.0 Reference Manual, <i>String Functions and Operators</i> · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Data Generation, Manipulation, and Conversion\" · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), on working with strings.",
lab:root=>{labString(root);},
qs:[
{t:"sql",db:"saralmart",q:"Email domains: for customers with an email, return the domain (the part after '@') and the number of customers using it, sorted by domain.",ordered:true,
 answer:"SELECT SUBSTR(email, INSTR(email, '@') + 1), COUNT(*) FROM customers WHERE email IS NOT NULL GROUP BY SUBSTR(email, INSTR(email, '@') + 1) ORDER BY 1",
 hint:"INSTR finds the '@'; SUBSTR from one position after it. Filter out NULL emails, or they form a group of their own.",
 why:`<div class="formula">SELECT SUBSTR(email, INSTR(email, '@') + 1) AS domain, COUNT(*) AS customers
FROM customers
WHERE email IS NOT NULL
GROUP BY domain
ORDER BY domain;</div>inbox.co 196, mail.in 197, post.in 184. Without the + 1 every domain would start with '@'. In MySQL: SUBSTRING_INDEX(email, '@', -1) is a shortcut, or SUBSTRING(email, LOCATE('@', email) + 1).`},
{t:"sql",db:"saralmart",setup:NEWS_SETUP,q:"Interview classic: duplicate emails. For this challenge a table <code>newsletter(signup_id, email, signed_on)</code> is created from the three sign-up sheets (press Run to look at it). Find the emails that were signed up more than once when letter case and surrounding spaces are ignored: return the cleaned email (lower case, trimmed) and the number of sign-ups.",
 answer:"SELECT LOWER(TRIM(email)), COUNT(*) FROM newsletter GROUP BY LOWER(TRIM(email)) HAVING COUNT(*) > 1",
 hint:"GROUP BY email HAVING COUNT(*) > 1 finds nothing, because the copies differ in case and spaces. Group by LOWER(TRIM(email)).",
 why:`<div class="formula">SELECT LOWER(TRIM(email)) AS clean_email, COUNT(*) AS signups
FROM newsletter
GROUP BY clean_email
HAVING COUNT(*) > 1;</div>42 people signed up more than once: 39 twice and 3 three times. The textbook version, <code>GROUP BY email HAVING COUNT(*) &gt; 1</code>, returns no rows here: in SQLite 'ASHA@MAIL.IN' and 'asha@mail.in' are different strings. On MySQL with its default case-insensitive collation the capitalised copies would already match, but the copies with leading spaces would not.`},
{t:"sql",db:"saralmart",q:"Long product names: return <code>product_id</code>, <code>product_name</code> and its length in characters, for names longer than 18 characters, longest first, ties broken by <code>product_id</code>.",ordered:true,
 answer:"SELECT product_id, product_name, LENGTH(product_name) FROM products WHERE LENGTH(product_name) > 18 ORDER BY LENGTH(product_name) DESC, product_id",
 hint:"LENGTH in SELECT, in WHERE and in ORDER BY.",
 why:`<div class="formula">SELECT product_id, product_name, LENGTH(product_name) AS chars
FROM products
WHERE LENGTH(product_name) > 18
ORDER BY chars DESC, product_id;</div>Three names: Building Blocks 100 pc (22), Power Bank 10000 mAh (20) and Pressure Cooker 3 L (19). The WHERE repeats the function rather than the alias, which is the portable form (File 3).`},
{t:"sql",db:"saralmart",q:"First names for the campaign: the five most common first names (the text before the first space in <code>cust_name</code>) with their counts, most common first, ties in alphabetical order.",ordered:true,
 answer:"SELECT SUBSTR(cust_name, 1, INSTR(cust_name, ' ') - 1), COUNT(*) FROM customers GROUP BY SUBSTR(cust_name, 1, INSTR(cust_name, ' ') - 1) ORDER BY COUNT(*) DESC, 1 LIMIT 5",
 hint:"SUBSTR(cust_name, 1, INSTR(cust_name, ' ') - 1); group by it; ORDER BY count DESC, then the name.",
 why:`<div class="formula">SELECT SUBSTR(cust_name, 1, INSTR(cust_name, ' ') - 1) AS first_name, COUNT(*) AS customers
FROM customers
GROUP BY first_name
ORDER BY customers DESC, first_name
LIMIT 5;</div>Vidya 17, Joseph 16, then Bhavna, Deepa and Nikhil with 15 each. The tiebreaker decides which of the 15s make the cut. In MySQL: SUBSTRING_INDEX(cust_name, ' ', 1).`},
{t:"sql",db:"saralmart",q:"Web addresses for Grocery products: return <code>product_id</code> and a slug, the product name in lower case with every space replaced by a hyphen, sorted by <code>product_id</code>.",ordered:true,
 answer:"SELECT product_id, REPLACE(LOWER(product_name), ' ', '-') FROM products WHERE category = 'Grocery' ORDER BY product_id",
 hint:"Nest the functions: REPLACE(LOWER(product_name), ' ', '-').",
 why:`<div class="formula">SELECT product_id, REPLACE(LOWER(product_name), ' ', '-') AS slug
FROM products
WHERE category = 'Grocery'
ORDER BY product_id;</div>basmati-rice-5-kg, toor-dal-1-kg, and so on. Nesting is evaluated inside out; here LOWER(REPLACE(…)) would give the same result, because the two steps do not interfere.`},
{t:"mcq",q:"In MySQL, LENGTH('₹100') returns 6 and CHAR_LENGTH('₹100') returns 4. What does LENGTH('₹100') return in this game?",
 opts:["4: SQLite's LENGTH counts characters of text","6: LENGTH always counts bytes","5: the rupee sign counts as two","An error: SQLite cannot store ₹"],a:0,
 hint:"Try it in the lab's console.",
 why:"SQLite's LENGTH counts characters for text values (bytes only for blobs), so 4. MySQL's LENGTH counts bytes, and ₹ takes 3 bytes in UTF-8 (a standard text encoding), hence 6; CHAR_LENGTH is MySQL's character count. For names in Indian scripts the difference is large."},
{t:"mcq",q:"In this game, what does <code>SELECT 'Asha' || ' ' || NULL;</code> return?",
 opts:["NULL","'Asha '","'Asha'","An error"],a:0,
 hint:"An unknown piece makes the whole string unknown.",
 why:"Concatenating with NULL gives NULL. That is why a full name built as first || ' ' || last disappears when one part is missing; File 8 fixes it with COALESCE. (SQLite's CONCAT() skips NULLs instead; MySQL's CONCAT() returns NULL, like ||.)"}
]});

L.push({id:"l7",badge:"Calendar Keeper",code:"File 7",title:"Month-end means dates",topics:"Dates as ISO text, DATE, STRFTIME, JULIANDAY, date arithmetic with modifiers, 'now'; MySQL DATE_FORMAT, YEAR and MONTH, DATEDIFF, DATE_ADD with INTERVAL, NOW and CURDATE; monthly reports",
story:`<b>The close.</b> Month-end is about months. Finance wants orders and collections per month for the last fifteen months, operations wants the average delivery time per channel, and the customer desk wants every parcel still "In transit" more than a week after it was ordered, as of 30 September 2026.`,
brief:`<p>SQLite has no separate date type. SaralMart stores dates as text in the ISO 8601 form (ISO: International Organization for Standardization) <code>'YYYY-MM-DD'</code>. Text in that form sorts and compares in date order, so MIN, MAX, BETWEEN and ORDER BY work directly. Everything else goes through a few functions:</p>
<div class="formula">DATE('2026-09-15', '+7 days')              '2026-09-22'
DATE('2026-09-15', 'start of month')       '2026-09-01'
DATE('2026-09-15', 'start of month', '+1 month', '-1 day')   '2026-09-30'
STRFTIME('%Y-%m', '2026-09-15')            '2026-09'   (text)
STRFTIME('%Y', d) · STRFTIME('%m', d) · STRFTIME('%d', d) · STRFTIME('%w', d)  (0 = Sunday)
JULIANDAY('2026-09-30') - JULIANDAY('2026-09-01')   29.0   (days)
DATE('now') · DATETIME('now')              today, now (UTC)</div>
<p><span class="term">Monthly reports</span> group by a month label: <code>GROUP BY STRFTIME('%Y-%m', order_date)</code>. Grouping by STRFTIME('%m') alone would merge September 2025 with September 2026. STRFTIME returns text: CAST(STRFTIME('%m', d) AS INTEGER) gives a number.</p>
<p><span class="term">Day differences</span>: JULIANDAY turns a date into a continuous day number, so a difference is a number of days, across month and year ends. <span class="term">Fixed "as of" dates</span>: DATE('now') changes every day, so a report that must be reproducible uses a fixed date, for example DATE('2026-09-30', '-7 days').</p>
<div class="formula">SQLite                                  MySQL 8.0
STRFTIME('%Y-%m', d)                    DATE_FORMAT(d, '%Y-%m')
CAST(STRFTIME('%Y', d) AS INTEGER)      YEAR(d)      (MONTH(d), DAY(d))
STRFTIME('%w', d)  0 = Sunday           DAYOFWEEK(d)  1 = Sunday
JULIANDAY(a) - JULIANDAY(b)             DATEDIFF(a, b)
DATE(d, '+7 days')                      DATE_ADD(d, INTERVAL 7 DAY)
DATE(d, '-1 month')                     DATE_SUB(d, INTERVAL 1 MONTH)
DATE('now') · DATETIME('now')           CURDATE() · NOW()</div>
${MN("Month arithmetic differs at month ends: in SQLite DATE('2026-01-31', '+1 month') is '2026-03-03' (31 January plus one month is \"31 February\", which rolls over), while MySQL's DATE_ADD('2026-01-31', INTERVAL 1 MONTH) clips to '2026-02-28'. Minutes are %M in SQLite's STRFTIME but %i in MySQL's DATE_FORMAT, where %M is the month name. DATE('now') is in UTC (Coordinated Universal Time); MySQL's NOW() uses the session's time zone. MySQL has real DATE and DATETIME types; text such as '2026-09-15' is converted automatically when compared with them.")}`,
refs:"SQLite documentation, <i>Date And Time Functions</i> (sqlite.org/lang_datefunc.html) · MySQL 8.0 Reference Manual, <i>Date and Time Functions</i> · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Data Generation, Manipulation, and Conversion\" (temporal data) · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), on date arithmetic.",
lab:root=>{labDates(root);const h=el("div",{style:"margin-top:18px"});root.appendChild(h);labModifiers(h);sbDates(root);},
qs:[
{t:"sql",db:"saralmart",q:"Interview classic: orders per month. Return the month of <code>order_date</code> as 'YYYY-MM' and the number of orders, sorted by month.",ordered:true,
 answer:"SELECT STRFTIME('%Y-%m', order_date), COUNT(*) FROM orders GROUP BY STRFTIME('%Y-%m', order_date) ORDER BY 1",

 why:`<div class="formula">SELECT STRFTIME('%Y-%m', order_date) AS month, COUNT(*) AS orders
FROM orders
GROUP BY month
ORDER BY month;
-- MySQL: SELECT DATE_FORMAT(order_date, '%Y-%m') AS month, COUNT(*) … GROUP BY month</div>15 months, from 269 orders in July 2025 to 283 in September 2026; November 2025 was the busiest with 308. 'YYYY-MM' labels sort in time order because they are fixed-width text.`},
{t:"sql",db:"saralmart",q:"Interview classic: monthly revenue. Using <code>payments</code>, return the month of <code>paid_on</code> as 'YYYY-MM' and the total amount collected in that month rounded to 2 decimals, sorted by month.",ordered:true,

 why:`<div class="formula">SELECT STRFTIME('%Y-%m', paid_on) AS month, ROUND(SUM(amount), 2) AS collected
FROM payments

ORDER BY month;</div>16 months: cash-on-delivery and card payments arrive on the delivery date, so a few late-September orders were paid in October 2026 (₹31,606.80). Revenue by payment month and orders by order month are different calendars; say which one a report uses.`},
{t:"sql",db:"saralmart",q:"Delivery speed: for orders with status 'Delivered', return <code>channel</code> and the average number of days from <code>order_date</code> to <code>delivered_on</code>, rounded to 2 decimals, sorted by channel.",ordered:true,

FROM orders
WHERE status = 'Delivered'

ORDER BY channel;
-- MySQL: AVG(DATEDIFF(delivered_on, order_date))</div>App 3.42, Phone 3.39, Web 3.46 days. Returned orders also have a delivered_on date; including them changes the Phone and Web averages, so the filter matters.`},
{t:"sql",db:"saralmart",q:"Stuck parcels: as of 30 September 2026, how many orders are 'In transit' with an <code>order_date</code> more than 7 days before that date? Return one column.",
 answer:"SELECT COUNT(*) FROM orders WHERE status = 'In transit' AND order_date < DATE('2026-09-30', '-7 days')",
 hint:"DATE('2026-09-30', '-7 days') is the cut-off. Do not use 'now': the answer would change every day.",

FROM orders
WHERE status = 'In transit'
  AND order_date < DATE('2026-09-30', '-7 days');
-- MySQL: order_date &lt; DATE_SUB('2026-09-30', INTERVAL 7 DAY)</div>158 of the 198 in-transit orders are more than a week old: a list for the customer desk, and a question for the delivery partners.`},
{t:"sql",db:"saralmart",q:"Orders by weekday: return the weekday number as STRFTIME('%w') gives it (0 = Sunday … 6 = Saturday) and the number of orders, sorted by weekday number.",ordered:true,
 answer:"SELECT STRFTIME('%w', order_date), COUNT(*) FROM orders GROUP BY STRFTIME('%w', order_date) ORDER BY 1",
 hint:"STRFTIME('%w', order_date) returns '0' to '6'.",
 why:`<div class="formula">SELECT STRFTIME('%w', order_date) AS weekday, COUNT(*) AS orders
FROM orders
GROUP BY weekday
ORDER BY weekday;</div>Between 581 (Sunday) and 615 (Thursday): no strong weekday pattern. In MySQL, DAYOFWEEK(order_date) numbers the days 1 = Sunday to 7 = Saturday, and WEEKDAY(order_date) uses 0 = Monday, so the same report has different labels there.`},
{t:"mcq",q:"You move a report from this game to MySQL. Which MySQL expression replaces <code>JULIANDAY(delivered_on) - JULIANDAY(order_date)</code>?",
 opts:["DATEDIFF(delivered_on, order_date)","DATEDIFF(order_date, delivered_on)","delivered_on - order_date","DATE_SUB(delivered_on, order_date)"],a:0,
 hint:"DATEDIFF(a, b) is the number of days from b to a.",
 why:"MySQL's DATEDIFF(a, b) returns a − b in days, so the later date goes first. Subtracting two DATE values directly in MySQL does not give days reliably (it works on their numeric forms such as 20261002), and DATE_SUB subtracts an INTERVAL, not a date."}
]});

L.push({id:"l8",badge:"Report Closer",code:"File 8",title:"Closing the pack",topics:"COALESCE, IFNULL, NULLIF and safe division; empty inputs; GROUP_CONCAT (SQLite and MySQL syntax); ROLLUP in MySQL and its absence in SQLite; the month-end report",
story:`<b>The night before the board.</b> The pack is nearly done, and the last round of comments is all about holes: a brand column full of blanks, a "Cheque" line that prints as NULL instead of 0, an average discount that looks far too small, a list of product codes per category, and the chief financial officer's (CFO's) standing request for a totals row at the bottom.`,
brief:`<p>Three functions handle NULLs on purpose rather than by accident:</p>
<div class="formula">COALESCE(a, b, c, …)   the first argument that is not NULL
IFNULL(a, b)           the same with exactly two arguments
NULLIF(a, b)           NULL if a = b, otherwise a</div>
<p><span class="term">COALESCE</span> labels missing values (COALESCE(brand, 'Unbranded')) and repairs empty inputs: SUM over no rows is NULL, COALESCE(SUM(amount), 0) is 0. It does not change the stored data, only the output.</p>
<p><span class="term">NULLIF</span> does the reverse: it turns a chosen value into NULL. AVG(NULLIF(discount, 0)) averages only the discounted lines, because the zeros become NULLs and aggregates skip NULLs. Its best-known use is <span class="term">safe division</span>: x / NULLIF(y, 0) is NULL when y is 0. SQLite already returns NULL for division by zero, but many other databases stop the query with an error, so the NULLIF guard makes the intent explicit and the query portable.</p>
<p><span class="term">GROUP_CONCAT</span> is an aggregate that joins a group's values into one string:</p>
<div class="formula">SELECT category, GROUP_CONCAT(product_id, ',' ORDER BY product_id) AS ids
FROM products
GROUP BY category;            -- Toys: 238,239,240,241</div>
<p><span class="term">ROLLUP</span> adds subtotal and grand-total rows to a GROUP BY. MySQL supports it; SQLite does not, so here the total is a second, less detailed query (or, once Module 3 has introduced UNION ALL, the two stacked into one result).</p>
${MN("GROUP_CONCAT: SQLite takes the separator as the second argument, GROUP_CONCAT(x, ', '), and (since version 3.44) an ORDER BY inside the brackets; MySQL writes GROUP_CONCAT(x ORDER BY x SEPARATOR ', ') and cuts the result at group_concat_max_len (1,024 characters by default). ROLLUP: MySQL's GROUP BY channel WITH ROLLUP adds a row with NULL in channel holding the grand total, and MySQL 8.0's GROUPING(channel) tells that NULL apart from a real NULL group. Division by zero: in a SELECT, MySQL returns NULL with a warning; under its default strict mode an INSERT or UPDATE that divides by zero is rejected. IFNULL, COALESCE and NULLIF are written the same in both.")}`,
refs:"SQLite documentation, <i>Built-In Scalar SQL Functions</i> (coalesce, ifnull, nullif) and <i>Built-in Aggregate Functions</i> (group_concat) · MySQL 8.0 Reference Manual, <i>Flow Control Functions</i>, <i>Aggregate Function Descriptions</i> and <i>GROUP BY Modifiers</i> · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Grouping and Aggregates\" · Laudon &amp; Laudon, <i>Management Information Systems: Managing the Digital Firm</i> (17th ed., Pearson, 2022), ch. 12 \"Enhancing Decision Making\" (reports for managers).",
lab:root=>{labNulls(root);sbReport(root);},
qs:[
{t:"sql",db:"saralmart",q:"Brand report: return the brand, showing 'Unbranded' where <code>brand</code> is NULL, and the number of products; largest first, ties broken by the brand label.",ordered:true,
 answer:"SELECT COALESCE(brand, 'Unbranded'), COUNT(*) FROM products GROUP BY COALESCE(brand, 'Unbranded') ORDER BY COUNT(*) DESC, 1",
 hint:"COALESCE(brand, 'Unbranded') in SELECT and in GROUP BY (or group by its alias).",
 why:`<div class="formula">SELECT COALESCE(brand, 'Unbranded') AS brand_label, COUNT(*) AS products
FROM products
GROUP BY brand_label
ORDER BY products DESC, brand_label;</div>NityaPlus, Prithvi and Unbranded have 7 products each, then Kiran and Udaan 6, Ghar and Sarala 4. Seven products have no brand: as big as the largest brand.`},
{t:"sql",db:"saralmart",q:"Cheque collections: the total amount of payments with method 'Cheque'. SaralMart takes no cheques, and the report must print 0, not NULL. Return one column.",
 answer:"SELECT COALESCE(SUM(amount), 0) FROM payments WHERE method = 'Cheque'",
 hint:"SUM over no rows is NULL. Wrap it.",

FROM payments
WHERE method = 'Cheque';</div>0. COUNT(*) of the same rows is already 0, but SUM, AVG, MIN and MAX of nothing are NULL. IFNULL(SUM(amount), 0) is equivalent; SQLite's TOTAL(amount) returns 0.0, but MySQL has no TOTAL.`},
{t:"sql",db:"saralmart",q:"The average discount that looked too small: return the average discount over discounted lines only (lines with discount 0 left out), in percent, as 100 × average, rounded to 2 decimals. One column.",

FROM order_items;</div>9.90%. The figure in the draft pack was 1.98%: AVG(discount) over all 9,366 lines, of which 7,495 had no discount. Both numbers are right; only one answers "how deep are our discounts when we give one?".`},
{t:"sql",db:"saralmart",q:"Product codes per category: return <code>category</code> and the list of its <code>product_id</code>s in ascending order, separated by commas with no spaces (for example 238,239,240,241), sorted by category.",ordered:true,

FROM products
GROUP BY category
ORDER BY category;
-- MySQL: GROUP_CONCAT(product_id ORDER BY product_id SEPARATOR ',')</div>Seven rows, Electronics 227,…,232 to Toys 238,…,241. Without the inner ORDER BY the order inside the list is whatever order the engine read the rows in.`},
{t:"sql",db:"saralmart",q:"September 2026 collections by method: for payments with <code>paid_on</code> in September 2026, return <code>method</code>, the number of payments, the total amount rounded to 2 decimals and the average payment rounded to 2 decimals, largest total first.",ordered:true,

FROM payments

GROUP BY method
ORDER BY collected DESC;</div>UPI (Unified Payments Interface) ₹369,209.14 from 155 payments, then COD (cash on delivery), Card and Wallet. For the grand-total row the CFO wants, run the same query without method and GROUP BY; in MySQL, GROUP BY method WITH ROLLUP would add it as a last row.`},

 why:"WITH ROLLUP adds super-aggregate rows; with one grouping column that is a single grand-total row, marked by NULL in channel (GROUPING(channel) = 1 in MySQL 8.0). SQLite has no ROLLUP; a second query, or a UNION ALL of the two queries once Module 3 has covered it, gives the same rows."},

const BOARD=[
{t:"num",q:"A table has 10 rows; its column email is NULL in 3 of them. What does COUNT(email) return?",a:7,tol:0,why:"COUNT(column) counts non-NULL values: 10 − 3 = 7. COUNT(*) would return 10."},
{t:"num",q:"What does AVG return for the values 4, NULL and 8?",a:6,tol:0.001,why:"AVG skips the NULL: (4 + 8) / 2 = 6."},
{t:"mcq",q:"Which query lists the categories with more than 5 products?",opts:["SELECT category FROM products GROUP BY category HAVING COUNT(*) > 5","SELECT category FROM products WHERE COUNT(*) > 5 GROUP BY category","SELECT category, COUNT(*) > 5 FROM products","SELECT DISTINCT category FROM products WHERE category > 5"],a:0,why:"A condition on an aggregate goes in HAVING, applied after GROUP BY. WHERE runs before any groups exist."},
{t:"mcq",q:"In SQLite, SELECT 9 / 4; returns:",opts:["2","2.25","2.0","An error"],a:0,why:"Integer divided by integer is an integer in SQLite, truncated towards zero. 9 * 1.0 / 4 = 2.25. MySQL's / would return 2.2500."},
{t:"mcq",q:"Which expression counts only the cancelled orders?",opts:["SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END)","COUNT(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END)","COUNT(status = 'Cancelled')","SUM(status) WHERE status = 'Cancelled'"],a:0,why:"SUM adds the 1s. COUNT with ELSE 0 counts every row, because 0 is not NULL; COUNT of a comparison likewise counts every non-NULL result, 1 or 0."},
{t:"mcq",q:"Which MySQL expression gives the same month label as SQLite's STRFTIME('%Y-%m', order_date)?",opts:["DATE_FORMAT(order_date, '%Y-%m')","MONTH(order_date)","DATE_ADD(order_date, INTERVAL 1 MONTH)","STR_TO_DATE(order_date, '%Y-%m')"],a:0,why:"DATE_FORMAT formats a date with % codes, like STRFTIME. MONTH() returns only the month number (9), which would merge years."},
{t:"num",q:"GROUP BY channel, status on an orders table with 3 channels and 4 statuses, where every combination occurs at least once. How many rows does the query return?",a:12,tol:0,why:"One row per combination that occurs: 3 × 4 = 12. If a combination never occurred, it would not appear."},
{t:"mcq",q:"SELECT category, product_name, COUNT(*) FROM products GROUP BY category; on MySQL 8.0 with default settings:",opts:["Fails with error 1055, because product_name is neither grouped nor aggregated (ONLY_FULL_GROUP_BY)","Returns every product with its category's count","Returns one row per category with the first product name","Fails because COUNT(*) needs a column"],a:0,why:"MySQL 8.0 enables ONLY_FULL_GROUP_BY by default. SQLite would run it and show a product name from some row of each group, which is why such queries should not be written."}
];

const el=(tag,attrs={},html)=>{const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!==undefined)e.innerHTML=html;return e;};
const fmt=(x,d=4)=>Number(x).toFixed(d);
const pct=(x,d=1)=>(100*x).toFixed(d)+"%";
const ind=x=>Number(x).toLocaleString("en-US");
const SVGNS="http://www.w3.org/2000/svg";
const sv=(tag,attrs={})=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffled(n,seed){const o=[...Array(n).keys()];const r=rng(seed);for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[o[k],o[j]]=[o[j],o[k]];}return o;}
const lnFact=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s;};
const binomPMF=(k,n,p)=>Math.exp(lnFact(n)-lnFact(k)-lnFact(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p));
const poisPMF=(k,l)=>Math.exp(k*Math.log(l)-l-lnFact(k));
const normPDF=(x,m,s)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
function sampleAmount(r){const u=r()*100;let lo=0,hi=AMTK.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(AMTK[m]<=u)lo=m;else hi=m;}const t=(u-AMTK[lo])/(AMTK[hi]-AMTK[lo]);return AMTV[lo]+(AMTV[hi]-AMTV[lo])*t;}
function sampleDaily(r){const u=r()*90;let c=0;for(const x of Object.keys(DAILY)){c+=DAILY[x];if(u<c)return +x;}return 17;}
function canvasSetup(c,w,h){const dpr=Math.min(2,window.devicePixelRatio||1);c.width=w*dpr;c.height=h*dpr;c.style.aspectRatio=`${w} / ${h}`;const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);return g;}
const runners=new Set(); // active animation loops, stopped on navigation
function loop(fn){let id,on=true;const step=()=>{if(!on)return;fn();id=requestAnimationFrame(step);};id=requestAnimationFrame(step);const h={stop(){on=false;cancelAnimationFrame(id);runners.delete(h);}};runners.add(h);return h;}
function stopAll(){[...runners].forEach(r=>r.stop());}

/* ---------- state ---------- */

let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
const save=()=>{try{S.summary={title:COURSE.title,xp:S.xp,cleared:L.filter(levelDone).length,total:L.length,badges:S.badges.length,board:S.board?S.board.score:null,boardTotal:BOARD.length};localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

const RANKS=COURSE.ranks;
const BADGES=[...L.map((lv,i)=>[lv.id,lv.badge,"Cleared file "+(i+1)]),["streak5","Hot Hand","Five first-try answers in a row"],["clean","Clean Sheet","A whole file, first try, no hints"],...(COURSE.badges||[]),["explorer","Sandbox Explorer","Opened a sandbox and played with your own settings or data"],["board",COURSE.topRank,"Passed the board meeting ("+COURSE.boardPass+" of "+BOARD.length+")"]];

function toast(html){const t=el("div",{class:"toast"},html);$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3200);}
function addXP(n,why){if(n<=0)return;S.xp+=n;save();toast(`<b>+${n} XP</b> · ${why}`);renderStrip();}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);save();const b=BADGES.find(x=>x[0]===id);toast(`Badge earned: <b>${b[1]}</b>`);renderStrip();}
function rankOf(){if(S.badges.includes("board"))return [COURSE.topRank,null];let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null;}}return [r[1],nx];}
function renderStrip(){const [r,nx]=rankOf();$("#rank").textContent=r;$("#xptext").textContent=ind(S.xp)+" XP";
  if(nx){const lo=RANKS.find(x=>x[1]===r)[0];$("#xpfill").style.width=Math.min(100,100*(S.xp-lo)/(nx[0]-lo))+"%";$("#xpnext").textContent=ind(nx[0]-S.xp)+" XP to "+nx[1];}
  else{$("#xpfill").style.width="100%";$("#xpnext").textContent=S.badges.includes("board")?"Top rank reached":"Pass the board meeting for "+COURSE.topRank;}
  $("#streak").textContent=S.streak;$("#streakchip").classList.toggle("hot",S.streak>=3);$("#badgecount").textContent=S.badges.length+" / "+BADGES.length;}

function speedSeg(root,onchange,opts=[1,4,16]){const s=el("div",{class:"seg",role:"group","aria-label":"Speed"});opts.forEach((v,i)=>{const b=el("button",{type:"button","aria-pressed":i===0},v+"×");b.addEventListener("click",()=>{s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));onchange(v);});s.appendChild(b);});root.appendChild(s);return s;}

/* ---------- unlocking and progress ---------- */
function qstate(lid,i){S.ans[lid]=S.ans[lid]||{};S.ans[lid][i]=S.ans[lid][i]||{tries:0,done:false,first:false,hint:false,got:0};return S.ans[lid][i];}
function levelDone(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done);}
function levelStars(lv){if(!levelDone(lv))return 0;const f=lv.qs.filter((q,i)=>S.ans[lv.id][i].first).length;return f===lv.qs.length?3:(f>=lv.qs.length/2?2:1);}
function attempted(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].tries>0);}
function unlocked(idx){if(S.unlockAll||idx===0)return true;const prev=L[idx-1];return levelDone(prev)||attempted(prev);}
function boardUnlocked(){return S.unlockAll||L.filter(levelDone).length>=COURSE.boardUnlock;}

  const p0=el("section",{class:"panel"});p0.innerHTML=`<h3><span class="eyebrow">The case</span></h3><p class="story">${lv.story}</p>`;d.appendChild(p0);
  const p1=el("section",{class:"panel"});p1.innerHTML=`<h3><span class="eyebrow">Theory, briefly</span></h3><div class="brief">${lv.brief}</div><p class="refs">Further reading: ${lv.refs}</p>`;d.appendChild(p1);
  const p2=el("section",{class:"panel"});p2.innerHTML=`<h3><span class="eyebrow">Lab</span></h3>`;const lb=el("div");p2.appendChild(lb);d.appendChild(p2);
  const p3=el("section",{class:"panel"});p3.innerHTML=`<h3><span class="eyebrow">Challenges</span> <span class="note" id="qprog"></span></h3>`;
  lv.qs.forEach((q,i)=>p3.appendChild(question(lv,q,i)));
  d.appendChild(p3);
  const nx=el("div",{class:"btnrow"});
  if(idx<L.length-1){const b=el("button",{class:"btn",type:"button"},"Next case file →");b.addEventListener("click",()=>{if(unlocked(idx+1))location.hash=L[idx+1].id;else toast("Answer every question here to unlock the next file");});nx.appendChild(b);}
  else{const b=el("button",{class:"btn",type:"button"},"Go to the board meeting →");b.addEventListener("click",()=>{if(boardUnlocked())location.hash="board";else toast("Clear "+COURSE.boardUnlock+" case files to unlock the board");});nx.appendChild(b);}
  d.appendChild(nx);
  app.appendChild(d);
  lv.lab(lb);
  updProg(lv);
  window.scrollTo(0,0);
}
function updProg(lv){const n=lv.qs.filter((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done).length;const e=$("#qprog");if(e)e.textContent=`${n} of ${lv.qs.length} solved`;}

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/[₹,\s]/g,"");let isPct=false;if(s.endsWith("%")){isPct=true;s=s.slice(0,-1);}let v=parseFloat(s);if(isPct)v/=100;return v;}
function numOK(v,q){if(Number.isNaN(v))return false;if(Math.abs(v-q.a)<=q.tol)return true;if(q.a<1&&v>1&&Math.abs(v/100-q.a)<=q.tol)return true;return false;}

function question(lv,q,i){
  const st=qstate(lv.id,i);
  const box=el("div",{class:"q"});
  box.innerHTML=`<div class="qhead"><span class="eyebrow">Challenge ${i+1}</span><span class="eyebrow" data-x></span></div><p class="qtext">${q.q}</p>`;
  const fb=el("div");
  const tag=box.querySelector("[data-x]");
  const setTag=()=>{tag.textContent=st.done?`+${st.got} XP`:(st.hint?"hint used · 75 XP":"100 XP");};
  setTag();
  const solve=(correct)=>{
    st.tries++;
    if(correct){
      st.done=true;st.first=(st.tries===1&&!st.hint);
      let gain=st.tries===1?100:st.tries===2?50:20; if(st.hint)gain=Math.max(0,gain-25); st.got=gain;
      if(st.tries===1){S.streak++;S.best=Math.max(S.best,S.streak);if(S.streak>=5)award("streak5");}
      save(); addXP(gain,"Challenge "+(i+1));
      fb.innerHTML=`<div class="fb ok"><b>Correct.</b><span>${q.why}</span></div>`;
      setTag(); updProg(lv); checkLevel(lv); const hbx=box.querySelector("[data-hint]"); if(hbx)hbx.hidden=true;
    } else {
      S.streak=0;save();renderStrip();
      fb.innerHTML=`<div class="fb no"><b>Not yet.</b><span>${st.tries>=2?"Look at the hint, or rework it in the lab, then try again.":"Try again; the lab above has what you need."}</span></div>`;
    }
  };
  if(q.t==="sql"){
    SQLX.challenge(box,q,st,solve,fb);
  } else if(q.t==="mcq"){
    const order=shuffled(q.opts.length,lv.id.charCodeAt(1)*31+i*17);
    const opts=el("div",{class:"opts"});
    order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);
      if(st.done){b.disabled=true;if(k===q.a)b.classList.add("right");}
      b.addEventListener("click",()=>{if(st.done)return;const c=(k===q.a);b.classList.add(c?"right":"wrong");if(c)opts.querySelectorAll("button").forEach(x=>x.disabled=true);else b.disabled=true;solve(c);});
      opts.appendChild(b);});
    box.appendChild(opts);
  } else {
    const row=el("div",{class:"numrow"});
    const inp=el("input",{type:"text",inputmode:"decimal",id:`in-${lv.id}-${i}`,"aria-label":"Your answer",placeholder:q.ph||"e.g. 0.123"});
    const go=el("button",{class:"btn small",type:"button"},"Check");
    if(st.done){inp.disabled=true;go.disabled=true;inp.value=String(+q.a.toFixed(4));}
    const check=()=>{if(st.done)return;const v=parseNum(inp.value);if(Number.isNaN(v)){fb.innerHTML=`<div class="fb no"><b>Enter a number.</b><span>Decimals (0.25) and percentages (25%) both work.</span></div>`;return;}const c=numOK(v,q);if(c){inp.disabled=true;go.disabled=true;}solve(c);};
    go.addEventListener("click",check);inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
    row.append(inp,go);box.appendChild(row);
  }
  if(q.hint){const hb=el("button",{class:"btn ghost small",type:"button","data-hint":"1"},"Show hint (−25 XP)");
    if(st.done)hb.hidden=true;
    hb.addEventListener("click",()=>{st.hint=true;save();setTag();hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;});
    const r=el("div",{class:"btnrow"});r.appendChild(hb);box.appendChild(r);
    if(st.hint&&!st.done){hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;}
  }
  if(st.done)fb.innerHTML=`<div class="fb ok"><b>Solved.</b><span>${q.why}</span></div>`;
  box.appendChild(fb);
  return box;
}
function checkLevel(lv){if(!levelDone(lv))return;const was=S.badges.includes(lv.id);award(lv.id);
  if(lv.qs.every((q,i)=>S.ans[lv.id][i].first))award("clean");
  if(!was){addXP(150,"Case file cleared");}}

function board(){
  stopAll();if(!boardUnlocked()){location.hash="";return;}
  const app=$("#app");app.innerHTML="";
  const d=el("div",{class:"dossier"});
  const back=el("button",{class:"back",type:"button"},"← Back to the desk");back.addEventListener("click",()=>{location.hash="";});d.appendChild(back);
  d.appendChild(el("div",{},`<p class="eyebrow">Final</p><h1 style="margin-top:8px">${COURSE.boardTitle||"The board meeting"}</h1><p class="note" style="margin-top:8px">${BOARD.length} questions from across the files. One attempt each, no hints. Score ${COURSE.boardPass} or more to earn ${COURSE.topRank}. XP is awarded on your first sitting only.</p>`));
  const p=el("section",{class:"panel"});d.appendChild(p);app.appendChild(d);
  const run={i:0,score:0,first:!S.board};
  const show=()=>{
    if(run.i>=BOARD.length){
      const pass=run.score>=COURSE.boardPass;
      S.board={score:Math.max(run.score,S.board?S.board.score:0)};save();
      if(run.first)addXP(run.score*100,"Board meeting");
      if(pass)award("board");
      p.innerHTML=`<h2>${pass?"The board is satisfied.":"The board wants another look."}</h2><p>You scored <b class="mono">${run.score} / ${BOARD.length}</b>. ${pass?"You are now "+COURSE.topRank+".":"Revisit the case files, then reconvene."}</p>`;
      const r=el("div",{class:"btnrow"});const a=el("button",{class:"btn",type:"button"},"Reconvene");a.addEventListener("click",board);const b=el("button",{class:"btn ghost",type:"button"},"Back to the desk");b.addEventListener("click",()=>{location.hash="";});r.append(a,b);p.appendChild(r);renderStrip();return;}
    const q=BOARD[run.i];p.innerHTML=`<div class="qhead"><span class="eyebrow">Question ${run.i+1} of ${BOARD.length}</span><span class="eyebrow">Score ${run.score}</span></div><p class="qtext">${q.q}</p>`;
    const fb=el("div");const next=el("button",{class:"btn",type:"button"},run.i<BOARD.length-1?"Next question →":"See the verdict");next.hidden=true;next.addEventListener("click",()=>{run.i++;show();});
    const done=(c)=>{if(c)run.score++;fb.innerHTML=`<div class="fb ${c?"ok":"no"}"><b>${c?"Correct.":"Not quite."}</b><span>${q.why}</span></div>`;next.hidden=false;};
    if(q.t==="mcq"){const o=el("div",{class:"opts"});const order=shuffled(q.opts.length,run.i*7+3);
      order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);b.addEventListener("click",()=>{o.querySelectorAll("button").forEach((x,ix)=>{x.disabled=true;if(order[ix]===q.a)x.classList.add("right");});if(k!==q.a)b.classList.add("wrong");done(k===q.a);});o.appendChild(b);});p.appendChild(o);}
    else{const r=el("div",{class:"numrow"});const inp=el("input",{type:"text",inputmode:"decimal",id:"board-in-"+run.i,"aria-label":"Your answer",placeholder:"e.g. 0.5"});const g=el("button",{class:"btn small",type:"button"},"Submit");
      const sub=()=>{const v=parseNum(inp.value);if(Number.isNaN(v))return;inp.disabled=true;g.disabled=true;done(numOK(v,q));};g.addEventListener("click",sub);inp.addEventListener("keydown",e=>{if(e.key==="Enter")sub();});r.append(inp,g);p.appendChild(r);}
    p.appendChild(fb);p.appendChild(next);
  };
  show();window.scrollTo(0,0);
}
/* ---------- router ---------- */
function route(){const h=location.hash.replace("#","");const lv=L.find(x=>x.id===h);if(lv)level(lv);else if(h==="board")board();else home();}
window.addEventListener("hashchange",route);
renderStrip();route();
try{window.__course={L,BOARD};}catch(e){}

})();
</script>
</body>
