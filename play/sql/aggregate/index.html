<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>SaralMart Month-End Room</title>
<meta name="description" content="COUNT, SUM, AVG, GROUP BY, HAVING, conditional aggregation, text, number and date functions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case desk. Sticky status strip (rank, XP, streak); a live transaction-flow
   simulation as the hero; case files as a grid; an opened file is a single-column dossier:
   story, theory, lab, challenges. */
:root{
  --bg:#EAEFF4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#13233A; --muted:#566880; --line:#C9D3DF;
  --accent:#1F5FA8; --accent-soft:#DCE7F5; --gold:#A86E06; --gold-soft:#F6E7C8;
  --fraud:#B3263E; --fraud-soft:#F7DCE1; --ok:#1B7349; --ok-soft:#D7EFE2;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.strip .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .rank{font:700 1.05rem/1.1 var(--display)}
.xpbox{flex:1 1 220px;display:flex;flex-direction:column;gap:5px;min-width:0}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
.xpmeta{display:flex;justify-content:space-between;font:400 .8rem/1 var(--mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 11px;font:600 .82rem/1.2 var(--mono);white-space:nowrap}
a.chip{text-decoration:none;color:var(--accent)}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}

/* hero */
.hero{display:grid;gap:18px;padding-block:30px 10px}
.hero p.lede{font-size:1.08rem;max-width:62ch;margin-top:12px}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:8px;max-width:62ch}
.herotop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:720px){.herotop{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:.92rem}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ticket .row:last-child{border-bottom:0;padding-bottom:0}
.ticket .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flow simulation */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0}
.flow canvas{width:100%;height:auto;display:block;max-width:100%;border-radius:6px}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.flowbar .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.flowstats div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:1px}
.flowstats span{font-size:.72rem;color:var(--muted)}
.flowstats b{font:600 1.05rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font:600 .8rem/1.2 var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:transform .15s,border-color .15s}
.case:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.55}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .tag{font:600 .72rem/1 var(--mono);letter-spacing:.1em;color:var(--accent)}
.case h3{font-size:1.25rem}
.case .nick{font-size:.9rem;color:var(--muted)}
.case .topics{font-size:.85rem;color:var(--muted);margin-top:auto}
.stars{font-size:1rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.stamp{font:700 .7rem/1 var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok)} .stamp.lock{color:var(--muted)} .stamp.open{color:var(--accent)}
.case.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case.boss .tag,.case.boss .nick,.case.boss .topics{color:var(--bg);opacity:.8}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.badge b{font:600 .95rem/1.2 var(--display);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.badge.got b{color:var(--ink)}
.badge .seal{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}

/* dossier */
.dossier{display:grid;gap:22px;padding-block:24px}
.back{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);display:grid;gap:14px;min-width:0}
.panel>h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .eyebrow{color:var(--accent)}
.brief{display:grid;gap:12px;max-width:70ch}
.brief .term{font-weight:600}
.story{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;max-width:70ch}
.story b{font-style:normal}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.92rem;white-space:pre;line-height:1.5}
.refs{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* labs */
.labgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.labgrid{grid-template-columns:1fr}}
svg text{fill:var(--ink);font-family:var(--mono)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
.ctrl{display:grid;gap:6px}
.ctrl label{font-size:.88rem;color:var(--muted)}
.ctrl output{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.readout span{font-size:.76rem;color:var(--muted)}
.readout b{font:600 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.up{color:var(--fraud);font-weight:600}.down{color:var(--ok);font-weight:600}
.target{font:700 1.6rem/1.1 var(--mono);color:var(--accent)}
.regbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-size:.86rem}
.regbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.door{width:30%;aspect-ratio:3/4;max-width:120px;border:2px solid var(--line);background:var(--sunk);border-radius:8px 8px 2px 2px;
  font:700 1.4rem/1 var(--display);display:grid;place-items:center}
.door.pick{border-color:var(--accent);background:var(--accent-soft)}
.door.open{background:var(--bg);color:var(--muted);border-style:dashed}
.door.prize{border-color:var(--gold);background:var(--gold-soft)}
.doors{display:flex;gap:10px;justify-content:flex-start}
.mixbar{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.85rem}
.mixtrack{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mixtrack i{display:block;height:100%;transition:width .8s ease;font:600 .72rem/30px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
.mixtrack i.u{background:var(--accent-soft)}.mixtrack i.c{background:var(--line)}.mixtrack i.n{background:var(--fraud);color:var(--surface)}

/* challenges */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.q:first-of-type{border-top:0;padding-top:0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .eyebrow{white-space:nowrap}
.qtext{font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fraud);background:var(--fraud-soft)}
.opt[disabled]{cursor:default}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:12em}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--fraud-soft);border:1px solid var(--fraud)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b{font-family:var(--display);font-size:1rem}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;max-width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.toast b{color:var(--gold-soft)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sheet .formula{font-size:.84rem}
.sheet h3{font-size:1rem;margin-bottom:6px}
.sandbox{border:1px dashed var(--accent);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;background:var(--sunk);min-width:0;margin-top:14px}
.sb-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sb-head .eyebrow{color:var(--accent)}
.sb-tabs button{border:0;background:transparent;padding:5px 12px;font:600 .8rem/1.2 var(--mono)}
.sb-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sb-pane{display:grid;gap:10px;min-width:0}
.sb-params{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.sb-params label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sb-params input,.sb-params select{width:9.5em;max-width:100%}
.sandbox textarea{width:100%;max-width:100%;font:400 .88rem/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.sandbox input[type=file]{font-size:.82rem;max-width:100%}
.sqlx-console{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.sqlx-console{grid-template-columns:1fr}}
.sqlx-main{display:grid;gap:8px;min-width:0}
.sqlx-editor{width:100%;max-width:100%;font:400 .92rem/1.5 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
.sqlx-editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.sqlx-out{display:grid;gap:8px;min-width:0}
.sqlx-grid{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sqlx-grid table{font:400 .84rem/1.35 var(--mono)}
.sqlx-grid th{position:sticky;top:0;background:var(--sunk);text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink)}
.sqlx-grid td,.sqlx-grid th{white-space:nowrap;text-align:left}
.sqlx-grid td.num{text-align:right}
.sqlx-null{color:var(--muted);font-style:italic}
.sqlx-schema{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}
.sqlx-table summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sqlx-table ul{margin:4px 0 6px;padding-left:12px;list-style:none;display:grid;gap:2px}
.sqlx-col{all:unset;cursor:pointer;font:600 .8rem/1.3 var(--mono);color:var(--accent)}
.sqlx-col:focus-visible{outline:2px solid var(--accent)}
.sqlx-ch{display:grid;gap:8px;min-width:0}
.mysqlnote{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.mysqlnote b{font:600 .72rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
code,.code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.panel>div,.panel .flow,.panel .ctrl,.panel .labgrid>*,.flow>*,.ctrl>*,.sb-pane>*{min-width:0}
.aq-code .qline{border-radius:4px;padding:0 2px;transition:background .3s}
.aq-code .qline.on{background:var(--gold-soft);box-shadow:0 0 0 1px var(--gold);font-weight:600}
.aq-code .qline.off{opacity:.55}
.pipe{display:flex;flex-wrap:wrap;gap:6px}
.pipe span{font:600 .74rem/1 var(--mono);padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);color:var(--muted)}
.pipe span.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pipe span.done{color:var(--ink);border-color:var(--accent)}
.flow tr.cur td{background:var(--accent-soft)}
.flow tr.todo td{color:var(--muted)}
.flow td.skip{background:var(--gold-soft)!important;outline:1px solid var(--gold)}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.flow .formula{white-space:pre-wrap;overflow-wrap:anywhere}
.panel .sb-params select{width:auto;min-width:9.5em;max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip" id="strip">
    <div class="who"><span class="eyebrow">Analyst rank</span><span class="rank" id="rank">Trainee Analyst</span></div>
    <div class="xpbox"><div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
      <div class="xpmeta"><span id="xptext">0 XP</span><span id="xpnext"></span></div></div>
    <span class="chip" id="streakchip" title="Correct first-try answers in a row">Streak <b id="streak">0</b></span>
    <span class="chip" title="Badges earned">Badges <b id="badgecount">0</b></span>
    <a class="chip" href="../" id="hublink">All modules</a>
  </div>
  <main id="app"></main>
  <div class="foot">
    <span>SaralMart Month-End Room · part of <a href="../">SQL, played</a>, a free course you play. Built by <a href="https://aritra.ai" target="_blank" rel="noopener">Aritra Pan</a>. Free to use in teaching.</span>
    <span>Module 2 · Summarising data</span>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>window.SQLX_LIB="../lib/";</script>
<script>
(function(){
"use strict";
/* ---------- sandbox toolkit (shared by every module) ----------
   Three levels of free play next to a lab:
     1. controls on the real data   2. generate your own data   3. bring your own data
   SAFETY: everything runs in the visitor's browser. Uploaded or pasted text is never sent anywhere,
   never stored, never put in the URL, and never inserted as HTML: it is only parsed into numbers and
   short labels, which are always displayed with textContent (SB.text / SB.table). Size caps keep phones responsive. */
const SB=(function(){
  const MAX_BYTES=2*1024*1024, MAX_ROWS=5000, MAX_COLS=50, MAX_LABEL=40;
  const used=()=>{try{award("explorer");}catch(e){}};
  /* safe text node helpers */
  function text(tag,str,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(str);return e;}
  /* control characters, bidirectional embedding/override/isolate controls (U+202A–202E, U+2066–2069, which could
     reorder the surrounding sentence on screen) and invisible U+200B, U+2060, U+FEFF are removed; ZWJ/ZWNJ stay (Indic scripts) */

    [/\bCURDATE\s*\(\s*\)|\bCURRENT_DATE\s*\(\s*\)/i,"CURDATE() is MySQL. In SQLite write date('now') (or CURRENT_DATE without brackets)."],
    [/\bDATE_FORMAT\s*\(/i,"DATE_FORMAT(d, '%Y-%m') is MySQL. In SQLite write strftime('%Y-%m', d). Most % codes match; minutes are %M in SQLite but %i in MySQL."],

    [/\bDATE_ADD\s*\(|\bDATE_SUB\s*\(|\bINTERVAL\s+\d/i,"DATE_ADD(d, INTERVAL 7 DAY) is MySQL. In SQLite write date(d, '+7 days') (or '-1 month', '+1 year')."],

    [/\bENUM\s*\(/i,"ENUM(...) is MySQL. In SQLite use TEXT with CHECK (col IN ('a','b','c'))."],
    [/\bSHOW\s+(TABLES|DATABASES|COLUMNS|CREATE)/i,"SHOW TABLES is MySQL. Here use the schema panel, or: SELECT name FROM sqlite_master WHERE type = 'table';  For columns: PRAGMA table_info(table_name);"],

    [/^\s*USE\s+\w/im,"USE database is MySQL. This game has one database open at a time, so leave it out."],
    [/\bWITH\s+ROLLUP\b/i,"GROUP BY ... WITH ROLLUP is MySQL. SQLite has no ROLLUP: add the subtotal rows with UNION ALL of a second, less detailed GROUP BY."],
    [/\bGROUP_CONCAT\s*\([^)]*\bSEPARATOR\b/i,"GROUP_CONCAT(x SEPARATOR ', ') is MySQL. In SQLite the separator is the second argument: GROUP_CONCAT(x, ', ')."],

/* ===== SQL, played · Module 2 · Aggregates and functions: SaralMart Month-End Room ===== */
/* The student's own copy of the database is "saralmart" (consoles and challenges; it can be changed and reset).
   The animated labs read "saralmart_lab", a second copy nobody writes to, so a student's DROP TABLE cannot break a lab.
   Every value shown in a lab comes from SQLX.exec and is displayed with textContent, canvas fillText or SVG textContent. */
const LABDB="saralmart_lab";
if(typeof DB_SARALMART!=="undefined")SQLX.addDB(LABDB,DB_SARALMART);
const T=(tag,s,cls)=>SQLX.txt(tag,s,cls);
async function q1(sql,db){const r=await SQLX.exec(db||LABDB,sql);const s=r.results.filter(x=>x.columns.length);return s.length?s[s.length-1]:{columns:[],values:[],total:0};}
function colors(){return{ink:cssVar("--ink"),muted:cssVar("--muted"),line:cssVar("--line"),sunk:cssVar("--sunk"),acc:cssVar("--accent"),accs:cssVar("--accent-soft"),red:cssVar("--fraud"),reds:cssVar("--fraud-soft"),gold:cssVar("--gold"),golds:cssVar("--gold-soft"),ok:cssVar("--ok"),oks:cssVar("--ok-soft"),surf:cssVar("--surface")};}
function labFail(host,e){const b=el("div");host.appendChild(b);SQLX.errorBox(b,(e&&e.message)||String(e),"");}
const ease=(o,k,keys)=>{let mv=false;keys.forEach(([a,b])=>{const d=o[b]-o[a];if(Math.abs(d)>0.01){o[a]+=d*k;mv=true;}else o[a]=o[b];});return mv;};
const nfmt=v=>v===null||v===undefined?"NULL":(typeof v==="number"?(Number.isInteger(v)?ind(v):String(Math.round(v*100)/100)):String(v));

/* Play / Step / Speed / Reset controls shared by every animated lab. o: {title, n, ms, onStep(i), onReset(), draw(k) -> still moving?} */
function mkCtrl(host,o){
  const bar=el("div",{class:"flowbar"});bar.appendChild(T("span",o.title||"","eyebrow"));
  const cs=el("div",{class:"ctrls"});
  const play=T("button","Play","btn small");play.type="button";
  const stp=T("button","Step ▸","btn ghost small");stp.type="button";
  const rst=T("button","Reset","btn ghost small");rst.type="button";
  cs.append(play,stp);
  let i=0,playing=false,speed=1,acc=0,last=0,run=null;
  speedSeg(cs,v=>{speed=v;},[1,2,4]);cs.appendChild(rst);bar.appendChild(cs);host.appendChild(bar);
  const N=()=>typeof o.n==="function"?o.n():o.n, MS=()=>o.ms||900;
  function frame(){const now=performance.now();const dt=Math.min(64,now-last);last=now;
    if(playing){acc+=dt*speed;if(acc>=MS()){acc=0;if(i<N()){i++;o.onStep(i);}if(i>=N())setPlay(false);}}
    const mv=o.draw?o.draw(REDUCED?1:1-Math.exp(-dt*speed/120)):false;
    if(!playing&&!mv&&run){run.stop();run=null;}}
  function kick(){if(!run){last=performance.now();run=loop(frame);}}
  function setPlay(v){
    if(v&&i>=N()){i=0;o.onReset();}
    if(v&&REDUCED){while(i<N()){i++;o.onStep(i);}v=false;}
    playing=v;play.textContent=v?"Pause":"Play";acc=v?MS():0;kick();}
  play.addEventListener("click",()=>setPlay(!playing));
  stp.addEventListener("click",()=>{if(playing)setPlay(false);if(i>=N()){i=0;o.onReset();}else{i++;o.onStep(i);}kick();});
  rst.addEventListener("click",()=>{playing=false;play.textContent="Play";i=0;acc=0;o.onReset();kick();});
  return {kick,setPlay,to(n){i=n;o.onStep(n);kick();},get i(){return i;},get playing(){return playing;}};
}
function canvasBox(host,W,H,label){const w=el("div",{class:"svgbox"});const c=document.createElement("canvas");c.setAttribute("role","img");c.setAttribute("aria-label",label);w.appendChild(c);host.appendChild(w);return canvasSetup(c,W,H);}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function codeBox(lines){const d=el("div",{class:"formula aq-code"});const spans=lines.map((ln,i)=>{const s=T("span",ln,"qline");d.appendChild(s);if(i<lines.length-1)d.appendChild(document.createTextNode("\n"));return s;});return {el:d,spans,mark(on,done){spans.forEach((s,i)=>{s.classList.toggle("on",i===on);s.classList.toggle("off",done?!done.includes(i)&&i!==on:false);});}};}
function starters(host,list,con){const r=el("div",{class:"starters"});list.forEach(([lab,sql])=>{const b=T("button",lab,"btn ghost small");b.type="button";b.addEventListener("click",()=>{con.set(sql);con.run();});r.appendChild(b);});host.appendChild(r);}
function numIn(label,val,min,max,step){const l=el("label");l.appendChild(T("span",label));const i=el("input",{type:"number",min:String(min),max:String(max),step:String(step||1),value:String(val)});l.appendChild(i);return {l,get(){const v=parseFloat(i.value);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):val;},i};}
function selIn(label,opts,val){const l=el("label");l.appendChild(T("span",label));const s=el("select");opts.forEach(([v,t])=>{const o=el("option",{value:v});o.textContent=t;s.appendChild(o);});if(val!=null)s.value=val;l.appendChild(s);return {l,s,get(){return s.value;}};}

/* ---------- hero: one query executed clause by clause on the real orders table ---------- */
function HeroOrder(root){
  root.classList.add("flow");
  const lines=["SELECT channel, COUNT(*) AS orders","FROM orders","WHERE order_date BETWEEN '2026-09-01' AND '2026-09-07'","  AND status <> 'Cancelled'","GROUP BY channel","HAVING COUNT(*) >= 5","ORDER BY orders","LIMIT 1;"];
  const LINE_OF=[null,[1],[2,3],[4],[5],[0],[6],[7]];   // step -> highlighted lines
  const wait=T("p","Loading 4,200 orders into the in-browser database…","note");root.appendChild(wait);
  (async()=>{
    let rows,groups,final;
    try{
      rows=(await q1("SELECT order_id, channel, (order_date BETWEEN '2026-09-01' AND '2026-09-07' AND status <> 'Cancelled') AS keep FROM orders ORDER BY order_id")).values;
      groups=(await q1("SELECT channel, COUNT(*) FROM orders WHERE order_date BETWEEN '2026-09-01' AND '2026-09-07' AND status <> 'Cancelled' GROUP BY channel ORDER BY channel")).values;
      final=(await q1(lines.join(" "))).values;
    }catch(e){wait.remove();labFail(root,e);return;}
    wait.remove();
    const W=720,H=300,GX=14,GY=44,COLS=70,SP=3.9;
    const keepIdx=[];rows.forEach((r,i)=>{if(r[2])keepIdx.push(i);});
    const gi={};groups.forEach((g,j)=>{gi[g[0]]=j;});
    const pass=groups.filter(g=>g[1]>=5).map(g=>g[0]);
    const sorted=pass.slice().sort((a,b)=>groups[gi[a]][1]-groups[gi[b]][1]);
    const dots=keepIdx.map((ix,n)=>{const x=GX+(ix%COLS)*SP,y=GY+Math.floor(ix/COLS)*SP;return {ix,ch:rows[ix][1],x,y,tx:x,ty:y,a:0,ta:0,s:2.6,ts:2.6};});
    const bk=groups.map((g,j)=>({key:g[0],n:g[1],x:316+j*72,a:0,ta:0}));
    const rowsBox=pass.map(k=>({key:k,n:groups[gi[k]][1],y:90,ty:90,a:0,ta:0}));
    const view={grid:0.08,tgrid:0.08,hi:0,thi:0,step:0};
    let ctl=null;
    const C0=colors();let CC=C0;
    const caps=["Press Play. Each step is one clause, in the order the database applies them, not the order they are written.",
      "1 · FROM orders: all 4,200 rows of the table are read.",
      `2 · WHERE: the row filter keeps the ${keepIdx.length} non-cancelled orders of 1 to 7 September 2026. The rest are gone before any grouping happens.`,
      `3 · GROUP BY channel: the ${keepIdx.length} surviving rows are sorted into ${groups.length} buckets, one per channel.`,
      "4 · HAVING COUNT(*) >= 5: now whole groups are filtered. "+groups.filter(g=>g[1]<5).map(g=>`${g[0]} has only ${g[1]} orders, so its bucket is dropped.`).join(" "),
      "5 · SELECT: each surviving bucket collapses into one output row: the channel and its COUNT(*), named orders.",
      "6 · ORDER BY orders: the output rows are sorted, smallest count first (ASC is the default). ORDER BY can use the alias because SELECT has already run.",
      "7 · LIMIT 1: only the first sorted row is returned. Result: "+final.map(r=>`${r[0]} with ${r[1]} orders`).join(", ")+", the quietest channel that week among channels with at least 5 orders."];
    const cb=codeBox(lines);
    function go(i){view.step=i;
      view.tgrid=i===0?0.1:i===1?1:0.16; view.thi=i>=2?1:0;
      const cnt={};
      dots.forEach(d=>{d.ta=i>=1?1:0;
        if(i<=2){d.tx=GX+(d.ix%COLS)*SP;d.ty=GY+Math.floor(d.ix/COLS)*SP;d.ts=i===2?4:2.6;}
        else{const j=gi[d.ch];cnt[d.ch]=(cnt[d.ch]||0)+1;const n=cnt[d.ch]-1;const b=bk[j];
          d.tx=b.x+7+(n%6)*9;d.ty=262-Math.floor(n/6)*9;d.ts=6.5;
          if(i>=4&&!pass.includes(d.ch))d.ta=0.25;
          if(i>=5&&pass.includes(d.ch)){const ri=(i>=6?sorted:pass).indexOf(d.ch);d.tx=600;d.ty=104+ri*52;d.ts=2;d.ta=0;}}});
      bk.forEach(b=>{b.ta=i>=3?(i>=4&&!pass.includes(b.key)?0.3:1):0;});
      rowsBox.forEach(r=>{const ri=(i>=6?sorted:pass).indexOf(r.key);r.ty=86+ri*52;r.ta=i>=5?(i>=7&&ri>=1?0.22:1):0;});
      cb.mark(LINE_OF[i]?LINE_OF[i][0]:-1);if(LINE_OF[i]&&LINE_OF[i].length>1)cb.spans[LINE_OF[i][1]].classList.add("on");
      cap.textContent=caps[i];}
    function draw(k){CC=colors();const c=CC;let mv=false;
      g.clearRect(0,0,W,H);g.fillStyle=c.sunk;g.fillRect(0,0,W,H);
      mv=ease(view,k,[["grid","tgrid"],["hi","thi"]])||mv;
      g.font="11px IBM Plex Mono, monospace";g.fillStyle=c.muted;
      g.fillText("orders table · 4,200 rows",GX,26);g.fillText("groups",316,26);g.fillText("result rows",560,26);
      g.globalAlpha=view.grid;g.fillStyle=c.muted;
      const keepSet=new Set(keepIdx);
      for(let ix=0;ix<rows.length;ix++){if(keepSet.has(ix))continue;g.fillRect(GX+(ix%COLS)*SP,GY+Math.floor(ix/COLS)*SP,2.6,2.6);}
      g.globalAlpha=1;
      bk.forEach(b=>{mv=ease(b,k,[["a","ta"]])||mv;if(b.a<0.02)return;g.globalAlpha=b.a;g.strokeStyle=c.line;g.lineWidth=1;rrect(g,b.x,58,62,216,6);g.stroke();
        g.fillStyle=c.ink;g.font="600 12px IBM Plex Mono, monospace";g.fillText(b.key,b.x+6,76);g.font="11px IBM Plex Mono, monospace";g.fillStyle=c.muted;g.fillText("COUNT "+b.n,b.x+6,92);
        if(view.step>=4&&!pass.includes(b.key)){g.strokeStyle=c.red;g.lineWidth=2;g.beginPath();g.moveTo(b.x+4,62);g.lineTo(b.x+58,270);g.stroke();g.lineWidth=1;}
        g.globalAlpha=1;});
      dots.forEach(d=>{mv=ease(d,k,[["x","tx"],["y","ty"],["a","ta"],["s","ts"]])||mv;if(d.a<0.02)return;g.globalAlpha=d.a;g.fillStyle=view.step>=2?c.acc:c.muted;g.fillRect(d.x,d.y,d.s,d.s);});
      g.globalAlpha=1;
      rowsBox.forEach(r=>{mv=ease(r,k,[["y","ty"],["a","ta"]])||mv;if(r.a<0.02)return;g.globalAlpha=r.a;g.fillStyle=c.surf;rrect(g,560,r.y,150,38,6);g.fill();g.strokeStyle=c.acc;g.stroke();
        g.fillStyle=c.ink;g.font="600 13px IBM Plex Mono, monospace";g.fillText(r.key,572,r.y+24);g.fillText(String(r.n),680,r.y+24);
        if(view.step>=7&&rowsBox.indexOf(r)>=0&&r.ta<0.5){g.strokeStyle=c.red;g.beginPath();g.moveTo(564,r.y+19);g.lineTo(706,r.y+19);g.stroke();}
        g.globalAlpha=1;});
      return mv;}
    ctl=mkCtrl(root,{title:"Live: one query, clause by clause, on the real orders table",n:7,ms:1700,onStep:go,onReset:()=>go(0),draw});
    const g=canvasBox(root,W,H,"Animated: 4,200 order rows are filtered by WHERE, sorted into channel buckets by GROUP BY, filtered by HAVING, collapsed by SELECT, sorted and cut by LIMIT");
    root.appendChild(cb.el);
    const cap=T("p","","note");root.appendChild(cap);
    go(0);ctl.kick();
    if(REDUCED)ctl.to(7);else ctl.setPlay(true);
  })();
}

const WALK={
  cust:{label:"12 customers: the COUNT family",

    accs:[["COUNT(*)",(rs)=>rs.length],["COUNT(email)",(rs)=>rs.filter(r=>r[1]!==null).length],["COUNT(city_id)",(rs)=>rs.filter(r=>r[2]!==null).length],["COUNT(DISTINCT city_id)",(rs)=>new Set(rs.filter(r=>r[2]!==null).map(r=>r[2])).size]],

    nullCols:[2]}

function labWalk(root){
  root.appendChild(T("p","An aggregate function reads every row of its input and hands back one value. Watch it walk the rows: NULL cells (gold) are skipped by every function except COUNT(*). The last step runs the real query and shows that the engine agrees.","note"));
  const pick=selIn("Rows to aggregate",[["cust",WALK.cust.label],["prod",WALK.prod.label]],"cust");
  const top=el("div",{class:"sb-params"});top.appendChild(pick.l);root.appendChild(top);
  const host=el("div",{class:"flow"});root.appendChild(host);
  let ctl=null,data=null,cfg=null;
  const ctlHost=el("div");host.appendChild(ctlHost);
  const grid=el("div",{class:"labgrid"});host.appendChild(grid);
  const left=el("div",{class:"tbl"});const right=el("div",{class:"ctrl"});grid.append(left,right);
  const cap=T("p","","note");host.appendChild(cap);const fin=el("div");host.appendChild(fin);
  let trs=[],outs=[];
  ctl=mkCtrl(ctlHost,{title:"Animated: the aggregate walks row by row",n:()=>data?data.length+1:0,ms:850,onStep:i=>show(i),onReset:()=>show(0)});
  async function load(){
    cfg=WALK[pick.get()];left.textContent="";right.textContent="";fin.textContent="";cap.textContent="Loading…";
    try{const r=await q1(cfg.sql);data=r.values;
      const t=document.createElement("table");const th=document.createElement("thead");const hr=document.createElement("tr");r.columns.forEach(c=>hr.appendChild(T("th",c)));th.appendChild(hr);t.appendChild(th);
      const tb=document.createElement("tbody");trs=data.map(row=>{const tr=document.createElement("tr");row.forEach((v,j)=>{const d=T("td",v===null?"NULL":String(v),typeof v==="number"?"num":"");if(v===null)d.classList.add("sqlx-null");tr.appendChild(d);});tb.appendChild(tr);return tr;});
      t.appendChild(tb);left.appendChild(t);
      right.appendChild(T("span","Running values","eyebrow"));const ro=el("div",{class:"readout"});right.appendChild(ro);
      outs=cfg.accs.map(([nm])=>{const d=el("div");d.appendChild(T("span",nm));const b=T("b","—");d.appendChild(b);ro.appendChild(d);return b;});
      ctl.to(0);
    }catch(e){cap.textContent="";labFail(left,e);}
  }
  async function show(i){if(!data)return;
    const seen=data.slice(0,Math.min(i,data.length));
    trs.forEach((tr,j)=>{tr.classList.toggle("cur",j===i-1&&i<=data.length);tr.classList.toggle("todo",j>=i);[...tr.children].forEach((td,c)=>td.classList.toggle("skip",j===i-1&&cfg.nullCols.includes(c)&&data[j][c]===null));});
    cfg.accs.forEach(([nm,f],k)=>{outs[k].textContent=i===0?"—":nfmt(f(seen));});
    fin.textContent="";
    if(i===0){cap.textContent="Press Play or Step. Nothing has been read yet.";return;}
    if(i<=data.length){const row=data[i-1];const nulls=cfg.nullCols.filter(c=>row[c]===null);
      const NM={1:"email",2:"city_id"};
      if(pick.get()==="prod")cap.textContent=`Row ${i} of ${data.length}: `+(nulls.length?"brand is NULL, so COUNT(brand) does not move; price is present, so SUM, AVG, MIN and MAX use it.":"no NULLs, so every aggregate uses this row.")+" COUNT(*) counts the row.";
      else cap.textContent=`Row ${i} of ${data.length}: `+(nulls.length?nulls.map(c=>NM[c]+" is NULL, so COUNT("+NM[c]+")"+(c===2?" and COUNT(DISTINCT city_id) do":" does")+" not move").join("; ")+". COUNT(*) still counts the row.":"no NULLs, so every count can move (COUNT(DISTINCT city_id) only for a city not seen before).");
      return;}
    cap.textContent=`All ${data.length} rows read: they collapse into ONE output row. Below, the same aggregates computed by the engine:`;
    try{const r=await SQLX.exec(LABDB,cfg.check);const pre=T("div",cfg.check,"formula");fin.appendChild(pre);const gd=el("div");fin.appendChild(gd);SQLX.grid(gd,r);try{award("walker");}catch(e){}}catch(e){labFail(fin,e);}
  }
  pick.s.addEventListener("change",load);load();
}

/* ---------- File 2 lab: GROUP BY sorts rows into buckets ---------- */
function labBuckets(root,mode){
  const PIVOT=mode==="pivot";
  const ids=PIVOT?[5001,5060]:[5001,5040];
  root.appendChild(T("p",PIVOT?`Orders ${ids[0]} to ${ids[1]} drop into a channel × status grid. Each column of a pivot is one SUM(CASE WHEN … THEN 1 ELSE 0 END): an order adds 1 to the column whose condition it meets and 0 to the others.`
    :`Orders ${ids[0]} to ${ids[1]}, one card each. GROUP BY sends every row to the bucket of its key; each bucket becomes one output row. Change the grouping and play again.`,"note"));
  const pick=PIVOT?null:selIn("GROUP BY",[["channel","channel"],["status","status"],["channel, status","channel, status"]],"channel");
  if(pick){const t=el("div",{class:"sb-params"});t.appendChild(pick.l);root.appendChild(t);}
  const host=el("div",{class:"flow"});root.appendChild(host);
  const W=720,H=PIVOT?300:320;let items=[],bks=[],cur=-1,heads=[];
  const STAT=["Delivered","Cancelled","Returned","In transit"],CH=["App","Phone","Web"];
  const keyOf=(r)=>{const g=PIVOT?"channel, status":pick.get();return g==="channel"?r.channel:g==="status"?r.status:r.channel+" · "+r.status;};
  let ctl=null;const cap=T("p","","note"),fin=el("div");
  ctl=mkCtrl(host,{title:PIVOT?"Animated: filling the pivot grid":"Animated: rows sorted into buckets",n:()=>items.length?items.length+1:0,ms:PIVOT?520:620,onStep:i=>go(i),onReset:()=>go(0),draw});
  const g=canvasBox(host,W,H,PIVOT?"Animated: order cards drop into the cells of a channel by status grid":"Animated: order cards move into one bucket per group key");
  host.append(cap,fin);
  function layout(){
    const keys=[...new Set(items.map(it=>it.key))].sort();
    if(PIVOT){const x0=330,y0=56,cw=96,chh=74;heads=[];
      STAT.forEach((s,j)=>heads.push({t:s,x:x0+j*cw+6,y:y0-10}));CH.forEach((c,r)=>heads.push({t:c,x:270,y:y0+r*chh+22}));
      bks=[];CH.forEach((c,r)=>STAT.forEach((s,j)=>bks.push({key:c+" · "+s,x:x0+j*cw,y:y0+r*chh,w:cw-6,h:chh-6,n:0,label:""})));}
    else{const nb=keys.length,cols=nb<=4?nb:4,rows=Math.ceil(nb/cols),bw=(420-(cols-1)*10)/cols,bh=(H-44-(rows-1)*10)/rows;
      bks=keys.map((k,j)=>({key:k,x:290+(j%cols)*(bw+10),y:34+Math.floor(j/cols)*(bh+10),w:bw,h:bh,n:0,label:k}));heads=[];}

/* ---------- File 3 lab: the logical order of a query, step by step on real rows ---------- */
const ORDERQ={
  seg:{label:"Customers per segment",
    lines:["SELECT segment, COUNT(*) AS customers","FROM customers","WHERE city_id IS NOT NULL","GROUP BY segment","HAVING COUNT(*) > 100","ORDER BY customers DESC","LIMIT 1;"],
    steps:[[1,"SELECT * FROM customers","FROM: every row of customers."],
      [2,"SELECT * FROM customers WHERE city_id IS NOT NULL","WHERE removes rows whose city is unknown. Aggregates are not allowed here: no groups exist yet."],
      [3,"SELECT segment, COUNT(*) AS rows_in_group FROM customers WHERE city_id IS NOT NULL GROUP BY segment","GROUP BY: the surviving rows are bundled, one bundle per segment. Shown here as one line per bundle with its size."],
      [4,"SELECT segment, COUNT(*) AS rows_in_group FROM customers WHERE city_id IS NOT NULL GROUP BY segment HAVING COUNT(*) > 100","HAVING filters whole groups using an aggregate. Business has 55 rows with a known city, so it goes."],
      [0,"SELECT segment, COUNT(*) AS customers FROM customers WHERE city_id IS NOT NULL GROUP BY segment HAVING COUNT(*) > 100","SELECT: now the output columns are computed and the alias customers is born."],
      [5,"SELECT segment, COUNT(*) AS customers FROM customers WHERE city_id IS NOT NULL GROUP BY segment HAVING COUNT(*) > 100 ORDER BY customers DESC","ORDER BY can use the alias, because SELECT ran before it."],
      [6,"SELECT segment, COUNT(*) AS customers FROM customers WHERE city_id IS NOT NULL GROUP BY segment HAVING COUNT(*) > 100 ORDER BY customers DESC LIMIT 1","LIMIT cuts the sorted list. The answer: the largest segment among customers with a known city."]]},
  del:{label:"Busy delivery partners",
    lines:["SELECT partner_id, COUNT(*) AS delivered","FROM orders","WHERE status = 'Delivered'","GROUP BY partner_id","HAVING COUNT(*) > 200","ORDER BY delivered DESC","LIMIT 3;"],
    steps:[[1,"SELECT * FROM orders","FROM: all orders."],
      [2,"SELECT * FROM orders WHERE status = 'Delivered'","WHERE keeps delivered orders only."],
      [3,"SELECT partner_id, COUNT(*) AS rows_in_group FROM orders WHERE status = 'Delivered' GROUP BY partner_id","GROUP BY partner_id: one bundle per partner, plus one bundle for NULL (delivered orders with no partner recorded). NULLs form a single group."],
      [4,"SELECT partner_id, COUNT(*) AS rows_in_group FROM orders WHERE status = 'Delivered' GROUP BY partner_id HAVING COUNT(*) > 200","HAVING COUNT(*) > 200: partners with exactly 200 are out, since > is strict."],
      [0,"SELECT partner_id, COUNT(*) AS delivered FROM orders WHERE status = 'Delivered' GROUP BY partner_id HAVING COUNT(*) > 200","SELECT computes the output columns."],
      [5,"SELECT partner_id, COUNT(*) AS delivered FROM orders WHERE status = 'Delivered' GROUP BY partner_id HAVING COUNT(*) > 200 ORDER BY delivered DESC","ORDER BY delivered DESC: busiest first."],
      [6,"SELECT partner_id, COUNT(*) AS delivered FROM orders WHERE status = 'Delivered' GROUP BY partner_id HAVING COUNT(*) > 200 ORDER BY delivered DESC LIMIT 3","LIMIT 3: the top three."]]}
};

    ["NULLIF inside AVG","SELECT ROUND(100 * AVG(discount), 2) AS avg_all_lines_pct,\n       ROUND(100 * AVG(NULLIF(discount, 0)), 2) AS avg_discounted_pct,\n       COUNT(NULLIF(discount, 0)) AS discounted_lines\nFROM order_items;"],
    ["Safe division","SELECT STRFTIME('%Y-%m', order_date) AS month,\n       SUM(CASE WHEN status = 'Returned' THEN 1 ELSE 0 END) AS returned,\n       SUM(CASE WHEN status = 'In transit' THEN 1 ELSE 0 END) AS in_transit,\n       ROUND(1.0 * SUM(CASE WHEN status = 'Returned' THEN 1 ELSE 0 END)\n             / NULLIF(SUM(CASE WHEN status = 'In transit' THEN 1 ELSE 0 END), 0), 2) AS ratio\nFROM orders\nWHERE channel = 'Phone'\nGROUP BY month\nORDER BY month;"],

story:`<b>Last working day of September 2026.</b> SaralMart's month-end room is a long table, three laptops and a printer that jams. The finance controller asks a simple question, "How many orders, and how many customers?", and gets three answers: 4,200, 3,980 and 475. Nobody is wrong. They counted three different things, and your first job is to say which is which.`,
brief:`<p>Module 1 used SQL (Structured Query Language) to return rows one by one. An <span class="term">aggregate function</span> (also called a group function) does the opposite: it reads many rows and returns <em>one</em> value. Without GROUP BY, the whole table (after WHERE) is one group, so the result is a single row.</p>
<div class="formula">COUNT(*)               number of rows, NULLs or not
COUNT(col)             number of rows where col IS NOT NULL
COUNT(DISTINCT col)    number of different non-NULL values of col
SUM(col)  AVG(col)     total and mean of the non-NULL values
MIN(col)  MAX(col)     smallest and largest non-NULL value</div>
<p>Every aggregate except COUNT(*) <span class="term">skips NULLs</span>. That is why AVG(col) equals SUM(col) / COUNT(col), not SUM(col) / COUNT(*). MIN and MAX also work on text (alphabetical order) and on dates stored as 'YYYY-MM-DD' text, which sorts in date order.</p>

       COUNT(cust_id)          AS orders_with_account,
       COUNT(DISTINCT cust_id) AS customers
FROM orders;                   -- 4,200 · 3,980 · 475</div>
<p>On an <span class="term">empty input</span> (a WHERE that matches nothing), COUNT returns 0 but SUM, AVG, MIN and MAX return NULL: there is nothing to add up. File 8 shows how to turn that NULL into a 0 for a report.</p>
<p>One rule before File 2: a query with an aggregate and no GROUP BY should not also list a plain column, such as <code>SELECT channel, COUNT(*) FROM orders</code>. Which channel would it show for 4,200 rows? MySQL with default settings rejects it; SQLite quietly picks one. File 2 explains.</p>

L.push({id:"l2",badge:"Bucket Sorter",code:"File 2",title:"Sorting into buckets",topics:"GROUP BY on one and several columns, NULL as a group, sorting groups, the non-aggregated column rule (MySQL ONLY_FULL_GROUP_BY vs SQLite's bare columns)",
story:`<b>Three managers, three breakdowns.</b> Operations wants the order count by channel, finance by status, and the regional lead the customer count by city. One query each. Then an analyst adds the product name to a per-category price report: the office MySQL server refuses it, the browser happily runs it, and the two disagree on what it means.`,
brief:`<p><span class="term">GROUP BY</span> splits the rows (those that survived WHERE) into groups that share the same value of the grouping column, and the aggregates are computed once per group. The result has <em>one row per group</em>.</p>
<div class="formula">SELECT channel, COUNT(*) AS orders
FROM orders
GROUP BY channel;            -- App 2,583 · Phone 235 · Web 1,382</div>
<p>With <span class="term">several grouping columns</span>, a group is a combination of values. GROUP BY channel, status gives one row for every combination that actually occurs, not for every combination imaginable. All NULLs in a grouping column fall into <span class="term">one NULL group</span>.</p>
<p>The order of the output is not guaranteed unless you add ORDER BY. You may sort by a grouping column, by an aggregate (ORDER BY COUNT(*) DESC) or by its alias (ORDER BY orders DESC).</p>
<p>The <span class="term">non-aggregated column rule</span>: every column in SELECT must either appear in GROUP BY or sit inside an aggregate. A column that is neither has many values per group, and the query has not said which one to show. (The standard that defines SQL, Structured Query Language, also allows columns that are functionally dependent on the grouping columns, for example any column of a table grouped by its primary key.)</p>
<div class="formula">SELECT category, product_name, MAX(price)   -- product_name breaks the rule
FROM products
GROUP BY category;</div>
${MN("MySQL 8.0 enforces the rule by default (the sql_mode ONLY_FULL_GROUP_BY) and rejects the query above with error 1055, \"Expression #2 of SELECT list is not in GROUP BY clause and contains nonaggregated column …\". SQLite allows such <i>bare columns</i>: it shows the value from some row of the group. Only when the query has a single MIN() or MAX() does SQLite promise that the bare column comes from the row holding that minimum or maximum. Do not rely on either behaviour; write queries that follow the rule, and they run everywhere.")}`,
refs:"SQLite documentation, <i>The SELECT statement</i>, section on bare columns in an aggregate query (sqlite.org/lang_select.html) · MySQL 8.0 Reference Manual, <i>MySQL Handling of GROUP BY</i> and <i>Server SQL Modes</i> · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Grouping and Aggregates\" · Elmasri &amp; Navathe, <i>Fundamentals of Database Systems</i> (7th ed., 2016), on grouping and aggregate functions in SQL.",
lab:root=>{labBuckets(root,"group");sbGroup(root);},

{t:"mcq",q:"What happens with <code>SELECT category, product_name, MAX(price) FROM products GROUP BY category;</code>?",

GROUP BY category

]});

L.push({id:"l3",badge:"Clause Keeper",code:"File 3",title:"WHERE, or HAVING?",topics:"HAVING vs WHERE, the logical order FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT, aliases, interview classics: duplicates and \"more than N\"",
story:`<b>Three requests before lunch.</b> The loyalty team wants every customer with at least 22 orders. The data-quality desk suspects duplicate customer records. And a new analyst has typed <code>WHERE COUNT(*) &gt; 20</code> and is staring at "misuse of aggregate". All three come down to one fact: the database does not run a query in the order you write it.`,
brief:`<p>You write a SQL (Structured Query Language) query in one order; the database applies it in another, the <span class="term">logical order of execution</span>:</p>
<div class="formula">written:  SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT
applied:  FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</div>
<p>First the tables are read, then unwanted <em>rows</em> are thrown away (WHERE), the survivors are bundled into groups (GROUP BY), unwanted <em>groups</em> are thrown away (HAVING), the output columns are computed (SELECT), sorted (ORDER BY) and cut short (LIMIT). (A real engine may take shortcuts, but the result is always as if it had worked in this order.) Three consequences:</p>
<div class="formula">1. No aggregate in WHERE: when WHERE runs, no groups exist.
2. A condition on an aggregate goes in HAVING: HAVING COUNT(*) > 1
3. A SELECT alias is unknown in WHERE, but known in ORDER BY.</div>
<p>Use WHERE for conditions on rows and HAVING for conditions on groups. A row condition placed in WHERE also makes the query cheaper: fewer rows reach the grouping step. The <span class="term">duplicates pattern</span> is the most common interview use of HAVING:</p>
<div class="formula">SELECT cust_name, COUNT(*) AS times
FROM customers
GROUP BY cust_name
HAVING COUNT(*) > 1;</div>
${MN("An aggregate in WHERE fails in both: SQLite says \"misuse of aggregate: COUNT()\", MySQL reports error 1111 \"Invalid use of group function\". A SELECT alias in WHERE is rejected by MySQL (error 1054, \"Unknown column\") but quietly accepted by SQLite as an extension; do not rely on it. Both accept an alias in HAVING (HAVING orders &gt; 20), which standard SQL does not; repeating the aggregate (HAVING COUNT(*) &gt; 20) works everywhere. SQLite even accepts HAVING on a column that is not grouped, picking a value from some row; MySQL with its default settings rejects that.")}`,
refs:"SQLite documentation, <i>The SELECT statement</i> (sqlite.org/lang_select.html) · MySQL 8.0 Reference Manual, <i>SELECT Statement</i> (the HAVING clause) and <i>Problems with Column Aliases</i> · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), on finding duplicates · Ramakrishnan &amp; Gehrke, <i>Database Management Systems</i> (3rd ed., 2003), on GROUP BY and HAVING.",
lab:root=>{labOrder(root);},
qs:[
{t:"sql",db:"saralmart",q:"Interview classic: duplicates. Return each customer name that appears more than once in <code>customers</code>, with the number of times it appears (two columns).",
 answer:"SELECT cust_name, COUNT(*) FROM customers GROUP BY cust_name HAVING COUNT(*) > 1",
 hint:"Group by the name; keep groups whose COUNT(*) is greater than 1.",
 why:`<div class="formula">SELECT cust_name, COUNT(*) AS times
FROM customers
GROUP BY cust_name
HAVING COUNT(*) > 1;</div>67 names appear more than once, four of them three times. Some may be different people with the same name, which is why the data-quality desk checks emails and cities before merging anything.`},
{t:"sql",db:"saralmart",q:"Loyalty list: customers (<code>cust_id</code>) with at least 22 orders, with their number of orders, most orders first, ties broken by <code>cust_id</code>. Guest orders (NULL <code>cust_id</code>) must not appear.",ordered:true,
 answer:"SELECT cust_id, COUNT(*) FROM orders WHERE cust_id IS NOT NULL GROUP BY cust_id HAVING COUNT(*) >= 22 ORDER BY COUNT(*) DESC, cust_id",
 hint:"The 220 guest orders form one NULL group, which easily passes the HAVING test. Remove them with WHERE first.",
 why:`<div class="formula">SELECT cust_id, COUNT(*) AS orders
FROM orders
WHERE cust_id IS NOT NULL      -- a row condition: WHERE
GROUP BY cust_id
HAVING COUNT(*) >= 22          -- a group condition: HAVING
ORDER BY orders DESC, cust_id;</div>12 customers, led by customer 101 with 31 orders. Without the WHERE, the guest group (220 orders) tops the list.`},
{t:"sql",db:"saralmart",q:"Delivery partners (<code>partner_id</code>) with more than 200 Delivered orders, and that number, highest first.",ordered:true,
 answer:"SELECT partner_id, COUNT(*) FROM orders WHERE status = 'Delivered' GROUP BY partner_id HAVING COUNT(*) > 200 ORDER BY COUNT(*) DESC",
 hint:"Filter the status in WHERE, the count in HAVING. \"More than 200\" is > 200.",
 why:`<div class="formula">SELECT partner_id, COUNT(*) AS delivered
FROM orders
WHERE status = 'Delivered'
GROUP BY partner_id
HAVING COUNT(*) > 200
ORDER BY delivered DESC;</div>Four partners: 3 (238), 7 (214), 10 (203) and 17 (202). Partners 1 and 4 have exactly 200 and are out; with &gt;= 200 they would be in.`},
{t:"mcq",q:"<code>SELECT status, COUNT(*) FROM orders WHERE COUNT(*) &gt; 250 GROUP BY status;</code> fails. Why?",
 opts:["WHERE is applied before GROUP BY, so there are no groups to count yet; the condition belongs in HAVING","COUNT(*) cannot be compared with a number","GROUP BY must come before WHERE in the written query","status must be inside an aggregate"],a:0,
 hint:"Walk the logical order: which clause runs first?",
 why:"WHERE filters individual rows before any grouping, so an aggregate has nothing to work on. The fix is <code>GROUP BY status HAVING COUNT(*) &gt; 250</code>, which keeps Delivered and Cancelled."},
{t:"sql",db:"saralmart",q:"Categories whose average list price is above ₹800: return <code>category</code> and the average price rounded to 2 decimals, sorted by category.",ordered:true,
 answer:"SELECT category, ROUND(AVG(price), 2) FROM products GROUP BY category HAVING AVG(price) > 800 ORDER BY category",
 hint:"The condition is on an average, so HAVING.",
 why:`<div class="formula">SELECT category, ROUND(AVG(price), 2) AS avg_price
FROM products
GROUP BY category
HAVING AVG(price) > 800
ORDER BY category;</div>Electronics, Home, Kitchen and Toys. <code>WHERE price &gt; 800</code> answers a different question: the average of the expensive products only.`},
{t:"sql",db:"saralmart",q:"Interview classic: orders paid in more than one instalment. Return <code>order_id</code> and the number of payment rows, for every order with more than one payment, sorted by <code>order_id</code>.",ordered:true,
 answer:"SELECT order_id, COUNT(*) FROM payments GROUP BY order_id HAVING COUNT(*) > 1 ORDER BY order_id",
 hint:"The duplicates pattern again, this time on payments.order_id.",
 why:`<div class="formula">SELECT order_id, COUNT(*) AS payments
FROM payments
GROUP BY order_id
HAVING COUNT(*) > 1
ORDER BY order_id;</div>206 orders were split across two payments. Counting different methods instead (COUNT(DISTINCT method) &gt; 1) misses the 33 orders paid twice by Wallet.`},
{t:"mcq",q:"In the logical order of execution, which clause is applied immediately before SELECT?",opts:["HAVING","WHERE","GROUP BY","ORDER BY"],a:0,
 hint:"FROM → WHERE → GROUP BY → … → SELECT.",
 why:"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. That is why HAVING cannot use a SELECT alias in standard SQL, while ORDER BY can."}
]});

L.push({id:"l4",badge:"Decimal Keeper",code:"File 4",title:"Numbers that lie",topics:"Arithmetic in SELECT, line revenue qty × unit_price × (1 − discount), integer division (SQLite vs MySQL), ROUND, ABS, CAST, modulo, average order value",
story:`<b>Two dashboards, one number.</b> The operations dashboard says the average order line has 1 item; the finance sheet says 1.60. Both were computed from the same table, on the same day. Meanwhile someone has reported the average order value as AVG(amount) from payments, and the chief financial officer (CFO) wants to know why it is lower than last month's figure built "the old way".`,
brief:`<p>SQL (Structured Query Language) can compute in SELECT. The expression is evaluated <em>per row</em>, and an aggregate can then add the results. One line of <code>order_items</code> is worth</p>
<div class="formula">line revenue = qty × unit_price × (1 − discount)        discount 0.10 = 10% off
SELECT order_id, SUM(qty * unit_price * (1 - discount)) AS order_value
FROM order_items
GROUP BY order_id;</div>
<p>That is the <span class="term">booked value</span> of an order. order_items has no status column, so a cancelled order's lines are still in it; the money actually received is in <code>payments</code>. Combining the two tables needs a join (Module 3).</p>
<p><span class="term">Integer division</span> is the classic trap. In SQLite, dividing an integer by an integer gives an integer, truncated towards zero: 7 / 2 = 3, and SUM(qty) / COUNT(*) = 1. Make one side a decimal: 7 * 1.0 / 2 = 3.5, or CAST(7 AS REAL) / 2. AVG always returns a decimal.</p>
<div class="formula">7 / 2 = 3     7 * 1.0 / 2 = 3.5     7 % 2 = 1  (remainder, "modulo")
ROUND(2.345, 2) = 2.35   ROUND(x) = 0 decimals   ABS(-5) = 5
CAST(9.99 AS INTEGER) = 9   (truncates)   CAST('3.7' AS REAL) = 3.7</div>
<p>Money computed in binary floating point can show tails such as 115.05000000000001; round for display with ROUND(x, 2). The <span class="term">average order value</span> is total revenue divided by the number of orders. When one order can have several payment rows, that is SUM(amount) / COUNT(DISTINCT order_id), not AVG(amount).</p>
${MN("In MySQL the / operator returns a decimal even for two integers: 7 / 2 = 3.5000. For integer division MySQL has the DIV operator (7 DIV 2 = 3). So SUM(qty) / COUNT(*) gives 1.6026 in MySQL but 1 in SQLite; write SUM(qty) * 1.0 / COUNT(*) and both agree. MySQL also has MOD(a, b), CEIL, FLOOR and TRUNCATE(x, d); this game's SQLite build has %, CEIL and FLOOR, but no MOD() or TRUNCATE(). ROUND(1234.5, -2) is 1200 in MySQL; SQLite does not accept negative digits (it treats them as 0). MySQL casts with CAST(x AS SIGNED) or CAST(x AS DECIMAL(10,2)); SQLite with CAST(x AS INTEGER) or CAST(x AS REAL).")}`,
refs:"SQLite documentation, <i>SQL Language Expressions</i> (operators) and <i>Datatypes in SQLite</i> (sqlite.org/lang_expr.html, sqlite.org/datatype3.html) · MySQL 8.0 Reference Manual, <i>Arithmetic Operators</i> and <i>Mathematical Functions</i> · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), on working with numbers · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Data Generation, Manipulation, and Conversion\".",
lab:root=>{labDivide(root);const h=el("div",{style:"margin-top:18px"});root.appendChild(h);labLines(h);},
qs:[
{t:"sql",db:"saralmart",q:"Line revenue for order 5011: return <code>product_id</code>, <code>qty</code>, <code>unit_price</code>, <code>discount</code> and the line's revenue qty × unit_price × (1 − discount), sorted by <code>product_id</code>.",ordered:true,
 answer:"SELECT product_id, qty, unit_price, discount, qty * unit_price * (1 - discount) FROM order_items WHERE order_id = 5011 ORDER BY product_id",
 hint:"One expression in SELECT, computed for each row.",
 why:`<div class="formula">SELECT product_id, qty, unit_price, discount,
       qty * unit_price * (1 - discount) AS line_revenue
FROM order_items
WHERE order_id = 5011
ORDER BY product_id;</div>Five lines worth ₹3,155.50 in all; products 215 and 241 carry a 15% discount, so 2 × 540 = 1,080 becomes 918. The brackets matter: <code>qty * unit_price - discount</code> would subtract 0.15 rupees, not 15%.`},
{t:"sql",db:"saralmart",q:"The five orders with the highest booked value (sum of line revenue in <code>order_items</code>): return <code>order_id</code> and the value rounded to 2 decimals, highest first.",ordered:true,
 answer:"SELECT order_id, ROUND(SUM(qty * unit_price * (1 - discount)), 2) FROM order_items GROUP BY order_id ORDER BY SUM(qty * unit_price * (1 - discount)) DESC LIMIT 5",
 hint:"GROUP BY order_id, SUM of the line expression, ORDER BY … DESC, LIMIT 5.",
 why:`<div class="formula">SELECT order_id, ROUND(SUM(qty * unit_price * (1 - discount)), 2) AS booked
FROM order_items
GROUP BY order_id
ORDER BY booked DESC
LIMIT 5;</div>5125 (₹19,548), 8288, 8784, 7509 and 5941. Ignoring the discount puts 8160 into the top five instead of 5941.`},
{t:"sql",db:"saralmart",q:"The two-dashboards puzzle: the average quantity per order line, rounded to 2 decimals (one column). Watch the division.",
 answer:"SELECT ROUND(AVG(qty), 2) FROM order_items",
 hint:"SUM(qty) / COUNT(*) divides two integers. AVG(qty), or SUM(qty) * 1.0 / COUNT(*), does not truncate.",
 why:`<div class="formula">SELECT ROUND(AVG(qty), 2) FROM order_items;
-- or: SELECT ROUND(SUM(qty) * 1.0 / COUNT(*), 2) FROM order_items;</div>1.60 items per line. The operations dashboard divided two integers in SQLite and got 1: integer division truncated 15,010 / 9,366 = 1.6026 to 1. In MySQL the same expression would have given 1.6026.`},
{t:"sql",db:"saralmart",q:"Interview classic: average order value. From <code>payments</code>, return the total collected divided by the number of different orders paid, rounded to 2 decimals (one column).",
 answer:"SELECT ROUND(SUM(amount) / COUNT(DISTINCT order_id), 2) FROM payments",
 hint:"Some orders have two payment rows, so AVG(amount) averages instalments, not orders.",
 why:`<div class="formula">SELECT ROUND(SUM(amount) / COUNT(DISTINCT order_id), 2) AS avg_order_value
FROM payments;</div>₹2,399.50 per paid order. AVG(amount) gives ₹2,279.18, because it divides by 4,108 payment rows instead of 3,902 orders: each split order counts twice at half its value. amount is a decimal column, so the division is not truncated here.`},
{t:"sql",db:"saralmart",q:"Margins: the five products with the highest margin percentage, 100 × (price − cost) / price rounded to 1 decimal. Return <code>product_id</code>, <code>price</code>, <code>cost</code> and the margin percentage, highest first.",ordered:true,
 answer:"SELECT product_id, price, cost, ROUND(100.0 * (price - cost) / price, 1) FROM products ORDER BY (price - cost) / price DESC LIMIT 5",
 hint:"Margin percentage is relative to price. Sort by the percentage, not by the rupee margin.",
 why:`<div class="formula">SELECT product_id, price, cost,
       ROUND(100.0 * (price - cost) / price, 1) AS margin_pct
FROM products
ORDER BY margin_pct DESC
LIMIT 5;</div>Product 203 leads at 45.0%, then 213, 212, 222 and 223. Sorting by price − cost in rupees would put the Mixer Grinder (₹1,366.64 margin, 42.7%) first: the biggest margin in money is not the biggest in percent.`},
{t:"sql",db:"saralmart",q:"Price bands of ₹500 using integer division on purpose: return the band start (price / 500) × 500 and the number of products in each band, sorted by band start.",ordered:true,
 answer:"SELECT (price / 500) * 500, COUNT(*) FROM products GROUP BY (price / 500) * 500 ORDER BY (price / 500) * 500",
 hint:"price is an integer, so price / 500 truncates: 1,450 / 500 = 2, and 2 × 500 = 1,000.",
 why:`<div class="formula">SELECT (price / 500) * 500 AS band_from, COUNT(*) AS products
FROM products
GROUP BY band_from
ORDER BY band_from;</div>20 products under ₹500, 13 from ₹500, 5 from ₹1,000, and one each from ₹1,500, ₹2,500 and ₹3,000. Here truncation is the point. In MySQL write FLOOR(price / 500) * 500 or price DIV 500 * 500, because / would not truncate.`},
{t:"mcq",q:"What does <code>SELECT 7 / 2, 7 / 2.0;</code> return in SQLite, and in MySQL?",
 opts:["SQLite: 3 and 3.5. MySQL: 3.5000 and 3.5000","SQLite: 3.5 and 3.5. MySQL: 3 and 3.5","Both: 3 and 3.5","Both: 3.5 and 3.5"],a:0,
 hint:"In SQLite the types of the operands decide; in MySQL / is always exact division.",
 why:"SQLite divides integer by integer as an integer (3); with one decimal operand it gives 3.5. MySQL's / returns an exact decimal either way; its integer division is the separate DIV operator. Writing * 1.0 makes the two systems agree."}
]});

L.push({id:"l5",badge:"Pivot Builder",code:"File 5",title:"One table for the board",topics:"Conditional aggregation SUM(CASE WHEN …), COUNT(CASE WHEN …), rates and percentage shares, pivot-style reports",
story:`<b>The board pack.</b> The directors want a single table: channels down the side, order statuses across the top. Under it, the cancellation rate per channel, and the share of collections by payment method, "as percentages, and they must add up to 100". The spreadsheet team usually builds this by hand. You will build it with one query each.`,
brief:`<p>Module 1's CASE expression returns a value per row. Put a CASE <em>inside</em> an aggregate and you get <span class="term">conditional aggregation</span>: an aggregate that only counts or adds the rows meeting a condition.</p>
<div class="formula">SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END)        -- counts cancelled rows
COUNT(CASE WHEN status = 'Cancelled' THEN 1 END)               -- same: no ELSE gives NULL, and COUNT skips NULLs
SUM(CASE WHEN method = 'UPI' THEN amount ELSE 0 END)           -- adds UPI amounts only</div>
<p>(UPI, the Unified Payments Interface, is an instant bank transfer; COD is cash on delivery. Both are values of payments.method.)</p>
<p>A trap: <code>COUNT(CASE WHEN … THEN 1 ELSE 0 END)</code> counts <em>every</em> row, because 0 is a value, not a NULL.</p>
<p>A <span class="term">pivot</span> (a cross-tab) turns the values of one column into columns: one conditional aggregate per value, grouped by the row dimension. You must know the column values in advance and list them.</p>
<div class="formula">SELECT channel,
       SUM(CASE WHEN status = 'Delivered' THEN 1 ELSE 0 END) AS delivered,
       SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) AS cancelled
FROM orders
GROUP BY channel;</div>
<p><span class="term">Rates and shares</span> divide one aggregate by another: 100.0 * SUM(CASE …) / COUNT(*). The 100.0 is not decoration: in SQLite, 100 * 163 / 2583 is integer arithmetic and gives 6, not 6.31 (File 4). Shares of a grand total laid out as columns, one per category, need nothing more than this. Shares as rows (one row per category, each divided by the grand total) need the total in every row, which takes a subquery or a window function (Modules 4 and 5).</p>
${MN("In both MySQL and SQLite a comparison is itself 1 or 0, so SUM(status = 'Cancelled') also counts; that shortcut is not portable to every database, while SUM(CASE …) is. MySQL users often write SUM(IF(status = 'Cancelled', 1, 0)); IF() does not exist in SQLite, which has IIF() instead. MySQL has no PIVOT keyword either, so conditional aggregation is the standard way in both.")}`,
refs:"SQLite documentation, <i>SQL Language Expressions</i>, the CASE expression (sqlite.org/lang_expr.html) · MySQL 8.0 Reference Manual, <i>Flow Control Functions</i> · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), on pivoting a result set · Kimball &amp; Ross, <i>The Data Warehouse Toolkit</i> (3rd ed., 2013), on reporting with facts and dimensions.",
lab:root=>{labBuckets(root,"pivot");},
qs:[
{t:"sql",db:"saralmart",q:"Per channel: return <code>channel</code>, the total number of orders and the number of cancelled orders, sorted by channel.",ordered:true,
 answer:"SELECT channel, COUNT(*), SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) FROM orders GROUP BY channel ORDER BY channel",
 hint:"COUNT(*) for the total; SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) for the cancelled ones.",
 why:`<div class="formula">SELECT channel, COUNT(*) AS orders,
       SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) AS cancelled
FROM orders
GROUP BY channel
ORDER BY channel;</div>App 2,583 orders with 163 cancelled, Phone 235 with 20, Web 1,382 with 115. A WHERE status = 'Cancelled' would have lost the totals; conditional aggregation gets both in one pass.`},
{t:"sql",db:"saralmart",q:"Cancellation rate per channel, in percent rounded to 2 decimals: return <code>channel</code> and the rate, highest rate first.",ordered:true,
 answer:"SELECT channel, ROUND(100.0 * SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) / COUNT(*), 2) FROM orders GROUP BY channel ORDER BY 2 DESC",
 hint:"100.0 * cancelled / all. Start with 100.0, not 100, or SQLite will divide integers.",
 why:`<div class="formula">SELECT channel,
       ROUND(100.0 * SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) / COUNT(*), 2) AS cancel_pct
FROM orders
GROUP BY channel
ORDER BY cancel_pct DESC;</div>Phone 8.51%, Web 8.32%, App 6.31%. With 100 instead of 100.0, SQLite returns 8, 8 and 6. ORDER BY 2 means "the second output column"; it works in both systems but an alias is clearer.`},
{t:"sql",db:"saralmart",q:"The board's pivot: one row per channel with four columns of counts, in this order: delivered, cancelled, returned, in transit. Sort by channel.",ordered:true,

{t:"sql",db:"saralmart",q:"Interview classic: percentage share by category. From <code>payments</code>, return one row with four columns: the share of the total amount collected through UPI, Card, COD and Wallet, in that order, each in percent rounded to 2 decimals.",

FROM payments;</div>53.36% UPI, 18.91% Card, 15.93% cash on delivery (COD), 11.79% Wallet: 99.99% after rounding, which is normal. Shares by rupees, not by number of payments.`},
