const L=[];
L.push({id:"l1",badge:"Plan Reader",code:"File 1",title:"How a query runs",topics:"Parser, planner (optimiser) and executor · EXPLAIN QUERY PLAN · SCAN versus SEARCH · B-tree indexes · CREATE INDEX, DROP INDEX · automatic indexes",
story:`<b>Night shift, Prayaan control tower.</b> Prayaan Logistics moves parcels between twelve city hubs, and every scan of every parcel lands in one table, <code>shipment_events</code>: 32,166 rows and growing. The customer-care screen that shows "where is my parcel?" has started to lag. The developers swear the query is "just one line". You are the new database analyst, and your first job is to find out what that one line makes the database do.`,
brief:`<p>A SQL (Structured Query Language) statement says <em>what</em> you want, never <em>how</em> to get it. The database engine decides the how, in three stages:</p>
<div class="formula">text ──► PARSER ──► PLANNER (optimiser) ──► EXECUTOR ──► rows
         checks       picks an access path      runs the plan,
         grammar,     for every table: scan,     reads pages,
         names        index search, join order    returns rows</div>
<p>The <span class="term">parser</span> turns the text into a parse tree; a misspelt keyword fails here. The engine then resolves table and column names (a missing column is reported before a single row is read). The <span class="term">planner</span>, also called the <span class="term">query optimiser</span>, compares possible plans and picks the cheapest it can find. The <span class="term">executor</span> runs that plan. <code>EXPLAIN QUERY PLAN</code> in front of a SELECT shows the plan without running the query.</p>
<p>Two plan words matter most. <b>SCAN t</b> means every row of t is read. <b>SEARCH t USING INDEX …</b> means the engine jumps straight to the rows it needs through an <span class="term">index</span>: a separate, sorted copy of one or more columns, each entry pointing back to its row, like the index at the back of a book.</p>
<p>The usual index structure is the <span class="term">B-tree</span> (Bayer and McCreight, 1972): a balanced tree of pages, each holding many sorted keys. With about 100 keys a page, three levels cover a million rows, so a lookup reads three or four pages instead of the whole table.</p>
<div class="formula">CREATE INDEX idx_events_shipment ON shipment_events (shipment_id);
DROP INDEX idx_events_shipment;
EXPLAIN QUERY PLAN SELECT * FROM shipment_events WHERE shipment_id = 1042;</div>
<p>A PRIMARY KEY or UNIQUE column gets an index automatically. In SQLite, an INTEGER PRIMARY KEY is the row's own key (rowid), so <code>WHERE shipment_id = 1042</code> on <code>shipments</code> is already a SEARCH; other keys get an index named <code>sqlite_autoindex_…</code>.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game runs SQLite: write <code>EXPLAIN QUERY PLAN SELECT …</code> and read SCAN or SEARCH. In MySQL write <code>EXPLAIN SELECT …</code> and read the columns <code>type</code> (ALL = full scan; ref, range, const = index used), <code>key</code> (the index chosen) and <code>rows</code> (an estimate). Indexes are listed with <code>SHOW INDEX FROM t</code> in MySQL and with <code>PRAGMA index_list(t)</code> or <code>sqlite_master</code> here. Dropping one: <code>DROP INDEX idx ON t</code> in MySQL, <code>DROP INDEX idx</code> here.</span></div>`,
refs:"SQLite documentation: \"The SQLite Query Optimizer Overview\" (optoverview.html), \"Query Planning\" (queryplanner.html), \"EXPLAIN QUERY PLAN\" (eqp.html), \"CREATE INDEX\" (lang_createindex.html) · MySQL 8.0 Reference Manual, chapter \"Optimization\": \"How MySQL Uses Indexes\" and \"EXPLAIN Statement\" · Bayer &amp; McCreight, \"Organization and Maintenance of Large Ordered Indices\", <i>Acta Informatica</i> 1 (1972) · Silberschatz, Korth &amp; Sudarshan, <i>Database System Concepts</i> (7th ed., 2019), chapters on indexing and query processing.",
lab:root=>{labPipeline(root);labBTree(root);sbIndex(root);},
qs:[
{t:"sql",db:PR,q:"Warm-up on the tracking feed. How many events has each hub recorded? Return hub_code and the number of events.",answer:"SELECT hub_code, COUNT(*) AS events FROM shipment_events GROUP BY hub_code",
 hint:"GROUP BY hub_code with COUNT(*).",why:"<code>SELECT hub_code, COUNT(*) AS events FROM shipment_events GROUP BY hub_code;</code> Twelve rows. Run it with EXPLAIN QUERY PLAN in front and SQLite reports a SCAN: a count over the whole table has to read every row whatever indexes exist."},
{t:"mcq",q:"A developer types <code>SELEC shipment_id FROM shipments;</code>. At which stage is the statement rejected?",opts:["The parser: SELEC is not a keyword, so no parse tree can be built","The planner: it cannot find a plan for SELEC","The executor: it fails on the first row","It runs and returns nothing"],a:0,
 hint:"Which stage reads the grammar?",why:"The parser checks the grammar before anything else; SQLite answers <code>near \"SELEC\": syntax error</code>. No plan is made and no row is read. A misspelt column name is also caught before execution, when names are resolved."},
{t:"sql",db:PR,q:"The \"where is my parcel?\" screen for shipment 1042: return event_time, event_type and hub_code of its events, in time order (then by event_id).",answer:"SELECT event_time, event_type, hub_code FROM shipment_events WHERE shipment_id = 1042 ORDER BY event_time, event_id",ordered:true,
 hint:"WHERE shipment_id = 1042, then ORDER BY event_time, event_id.",why:"<code>SELECT event_time, event_type, hub_code FROM shipment_events WHERE shipment_id = 1042 ORDER BY event_time, event_id;</code> Eight rows: booked in Lucknow, through Kochi, delivered in Bhubaneswar. Without an index on shipment_id the plan is SCAN shipment_events: 32,166 rows read to return 8."},
{t:"sql",db:PR,q:"Fix the lag. Create an index on shipment_events that lets SQLite SEARCH by shipment_id instead of scanning. (Any index name.)",answer:"CREATE INDEX idx_events_shipment ON shipment_events (shipment_id)",
 check:"SELECT ii.seqno, ii.name FROM pragma_index_list('shipment_events') AS il JOIN pragma_index_info(il.name) AS ii WHERE il.origin = 'c' ORDER BY il.name, ii.seqno",
 hint:"CREATE INDEX some_name ON shipment_events (shipment_id);",why:"<code>CREATE INDEX idx_events_shipment ON shipment_events (shipment_id);</code> Now <code>EXPLAIN QUERY PLAN SELECT * FROM shipment_events WHERE shipment_id = 1042;</code> says <code>SEARCH shipment_events USING INDEX idx_events_shipment (shipment_id=?)</code>. The checker reads the index's columns from <code>pragma_index_list</code> and <code>pragma_index_info</code>, so the name does not matter. In MySQL: <code>CREATE INDEX idx_events_shipment ON shipment_events (shipment_id);</code> is the same statement."},
{t:"num",ph:"e.g. 5000",q:"Before the index, the plan for <code>WHERE shipment_id = 1042</code> was SCAN shipment_events. How many rows does that scan read? (Count them with SQL.)",a:N_EVENTS,tol:0.5,
 hint:"SELECT COUNT(*) FROM shipment_events;",why:"A SCAN reads every row: 32,166 of them, to return 8. With the index, SQLite reads a few B-tree pages (about three levels) and then the 8 matching rows."},
{t:"sql",db:PR,q:"Some indexes exist before you create any. List the name and tbl_name of every index recorded in <code>sqlite_master</code>.",answer:"SELECT name, tbl_name FROM sqlite_master WHERE type = 'index'",
 hint:"sqlite_master has a column type; indexes have type = 'index'.",why:"<code>SELECT name, tbl_name FROM sqlite_master WHERE type = 'index';</code> Four automatic indexes: for the TEXT primary keys of hubs and vehicles and the UNIQUE columns drivers.licence_no and app_users.username. Integer primary keys (shipment_id, event_id) need none: they are the table's own B-tree key. MySQL shows the same idea with <code>SHOW INDEX FROM hubs</code>: PRIMARY and UNIQUE keys are indexed automatically."},
{t:"mcq",q:"The new index makes the parcel screen fast. What does it make slower?",opts:["Every INSERT, UPDATE and DELETE on shipment_events, because the index must be kept up to date too","SELECTs on other tables","Nothing: indexes are free","Only DROP TABLE"],a:0,
 hint:"An index is a second, sorted copy of the column.",why:"Each new scan event must now be written to the table and to the index, in the right sorted place. Indexes also take storage. Reads get faster, writes get slower: index the columns you search often, not every column."}
]});

L.push({id:"l2",badge:"Index Architect",code:"File 2",title:"Composite indexes and their limits",topics:"Composite indexes and the leftmost-prefix rule · covering indexes · sargable conditions · selectivity · when indexes do not help · MySQL EXPLAIN and EXPLAIN ANALYZE",
story:`<b>The hub dashboards.</b> Every hub manager opens a dashboard that asks the same question all day: "what happened at my hub between these two times?" Someone added an index on <code>event_time</code>, someone else one on <code>hub_code</code>, and a third person wants to index <code>status</code> too, "just in case". You are asked which indexes to keep, in which column order, and why some queries ignore them.`,
brief:`<p>A <span class="term">composite index</span> sorts by several columns: first by the first, then by the second within ties, like a phone book sorted by surname, then first name. It helps any search on a <span class="term">leftmost prefix</span> of its columns:</p>
<div class="formula">CREATE INDEX idx_hub_time ON shipment_events (hub_code, event_time);
WHERE hub_code = 'H05'                                   ✓ seek
WHERE hub_code = 'H05' AND event_time >= '2026-03-14'    ✓ seek on both
WHERE event_time >= '2026-03-14'                         ✗ no seek: scan</div>
<p>Put the column compared with <b>=</b> first and the range column after it. A <span class="term">covering index</span> holds every column the query needs, so the table itself is never read; SQLite reports <code>USING COVERING INDEX</code>.</p>
<p>A condition the index can serve is called <span class="term">sargable</span> (from "search argument"): the indexed column stands alone on one side. A function or arithmetic on the column hides it from the index:</p>
<div class="formula">strftime('%m', event_time) = '03'         ✗ every row computed, scan
event_time &gt;= '2026-03-01'
  AND event_time &lt; '2026-04-01'          ✓ range on the bare column</div>
<p>Indexes do not always help. <span class="term">Selectivity</span> is the share of rows a condition keeps; an index pays when it is small. 89% of shipments are Delivered, so an index on <code>status</code> narrows nothing for that value, while it still costs time on every write. A leading wildcard (<code>LIKE '%pur'</code>) cannot seek either: the sorted order starts at the first character.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>Here, <code>EXPLAIN QUERY PLAN</code> shows SEARCH, SCAN and COVERING INDEX. MySQL's <code>EXPLAIN</code> shows <code>type</code> (ALL, index, range, ref, const), <code>key</code>, <code>rows</code> and <code>Extra</code>, where "Using index" means covering. MySQL 8.0 also has <code>EXPLAIN ANALYZE</code>, which really runs the query and reports actual rows and times per step, and <code>EXPLAIN FORMAT=TREE</code>. MySQL may skip an index whose condition matches a large share of the table; SQLite's choice depends on its statistics, gathered with <code>ANALYZE</code> here and <code>ANALYZE TABLE t</code> in MySQL. One more difference: MySQL can use an ordinary index for <code>LIKE 'abc%'</code>; SQLite's case-insensitive LIKE generally cannot use an ordinary index (GLOB 'abc*' can).</span></div>`,
refs:"SQLite documentation: \"Query Planning\" (queryplanner.html, sections on multi-column and covering indexes), \"The SQLite Query Optimizer Overview\" (optoverview.html, the LIKE optimisation), \"ANALYZE\" (lang_analyze.html) · MySQL 8.0 Reference Manual: \"Multiple-Column Indexes\", \"EXPLAIN Statement\", \"Obtaining Execution Plan Information\" · Ramakrishnan &amp; Gehrke, <i>Database Management Systems</i> (3rd ed., 2003), chapters on storage, indexing and tree-structured indexes.",
lab:root=>{labPhoneBook(root);labPlanExplorer(root);},
qs:[
{t:"sql",db:PR,q:"Dashboards filter <code>WHERE hub_code = ? AND event_time BETWEEN ? AND ?</code>. Create ONE composite index that serves both conditions, equality column first. (Any name.)",answer:"CREATE INDEX idx_hub_time ON shipment_events (hub_code, event_time)",
 check:"SELECT ii.seqno, ii.name FROM pragma_index_list('shipment_events') AS il JOIN pragma_index_info(il.name) AS ii WHERE il.origin = 'c' ORDER BY il.name, ii.seqno",
 hint:"Two columns in the brackets, hub_code first.",why:"<code>CREATE INDEX idx_hub_time ON shipment_events (hub_code, event_time);</code> All entries for H05 sit together, sorted by time, so SQLite seeks to (H05, start) and reads forward until the end time: <code>SEARCH … USING INDEX idx_hub_time (hub_code=? AND event_time&gt;? AND event_time&lt;?)</code>. With (event_time, hub_code) the range on the first column stops the seek from using hub_code."},
{t:"mcq",q:"With only the index on (hub_code, event_time), which condition makes SQLite scan the whole table?",opts:["WHERE event_time &gt;= '2026-03-14' AND event_time &lt; '2026-03-15'","WHERE hub_code = 'H05'","WHERE hub_code = 'H05' AND event_time &gt;= '2026-03-14'","WHERE hub_code IN ('H05', 'H08')"],a:0,
 hint:"Leftmost prefix: is hub_code in the condition?",why:"event_time is the second column. Its values are sorted only within each hub, so the March 14 entries are scattered across twelve blocks; there is no single place to start reading. The plan is SCAN shipment_events."},
{t:"sql",db:PR,q:"How many events were recorded in March 2026? Write the date condition so that an index on event_time could be used (no function on the column).",answer:"SELECT COUNT(*) FROM shipment_events WHERE event_time >= '2026-03-01' AND event_time < '2026-04-01'",
 hint:"event_time is text like '2026-03-31 18:40'. Use &gt;= the first day and &lt; the first day of April.",why:"<code>SELECT COUNT(*) FROM shipment_events WHERE event_time &gt;= '2026-03-01' AND event_time &lt; '2026-04-01';</code> gives 5,538. A common bug is <code>event_time &lt;= '2026-03-31'</code>: '2026-03-31 08:15' sorts after '2026-03-31', so the whole last day is lost (5,366). <code>strftime('%Y-%m', event_time) = '2026-03'</code> also gives 5,538, but it is not sargable. In MySQL the non-sargable form would be <code>MONTH(event_time) = 3</code>."},
{t:"sql",db:PR,q:"Interview classic: duplicates. Some labels were scanned twice by mistake. Return shipment_id, event_type, event_time and the number of copies for every combination that appears more than once.",answer:"SELECT shipment_id, event_type, event_time, COUNT(*) AS copies FROM shipment_events GROUP BY shipment_id, event_type, event_time HAVING COUNT(*) > 1",
 hint:"GROUP BY the three columns, HAVING COUNT(*) &gt; 1.",why:"<code>SELECT shipment_id, event_type, event_time, COUNT(*) AS copies FROM shipment_events GROUP BY shipment_id, event_type, event_time HAVING COUNT(*) &gt; 1;</code> 31 combinations, two copies each. A UNIQUE index on (shipment_id, event_type, event_time) would block future duplicates, but creating it fails until these are cleaned: an index can also be a rule."},
{t:"sql",db:PR,setup:"CREATE INDEX idx_hub_time ON shipment_events (hub_code, event_time);",q:"The composite index (hub_code, event_time) now exists. List event_time and event_type for every event at hub H08 on 6 March 2026, in time order (then by event_id).",answer:"SELECT event_time, event_type FROM shipment_events WHERE hub_code = 'H08' AND event_time >= '2026-03-06' AND event_time < '2026-03-07' ORDER BY event_time, event_id",ordered:true,
 hint:"hub_code = 'H08' AND a range for the day; ORDER BY event_time, event_id.",why:"<code>SELECT event_time, event_type FROM shipment_events WHERE hub_code = 'H08' AND event_time &gt;= '2026-03-06' AND event_time &lt; '2026-03-07' ORDER BY event_time, event_id;</code> 21 events. The index delivers them already sorted by time, so no separate sort is needed. If the query needed only hub_code and event_time, the plan would say USING COVERING INDEX: the table would not be touched at all."},
{t:"mcq",q:"A colleague wants an index on <code>shipments(status)</code> to speed up <code>WHERE status = 'Delivered'</code>. Why is it a poor candidate?",opts:["About 89% of shipments are Delivered: the index narrows almost nothing, yet every write must maintain it","Text columns cannot be indexed","An index on status would change the query results","Indexes only work on numeric columns"],a:0,
 hint:"Compare how many rows match with the size of the table.",why:"Low selectivity. Reading 4,473 of 5,000 rows through an index means 4,473 jumps back to the table, which costs more than one straight scan. It might help for the rare value 'Booked' (54 rows), so the honest answer is \"it depends on the value\", which is why planners keep statistics."},
{t:"num",ph:"e.g. 0.25",q:"Compute the selectivity of <code>status = 'Delivered'</code>: the share of shipments that are Delivered, as a decimal.",a:4473/5000,tol:0.001,
 hint:"Count the Delivered rows and divide by the total (5,000).",why:"4,473 / 5,000 = 0.8946. In SQL: <code>SELECT AVG(status = 'Delivered') FROM shipments;</code> (a comparison is 1 or 0 in SQLite). An index pays off when this share is small, typically a few percent or less."}
]});

L.push({id:"l3",badge:"Query Tuner",code:"File 3",title:"Habits of fast queries",topics:"Sargable predicates · avoid SELECT * · EXISTS versus IN versus DISTINCT joins · WHERE before HAVING · UNION ALL versus UNION · OR versus IN · measuring before tuning",
story:`<b>The month-end report.</b> Finance runs one report every month-end that "takes forever". It was written by five people over three years: a DISTINCT on a join, a HAVING that filters hubs, a UNION where duplicates are wanted, a function on a date column. None of these are bugs; each just asks the engine for more work than it needs. Your brief: same answers, less work, and proof.`,
brief:`<p>The planner is good but cannot read your mind. A few writing habits let it choose a cheaper plan without changing the result:</p>
<div class="formula">1. Keep indexed columns bare      event_time &gt;= '2026-03-01'    not  strftime(…, event_time) = …
                                  weight_kg &gt; 900               not  weight_kg + 100 &gt; 1000
2. Name the columns you need      SELECT shipment_id, status    not  SELECT *
3. Filter rows early              WHERE origin_hub &lt;&gt; 'H01'      not  HAVING origin_hub &lt;&gt; 'H01'
4. Ask "does one exist?"          WHERE EXISTS (…)              not  JOIN … plus DISTINCT
5. Keep duplicates if you want    UNION ALL                     not  UNION (sorts to remove them)
   them (and when there are none)
6. One list, not a chain of ORs   hub_code IN ('H03','H05')     not  hub_code = 'H03' OR …</div>
<p><code>SELECT *</code> drags every column through memory and the network, prevents a covering index, and silently changes when someone adds a column. <code>WHERE</code> removes rows before grouping; <code>HAVING</code> works after grouping, so a condition on a grouping column belongs in WHERE. A join to a "many" table followed by <code>DISTINCT</code> builds all the duplicate rows and then throws them away; <code>EXISTS</code> stops at the first match. <code>UNION</code> must sort or hash every row to remove duplicates; <code>UNION ALL</code> just appends.</p>
<p>Above all: <span class="term">measure</span>. Read the plan, time the query on realistic data, change one thing, measure again. Modern planners rewrite many of these patterns themselves (SQLite and MySQL often turn IN into a lookup and flatten simple subqueries), so a habit that gives a 10× gain on one system can give nothing on another.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>Everything in this file is standard SQL and runs in both. Timing differs: this game runs SQLite inside your browser, so the lab's milliseconds are your laptop's or phone's. In MySQL, <code>EXPLAIN ANALYZE</code> gives per-step actual times; here the lab times each query with the browser clock. MySQL writes the non-sargable date test as <code>YEAR(event_time) = 2026</code> or <code>DATE_FORMAT(event_time, '%Y-%m') = '2026-03'</code>; the sargable range is the same in both.</span></div>`,
refs:"SQLite documentation: \"The SQLite Query Optimizer Overview\" (optoverview.html: subquery flattening, the OR optimisation, IN operators) · MySQL 8.0 Reference Manual, \"Optimizing SELECT Statements\" (including \"WHERE Clause Optimization\" and \"Optimizing Subqueries, Derived Tables, View References, and Common Table Expressions\") · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020) · Silberschatz, Korth &amp; Sudarshan (2019), chapter on query optimisation.",
lab:root=>{labRace(root);sbRace(root);},
qs:[
{t:"sql",db:PR,q:"Which customers have had at least one Returned shipment? Return cust_id and cust_name, each customer once.",answer:"SELECT c.cust_id, c.cust_name FROM customers c WHERE EXISTS (SELECT 1 FROM shipments s WHERE s.cust_id = c.cust_id AND s.status = 'Returned')",
 hint:"WHERE EXISTS (a subquery on shipments for that customer with status 'Returned').",why:"<code>SELECT c.cust_id, c.cust_name FROM customers c WHERE EXISTS (SELECT 1 FROM shipments s WHERE s.cust_id = c.cust_id AND s.status = 'Returned');</code> 154 customers. <code>IN (SELECT cust_id …)</code> and <code>SELECT DISTINCT … JOIN</code> give the same rows; the plain join without DISTINCT repeats customers with several returns. EXISTS can stop at the first matching shipment."},
{t:"sql",db:PR,q:"Interview classic: customers who have never shipped anything. Return cust_id and cust_name.",answer:"SELECT c.cust_id, c.cust_name FROM customers c WHERE NOT EXISTS (SELECT 1 FROM shipments s WHERE s.cust_id = c.cust_id)",
 hint:"NOT EXISTS, or a LEFT JOIN that keeps customers whose matching shipment IS NULL.",why:"<code>SELECT c.cust_id, c.cust_name FROM customers c WHERE NOT EXISTS (SELECT 1 FROM shipments s WHERE s.cust_id = c.cust_id);</code> 56 customers. The LEFT JOIN … WHERE s.shipment_id IS NULL version is equally good. NOT IN works here only because shipments.cust_id is NOT NULL; with a single NULL in the list it would return nothing (the NOT IN trap from module 4)."},
{t:"sql",db:PR,q:"Shipments per origin hub, leaving out hubs H01 and H02. Return origin_hub and the count, and filter the hubs before grouping.",answer:"SELECT origin_hub, COUNT(*) AS shipments FROM shipments WHERE origin_hub NOT IN ('H01', 'H02') GROUP BY origin_hub",
 hint:"WHERE origin_hub NOT IN ('H01', 'H02') before GROUP BY.",why:"<code>SELECT origin_hub, COUNT(*) AS shipments FROM shipments WHERE origin_hub NOT IN ('H01', 'H02') GROUP BY origin_hub;</code> Ten rows. The HAVING version returns the same, but groups the H01 and H02 rows first and discards them afterwards. A condition on a grouping column belongs in WHERE."},
{t:"sql",db:PR,q:"Hub workload for shipments booked in June 2026: every shipment touches its origin hub and its destination hub. Return hub_code and the number of touches (origin and destination appearances together).",answer:"SELECT hub, COUNT(*) AS touches FROM (SELECT origin_hub AS hub FROM shipments WHERE booked_on >= '2026-06-01' AND booked_on < '2026-07-01' UNION ALL SELECT dest_hub FROM shipments WHERE booked_on >= '2026-06-01' AND booked_on < '2026-07-01') AS t GROUP BY hub",
 hint:"Stack the origin column and the destination column with UNION ALL in a subquery, then GROUP BY.",why:"<code>SELECT hub, COUNT(*) AS touches FROM (SELECT origin_hub AS hub FROM shipments WHERE booked_on &gt;= '2026-06-01' AND booked_on &lt; '2026-07-01' UNION ALL SELECT dest_hub FROM shipments WHERE booked_on &gt;= '2026-06-01' AND booked_on &lt; '2026-07-01') AS t GROUP BY hub;</code> (MySQL requires the alias AS t on a subquery in FROM; SQLite does not.) With UNION instead of UNION ALL the duplicates you need are removed, and every hub ends with a count of 1: the slower operator is also the wrong one here."},
{t:"mcq",q:"An index exists on <code>shipments(weight_kg)</code>. Which condition can use it to seek?",opts:["WHERE weight_kg &gt; 900","WHERE weight_kg + 100 &gt; 1000","WHERE ROUND(weight_kg) = 900","WHERE CAST(weight_kg AS INTEGER) &gt; 900"],a:0,
 hint:"Which one leaves the column bare?",why:"Only <code>weight_kg &gt; 900</code> keeps the indexed column alone, so the engine can seek in the sorted index. The other three compute something from every row first. <code>weight_kg &gt; 900</code> is <code>weight_kg + 100 &gt; 1000</code> rewritten by hand into the sargable form: same rows, but the column now stands alone."},
{t:"mcq",q:"Which is NOT a reason to avoid <code>SELECT *</code> in a report?",opts:["SELECT * returns rows in a random order","It moves columns nobody uses through memory and the network","It prevents a covering index from serving the query","Its output changes when someone adds a column to the table"],a:0,
 hint:"Row order is set by ORDER BY, not by the column list.",why:"Without ORDER BY no query has a guaranteed order, with or without *. The other three are real costs. Name the columns you need."}
]});

L.push({id:"l4",badge:"All or Nothing",code:"File 4",title:"Transactions and ACID",topics:"Transactions · BEGIN, COMMIT, ROLLBACK · autocommit · atomicity under failure · ACID · SAVEPOINT, ROLLBACK TO, RELEASE · MySQL START TRANSACTION and implicit commits",
story:`<b>The wallet that lost ₹6,000.</b> Prayaan keeps prepaid wallets for hubs, drivers and business customers. Last night a batch moved ₹6,000 out of a customer's credit, and the matching credit never arrived at the hub: the second statement failed and the script carried on. Finance wants to know how money can vanish from a database that "never loses data", and how to make sure it cannot happen again.`,
brief:`<p>A <span class="term">transaction</span> is a group of statements that the database treats as one unit: either all of their changes become permanent, or none do. TCL (Transaction Control Language) has three core commands:</p>
<div class="formula">BEGIN;                                               -- start the unit
UPDATE wallets SET balance = balance - 6000 WHERE wallet_id = 12;
UPDATE wallets SET balance = balance + 6000 WHERE wallet_id = 4;
INSERT INTO wallet_txns (from_wallet, to_wallet, amount, txn_time, note)
  VALUES (12, 4, 6000, '2026-07-01 10:00', 'invoice');
COMMIT;                                              -- make it permanent
-- or ROLLBACK;                                      -- undo everything since BEGIN</div>
<p>Without BEGIN, each statement is its own transaction and commits immediately (<span class="term">autocommit</span>). The guarantees a transaction gives are summed up as ACID (Gray and Reuter, 1992; the acronym is due to Härder and Reuter, 1983):</p>
<div class="formula">Atomicity    all of it or none of it
Consistency  every constraint (CHECK, FOREIGN KEY, UNIQUE) holds after COMMIT
Isolation    concurrent transactions do not see each other's half-done work (File 5)
Durability   once COMMIT returns, the change survives a crash or power cut</div>
<p>One subtlety causes most real incidents. When a statement inside a transaction fails (say a CHECK constraint), the database undoes that <em>statement</em>, but the transaction stays open with the earlier statements still applied. If the program then sends COMMIT, the half-done work becomes permanent. Atomicity is a partnership: the database provides ROLLBACK, the program must call it on any error.</p>
<p>A <span class="term">savepoint</span> marks a point inside a transaction you can return to without abandoning the whole unit:</p>
<div class="formula">SAVEPOINT before_fee;   ...   ROLLBACK TO before_fee;   RELEASE before_fee;</div>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>Here write <code>BEGIN;</code> (or <code>BEGIN TRANSACTION;</code>). MySQL accepts <code>START TRANSACTION;</code> (the standard form) and also <code>BEGIN;</code>. MySQL runs with <code>autocommit = 1</code> by default; <code>SET autocommit = 0;</code> makes every statement part of an open transaction until COMMIT. SAVEPOINT, ROLLBACK TO SAVEPOINT and RELEASE SAVEPOINT work in both. A big difference: in MySQL, DDL such as CREATE TABLE, ALTER TABLE or DROP TABLE causes an implicit COMMIT, so it cannot be rolled back; in SQLite DDL is transactional and ROLLBACK undoes it too.</span></div>`,
refs:"SQLite documentation: \"Transaction\" (lang_transaction.html), \"SAVEPOINT\" (lang_savepoint.html), \"Atomic Commit In SQLite\" (atomiccommit.html) · MySQL 8.0 Reference Manual, \"Transactional and Locking Statements\": \"START TRANSACTION, COMMIT, and ROLLBACK Statements\", \"SAVEPOINT, ROLLBACK TO SAVEPOINT, and RELEASE SAVEPOINT Statements\", \"Statements That Cause an Implicit Commit\" · Gray &amp; Reuter, <i>Transaction Processing: Concepts and Techniques</i> (1992) · Silberschatz, Korth &amp; Sudarshan (2019), chapter \"Transactions\".",
lab:root=>{labTransfer(root);sbTx(root);},
qs:[
{t:"sql",db:PR,q:"Move ₹5,000 from wallet 1 (Chennai hub float) to wallet 6 (a driver) in one transaction, and record it in wallet_txns (from 1, to 6, amount 5000, txn_time '2026-07-01 10:00', note 'fuel advance'; let txn_id be assigned). Commit.",
 answer:"BEGIN; UPDATE wallets SET balance = balance - 5000 WHERE wallet_id = 1; UPDATE wallets SET balance = balance + 5000 WHERE wallet_id = 6; INSERT INTO wallet_txns (from_wallet, to_wallet, amount, txn_time, note) VALUES (1, 6, 5000, '2026-07-01 10:00', 'fuel advance'); COMMIT;",
 check:"SELECT a.balance, b.balance, t.from_wallet, t.to_wallet, t.amount FROM wallets a JOIN wallets b ON a.wallet_id = 1 AND b.wallet_id = 6 LEFT JOIN wallet_txns t ON t.txn_id = 61",rows:6,
 hint:"BEGIN; two UPDATEs (minus on 1, plus on 6); one INSERT INTO wallet_txns (...) VALUES (...); COMMIT;",why:"<code>BEGIN; UPDATE wallets SET balance = balance - 5000 WHERE wallet_id = 1; UPDATE wallets SET balance = balance + 5000 WHERE wallet_id = 6; INSERT INTO wallet_txns (from_wallet, to_wallet, amount, txn_time, note) VALUES (1, 6, 5000, '2026-07-01 10:00', 'fuel advance'); COMMIT;</code> Wallet 1 ends at 245,000 and wallet 6 at 5,800, and the ledger row is txn 61. Writing <code>balance - 5000</code> instead of a computed number keeps the update correct even if the balance changed a moment ago (File 5). In MySQL, START TRANSACTION instead of BEGIN."},
{t:"sql",db:PR,q:"Interview classic, done safely: delete the duplicate scans (File 2), keeping the copy with the lowest event_id in each (shipment_id, event_type, event_time) group. Wrap the DELETE in BEGIN … COMMIT. (The checker counts the remaining events and the distinct combinations.)",
 answer:"BEGIN; DELETE FROM shipment_events WHERE event_id NOT IN (SELECT MIN(event_id) FROM shipment_events GROUP BY shipment_id, event_type, event_time); COMMIT;",
 check:"SELECT COUNT(*), COUNT(DISTINCT shipment_id || '|' || event_type || '|' || event_time) FROM shipment_events",rows:5,
 hint:"Keep MIN(event_id) per group: DELETE … WHERE event_id NOT IN (SELECT MIN(event_id) FROM shipment_events GROUP BY the three columns).",why:"<code>BEGIN; DELETE FROM shipment_events WHERE event_id NOT IN (SELECT MIN(event_id) FROM shipment_events GROUP BY shipment_id, event_type, event_time); COMMIT;</code> 31 rows go; 32,135 remain, one per combination. In real work, run <code>SELECT COUNT(*)</code> between the DELETE and the COMMIT: if the number looks wrong, ROLLBACK instead and nothing is lost. A ROW_NUMBER() version (module 5) works too. In MySQL the NOT IN form fails with error 1093 (a table cannot be modified and selected from in the same statement); wrap the subquery in a derived table, <code>NOT IN (SELECT m FROM (SELECT MIN(event_id) AS m FROM … GROUP BY …) AS keep)</code>."},
{t:"sql",db:PR,q:"Driver wallet 7 earns a ₹2,000 incentive and a ₹300 service fee is about to be charged. In ONE transaction: credit the 2,000; set SAVEPOINT before_fee; debit the 300; the fee turns out to be waived, so ROLLBACK TO before_fee; then COMMIT.",
 answer:"BEGIN; UPDATE wallets SET balance = balance + 2000 WHERE wallet_id = 7; SAVEPOINT before_fee; UPDATE wallets SET balance = balance - 300 WHERE wallet_id = 7; ROLLBACK TO before_fee; COMMIT;",
 check:"SELECT wallet_id, balance FROM wallets ORDER BY wallet_id",rows:6,
 hint:"BEGIN; UPDATE (+2000); SAVEPOINT before_fee; UPDATE (−300); ROLLBACK TO before_fee; COMMIT;",why:"<code>BEGIN; UPDATE wallets SET balance = balance + 2000 WHERE wallet_id = 7; SAVEPOINT before_fee; UPDATE wallets SET balance = balance - 300 WHERE wallet_id = 7; ROLLBACK TO before_fee; COMMIT;</code> Wallet 7 goes from 3,100 to 5,100. ROLLBACK TO undoes only the work after the savepoint; the transaction stays open and the incentive survives. A plain ROLLBACK would have undone the incentive too. MySQL writes <code>ROLLBACK TO SAVEPOINT before_fee</code>; the word SAVEPOINT is optional in both."},
{t:"sql",db:PR,q:"Book shipment 6001 and its first tracking event as one unit. Shipment: cust_id 5, origin H04, destination H01, booked_on '2026-07-01', 12.5 kg, declared value 4000, status 'Booked' (delivered_on stays empty). Event: hub H04, event_time '2026-07-01 09:30', type 'Booked'. Both or neither.",
 answer:"BEGIN; INSERT INTO shipments (shipment_id, cust_id, origin_hub, dest_hub, booked_on, weight_kg, declared_value, status) VALUES (6001, 5, 'H04', 'H01', '2026-07-01', 12.5, 4000, 'Booked'); INSERT INTO shipment_events (shipment_id, hub_code, event_time, event_type) VALUES (6001, 'H04', '2026-07-01 09:30', 'Booked'); COMMIT;",
 check:"SELECT s.shipment_id, s.cust_id, s.origin_hub, s.dest_hub, s.weight_kg, s.status, s.delivered_on, e.hub_code, e.event_time, e.event_type FROM shipments s JOIN shipment_events e ON e.shipment_id = s.shipment_id WHERE s.shipment_id = 6001",rows:7,
 hint:"BEGIN; INSERT INTO shipments (columns…) VALUES (…); INSERT INTO shipment_events (shipment_id, hub_code, event_time, event_type) VALUES (…); COMMIT;",why:"<code>BEGIN; INSERT INTO shipments (shipment_id, cust_id, origin_hub, dest_hub, booked_on, weight_kg, declared_value, status) VALUES (6001, 5, 'H04', 'H01', '2026-07-01', 12.5, 4000, 'Booked'); INSERT INTO shipment_events (shipment_id, hub_code, event_time, event_type) VALUES (6001, 'H04', '2026-07-01 09:30', 'Booked'); COMMIT;</code> If the second INSERT failed (say, a misspelt hub code breaking the foreign key), the program would ROLLBACK and no orphan shipment without a tracking history could exist."},
{t:"mcq",q:"COMMIT has returned. One second later the data centre loses power. The committed transfer is still there after restart. Which ACID property is that?",opts:["Durability","Atomicity","Consistency","Isolation"],a:0,
 hint:"Which property is about surviving crashes?",why:"Durability: once COMMIT returns, the change is on stable storage (SQLite uses a rollback journal or a write-ahead log; MySQL's InnoDB uses a redo log). Atomicity is about all-or-nothing within the transaction."},
{t:"mcq",q:"A script runs <code>BEGIN;</code> then the debit UPDATE (succeeds), then the credit UPDATE (fails: CHECK constraint), and then, ignoring the error, <code>COMMIT;</code>. What is in the database?",opts:["The debit only: the failed statement was undone, but the transaction stayed open and COMMIT made the debit permanent","Nothing: any error rolls back the whole transaction automatically","Both changes: COMMIT forces the failed statement through","The database refuses the COMMIT"],a:0,
 hint:"What exactly does the database undo when one statement fails?",why:"The failing statement is rolled back, not the transaction. COMMIT then commits what remains: money left one wallet and arrived nowhere. The fix is in the program: on any error, ROLLBACK. Replay it in the lab with the \"COMMIT anyway\" policy."},
{t:"mcq",q:"In MySQL you run <code>START TRANSACTION; DELETE FROM shipment_audit; CREATE TABLE tmp_x (id INT); ROLLBACK;</code>. What happens to the deleted audit rows?",opts:["They stay deleted: CREATE TABLE caused an implicit COMMIT before ROLLBACK ran","They come back: ROLLBACK undoes everything since START TRANSACTION","The CREATE TABLE fails inside a transaction","MySQL asks for confirmation"],a:0,
 hint:"MySQL treats most DDL specially inside a transaction.",why:"In MySQL, CREATE TABLE (not CREATE TEMPORARY TABLE), ALTER and DROP commit the open transaction implicitly, so the ROLLBACK has nothing left to undo. In SQLite, DDL is part of the transaction and ROLLBACK would bring the rows back. Keep DDL out of MySQL transactions."}
]});

L.push({id:"l5",badge:"Isolation Officer",code:"File 5",title:"Two sessions, one wallet",topics:"Concurrency · lost updates · dirty, non-repeatable and phantom reads · isolation levels · locks and snapshots · MySQL InnoDB REPEATABLE READ versus SQLite serializable transactions",
story:`<b>Two dispatchers, one balance.</b> At 09:00 two dispatchers, in Nagpur and in Pune, both pay fuel advances out of the Nagpur hub float at the same moment. Both screens read ₹120,000. Both programs subtract their payment and write the new balance back. The evening reconciliation is ₹30,000 short of explanation, and no statement failed.`,
brief:`<p>Many users run transactions at once. <span class="term">Isolation</span>, the I in ACID (atomicity, consistency, isolation, durability), says how much one transaction may see of another that has not finished. The classic anomalies, from worst to mildest:</p>
<div class="formula">lost update          A and B both read 120,000; A writes 90,000; B writes 100,000 → A's payment vanishes
dirty read           B reads a value A has written but not committed (and A later rolls back)
non-repeatable read  B reads a row twice inside one transaction and gets two different values,
                     because A committed an UPDATE in between
phantom read         B runs the same COUNT(*) twice and new rows appear, because A committed an INSERT</div>
<p>The SQL standard defines four <span class="term">isolation levels</span> by which of the read anomalies they allow:</p>
<div class="formula">level               dirty    non-repeatable   phantom
READ UNCOMMITTED    yes      yes              yes
READ COMMITTED      no       yes              yes
REPEATABLE READ     no       no               yes (allowed by the standard)
SERIALIZABLE        no       no               no      → as if transactions ran one at a time</div>
<p>Engines implement this with <span class="term">locks</span> (a shared lock to read, an exclusive lock to write; a writer waits for readers and vice versa) and, in many systems, <span class="term">snapshots</span>: MVCC (multiversion concurrency control) keeps older versions of rows so that a reader sees the database as of the moment its snapshot was taken, without blocking writers. Two transactions that each wait for a lock the other holds are in a <span class="term">deadlock</span>; the engine picks one and rolls it back.</p>
<p>The lost update is usually a program bug, not an isolation setting: read-then-write in application code. Let the database do the arithmetic in one statement, <code>UPDATE wallets SET balance = balance - 30000 WHERE wallet_id = 3</code>, or lock the row while you decide (<code>SELECT … FOR UPDATE</code> in MySQL).</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>MySQL's InnoDB engine defaults to REPEATABLE READ: plain SELECTs read from a consistent snapshot taken at the transaction's first read, and locking reads (<code>SELECT … FOR UPDATE</code>, <code>FOR SHARE</code>) use next-key locks that also block phantom inserts in the scanned range. Change the level with <code>SET TRANSACTION ISOLATION LEVEL READ COMMITTED;</code> and inspect it with <code>SELECT @@transaction_isolation;</code>. SQLite is different by design: its transactions are serializable. A writer takes a lock on the whole database file; in the default rollback-journal mode readers and the committing writer exclude each other (one of them waits or gets "database is locked"), and in WAL (write-ahead log) mode readers keep reading their snapshot while one writer writes. SQLite has no SET TRANSACTION ISOLATION LEVEL and no SELECT … FOR UPDATE; <code>BEGIN IMMEDIATE</code> takes the write lock up front. This browser game has a single connection, so the lab below is a simulation of two sessions.</span></div>`,
refs:"SQLite documentation: \"Isolation In SQLite\" (isolation.html), \"File Locking And Concurrency In SQLite Version 3\" (lockingv3.html), \"Write-Ahead Logging\" (wal.html) · MySQL 8.0 Reference Manual, \"InnoDB Locking and Transaction Model\": \"Transaction Isolation Levels\", \"Consistent Nonlocking Reads\", \"Locking Reads\", \"Phantom Rows\" · Gray &amp; Reuter (1992) · Berenson et al., \"A Critique of ANSI SQL Isolation Levels\", <i>Proc. ACM SIGMOD</i> (1995) · Silberschatz, Korth &amp; Sudarshan (2019), chapter \"Concurrency Control\".",
lab:root=>{labIsolation(root);},
qs:[
{t:"sql",db:PR,q:"Make the deduction safe against lost updates: in ONE statement, deduct ₹500 from wallet 9, but only if its balance is at least ₹500. (The checker compares all wallet balances afterwards.)",answer:"UPDATE wallets SET balance = balance - 500 WHERE wallet_id = 9 AND balance >= 500",
 check:"SELECT wallet_id, balance FROM wallets ORDER BY wallet_id",
 hint:"UPDATE … SET balance = balance - 500 WHERE wallet_id = 9 AND balance &gt;= 500",why:"<code>UPDATE wallets SET balance = balance - 500 WHERE wallet_id = 9 AND balance &gt;= 500;</code> Wallet 9 goes from 800 to 300. The read, the test and the write happen inside one statement under the database's own lock, so a second session cannot slip in between. Typing <code>SET balance = 300</code> gives the same number today, but it is exactly the read-then-write pattern that loses updates under concurrency."},
{t:"sql",db:PR,q:"Interview classic: reconcile the ledger. For every wallet that appears in wallet_txns, return wallet_id and its net flow (money received minus money sent), ordered by wallet_id.",answer:"SELECT wallet_id, SUM(flow) AS net_flow FROM (SELECT to_wallet AS wallet_id, amount AS flow FROM wallet_txns UNION ALL SELECT from_wallet, -amount FROM wallet_txns) AS t GROUP BY wallet_id ORDER BY wallet_id",ordered:true,rows:5,
 hint:"Stack +amount for to_wallet and −amount for from_wallet with UNION ALL, then GROUP BY wallet_id.",why:"<code>SELECT wallet_id, SUM(flow) AS net_flow FROM (SELECT to_wallet AS wallet_id, amount AS flow FROM wallet_txns UNION ALL SELECT from_wallet, -amount FROM wallet_txns) AS t GROUP BY wallet_id ORDER BY wallet_id;</code> (The alias AS t is optional here and required in MySQL.) Every transfer adds to one wallet and subtracts from another, so the net flows must sum to 0. A non-zero total would mean a half-recorded transfer: the consistency check auditors run after an incident."},
{t:"mcq",q:"Session A updates wallet 3 but has not committed. Session B reads wallet 3 and sees A's new value. A then rolls back. What did B experience?",opts:["A dirty read","A phantom read","A non-repeatable read","A deadlock"],a:0,
 hint:"B read something that was never committed.",why:"A dirty read: B used a value that, after A's rollback, never officially existed. Only READ UNCOMMITTED allows it; MySQL's default and SQLite never show another connection's uncommitted changes in normal use."},
{t:"mcq",q:"What is the default transaction isolation level of MySQL's InnoDB storage engine?",opts:["REPEATABLE READ","READ COMMITTED","SERIALIZABLE","READ UNCOMMITTED"],a:0,
 hint:"It is not the same as in several other popular databases, which default to READ COMMITTED.",why:"InnoDB defaults to REPEATABLE READ: within a transaction, plain SELECTs keep reading the snapshot taken at the first read. Check with <code>SELECT @@transaction_isolation;</code>."},
{t:"num",ph:"e.g. 70000",q:"Wallet 3 holds ₹120,000. Dispatcher A reads it and writes back 120,000 − 30,000. Dispatcher B read 120,000 at the same time and writes back 120,000 − 20,000, a moment after A. What balance is left?",a:100000,tol:0.5,
 hint:"The last write wins, and B's write was computed from a stale read.",why:"B's write, 100,000, overwrites A's 90,000. The correct balance is 70,000, so ₹30,000 of payments vanished: a lost update. <code>SET balance = balance - 20000</code> would have produced 70,000, because each update reads the current value under the write lock."},
{t:"mcq",q:"How does SQLite isolate transactions from different connections?",opts:["Its transactions are serializable: a writer locks the whole database, so concurrent writes are queued or refused","It defaults to READ UNCOMMITTED","It uses REPEATABLE READ like InnoDB, with row locks","It has no isolation: every connection sees every change immediately"],a:0,
 hint:"SQLite locks at the level of the database file.",why:"SQLite allows one writer at a time for the whole database, which makes its transactions serializable. The price is less write concurrency than a server engine with row locks; the gain is simplicity. In WAL mode readers do not block the writer and keep seeing their own snapshot."},
{t:"mcq",q:"Under REPEATABLE READ as defined by the SQL standard, which anomaly is still allowed?",opts:["Phantom reads","Dirty reads","Non-repeatable reads","Lost committed data after COMMIT"],a:0,
 hint:"The standard's table has one \"yes\" left on that row.",why:"The standard lets REPEATABLE READ show phantoms: new rows matching a condition can appear on a second read. InnoDB goes further than the standard for snapshot reads and locking reads, but the textbook answer for the level is phantom reads."}
]});

L.push({id:"l6",badge:"Trigger Warden",code:"File 6",title:"Triggers: rules that run themselves",topics:"CREATE TRIGGER · BEFORE, AFTER, INSTEAD OF · INSERT, UPDATE, DELETE events · NEW and OLD · WHEN conditions · audit logs · RAISE(ABORT) versus SIGNAL · MySQL FOR EACH ROW and DELIMITER",
story:`<b>Who changed shipment 1120?</b> A customer complains that their parcel was marked Delivered two days before it arrived. Nobody admits to touching it, and nothing records who changed what. The audit committee wants a log that no screen and no script can forget to write. You decide to put the rule inside the database itself.`,
brief:`<p>A <span class="term">trigger</span> is a block of SQL that the database runs automatically when a row is inserted, updated or deleted in a table. Programs cannot forget to call it, which makes triggers the usual home for audit logs and cross-table bookkeeping.</p>
<div class="formula">CREATE TRIGGER trg_status_audit
AFTER UPDATE OF status ON shipments            -- timing · event · table
FOR EACH ROW
WHEN OLD.status &lt;&gt; NEW.status                  -- optional condition
BEGIN
  INSERT INTO shipment_audit (shipment_id, old_status, new_status, changed_at)
  VALUES (OLD.shipment_id, OLD.status, NEW.status, datetime('now'));
END;</div>
<p>Inside the body, <span class="term">NEW</span> is the row as it will be after the change and <span class="term">OLD</span> the row as it was: an INSERT has only NEW, a DELETE only OLD, an UPDATE both. A <b>BEFORE</b> trigger runs before the row is written (good for checks that reject bad data), an <b>AFTER</b> trigger after it (good for logs and keeping other tables in step). An <b>INSTEAD OF</b> trigger on a view replaces the change entirely. A trigger runs once per affected row and inside the same transaction as the statement that fired it, so if the trigger fails, the statement fails.</p>
<div class="formula">CREATE TRIGGER trg_weight_guard BEFORE INSERT ON shipments
WHEN NEW.weight_kg &gt; 2500
BEGIN
  SELECT RAISE(ABORT, 'Too heavy for road transport');
END;
DROP TRIGGER trg_weight_guard;</div>
<p>Use triggers sparingly: logic that runs invisibly is hard to debug, and a chain of triggers firing triggers is hard to reason about.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>MySQL requires <code>FOR EACH ROW</code> (SQLite treats it as optional; both only have row-level triggers) and has no <code>UPDATE OF column</code> or <code>WHEN</code> clause: test the condition with IF … THEN … END IF inside the body. Because the body contains semicolons, the mysql command-line client needs <code>DELIMITER $$</code> before CREATE TRIGGER, <code>END $$</code> at the end and <code>DELIMITER ;</code> afterwards; DELIMITER is a client command, not SQL, and SQLite does not need it. To reject a row MySQL uses <code>SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = '…';</code> where SQLite uses <code>SELECT RAISE(ABORT, '…');</code>. A MySQL BEFORE trigger may change the incoming row with <code>SET NEW.col = …</code>; SQLite cannot change NEW, so it uses an AFTER trigger with an UPDATE. MySQL lists triggers with <code>SHOW TRIGGERS</code>; here query <code>sqlite_master WHERE type = 'trigger'</code>.</span></div>`,
refs:"SQLite documentation: \"CREATE TRIGGER\" (lang_createtrigger.html), \"DROP TRIGGER\" (lang_droptrigger.html) · MySQL 8.0 Reference Manual, \"Stored Objects\": \"Using Triggers\", \"Trigger Syntax and Examples\"; \"CREATE TRIGGER Statement\"; \"SIGNAL Statement\"; \"Defining Stored Programs\" (on DELIMITER) · Elmasri &amp; Navathe, <i>Fundamentals of Database Systems</i> (7th ed., 2016), the section on active databases and triggers.",
lab:root=>{labTrigger(root);sbTrigger(root);},
qs:[
{t:"sql",db:PR,q:"Create an AFTER UPDATE trigger on shipments that writes (shipment_id, old_status, new_status, changed_at) into shipment_audit whenever status actually changes. Then mark every 'In transit' shipment that started at hub H03 as 'Delivered'. (The checker reads shipment_id, old_status, new_status from the audit table.)",
 answer:"CREATE TRIGGER trg_status_audit AFTER UPDATE OF status ON shipments FOR EACH ROW WHEN OLD.status <> NEW.status BEGIN INSERT INTO shipment_audit (shipment_id, old_status, new_status, changed_at) VALUES (OLD.shipment_id, OLD.status, NEW.status, datetime('now')); END; UPDATE shipments SET status = 'Delivered' WHERE status = 'In transit' AND origin_hub = 'H03';",
 check:"SELECT shipment_id, old_status, new_status FROM shipment_audit",rows:8,
 hint:"CREATE TRIGGER name AFTER UPDATE OF status ON shipments FOR EACH ROW WHEN OLD.status &lt;&gt; NEW.status BEGIN INSERT INTO shipment_audit (…) VALUES (OLD.shipment_id, OLD.status, NEW.status, datetime('now')); END; then the UPDATE.",
 why:"<code>CREATE TRIGGER trg_status_audit AFTER UPDATE OF status ON shipments FOR EACH ROW WHEN OLD.status &lt;&gt; NEW.status BEGIN INSERT INTO shipment_audit (shipment_id, old_status, new_status, changed_at) VALUES (OLD.shipment_id, OLD.status, NEW.status, datetime('now')); END;</code> then <code>UPDATE shipments SET status = 'Delivered' WHERE status = 'In transit' AND origin_hub = 'H03';</code> One UPDATE statement, 10 rows changed, 10 audit rows: the trigger fired once per row. In MySQL the WHEN test moves into the body as IF OLD.status &lt;&gt; NEW.status THEN … END IF, inside DELIMITER $$ … $$."},
{t:"sql",db:PR,q:"Keep shipments in step with the tracking feed: create an AFTER INSERT trigger on shipment_events that, when the new event's type is 'Delivered', sets that shipment's status to 'Delivered' and delivered_on to the date part of the event_time. Then insert the event: shipment 1120 delivered at hub H10 at '2026-06-29 14:05'. (The checker reads shipment 1120.)",
 answer:"CREATE TRIGGER trg_delivered AFTER INSERT ON shipment_events FOR EACH ROW WHEN NEW.event_type = 'Delivered' BEGIN UPDATE shipments SET status = 'Delivered', delivered_on = date(NEW.event_time) WHERE shipment_id = NEW.shipment_id; END; INSERT INTO shipment_events (shipment_id, hub_code, event_time, event_type) VALUES (1120, 'H10', '2026-06-29 14:05', 'Delivered');",
 check:"SELECT shipment_id, status, delivered_on FROM shipments WHERE shipment_id = 1120",rows:8,
 hint:"AFTER INSERT ON shipment_events … WHEN NEW.event_type = 'Delivered' BEGIN UPDATE shipments SET … WHERE shipment_id = NEW.shipment_id; END; then the INSERT. date('2026-06-29 14:05') gives '2026-06-29'.",
 why:"<code>CREATE TRIGGER trg_delivered AFTER INSERT ON shipment_events FOR EACH ROW WHEN NEW.event_type = 'Delivered' BEGIN UPDATE shipments SET status = 'Delivered', delivered_on = date(NEW.event_time) WHERE shipment_id = NEW.shipment_id; END;</code> then the INSERT. Shipment 1120 becomes Delivered on 2026-06-29. <code>substr(NEW.event_time, 1, 10)</code> works as well as <code>date()</code>; in MySQL, <code>DATE(NEW.event_time)</code>."},
{t:"sql",db:PR,q:"Let the ledger move the money: create an AFTER INSERT trigger on wallet_txns that subtracts NEW.amount from the sending wallet and adds it to the receiving wallet. Then record a transfer of ₹1,500 from wallet 2 to wallet 8 (txn_time '2026-07-01 11:00', note 'fuel advance').",
 answer:"CREATE TRIGGER trg_ledger AFTER INSERT ON wallet_txns FOR EACH ROW BEGIN UPDATE wallets SET balance = balance - NEW.amount WHERE wallet_id = NEW.from_wallet; UPDATE wallets SET balance = balance + NEW.amount WHERE wallet_id = NEW.to_wallet; END; INSERT INTO wallet_txns (from_wallet, to_wallet, amount, txn_time, note) VALUES (2, 8, 1500, '2026-07-01 11:00', 'fuel advance');",
 check:"SELECT wallet_id, balance FROM wallets ORDER BY wallet_id",rows:8,
 hint:"A trigger body may hold several statements, each ending with a semicolon, between BEGIN and END.",
 why:"<code>CREATE TRIGGER trg_ledger AFTER INSERT ON wallet_txns FOR EACH ROW BEGIN UPDATE wallets SET balance = balance - NEW.amount WHERE wallet_id = NEW.from_wallet; UPDATE wallets SET balance = balance + NEW.amount WHERE wallet_id = NEW.to_wallet; END;</code> Wallet 2 ends at 178,500 and wallet 8 at 5,500. The trigger runs inside the INSERT's own transaction: if the debit broke the CHECK (balance &gt;= 0), the whole INSERT, ledger row included, would be undone. Atomicity for free."},
{t:"sql",db:PR,setup:"CREATE TRIGGER trg_status_audit AFTER UPDATE OF status ON shipments BEGIN INSERT INTO shipment_audit (shipment_id, old_status, new_status, changed_at) VALUES (OLD.shipment_id, OLD.status, NEW.status, datetime('now')); END; CREATE TRIGGER trg_weight_guard BEFORE INSERT ON shipments WHEN NEW.weight_kg > 2500 BEGIN SELECT RAISE(ABORT, 'Too heavy'); END;",
 q:"Two triggers have been created for you. List every trigger in the database: its name and the table it belongs to (tbl_name). This is SQLite's answer to MySQL's SHOW TRIGGERS.",answer:"SELECT name, tbl_name FROM sqlite_master WHERE type = 'trigger'",
 hint:"sqlite_master again, with type = 'trigger'.",why:"<code>SELECT name, tbl_name FROM sqlite_master WHERE type = 'trigger';</code> The sql column of sqlite_master holds each trigger's full CREATE statement too. Triggers are invisible in day-to-day queries, so check this list whenever data changes \"by itself\"."},
{t:"mcq",q:"Inside a trigger that fires on DELETE, which row values can the body use?",opts:["Only OLD: the row being deleted","Only NEW","Both OLD and NEW","Neither: DELETE triggers cannot read the row"],a:0,
 hint:"After a delete there is no new row.",why:"INSERT triggers see NEW, DELETE triggers see OLD, UPDATE triggers see both. A typical DELETE trigger copies OLD into an archive table before the row disappears."},
{t:"mcq",q:"Why does a MySQL script write <code>DELIMITER $$</code> before CREATE TRIGGER?",opts:["So the client sends the whole trigger, with its inner semicolons, to the server as one statement","Because MySQL triggers must be written in a different language","To make the trigger fire once per statement instead of once per row","It is required in SQLite too"],a:0,
 hint:"Who splits a script into statements at each semicolon?",why:"The mysql client normally ends a statement at every semicolon, which would cut the trigger body in half. DELIMITER $$ changes the client's end marker; the server never sees the word. SQLite's parser understands BEGIN … END directly."},
{t:"mcq",q:"A BEFORE INSERT trigger on shipments runs <code>SELECT RAISE(ABORT, 'Too heavy')</code> when NEW.weight_kg &gt; 2500. Someone inserts a 3,000 kg shipment. What happens?",opts:["The INSERT fails with the message 'Too heavy' and no row is added","The row is added and a warning is logged","The row is added with weight 2,500","The trigger is dropped"],a:0,
 hint:"ABORT undoes the statement that fired the trigger.",why:"RAISE(ABORT, …) stops the triggering statement, undoes its changes and returns the message as an error; an open transaction stays open. MySQL does the same with SIGNAL SQLSTATE '45000'. Try it in the lab."}
]});

L.push({id:"l7",badge:"Routine Keeper",code:"File 7",title:"Stored routines, variables and permissions",topics:"Stored procedures (IN, OUT parameters, CALL) · stored functions (RETURNS, DETERMINISTIC) · local, user-defined and system variables · DCL: CREATE USER, GRANT, REVOKE, roles · views and least privilege",
story:`<b>Twelve hubs, twelve copies of the same query.</b> Every hub manager keeps a private copy of the weekly hub report, each slightly different, and three of them have the database password in a spreadsheet. The IT head wants one shared report that everyone calls by name, and accounts that can read only what each person needs.`,
brief:`<p>Server databases such as MySQL can store named programs. A <span class="term">stored procedure</span> is a named block of SQL with parameters, run with CALL; an <span class="term">OUT</span> parameter hands a value back. A <span class="term">stored function</span> returns one value and can be used inside a query like a built-in function.</p>
<div class="formula">DELIMITER $$
CREATE PROCEDURE hub_report(IN p_hub CHAR(3), OUT p_shipments INT)
BEGIN
  DECLARE v_weight DECIMAL(12,1);                    -- local variable
  SELECT COUNT(*), ROUND(SUM(weight_kg), 1) INTO p_shipments, v_weight
  FROM shipments WHERE origin_hub = p_hub;
  SELECT p_hub AS hub, p_shipments AS shipments, v_weight AS total_kg;
END $$
DELIMITER ;
CALL hub_report('H03', @n);   SELECT @n;           -- @n: user-defined session variable

CREATE FUNCTION shipping_charge(w DECIMAL(8,1)) RETURNS DECIMAL(10,2) DETERMINISTIC
RETURN ROUND(40 + 9.5 * w, 2);
SELECT shipment_id, shipping_charge(weight_kg) FROM shipments;</div>
<p>MySQL has three kinds of variable: <span class="term">local</span> variables (DECLARE, inside BEGIN … END only), <span class="term">user-defined</span> variables (<code>@name</code>, alive for your session) and <span class="term">system</span> variables (<code>@@autocommit</code>, set per session or globally with SET GLOBAL).</p>
<p>DCL (Data Control Language) controls who may do what. The rule is <span class="term">least privilege</span>: every account gets the smallest set of rights its job needs, so a leaked password or a buggy program can do limited harm.</p>
<div class="formula">CREATE USER 'hub_analyst'@'%' IDENTIFIED BY 'a-long-passphrase';
GRANT SELECT ON prayaan.shipments TO 'hub_analyst'@'%';
GRANT EXECUTE ON PROCEDURE prayaan.hub_report TO 'hub_analyst'@'%';
REVOKE SELECT ON prayaan.shipments FROM 'hub_analyst'@'%';
SHOW GRANTS FOR 'hub_analyst'@'%';
CREATE ROLE 'dispatch';  GRANT SELECT, INSERT ON prayaan.shipment_events TO 'dispatch';</div>
<p>A view (module 4) is the classic partner of GRANT: grant SELECT on a view that leaves out phone numbers or password hashes, never on the base table.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>None of this file's MySQL statements can run here. SQLite is an embedded, single-user library: it has no stored procedures or functions (programs call it from their own language, and can register their own functions there), no DECLARE or @variables, no user accounts and no GRANT or REVOKE; access is controlled by who can read the database file. The lab walks through the procedure step by step and runs its query part in SQLite; the challenges ask you to write the query a routine would contain, and to build the view a grant would point at.</span></div>`,
refs:"MySQL 8.0 Reference Manual: \"Stored Objects\" (\"Using Stored Routines\"), \"CREATE PROCEDURE and CREATE FUNCTION Statements\", \"CALL Statement\", \"User-Defined Variables\", \"Local Variable DECLARE Statement\", \"Using System Variables\", \"Account Management Statements\" (\"CREATE USER\", \"GRANT\", \"REVOKE\", \"CREATE ROLE\") · SQLite documentation: \"Appropriate Uses For SQLite\" (whentouse.html) · Laudon &amp; Laudon, <i>Management Information Systems</i> (17th ed., 2022), ch. 6 · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020).",
lab:root=>{labProcedure(root);labGrants(root);},
qs:[
{t:"sql",db:PR,q:"Write the query inside <code>hub_report('H03')</code>: for shipments whose origin_hub is H03, return the number of shipments and the total weight rounded to 1 decimal.",answer:"SELECT COUNT(*) AS shipments, ROUND(SUM(weight_kg), 1) AS total_kg FROM shipments WHERE origin_hub = 'H03'",
 hint:"COUNT(*) and ROUND(SUM(weight_kg), 1) with WHERE origin_hub = 'H03'.",why:"<code>SELECT COUNT(*) AS shipments, ROUND(SUM(weight_kg), 1) AS total_kg FROM shipments WHERE origin_hub = 'H03';</code> In MySQL this query sits inside the procedure with <code>INTO p_shipments, v_weight</code>, and <code>CALL hub_report('H03', @n)</code> runs it for any hub without anyone retyping it."},
{t:"sql",db:PR,q:"SQLite has no CREATE FUNCTION, so write the expression inline. The charge is 40 + 9.5 × weight_kg, rounded to 2 decimals. Return shipment_id, weight_kg and charge for the 5 heaviest shipments, heaviest first (then by shipment_id).",answer:"SELECT shipment_id, weight_kg, ROUND(40 + 9.5 * weight_kg, 2) AS charge FROM shipments ORDER BY weight_kg DESC, shipment_id LIMIT 5",ordered:true,
 hint:"ROUND(40 + 9.5 * weight_kg, 2); ORDER BY weight_kg DESC, shipment_id LIMIT 5.",why:"<code>SELECT shipment_id, weight_kg, ROUND(40 + 9.5 * weight_kg, 2) AS charge FROM shipments ORDER BY weight_kg DESC, shipment_id LIMIT 5;</code> In MySQL the stored function shipping_charge(weight_kg) keeps the formula in one place; declaring it DETERMINISTIC tells MySQL that the same input always gives the same output."},
{t:"sql",db:PR,q:"Least privilege, SQLite style: create a view <code>driver_directory</code> with driver_id, driver_name and hub_code only (no phone, no licence number). A grant would point at this view, never at the table. (The checker reads the view.)",answer:"CREATE VIEW driver_directory AS SELECT driver_id, driver_name, hub_code FROM drivers",
 check:"SELECT * FROM driver_directory ORDER BY driver_id",
 hint:"CREATE VIEW driver_directory AS SELECT … FROM drivers;",why:"<code>CREATE VIEW driver_directory AS SELECT driver_id, driver_name, hub_code FROM drivers;</code> In MySQL you would then run <code>GRANT SELECT ON prayaan.driver_directory TO 'hub_analyst'@'%';</code> and grant nothing on drivers itself: the analyst can see who works where but never a phone number."},
{t:"sql",db:PR,q:"Interview classic: rank the hubs as a procedure would report them. Return origin_hub, the number of shipments and the rank by that number (1 = busiest, ties share a rank, as RANK() does), busiest first, then by origin_hub.",answer:"SELECT origin_hub, COUNT(*) AS shipments, RANK() OVER (ORDER BY COUNT(*) DESC) AS hub_rank FROM shipments GROUP BY origin_hub ORDER BY shipments DESC, origin_hub",ordered:true,
 hint:"GROUP BY origin_hub; RANK() OVER (ORDER BY COUNT(*) DESC).",why:"<code>SELECT origin_hub, COUNT(*) AS shipments, RANK() OVER (ORDER BY COUNT(*) DESC) AS hub_rank FROM shipments GROUP BY origin_hub ORDER BY shipments DESC, origin_hub;</code> Window functions (module 5) run after GROUP BY, so they can rank the groups. A stored procedure would wrap exactly this query; the logic is the same."},
{t:"mcq",q:"In MySQL, which statement lets the account hub_analyst read the shipments table and nothing else?",opts:["GRANT SELECT ON prayaan.shipments TO 'hub_analyst'@'%';","GRANT ALL ON prayaan.* TO 'hub_analyst'@'%';","REVOKE SELECT ON prayaan.shipments TO 'hub_analyst'@'%';","CREATE USER 'hub_analyst'@'%' WITH SELECT ON shipments;"],a:0,
 hint:"GRANT privilege ON database.table TO account.",why:"GRANT SELECT ON one table is least privilege. GRANT ALL ON prayaan.* gives every right on every table. REVOKE takes rights away and uses FROM, not TO. CREATE USER creates the account but grants nothing."},
{t:"mcq",q:"In MySQL, what is the difference between <code>@total</code> and a variable declared with <code>DECLARE v_total INT</code>?",opts:["@total is a user-defined session variable that lives until you disconnect; v_total is local to the BEGIN … END block where it is declared","They are the same thing written two ways","@total is a system variable shared by all users","DECLARE variables survive between sessions"],a:0,
 hint:"Where can each be used, and for how long?",why:"User-defined @variables need no declaration and last for the session, which is how an OUT parameter's value is collected: <code>CALL hub_report('H03', @n); SELECT @n;</code>. DECLARE creates a local variable inside a stored program only. System variables are written @@name."},
{t:"mcq",q:"You run <code>CALL hub_report('H03', @n);</code> in MySQL. What does <code>@n</code> hold afterwards?",opts:["The value the procedure assigned to its OUT parameter p_shipments","The text 'H03'","NULL: OUT parameters cannot be read","The number of rows in the procedure's last SELECT, always"],a:0,
 hint:"IN brings values in; OUT hands them back.",why:"The procedure's SELECT … INTO p_shipments sets the OUT parameter, and MySQL copies it into @n when the call ends. In SQLite there is no CALL: the calling program runs the query and reads the result directly."}
]});

L.push({id:"l8",badge:"Injection Proof",code:"File 8",title:"SQL injection and safe queries",topics:"How string concatenation breaks a query · classic payloads · prepared statements and parameter binding · escaping quotes in literals · identifiers cannot be bound · least privilege as a second wall",
story:`<b>The login log.</b> Prayaan's internal tracking portal logs every login attempt. Scrolling through June, you find typed usernames that are not names at all: <code>admin' --</code>, <code>' OR '1'='1</code>, and one that ends in <code>DROP TABLE shipments</code>. None of them got in, this time. The portal's code builds its SQL by gluing text together, and you are asked to explain, with evidence, why that has to stop.`,
brief:`<p><span class="term">SQL injection</span> happens when a program builds a SQL (Structured Query Language) statement by pasting user input into the text. The input can then change the statement's structure instead of being treated as data:</p>
<div class="formula">sql = "SELECT user_id, role FROM app_users WHERE username = '" + typed + "'"

typed = ops.meera          → … WHERE username = 'ops.meera'            (intended)
typed = ' OR '1'='1        → … WHERE username = '' OR '1'='1'          (every row)
typed = admin' --          → … WHERE username = 'admin' --'            (rest commented out)</div>
<p>The quote in the input closes the string literal early; what follows is read as SQL. The cure is a <span class="term">prepared statement</span> with <span class="term">parameter binding</span>: the SQL text is fixed and contains a placeholder, and the value is sent separately, so it is always data, never code.</p>
<div class="formula">SQL text (fixed):   SELECT user_id, role FROM app_users WHERE username = ?
value (bound):      ' OR '1'='1      → compared as one string; matches no user

MySQL, server side: PREPARE q FROM 'SELECT user_id, role FROM app_users WHERE username = ?';
                    SET @u = 'ops.meera';  EXECUTE q USING @u;  DEALLOCATE PREPARE q;</div>
<p>Three more rules. <b>Escaping is not a strategy</b>: doubling quotes by hand (<code>'O''Brien'</code> is how you write a quote inside a literal) is easy to get wrong, and binding makes it unnecessary. <b>Identifiers cannot be bound</b>: a placeholder stands for a value, not a table or column name, so if a user picks a sort column, map their choice to a fixed list of allowed names. <b>Least privilege</b> is the second wall: the portal's database account should be able to read app_users and write login_log, and nothing else, so that even a successful injection cannot drop a table.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>Both engines support placeholders: <code>?</code> in MySQL, and <code>?</code>, <code>?1</code>, <code>:name</code> or <code>@name</code> in SQLite; in practice the program's database driver does the binding. This game's console runs whatever you type on your own copy of the data, so it is not the place for binding; the lab shows the difference on a throwaway login table. Many MySQL client libraries refuse several statements in one call unless told otherwise, which blocks the "; DROP TABLE" style of attack, but that is a side effect, not a defence.</span></div>`,

/* a step-by-step animation controller: Play / Step / speed / Reset */
function e7Stepper(root,o){
  const bar=e7row(root,"btnrow e7-steps");const play=e7btn(bar,"Play ▸");const step=e7btn(bar,"Step",true);const sp=el("span");bar.appendChild(sp);const rs=e7btn(bar,"Reset",true);
  let i=-1,run=null,speed=1,acc=0,last=0,busy=false;const n=()=>o.count();
  function stop(){if(run){run.stop();run=null;}play.textContent="Play ▸";}
  async function go(k){if(busy)return;busy=true;try{while(i<k&&i<n()-1){i++;await o.show(i);}}catch(e){if(o.fail)o.fail(e);}finally{busy=false;}if(i>=n()-1){stop();if(o.onEnd)o.onEnd();}}
  async function reset(){stop();i=-1;if(o.reset)await o.reset();}
  play.addEventListener("click",async()=>{if(run){stop();return;}if(i>=n()-1)await reset();if(REDUCED){go(n()-1);return;}
    play.textContent="Pause";last=0;acc=o.ms||900;run=loop(()=>{const t=performance.now();if(!last)last=t;acc+=(t-last)*speed;last=t;if(acc>=(o.ms||900)&&!busy){acc=0;go(i+1);}});});
  step.addEventListener("click",()=>{stop();go(i+1);});
  speedSeg(sp,v=>{speed=v;},[1,2,4]);
  rs.addEventListener("click",()=>reset());
  return {reset,go,stop,get i(){return i;}};
}
/* display-only SQL tokenizer (never executes anything) */
const E7KW=new Set("SELECT FROM WHERE AND OR NOT IN IS NULL LIKE GROUP BY ORDER HAVING LIMIT JOIN LEFT ON AS COUNT SUM UNION ALL INSERT INTO VALUES UPDATE SET DELETE DROP TABLE CREATE INDEX BEGIN COMMIT ROLLBACK EXISTS DISTINCT DESC ASC SELEC".split(" "));
function e7tokens(s){const re=/\s+|--[^\n]*|#[^\n]*|'(?:[^']|'')*'?|"[^"]*"?|[A-Za-z_][A-Za-z0-9_.@]*|\d+(?:\.\d+)?|<>|<=|>=|!=|\|\||[(),;*=<>+\-\/%]|[\s\S]/g;const out=[];let m;
  while((m=re.exec(s))){const t=m[0];let k="punct";if(/^\s+$/.test(t))k="space";else if(/^(--|#)/.test(t))k="comment";else if(t[0]==="'")k="string";else if(/^\d/.test(t))k="number";else if(/^[A-Za-z_]/.test(t))k=E7KW.has(t.toUpperCase())?"kw":"ident";out.push({t,k,a:m.index,b:m.index+t.length});}return out;}
function e7chips(box,toks,hl){box.textContent="";toks.forEach(tk=>{if(tk.k==="space"){box.appendChild(document.createTextNode(" "));return;}const s=el("span",{class:"e7tok e7-"+tk.k+(hl&&hl(tk)?" e7-user":"")});s.textContent=tk.t;box.appendChild(s);});}

/* ---------- hero: one query through the engine ---------- */
function heroTower(root){
  root.classList.add("flow");
  root.innerHTML=`<div class="flowbar"><span class="eyebrow">Live: a query through parser, planner and executor</span><div class="ctrls">
      <button class="btn small" data-play type="button">${REDUCED?"Play":"Pause"}</button>
      <div class="seg" role="group" aria-label="Speed"><button type="button" data-sp="1" aria-pressed="true">1×</button><button type="button" data-sp="3" aria-pressed="false">3×</button><button type="button" data-sp="9" aria-pressed="false">9×</button></div>
      <button class="btn ghost small" data-reset type="button">Reset</button></div></div>
    <canvas aria-label="Animated query passing through parser, planner and executor; the executor either scans every row or descends a B-tree index"></canvas>
    <div class="flowstats"><div><span>Query</span><b data-q>1 of 3</b></div><div><span>Plan</span><b data-p>—</b></div><div><span>Rows or pages read</span><b data-r>0</b></div><div><span>Rows returned</span><b data-o>—</b></div></div>`;
  const W=720,H=270,c=root.querySelector("canvas"),g=canvasSetup(c,W,H);
  const Q=[{sql:"SELECT * FROM shipments WHERE shipment_id = 1042;",plan:"SEARCH shipments USING INTEGER PRIMARY KEY (rowid=?)",mode:"search",table:"shipments",n:N_SHIP,out:1,levels:3,tag:"primary key"},
           {sql:"SELECT * FROM shipment_events WHERE shipment_id = 1042;",plan:"SCAN shipment_events",mode:"scan",table:"shipment_events",n:N_EVENTS,out:8,tag:"no index"},
           {sql:"SELECT * FROM shipment_events WHERE shipment_id = 1042;",plan:"SEARCH shipment_events USING INDEX idx_events_shipment (shipment_id=?)",mode:"search",table:"shipment_events",n:N_EVENTS,out:8,levels:3,tag:"after CREATE INDEX (File 1)"}];
  // the first two plans are asked from SQLite itself; the third is what File 1's index produces
  (async()=>{try{for(const k of [0,1]){const s=await e7q(PR,"EXPLAIN QUERY PLAN "+Q[k].sql);if(s&&s.values.length)Q[k].plan=String(s.values[0][3]);}}catch(e){}})();
  let qi=0,t=0,speed=1,playing=!REDUCED,run=null;
  const ST=[["PARSER",95],["PLANNER",290],["EXECUTOR",485]];
  const col=()=>({ink:cssVar("--ink"),muted:cssVar("--muted"),line:cssVar("--line"),sunk:cssVar("--sunk"),acc:cssVar("--accent"),accs:cssVar("--accent-soft"),fraud:cssVar("--fraud"),gold:cssVar("--gold"),ok:cssVar("--ok"),surf:cssVar("--surface")});
  const CELLS=180;
  function draw(){const C=col(),q=Q[qi];g.clearRect(0,0,W,H);g.fillStyle=C.sunk;g.fillRect(0,0,W,H);
    g.font="12px IBM Plex Mono, monospace";g.fillStyle=C.ink;g.fillText(q.sql,14,22);g.fillStyle=C.muted;g.font="11px IBM Plex Mono, monospace";g.fillText("("+q.tag+")",14,38);
    const stage=t<60?0:t<120?1:2;
    ST.forEach(([nm,x],k)=>{g.fillStyle=k===stage?C.accs:C.surf;g.strokeStyle=k===stage?C.acc:C.line;g.lineWidth=k===stage?2:1;g.fillRect(x,52,140,40);g.strokeRect(x,52,140,40);g.lineWidth=1;
      g.fillStyle=C.ink;g.font="600 12px IBM Plex Mono, monospace";g.fillText(nm,x+12,77);if(k<2){g.strokeStyle=C.muted;g.beginPath();g.moveTo(x+142,72);g.lineTo(x+192,72);g.stroke();g.beginPath();g.moveTo(x+192,72);g.lineTo(x+186,68);g.lineTo(x+186,76);g.closePath();g.fillStyle=C.muted;g.fill();}});
    // packet
    const px=t<60?95+70*(t/60):t<120?95+70+195*((t-60)/60):485+70;g.fillStyle=C.gold;g.beginPath();g.arc(Math.min(px,555),72,6,0,7);g.fill();
    g.font="11px IBM Plex Mono, monospace";g.fillStyle=C.ink;
    if(stage>=0){g.fillText(t<60?"checking grammar and names…":"grammar ok · tables and columns found",14,116);}
    if(stage>=1){g.fillStyle=C.muted;g.fillText("plan:",14,136);g.fillStyle=q.mode==="scan"?C.fraud:C.ok;g.font="600 11px IBM Plex Mono, monospace";g.fillText(q.plan.length>80?q.plan.slice(0,79)+"…":q.plan,60,136);g.font="11px IBM Plex Mono, monospace";}
    // table strip
    const sx=14,sw=W-28,sy=226,cw=sw/CELLS;g.fillStyle=C.muted;g.fillText(q.table+": "+ind(q.n)+" rows, drawn as "+CELLS+" blocks",sx,sy-8);
    let read=0,done=false;
    if(stage===2){const e=t-120;
      if(q.mode==="scan"){const f=Math.min(1,e/200);read=Math.round(f*q.n);done=f>=1;
        for(let k=0;k<CELLS;k++){g.fillStyle=k<f*CELLS?C.fraud:C.line;g.fillRect(sx+k*cw,sy,Math.max(1,cw-1),22);}
        g.strokeStyle=C.ink;g.beginPath();g.moveTo(sx+f*sw,sy-4);g.lineTo(sx+f*sw,sy+26);g.stroke();}
      else{const lv=Math.min(q.levels+1,Math.floor(e/25));read=Math.min(lv,q.levels)+(lv>q.levels?q.out:0);done=lv>q.levels;
        for(let k=0;k<CELLS;k++){g.fillStyle=C.line;g.fillRect(sx+k*cw,sy,Math.max(1,cw-1),22);}
        const tx=W/2,target=sx+sw*0.31;const ys=[156,178,200];
        for(let k=0;k<q.levels;k++){const x=tx+(target-tx)*(k/(q.levels-1||1));g.fillStyle=k<lv?C.ok:C.surf;g.strokeStyle=C.ok;g.fillRect(x-22,ys[k]-9,44,14);g.strokeRect(x-22,ys[k]-9,44,14);
          if(k>0){g.strokeStyle=C.muted;g.beginPath();const x0=tx+(target-tx)*((k-1)/(q.levels-1||1));g.moveTo(x0,ys[k-1]+5);g.lineTo(x,ys[k]-9);g.stroke();}}
        g.fillStyle=C.muted;g.fillText("B-tree: root → inner page → leaf",tx+30,160);
        if(lv>q.levels){g.fillStyle=C.ok;const spots=q.out===1?[0.31]:[0.40,0.41,0.42,0.43,0.45,0.46,0.47,0.47];spots.forEach(p=>g.fillRect(sx+Math.floor(p*CELLS)*cw,sy,Math.max(2,cw-1),22));}}
    }
    g.fillStyle=C.ink;g.font="600 12px IBM Plex Mono, monospace";if(stage===2)g.fillText((q.mode==="scan"?"rows read: ":"pages + rows read: ")+ind(read),sx,H-10);
    root.querySelector("[data-q]").textContent=(qi+1)+" of 3";root.querySelector("[data-p]").textContent=stage>=1?(q.mode==="scan"?"SCAN":"SEARCH"):"—";root.querySelector("[data-r]").textContent=ind(read);root.querySelector("[data-o]").textContent=done?ind(q.out):"—";
    return done;}
  let hold=0;
  function step(){for(let k=0;k<speed;k++){const done=draw();t++;if(done){hold++;if(hold>90){hold=0;t=0;qi=(qi+1)%Q.length;}}}draw();}
  function play(v){playing=v;root.querySelector("[data-play]").textContent=v?"Pause":"Play";if(v&&!run)run=loop(step);if(!v&&run){run.stop();run=null;}}
  root.querySelector("[data-play]").addEventListener("click",()=>{if(REDUCED){t=400;draw();return;}play(!playing);});
  root.querySelector("[data-reset]").addEventListener("click",()=>{qi=0;t=0;hold=0;draw();});
  root.querySelectorAll("[data-sp]").forEach(b=>b.addEventListener("click",()=>{speed=+b.dataset.sp;root.querySelectorAll("[data-sp]").forEach(x=>x.setAttribute("aria-pressed",x===b));}));
  if(REDUCED){t=400;draw();}else{draw();run=loop(step);}
}
