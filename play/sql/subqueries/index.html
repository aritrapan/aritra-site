<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Karya Audit Cell</title>
<meta name="description" content="Scalar, row and table subqueries, correlated subqueries, EXISTS, the NOT IN NULL trap, CTEs, recursive org charts, views.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case desk. Sticky status strip (rank, XP, streak); a live transaction-flow
   simulation as the hero; case files as a grid; an opened file is a single-column dossier:
   story, theory, lab, challenges. */
:root{
  --bg:#EAEFF4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#13233A; --muted:#566880; --line:#C9D3DF;
  --accent:#1F5FA8; --accent-soft:#DCE7F5; --gold:#A86E06; --gold-soft:#F6E7C8;
  --fraud:#B3263E; --fraud-soft:#F7DCE1; --ok:#1B7349; --ok-soft:#D7EFE2;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.strip .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .rank{font:700 1.05rem/1.1 var(--display)}
.xpbox{flex:1 1 220px;display:flex;flex-direction:column;gap:5px;min-width:0}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
.xpmeta{display:flex;justify-content:space-between;font:400 .8rem/1 var(--mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 11px;font:600 .82rem/1.2 var(--mono);white-space:nowrap}
a.chip{text-decoration:none;color:var(--accent)}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}

/* hero */
.hero{display:grid;gap:18px;padding-block:30px 10px}
.hero p.lede{font-size:1.08rem;max-width:62ch;margin-top:12px}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:8px;max-width:62ch}
.herotop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:720px){.herotop{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:.92rem}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ticket .row:last-child{border-bottom:0;padding-bottom:0}
.ticket .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flow simulation */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0}
.flow canvas{width:100%;height:auto;display:block;max-width:100%;border-radius:6px}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.flowbar .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.flowstats div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:1px}
.flowstats span{font-size:.72rem;color:var(--muted)}
.flowstats b{font:600 1.05rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font:600 .8rem/1.2 var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:transform .15s,border-color .15s}
.case:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.55}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .tag{font:600 .72rem/1 var(--mono);letter-spacing:.1em;color:var(--accent)}
.case h3{font-size:1.25rem}
.case .nick{font-size:.9rem;color:var(--muted)}
.case .topics{font-size:.85rem;color:var(--muted);margin-top:auto}
.stars{font-size:1rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.stamp{font:700 .7rem/1 var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok)} .stamp.lock{color:var(--muted)} .stamp.open{color:var(--accent)}
.case.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case.boss .tag,.case.boss .nick,.case.boss .topics{color:var(--bg);opacity:.8}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.badge b{font:600 .95rem/1.2 var(--display);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.badge.got b{color:var(--ink)}
.badge .seal{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}

/* dossier */
.dossier{display:grid;gap:22px;padding-block:24px}
.back{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);display:grid;gap:14px;min-width:0}
.panel>h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .eyebrow{color:var(--accent)}
.brief{display:grid;gap:12px;max-width:70ch}
.brief .term{font-weight:600}
.story{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;max-width:70ch}
.story b{font-style:normal}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.92rem;white-space:pre;line-height:1.5}
.refs{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* labs */
.labgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.labgrid{grid-template-columns:1fr}}
svg text{fill:var(--ink);font-family:var(--mono)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
.ctrl{display:grid;gap:6px}
.ctrl label{font-size:.88rem;color:var(--muted)}
.ctrl output{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.readout span{font-size:.76rem;color:var(--muted)}
.readout b{font:600 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.up{color:var(--fraud);font-weight:600}.down{color:var(--ok);font-weight:600}
.target{font:700 1.6rem/1.1 var(--mono);color:var(--accent)}
.regbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-size:.86rem}
.regbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.door{width:30%;aspect-ratio:3/4;max-width:120px;border:2px solid var(--line);background:var(--sunk);border-radius:8px 8px 2px 2px;
  font:700 1.4rem/1 var(--display);display:grid;place-items:center}
.door.pick{border-color:var(--accent);background:var(--accent-soft)}
.door.open{background:var(--bg);color:var(--muted);border-style:dashed}
.door.prize{border-color:var(--gold);background:var(--gold-soft)}
.doors{display:flex;gap:10px;justify-content:flex-start}
.mixbar{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.85rem}
.mixtrack{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mixtrack i{display:block;height:100%;transition:width .8s ease;font:600 .72rem/30px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
.mixtrack i.u{background:var(--accent-soft)}.mixtrack i.c{background:var(--line)}.mixtrack i.n{background:var(--fraud);color:var(--surface)}

/* challenges */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.q:first-of-type{border-top:0;padding-top:0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .eyebrow{white-space:nowrap}
.qtext{font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fraud);background:var(--fraud-soft)}
.opt[disabled]{cursor:default}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:12em}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--fraud-soft);border:1px solid var(--fraud)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b{font-family:var(--display);font-size:1rem}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;max-width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.toast b{color:var(--gold-soft)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sheet .formula{font-size:.84rem}
.sheet h3{font-size:1rem;margin-bottom:6px}
.sandbox{border:1px dashed var(--accent);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;background:var(--sunk);min-width:0;margin-top:14px}
.sb-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sb-head .eyebrow{color:var(--accent)}
.sb-tabs button{border:0;background:transparent;padding:5px 12px;font:600 .8rem/1.2 var(--mono)}
.sb-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sb-pane{display:grid;gap:10px;min-width:0}
.sb-params{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.sb-params label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sb-params input,.sb-params select{width:9.5em;max-width:100%}
.sandbox textarea{width:100%;max-width:100%;font:400 .88rem/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.sandbox input[type=file]{font-size:.82rem;max-width:100%}
.sqlx-console{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.sqlx-console{grid-template-columns:1fr}}
.sqlx-main{display:grid;gap:8px;min-width:0}
.sqlx-editor{width:100%;max-width:100%;font:400 .92rem/1.5 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
.sqlx-editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.sqlx-out{display:grid;gap:8px;min-width:0}
.sqlx-grid{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sqlx-grid table{font:400 .84rem/1.35 var(--mono)}
.sqlx-grid th{position:sticky;top:0;background:var(--sunk);text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink)}
.sqlx-grid td,.sqlx-grid th{white-space:nowrap;text-align:left}
.sqlx-grid td.num{text-align:right}
.sqlx-null{color:var(--muted);font-style:italic}
.sqlx-schema{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}
.sqlx-table summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sqlx-table ul{margin:4px 0 6px;padding-left:12px;list-style:none;display:grid;gap:2px}
.sqlx-col{all:unset;cursor:pointer;font:600 .8rem/1.3 var(--mono);color:var(--accent)}
.sqlx-col:focus-visible{outline:2px solid var(--accent)}
.sqlx-ch{display:grid;gap:8px;min-width:0}
.mysqlnote{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.mysqlnote b{font:600 .72rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
code,.code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sqlparts{white-space:pre-wrap}.sqlparts .sqlnow{background:var(--gold-soft);outline:1px solid var(--gold);border-radius:3px}.sqlparts .sqldone{background:var(--ok-soft);border-radius:3px}.sqlparts .sqlval{color:var(--gold);font-weight:600}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.cmpcol{display:grid;gap:8px;align-content:start;min-width:0}
.steplist{margin:0;padding-left:22px;display:grid;gap:3px;font-size:.92rem}.steplist li.done{color:var(--muted)}.steplist li.next{font-weight:600;color:var(--accent)}
.svgbox>svg{min-width:540px}.sb-params label{min-width:0;max-width:100%}.sb-params select{width:auto;max-width:100%}
details>summary{cursor:pointer;font-size:.92rem;color:var(--accent)}details .formula{margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip" id="strip">
    <div class="who"><span class="eyebrow">Analyst rank</span><span class="rank" id="rank">Trainee Analyst</span></div>
    <div class="xpbox"><div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
      <div class="xpmeta"><span id="xptext">0 XP</span><span id="xpnext"></span></div></div>
    <span class="chip" id="streakchip" title="Correct first-try answers in a row">Streak <b id="streak">0</b></span>
    <span class="chip" title="Badges earned">Badges <b id="badgecount">0</b></span>
    <a class="chip" href="../" id="hublink">All modules</a>
  </div>
  <main id="app"></main>
  <div class="foot">
    <span>Karya Audit Cell · part of <a href="../">SQL, played</a>, a free course you play. Built by <a href="https://aritra.ai" target="_blank" rel="noopener">Aritra Pan</a>. Free to use in teaching.</span>
    <span>Module 4 · Queries inside queries</span>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>window.SQLX_LIB="../lib/";</script>
<script>
(function(){
"use strict";
/* ---------- sandbox toolkit (shared by every module) ----------
   Three levels of free play next to a lab:
     1. controls on the real data   2. generate your own data   3. bring your own data
   SAFETY: everything runs in the visitor's browser. Uploaded or pasted text is never sent anywhere,
   never stored, never put in the URL, and never inserted as HTML: it is only parsed into numbers and
   short labels, which are always displayed with textContent (SB.text / SB.table). Size caps keep phones responsive. */
const SB=(function(){
  const MAX_BYTES=2*1024*1024, MAX_ROWS=5000, MAX_COLS=50, MAX_LABEL=40;
  const used=()=>{try{award("explorer");}catch(e){}};
  /* safe text node helpers */
  function text(tag,str,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(str);return e;}
  /* control characters, bidirectional embedding/override/isolate controls (U+202A–202E, U+2066–2069, which could
     reorder the surrounding sentence on screen) and invisible U+200B, U+2060, U+FEFF are removed; ZWJ/ZWNJ stay (Indic scripts) */
  function cleanLabel(s){s=String(s==null?"":s).replace(/[\u0000-\u001f\u007f-\u009f\u200b\u202a-\u202e\u2060\u2066-\u2069\ufeff]/g,"").trim();return s.length>MAX_LABEL?s.slice(0,MAX_LABEL)+"…":s;}
  /* parse delimited text into {header:[...], rows:[[...]], note} — all values stay plain strings */
  function parse(str){

SQLX.addDB("karya",DB_KARYA);
/* ===== Module 4 · Subqueries, CTEs and views: Karya Audit Cell ===== */
/* Every number shown by a lab is read from the karya database with SQLX.exec when the lab opens.
   Display rule: anything that comes out of a query is written with textContent (SQLX.txt / SB.text /
   SQLX.grid / SVG text.textContent), never as HTML. */
const KDB="karya";
const CUR_PAY_SEL="SELECT de.emp_no, de.dept_no, s.salary\n  FROM dept_emp de\n  JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'\n  WHERE de.to_date = '9999-01-01'";
const CUR_PAY="CREATE TABLE cur_pay AS\n  "+CUR_PAY_SEL+";";
const CUR_PAY_VIEW="CREATE VIEW v_cur_pay AS\n  "+CUR_PAY_SEL+";";
const DEPT_SHORT={d001:"Marketing",d002:"Finance",d003:"HR",d004:"Operations",d005:"Engineering",d006:"Quality",d007:"Sales",d008:"Research",d009:"Cust. Service"};

/* ---------- small helpers ---------- */
async function qrows(sql,db){const r=await SQLX.exec(db||KDB,sql);const s=r.results.filter(x=>x.columns.length);return s.length?s[s.length-1].values:[];}
const money=v=>"₹"+ind(Math.round(+v));
function tx(parent,tag,str,cls){const e=SQLX.txt(tag,str,cls);parent.appendChild(e);return e;}
function svgText(parent,x,y,str,attrs){const t=sv("text",Object.assign({x,y,"font-size":11},attrs||{}));t.textContent=String(str);parent.appendChild(t);return t;}
function labNote(root,str){return tx(root,"p",str,"note");}
function failNote(root,e){root.textContent="";tx(root,"p","This lab reads the karya database, and the read failed ("+(e&&e.message||e)+"). If you dropped or changed a table in a console, press Reset database there and reopen this file.","note");}
function readout(parent,items){const d=el("div",{class:"readout"});const o={};items.forEach(([k,lab])=>{const w=el("div");w.appendChild(SB.text("span",lab));const b=el("b");b.textContent="—";w.appendChild(b);d.appendChild(w);o[k]=b;});parent.appendChild(d);return o;}
function btn(parent,label,ghost){const b=el("button",{class:"btn small"+(ghost?" ghost":""),type:"button"});b.textContent=label;parent.appendChild(b);return b;}
function row(parent,cls){const d=el("div",{class:cls||"sb-params"});parent.appendChild(d);return d;}
function field(parent,label,value,attrs){const lab=el("label");lab.appendChild(SB.text("span",label));const i=el("input",Object.assign({type:"number",step:"1",value:String(value)},attrs||{}));lab.appendChild(i);parent.appendChild(lab);return i;}
function pick(parent,label,opts,value){const lab=el("label");lab.appendChild(SB.text("span",label));const s=el("select");opts.forEach(([v,t])=>{const o=el("option",{value:v});o.textContent=t;s.appendChild(o);});if(value!=null)s.value=value;lab.appendChild(s);parent.appendChild(lab);return s;}
function getInt(i,def,lo,hi){let v=parseInt(i.value,10);if(!Number.isFinite(v))v=def;v=Math.min(hi,Math.max(lo,v));i.value=String(v);return v;}
function codeBlock(parent,str){const d=el("div",{class:"formula"});d.textContent=str;parent.appendChild(d);return d;}
/* SQL shown in parts, so a lab can highlight the part that is being evaluated */
function sqlParts(parent){const d=el("div",{class:"formula sqlparts"});parent.appendChild(d);
  return {set(parts){d.textContent="";parts.forEach(p=>{const s=document.createElement("span");s.textContent=p.t;if(p.cls)s.className=p.cls;d.appendChild(s);if(p.val!=null){const v=document.createElement("span");v.className="sqlval";v.textContent="  ⟶ "+p.val;d.appendChild(v);}});}};}
/* a console with starter buttons: each button loads one query into the editor and runs it */
function starterConsole(parent,db,starters,opts){
  const bar=row(parent,"btnrow");const host=el("div");parent.appendChild(host);
  const con=SQLX.console(host,Object.assign({db,starter:starters[0][1],rows:7},opts||{}));
  starters.forEach(([lab,sql])=>{const b=btn(bar,lab,true);b.addEventListener("click",()=>{con.set(sql);con.run();});});
  return con;
}

/* ---------- a step player: Play / Step / speed / Reset ---------- */
function Stepper(root,o){
  const bar=el("div",{class:"flowbar"});bar.appendChild(SQLX.txt("span",o.title||"","eyebrow"));
  const c=el("div",{class:"ctrls"});
  const play=el("button",{class:"btn small",type:"button"});play.textContent="Play";
  const step=el("button",{class:"btn ghost small",type:"button"});step.textContent="Step";
  const rs=el("button",{class:"btn ghost small",type:"button"});rs.textContent="Reset";
  let i=0,speed=1,run=null,acc=0,last=0;
  c.append(play,step);speedSeg(c,v=>{speed=v;},o.speeds||[1,2,4]);c.appendChild(rs);bar.appendChild(c);root.appendChild(bar);
  const n=()=>o.n();
  function show(){o.render(i);}
  function stop(){if(run){run.stop();run=null;}play.textContent=i>=n()-1?"Replay":"Play";}
  function adv(){if(i>=n()-1){if(o.loop){i=0;show();return true;}stop();if(o.onEnd)o.onEnd();return false;}i++;show();if(i>=n()-1&&o.onEnd&&!o.loop)o.onEnd();return true;}
  function start(){if(i>=n()-1){i=0;show();}play.textContent="Pause";last=performance.now();acc=0;
    run=loop(()=>{const t=performance.now();acc+=Math.min(400,t-last)*speed;last=t;const ms=(typeof o.ms==="function"?o.ms(i):o.ms)||700;
      while(acc>=ms){acc-=ms;if(!adv())return;if(i>=n()-1&&!o.loop){stop();return;}}});}
  play.addEventListener("click",()=>{run?stop():start();});
  step.addEventListener("click",()=>{if(run)stop();if(i>=n()-1){i=0;show();}else adv();play.textContent=i>=n()-1?"Replay":"Play";});
  rs.addEventListener("click",()=>{stop();i=0;show();play.textContent="Play";});
  return {reset(){stop();i=0;show();play.textContent="Play";},start,stop,get i(){return i;},go(k){i=Math.max(0,Math.min(n()-1,k));show();}};
}

/* ---------- hero: an ordinary subquery runs once; a correlated one runs per row ---------- */
function heroNest(root){
  root.classList.add("flow");
  const ctl=el("div");root.appendChild(ctl);
  const box=el("div",{class:"svgbox"});root.appendChild(box);
  const W=720,H=346,svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Ten current employees as salary bars on the left; the inner query on the right computes an average once (ordinary subquery) or once per employee for that employee's department (correlated subquery); each bar is kept if it is above the average"});
  box.appendChild(svg);
  const st=el("div",{class:"flowstats"});root.appendChild(st);
  const stat={};[["runs","Inner query runs"],["chk","Rows checked"],["kept","Rows kept"],["mode","Subquery"]].forEach(([k,l])=>{const d=el("div");d.appendChild(SB.text("span",l));const b=el("b");b.textContent="—";d.appendChild(b);st.appendChild(d);stat[k]=b;});
  const msg=tx(root,"p","Loading ten employees from the karya database…","note");
  (async()=>{
    let R,avgAll,DA={};
    try{
      R=(await qrows(CUR_PAY_SEL+"\n  ORDER BY de.emp_no LIMIT 10")).map(r=>({emp:r[0],dept:r[1],sal:+r[2]}));
      avgAll=+(await qrows("SELECT AVG(salary) FROM ("+CUR_PAY_SEL+")"))[0][0];
      (await qrows("SELECT dept_no, AVG(salary) FROM ("+CUR_PAY_SEL+") GROUP BY dept_no")).forEach(r=>{DA[r[0]]=+r[1];});
      if(R.length<10)throw new Error("fewer rows than expected");
    }catch(e){failNote(msg,e);return;}
    msg.textContent="cur_pay = one row per current employee with their current department and current salary (File 3 builds it). Values are monthly gross pay.";
    const X0=150,BW=230,TOP=86,RH=21,maxV=Math.max(...R.map(r=>r.sal),...Object.values(DA))*1.05;
    const xs=v=>X0+BW*v/maxV;
    const g=sv("g");svg.appendChild(g);
    g.appendChild(sv("rect",{x:0,y:0,width:W,height:H,rx:8,style:"fill:var(--sunk)"}));
    const title=svgText(g,16,26,"",{"font-size":13,"font-weight":600});
    const outer=svgText(g,16,50,"",{"font-size":11});
    const outer2=svgText(g,16,66,"",{"font-size":11,style:"fill:var(--muted)"});
    svgText(g,16,TOP-6,"emp_no  dept",{"font-size":10,style:"fill:var(--muted)"});
    const bars=[],vals=[],ticks=[],lbls=[],hl=[];
    R.forEach((r,k)=>{const y=TOP+k*RH;
      hl.push(sv("rect",{x:10,y:y-1,width:420,height:RH-2,rx:4,style:"fill:none;stroke:var(--gold);stroke-width:2;opacity:0"}));g.appendChild(hl[k]);
      lbls.push(svgText(g,16,y+13,r.emp+"  "+DEPT_SHORT[r.dept],{"font-size":10.5}));
      bars.push(sv("rect",{x:X0,y:y+3,width:Math.max(1,xs(r.sal)-X0),height:RH-8,rx:2,style:"fill:var(--line)"}));g.appendChild(bars[k]);
      vals.push(svgText(g,xs(r.sal)+4,y+13,money(r.sal),{"font-size":10}));
      ticks.push(sv("line",{x1:0,x2:0,y1:y,y2:y+RH-2,style:"stroke:var(--gold);stroke-width:2.5;opacity:0"}));g.appendChild(ticks[k]);});
    const vline=sv("line",{x1:0,x2:0,y1:TOP-2,y2:TOP+10*RH,style:"stroke:var(--gold);stroke-width:2;stroke-dasharray:5 3;opacity:0"});g.appendChild(vline);
    const vlab=svgText(g,0,TOP+10*RH+12,"",{"font-size":10,"text-anchor":"middle",style:"fill:var(--gold)"});
    // inner query box
    const IX=470,IY=86,IW=234,IH=150;
    const ib=sv("rect",{x:IX,y:IY,width:IW,height:IH,rx:8,style:"fill:var(--surface);stroke:var(--line);stroke-width:1.5"});g.appendChild(ib);
    svgText(g,IX+12,IY+20,"INNER QUERY",{"font-size":10,"font-weight":600,style:"fill:var(--accent)"});
    const il=[0,1,2].map(j=>svgText(g,IX+12,IY+44+j*18,"",{"font-size":11}));
    const iv=svgText(g,IX+12,IY+120,"",{"font-size":18,"font-weight":600});
    const arrow=sv("path",{d:"",style:"fill:none;stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 3;opacity:0"});g.appendChild(arrow);
    const status=svgText(g,16,H-10,"",{"font-size":11.5});
    const NA=13,n=NA+22;
    function render(i){
      const A=i<NA;let runs=0,decided=0,cur=-1,val=null,dept=null,flash=false;

/* ---------- File 2 lab: x NOT IN (list) is x <> v1 AND x <> v2 AND … ; one NULL makes it UNKNOWN ---------- */
function labNotIn(root){
  root.style.minWidth="0";
  labNote(root,"The question: does employee x manage nobody? The list is every manager_no in employees: 121 different managers, plus the CEO's NULL. Watch how each version of the query evaluates the list for one candidate.");
  const ctl=row(root);
  const cand=pick(ctl,"Candidate x",[["10096","10096: no reports"],["10087","10087: a lead"],["10493","10493: the CEO"]],"10096");
  const mode=pick(ctl,"Query",[["notin","NOT IN"],["nn","NOT IN, NULL filtered"],["ne","NOT EXISTS"]],"notin");
  codeBlock(root,"NOT IN:                x NOT IN (SELECT manager_no FROM employees)\nNOT IN, NULL filtered: x NOT IN (SELECT manager_no FROM employees\n                                 WHERE manager_no IS NOT NULL)\nNOT EXISTS:            NOT EXISTS (SELECT 1 FROM employees r\n                                   WHERE r.manager_no = x)");
  const host=el("div",{class:"flow"});root.appendChild(host);
  const ctlHost=el("div");host.appendChild(ctlHost);
  const box=el("div",{class:"svgbox"});host.appendChild(box);
  const rd=readout(host,[["cmp","Comparisons made"],["acc","Running result"],["res","WHERE sees"],["kept","Row kept?"]]);
  const say=tx(host,"p","","note");
  const tot=el("div");root.appendChild(tot);
  (async()=>{
    let V;
    try{V=(await qrows("SELECT DISTINCT manager_no FROM employees WHERE manager_no IS NOT NULL ORDER BY manager_no")).map(r=>+r[0]);
      const c=await qrows("SELECT (SELECT COUNT(*) FROM employees WHERE emp_no NOT IN (SELECT manager_no FROM employees)), (SELECT COUNT(*) FROM employees WHERE emp_no NOT IN (SELECT manager_no FROM employees WHERE manager_no IS NOT NULL)), (SELECT COUNT(*) FROM employees e WHERE NOT EXISTS (SELECT 1 FROM employees r WHERE r.manager_no = e.emp_no))");
      tx(tot,"p","On all 1,400 employees, run by the engine just now:","eyebrow");
      tot.appendChild(SB.table(["Version","Employees who manage nobody"],[["NOT IN (list with the NULL)",ind(c[0][0])],["NOT IN (NULL filtered out)",ind(c[0][1])],["NOT EXISTS",ind(c[0][2])]]));
    }catch(e){failNote(root,e);return;}
    const W=660,cols=16,cw=40,chh=20,rows=Math.ceil((V.length+1)/cols),Hh=rows*(chh+4)+8;
    const svg=sv("svg",{viewBox:`0 0 ${W} ${Hh}`,role:"img","aria-label":"One chip per value in the subquery's list; each chip turns green (true), red (false) or gold (unknown) as the comparison with x is made"});box.appendChild(svg);
    let list=[],chips=[];
    function build(){svg.textContent="";chips=[];list=mode.value==="nn"?V.slice():V.concat([null]);
      list.forEach((v,k)=>{const x=6+(k%cols)*cw,y=4+Math.floor(k/cols)*(chh+4);const r=sv("rect",{x,y,width:cw-4,height:chh,rx:4,style:"fill:var(--surface);stroke:var(--line)"});svg.appendChild(r);
        const t=svgText(svg,x+(cw-4)/2,y+14,v===null?"NULL":String(v),{"font-size":9.5,"text-anchor":"middle"});chips.push({r,t,v});});}
    // evaluation trace for the chosen candidate and mode
    function trace(){const x=+cand.value,m=mode.value;const steps=[];let acc=m==="ne"?"no match yet":"TRUE";
      for(let k=0;k<list.length;k++){const v=list[k];let c;
        if(m==="ne"){c=v===null?"UNKNOWN":(v===x?"TRUE":"FALSE");if(c==="TRUE"){acc="match found";steps.push({k,c,acc});break;}steps.push({k,c,acc});continue;}
        c=v===null?"UNKNOWN":(v!==x?"TRUE":"FALSE");
        if(c==="FALSE")acc="FALSE";else if(c==="UNKNOWN"&&acc==="TRUE")acc="UNKNOWN";
        steps.push({k,c,acc});if(acc==="FALSE")break;}
      let res;if(m==="ne")res=acc==="match found"?"FALSE":"TRUE";else res=acc;return {steps,res};}
    let T=trace();
    const COL={TRUE:"var(--ok-soft)",FALSE:"var(--fraud-soft)",UNKNOWN:"var(--gold-soft)"},STR={TRUE:"var(--ok)",FALSE:"var(--fraud)",UNKNOWN:"var(--gold)"};
    function render(i){const m=mode.value;const done=Math.min(i,T.steps.length);
      chips.forEach((c,k)=>{c.r.style.fill="var(--surface)";c.r.style.stroke="var(--line)";c.r.style.strokeWidth=1;});
      for(let s=0;s<done;s++){const st=T.steps[s],c=chips[st.k];c.r.style.fill=COL[st.c];c.r.style.stroke=STR[st.c];}
      if(done>0&&done<=T.steps.length){const c=chips[T.steps[done-1].k];c.r.style.strokeWidth=3;}
      const fin=i>=T.steps.length;const accNow=done?T.steps[done-1].acc:(m==="ne"?"no match yet":"TRUE");
      rd.cmp.textContent=done;rd.acc.textContent=accNow;rd.res.textContent=fin?T.res:"…";rd.kept.textContent=fin?(T.res==="TRUE"?"yes":"no"):"…";
      const x=cand.value;
      if(!done)say.textContent=m==="ne"?`NOT EXISTS looks for a row whose manager_no equals ${x}. It needs only one.`:`${x} NOT IN (list) means ${x} <> v1 AND ${x} <> v2 AND … for every value in the list. Start: TRUE.`;
      else if(!fin){const st=T.steps[done-1],v=list[st.k];say.textContent=m==="ne"?(v===null?`NULL = ${x} is UNKNOWN: not a match, keep looking.`:`${v} = ${x}? ${st.c}.`):(v===null?`${x} <> NULL is UNKNOWN. TRUE AND UNKNOWN = UNKNOWN.`:`${x} <> ${v} is ${st.c}.`+(st.c==="FALSE"?" FALSE AND anything = FALSE: the database can stop.":""));}
      else say.textContent=T.res==="TRUE"?`Result TRUE: WHERE keeps ${x}.`:T.res==="FALSE"?`Result FALSE: WHERE drops ${x}, correctly; ${x} manages someone.`:`Result UNKNOWN: WHERE keeps only TRUE rows, so ${x} is dropped, although ${x} manages nobody. One NULL in the list does this to every candidate.`;
      if(fin&&m==="notin"&&T.res==="UNKNOWN"&&!S.nulltrap){S.nulltrap=true;save();award("nulltrap");}
    }
    const sp=Stepper(ctlHost,{title:"Evaluating one candidate",n:()=>T.steps.length+1,render,ms:i=>i>=T.steps.length-1?900:110,speeds:[1,4,16]});
    function redo(){build();T=trace();sp.reset();}
    cand.addEventListener("change",redo);mode.addEventListener("change",redo);redo();
  })();
}

/* ---------- File 3 lab: the correlated subquery is re-run for each outer row ---------- */
function labCorrelated(root){

    }catch(e){failNote(root,e);return;}

    const bars=[],ticks=[],hl=[];
    R.forEach((r,k)=>{const y=4+k*RH;hl.push(sv("rect",{x:2,y:y-1,width:W-4,height:RH-1,rx:4,style:"fill:none;stroke:var(--gold);stroke-width:2;opacity:0"}));svg.appendChild(hl[k]);
      svgText(svg,8,y+14,r.emp+"  "+DEPT_SHORT[r.dept],{"font-size":10.5});bars.push(sv("rect",{x:X0,y:y+3,width:xs(r.sal)-X0,height:RH-8,rx:2,style:"fill:var(--line)"}));svg.appendChild(bars[k]);
      svgText(svg,xs(r.sal)+4,y+14,money(r.sal),{"font-size":10});ticks.push(sv("line",{y1:y,y2:y+RH-2,style:"stroke:var(--gold);stroke-width:3;opacity:0"}));svg.appendChild(ticks[k]);});
    const isCor=()=>mode.value==="cor";

    function render(i){const C=isCor();let runs=0,chk=0,cur=-1,now=null,phase="";

      const d=cur>=0?R[cur].dept:null;

/* ---------- File 4 lab: EXISTS can stop at the first matching row ---------- */

  const ctl=row(root);
  const thr=pick(ctl,"Threshold (monthly)",[["150000","₹150,000"],["200000","₹200,000"],["250000","₹250,000"],["300000","₹300,000"]],"200000");
  const mode=pick(ctl,"Query",[["ex","EXISTS (SELECT 1 … AND salary > t)"],["ct","(SELECT COUNT(*) … AND salary > t) > 0"]],"ex");
  const host=el("div",{class:"flow"});root.appendChild(host);const ch=el("div");host.appendChild(ch);
  codeBlock(host,"SELECT d.dept_name\nFROM departments d\nWHERE EXISTS (SELECT 1\n              FROM cur_pay c\n              WHERE c.dept_no = d.dept_no\n                AND c.salary > 200000);");
  const box=el("div",{class:"svgbox"});host.appendChild(box);
  const rd=readout(host,[["read","Rows read so far"],["dep","Departments done"],["yes","Departments with a match"]]);
  const say=tx(host,"p","","note");
  (async()=>{
    const D=[];
    try{const dn=await qrows("SELECT dept_no, dept_name FROM departments ORDER BY dept_no");
      const sal=await qrows("SELECT dept_no, salary FROM ("+CUR_PAY_SEL+") ORDER BY dept_no, emp_no");
      dn.forEach(([k,nm])=>D.push({k,nm,s:sal.filter(r=>r[0]===k).map(r=>+r[1])}));}catch(e){failNote(root,e);return;}
    const W=680,RH=24,L=150,maxN=Math.max(...D.map(d=>d.s.length)),cw=(W-L-60)/maxN,Hh=D.length*RH+8;
    const svg=sv("svg",{viewBox:`0 0 ${W} ${Hh}`,role:"img","aria-label":"One strip per department; cells light up as rows are read, gold marks the first salary above the threshold"});box.appendChild(svg);
    const cells=[],cnt=[];
    D.forEach((d,k)=>{const y=4+k*RH;svgText(svg,6,y+14,d.nm,{"font-size":10.5});const arr=[];d.s.forEach((v,j)=>{const r=sv("rect",{x:L+j*cw,y:y+3,width:Math.max(0.6,cw-0.4),height:RH-9,style:"fill:var(--line)"});svg.appendChild(r);arr.push(r);});cells.push(arr);cnt.push(svgText(svg,W-6,y+14,"",{"font-size":10,"text-anchor":"end"}));});
    let plan=[];
    function makePlan(){const t=+thr.value,ex=mode.value==="ex";plan=[];D.forEach((d,k)=>{let first=d.s.findIndex(v=>v>t);const read=ex?(first<0?d.s.length:first+1):d.s.length;plan.push({k,read,first,match:first>=0});});}
    const per=40;  // cells revealed per step
    let steps=[];function makeSteps(){steps=[];plan.forEach(p=>{for(let r=Math.min(per,p.read);;r=Math.min(p.read,r+per)){steps.push({k:p.k,r});if(r>=p.read)break;}});}
    function render(i){const t=+thr.value,ex=mode.value==="ex";let read=0,dep=0,yes=0;
      const upto={};for(let s=0;s<Math.min(i,steps.length);s++)upto[steps[s].k]=steps[s].r;
      plan.forEach(p=>{const r=upto[p.k]||0;read+=r;const fin=r>=p.read;if(fin){dep++;if(p.match)yes++;}
        cells[p.k].forEach((c,j)=>{c.style.fill=j<r?(j===p.first?"var(--gold)":(D[p.k].s[j]>t?"var(--accent)":"var(--muted)")):"var(--line)";c.style.opacity=j<r?1:0.5;});
        cnt[p.k].textContent=r?(fin?(p.match?"yes · ":"no · ")+r+" read":r+" read"):"";});
      rd.read.textContent=ind(read);rd.dep.textContent=dep+" of "+D.length;rd.yes.textContent=yes;
      if(i===0)say.textContent=ex?"EXISTS asks only: is there at least one row? The answer is known at the first match.":"COUNT(*) has to see every row before it can compare the count with 0.";
      else if(i>=steps.length){const total=D.reduce((a,d)=>a+d.s.length,0);say.textContent=`Done: ${yes} departments have someone above ${money(t)}. Rows read: ${ind(read)} of ${ind(total)}.`+(ex?" Same answer as COUNT(*) > 0, with less reading.":" Switch to EXISTS and compare.");}
      else say.textContent=`Reading ${D[steps[Math.min(i,steps.length)-1].k].nm}…`;
    }
    const sp=Stepper(ch,{title:"Semi-join: is there a row?",n:()=>steps.length+1,render,ms:i=>260,speeds:[1,4,16]});
    function redo(){makePlan();makeSteps();host.querySelector(".formula").textContent=(mode.value==="ex"?"SELECT d.dept_name\nFROM departments d\nWHERE EXISTS (SELECT 1\n              FROM cur_pay c\n              WHERE c.dept_no = d.dept_no\n                AND c.salary > ":"SELECT d.dept_name\nFROM departments d\nWHERE (SELECT COUNT(*)\n       FROM cur_pay c\n       WHERE c.dept_no = d.dept_no\n         AND c.salary > ")+thr.value+(mode.value==="ex"?");":") > 0;");sp.reset();}
    thr.addEventListener("change",redo);mode.addEventListener("change",redo);redo();
  })();
}

      ["JOIN + GROUP BY","SELECT e.emp_no, MAX(s.salary) AS peak\nFROM employees e\nLEFT JOIN salaries s ON s.emp_no = e.emp_no\nWHERE e.emp_no <= 10008\nGROUP BY e.emp_no;"]]},
    dt:{t:"Average number of direct reports per manager",v:[

/* ---------- File 6 lab: a CTE pipeline, one named step at a time ---------- */
function labCTE(root){
  const STEPS=[
    ["cur_pay","cur_pay AS (\n  "+CUR_PAY_SEL.replace(/\n/g,"\n  ")+"\n)"],
    ["dept_avg","dept_avg AS (\n  SELECT dept_no, COUNT(*) AS staff, AVG(salary) AS avg_salary\n  FROM cur_pay\n  GROUP BY dept_no\n)"],
    ["company","company AS (\n  SELECT AVG(salary) AS avg_all\n  FROM cur_pay\n)"]];
  const FINAL="SELECT d.dept_name, a.staff,\n       ROUND(a.avg_salary, 2) AS avg_salary,\n       ROUND(a.avg_salary - c.avg_all, 2) AS gap\nFROM dept_avg a\nJOIN departments d ON d.dept_no = a.dept_no\nCROSS JOIN company c\nORDER BY gap DESC;";
  labNote(root,"One WITH, three named steps, one final SELECT. Play runs the pipeline step by step: each named result is shown as the main query would see it. dept_avg and company both read cur_pay; the final SELECT reads both.");
  const host=el("div",{class:"flow"});root.appendChild(host);const ch=el("div");host.appendChild(ch);
  const parts=sqlParts(host);const out=el("div",{class:"sqlx-out"});host.appendChild(out);
  const head="WITH ";
  function sqlFor(k){return head+STEPS.map(s=>s[1]).join(",\n")+"\n"+(k<STEPS.length?"SELECT * FROM "+STEPS[k][0]+" LIMIT 10;":FINAL);}
  async function render(i){
    parts.set([{t:head}].concat(STEPS.flatMap((s,k)=>[{t:s[1],cls:k===i-1?"sqlnow":k<i-1?"sqldone":""},{t:k<STEPS.length-1?",\n":"\n"}])).concat([{t:FINAL,cls:i===STEPS.length+1?"sqlnow":""}]));
    out.textContent="";
    if(i===0){tx(out,"p","Nothing has run. Each step can be checked on its own: that is the point of naming it.","note");return;}
    const k=i-1;tx(out,"p",k<STEPS.length?"Step "+(k+1)+": what the main query sees as "+STEPS[k][0]+(k===0?" (first 10 rows)":""):"The final SELECT, using dept_avg and company:","eyebrow");
    const g=el("div");out.appendChild(g);const sql=sqlFor(k);try{SQLX.grid(g,await SQLX.exec(KDB,sql));}catch(e){SQLX.errorBox(g,e.message,sql);}
  }
  const sp=Stepper(ch,{title:"Pipeline, step by step",n:()=>STEPS.length+2,render,ms:2600});sp.reset();
  const nest=el("details");nest.appendChild(SQLX.txt("summary","The same report without a CTE (nested subqueries, read inside out)"));
  codeBlock(nest,"SELECT d.dept_name, a.staff,\n       ROUND(a.avg_salary, 2) AS avg_salary,\n       ROUND(a.avg_salary - (SELECT AVG(s.salary)\n                             FROM dept_emp de\n                             JOIN salaries s ON s.emp_no = de.emp_no\n                                            AND s.to_date = '9999-01-01'\n                             WHERE de.to_date = '9999-01-01'), 2) AS gap\nFROM (SELECT de.dept_no, COUNT(*) AS staff, AVG(s.salary) AS avg_salary\n      FROM dept_emp de\n      JOIN salaries s ON s.emp_no = de.emp_no\n                     AND s.to_date = '9999-01-01'\n      WHERE de.to_date = '9999-01-01'\n      GROUP BY de.dept_no) AS a\nJOIN departments d ON d.dept_no = a.dept_no\nORDER BY gap DESC;");
  root.appendChild(nest);
}

/* ---------- File 7 lab: a recursive CTE grows the org chart one level per iteration ---------- */
function labTree(root){
  labNote(root,"An icicle chart of the reporting lines: each band is one level, each block one person, its width the size of the team under them. The anchor member puts the starting person in; every iteration of the recursive member adds the people who report to anyone added in the previous iteration.");
  const ctl=row(root);const startSel=pick(ctl,"Start from",[["10493","10493 · the CEO (manager_no IS NULL)"]],"10493");
  const host=el("div",{class:"flow"});root.appendChild(host);const ch=el("div");host.appendChild(ch);
  const parts=sqlParts(host);
  const box=el("div",{class:"svgbox"});host.appendChild(box);
  const rd=readout(host,[["it","Iteration"],["add","Rows added"],["tot","Rows in the result"],["deep","Deepest level"]]);
  const say=tx(host,"p","","note");
  (async()=>{
    let E,M;
    try{E=await qrows("SELECT emp_no, manager_no FROM employees ORDER BY emp_no");
      M=await qrows("SELECT dm.emp_no, d.dept_name FROM dept_manager dm JOIN departments d ON d.dept_no = dm.dept_no WHERE dm.to_date = '9999-01-01' AND dm.emp_no <> 10493 ORDER BY d.dept_name");}catch(e){failNote(root,e);return;}
    M.forEach(([k,nm])=>{const o=el("option",{value:String(k)});o.textContent=k+" · head of "+nm;startSel.appendChild(o);});
    const kids=new Map();E.forEach(([e,m])=>{if(m!=null){if(!kids.has(m))kids.set(m,[]);kids.get(m).push(e);}});
    const W=680,BH=50,PAD=4;let levels=[],nodes=[];
    const svg=sv("svg",{viewBox:`0 0 ${W} ${5*BH+30}`,role:"img","aria-label":"Icicle chart: the start person on top, each level of reports in a band below; bands appear one recursion step at a time"});box.appendChild(svg);
    function layout(){nodes=[];levels=[];const root0=+startSel.value;const size=new Map();
      const sz=n=>{if(size.has(n))return size.get(n);let s=1;(kids.get(n)||[]).forEach(c=>s+=sz(c));size.set(n,s);return s;};const total=sz(root0);
      const place=(n,x0,d)=>{const w=(W-2*PAD)*size.get(n)/total;nodes.push({n,x0,w,d});(levels[d]=levels[d]||[]).push(n);let x=x0;(kids.get(n)||[]).forEach(c=>{place(c,x,d+1);x+=(W-2*PAD)*size.get(c)/total;});};
      place(root0,PAD,0);
      svg.textContent="";nodes.forEach(o=>{o.r=sv("rect",{x:o.x0,y:6+o.d*BH,width:Math.max(0.4,o.w-0.6),height:BH-6,style:"fill:var(--line);opacity:0"});svg.appendChild(o.r);
        if(o.w>44){o.t=svgText(svg,o.x0+o.w/2,6+o.d*BH+BH/2+1,String(o.n),{"font-size":o.d<2?11:9.5,"text-anchor":"middle",style:"opacity:0"});}});
      for(let d=0;d<levels.length;d++)svgText(svg,W-8,6+d*BH+14,"level "+(d+1),{"font-size":10,"font-weight":600,"text-anchor":"end",style:"fill:var(--ink);stroke:var(--surface);stroke-width:3px;paint-order:stroke"});
      svg.setAttribute("viewBox",`0 0 ${W} ${Math.max(levels.length,1)*BH+28}`);}
    const n=()=>levels.length+2;
    function render(i){const shown=Math.min(i,levels.length);// i = 1 → anchor shown
      nodes.forEach(o=>{const vis=o.d<shown;o.r.style.opacity=vis?1:0;o.r.style.fill=o.d===shown-1&&i<=levels.length?"var(--gold)":"var(--accent)";if(o.t){o.t.style.opacity=vis?1:0;o.t.style.fill=o.d===shown-1&&i<=levels.length?"var(--ink)":"var(--surface)";}});
      const it=i===0?"—":i===1?"anchor":i<=levels.length?String(i-1):String(levels.length);
      const added=i===0?0:i<=levels.length?levels[i-1].length:0;const tot=levels.slice(0,shown).reduce((a,l)=>a+l.length,0);
      rd.it.textContent=it;rd.add.textContent=i===0?"—":ind(added);rd.tot.textContent=ind(tot);rd.deep.textContent=shown?String(shown):"—";
      const s=startSel.value;
      parts.set([{t:"WITH RECURSIVE org (emp_no, lvl) AS (\n"},{t:"  SELECT emp_no, 1\n  FROM employees\n  WHERE "+(s==="10493"?"manager_no IS NULL":"emp_no = "+s)+"            -- anchor member",cls:i===1?"sqlnow":i>1?"sqldone":""},{t:"\n  UNION ALL\n"},{t:"  SELECT e.emp_no, o.lvl + 1\n  FROM employees e\n  JOIN org o ON e.manager_no = o.emp_no   -- recursive member",cls:i>1&&i<=levels.length+1?"sqlnow":""},{t:"\n)\nSELECT lvl, COUNT(*) AS people FROM org GROUP BY lvl;"}]);
      if(i===0)say.textContent="Nothing has run yet.";
      else if(i===1)say.textContent=`Anchor: one row, ${s}. This row is the first "working table".`;
      else if(i<=levels.length)say.textContent=`Iteration ${i-1}: join employees to the ${ind(levels[i-2].length)} row(s) added last time; ${ind(added)} people report to them, so ${ind(added)} new rows.`;
      else{say.textContent=`Iteration ${levels.length}: nobody reports to the ${ind(levels[levels.length-1].length)} people added last, so the recursive member returns no rows and the recursion stops. ${ind(tot)} rows in all.`;
        if(s==="10493"&&!S.orgchart){S.orgchart=true;save();award("orgchart");}}
    }
    const sp=Stepper(ch,{title:"Growing the tree",n,render,ms:1500});
    startSel.addEventListener("change",()=>{layout();sp.reset();});layout();sp.reset();
  })();
}

 "INSERT INTO dept_copy VALUES ('d001','Marketing','Mumbai'),('d002','Finance','Mumbai'),('d003','Human Resources','Pune'),('d004','Operations','Chennai'),('d005','Engineering','Bengaluru'),('d006','Quality','Bengaluru'),('d007','Sales','Delhi'),('d008','Research','Hyderabad'),('d009','Customer Service','Kolkata');";

function labViews(root){

    ["What the database stored","SELECT type, name, sql\nFROM sqlite_master\nWHERE type = 'view';","Only the name and the SELECT text. No rows."],

    ["Make it writable with an INSTEAD OF trigger","CREATE TRIGGER v_south_west_upd\nINSTEAD OF UPDATE ON v_south_west\nBEGIN\n  UPDATE dept_copy SET dept_name = NEW.dept_name\n  WHERE dept_no = OLD.dept_no;\nEND;\nUPDATE v_south_west\nSET dept_name = 'Brand and Marketing'\nWHERE dept_no = 'd001';\nSELECT * FROM dept_copy WHERE dept_no = 'd001';","The trigger says what to do instead: update the base table. (Triggers are Module 7.)"],

  nx.addEventListener("click",async()=>{if(k>=STEPS.length)return;const [t,sql,note]=STEPS[k];code.textContent="";codeBlock(code,sql);out.textContent="";
    try{await viewLabReady;const r=await SQLX.exec("viewlab",sql);SQLX.grid(out,r);}catch(e){SQLX.errorBox(out,e.message,sql);}
    tx(out,"p",note,"note");if(k===3)out.appendChild(SQLX.mysqlNote("This game (SQLite) answers 'cannot modify v_south_west because it is a view'. In MySQL 8.0 a simple view (one base table, no GROUP BY, DISTINCT, aggregates or UNION) is updatable, so the same UPDATE would rename d001 in dept_copy. Add WITH CHECK OPTION in MySQL to forbid changes that would move a row out of the view."));
    k++;mark();});
  again.addEventListener("click",async()=>{try{await viewLabReady;await SQLX.reset("viewlab");}catch(e){}k=0;code.textContent="";out.textContent="";mark();});

        const ids=shuffled(n,seed+1);const A=Math.min(a,n),B=Math.min(b,Math.max(0,n-A));ids.slice(0,A).forEach(k=>rows[k][1]=300000);ids.slice(A,A+B).forEach(k=>rows[k][1]=290000);
        return {sql:"CREATE TABLE gen_pay (emp_no INTEGER PRIMARY KEY, salary INTEGER NOT NULL);\n"+insertLines("gen_pay",rows),
          note:`gen_pay: ${ind(n)} employees; ${A} share the top salary ₹300,000 and ${B} share ₹290,000; everyone else is below ₹250,000.`};},
      [["LIMIT 1 OFFSET 1 (no DISTINCT)","SELECT salary\nFROM gen_pay\nORDER BY salary DESC\nLIMIT 1 OFFSET 1;"],
       ["With DISTINCT","SELECT DISTINCT salary\nFROM gen_pay\nORDER BY salary DESC\nLIMIT 1 OFFSET 1;"],
       ["MAX below MAX","SELECT MAX(salary) AS second_highest\nFROM gen_pay\nWHERE salary < (SELECT MAX(salary) FROM gen_pay);"],
       ["Everyone in second place","SELECT emp_no, salary\nFROM gen_pay\nWHERE salary = (SELECT MAX(salary) FROM gen_pay\n                WHERE salary < (SELECT MAX(salary) FROM gen_pay));"]],
      "With two or more people tied at the top, the version without DISTINCT returns the top salary again. The other two agree. Set 'Tied at the top' to 1 and they all agree."),
    own:p=>ownPane(p,"emp_no,dept,salary\n1,Sales,52000\n2,Sales,61000\n3,Sales,61000\n4,Finance,75000\n5,Finance,58000\n6,Finance,75000\n7,Research,90000\n8,Research,66000",
      "SELECT MAX(salary) AS second_highest\nFROM my_table\nWHERE salary < (SELECT MAX(salary) FROM my_table);")
  },"Real data: the same queries on karya. Generate: build a pay table with ties at the top and see which query survives them. Your data: any table with a number column.");
}

function sbNulls(root){
  SB.panel(root,"How many NULLs does it take?",{
    controls:p=>{starterConsole(p,KDB,[
      ["NOT IN (the trap)","SELECT COUNT(*) AS manage_nobody\nFROM employees\nWHERE emp_no NOT IN (SELECT manager_no\n                     FROM employees);"],
      ["NOT IN, NULL filtered","SELECT COUNT(*) AS manage_nobody\nFROM employees\nWHERE emp_no NOT IN (SELECT manager_no\n                     FROM employees\n                     WHERE manager_no IS NOT NULL);"],
      ["NOT EXISTS","SELECT COUNT(*) AS manage_nobody\nFROM employees e\nWHERE NOT EXISTS (SELECT 1\n                  FROM employees r\n                  WHERE r.manager_no = e.emp_no);"],
      ["Where is the NULL?","SELECT emp_no, first_name, last_name, manager_no\nFROM employees\nWHERE manager_no IS NULL;"],
      ["Duplicate full names","SELECT emp_no, first_name, last_name\nFROM employees\nWHERE (first_name, last_name) IN (SELECT first_name, last_name\n                                  FROM employees\n                                  GROUP BY first_name, last_name\n                                  HAVING COUNT(*) >= 3)\nORDER BY last_name, first_name;"]]);},
    generate:p=>genPane(p,[{label:"Employees",value:300,lo:10,hi:3000},{label:"Rows with NULL manager_no",value:1,lo:0,hi:200},{label:"Seed",value:3,lo:1,hi:99999}],
      ([n,k,seed])=>{const r=rng(seed);const M=Math.max(1,Math.round(n/10));const rows=[];
        for(let i=1;i<=n;i++){let m=i===1?0:i<=M?1:1+Math.floor(r()*M);rows.push([i,m]);}
        const K=Math.min(k,n);if(K>0){rows[0][1]=null;shuffled(n-1,seed+5).slice(0,K-1).forEach(j=>rows[j+1][1]=null);}
        return {sql:"CREATE TABLE gen_staff (emp_no INTEGER PRIMARY KEY, manager_no INTEGER);\n"+insertLines("gen_staff",rows),
          note:`gen_staff: ${ind(n)} employees; ${ind(M)} of them manage others; ${K} row${K===1?"":"s"} with NULL manager_no`+(K===0?" (the top person has manager_no 0, meaning 'reports to the board').":".")};},
      [["NOT IN","SELECT COUNT(*) AS manage_nobody\nFROM gen_staff\nWHERE emp_no NOT IN (SELECT manager_no FROM gen_staff);"],
       ["NOT EXISTS","SELECT COUNT(*) AS manage_nobody\nFROM gen_staff g\nWHERE NOT EXISTS (SELECT 1 FROM gen_staff r\n                  WHERE r.manager_no = g.emp_no);"],
       ["NOT IN, NULL filtered","SELECT COUNT(*) AS manage_nobody\nFROM gen_staff\nWHERE emp_no NOT IN (SELECT manager_no FROM gen_staff\n                     WHERE manager_no IS NOT NULL);"],
       ["IN is not affected","SELECT COUNT(*) AS manage_someone\nFROM gen_staff\nWHERE emp_no IN (SELECT manager_no FROM gen_staff);"]],
      "Set the NULL count to 0 and NOT IN agrees with NOT EXISTS; set it to 1 and NOT IN returns 0, whatever the size of the table. IN is safe: x IN (…, NULL) is TRUE when x is in the list, and only TRUE matters to WHERE."),
    own:p=>ownPane(p,"emp_no,name,manager_no\n1,Asha,\n2,Bilal,1\n3,Chitra,1\n4,Dev,2\n5,Esha,2\n6,Farid,\n7,Gauri,3",
      "SELECT emp_no, name\nFROM my_table t\nWHERE NOT EXISTS (SELECT 1 FROM my_table r\n                  WHERE r.manager_no = t.emp_no);")
  },"Real data: the trap on karya. Generate: choose how many NULLs the list contains. Your data: your own table with gaps.");
}

function sbTree(root){
  SB.panel(root,"Grow your own org chart",{
    controls:p=>{starterConsole(p,KDB,[
      ["Levels from the CEO","WITH RECURSIVE org (emp_no, lvl) AS (\n  SELECT emp_no, 1 FROM employees WHERE manager_no IS NULL\n  UNION ALL\n  SELECT e.emp_no, o.lvl + 1\n  FROM employees e\n  JOIN org o ON e.manager_no = o.emp_no\n)\nSELECT lvl, COUNT(*) AS people\nFROM org\nGROUP BY lvl\nORDER BY lvl;"],
      ["Path strings","WITH RECURSIVE org (emp_no, lvl, path) AS (\n  SELECT emp_no, 1, CAST(emp_no AS TEXT)\n  FROM employees WHERE manager_no IS NULL\n  UNION ALL\n  SELECT e.emp_no, o.lvl + 1, o.path || ' > ' || e.emp_no\n  FROM employees e\n  JOIN org o ON e.manager_no = o.emp_no\n)\nSELECT emp_no, lvl, path\nFROM org\nORDER BY path\nLIMIT 40;"],
      ["Chain of command upward","WITH RECURSIVE up (emp_no, manager_no, step) AS (\n  SELECT emp_no, manager_no, 0 FROM employees WHERE emp_no = 10096\n  UNION ALL\n  SELECT e.emp_no, e.manager_no, u.step + 1\n  FROM employees e\n  JOIN up u ON e.emp_no = u.manager_no\n)\nSELECT u.step, u.emp_no, e.first_name, e.last_name\nFROM up u\nJOIN employees e ON e.emp_no = u.emp_no\nORDER BY u.step;"],
      ["Team size of each department head","WITH RECURSIVE under (head, emp_no) AS (\n  SELECT dm.emp_no, e.emp_no\n  FROM dept_manager dm\n  JOIN employees e ON e.manager_no = dm.emp_no\n  WHERE dm.to_date = '9999-01-01'\n  UNION ALL\n  SELECT u.head, e.emp_no\n  FROM employees e\n  JOIN under u ON e.manager_no = u.emp_no\n)\nSELECT head, COUNT(*) AS people_below\nFROM under\nGROUP BY head\nORDER BY people_below DESC;"]]);},
    generate:p=>genPane(p,[{label:"Levels below the top",value:4,lo:1,hi:12},{label:"Fewest reports per manager",value:1,lo:1,hi:6},{label:"Most reports per manager",value:4,lo:1,hi:8},{label:"Seed",value:5,lo:1,hi:99999},{label:"Reporting cycle",opts:[["no","no (a proper tree)"],["yes","yes: the top person reports to the last one"]],value:"no"}],
      ([depth,lo,hi,seed,cyc])=>{const r=rng(seed);const a=Math.min(lo,hi),b=Math.max(lo,hi);const rows=[[1,null]];let frontier=[1],id=1,capped=false;
        for(let d=0;d<depth&&!capped;d++){const nx=[];for(const m of frontier){const k=a+Math.floor(r()*(b-a+1));for(let j=0;j<k;j++){if(id>=4000){capped=true;break;}id++;rows.push([id,m]);nx.push(id);}if(capped)break;}frontier=nx;if(!nx.length)break;}
        if(cyc==="yes"&&rows.length>1)rows[0][1]=rows[rows.length-1][0];
        return {sql:"CREATE TABLE gen_org (emp_no INTEGER PRIMARY KEY, manager_no INTEGER);\n"+insertLines("gen_org",rows),
          note:`gen_org: ${ind(rows.length)} people`+(capped?" (capped at 4,000)":"")+(cyc==="yes"?`; the top person (1) now reports to ${rows[0][1]}, so following manager_no upward never ends.`:"; person 1 has manager_no NULL.")};},
      [["Levels (guarded)","WITH RECURSIVE org (emp_no, lvl) AS (\n  SELECT emp_no, 1 FROM gen_org WHERE emp_no = 1\n  UNION ALL\n  SELECT g.emp_no, o.lvl + 1\n  FROM gen_org g\n  JOIN org o ON g.manager_no = o.emp_no\n  WHERE o.lvl < 30          -- stopping guard\n)\nSELECT lvl, COUNT(*) AS people\nFROM org\nGROUP BY lvl\nORDER BY lvl;"],
       ["Levels (no guard)","WITH RECURSIVE org (emp_no, lvl) AS (\n  SELECT emp_no, 1 FROM gen_org WHERE emp_no = 1\n  UNION ALL\n  SELECT g.emp_no, o.lvl + 1\n  FROM gen_org g\n  JOIN org o ON g.manager_no = o.emp_no\n)\nSELECT lvl, COUNT(*) AS people\nFROM org\nGROUP BY lvl\nORDER BY lvl;"],
       ["Leaves (manage nobody)","SELECT COUNT(*) AS leaves\nFROM gen_org g\nWHERE NOT EXISTS (SELECT 1 FROM gen_org r\n                  WHERE r.manager_no = g.emp_no);"]],
      "With a cycle, the unguarded query never runs out of new rows: this game stops it after 6 seconds; MySQL stops it at cte_max_recursion_depth (1,000 iterations by default). The guarded query repeats the loop until level 30 and then stops."),
    own:p=>ownPane(p,"emp_no,name,manager_no\n1,Asha,\n2,Bilal,1\n3,Chitra,1\n4,Dev,2\n5,Esha,2\n6,Farid,3\n7,Gauri,6\n8,Hari,6\n9,Irfan,8",
      "WITH RECURSIVE org (emp_no, lvl, path) AS (\n  SELECT emp_no, 1, name FROM my_table WHERE manager_no IS NULL\n  UNION ALL\n  SELECT t.emp_no, o.lvl + 1, o.path || ' > ' || t.name\n  FROM my_table t\n  JOIN org o ON t.manager_no = o.emp_no\n  WHERE o.lvl < 50\n)\nSELECT * FROM org ORDER BY path;")
  },"Real data: hierarchy queries on karya. Generate: a tree of any depth and width, optionally with a reporting cycle. Your data: any table with an id and a parent id.");
}

L.push({id:"l1",badge:"Inside-Out Reader",code:"File 1",title:"One number, asked first",topics:"Scalar subqueries in WHERE and SELECT, reading inside out, = versus a list, second and Nth highest salary",
story:`<b>Day 1 in the Audit Cell.</b> Karya's board has asked its internal audit cell for a quiet review of pay, promotions and reporting lines. The chief auditor's first memo is three lines long: "Who is paid above the company average? Who is paid the most, and who comes second? Do not type any figure into a query: figures change, queries should not."`,
brief:`<p>A <span class="term">subquery</span> (also called an inner query or nested query) is a SELECT written in brackets inside another SQL (Structured Query Language) statement, the <span class="term">outer query</span>. An ordinary subquery is worked out first, once; its answer is then used as if you had typed it.</p>
<p>A <span class="term">scalar subquery</span> returns exactly one value: one row, one column. It can stand wherever a single value can: after =, &gt; or &lt; in WHERE, or as a column in SELECT. In karya, salaries are monthly gross pay in ₹, and a row with to_date = '9999-01-01' is the current one. In this file "current salary" means exactly that open row; a few people who have left still have one (File 4 investigates), and they are included.</p>
<div class="formula">-- current salaries above the average current salary
SELECT emp_no, salary
FROM salaries
WHERE to_date = '9999-01-01'
  AND salary &gt; (SELECT AVG(salary)
                FROM salaries
                WHERE to_date = '9999-01-01');

-- a scalar subquery as a column: each department's share of staff
SELECT d.dept_name, COUNT(*) AS staff,
       ROUND(100.0 * COUNT(*) /
             (SELECT COUNT(*) FROM dept_emp
              WHERE to_date = '9999-01-01'), 2) AS pct
FROM dept_emp de
JOIN departments d ON d.dept_no = de.dept_no
WHERE de.to_date = '9999-01-01'
GROUP BY d.dept_name;</div>
<p>Why not <code>WHERE salary &gt; AVG(salary)</code>? WHERE looks at one row at a time, before any grouping, so there is no average to compare with yet, and the database refuses. The subquery computes the average separately, first.</p>
<p>To read a nested query, start at the innermost brackets: run them on their own, see the value, then read outwards. The interview classic "second highest salary" is two levels deep; the <span class="term">Nth highest</span> generalises with LIMIT and OFFSET:</p>
<div class="formula">SELECT MAX(salary) AS second_highest
FROM salaries
WHERE to_date = '9999-01-01'
  AND salary &lt; (SELECT MAX(salary) FROM salaries
                WHERE to_date = '9999-01-01');

SELECT DISTINCT salary             -- Nth highest: OFFSET N − 1
FROM salaries
WHERE to_date = '9999-01-01'
ORDER BY salary DESC
LIMIT 1 OFFSET 1;</div>
<p>DISTINCT matters: if two people share the top salary, LIMIT 1 OFFSET 1 without DISTINCT returns the top salary again. A third method, with window functions, comes in Module 5.</p>
${MN("If the subquery after = returns more than one row, MySQL stops with error 1242 (Subquery returns more than 1 row). This game (SQLite) does not complain: it quietly uses the first row the subquery produces, so a wrong query can look right. Write = only before a subquery that must return one value (an aggregate such as MAX, or a filter on a key); for a list use IN (File 2). <code>WHERE salary &gt; AVG(salary)</code> fails in both: MySQL error 1111 (invalid use of group function), SQLite 'misuse of aggregate function AVG()'.")}`,
refs:"SQLite documentation, <i>SQL As Understood By SQLite</i>: SELECT and expressions (scalar subqueries) · MySQL 8.0 Reference Manual, \"Subqueries\" and \"The Subquery as Scalar Operand\" · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter on subqueries · Silberschatz, Korth &amp; Sudarshan, <i>Database System Concepts</i> (7th ed., 2019), ch. 3 (nested subqueries).",
lab:root=>{labScalar(root);sbTies(root);},
qs:[
{t:"sql",db:KDB,q:"The memo's first line. How many current salary rows (to_date = '9999-01-01') are above the average current salary? Return one number.",
 answer:"SELECT COUNT(*) AS above_average FROM salaries WHERE to_date = '9999-01-01' AND salary > (SELECT AVG(salary) FROM salaries WHERE to_date = '9999-01-01')",
 hint:"Write the average as its own SELECT first, then put it in brackets after salary &gt;. Both the inner and the outer query need the to_date filter.",
 why:"<code>SELECT COUNT(*) FROM salaries WHERE to_date = '9999-01-01' AND salary &gt; (SELECT AVG(salary) FROM salaries WHERE to_date = '9999-01-01')</code> returns 558. The inner query returns one number (₹100,497.26), which then stands in for the brackets. Forget to_date inside the brackets and you compare with the average of every salary ever paid, a lower figure."},
{t:"sql",db:KDB,q:"Who has the highest current salary (salary rows with to_date = '9999-01-01')? Return emp_no, first_name, last_name and salary. Do not type the amount.",
 answer:"SELECT e.emp_no, e.first_name, e.last_name, s.salary FROM employees e JOIN salaries s ON s.emp_no = e.emp_no WHERE s.to_date = '9999-01-01' AND s.salary = (SELECT MAX(salary) FROM salaries WHERE to_date = '9999-01-01')",
 hint:"Join employees to salaries, keep current rows, and require salary = (SELECT MAX(salary) … current rows).",

{t:"sql",db:KDB,q:"Interview classic: the second highest salary. Return the second highest current salary (salary rows with to_date = '9999-01-01') as one column, one row.",
 answer:"SELECT MAX(salary) AS second_highest FROM salaries WHERE to_date = '9999-01-01' AND salary < (SELECT MAX(salary) FROM salaries WHERE to_date = '9999-01-01')",
