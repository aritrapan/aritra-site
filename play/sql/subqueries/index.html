{t:"sql",db:KDB,q:"A scalar subquery as a column. For each department: dept_name, its number of current staff (dept_emp rows with to_date = '9999-01-01'), and that number as a percentage of all current staff, rounded to 2 decimals.",
 answer:"SELECT d.dept_name, COUNT(*) AS staff, ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM dept_emp WHERE to_date = '9999-01-01'), 2) AS pct_of_staff FROM dept_emp de JOIN departments d ON d.dept_no = de.dept_no WHERE de.to_date = '9999-01-01' GROUP BY d.dept_name",
 hint:"GROUP BY department for the count; divide by (SELECT COUNT(*) FROM dept_emp WHERE to_date = '9999-01-01'). Multiply by 100.0, not 100, or integer division rounds everything down.",
 why:"<code>ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM dept_emp WHERE to_date = '9999-01-01'), 2)</code>: the subquery returns 1,276 once, and every group divides by it. Engineering has 231 staff, 18.10%. With 100 instead of 100.0, SQLite divides two integers and returns whole numbers (18)."+MN("MySQL's / always returns a decimal, so 100 * COUNT(*) / … works there. In SQLite, integer / integer is an integer: write 100.0.")},
{t:"sql",db:KDB,q:"Interview classic: the Nth highest salary. Return the 5th highest distinct current salary (salary rows with to_date = '9999-01-01'), one column, one row.",
 answer:"SELECT DISTINCT salary FROM salaries WHERE to_date = '9999-01-01' ORDER BY salary DESC LIMIT 1 OFFSET 4",
 hint:"Nth highest: DISTINCT, ORDER BY salary DESC, LIMIT 1 OFFSET N − 1.",
 why:"<code>SELECT DISTINCT salary FROM salaries WHERE to_date = '9999-01-01' ORDER BY salary DESC LIMIT 1 OFFSET 4</code> returns ₹278,572. OFFSET skips N − 1 = 4 values. Without DISTINCT, ties would count twice; here the top five are all different, but interviewers ask about ties."},
{t:"mcq",q:"<code>SELECT first_name FROM employees WHERE emp_no = (SELECT emp_no FROM dept_manager);</code> The subquery returns 18 rows. What happens?",
 opts:["MySQL stops with error 1242; SQLite quietly uses the first row the subquery returns","Both return all 18 managers","Both stop with an error","Both return no rows"],a:0,
 hint:"= expects a single value. What does each engine do with a list?",
 why:"MySQL refuses: error 1242, Subquery returns more than 1 row. SQLite takes the first row and returns one manager, which looks plausible and is wrong. The fix in both is IN (File 2): <code>WHERE emp_no IN (SELECT emp_no FROM dept_manager)</code>."},
{t:"mcq",q:"Why does <code>SELECT emp_no FROM salaries WHERE salary &gt; AVG(salary);</code> fail?",
 opts:["WHERE works on one row at a time, before any grouping, so no average exists yet","AVG cannot be used on integer columns","The average must be rounded first","WHERE cannot contain the &gt; operator with functions"],a:0,
 hint:"In which order does the database process WHERE and aggregates?",
 why:"Aggregates are computed after WHERE has chosen the rows (FROM → WHERE → GROUP BY → HAVING → SELECT). Inside WHERE there is no average yet. A scalar subquery computes the average separately and hands WHERE one number."}
]});

L.push({id:"l2",badge:"NULL Trap Spotter",code:"File 2",title:"Lists, and the NULL that empties them",topics:"IN and NOT IN with subqueries, three-valued logic, the NOT IN NULL trap, duplicate detection, row values",
story:`<b>The empty report.</b> A junior auditor asked karya's database a simple question, "which employees manage nobody?", and got zero rows. In a company of 1,400 people. The query looked right, ran without an error, and was signed off. Your job is to find out why it came back empty before the figure reaches the board.`,
brief:`<p>When a subquery returns a <span class="term">list</span> (one column, many rows), compare with <span class="term">IN</span>: the outer row is kept if its value equals any value in the list. <span class="term">NOT IN</span> keeps rows whose value equals none of them.</p>
<div class="formula">SELECT emp_no, first_name, last_name
FROM employees
WHERE emp_no IN (SELECT manager_no FROM employees);   -- anyone's manager</div>
<p>The trap is in how NOT IN is defined. <code>x NOT IN (a, b, c)</code> means <code>x &lt;&gt; a AND x &lt;&gt; b AND x &lt;&gt; c</code>. Comparing anything with NULL gives UNKNOWN, not TRUE or FALSE (SQL's <span class="term">three-valued logic</span>). TRUE AND UNKNOWN is UNKNOWN, and WHERE keeps only TRUE rows. So if the list contains a single NULL, NOT IN can never be TRUE, and the result is empty.</p>
<div class="formula">5 NOT IN (1, 2, NULL)  =  5 &lt;&gt; 1 AND 5 &lt;&gt; 2 AND 5 &lt;&gt; NULL
                       =  TRUE   AND TRUE   AND UNKNOWN  =  UNKNOWN</div>
<p>karya's CEO (chief executive officer) has manager_no NULL, so <code>emp_no NOT IN (SELECT manager_no FROM employees)</code> returns nothing. Two fixes: filter the NULL out inside the subquery (<code>WHERE manager_no IS NOT NULL</code>), or use NOT EXISTS (File 4), which is not affected by NULLs. IN is safe: <code>x IN (…, NULL)</code> is TRUE whenever x is in the list.</p>
<p><span class="term">Duplicate detection</span>, an interview classic, is IN with a grouped subquery: find the keys that occur more than once, then fetch every row with those keys. A subquery may also return several columns, compared as a <span class="term">row value</span>:</p>
<div class="formula">SELECT emp_no, first_name, last_name
FROM employees
WHERE (first_name, last_name) IN (SELECT first_name, last_name
                                  FROM employees
                                  GROUP BY first_name, last_name
                                  HAVING COUNT(*) &gt; 1);</div>
${MN("IN, NOT IN and row values such as (first_name, last_name) IN (…) behave the same in MySQL 8.0 and SQLite, NULL trap included. One difference: MySQL does not allow LIMIT inside a subquery used with IN (error 1235, 'LIMIT &amp; IN/ALL/ANY/SOME subquery'); SQLite does.")}`,
refs:"SQLite documentation: expressions, \"The IN and NOT IN operators\" (including the NULL rules) · MySQL 8.0 Reference Manual, \"Subqueries with ANY, IN, or SOME\" and \"Restrictions on Subqueries\" · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), on NOT IN and NULLs · Elmasri &amp; Navathe, <i>Fundamentals of Database Systems</i> (7th ed., 2016), ch. 7 (NULLs and three-valued logic, nested queries).",
lab:root=>{labNotIn(root);sbNulls(root);},
qs:[
{t:"sql",db:KDB,q:"List emp_no, first_name and last_name of every employee currently assigned (dept_emp.to_date = '9999-01-01') to a department located in Mumbai. Use the location, not the department codes.",
 answer:"SELECT emp_no, first_name, last_name FROM employees WHERE emp_no IN (SELECT emp_no FROM dept_emp WHERE to_date = '9999-01-01' AND dept_no IN (SELECT dept_no FROM departments WHERE location = 'Mumbai'))",
 hint:"Innermost: the dept_no values located in Mumbai. Middle: the emp_no values currently in those departments. Outer: employees whose emp_no is IN that list.",
 why:"<code>WHERE emp_no IN (SELECT emp_no FROM dept_emp WHERE to_date = '9999-01-01' AND dept_no IN (SELECT dept_no FROM departments WHERE location = 'Mumbai'))</code>: 225 people in Marketing and Finance. A join gives the same rows here because each person has one current department; IN can never duplicate an outer row, a join can (File 5)."},
{t:"sql",db:KDB,q:"Which employees are somebody's manager (their emp_no appears in some employee's manager_no)? Return emp_no, first_name, last_name, each person once.",
 answer:"SELECT emp_no, first_name, last_name FROM employees WHERE emp_no IN (SELECT manager_no FROM employees)",
 hint:"emp_no IN (SELECT manager_no FROM employees). The NULL in that list does no harm to IN.",
 why:"<code>SELECT emp_no, first_name, last_name FROM employees WHERE emp_no IN (SELECT manager_no FROM employees)</code>: 121 people. The CEO's NULL is in the list, but for IN a match is a match: TRUE OR UNKNOWN is TRUE. A self-join without DISTINCT would repeat each manager once per report."},
{t:"sql",db:KDB,q:"The empty report, fixed. How many employees manage nobody (no employee has them as manager_no)? Return one number.",
 answer:"SELECT COUNT(*) AS manage_nobody FROM employees e WHERE NOT EXISTS (SELECT 1 FROM employees r WHERE r.manager_no = e.emp_no)",
 hint:"emp_no NOT IN (SELECT manager_no FROM employees) returns 0 because of one NULL. Add WHERE manager_no IS NOT NULL inside the brackets, or use NOT EXISTS.",
 why:"1,279. <code>WHERE emp_no NOT IN (SELECT manager_no FROM employees WHERE manager_no IS NOT NULL)</code> or <code>WHERE NOT EXISTS (SELECT 1 FROM employees r WHERE r.manager_no = e.emp_no)</code>. Without the filter, every comparison ends in UNKNOWN because of the CEO's NULL, and the count is 0."},
{t:"sql",db:KDB,setup:SETUP_UPLOAD,q:"Interview classic: find the duplicates. Payroll uploaded a table pay_upload (emp_no, salary, from_date), meant to have one row per employee. List every row of pay_upload whose emp_no occurs more than once: emp_no, salary, from_date.",
 answer:"SELECT emp_no, salary, from_date FROM pay_upload WHERE emp_no IN (SELECT emp_no FROM pay_upload GROUP BY emp_no HAVING COUNT(*) > 1)",
 hint:"Inner query: SELECT emp_no FROM pay_upload GROUP BY emp_no HAVING COUNT(*) &gt; 1. Outer: every row whose emp_no is IN that list.",
 why:"<code>SELECT emp_no, salary, from_date FROM pay_upload WHERE emp_no IN (SELECT emp_no FROM pay_upload GROUP BY emp_no HAVING COUNT(*) &gt; 1)</code> returns 11 rows: five employees appear twice, and 10019 three times. GROUP BY … HAVING alone would show the duplicated keys but not the rows to investigate."},
{t:"sql",db:KDB,q:"Former department heads: employees who once managed a department (a dept_manager row that has ended) but do not manage one now. Return emp_no, first_name, last_name.",
 answer:"SELECT emp_no, first_name, last_name FROM employees WHERE emp_no IN (SELECT emp_no FROM dept_manager WHERE to_date <> '9999-01-01') AND emp_no NOT IN (SELECT emp_no FROM dept_manager WHERE to_date = '9999-01-01')",
 hint:"IN the list of ended dept_manager rows, AND NOT IN the list of current ones (to_date = '9999-01-01'). emp_no is never NULL, so NOT IN is safe here.",
 why:"<code>WHERE emp_no IN (SELECT emp_no FROM dept_manager WHERE to_date &lt;&gt; '9999-01-01') AND emp_no NOT IN (SELECT emp_no FROM dept_manager WHERE to_date = '9999-01-01')</code>: 9 people. NOT IN is safe because dept_manager.emp_no is part of the primary key and cannot be NULL. Check that before trusting NOT IN."},
{t:"mcq",q:"What is the value of <code>7 NOT IN (3, 5, NULL)</code>?",opts:["UNKNOWN (shown as NULL), so WHERE would drop the row","TRUE, because 7 is not 3 or 5","FALSE","An error"],a:0,
 hint:"Expand it: 7 &lt;&gt; 3 AND 7 &lt;&gt; 5 AND 7 &lt;&gt; NULL.",
 why:"TRUE AND TRUE AND UNKNOWN = UNKNOWN. Run <code>SELECT 7 NOT IN (3, 5, NULL);</code> in any console: the answer is NULL. WHERE keeps only TRUE, so the row is dropped."},
{t:"mcq",q:"A NOT IN query returns no rows, but you are sure some should qualify. What do you check first?",
 opts:["Whether the subquery's column contains NULLs","Whether the outer table has an index","Whether IN should be = instead","Whether the subquery needs ORDER BY"],a:0,
 hint:"One value in the list can make every comparison UNKNOWN.",
 why:"A single NULL in the list turns every NOT IN into UNKNOWN. Run the subquery alone and look for NULLs; then add <code>WHERE col IS NOT NULL</code> inside, or switch to NOT EXISTS."}
]});

L.push({id:"l3",badge:"Row-by-Row Auditor",code:"File 3",title:"Re-run for every row",topics:"Correlated subqueries in WHERE and SELECT, above the department average, earning more than one's manager, top earner per department",
story:`<b>Fair pay, department by department.</b> The board's remuneration committee does not care who beats the company average: engineers will always beat call-centre staff. It wants to know who is paid above the average of their own department, who earns more than their own manager, and who is the top earner in each department. "Their own" is the phrase that changes the SQL.`,
brief:`<p>To keep these queries short, the audit cell has prepared a working table <span class="term">cur_pay</span>: one row per current employee with their current department and current salary. Every challenge in this file builds it for you, and the console below builds it when the file opens:</p>
<div class="formula">CREATE TABLE cur_pay AS
  SELECT de.emp_no, de.dept_no, s.salary
  FROM dept_emp de
  JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'
  WHERE de.to_date = '9999-01-01';          -- 1,276 rows</div>
<p>A <span class="term">correlated subquery</span> mentions a column of the outer query. It cannot run on its own, and its meaning is "worked out again for every outer row". (Optimisers may find faster plans, but the result must be as if it ran once per row.) A table alias tells the two copies of cur_pay apart:</p>
<div class="formula">SELECT c.emp_no, c.dept_no, c.salary
FROM cur_pay c
WHERE c.salary &gt; (SELECT AVG(c2.salary)
                  FROM cur_pay c2
                  WHERE c2.dept_no = c.dept_no);   -- this row's department</div>
<p>The test: select the inner query and run it alone. If it fails with "no such column: c.dept_no", it is correlated. An ordinary subquery runs once; a correlated one, conceptually, once per outer row.</p>
<p>Correlated subqueries also work as columns: <code>(SELECT COUNT(*) FROM titles t WHERE t.emp_no = e.emp_no)</code> gives each employee their own count. And they solve two interview classics without window functions: <span class="term">employees who earn more than their manager</span> (the inner query fetches the manager's salary for this row's manager_no) and <span class="term">the top earner in each department</span> (salary = the MAX of this row's department).</p>
${MN("Correlated subqueries are written the same way in MySQL 8.0 and SQLite. The test above words its error differently: this game (SQLite) says 'no such column: c.dept_no'; MySQL says: Unknown column 'c.dept_no' in 'where clause' (error 1054). MySQL's optimiser can transform many subqueries into joins (its manual describes semijoin and materialization strategies); SQLite has optimisations of its own. Either way, the result is defined row by row.")}`,
refs:"SQLite documentation: expressions, \"Subquery Expressions\" and \"Correlated Subqueries\" · MySQL 8.0 Reference Manual, \"Correlated Subqueries\" · Silberschatz, Korth &amp; Sudarshan (7th ed., 2019), ch. 3 (nested subqueries, correlation) · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020).",
lab:root=>{labCorrelated(root);curPayConsole(root,[
  ["Above own department average","SELECT c.emp_no, c.dept_no, c.salary\nFROM cur_pay c\nWHERE c.salary > (SELECT AVG(c2.salary)\n                  FROM cur_pay c2\n                  WHERE c2.dept_no = c.dept_no)\nORDER BY c.dept_no, c.salary DESC;"],
  ["Run the inner query alone","SELECT AVG(c2.salary)\nFROM cur_pay c2\nWHERE c2.dept_no = c.dept_no;"],
  ["Earns more than own manager","SELECT c.emp_no, c.salary, e.manager_no,\n       (SELECT m.salary FROM cur_pay m\n        WHERE m.emp_no = e.manager_no) AS manager_salary\nFROM cur_pay c\nJOIN employees e ON e.emp_no = c.emp_no\nWHERE c.salary > (SELECT m.salary FROM cur_pay m\n                  WHERE m.emp_no = e.manager_no)\nLIMIT 20;"],
  ["Titles held (subquery as a column)","SELECT e.emp_no, e.first_name,\n       (SELECT COUNT(*) FROM titles t\n        WHERE t.emp_no = e.emp_no) AS titles_held\nFROM employees e\nORDER BY titles_held DESC, e.emp_no\nLIMIT 10;"]]);},
qs:[
{t:"sql",db:KDB,setup:SETUP_CUR,q:"Interview classic: employees above their department's average. Using cur_pay, return emp_no, dept_no and salary of everyone whose salary is above the average salary of their own department.",
 answer:"SELECT c.emp_no, c.dept_no, c.salary FROM cur_pay c WHERE c.salary > (SELECT AVG(c2.salary) FROM cur_pay c2 WHERE c2.dept_no = c.dept_no)",
 hint:"Give the outer cur_pay an alias (c) and the inner one another (c2); in the inner WHERE, write c2.dept_no = c.dept_no.",
 why:"<code>SELECT c.emp_no, c.dept_no, c.salary FROM cur_pay c WHERE c.salary &gt; (SELECT AVG(c2.salary) FROM cur_pay c2 WHERE c2.dept_no = c.dept_no)</code>: 521 people. Without <code>c2.dept_no = c.dept_no</code> the inner query becomes the company average, and 507 people pass: the answer to a different question."},
{t:"sql",db:KDB,ordered:true,q:"A correlated subquery as a column. For employees 10001 to 10015, show emp_no, first_name and the number of title rows each has held, ordered by emp_no.",
 answer:"SELECT e.emp_no, e.first_name, (SELECT COUNT(*) FROM titles t WHERE t.emp_no = e.emp_no) AS titles_held FROM employees e WHERE e.emp_no BETWEEN 10001 AND 10015 ORDER BY e.emp_no",
 hint:"(SELECT COUNT(*) FROM titles t WHERE t.emp_no = e.emp_no) as the third column.",
 why:"<code>SELECT e.emp_no, e.first_name, (SELECT COUNT(*) FROM titles t WHERE t.emp_no = e.emp_no) AS titles_held FROM employees e WHERE e.emp_no BETWEEN 10001 AND 10015 ORDER BY e.emp_no</code>. The subquery returns one number per outer row. The same result comes from a LEFT JOIN with GROUP BY; on large tables the join is usually the faster plan."},
{t:"sql",db:KDB,setup:SETUP_CUR,q:"Interview classic: employees who earn more than their manager. Using cur_pay for both the employee's and the manager's salary (and employees.manager_no for the reporting line), return emp_no and salary of every such employee.",
 answer:"SELECT c.emp_no, c.salary FROM cur_pay c JOIN employees e ON e.emp_no = c.emp_no WHERE c.salary > (SELECT m.salary FROM cur_pay m WHERE m.emp_no = e.manager_no)",
 hint:"Join cur_pay c to employees e to get e.manager_no; then compare c.salary with (SELECT m.salary FROM cur_pay m WHERE m.emp_no = e.manager_no).",
 why:"<code>SELECT c.emp_no, c.salary FROM cur_pay c JOIN employees e ON e.emp_no = c.emp_no WHERE c.salary &gt; (SELECT m.salary FROM cur_pay m WHERE m.emp_no = e.manager_no)</code>: 532 people, a finding for the committee. For the CEO the subquery returns no row, so the comparison is with NULL, UNKNOWN, and the CEO is dropped. A self-join (Module 3) gives the same answer."},
{t:"sql",db:KDB,ordered:true,q:"Employee 10002's pay history: return from_date and salary of their salary rows that are above that employee's own average salary, oldest first. Make the inner query correlated (do not type 10002 inside it).",
 answer:"SELECT s.from_date, s.salary FROM salaries s WHERE s.emp_no = 10002 AND s.salary > (SELECT AVG(s2.salary) FROM salaries s2 WHERE s2.emp_no = s.emp_no) ORDER BY s.from_date",
 hint:"Outer: salaries s WHERE s.emp_no = 10002. Inner: AVG(s2.salary) FROM salaries s2 WHERE s2.emp_no = s.emp_no.",
 why:"<code>… WHERE s.emp_no = 10002 AND s.salary &gt; (SELECT AVG(s2.salary) FROM salaries s2 WHERE s2.emp_no = s.emp_no) ORDER BY s.from_date</code>: 5 rows, 2022 onwards. Delete <code>s.emp_no = 10002</code> from the outer WHERE and the same query answers the question for every employee at once; that is the advantage of correlating instead of typing the number."},
{t:"sql",db:KDB,setup:SETUP_CUR,ordered:true,q:"Interview classic: the top earner in each department. Using cur_pay, return dept_no, emp_no and salary of the person with the highest salary in their department, ordered by dept_no.",
 answer:"SELECT c.dept_no, c.emp_no, c.salary FROM cur_pay c WHERE c.salary = (SELECT MAX(c2.salary) FROM cur_pay c2 WHERE c2.dept_no = c.dept_no) ORDER BY c.dept_no",
 hint:"Keep the rows whose salary equals the MAX of their own department: c.salary = (SELECT MAX(c2.salary) … WHERE c2.dept_no = c.dept_no).",
 why:"<code>WHERE c.salary = (SELECT MAX(c2.salary) FROM cur_pay c2 WHERE c2.dept_no = c.dept_no)</code>: 9 rows, one per department (ties would show both people, which is usually what an auditor wants). Module 5 solves the same 'top N per group' with window functions."},
{t:"mcq",q:"Which inner query is correlated?",
 opts:["(SELECT MAX(t.from_date) FROM titles t WHERE t.emp_no = e.emp_no)","(SELECT MAX(from_date) FROM titles)","(SELECT emp_no FROM titles WHERE title = 'Lead')","(SELECT AVG(salary) FROM salaries WHERE to_date = '9999-01-01')"],a:0,
 hint:"Which one mentions a column that belongs to the outer query?",
 why:"It refers to e.emp_no, a column of the outer row, so it cannot run alone and is evaluated per outer row. The other three can be selected and run on their own."},
{t:"num",ph:"e.g. 9",q:"Conceptually, how many times is the inner query evaluated in challenge 1 (above own department average), given that cur_pay has 1,276 rows?",a:1276,tol:0,
 hint:"A correlated subquery is defined row by row of the outer query.",
 why:"Once per outer row: 1,276 times, although there are only 9 different departments. That is why a database may cache or rewrite it, and why the CTE and join versions in Files 5 and 6 compute the 9 averages once and join them."}
]});

L.push({id:"l4",badge:"Existence Prover",code:"File 4",title:"Is there a row?",topics:"EXISTS and NOT EXISTS, semi-joins and anti-joins, employees with no title change, ANY and ALL (MySQL) and their SQLite rewrites",
story:`<b>The leavers who still get paid.</b> Payroll and HR (human resources) keep separate records. HR closes a person's department assignment when they leave; payroll closes their salary row. The cell suspects the two do not always agree. You need people for whom one kind of row exists and the other does not, and you need to say which departments have anyone above a pay threshold without counting everyone.`,
brief:`<p><span class="term">EXISTS (subquery)</span> is TRUE if the subquery returns at least one row and FALSE if it returns none. It is almost always correlated. What the subquery selects does not matter, only whether a row exists, so <code>SELECT 1</code>, <code>SELECT *</code> and <code>SELECT NULL</code> are all equivalent inside it. The database can stop at the first matching row.</p>
<div class="formula">-- open salary row, but no current department: the audit finding
SELECT e.emp_no, e.first_name, e.last_name
FROM employees e
WHERE NOT EXISTS (SELECT 1
                  FROM dept_emp de
                  WHERE de.emp_no = e.emp_no
                    AND de.to_date = '9999-01-01');</div>
<p>EXISTS is a <span class="term">semi-join</span> (keep outer rows that have a match, each once); NOT EXISTS is an <span class="term">anti-join</span> (keep rows that have no match). EXISTS only ever answers TRUE or FALSE, never UNKNOWN, so NOT EXISTS has no NULL trap. That makes it the safe default for "has no …" questions; LEFT JOIN … IS NULL (Module 3) is the join form of the same thing.</p>
<p>Standard SQL also has quantified comparisons: <span class="term">ANY</span> (or SOME) is TRUE if the comparison holds for at least one value of the subquery; <span class="term">ALL</span>, if it holds for every value. They are MySQL syntax that this game cannot run, so here is each one with its SQLite rewrite:</p>
<div class="formula">MySQL                                 SQLite (and MySQL) rewrite
x &gt; ANY (SELECT s …)                  x &gt; (SELECT MIN(s) …)
x &gt; ALL (SELECT s …)                  x &gt; (SELECT MAX(s) …)
x &lt; ALL (SELECT s …)                  x &lt; (SELECT MIN(s) …)
x = ANY (SELECT s …)                  x IN (SELECT s …)
x &lt;&gt; ALL (SELECT s …)                 x NOT IN (SELECT s …)
any of them                           [NOT] EXISTS (SELECT 1 … WHERE s &lt;op&gt; x)</div>
<p>The rewrites differ at the edges. If the subquery returns no rows, <code>x &gt; ALL (…)</code> is TRUE (nothing contradicts it), but <code>x &gt; (SELECT MAX(…))</code> compares with NULL and is UNKNOWN. And ALL inherits the NOT IN NULL trap: one NULL in the list and <code>x &gt; ALL</code> can never be TRUE. The NOT EXISTS form handles both cases the way people usually mean.</p>
${MN("ANY, SOME and ALL work in MySQL 8.0: <code>WHERE salary &gt; ALL (SELECT salary FROM … WHERE dept_no = 'd009')</code>. SQLite has none of them; writing them here gives 'syntax error'. Use the MIN/MAX or EXISTS forms above, which run in both.")}`,
refs:"SQLite documentation: expressions, \"The EXISTS operator\" · MySQL 8.0 Reference Manual, \"Subqueries with EXISTS or NOT EXISTS\", \"Subqueries with ANY, IN, or SOME\" and \"Subqueries with ALL\" · Ramakrishnan &amp; Gehrke, <i>Database Management Systems</i> (3rd ed., 2003), ch. 5 (nested queries, set-comparison operators) · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter on subqueries.",
lab:root=>{labExists(root);curPayConsole(root,[
  ["Leavers with an open salary row","SELECT e.emp_no, e.first_name, e.last_name\nFROM employees e\nWHERE NOT EXISTS (SELECT 1 FROM dept_emp de\n                  WHERE de.emp_no = e.emp_no\n                    AND de.to_date = '9999-01-01');"],
  ["ALL, rewritten with MAX","SELECT COUNT(*) AS above_all_of_d009\nFROM cur_pay\nWHERE salary > (SELECT MAX(salary) FROM cur_pay\n                WHERE dept_no = 'd009');"],
  ["ALL, rewritten with NOT EXISTS","SELECT COUNT(*) AS above_all_of_d009\nFROM cur_pay c\nWHERE NOT EXISTS (SELECT 1 FROM cur_pay x\n                  WHERE x.dept_no = 'd009'\n                    AND x.salary >= c.salary);"],
  ["Empty list: MAX vs NOT EXISTS","SELECT\n  (SELECT COUNT(*) FROM cur_pay\n   WHERE salary > (SELECT MAX(salary) FROM cur_pay WHERE dept_no = 'none')) AS max_form,\n  (SELECT COUNT(*) FROM cur_pay c\n   WHERE NOT EXISTS (SELECT 1 FROM cur_pay x WHERE x.dept_no = 'none'\n                     AND x.salary >= c.salary)) AS not_exists_form;"],
  ["Try ALL (MySQL only)","SELECT COUNT(*)\nFROM cur_pay\nWHERE salary > ALL (SELECT salary FROM cur_pay\n                    WHERE dept_no = 'd009');"]]);},
qs:[
{t:"sql",db:KDB,q:"The audit finding. List emp_no, first_name and last_name of employees who have no current department assignment (no dept_emp row with to_date = '9999-01-01').",
 answer:"SELECT e.emp_no, e.first_name, e.last_name FROM employees e WHERE NOT EXISTS (SELECT 1 FROM dept_emp de WHERE de.emp_no = e.emp_no AND de.to_date = '9999-01-01')",
 hint:"NOT EXISTS (SELECT 1 FROM dept_emp de WHERE de.emp_no = e.emp_no AND de.to_date = '9999-01-01').",
 why:"<code>WHERE NOT EXISTS (SELECT 1 FROM dept_emp de WHERE de.emp_no = e.emp_no AND de.to_date = '9999-01-01')</code>: 124 people. Every one of them still has a salary row with to_date = '9999-01-01', the mismatch the cell suspected. Put the to_date condition inside the subquery: outside it, it would refer to nothing."},
{t:"sql",db:KDB,q:"Interview classic: employees with no title change. List emp_no, first_name and last_name of employees who have held only one title (they have no title row that has ended).",
 answer:"SELECT e.emp_no, e.first_name, e.last_name FROM employees e WHERE NOT EXISTS (SELECT 1 FROM titles t WHERE t.emp_no = e.emp_no AND t.to_date <> '9999-01-01')",
 hint:"NOT EXISTS a titles row for this employee whose to_date is not '9999-01-01'. Or: emp_no IN (SELECT emp_no FROM titles GROUP BY emp_no HAVING COUNT(*) = 1).",
 why:"<code>WHERE NOT EXISTS (SELECT 1 FROM titles t WHERE t.emp_no = e.emp_no AND t.to_date &lt;&gt; '9999-01-01')</code>: 654 people. <code>emp_no IN (SELECT emp_no FROM titles GROUP BY emp_no HAVING COUNT(*) = 1)</code> gives the same 654, because everyone in karya has exactly one current title."},
{t:"sql",db:KDB,setup:SETUP_CUR,q:"Which departments have at least one current employee earning more than ₹200,000 a month? Using cur_pay, return dept_name.",
 answer:"SELECT d.dept_name FROM departments d WHERE EXISTS (SELECT 1 FROM cur_pay c WHERE c.dept_no = d.dept_no AND c.salary > 200000)",
 hint:"FROM departments d WHERE EXISTS (SELECT 1 FROM cur_pay c WHERE c.dept_no = d.dept_no AND c.salary &gt; 200000).",
 why:"<code>SELECT d.dept_name FROM departments d WHERE EXISTS (SELECT 1 FROM cur_pay c WHERE c.dept_no = d.dept_no AND c.salary &gt; 200000)</code>: 6 departments. Each department appears once however many people qualify; a join would repeat it once per high earner."},
{t:"sql",db:KDB,setup:SETUP_CUR,q:"In MySQL you would write <code>salary &gt; ALL (SELECT salary FROM cur_pay WHERE dept_no = 'd009')</code>. Without ALL: how many people in cur_pay earn more than everyone in Customer Service (d009)? Return one number.",
 answer:"SELECT COUNT(*) AS above_all FROM cur_pay WHERE salary > (SELECT MAX(salary) FROM cur_pay WHERE dept_no = 'd009')",
 hint:"More than every value = more than the largest value: compare with (SELECT MAX(salary) … d009).",
 why:"<code>SELECT COUNT(*) FROM cur_pay WHERE salary &gt; (SELECT MAX(salary) FROM cur_pay WHERE dept_no = 'd009')</code>: 193 people earn more than Customer Service's best-paid person (₹142,278). The NOT EXISTS form, <code>NOT EXISTS (SELECT 1 FROM cur_pay x WHERE x.dept_no = 'd009' AND x.salary &gt;= c.salary)</code>, gives the same count."+MN("In MySQL 8.0 the ALL version runs as written and also returns 193. In SQLite it is a syntax error.")},
{t:"sql",db:KDB,setup:SETUP_CUR,q:"The ANY version. How many Customer Service staff (d009 in cur_pay) earn more than at least one Engineering employee (d005)? Return one number.",
 answer:"SELECT COUNT(*) AS above_some FROM cur_pay WHERE dept_no = 'd009' AND salary > (SELECT MIN(salary) FROM cur_pay WHERE dept_no = 'd005')",
 hint:"More than at least one value = more than the smallest value: (SELECT MIN(salary) … d005).",
 why:"<code>… WHERE dept_no = 'd009' AND salary &gt; (SELECT MIN(salary) FROM cur_pay WHERE dept_no = 'd005')</code>: 62 people. In MySQL: <code>salary &gt; ANY (SELECT salary FROM cur_pay WHERE dept_no = 'd005')</code>. EXISTS also works: <code>EXISTS (SELECT 1 FROM cur_pay x WHERE x.dept_no = 'd005' AND x.salary &lt; c.salary)</code>."},
{t:"mcq",q:"In MySQL, the subquery in <code>WHERE salary &gt; ALL (SELECT salary FROM salaries WHERE emp_no = 99999)</code> returns no rows (there is no such employee). What does the condition give for each outer row?",
 opts:["TRUE: no value contradicts it, so every row is kept","FALSE: there is nothing to be greater than","UNKNOWN, like a comparison with NULL","An error"],a:0,
 hint:"ALL means 'for every value in the list'. How many counter-examples does an empty list have?",
 why:"Over an empty list, ALL is TRUE (vacuously). The rewrite <code>salary &gt; (SELECT MAX(…))</code> behaves differently: MAX of no rows is NULL, the comparison is UNKNOWN, and every row is dropped. The NOT EXISTS rewrite keeps every row, like ALL."},
{t:"mcq",q:"Which of these subqueries makes <code>WHERE EXISTS (…)</code> behave differently from the other three?",
 opts:["(SELECT 1 FROM titles t WHERE t.emp_no = e.emp_no AND 1 = 0)","(SELECT * FROM titles t WHERE t.emp_no = e.emp_no)","(SELECT NULL FROM titles t WHERE t.emp_no = e.emp_no)","(SELECT t.title FROM titles t WHERE t.emp_no = e.emp_no)"],a:0,
 hint:"EXISTS asks whether any row comes back, not what is in it.",
 why:"The select list is irrelevant to EXISTS: SELECT *, SELECT NULL and SELECT t.title all return a row for every employee with a title, so EXISTS is TRUE. <code>AND 1 = 0</code> removes every row, so EXISTS is FALSE everywhere."}
]});

L.push({id:"l5",badge:"Table Builder",code:"File 5",title:"Tables made on the spot",topics:"Derived tables (subqueries in FROM), aggregating twice, the department with the highest average pay, subquery or join",
story:`<b>Averages of averages.</b> The committee's next questions need two rounds of arithmetic. How many salary revisions does a typical employee get? Which department pays best on average? Which departments beat the average department? None of these fit in one GROUP BY, and one of them is the most common pay question in SQL interviews.`,
brief:`<p>A subquery can stand where a table stands, in FROM. The formal name is a <span class="term">derived table</span>: a temporary table that exists only while the query runs. The outer query uses its columns like any table's. It is the standard way to <span class="term">aggregate twice</span>, because <code>AVG(COUNT(*))</code> is not allowed:</p>
<div class="formula">SELECT ROUND(AVG(revisions), 2) AS avg_revisions
FROM (SELECT emp_no, COUNT(*) AS revisions     -- step 1: one row per employee
      FROM salaries
      GROUP BY emp_no) AS per_emp;             -- step 2: average those counts</div>
<p>Give every computed column in the derived table a name (revisions above): the outer query can only refer to columns by name. Derived tables can be joined to other tables, and filtered against each other:</p>
<div class="formula">-- interview classic: the department with the highest average current pay
SELECT d.dept_name, ROUND(a.avg_salary, 2) AS avg_salary
FROM (SELECT de.dept_no, AVG(s.salary) AS avg_salary
      FROM dept_emp de
      JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'
      WHERE de.to_date = '9999-01-01'
      GROUP BY de.dept_no) AS a
JOIN departments d ON d.dept_no = a.dept_no
ORDER BY a.avg_salary DESC
LIMIT 1;</div>
<p><span class="term">Subquery or join?</span> Many questions can be written both ways. The rules of thumb: IN and EXISTS return each outer row at most once; a join returns one row per match, so it can multiply rows (fan-out) unless you add DISTINCT or group. NOT EXISTS and LEFT JOIN … IS NULL are interchangeable; NOT IN is equivalent only when the list has no NULLs. A scalar subquery in SELECT and a LEFT JOIN with GROUP BY give the same numbers. Use a subquery when the question is "which rows have (or lack) a match", a join when you need columns from both tables, and whichever a colleague will read correctly.</p>
${MN("MySQL requires an alias on every derived table: without <code>AS per_emp</code> it stops with error 1248 (Every derived table must have its own alias). SQLite does not insist, but write the alias anyway so the query runs in both. MySQL 8.0 can also merge a derived table into the outer query or materialise it; the result is the same.")}`,
refs:"SQLite documentation: SELECT, subqueries in the FROM clause · MySQL 8.0 Reference Manual, \"Derived Tables\" and \"Optimizing Subqueries, Derived Tables, View References, and Common Table Expressions\" · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter on subqueries · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020).",

  ["Average revisions (derived table)","SELECT ROUND(AVG(revisions), 2) AS avg_revisions,\n       MAX(revisions) AS most, MIN(revisions) AS fewest\nFROM (SELECT emp_no, COUNT(*) AS revisions\n      FROM salaries\n      GROUP BY emp_no) AS per_emp;"],
  ["Department averages","SELECT d.dept_name, a.staff, ROUND(a.avg_salary, 2) AS avg_salary\nFROM (SELECT de.dept_no, COUNT(*) AS staff, AVG(s.salary) AS avg_salary\n      FROM dept_emp de\n      JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'\n      WHERE de.to_date = '9999-01-01'\n      GROUP BY de.dept_no) AS a\nJOIN departments d ON d.dept_no = a.dept_no\nORDER BY a.avg_salary DESC;"],
  ["Run the inner query alone","SELECT emp_no, COUNT(*) AS revisions\nFROM salaries\nGROUP BY emp_no\nORDER BY revisions DESC\nLIMIT 10;"]],"Every query here runs on karya; select the inner query of a derived table and run it alone to see the table the outer query receives.");},
qs:[
{t:"sql",db:KDB,q:"How many salary rows does an employee have? Count the rows per employee in a derived table, then return one row: the average count rounded to 2 decimals, the largest count and the smallest count (in that order).",
 answer:"SELECT ROUND(AVG(revisions), 2) AS avg_revisions, MAX(revisions) AS most, MIN(revisions) AS fewest FROM (SELECT emp_no, COUNT(*) AS revisions FROM salaries GROUP BY emp_no) AS per_emp",

{t:"sql",db:KDB,q:"Interview classic: the department with the highest average pay. Using current department assignments and current salaries (both with to_date = '9999-01-01'), return dept_name and its average current salary rounded to 2 decimals, for the top department only.",

{t:"sql",db:KDB,q:"Which departments have an average current salary above the average of the nine department averages? Return dept_name and the department's average rounded to 2 decimals.",

{t:"sql",db:KDB,q:"Subquery or join? List the dept_name of every department, once each, that has at least one current employee (dept_emp.to_date = '9999-01-01') hired on or after '2026-05-01'.",

 hint:"WHERE dept_no IN (… the dept_no of recent hires …) returns each department once. A plain join returns one row per recent hire: add DISTINCT if you join.",
 why:"7 departments. <code>SELECT dept_name FROM departments WHERE dept_no IN (SELECT de.dept_no FROM dept_emp de JOIN employees e ON e.emp_no = de.emp_no WHERE de.to_date = '9999-01-01' AND e.hire_date &gt;= '2026-05-01')</code>. Joining departments to the 18 recent hires without DISTINCT returns 18 rows: the fan-out that IN and EXISTS cannot produce."},
{t:"sql",db:KDB,q:"Team size. Among people who have at least one direct report, what is the average number of direct reports? Return one number rounded to 2 decimals.",
 answer:"SELECT ROUND(AVG(reports), 2) AS avg_reports FROM (SELECT manager_no, COUNT(*) AS reports FROM employees WHERE manager_no IS NOT NULL GROUP BY manager_no) AS teams",

{t:"mcq",q:"Departments has 9 rows; 18 current employees were hired on or after 1 May 2026, in 7 departments. How many rows does <code>SELECT d.dept_name FROM departments d JOIN dept_emp de … JOIN employees e … WHERE … e.hire_date &gt;= '2026-05-01'</code> return, and how many does the IN version return?",

L.push({id:"l6",badge:"Pipeline Writer",code:"File 6",title:"Name the steps",topics:"Common Table Expressions (WITH), several CTEs, a CTE that reads an earlier one, a CTE used twice, readability",
story:`<b>The report a colleague can check.</b> The draft pay report is one SELECT, forty lines long, with the same derived table pasted in twice. The chief auditor sends it back: "I cannot review what I cannot read. Give every step a name, in the order you thought of it." That is exactly what a Common Table Expression does.`,
brief:`<p>A <span class="term">Common Table Expression</span> (CTE) is a named temporary result defined with WITH at the start of a statement and then used by the main query like a table. It lives only for that one statement; nothing is stored. Introduced in the SQL:1999 standard, it is supported by MySQL from version 8.0 and by SQLite.</p>
<div class="formula">WITH cur_pay AS (                       -- step 1: name it
  SELECT de.emp_no, de.dept_no, s.salary
  FROM dept_emp de
  JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'
  WHERE de.to_date = '9999-01-01'
),
dept_avg AS (                           -- step 2 reads step 1
  SELECT dept_no, AVG(salary) AS avg_salary, COUNT(*) AS staff
  FROM cur_pay
  GROUP BY dept_no
)
SELECT d.dept_name, ROUND(a.avg_salary, 2) AS avg_salary
FROM dept_avg a
JOIN departments d ON d.dept_no = a.dept_no
ORDER BY a.avg_salary DESC;</div>
<p>The rules: one WITH, several CTEs separated by commas; each CTE can read the ones defined before it; the main query can use any of them, as often as it likes; computed columns need names. The query now reads top to bottom, in the order a person thinks, instead of inside out.</p>
<p>A CTE used twice replaces the duplicated derived table of File 5: "departments whose average is above the average department" becomes <code>… FROM dept_avg WHERE avg_salary &gt; (SELECT AVG(avg_salary) FROM dept_avg)</code>. A CTE is about <span class="term">readability and reuse within one statement</span>, not speed: the database may compute it once or fold it into the main query, and the result is the same as the equivalent subquery. A query you want to keep and share across statements is a view (File 8).</p>
${MN("CTEs need MySQL 8.0 or later; MySQL 5.7 has no WITH. The syntax shown here is identical in MySQL 8.0 and SQLite. A CTE that refers to itself needs WITH RECURSIVE in MySQL (File 7).")}`,
refs:"SQLite documentation, \"The WITH Clause\" (lang_with.html) · MySQL 8.0 Reference Manual, \"WITH (Common Table Expressions)\" · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020) · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020).",
lab:root=>{labCTE(root);plainConsole(root,"karya",[
  ["Two CTEs","WITH cur_pay AS (\n  SELECT de.emp_no, de.dept_no, s.salary\n  FROM dept_emp de\n  JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'\n  WHERE de.to_date = '9999-01-01'\n),\ndept_avg AS (\n  SELECT dept_no, AVG(salary) AS avg_salary, COUNT(*) AS staff\n  FROM cur_pay\n  GROUP BY dept_no\n)\nSELECT * FROM dept_avg ORDER BY avg_salary DESC;"],
  ["A CTE used twice","WITH dept_staff AS (\n  SELECT dept_no, COUNT(*) AS staff\n  FROM dept_emp\n  WHERE to_date = '9999-01-01'\n  GROUP BY dept_no\n)\nSELECT dept_no, staff\nFROM dept_staff\nWHERE staff > (SELECT AVG(staff) FROM dept_staff);"],
  ["Promotions per year","WITH first_title AS (\n  SELECT emp_no, MIN(from_date) AS first_from\n  FROM titles\n  GROUP BY emp_no\n),\npromotions AS (\n  SELECT t.emp_no, t.title, t.from_date\n  FROM titles t\n  JOIN first_title f ON f.emp_no = t.emp_no\n  WHERE t.from_date > f.first_from\n)\nSELECT strftime('%Y', from_date) AS yr, COUNT(*) AS promotions\nFROM promotions\nGROUP BY yr\nORDER BY yr;"]],"Write your own WITH queries here. Each CTE can be tested alone: replace the final SELECT with SELECT * FROM that_cte.");},
qs:[
{t:"sql",db:KDB,ordered:true,q:"No setup this time: define cur_pay yourself in a WITH (current department and current salary of each current employee), then return dept_name and the department's average current salary rounded to 2 decimals, highest average first.",
 answer:"WITH cur_pay AS (SELECT de.emp_no, de.dept_no, s.salary FROM dept_emp de JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01' WHERE de.to_date = '9999-01-01') SELECT d.dept_name, ROUND(AVG(c.salary), 2) AS avg_salary FROM cur_pay c JOIN departments d ON d.dept_no = c.dept_no GROUP BY d.dept_name ORDER BY avg_salary DESC",
 hint:"WITH cur_pay AS ( …the three-table definition from File 3… ) SELECT d.dept_name, ROUND(AVG(c.salary), 2) … GROUP BY d.dept_name ORDER BY 2 DESC.",
 why:"The CTE is the File 3 working table, now defined inside the statement: nothing is created in the database. Engineering ₹131,823.10 down to Customer Service ₹69,866.37. Run <code>WITH cur_pay AS (…) SELECT COUNT(*) FROM cur_pay</code> first to check the step: 1,276 rows."},
{t:"sql",db:KDB,q:"Two CTEs: cur_pay as before, and company with one row holding the average salary of cur_pay. Return dept_no and the department's average rounded to 2 decimals for departments whose average is above the company average.",

 hint:"WITH cur_pay AS (…), company AS (SELECT AVG(salary) AS avg_all FROM cur_pay) SELECT … FROM cur_pay GROUP BY dept_no HAVING AVG(salary) &gt; (SELECT avg_all FROM company).",
 why:"d005 (Engineering), d008 (Research) and d002 (Finance) are above ₹100,362.74. The second CTE reads the first; HAVING compares each group's average with the one-row company CTE. CROSS JOIN company and comparing a.avg_salary &gt; c.avg_all works too."},
{t:"sql",db:KDB,q:"A CTE used twice. Define dept_staff (dept_no, staff) as the number of current dept_emp rows per department. Return dept_no and staff for departments whose staff is above the average staff of all departments.",
 answer:"WITH dept_staff AS (SELECT dept_no, COUNT(*) AS staff FROM dept_emp WHERE to_date = '9999-01-01' GROUP BY dept_no) SELECT dept_no, staff FROM dept_staff WHERE staff > (SELECT AVG(staff) FROM dept_staff)",
 hint:"FROM dept_staff WHERE staff &gt; (SELECT AVG(staff) FROM dept_staff): the same CTE in the main query and in the subquery.",
 why:"Operations (208), Engineering (231) and Sales (221) are above the average of 141.78. Without the CTE, the COUNT per department would have to be written twice, as in File 5's third challenge."},
{t:"sql",db:KDB,ordered:true,q:"Promotions per year. A promotion is a titles row that starts after the employee's first title. Use one CTE for each employee's first title start date (MIN(from_date) per emp_no) and a second that reads it to keep only later title rows. Return the year (strftime('%Y', from_date)) and the number of promotions, by year.",
 answer:"WITH first_title AS (SELECT emp_no, MIN(from_date) AS first_from FROM titles GROUP BY emp_no), promotions AS (SELECT t.emp_no, t.from_date FROM titles t JOIN first_title f ON f.emp_no = t.emp_no WHERE t.from_date > f.first_from) SELECT strftime('%Y', from_date) AS yr, COUNT(*) AS promotions FROM promotions GROUP BY yr ORDER BY yr",
 hint:"first_title: SELECT emp_no, MIN(from_date) … GROUP BY emp_no. promotions: titles joined to first_title WHERE t.from_date &gt; f.first_from. Then group by strftime('%Y', from_date).",
 why:"18 years, from 6 promotions in 2009 to 150 in 2025, the busiest year (2026 is not over). The second CTE reads the first."+MN("This game (SQLite) writes the year as strftime('%Y', from_date), which returns text such as '2023'. In MySQL write YEAR(from_date), which returns a number.")},
{t:"sql",db:KDB,q:"Pay outliers, without a correlated subquery. With a CTE of department averages joined back to cur_pay (also a CTE), return emp_no, dept_no and salary of current employees paid at least 1.5 times their department's average.",
 answer:"WITH cur_pay AS (SELECT de.emp_no, de.dept_no, s.salary FROM dept_emp de JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01' WHERE de.to_date = '9999-01-01'), dept_avg AS (SELECT dept_no, AVG(salary) AS avg_salary FROM cur_pay GROUP BY dept_no) SELECT c.emp_no, c.dept_no, c.salary FROM cur_pay c JOIN dept_avg a ON a.dept_no = c.dept_no WHERE c.salary >= 1.5 * a.avg_salary",
 hint:"dept_avg computes nine averages once; join it to cur_pay on dept_no and keep c.salary &gt;= 1.5 * a.avg_salary.",
 why:"150 people. This is File 3's correlated query turned inside out: the nine averages are computed once, then joined. Same rows as <code>WHERE c.salary &gt;= 1.5 * (SELECT AVG(c2.salary) FROM cur_pay c2 WHERE c2.dept_no = c.dept_no)</code>."},
{t:"mcq",q:"You define <code>WITH dept_avg AS (…) SELECT …;</code> and the statement runs. In the next statement you write <code>SELECT * FROM dept_avg;</code>. What happens?",
 opts:["An error: no such table dept_avg, because a CTE lives only for its own statement","It returns the rows computed by the previous statement","It recomputes dept_avg from its definition","It returns an empty table"],a:0,
 hint:"Is a CTE stored anywhere?",
 why:"A CTE belongs to one statement and disappears with it. To reuse a named query across statements and sessions, create a view (File 8)."},
{t:"mcq",q:"A colleague says: \"Rewrite the report with CTEs, it will run faster.\" Best reply?",
 opts:["CTEs make it clearer and avoid repeating a subquery; speed depends on the engine's plan, not on the syntax","Yes, a CTE is always computed once and cached","No, CTEs are always slower than subqueries","CTEs only work for recursive queries"],a:0,
 hint:"What does a CTE change for the reader, and what for the engine?",

]});

L.push({id:"l7",badge:"Org Charter",code:"File 7",title:"Down the reporting line",topics:"Recursive CTEs: anchor and recursive members, number and date series, the org chart from the CEO, levels, paths, chains of command, stopping",
story:`<b>Who reports to whom, all the way down.</b> The board wants the full reporting structure: how many layers, how many people under each department head, and the chain of command above any employee the cell flags. employees.manager_no gives one step at a time. A self-join (Module 3) climbs one level; to climb an unknown number of levels you need a query that calls itself.`,
brief:`<p>A <span class="term">recursive CTE</span> refers to itself. It has two parts joined by UNION ALL: the <span class="term">anchor member</span>, which runs once and gives the starting rows, and the <span class="term">recursive member</span>, which reads the rows produced in the previous round and produces the next ones. The rounds repeat until the recursive member returns no rows.</p>
<div class="formula">WITH RECURSIVE nums (n) AS (
  SELECT 1                          -- anchor
  UNION ALL
  SELECT n + 1 FROM nums            -- recursive member
  WHERE n &lt; 10                      -- stopping condition
)
SELECT n FROM nums;</div>
<p>For a hierarchy, the anchor is the top (the CEO, whose manager_no is NULL) and the recursive member joins employees to the rows found so far: "everyone whose manager is someone we already have". Carrying extra columns gives the <span class="term">level</span> and a <span class="term">path</span> string:</p>
<div class="formula">WITH RECURSIVE org (emp_no, lvl, path) AS (
  SELECT emp_no, 1, CAST(emp_no AS TEXT)
  FROM employees
  WHERE manager_no IS NULL
  UNION ALL
  SELECT e.emp_no, o.lvl + 1, o.path || ' &gt; ' || e.emp_no
  FROM employees e
  JOIN org o ON e.manager_no = o.emp_no
)
SELECT lvl, COUNT(*) AS people FROM org GROUP BY lvl;</div>
<p>Walking upwards is the same pattern reversed: anchor on one employee, then join to the row whose emp_no is the previous row's manager_no; it stops at the CEO, whose manager_no is NULL. A <span class="term">stopping condition</span> is essential: if the data contain a cycle (A reports to B, B reports to A) the recursion never runs out of rows. A guard such as <code>WHERE o.lvl &lt; 20</code> in the recursive member, or a LIMIT on the final SELECT, ends it.</p>
${MN("MySQL 8.0 requires the word RECURSIVE whenever a CTE refers to itself; SQLite accepts it with or without, so always write it. MySQL stops a runaway recursion at cte_max_recursion_depth, 1,000 iterations by default; SQLite has no such limit, and this game stops any query after 6 seconds. In MySQL a column's type is fixed by the anchor member, so a path that grows needs room from the start: CAST(emp_no AS CHAR(200)); and its string concatenation is CONCAT(o.path, ' &gt; ', e.emp_no), because || means OR there by default.")}`,
refs:"SQLite documentation, \"The WITH Clause\", recursive common table expressions and hierarchical query examples · MySQL 8.0 Reference Manual, \"WITH (Common Table Expressions)\", recursive CTEs and cte_max_recursion_depth · Silberschatz, Korth &amp; Sudarshan (7th ed., 2019), ch. 5 (recursive queries) · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), chapter on hierarchical queries.",
lab:root=>{labTree(root);sbTree(root);},
qs:[
{t:"sql",db:KDB,ordered:true,q:"A date series. With a recursive CTE, return the first day of every month of 2026, '2026-01-01' to '2026-12-01', as one column in date order.",
 answer:"WITH RECURSIVE months (d) AS (SELECT '2026-01-01' UNION ALL SELECT date(d, '+1 month') FROM months WHERE d < '2026-12-01') SELECT d FROM months",
 hint:"Anchor: SELECT '2026-01-01'. Recursive member: SELECT date(d, '+1 month') FROM months WHERE d &lt; '2026-12-01'.",
 why:"<code>WITH RECURSIVE months (d) AS (SELECT '2026-01-01' UNION ALL SELECT date(d, '+1 month') FROM months WHERE d &lt; '2026-12-01') SELECT d FROM months</code>: 12 rows. Such a 'calendar spine' is a standard trick for reports that must show months with no activity."+MN("In MySQL: DATE_ADD(d, INTERVAL 1 MONTH) instead of date(d, '+1 month'), and the anchor should be a real DATE, CAST('2026-01-01' AS DATE).")},
{t:"sql",db:KDB,ordered:true,q:"The org chart from the CEO. Starting from the employee whose manager_no is NULL (level 1), return each level and the number of people on it, by level.",
 answer:"WITH RECURSIVE org (emp_no, lvl) AS (SELECT emp_no, 1 FROM employees WHERE manager_no IS NULL UNION ALL SELECT e.emp_no, o.lvl + 1 FROM employees e JOIN org o ON e.manager_no = o.emp_no) SELECT lvl, COUNT(*) AS people FROM org GROUP BY lvl ORDER BY lvl",
 hint:"Anchor: SELECT emp_no, 1 FROM employees WHERE manager_no IS NULL. Recursive: SELECT e.emp_no, o.lvl + 1 FROM employees e JOIN org o ON e.manager_no = o.emp_no. Then GROUP BY lvl.",
 why:"Four levels: 1, 29, 330 and 1,040 people, 1,400 in all, so every employee is reachable from the CEO. Level 2 holds the eight other department heads and the Engineering team leads, who report to the CEO directly because the CEO also heads Engineering."},
{t:"sql",db:KDB,ordered:true,q:"Interview classic: the chain of command. For employee 10096, return emp_no and step (0 for 10096, 1 for their manager, and so on up to the CEO), ordered by step.",
 answer:"WITH RECURSIVE up (emp_no, manager_no, step) AS (SELECT emp_no, manager_no, 0 FROM employees WHERE emp_no = 10096 UNION ALL SELECT e.emp_no, e.manager_no, u.step + 1 FROM employees e JOIN up u ON e.emp_no = u.manager_no) SELECT emp_no, step FROM up ORDER BY step",
 hint:"Anchor on emp_no = 10096; the recursive member joins employees e ON e.emp_no = u.manager_no (one step up). Carry manager_no in the CTE so the next round can use it.",
 why:"10096 → 10070 → 10683 → 10493: four rows (10683 heads Quality), steps 0 to 3. The recursion ends because the CEO's manager_no is NULL and e.emp_no = NULL matches nothing."},
{t:"sql",db:KDB,q:"How many people are under 10080, the head of Operations, directly or indirectly? Return one number (not counting 10080).",
 answer:"WITH RECURSIVE sub (emp_no) AS (SELECT emp_no FROM employees WHERE manager_no = 10080 UNION ALL SELECT e.emp_no FROM employees e JOIN sub s ON e.manager_no = s.emp_no) SELECT COUNT(*) AS people_below FROM sub",
 hint:"Anchor: the direct reports (manager_no = 10080). Recursive member: everyone whose manager_no is in sub. Count the rows.",
 why:"232 people. Anchoring on the direct reports leaves 10080 out; anchoring on 10080 and subtracting 1 gives the same. In karya, Operations' head manages the leads, who manage everyone else."},
{t:"sql",db:KDB,q:"Path strings. Build each person's path from the CEO as text such as '10493 > 10027 > 10001' (emp_no values joined with ' > '), and return the path of employee 10096 only.",
 answer:"WITH RECURSIVE org (emp_no, path) AS (SELECT emp_no, CAST(emp_no AS TEXT) FROM employees WHERE manager_no IS NULL UNION ALL SELECT e.emp_no, o.path || ' > ' || e.emp_no FROM employees e JOIN org o ON e.manager_no = o.emp_no) SELECT path FROM org WHERE emp_no = 10096",
 hint:"Anchor: CAST(emp_no AS TEXT) for the CEO. Recursive: o.path || ' &gt; ' || e.emp_no. Filter the final SELECT to emp_no = 10096.",

{t:"mcq",q:"A recursive CTE over a reporting table that contains a cycle (A reports to B, B reports to A) has no stopping condition. What happens?",
 opts:["MySQL stops with an error at cte_max_recursion_depth (1,000 by default); SQLite keeps going until something stops it (here, the 6-second limit)","Both engines detect the cycle and stop after one loop","Both return an empty result","The anchor member runs forever"],a:0,

L.push({id:"l8",badge:"View Keeper",code:"File 8",title:"Saved questions",topics:"Views: CREATE VIEW, querying, views on views, what a view stores, updatable views, DROP VIEW, CREATE OR REPLACE",
story:`<b>Handing over.</b> The audit is ending, but the questions will be asked again next quarter. The cell decides to leave its definitions in the database: "current pay" defined once, correctly, under a name anyone can query. A colleague in payroll should be able to see names and hire dates without seeing birth dates. All of that is a view.`,
brief:`<p>A <span class="term">view</span> is a SELECT statement saved in the database under a name, which can then be queried like a table; it is often called a <span class="term">virtual table</span>, and the tables it reads are its <span class="term">base tables</span>. A view stores the query, never the rows. Every time it is used, the query runs again on the current base tables, so a view is never out of date.</p>
<div class="formula">CREATE VIEW v_cur_pay AS
  SELECT de.emp_no, de.dept_no, s.salary
  FROM dept_emp de
  JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'
  WHERE de.to_date = '9999-01-01';

SELECT dept_no, COUNT(*) FROM v_cur_pay GROUP BY dept_no;   -- like a table
DROP VIEW v_cur_pay;                                         -- removes the name only</div>
<p>Why organisations use views: <span class="term">simplicity</span> (a three-table join becomes one name), <span class="term">consistency</span> (everyone uses the same definition of "current pay"), and <span class="term">security</span> (a view with some columns can be shared while the table is not). A view can be built on another view (a nested view); each layer is resolved when queried, which hides cost, so keep nesting shallow. A view gives no speed by itself: its query runs every time.</p>
<p><span class="term">Changing data through a view</span>: if each row of the view is exactly one row of one base table (no joins, GROUP BY, aggregates, DISTINCT or UNION), MySQL lets INSERT, UPDATE and DELETE pass through to the base table. A grouped view has no single base row to change, so it is read-only everywhere.</p>
${MN("SQLite views are always read-only: UPDATE on a view gives 'cannot modify … because it is a view', unless an INSTEAD OF trigger says what to do (the lab shows one; triggers are Module 7). MySQL 8.0 updates simple views directly, and WITH CHECK OPTION stops changes that would move a row out of the view. MySQL has CREATE OR REPLACE VIEW; SQLite does not: write DROP VIEW IF EXISTS v; then CREATE VIEW v AS …. To list views, MySQL uses SHOW FULL TABLES WHERE Table_type = 'VIEW'; SQLite: SELECT name FROM sqlite_master WHERE type = 'view'.")}
<p><b>Subquery, CTE or view?</b> A subquery or CTE belongs to one statement; a view belongs to the database. Use a subquery for a short, one-off step; a CTE when a statement has several steps or uses one twice; a view when the same definition must be shared, reused tomorrow or protected.</p>`,
refs:"SQLite documentation, \"CREATE VIEW\", \"DROP VIEW\" and \"CREATE TRIGGER\" (INSTEAD OF triggers) · MySQL 8.0 Reference Manual, \"CREATE VIEW Statement\" and \"Updatable and Insertable Views\" · Elmasri &amp; Navathe (7th ed., 2016), ch. 7 (views) · Silberschatz, Korth &amp; Sudarshan (7th ed., 2019), ch. 4 (views) · Laudon &amp; Laudon, <i>Management Information Systems</i> (17th ed., 2022), ch. 6.",
lab:root=>{labViews(root);plainConsole(root,"karya",[
  ["Create v_cur_pay","DROP VIEW IF EXISTS v_cur_pay;\nCREATE VIEW v_cur_pay AS\n  SELECT de.emp_no, de.dept_no, s.salary\n  FROM dept_emp de\n  JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01'\n  WHERE de.to_date = '9999-01-01';\nSELECT * FROM v_cur_pay LIMIT 10;"],
  ["Query the view","SELECT dept_no, COUNT(*) AS staff, ROUND(AVG(salary), 2) AS avg_salary\nFROM v_cur_pay\nGROUP BY dept_no\nORDER BY avg_salary DESC;"],
  ["List the views","SELECT name, sql\nFROM sqlite_master\nWHERE type = 'view';"],
  ["Try to update it","UPDATE v_cur_pay SET salary = 1 WHERE emp_no = 10001;"],
  ["Drop it","DROP VIEW IF EXISTS v_cur_pay;"]],"Views you create here live in your copy of karya until you press Reset database.");},
qs:[
{t:"sql",db:KDB,check:"SELECT emp_no, dept_no, salary FROM v_cur_pay",q:"Make the definition permanent. Create a view named v_cur_pay with columns emp_no, dept_no and salary: each current employee's current department and current salary (the cur_pay definition from File 3).",
 answer:"CREATE VIEW v_cur_pay AS SELECT de.emp_no, de.dept_no, s.salary FROM dept_emp de JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01' WHERE de.to_date = '9999-01-01'",

{t:"sql",db:KDB,setup:SETUP_VIEW,q:"v_cur_pay exists. Query it: return dept_no and headcount for departments with at least 150 current employees.",

{t:"sql",db:KDB,setup:SETUP_VIEW,check:"SELECT dept_no, headcount, avg_salary FROM v_dept_pay",q:"A view on a view. v_cur_pay exists. Create v_dept_pay with columns dept_no, headcount and avg_salary (the average salary rounded to 2 decimals), one row per department, reading from v_cur_pay.",

{t:"sql",db:KDB,setup:"DROP VIEW IF EXISTS v_old_report;\nCREATE VIEW v_old_report AS SELECT * FROM employees;",check:"SELECT emp_no, first_name, last_name, hire_date, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'view' AND name = 'v_old_report') AS old_views_left FROM v_directory",q:"Security by view. An old view v_old_report exposes every column of employees, birth_date and gender included. Drop it, then create v_directory with only emp_no, first_name, last_name and hire_date from employees.",

 why:"<code>DROP VIEW v_old_report; CREATE VIEW v_directory AS SELECT emp_no, first_name, last_name, hire_date FROM employees;</code>. Dropping a view deletes nothing in employees. In MySQL the administrator would then GRANT SELECT on v_directory, not on employees (permissions are Module 7)."},
{t:"sql",db:KDB,setup:SETUP_VIEW,q:"Views and subqueries combine. Using only v_cur_pay, return emp_no and salary of everyone in the department with the highest average salary. Do not type the department code.",
 answer:"SELECT emp_no, salary FROM v_cur_pay WHERE dept_no = (SELECT dept_no FROM v_cur_pay GROUP BY dept_no ORDER BY AVG(salary) DESC LIMIT 1)",
 hint:"Inner query: SELECT dept_no FROM v_cur_pay GROUP BY dept_no ORDER BY AVG(salary) DESC LIMIT 1. Outer: rows of v_cur_pay with that dept_no.",
 why:"<code>SELECT emp_no, salary FROM v_cur_pay WHERE dept_no = (SELECT dept_no FROM v_cur_pay GROUP BY dept_no ORDER BY AVG(salary) DESC LIMIT 1)</code>: the 231 people of d005, Engineering. File 5's interview classic, but nobody had to rebuild the current-pay join: the definition lives in the database. (LIMIT inside a scalar subquery after = is fine in MySQL too; only IN, ANY and ALL subqueries forbid it.)"},
{t:"mcq",q:"In this game you run <code>UPDATE v_directory SET last_name = 'Rao' WHERE emp_no = 10001;</code> where v_directory is a simple one-table view. What happens, and what would MySQL 8.0 do?",
 opts:["SQLite refuses (its views are read-only without an INSTEAD OF trigger); MySQL updates the employees row","Both update the employees row","Both refuse, because views are always read-only","SQLite updates a copy stored in the view; MySQL refuses"],a:0,
 hint:"Look at the gold box in the theory.",
 why:"SQLite: 'cannot modify v_directory because it is a view'. MySQL: each row of v_directory is one employees row, so the UPDATE passes through. A view never holds its own copy of the rows."},
{t:"mcq",q:"The cell creates v_cur_pay today. Tomorrow HR adds a new hire with a department row and a salary row. Does SELECT COUNT(*) FROM v_cur_pay include the new hire?",
 opts:["Yes, immediately: the view re-runs its query on the base tables each time","Only after the view is dropped and created again","Only after a REFRESH command","No: a view is a snapshot of the day it was created"],a:0,
 hint:"What does a view store?",
 why:"A view stores only its SELECT. Each use runs it against the current tables, so new rows appear at once. (A stored copy that must be refreshed is a different object, a materialised view, which neither MySQL nor SQLite has.)"}
]});

const BOARD=[
{t:"mcq",q:"<code>WHERE emp_no = (SELECT emp_no FROM dept_manager)</code>, where the subquery returns 18 rows. Which statement is true?",opts:["MySQL raises error 1242; SQLite silently uses the first row","Both return the 18 managers","Both raise an error","Both return nothing"],a:0,why:"= needs one value. MySQL refuses; SQLite takes the first row, which is why a wrong query can look right in SQLite. Use IN for lists."},
{t:"mcq",q:"<code>SELECT COUNT(*) FROM employees WHERE emp_no NOT IN (SELECT manager_no FROM employees);</code> returns 0 in a company where most people manage nobody. Why?",opts:["The subquery's list contains a NULL, so every NOT IN comparison is UNKNOWN","COUNT(*) ignores NULLs","NOT IN only works with numbers typed by hand","manager_no needs an index"],a:0,why:"x NOT IN (…, NULL) expands to … AND x &lt;&gt; NULL, which is UNKNOWN; WHERE keeps only TRUE. Filter the NULL out or use NOT EXISTS."},
{t:"num",q:"<code>SELECT d.dept_name, (SELECT COUNT(*) FROM dept_emp de WHERE de.dept_no = d.dept_no) FROM departments d;</code> runs on a departments table with 9 rows. Conceptually, how many times is the inner query evaluated?",a:9,tol:0,why:"It is correlated (de.dept_no = d.dept_no), so it is evaluated once per outer row: 9 times."},
{t:"mcq",q:"Which SQLite condition means the same as MySQL's <code>salary &gt; ALL (SELECT salary FROM cur_pay WHERE dept_no = 'd009')</code> when the subquery returns at least one non-NULL row and no NULLs?",opts:["salary &gt; (SELECT MAX(salary) FROM cur_pay WHERE dept_no = 'd009')","salary &gt; (SELECT MIN(salary) FROM cur_pay WHERE dept_no = 'd009')","salary IN (SELECT salary FROM cur_pay WHERE dept_no = 'd009')","salary &gt; (SELECT AVG(salary) FROM cur_pay WHERE dept_no = 'd009')"],a:0,why:"Greater than every value means greater than the largest. (&gt; ANY would be &gt; MIN.) They differ only for an empty list or NULLs, where NOT EXISTS matches ALL."},
{t:"num",q:"To return the 3rd highest distinct salary with <code>SELECT DISTINCT salary FROM salaries ORDER BY salary DESC LIMIT 1 OFFSET k</code>, what is k?",a:2,tol:0,why:"OFFSET skips N − 1 values: for the 3rd highest, skip 2."},
{t:"mcq",q:"What does a view store?",opts:["Its SELECT statement only; rows are produced each time it is queried","A copy of the rows as they were when it was created","An index on the base tables","The rows, refreshed every night"],a:0,why:"A view is a named query. That is why it is always current, why it gives no speed of its own, and why dropping it deletes no data."},
{t:"mcq",q:"In a recursive CTE for an org chart, what ends the recursion when the data have no cycles?",opts:["A round in which the recursive member returns no rows (nobody reports to the people just added)","The anchor member returning NULL","MySQL's cte_max_recursion_depth, always","The final SELECT's GROUP BY"],a:0,why:"Each round adds the reports of the previous round's people; at the bottom of the tree nobody is left, the round is empty, and the CTE is complete. The depth limit is a safety net for cycles, not the normal end."},
{t:"mcq",q:"Which statement about derived tables and CTEs is correct?",opts:["Both exist only for one statement; a CTE can be referred to several times by name, a derived table must be written out each time","A CTE is stored in the database like a view","Derived tables are faster than CTEs by definition","A CTE cannot contain GROUP BY"],a:0,why:"Both are temporary, statement-scoped results. The CTE's advantage is a name: defined once at the top, used as often as needed, read top to bottom. Speed depends on the engine's plan."}
];

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},html)=>{const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!==undefined)e.innerHTML=html;return e;};
const fmt=(x,d=4)=>Number(x).toFixed(d);
const pct=(x,d=1)=>(100*x).toFixed(d)+"%";
const ind=x=>Number(x).toLocaleString("en-US");
const SVGNS="http://www.w3.org/2000/svg";
const sv=(tag,attrs={})=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffled(n,seed){const o=[...Array(n).keys()];const r=rng(seed);for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[o[k],o[j]]=[o[j],o[k]];}return o;}
const lnFact=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s;};
const binomPMF=(k,n,p)=>Math.exp(lnFact(n)-lnFact(k)-lnFact(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p));
const poisPMF=(k,l)=>Math.exp(k*Math.log(l)-l-lnFact(k));
const normPDF=(x,m,s)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
function sampleAmount(r){const u=r()*100;let lo=0,hi=AMTK.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(AMTK[m]<=u)lo=m;else hi=m;}const t=(u-AMTK[lo])/(AMTK[hi]-AMTK[lo]);return AMTV[lo]+(AMTV[hi]-AMTV[lo])*t;}
function sampleDaily(r){const u=r()*90;let c=0;for(const x of Object.keys(DAILY)){c+=DAILY[x];if(u<c)return +x;}return 17;}
function canvasSetup(c,w,h){const dpr=Math.min(2,window.devicePixelRatio||1);c.width=w*dpr;c.height=h*dpr;c.style.aspectRatio=`${w} / ${h}`;const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);return g;}
const runners=new Set(); // active animation loops, stopped on navigation
function loop(fn){let id,on=true;const step=()=>{if(!on)return;fn();id=requestAnimationFrame(step);};id=requestAnimationFrame(step);const h={stop(){on=false;cancelAnimationFrame(id);runners.delete(h);}};runners.add(h);return h;}
function stopAll(){[...runners].forEach(r=>r.stop());}

const save=()=>{try{S.summary={title:COURSE.title,xp:S.xp,cleared:L.filter(levelDone).length,total:L.length,badges:S.badges.length,board:S.board?S.board.score:null,boardTotal:BOARD.length};localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

const BADGES=[...L.map((lv,i)=>[lv.id,lv.badge,"Cleared file "+(i+1)]),["streak5","Hot Hand","Five first-try answers in a row"],["clean","Clean Sheet","A whole file, first try, no hints"],...(COURSE.badges||[]),["explorer","Sandbox Explorer","Opened a sandbox and played with your own settings or data"],["board",COURSE.topRank,"Passed the board meeting ("+COURSE.boardPass+" of "+BOARD.length+")"]];

function toast(html){const t=el("div",{class:"toast"},html);$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3200);}
function addXP(n,why){if(n<=0)return;S.xp+=n;save();toast(`<b>+${n} XP</b> · ${why}`);renderStrip();}
