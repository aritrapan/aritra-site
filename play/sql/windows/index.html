<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>SaralMart Analytics Bench</title>
<meta name="description" content="Ranking, LAG and LEAD, running totals, top-N per group, de-duplication, gaps and islands, cohorts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case desk. Sticky status strip (rank, XP, streak); a live transaction-flow
   simulation as the hero; case files as a grid; an opened file is a single-column dossier:
   story, theory, lab, challenges. */
:root{
  --bg:#EAEFF4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#13233A; --muted:#566880; --line:#C9D3DF;
  --accent:#1F5FA8; --accent-soft:#DCE7F5; --gold:#A86E06; --gold-soft:#F6E7C8;
  --fraud:#B3263E; --fraud-soft:#F7DCE1; --ok:#1B7349; --ok-soft:#D7EFE2;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.strip .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .rank{font:700 1.05rem/1.1 var(--display)}
.xpbox{flex:1 1 220px;display:flex;flex-direction:column;gap:5px;min-width:0}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
.xpmeta{display:flex;justify-content:space-between;font:400 .8rem/1 var(--mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 11px;font:600 .82rem/1.2 var(--mono);white-space:nowrap}
a.chip{text-decoration:none;color:var(--accent)}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}

/* hero */
.hero{display:grid;gap:18px;padding-block:30px 10px}
.hero p.lede{font-size:1.08rem;max-width:62ch;margin-top:12px}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:8px;max-width:62ch}
.herotop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:720px){.herotop{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:.92rem}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ticket .row:last-child{border-bottom:0;padding-bottom:0}
.ticket .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flow simulation */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0}
.flow canvas{width:100%;height:auto;display:block;max-width:100%;border-radius:6px}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.flowbar .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.flowstats div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:1px}
.flowstats span{font-size:.72rem;color:var(--muted)}
.flowstats b{font:600 1.05rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font:600 .8rem/1.2 var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:transform .15s,border-color .15s}
.case:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.55}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .tag{font:600 .72rem/1 var(--mono);letter-spacing:.1em;color:var(--accent)}
.case h3{font-size:1.25rem}
.case .nick{font-size:.9rem;color:var(--muted)}
.case .topics{font-size:.85rem;color:var(--muted);margin-top:auto}
.stars{font-size:1rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.stamp{font:700 .7rem/1 var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok)} .stamp.lock{color:var(--muted)} .stamp.open{color:var(--accent)}
.case.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case.boss .tag,.case.boss .nick,.case.boss .topics{color:var(--bg);opacity:.8}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.badge b{font:600 .95rem/1.2 var(--display);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.badge.got b{color:var(--ink)}
.badge .seal{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}

/* dossier */
.dossier{display:grid;gap:22px;padding-block:24px}
.back{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);display:grid;gap:14px;min-width:0}
.panel>h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .eyebrow{color:var(--accent)}
.brief{display:grid;gap:12px;max-width:70ch}
.brief .term{font-weight:600}
.story{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;max-width:70ch}
.story b{font-style:normal}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.92rem;white-space:pre;line-height:1.5}
.refs{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* labs */
.labgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.labgrid{grid-template-columns:1fr}}
svg text{fill:var(--ink);font-family:var(--mono)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
.ctrl{display:grid;gap:6px}
.ctrl label{font-size:.88rem;color:var(--muted)}
.ctrl output{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.readout span{font-size:.76rem;color:var(--muted)}
.readout b{font:600 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.up{color:var(--fraud);font-weight:600}.down{color:var(--ok);font-weight:600}
.target{font:700 1.6rem/1.1 var(--mono);color:var(--accent)}
.regbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-size:.86rem}
.regbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.door{width:30%;aspect-ratio:3/4;max-width:120px;border:2px solid var(--line);background:var(--sunk);border-radius:8px 8px 2px 2px;
  font:700 1.4rem/1 var(--display);display:grid;place-items:center}
.door.pick{border-color:var(--accent);background:var(--accent-soft)}
.door.open{background:var(--bg);color:var(--muted);border-style:dashed}
.door.prize{border-color:var(--gold);background:var(--gold-soft)}
.doors{display:flex;gap:10px;justify-content:flex-start}
.mixbar{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.85rem}
.mixtrack{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mixtrack i{display:block;height:100%;transition:width .8s ease;font:600 .72rem/30px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
.mixtrack i.u{background:var(--accent-soft)}.mixtrack i.c{background:var(--line)}.mixtrack i.n{background:var(--fraud);color:var(--surface)}

/* challenges */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.q:first-of-type{border-top:0;padding-top:0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .eyebrow{white-space:nowrap}
.qtext{font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fraud);background:var(--fraud-soft)}
.opt[disabled]{cursor:default}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:12em}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--fraud-soft);border:1px solid var(--fraud)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b{font-family:var(--display);font-size:1rem}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;max-width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.toast b{color:var(--gold-soft)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sheet .formula{font-size:.84rem}
.sheet h3{font-size:1rem;margin-bottom:6px}
.sandbox{border:1px dashed var(--accent);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;background:var(--sunk);min-width:0;margin-top:14px}
.sb-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sb-head .eyebrow{color:var(--accent)}
.sb-tabs button{border:0;background:transparent;padding:5px 12px;font:600 .8rem/1.2 var(--mono)}
.sb-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sb-pane{display:grid;gap:10px;min-width:0}
.sb-params{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.sb-params label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sb-params input,.sb-params select{width:9.5em;max-width:100%}
.sandbox textarea{width:100%;max-width:100%;font:400 .88rem/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.sandbox input[type=file]{font-size:.82rem;max-width:100%}
.sqlx-console{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.sqlx-console{grid-template-columns:1fr}}
.sqlx-main{display:grid;gap:8px;min-width:0}
.sqlx-editor{width:100%;max-width:100%;font:400 .92rem/1.5 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
.sqlx-editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.sqlx-out{display:grid;gap:8px;min-width:0}
.sqlx-grid{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sqlx-grid table{font:400 .84rem/1.35 var(--mono)}
.sqlx-grid th{position:sticky;top:0;background:var(--sunk);text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink)}
.sqlx-grid td,.sqlx-grid th{white-space:nowrap;text-align:left}
.sqlx-grid td.num{text-align:right}
.sqlx-null{color:var(--muted);font-style:italic}
.sqlx-schema{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}
.sqlx-table summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sqlx-table ul{margin:4px 0 6px;padding-left:12px;list-style:none;display:grid;gap:2px}
.sqlx-col{all:unset;cursor:pointer;font:600 .8rem/1.3 var(--mono);color:var(--accent)}
.sqlx-col:focus-visible{outline:2px solid var(--accent)}
.sqlx-ch{display:grid;gap:8px;min-width:0}
.mysqlnote{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.mysqlnote b{font:600 .72rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
code,.code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wcap{font-size:.92rem;min-height:2.9em;max-width:72ch}
.flow>*,.sb-pane>*,.ctrl>*,.sandbox>*{min-width:0}
.svgbox{min-width:0;max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip" id="strip">
    <div class="who"><span class="eyebrow">Analyst rank</span><span class="rank" id="rank">Trainee Analyst</span></div>
    <div class="xpbox"><div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
      <div class="xpmeta"><span id="xptext">0 XP</span><span id="xpnext"></span></div></div>
    <span class="chip" id="streakchip" title="Correct first-try answers in a row">Streak <b id="streak">0</b></span>
    <span class="chip" title="Badges earned">Badges <b id="badgecount">0</b></span>
    <a class="chip" href="../" id="hublink">All modules</a>
  </div>
  <main id="app"></main>
  <div class="foot">
    <span>SaralMart Analytics Bench · part of <a href="../">SQL, played</a>, a free course you play. Built by <a href="https://aritra.ai" target="_blank" rel="noopener">Aritra Pan</a>. Free to use in teaching.</span>
    <span>Module 5 · Analytics SQL</span>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>window.SQLX_LIB="../lib/";</script>
<script>
(function(){
"use strict";
/* ---------- sandbox toolkit (shared by every module) ----------
   Three levels of free play next to a lab:
     1. controls on the real data   2. generate your own data   3. bring your own data
   SAFETY: everything runs in the visitor's browser. Uploaded or pasted text is never sent anywhere,
   never stored, never put in the URL, and never inserted as HTML: it is only parsed into numbers and
   short labels, which are always displayed with textContent (SB.text / SB.table). Size caps keep phones responsive. */
const SB=(function(){
  const MAX_BYTES=2*1024*1024, MAX_ROWS=5000, MAX_COLS=50, MAX_LABEL=40;
  const used=()=>{try{award("explorer");}catch(e){}};
  /* safe text node helpers */
  function text(tag,str,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(str);return e;}
  /* control characters, bidirectional embedding/override/isolate controls (U+202A–202E, U+2066–2069, which could
     reorder the surrounding sentence on screen) and invisible U+200B, U+2060, U+FEFF are removed; ZWJ/ZWNJ stay (Indic scripts) */
  function cleanLabel(s){s=String(s==null?"":s).replace(/[\u0000-\u001f\u007f-\u009f\u200b\u202a-\u202e\u2060\u2066-\u2069\ufeff]/g,"").trim();return s.length>MAX_LABEL?s.slice(0,MAX_LABEL)+"…":s;}
  /* parse delimited text into {header:[...], rows:[[...]], note} — all values stay plain strings */
  function parse(str){
    str=String(str||"");if(str.length>MAX_BYTES)str=str.slice(0,MAX_BYTES);
    let lines=str.replace(/\r\n?/g,"\n").split("\n").map(l=>l.trim()).filter(l=>l.length);
    let truncated=false;if(lines.length>MAX_ROWS+1){lines=lines.slice(0,MAX_ROWS+1);truncated=true;}
    const note=()=>truncated?`Only the first ${ind(MAX_ROWS)} rows were read.`:"";
    if(!lines.length)return{header:[],rows:[],note:"Nothing to read."};
    // pick a delimiter that splits the first lines into the same number (>1) of fields
    let delim=null,best=1;

  /* ---- MySQL vs SQLite: friendly translations shown when a student writes MySQL-only syntax ---- */

    [/\bCURDATE\s*\(\s*\)|\bCURRENT_DATE\s*\(\s*\)/i,"CURDATE() is MySQL. In SQLite write date('now') (or CURRENT_DATE without brackets)."],
    [/\bDATE_FORMAT\s*\(/i,"DATE_FORMAT(d, '%Y-%m') is MySQL. In SQLite write strftime('%Y-%m', d). Most % codes match; minutes are %M in SQLite but %i in MySQL."],
    [/\bDATEDIFF\s*\(/i,"DATEDIFF(a, b) is MySQL (days from b to a). In SQLite write julianday(a) - julianday(b)."],
    [/\bDATE_ADD\s*\(|\bDATE_SUB\s*\(|\bINTERVAL\s+\d/i,"DATE_ADD(d, INTERVAL 7 DAY) is MySQL. In SQLite write date(d, '+7 days') (or '-1 month', '+1 year')."],

    [/\bAUTO_INCREMENT\b/i,"AUTO_INCREMENT is MySQL. In SQLite an INTEGER PRIMARY KEY column is filled automatically (add AUTOINCREMENT only if numbers must never be reused)."],
    [/\bENUM\s*\(/i,"ENUM(...) is MySQL. In SQLite use TEXT with CHECK (col IN ('a','b','c'))."],
    [/\bSHOW\s+(TABLES|DATABASES|COLUMNS|CREATE)/i,"SHOW TABLES is MySQL. Here use the schema panel, or: SELECT name FROM sqlite_master WHERE type = 'table';  For columns: PRAGMA table_info(table_name);"],
    [/^\s*(DESCRIBE|DESC)\s+\w/im,"DESCRIBE t is MySQL. In SQLite write PRAGMA table_info(t);"],
    [/^\s*USE\s+\w/im,"USE database is MySQL. This game has one database open at a time, so leave it out."],
    [/\bWITH\s+ROLLUP\b/i,"GROUP BY ... WITH ROLLUP is MySQL. SQLite has no ROLLUP: add the subtotal rows with UNION ALL of a second, less detailed GROUP BY."],
    [/\bGROUP_CONCAT\s*\([^)]*\bSEPARATOR\b/i,"GROUP_CONCAT(x SEPARATOR ', ') is MySQL. In SQLite the separator is the second argument: GROUP_CONCAT(x, ', ')."],

    [/\bGRANT\b|\bREVOKE\b|\bCREATE\s+USER\b/i,"GRANT, REVOKE and CREATE USER manage MySQL user accounts. SQLite is a single-user file and has no accounts, so these cannot run here."],

    [/\bCONVERT\s*\(/i,"CONVERT(x, type) is MySQL. Write CAST(x AS INTEGER), CAST(x AS REAL) or CAST(x AS TEXT)."],

  /* result comparison */
  function norm(v){if(v===null||v===undefined)return '∅';if(typeof v==='number'){const x=Math.round(v*100)/100;return 'n:'+(Object.is(x,-0)?0:x);}const s=String(v).trim();if(/^-?\d+(\.\d+)?$/.test(s)){const x=Math.round(parseFloat(s)*100)/100;return 'n:'+x;}return 's:'+s;}

    if(stu.total!==ans.total)return {ok:false,msg:`Your result has ${ind(stu.total)} row${stu.total===1?'':'s'}; the expected one has ${ind(ans.total)}.`};
    const A=stu.values.map(r=>r.map(norm).join('␟')),B=ans.values.map(r=>r.map(norm).join('␟'));

  async function check(q,sql){

SQLX.addDB("saralmart",DB_SARALMART);
SQLX.addDB("karya",DB_KARYA);
/* ===== Module 5 · Window functions and interview SQL: SaralMart Analytics Bench ===== */
/* Every animation below draws real rows returned by SQLX.exec on the module's databases.
   Result values are always written with textContent (SVG <text>, SQLX.grid, SB.text); never as HTML. */
const W_REV="oi.qty * oi.unit_price * (1 - oi.discount)";
const W_SVGMIN="min-width:560px";

/* ---------- small helpers ---------- */
function wRows(res){const s=(res&&res.results||[]).filter(r=>r.columns.length).pop();if(!s)return [];return s.values.map(v=>{const o={};s.columns.forEach((c,i)=>{o[c]=v[i];});return o;});}
async function wQ(db,sql){return wRows(await SQLX.exec(db,sql));}
function wBtn(parent,label,ghost){const b=el("button",{class:"btn small"+(ghost?" ghost":""),type:"button"});b.textContent=label;parent.appendChild(b);return b;}
function wNote(parent,str){const p=SB.text("p",str,"note");parent.appendChild(p);return p;}
function wShort(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1)+"…":s;}
function wMoney(v){return v==null?"NULL":"₹"+Number(v).toLocaleString("en-IN",{maximumFractionDigits:0});}
function wNum(v,d){return v==null?"NULL":(+v).toFixed(d==null?2:d);}
function wSel(parent,label,opts,value){const lab=el("label");lab.appendChild(SB.text("span",label));const s=el("select");opts.forEach(([v,t])=>{const o=el("option",{value:v});o.textContent=t;s.appendChild(o);});if(value!=null)s.value=value;lab.appendChild(s);parent.appendChild(lab);return s;}
function wField(parent,label,value,min,max){const lab=el("label");lab.appendChild(SB.text("span",label));const i=el("input",{type:"number",step:"1",min:String(min),max:String(max),value:String(value)});lab.appendChild(i);parent.appendChild(lab);return i;}
function wInt(i,def,lo,hi){let v=parseInt(i.value,10);if(!Number.isFinite(v))v=def;v=Math.min(hi,Math.max(lo,v));i.value=String(v);return v;}
function wRow(parent,cls){const d=el("div",{class:cls||"sb-params"});parent.appendChild(d);return d;}
/* "Try this" buttons that load a fixed query into a console */
function wTry(parent,con,list){const r=wRow(parent,"btnrow");r.appendChild(SB.text("span","Try:","note"));list.forEach(([lab,sql])=>{const b=wBtn(r,lab,true);b.addEventListener("click",()=>{con.set(sql);con.run();});});return r;}
/* ISO date from a day offset (numbers only) */
function wDay(base,k){const d=new Date(Date.UTC(base[0],base[1]-1,base[2]+k));return d.toISOString().slice(0,10);}

/* ---------- the stage: a tweened SVG walkthrough with Play / Step / Speed / Reset ----------
   build(st) returns phases [{cap, apply(st), hold?}]; items move smoothly to their targets. */
function wStage(root,o){
  o=Object.assign({W:720,H:300,hold:1100,autoplay:false,cycle:false,label:"Animated walkthrough",min:W_SVGMIN},o);
  root.classList.add("flow");
  const bar=el("div",{class:"flowbar"});bar.appendChild(SB.text("span",o.title,"eyebrow"));
  const cs=el("div",{class:"ctrls"});bar.appendChild(cs);
  const bp=wBtn(cs,"Play"),bs=wBtn(cs,"Step ▸",true);const spd=el("span");cs.appendChild(spd);const br=wBtn(cs,"Reset",true);
  const cap=SB.text("p","Loading the rows from the database…","wcap");cap.setAttribute("aria-live","polite");
  const box=el("div",{class:"svgbox"});const svg=sv("svg",{viewBox:`0 0 ${o.W} ${o.H}`,role:"img","aria-label":o.label});if(o.min)svg.setAttribute("style",o.min);box.appendChild(svg);
  const prog=SB.text("p","","note");
  root.append(bar,cap,box,prog);
  let phases=[],idx=-1,playing=false,speed=1,hold=0,run=null,last=0,items=[],ended=false;
  const st={svg,W:o.W,H:o.H,root,
    item(init,render,parent){const g=sv("g");(parent||svg).appendChild(g);const it={g,c:Object.assign({x:0,y:0,o:1},init),t:Object.assign({x:0,y:0,o:1},init),render};
      it.set=p=>{Object.assign(it.t,p);return it;};it.snap=()=>{Object.assign(it.c,it.t);draw1(it);return it;};items.push(it);draw1(it);return it;},
    text(parent,x,y,s,attrs){const t=sv("text",Object.assign({x,y,"font-size":12},attrs||{}));t.textContent=s==null?"":String(s);parent.appendChild(t);return t;},
    rect(parent,attrs){const r=sv("rect",attrs);parent.appendChild(r);return r;},
    layer(){const g=sv("g");svg.appendChild(g);return g;},
    clear(){svg.textContent="";items=[];},
    get idx(){return idx;}
  };
  function draw1(it){it.g.setAttribute("transform",`translate(${it.c.x.toFixed(1)},${it.c.y.toFixed(1)})`);it.g.setAttribute("opacity",Math.max(0,Math.min(1,it.c.o)).toFixed(3));if(it.render)it.render(it.c,it);}
  function tween(dt){let moving=false;const k=REDUCED?1:Math.min(1,dt/1000*6*Math.sqrt(speed));
    items.forEach(it=>{let ch=false;for(const key in it.t){const a=it.c[key],b=it.t[key];if(typeof b!=="number"||a===b)continue;const eps=key==="o"?0.01:0.3;
        if(Math.abs(a-b)>eps){it.c[key]=a+(b-a)*k;moving=true;}else it.c[key]=b;ch=true;}if(ch)draw1(it);});return moving;}
  function apply(i,instant){idx=i;const ph=phases[i];cap.textContent=ph.cap;if(ph.apply)ph.apply(st);if(instant||REDUCED)items.forEach(it=>it.snap());hold=0;
    prog.textContent=`Step ${i+1} of ${phases.length}`;if(i===phases.length-1&&!ended){ended=true;if(o.onEnd)o.onEnd();}wake();}
  function frame(){const now=performance.now();const dt=Math.min(80,now-last);last=now;const mv=tween(dt);
    if(playing&&!mv){hold+=dt*speed;const h=(phases[idx]&&phases[idx].hold)||o.hold;if(hold>=h){if(idx<phases.length-1)apply(idx+1);else if(o.cycle){ended=false;apply(0);}else setPlay(false);}}
    if(!mv&&!playing&&run){run.stop();run=null;}}
  function wake(){if(!run){last=performance.now();run=loop(frame);}}
  function setPlay(v){playing=v;bp.textContent=v?"Pause":(phases.length&&idx>=phases.length-1?"Replay":"Play");if(v)wake();}
  bp.addEventListener("click",()=>{if(!phases.length)return;if(!playing&&idx>=phases.length-1)apply(0,true);setPlay(!playing);});
  bs.addEventListener("click",()=>{if(!phases.length)return;setPlay(false);if(idx>=phases.length-1)apply(0,true);else apply(idx+1);bp.textContent=idx>=phases.length-1?"Replay":"Play";});
  br.addEventListener("click",()=>{if(!phases.length)return;setPlay(false);apply(0,true);bp.textContent="Play";});

/* a table-row "card": background rect + cells; returns the stage item with .bg and .cells */
function wCard(st,x,y,w,cells,opt){opt=opt||{};const h=opt.h||20;

/* ---------- File 5 animation: the sliding frame (ROWS vs RANGE) ---------- */
const W_FRAMES={rows2:["ROWS BETWEEN 2 PRECEDING AND CURRENT ROW","a moving sum of this row and the two before it"],run:["ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW","a running total, one row at a time"],def:["(no frame written: the default)","RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, which includes every row that ties with the current one on the ORDER BY value"]};

  const build=async st=>{
    try{if(!S.frames.includes(mode)){S.frames.push(mode);save();if(S.frames.length>=3)award("framer");}}catch(e){}

const L=[];

L.push({id:"l1",badge:"Window Opener",code:"File 1",title:"Rows that stay",topics:"Window functions vs GROUP BY, OVER (), PARTITION BY, aggregates as window functions, where windows sit in the processing order",
story:`<b>Monday on the Analytics Bench.</b> Kavya Raman, who runs SaralMart's analytics bench, drops two requests on your desk. Merchandising wants every product listed with its category's average price beside it, "so we can see who is overpriced without a second report". And the hiring panel needs a second interviewer this afternoon: the candidates will be asked SQL (Structured Query Language) questions, and the bench expects you to know the answers cold. Both start with the same idea.`,
brief:`<p>In Module 2, <code>GROUP BY</code> turned many rows into one row per group, and the detail disappeared. A <span class="term">window function</span> also computes over a set of related rows, but it does <em>not</em> collapse them: the same number of rows comes out as went in, and each row carries a value computed from its set (its <span class="term">window</span>).</p>
<div class="formula">function(...) OVER ( [PARTITION BY cols] [ORDER BY cols] [frame] )</div>
<p>The <code>OVER</code> clause is what makes a function a window function. <code>OVER ()</code> with nothing inside makes the whole result one window. <span class="term">PARTITION BY</span> splits the rows into independent windows, much as <code>GROUP BY</code> forms groups, but keeps every row. <code>ORDER BY</code> inside <code>OVER</code> orders the rows within each partition; it matters for ranking and running totals (Files 2 and 5) and is separate from the query's final <code>ORDER BY</code>.</p>
<div class="formula">SELECT product_name, category, price,
       AVG(price) OVER (PARTITION BY category) AS cat_avg,
       price - AVG(price) OVER (PARTITION BY category) AS above_avg,
       COUNT(*) OVER () AS all_products
FROM products;</div>
<p>The ordinary aggregates (<code>SUM</code>, <code>AVG</code>, <code>COUNT</code>, <code>MIN</code>, <code>MAX</code>) all work as window functions. A window can even sit on top of an aggregate: in a grouped query, <code>SUM(SUM(x)) OVER ()</code> is the grand total of the group totals, which gives each group's share in one pass.</p>
<p><span class="term">Where windows sit in the logical processing order.</span> FROM → WHERE → GROUP BY → HAVING → <b>window functions</b> (computed with SELECT) → ORDER BY → LIMIT. Two consequences: a window sees only the rows that survived WHERE, and a window function cannot be used inside WHERE, GROUP BY or HAVING. To filter on one, compute it in a CTE (common table expression) or a subquery and filter outside.</p>
${W_MN}Window functions arrived in MySQL 8.0 (2018) and in SQLite 3.25 (2018); this game runs SQLite 3.45. MySQL 5.7 and older have none: queries written for them use self-joins, correlated subqueries or session variables instead. The syntax in this module is the same in MySQL 8.0 and SQLite unless a note says otherwise. Neither has a QUALIFY clause for filtering on a window function, so the CTE pattern is needed in both.${W_MNE}`,

 why:`<span class="formula">SELECT p.category,
       ROUND(SUM(oi.qty * oi.unit_price * (1 - oi.discount)), 2) AS revenue,
       ROUND(100.0 * SUM(oi.qty * oi.unit_price * (1 - oi.discount))
             / SUM(SUM(oi.qty * oi.unit_price * (1 - oi.discount))) OVER (), 2) AS share_pct
FROM order_items oi
JOIN orders o   ON o.order_id = oi.order_id
JOIN products p ON p.product_id = oi.product_id
WHERE o.status = 'Delivered'
GROUP BY p.category;</span>GROUP BY runs first and produces 7 rows; the window then runs over those 7 rows. Kitchen leads with about 27% of revenue. The shares add up to 100.`}
]});

L.push({id:"l2",badge:"Tie Breaker",code:"File 2",title:"Who comes first",topics:"ROW_NUMBER, RANK, DENSE_RANK, NTILE, tie handling, the second-highest salary",
story:`<b>The leaderboard argument.</b> The pricing team wants a "price leaderboard" of products, and two managers are already quarrelling: if two products cost the same, are they both number 6, and is the next one 7 or 8? Meanwhile the first interview candidate of the day, Imran, is given the bench's favourite opener: "Find the second-highest salary."`,
brief:`<p>Four <span class="term">ranking functions</span> number the rows of a window in the order given by <code>OVER (… ORDER BY …)</code>. They differ only when there are <span class="term">ties</span> (peers: rows with equal ORDER BY values).</p>
<div class="formula">prices      1250  899  899  780
ROW_NUMBER()   1    2    3    4   always unique; ties broken arbitrarily
RANK()         1    2    2    4   ties share a rank, then a gap
DENSE_RANK()   1    2    2    3   ties share a rank, no gap
NTILE(2)       1    1    2    2   deals rows into 2 buckets of near-equal size</div>
<p><code>RANK()</code> is the number of rows ranked strictly above plus one, the convention in sports tables. <code>DENSE_RANK()</code> is the number of distinct values at or above the current one. <code>ROW_NUMBER()</code> assigns 1, 2, 3, … and breaks ties in no particular order, so add a tiebreaker column (<code>ORDER BY price DESC, product_id</code>) whenever the order of tied rows matters. <code>NTILE(n)</code> splits the ordered rows into n buckets whose sizes differ by at most one, larger buckets first; tied rows can be split across buckets.</p>
<p><span class="term">The second-highest salary</span>, an interview classic: the Nth highest distinct value is the one with <code>DENSE_RANK() = N</code>. RANK would fail when the top value is tied (no row would have rank 2); ROW_NUMBER would return the tied top value again. The pre-window answers still appear in interviews: <code>MAX(x) WHERE x &lt; (SELECT MAX(x) …)</code>, or <code>SELECT DISTINCT x … ORDER BY x DESC LIMIT 1 OFFSET 1</code>.</p>
${W_MN}All four functions behave the same in MySQL 8.0 and SQLite. One caution: inside <code>OVER (ORDER BY …)</code> a number is not a column position, as it can be in a query's final ORDER BY. This game (SQLite) reads <code>OVER (ORDER BY 2)</code> as the constant 2, which orders nothing, so the numbering silently follows the input order. Write the column name, here and in MySQL.${W_MNE}`,
refs:"SQLite documentation, \"Window Functions\": built-in window functions · MySQL 8.0 Reference Manual, \"Window Function Descriptions\" · Molinaro & de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), ranking recipes · Silberschatz, Korth & Sudarshan, <i>Database System Concepts</i> (7th ed., 2019), ranking in advanced SQL.",
lab:root=>{const a=el("div");root.appendChild(a);wAnimTies(a);const b=el("div",{class:"ctrl",style:"margin-top:14px"});root.appendChild(b);b.appendChild(SB.text("span","Try it: rank anything in SaralMart or Karya","eyebrow"));
  const con=SQLX.console(b,{db:"saralmart",rows:5,starter:"SELECT product_name, price,\n       ROW_NUMBER() OVER (ORDER BY price DESC, product_id) AS rn,\n       RANK()       OVER (ORDER BY price DESC) AS rnk,\n       DENSE_RANK() OVER (ORDER BY price DESC) AS drnk\nFROM products\nORDER BY price DESC, product_id;"});
  wTry(b,con,[["NTILE(4) quartiles","SELECT product_name, price,\n       NTILE(4) OVER (ORDER BY price, product_id) AS quartile\nFROM products\nORDER BY price, product_id;"],["Rank within category","SELECT category, product_name, price,\n       RANK() OVER (PARTITION BY category ORDER BY price DESC) AS rank_in_category\nFROM products\nORDER BY category, rank_in_category;"]]);},
qs:[
{t:"sql",db:"saralmart",ordered:true,q:"The price leaderboard. All products, most expensive first (ties by product_id): product_id, product_name, price, RANK() and DENSE_RANK() by price descending. Sort by price descending, then product_id.",
 answer:"SELECT product_id, product_name, price, RANK() OVER (ORDER BY price DESC) AS rnk, DENSE_RANK() OVER (ORDER BY price DESC) AS drnk FROM products ORDER BY price DESC, product_id",
 hint:"Two window functions over the same ORDER BY price DESC; the final ORDER BY is separate.",
 why:`<span class="formula">SELECT product_id, product_name, price,
       RANK()       OVER (ORDER BY price DESC) AS rnk,
       DENSE_RANK() OVER (ORDER BY price DESC) AS drnk
FROM products
ORDER BY price DESC, product_id;</span>The two ₹899 products are both rank 10; the next product is RANK 12 but DENSE_RANK 11. By the bottom of the list, RANK reaches 41 while DENSE_RANK stops at 36: five prices are shared.`},
{t:"sql",db:"karya",q:"Interview classic: the second-highest salary. In Karya, among the current salary rows (salaries.to_date = '9999-01-01'), return the second-highest distinct monthly salary: one column, one row.",
 answer:"WITH r AS (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS dr FROM salaries WHERE to_date = '9999-01-01') SELECT DISTINCT salary FROM r WHERE dr = 2",
 hint:"DENSE_RANK() OVER (ORDER BY salary DESC) = 2, filtered outside the CTE. DISTINCT guards against two people sharing that salary.",
 why:`<span class="formula">WITH r AS (
  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS dr
  FROM salaries
  WHERE to_date = '9999-01-01')
SELECT DISTINCT salary FROM r WHERE dr = 2;</span>₹313,217. Change 2 to N for the Nth highest. The classic alternative: SELECT MAX(salary) FROM salaries WHERE to_date = '9999-01-01' AND salary &lt; (SELECT MAX(salary) FROM salaries WHERE to_date = '9999-01-01').`},
{t:"num",q:"Four salaries sorted from the highest: 90,000, 80,000, 80,000, 70,000. What does RANK() give the 70,000 row?",a:4,tol:0,ph:"e.g. 3",
 hint:"RANK = number of rows strictly above + 1.",why:"Three rows are above it, so RANK = 4. DENSE_RANK gives 3 (three distinct values at or above it) and ROW_NUMBER gives 4."},
{t:"sql",db:"saralmart",q:"Price quartiles. For every product: product_id, price, and its quartile from NTILE(4) over price ascending, ties broken by product_id (1 = cheapest quarter).",
 answer:"SELECT product_id, price, NTILE(4) OVER (ORDER BY price, product_id) AS price_quartile FROM products",
 hint:"NTILE(4) OVER (ORDER BY price, product_id).",
 why:`<span class="formula">SELECT product_id, price,
       NTILE(4) OVER (ORDER BY price, product_id) AS price_quartile
FROM products;</span>41 rows into 4 buckets: 11, 10, 10, 10 (the first bucket takes the extra row). Without the product_id tiebreaker, tied prices at a bucket edge could land in either bucket.`},
{t:"sql",db:"saralmart",q:"Interview classic: top values with ties. Registered customers whose number of orders is among the five highest distinct order counts: cust_id, cust_name, n_orders, and the dense rank of n_orders (1 = most orders).",
 answer:"WITH c AS (SELECT cust_id, COUNT(*) AS n_orders FROM orders WHERE cust_id IS NOT NULL GROUP BY cust_id), r AS (SELECT cust_id, n_orders, DENSE_RANK() OVER (ORDER BY n_orders DESC) AS dr FROM c) SELECT r.cust_id, cu.cust_name, r.n_orders, r.dr FROM r JOIN customers cu ON cu.cust_id = r.cust_id WHERE r.dr <= 5",
 hint:"Count orders per customer in a CTE, DENSE_RANK the counts, keep dr &lt;= 5, then join customers for the name.",
 why:`<span class="formula">WITH c AS (SELECT cust_id, COUNT(*) AS n_orders
           FROM orders WHERE cust_id IS NOT NULL GROUP BY cust_id),
     r AS (SELECT cust_id, n_orders,
                  DENSE_RANK() OVER (ORDER BY n_orders DESC) AS dr FROM c)
SELECT r.cust_id, cu.cust_name, r.n_orders, r.dr
FROM r JOIN customers cu ON cu.cust_id = r.cust_id
WHERE r.dr &lt;= 5;</span>Six customers: the counts 31, 27, 25, 24 and 23, with two customers tied on 23. ORDER BY n_orders DESC LIMIT 5 would drop one of the tied pair without telling you.`},
{t:"mcq",q:"Each department must award exactly one \"employee of the month\" certificate, chosen by highest score, even when two people tie. Which expression picks exactly one row per department?",
 opts:["ROW_NUMBER() OVER (PARTITION BY dept_no ORDER BY score DESC, emp_no) = 1","RANK() OVER (PARTITION BY dept_no ORDER BY score DESC) = 1","DENSE_RANK() OVER (PARTITION BY dept_no ORDER BY score DESC) = 1","NTILE(1) OVER (PARTITION BY dept_no ORDER BY score DESC) = 1"],a:0,
 hint:"Which function never repeats a number?",why:"Only ROW_NUMBER is unique within a partition; the extra emp_no makes the choice between tied people repeatable. RANK and DENSE_RANK both give 1 to everyone tied at the top, and NTILE(1) puts every row in bucket 1."}
]});

L.push({id:"l3",badge:"Top-N Hunter",code:"File 3",title:"Top N per group",topics:"Top N per partition, highest paid per department, latest row per key, ties at the cut",
story:`<b>The category review.</b> Category heads meet on Thursday, and Kavya wants "the three best-selling products in every category, one slide each". A junior analyst sends a query ending in <code>ORDER BY revenue DESC LIMIT 3</code> and gets three products in total: a mixer grinder, a pressure cooker and a cricket bat, and nothing at all from most categories. In the afternoon interview the bench asks Priya, a candidate, the Karya version: "Who is the highest-paid person in each department?"`,
brief:`<p>The <span class="term">top-N-per-group</span> problem is the most asked window-function question in interviews. <code>LIMIT</code> cannot solve it: LIMIT cuts the whole result, not each group. The pattern has three steps:</p>
<div class="formula">WITH ranked AS (
  SELECT ...,
         ROW_NUMBER() OVER (PARTITION BY group_col ORDER BY measure DESC, tiebreak) AS rn
  FROM ...)
SELECT ... FROM ranked WHERE rn &lt;= N;</div>
<p>1. Compute the measure (often with GROUP BY, in its own CTE). 2. Number the rows within each partition. 3. Filter in an outer query, because WHERE runs before windows are computed (File 1).</p>
<p><span class="term">Which function?</span> <code>ROW_NUMBER</code> returns exactly N rows per group, choosing among ties by the tiebreaker. <code>RANK</code> returns everyone tied at the cut, so "top 3" can come back as 5 rows. <code>DENSE_RANK &lt;= N</code> returns the top N distinct values with all their holders. State which one the question needs; in interviews, say it out loud.</p>
<p>The same pattern answers "the latest order per customer" (<code>ORDER BY order_date DESC, order_id DESC</code>, keep rn = 1) and "the highest-paid employee per department". The pre-window alternative is a correlated subquery, <code>WHERE salary = (SELECT MAX(salary) … same department)</code>, which returns ties like RANK does.</p>
${W_MN}The pattern is identical in MySQL 8.0. A trap that only MySQL users meet: MySQL 8.0's default mode, ONLY_FULL_GROUP_BY, rejects such a query (error 1055), but with that mode switched off, <code>SELECT dept_no, emp_no, MAX(salary) … GROUP BY dept_no</code> runs but may show an emp_no from a different row than the maximum. (SQLite has a documented special case that takes the other columns from the row holding the MAX, but relying on it is not portable.) The window pattern is correct everywhere.${W_MNE}`,
refs:"SQLite documentation, \"Window Functions\" and \"SELECT\" (bare columns in aggregate queries) · MySQL 8.0 Reference Manual, \"Window Functions\" and \"MySQL Handling of GROUP BY\" · Molinaro & de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020).",
lab:root=>{const a=el("div");root.appendChild(a);wAnimTopN(a);wSbTopN(root);},
qs:[
{t:"sql",db:"saralmart",q:"Interview classic: top 3 products per category. Revenue = qty × unit_price × (1 − discount) over Delivered orders. Show category, product_name, revenue rounded to 2 decimals, and the position within the category (1 to 3). 21 rows.",
 answer:`WITH r AS (SELECT p.category, p.product_name, SUM(${W_REV}) AS revenue FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'Delivered' GROUP BY p.product_id, p.category, p.product_name), t AS (SELECT category, product_name, revenue, ROW_NUMBER() OVER (PARTITION BY category ORDER BY revenue DESC) AS pos FROM r) SELECT category, product_name, ROUND(revenue, 2) AS revenue, pos FROM t WHERE pos <= 3`,
 hint:"CTE 1: revenue per product. CTE 2: ROW_NUMBER() OVER (PARTITION BY category ORDER BY revenue DESC). Outside: pos &lt;= 3.",
 why:`<span class="formula">WITH r AS (
  SELECT p.category, p.product_name,
         SUM(oi.qty * oi.unit_price * (1 - oi.discount)) AS revenue
  FROM order_items oi
  JOIN orders o   ON o.order_id = oi.order_id
  JOIN products p ON p.product_id = oi.product_id
  WHERE o.status = 'Delivered'
  GROUP BY p.product_id, p.category, p.product_name),
t AS (
  SELECT category, product_name, revenue,
         ROW_NUMBER() OVER (PARTITION BY category ORDER BY revenue DESC) AS pos
  FROM r)
SELECT category, product_name, ROUND(revenue, 2) AS revenue, pos
FROM t WHERE pos &lt;= 3;</span>Seven categories × 3 = 21 rows. There are no revenue ties at the cut, so RANK would give the same answer here; with ties it could return more.`},
{t:"sql",db:"karya",q:"Interview classic (Karya): the highest-paid current employee in each department. Current means dept_emp.to_date = '9999-01-01' and salaries.to_date = '9999-01-01'. Show dept_name, emp_no, first_name, last_name, salary (9 rows).",
 answer:"WITH cur AS (SELECT d.dept_name, e.emp_no, e.first_name, e.last_name, s.salary, RANK() OVER (PARTITION BY d.dept_no ORDER BY s.salary DESC) AS rk FROM dept_emp de JOIN departments d ON d.dept_no = de.dept_no JOIN employees e ON e.emp_no = de.emp_no JOIN salaries s ON s.emp_no = de.emp_no AND s.to_date = '9999-01-01' WHERE de.to_date = '9999-01-01') SELECT dept_name, emp_no, first_name, last_name, salary FROM cur WHERE rk = 1",
 hint:"Join dept_emp, departments, employees and salaries (both current), then RANK() OVER (PARTITION BY dept_no ORDER BY salary DESC) = 1.",
 why:`<span class="formula">WITH cur AS (
  SELECT d.dept_name, e.emp_no, e.first_name, e.last_name, s.salary,
         RANK() OVER (PARTITION BY d.dept_no ORDER BY s.salary DESC) AS rk
  FROM dept_emp de
  JOIN departments d ON d.dept_no = de.dept_no
  JOIN employees e   ON e.emp_no  = de.emp_no
  JOIN salaries s    ON s.emp_no  = de.emp_no AND s.to_date = '9999-01-01'
  WHERE de.to_date = '9999-01-01')
SELECT dept_name, emp_no, first_name, last_name, salary
FROM cur WHERE rk = 1;</span>RANK keeps both people if two ever tie at the top, which is usually what "highest-paid" should mean. Engineering's top earner is on ₹314,471 a month. A correlated version, WHERE s.salary = (SELECT MAX(...) for the same department), gives the same 9 rows.`},
{t:"sql",db:"saralmart",q:"The latest order of every Business-segment customer: cust_id, order_id, order_date. If a customer has two orders on their latest date, keep the one with the higher order_id.",
 answer:"WITH r AS (SELECT o.cust_id, o.order_id, o.order_date, ROW_NUMBER() OVER (PARTITION BY o.cust_id ORDER BY o.order_date DESC, o.order_id DESC) AS rn FROM orders o JOIN customers c ON c.cust_id = o.cust_id WHERE c.segment = 'Business') SELECT cust_id, order_id, order_date FROM r WHERE rn = 1",
 hint:"ROW_NUMBER() OVER (PARTITION BY cust_id ORDER BY order_date DESC, order_id DESC) = 1.",
 why:`<span class="formula">WITH r AS (
  SELECT o.cust_id, o.order_id, o.order_date,
         ROW_NUMBER() OVER (PARTITION BY o.cust_id
                            ORDER BY o.order_date DESC, o.order_id DESC) AS rn
  FROM orders o JOIN customers c ON c.cust_id = o.cust_id
  WHERE c.segment = 'Business')
SELECT cust_id, order_id, order_date FROM r WHERE rn = 1;</span>One row per Business customer who has ordered. Order ids here are not in date order, so MAX(order_date) and MAX(order_id) taken separately would pair a date with the wrong order.`},
{t:"num",q:"Customers ranked by number of App orders: the counts run 20, 19, 16, 16, 16, 15, … How many customers does <code>RANK() … &lt;= 3</code> keep for the App channel?",a:5,tol:0,ph:"e.g. 3",
 hint:"RANK gives the three customers on 16 orders the same rank. Which rank?",why:"Ranks are 1, 2, 3, 3, 3, 6, …, so RANK &lt;= 3 keeps 5 customers. ROW_NUMBER &lt;= 3 keeps exactly 3 (and silently drops two of the tied customers); DENSE_RANK &lt;= 3 also keeps 5 here, because 16 is the third distinct count; in general it keeps every holder of the top three distinct counts."},
{t:"sql",db:"saralmart",q:"Top 3 customers per channel by number of orders, keeping everyone tied at the cut (use RANK). Registered customers only. Show channel, cust_id, n_orders, rnk.",
 answer:"WITH c AS (SELECT channel, cust_id, COUNT(*) AS n_orders FROM orders WHERE cust_id IS NOT NULL GROUP BY channel, cust_id), r AS (SELECT channel, cust_id, n_orders, RANK() OVER (PARTITION BY channel ORDER BY n_orders DESC) AS rnk FROM c) SELECT channel, cust_id, n_orders, rnk FROM r WHERE rnk <= 3",
 hint:"Group by channel and cust_id first, then RANK() OVER (PARTITION BY channel ORDER BY n_orders DESC).",
 why:`<span class="formula">WITH c AS (SELECT channel, cust_id, COUNT(*) AS n_orders
           FROM orders WHERE cust_id IS NOT NULL
           GROUP BY channel, cust_id),
     r AS (SELECT channel, cust_id, n_orders,
                  RANK() OVER (PARTITION BY channel ORDER BY n_orders DESC) AS rnk
           FROM c)
SELECT channel, cust_id, n_orders, rnk FROM r WHERE rnk &lt;= 3;</span>18 rows, not 9: App returns 5, Web 4, and Phone 9, because eight Phone customers tie on 3 orders behind the leader. Ties at the cut are why "top 3" needs a stated rule.`},
{t:"mcq",q:"Why can <code>SELECT dept_no, MAX(salary) FROM … GROUP BY dept_no</code> not, on its own, answer \"who is the highest-paid person in each department\"?",
 opts:["GROUP BY returns one row per department with the maximum value, but not which employee holds it; you need a window (or a join back) to keep the employee's row","MAX does not work on salaries","GROUP BY cannot be used with a join","It returns one row per employee"],a:0,
 hint:"What does a group row know about its individual members?",why:"A group row carries aggregates, not member identities. The window version ranks every row and keeps the employee columns; the older fix joins the grouped maxima back to the detail rows."}
]});

L.push({id:"l4",badge:"Time Traveller",code:"File 4",title:"Looking back, looking ahead",topics:"LAG and LEAD, month-over-month growth, days between orders, year-over-year, the default argument",
story:`<b>The growth deck.</b> Finance asks for "monthly revenue with month-over-month growth, and July to September compared with last year". Customer care wants to know how quickly people reorder, and whether a cancelled order is followed by a new one. The third candidate, Arvind, gets the bench's time-series question: "For each order, how many days since that customer's previous order?"`,
brief:`<p><span class="term">LAG</span> and <span class="term">LEAD</span> read a value from another row of the same window, by position in the window's ORDER BY: LAG looks back, LEAD looks ahead.</p>
<div class="formula">LAG(expr [, offset [, default]])  OVER (PARTITION BY … ORDER BY …)
LEAD(expr [, offset [, default]]) OVER (PARTITION BY … ORDER BY …)
offset defaults to 1; default (returned when there is no such row) defaults to NULL</div>
<p><span class="term">Month-over-month (MoM) growth</span>: 100 × (revenue − LAG(revenue)) / LAG(revenue). The first month has no previous row, so its growth is NULL, which is correct: supplying a default of 0 would turn it into a division by zero. Use <code>100.0</code>, not <code>100</code>, so that integer columns are not divided as integers.</p>
<p><span class="term">Days between events</span>: LAG(order_date) per customer, then subtract the dates. PARTITION BY cust_id is essential: without it, the "previous order" is somebody else's. Add a tiebreaker (order_id) so that two orders on one day are in a fixed order.</p>
<p><span class="term">Year-over-year (YoY)</span>: on a monthly series, LAG(revenue, 12) is the same month a year earlier, but only if every month is present. If a month can be missing, join the series to itself on "month minus 12" instead. LEAD answers forward-looking questions: the next order after a cancellation, the next salary after a raise.</p>
${W_MN}LAG and LEAD are the same in both. The date arithmetic differs. Months: this game writes <code>strftime('%Y-%m', order_date)</code>; MySQL writes <code>DATE_FORMAT(order_date, '%Y-%m')</code>. Days between two dates: here <code>julianday(b) - julianday(a)</code>; MySQL <code>DATEDIFF(b, a)</code>. Twelve months back: here <code>date(d, '-12 months')</code>; MySQL <code>DATE_SUB(d, INTERVAL 12 MONTH)</code>.${W_MNE}`,
refs:"SQLite documentation, \"Window Functions\" (lag, lead) and \"Date And Time Functions\" · MySQL 8.0 Reference Manual, \"Window Function Descriptions\" and \"Date and Time Functions\" · Molinaro & de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), date arithmetic recipes.",
lab:root=>{const a=el("div");root.appendChild(a);wAnimLag(a);const b=el("div",{class:"ctrl",style:"margin-top:14px"});root.appendChild(b);b.appendChild(SB.text("span","Try it: LAG and LEAD on real orders","eyebrow"));
  const con=SQLX.console(b,{db:"saralmart",rows:6,starter:"SELECT order_id, order_date,\n       LAG(order_date)  OVER (ORDER BY order_date, order_id) AS prev_date,\n       LEAD(order_date) OVER (ORDER BY order_date, order_id) AS next_date,\n       julianday(order_date)\n         - julianday(LAG(order_date) OVER (ORDER BY order_date, order_id)) AS days_since\nFROM orders\nWHERE cust_id = 273\nORDER BY order_date, order_id;"});
  b.appendChild(SQLX.mysqlNote("In MySQL the last column would be DATEDIFF(order_date, LAG(order_date) OVER (…)). Both return whole days here because the dates have no time part."));},
qs:[
{t:"sql",db:"saralmart",ordered:true,q:"Month-over-month growth. Revenue = qty × unit_price × (1 − discount) over Delivered orders, grouped by order month (YYYY-MM). Show month, revenue rounded to 2 decimals, the previous month's revenue rounded to 2 decimals, and growth_pct = 100 × (revenue − previous) / previous rounded to 2 decimals. Sort by month.",
 answer:`WITH m AS (SELECT strftime('%Y-%m', o.order_date) AS month, SUM(${W_REV}) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.status = 'Delivered' GROUP BY month) SELECT month, ROUND(revenue, 2) AS revenue, ROUND(LAG(revenue) OVER (ORDER BY month), 2) AS prev_revenue, ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month)) / LAG(revenue) OVER (ORDER BY month), 2) AS growth_pct FROM m ORDER BY month`,
 hint:"CTE: monthly revenue with strftime('%Y-%m', order_date). Then LAG(revenue) OVER (ORDER BY month).",
 why:`<span class="formula">WITH m AS (
  SELECT strftime('%Y-%m', o.order_date) AS month,
         SUM(oi.qty * oi.unit_price * (1 - oi.discount)) AS revenue
  FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
  WHERE o.status = 'Delivered'
  GROUP BY month)
SELECT month, ROUND(revenue, 2) AS revenue,
       ROUND(LAG(revenue) OVER (ORDER BY month), 2) AS prev_revenue,
       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))
             / LAG(revenue) OVER (ORDER BY month), 2) AS growth_pct
FROM m ORDER BY month;</span>15 rows; July 2025 has NULL growth. The biggest jump is May 2026, about +37.7%. A named window (File 8) saves repeating the OVER clause three times.`},
{t:"sql",db:"saralmart",ordered:true,q:"Interview classic: days since the previous order. For customer 101, every order: order_id, order_date, and days since that customer's previous order (NULL for the first). Two orders on one day are ordered by order_id. Sort by order_date, then order_id.",
 answer:"SELECT order_id, order_date, julianday(order_date) - julianday(LAG(order_date) OVER (ORDER BY order_date, order_id)) AS days_since_prev FROM orders WHERE cust_id = 101 ORDER BY order_date, order_id",
 hint:"julianday(order_date) − julianday(LAG(order_date) OVER (ORDER BY order_date, order_id)).",
 why:`<span class="formula">SELECT order_id, order_date,
       julianday(order_date)
         - julianday(LAG(order_date) OVER (ORDER BY order_date, order_id)) AS days_since_prev
FROM orders
WHERE cust_id = 101
ORDER BY order_date, order_id;</span>31 orders. Customer 101 ordered twice on 1 June 2026 and twice on 2 September 2026; the second order of each pair shows a gap of 0. Ordering the window by order_id alone would be wrong: SaralMart's order ids are not in date order. For all customers at once, add PARTITION BY cust_id and drop the WHERE.`},
{t:"sql",db:"saralmart",q:"Interview classic: quick repeat orders. Across all registered customers, how many orders were placed within 7 days (7 or fewer) of the same customer's previous order? Same-day orders count (gap 0); ties on a date are ordered by order_id. Return one number.",

{t:"sql",db:"saralmart",ordered:true,q:"Interview classic: year-over-year. For July, August and September 2026: month, revenue rounded to 2 decimals, revenue in the same month of 2025 rounded to 2 decimals, and yoy_pct = 100 × (revenue − last year) / last year rounded to 2 decimals. Revenue as in challenge 1. Sort by month.",

 hint:"LAG(revenue, 12) over all months in a CTE, and only then filter to 2026-07 onwards. Filtering first would leave LAG nothing to look back at.",

y AS (SELECT month, revenue,

      FROM m)
SELECT month, ROUND(revenue, 2) AS revenue, ROUND(last_year, 2) AS last_year,

FROM y WHERE month &gt;= '2026-07' ORDER BY month;</span>July +2.67%, August −4.40%, September −9.50% (September 2026 data end on the 30th, but orders still in transit are not yet Delivered). The self-join alternative matches m.month with date(m2.month || '-01', '+12 months').`},

{t:"sql",db:"saralmart",q:"Win-back after a cancellation. Among Cancelled orders of registered customers, how many were followed by that customer's next order (of any status) within 30 days (30 or fewer)? Ties on a date are ordered by order_id. Return one number.",
