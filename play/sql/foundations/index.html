<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Sampark Library Desk</title>
<meta name="description" content="Why databases exist, tables, keys, relationships, ER diagrams and your first SELECT, on a public library's records.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case desk. Sticky status strip (rank, XP, streak); a live transaction-flow
   simulation as the hero; case files as a grid; an opened file is a single-column dossier:
   story, theory, lab, challenges. */
:root{
  --bg:#EAEFF4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#13233A; --muted:#566880; --line:#C9D3DF;
  --accent:#1F5FA8; --accent-soft:#DCE7F5; --gold:#A86E06; --gold-soft:#F6E7C8;
  --fraud:#B3263E; --fraud-soft:#F7DCE1; --ok:#1B7349; --ok-soft:#D7EFE2;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.strip .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .rank{font:700 1.05rem/1.1 var(--display)}
.xpbox{flex:1 1 220px;display:flex;flex-direction:column;gap:5px;min-width:0}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
.xpmeta{display:flex;justify-content:space-between;font:400 .8rem/1 var(--mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 11px;font:600 .82rem/1.2 var(--mono);white-space:nowrap}
a.chip{text-decoration:none;color:var(--accent)}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}

/* hero */
.hero{display:grid;gap:18px;padding-block:30px 10px}
.hero p.lede{font-size:1.08rem;max-width:62ch;margin-top:12px}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:8px;max-width:62ch}
.herotop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:720px){.herotop{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:.92rem}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ticket .row:last-child{border-bottom:0;padding-bottom:0}
.ticket .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flow simulation */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0}
.flow canvas{width:100%;height:auto;display:block;max-width:100%;border-radius:6px}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.flowbar .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.flowstats div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:1px}
.flowstats span{font-size:.72rem;color:var(--muted)}
.flowstats b{font:600 1.05rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font:600 .8rem/1.2 var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:transform .15s,border-color .15s}
.case:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.55}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .tag{font:600 .72rem/1 var(--mono);letter-spacing:.1em;color:var(--accent)}
.case h3{font-size:1.25rem}
.case .nick{font-size:.9rem;color:var(--muted)}
.case .topics{font-size:.85rem;color:var(--muted);margin-top:auto}
.stars{font-size:1rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.stamp{font:700 .7rem/1 var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok)} .stamp.lock{color:var(--muted)} .stamp.open{color:var(--accent)}
.case.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case.boss .tag,.case.boss .nick,.case.boss .topics{color:var(--bg);opacity:.8}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.badge b{font:600 .95rem/1.2 var(--display);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.badge.got b{color:var(--ink)}
.badge .seal{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}

/* dossier */
.dossier{display:grid;gap:22px;padding-block:24px}
.back{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);display:grid;gap:14px;min-width:0}
.panel>h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .eyebrow{color:var(--accent)}
.brief{display:grid;gap:12px;max-width:70ch}
.brief .term{font-weight:600}
.story{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;max-width:70ch}
.story b{font-style:normal}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.92rem;white-space:pre;line-height:1.5}
.refs{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* labs */
.labgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.labgrid{grid-template-columns:1fr}}
svg text{fill:var(--ink);font-family:var(--mono)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
.ctrl{display:grid;gap:6px}
.ctrl label{font-size:.88rem;color:var(--muted)}
.ctrl output{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.readout span{font-size:.76rem;color:var(--muted)}
.readout b{font:600 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.up{color:var(--fraud);font-weight:600}.down{color:var(--ok);font-weight:600}
.target{font:700 1.6rem/1.1 var(--mono);color:var(--accent)}
.regbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-size:.86rem}
.regbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.door{width:30%;aspect-ratio:3/4;max-width:120px;border:2px solid var(--line);background:var(--sunk);border-radius:8px 8px 2px 2px;
  font:700 1.4rem/1 var(--display);display:grid;place-items:center}
.door.pick{border-color:var(--accent);background:var(--accent-soft)}
.door.open{background:var(--bg);color:var(--muted);border-style:dashed}
.door.prize{border-color:var(--gold);background:var(--gold-soft)}
.doors{display:flex;gap:10px;justify-content:flex-start}
.mixbar{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.85rem}
.mixtrack{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mixtrack i{display:block;height:100%;transition:width .8s ease;font:600 .72rem/30px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
.mixtrack i.u{background:var(--accent-soft)}.mixtrack i.c{background:var(--line)}.mixtrack i.n{background:var(--fraud);color:var(--surface)}

/* challenges */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.q:first-of-type{border-top:0;padding-top:0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .eyebrow{white-space:nowrap}
.qtext{font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fraud);background:var(--fraud-soft)}
.opt[disabled]{cursor:default}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:12em}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--fraud-soft);border:1px solid var(--fraud)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b{font-family:var(--display);font-size:1rem}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;max-width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.toast b{color:var(--gold-soft)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sheet .formula{font-size:.84rem}
.sheet h3{font-size:1rem;margin-bottom:6px}
.sandbox{border:1px dashed var(--accent);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;background:var(--sunk);min-width:0;margin-top:14px}
.sb-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sb-head .eyebrow{color:var(--accent)}
.sb-tabs button{border:0;background:transparent;padding:5px 12px;font:600 .8rem/1.2 var(--mono)}
.sb-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sb-pane{display:grid;gap:10px;min-width:0}
.sb-params{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.sb-params label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sb-params input,.sb-params select{width:9.5em;max-width:100%}
.sandbox textarea{width:100%;max-width:100%;font:400 .88rem/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.sandbox input[type=file]{font-size:.82rem;max-width:100%}
.sqlx-console{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.sqlx-console{grid-template-columns:1fr}}
.sqlx-main{display:grid;gap:8px;min-width:0}
.sqlx-editor{width:100%;max-width:100%;font:400 .92rem/1.5 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
.sqlx-editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.sqlx-out{display:grid;gap:8px;min-width:0}
.sqlx-grid{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sqlx-grid table{font:400 .84rem/1.35 var(--mono)}
.sqlx-grid th{position:sticky;top:0;background:var(--sunk);text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink)}
.sqlx-grid td,.sqlx-grid th{white-space:nowrap;text-align:left}
.sqlx-grid td.num{text-align:right}
.sqlx-null{color:var(--muted);font-style:italic}
.sqlx-schema{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}
.sqlx-table summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sqlx-table ul{margin:4px 0 6px;padding-left:12px;list-style:none;display:grid;gap:2px}
.sqlx-col{all:unset;cursor:pointer;font:600 .8rem/1.3 var(--mono);color:var(--accent)}
.sqlx-col:focus-visible{outline:2px solid var(--accent)}
.sqlx-ch{display:grid;gap:8px;min-width:0}
.mysqlnote{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.mysqlnote b{font:600 .72rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
code,.code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.labgrid>*,.sb-pane>*,.ctrl>*{min-width:0}
.sb-pane select,.ctrl select{max-width:100%;min-width:0}
.fnd-hl{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent)}
.fnd-wrap{white-space:pre-wrap;overflow-wrap:anywhere}
.fnd-in{animation:fndIn .7s ease both}@keyframes fndIn{from{opacity:0}to{opacity:1}}
.fnd-bits{font:600 1.6rem/1.2 var(--mono);letter-spacing:.12em;word-break:break-all}
.fnd-pre{font-family:var(--mono);font-size:.82rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.fnd-chip{display:inline-block;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:2px 7px;margin:2px;font:500 .82rem/1.4 var(--mono);text-align:center}
.fnd-chip.kw{background:var(--accent-soft);border-color:var(--accent)}.fnd-chip.lit{background:var(--gold-soft);border-color:var(--gold)}.fnd-chip.bad{background:var(--fraud-soft);border-color:var(--fraud)}.fnd-chip.off{text-decoration:line-through;opacity:.6}.fnd-chip.sym{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip" id="strip">
    <div class="who"><span class="eyebrow">Analyst rank</span><span class="rank" id="rank">Trainee Analyst</span></div>
    <div class="xpbox"><div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
      <div class="xpmeta"><span id="xptext">0 XP</span><span id="xpnext"></span></div></div>
    <span class="chip" id="streakchip" title="Correct first-try answers in a row">Streak <b id="streak">0</b></span>
    <span class="chip" title="Badges earned">Badges <b id="badgecount">0</b></span>
    <a class="chip" href="../" id="hublink">All modules</a>
  </div>
  <main id="app"></main>
  <div class="foot">
    <span>Sampark Library Desk · part of <a href="../">SQL, played</a>, a free course you play. Built by <a href="https://aritra.ai" target="_blank" rel="noopener">Aritra Pan</a>. Free to use in teaching.</span>
    <span>Module 0 · Foundations</span>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>window.SQLX_LIB="../lib/";</script>
<script>
(function(){
"use strict";
/* ---------- sandbox toolkit (shared by every module) ----------
   Three levels of free play next to a lab:
     1. controls on the real data   2. generate your own data   3. bring your own data
   SAFETY: everything runs in the visitor's browser. Uploaded or pasted text is never sent anywhere,
   never stored, never put in the URL, and never inserted as HTML: it is only parsed into numbers and
   short labels, which are always displayed with textContent (SB.text / SB.table). Size caps keep phones responsive. */
const SB=(function(){
  const MAX_BYTES=2*1024*1024, MAX_ROWS=5000, MAX_COLS=50, MAX_LABEL=40;
  const used=()=>{try{award("explorer");}catch(e){}};
  /* safe text node helpers */
  function text(tag,str,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(str);return e;}
  /* control characters, bidirectional embedding/override/isolate controls (U+202A–202E, U+2066–2069, which could
     reorder the surrounding sentence on screen) and invisible U+200B, U+2060, U+FEFF are removed; ZWJ/ZWNJ stay (Indic scripts) */

    [/\bCURDATE\s*\(\s*\)|\bCURRENT_DATE\s*\(\s*\)/i,"CURDATE() is MySQL. In SQLite write date('now') (or CURRENT_DATE without brackets)."],
    [/\bDATE_FORMAT\s*\(/i,"DATE_FORMAT(d, '%Y-%m') is MySQL. In SQLite write strftime('%Y-%m', d). Most % codes match; minutes are %M in SQLite but %i in MySQL."],

    [/\bDATE_ADD\s*\(|\bDATE_SUB\s*\(|\bINTERVAL\s+\d/i,"DATE_ADD(d, INTERVAL 7 DAY) is MySQL. In SQLite write date(d, '+7 days') (or '-1 month', '+1 year')."],

    [/\bENUM\s*\(/i,"ENUM(...) is MySQL. In SQLite use TEXT with CHECK (col IN ('a','b','c'))."],
    [/\bSHOW\s+(TABLES|DATABASES|COLUMNS|CREATE)/i,"SHOW TABLES is MySQL. Here use the schema panel, or: SELECT name FROM sqlite_master WHERE type = 'table';  For columns: PRAGMA table_info(table_name);"],

    [/^\s*USE\s+\w/im,"USE database is MySQL. This game has one database open at a time, so leave it out."],
    [/\bWITH\s+ROLLUP\b/i,"GROUP BY ... WITH ROLLUP is MySQL. SQLite has no ROLLUP: add the subtotal rows with UNION ALL of a second, less detailed GROUP BY."],
    [/\bGROUP_CONCAT\s*\([^)]*\bSEPARATOR\b/i,"GROUP_CONCAT(x SEPARATOR ', ') is MySQL. In SQLite the separator is the second argument: GROUP_CONCAT(x, ', ')."],

function fTween(ms,fn){if(REDUCED){fn(1);return null;}const t0=performance.now();const h=loop(()=>{const p=Math.min(1,(performance.now()-t0)/ms);fn(p);if(p>=1)h.stop();});return h;}

/* Play / Step / Speed / Reset bar for step-wise animations. show(i) draws state i. */
function fPlayer(host,o){
  const bar=el("div",{class:"btnrow"});
  const play=el("button",{class:"btn small",type:"button"},"Play");
  const stepB=el("button",{class:"btn ghost small",type:"button"},"Step ▸");
  const reset=el("button",{class:"btn ghost small",type:"button"},"Reset");
  const spHost=el("span");const info=FT("span","","note");
  bar.append(play,stepB,reset,spHost,info);host.appendChild(bar);
  let i=0,run=null,speed=1,acc=0;const interval=o.interval||1500,steps=o.steps;
  const upd=()=>{info.textContent=`Step ${i+1} of ${steps}`+(o.names?" · "+o.names[i]:"");};
  function go(n){i=Math.max(0,Math.min(steps-1,n));o.show(i);upd();}
  function stop(){if(run){run.stop();run=null;}play.textContent=i>=steps-1?"Replay":"Play";}
  function start(){if(i>=steps-1)go(0);if(REDUCED){go(steps-1);stop();return;}play.textContent="Pause";let last=performance.now();acc=0;
    run=loop(()=>{const now=performance.now();acc+=(now-last)*speed;last=now;if(acc>=interval){acc=0;if(i<steps-1)go(i+1);if(i>=steps-1)stop();}});}
  play.addEventListener("click",()=>{run?stop():start();});
  stepB.addEventListener("click",()=>{stop();if(i<steps-1)go(i+1);play.textContent=i>=steps-1?"Replay":"Play";});
  reset.addEventListener("click",()=>{stop();go(0);play.textContent="Play";});
  speedSeg(spHost,v=>{speed=v;},[1,2,4]);
  go(0);
  return {go,stop,el:bar};
}

story:`<b>Day 1 at Sampark Public Library.</b> Sampark has four branches. Each keeps its own paper register of members, the fines clerk keeps a spreadsheet, and the catalogue lives in a card drawer. The trustees have approved one shared database. Before anyone buys software, the chief librarian asks you a plain question: "What exactly is wrong with what we have?"`,
brief:`<p><span class="term">Data</span> are raw facts recorded about the world: <code>Sameer Nair</code>, <code>9976750340</code>, <code>2025-10-31</code>. On their own they mean little; organised and given context ("member Sameer Nair borrowed copy 2 of a title on 31 October 2025") they become information.</p>
<p>A computer stores data in a <span class="term">data hierarchy</span>, each level built from the one below:</p>
<div class="formula">bit       a binary digit, 0 or 1 (the smallest unit)
byte      a group of 8 bits; in ASCII one byte stores one character
field     a group of characters forming a word or number   (name)
record    a group of related fields about one thing        (one member)
file      a group of records of the same type              (all members)
database  a group of related files                         (members, books, loans)</div>
<p>ASCII (American Standard Code for Information Interchange) is the classic code that gives each English letter, digit and symbol a number from 0 to 127, small enough to fit in one byte. The thing a record describes (a member, a book, a loan) is an <span class="term">entity</span>; each field describes one <span class="term">attribute</span> of it.</p>
<p>In the <span class="term">traditional file environment</span> (file-processing approach), every department builds its own files for its own programs. Laudon and Laudon list the problems that follow:</p>
<p><span class="term">Data redundancy</span>: the same data stored in several files. <span class="term">Data inconsistency</span>: the copies drift apart, so the same attribute has different values in different places. <span class="term">Program-data dependence</span>: programs are written for one file layout, so changing the layout breaks the programs. <span class="term">Lack of flexibility</span>: a new question needs new programming. <span class="term">Poor security</span> and <span class="term">lack of data sharing and availability</span>: nobody controls who sees or changes what, and information cannot flow between departments.</p>
<p>A <span class="term">database</span> stores each fact once, centrally, for many programs and users; a <span class="term">database management system</span> (DBMS) is the software that defines, stores, protects and serves it. You talk to a relational DBMS in SQL (Structured Query Language). Your first query, below, is <code>SELECT * FROM branch;</code>: "show every field (<code>*</code>) of every record in the branch file".</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>This game runs SQLite inside your browser, with the Sampark database already open. In MySQL you would first pick the database with <code>USE sampark;</code> (or click it in a client such as a workbench). <code>SELECT * FROM branch;</code> itself is identical in both.</span></div>`,
refs:"Laudon & Laudon, <i>Management Information Systems: Managing the Digital Firm</i> (17th ed., Pearson, 2022), ch. 6 · Silberschatz, Korth & Sudarshan, <i>Database System Concepts</i> (7th ed., 2019), ch. 1 · Elmasri & Navathe, <i>Fundamentals of Database Systems</i> (7th ed., 2016), ch. 1.",

L.push({id:"l2",badge:"Relation Reader",code:"File 2",title:"One store, many users",topics:"Database, DBMS, RDBMS, the relational model: relation, tuple, attribute, domain, degree, cardinality, schema and instance, NULL, the data dictionary",
story:`<b>The software arrives.</b> The vendor says the new system is "an RDBMS that follows the relational model", and the chief librarian forwards the brochure with one line: "Translate, please." Before you sign anything, you open the database the vendor has loaded with Sampark's records and look at how it is organised.`,
brief:`<p>A <span class="term">database management system</span> (DBMS) is the software layer between the data and everyone who uses it. It provides <span class="term">data definition</span> (declare the structure and the rules), <span class="term">data manipulation</span> (add, change, delete and retrieve data) and a <span class="term">data dictionary</span>: stored metadata, data about the data, that records every table, column, type and rule. Because every program goes through the DBMS, the rules are written once and enforced for all of them.</p>
<p>The DBMS also separates the <span class="term">logical view</span> (data as users see it: tables and columns) from the <span class="term">physical view</span> (how bytes sit on disk). That separation is <span class="term">data independence</span>: storage can change without rewriting programs.</p>
<p>Edgar F. Codd's <span class="term">relational model</span> (1970) organises data as relations. An <span class="term">RDBMS</span> (relational DBMS) is a DBMS built on it. The vocabulary, with the everyday names:</p>
<div class="formula">relation     a table                     title
tuple        a row (record)              one title
attribute    a column (field)            pub_year
domain       the set of allowed values   category ∈ {Adult, Student, Senior}
degree       number of attributes        title has 5
cardinality  number of tuples            title has 320
schema       the structure (definition)  CREATE TABLE title (...)
instance     the data at one moment      the 320 rows today</div>
<p>In a relation the order of rows carries no meaning, and every value is a single (atomic) value. When a value is missing or unknown, the cell holds <span class="term">NULL</span>: not zero, not an empty string, but "no value".</p>
<p>Codd also defined operations on relations. <span class="term">Projection</span> keeps only some attributes; in SQL (Structured Query Language) you list them after SELECT: <code>SELECT name, category FROM member;</code> returns every member but only two columns.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>To read the data dictionary in MySQL you write <code>SHOW TABLES;</code> and <code>DESCRIBE member;</code> (or <code>SHOW COLUMNS FROM member;</code>). SQLite has no SHOW or DESCRIBE: here write <code>SELECT name FROM sqlite_master WHERE type = 'table';</code> and <code>PRAGMA table_info(member);</code>. Types differ too: MySQL, in its default strict mode, rejects a value that does not fit the column's declared type, while SQLite uses type affinity and will store, say, text in an INTEGER column unless the table is declared STRICT.</span></div>`,
refs:"Codd, \"A Relational Model of Data for Large Shared Data Banks\", <i>Communications of the ACM</i> 13(6), 1970 · Laudon & Laudon (2022), ch. 6 · Silberschatz, Korth & Sudarshan (2019), ch. 1–2 · Elmasri & Navathe (2016), ch. 2 and 5 · SQLite documentation, \"PRAGMA table_info\" and \"Datatypes In SQLite\" (sqlite.org).",

L.push({id:"l3",badge:"Key Holder",code:"File 3",title:"Which one is which",topics:"Super, candidate, primary, alternate, composite, natural and surrogate keys; foreign keys; entity and referential integrity; looking up a row by its key",
story:`<b>The three Aarav Gills.</b> The North Branch desk issues a book "to Aarav Gill". The database has three members by that name, all at North Branch. Paper registers got away with names; a database cannot. The chief librarian wants to know how the system tells people, books and copies apart, and what stops a loan being recorded for a member who does not exist.`,
brief:`<p>A <span class="term">key</span> is a set of attributes whose values identify one tuple. The textbook family:</p>
<div class="formula">super key      any attribute set that is unique in every row     {member_id, name}
candidate key  a minimal super key (drop any part: no longer unique)  {member_id}, {phone}
primary key    the candidate key chosen to identify rows: unique, never NULL
alternate key  a candidate key not chosen as primary                 {phone}
composite key  a key of two or more attributes                       {isbn, copy_no}
foreign key    attribute(s) whose values must match a key of another table
                                                                    member.branch_code → branch.branch_code</div>
<p>A <span class="term">natural key</span> comes from the real world (an ISBN, International Standard Book Number); a <span class="term">surrogate key</span> is an artificial number with no meaning, such as member_id or loan_id, used when no natural key is stable, short and guaranteed unique. Names are never keys: people share them. Uniqueness in today's data is not enough either; a key is a business rule that must hold for every row that could ever be stored.</p>
<p>Two integrity rules: <span class="term">entity integrity</span>, a primary key value is unique and never NULL; and <span class="term">referential integrity</span>, every foreign key value matches an existing primary key value in the referenced table (or is NULL, if NULL is allowed). The DBMS enforces both: try it in the lab.</p>
<p>A key's job is lookup. <code>WHERE</code> keeps only the rows that meet a condition (File 6 covers it fully). With a primary key it returns exactly one row; a composite key needs all its parts, joined by <code>AND</code>:</p>
<div class="formula">SELECT * FROM member    WHERE member_id = 37;
SELECT * FROM book_copy WHERE isbn = '9781000015838' AND copy_no = 2;</div>
<p>Text values go in single quotes; numbers do not.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>A surrogate key that numbers itself is written <code>member_id INT AUTO_INCREMENT PRIMARY KEY</code> in MySQL. In SQLite, a column declared <code>INTEGER PRIMARY KEY</code> is filled automatically. SQLite checks foreign keys only when <code>PRAGMA foreign_keys = ON</code> (this game turns it on); MySQL's default InnoDB storage engine checks them unless the setting foreign_key_checks is switched off, and reports error 1452 for a missing parent row and error 1062 for a duplicate key.</span></div>`,

L.push({id:"l4",badge:"Diagrammer",code:"File 4",title:"Drawing the library",topics:"Entities, attributes, relationships, cardinality (1:1, 1:N, M:N), participation, weak entities, Chen and crow's foot notation, from ER diagram to tables, junction tables",
story:`<b>The whiteboard session.</b> The trustees want "a picture of the database that a non-programmer can check". You have the business rules: members register at one home branch; a title may have several authors, and the order on the cover matters; the library owns numbered copies of each title, each at one branch; members borrow copies, and may borrow the same copy again later. Draw it, then turn it into tables.`,
brief:`<p>An <span class="term">entity-relationship (ER) model</span> (Chen, 1976) describes data before any table exists. An <span class="term">entity</span> is a thing we store data about (MEMBER, TITLE); an <span class="term">attribute</span> describes it (name, pub_year); a <span class="term">relationship</span> connects entities (a MEMBER <i>registers at</i> a BRANCH).</p>
<p>The <span class="term">cardinality ratio</span> of a binary relationship says how many of one side relate to how many of the other: <b>1:1</b> (one-to-one), <b>1:N</b> (one-to-many: one branch, many members) or <b>M:N</b> (many-to-many: a title has many authors and an author writes many titles). <span class="term">Participation</span> is <i>total</i> if every entity must take part (every copy belongs to a title) and <i>partial</i> otherwise (a member need not have borrowed anything).</p>
<p>A <span class="term">weak entity</span> cannot be identified by its own attributes: copy number 1 exists for hundreds of titles, so BOOK_COPY is identified by its owner's key, the title's ISBN (International Standard Book Number), plus a <span class="term">partial key</span>: (isbn, copy_no).</p>
<p>Two notations. <span class="term">Chen notation</span>: rectangles for entities (double rectangle for weak ones), diamonds for relationships, ovals for attributes, 1/N/M written on the lines. <span class="term">Crow's foot notation</span> (information engineering): boxes that look like tables, lines between them, a bar for "one" and a three-pronged crow's foot for "many". Inside the boxes, PK marks the primary key and FK a foreign key.</p>
<div class="formula">ER diagram            →  tables
entity                →  a table; attributes → columns; key → PRIMARY KEY
1:N relationship      →  foreign key on the N side   (member.branch_code)
M:N relationship      →  junction table holding both keys, plus the
                         relationship's own attributes (written_by.author_order)
weak entity           →  composite key = owner key + partial key (isbn, copy_no)</div>
<p>A junction table is also called an associative or bridge table. When a relationship can repeat between the same pair (a member borrowing the same copy twice), it becomes an entity of its own with a surrogate key: LOAN with loan_id.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>Sampark limits member.category with <code>CHECK (category IN ('Adult','Student','Senior'))</code>, which works in both. MySQL also offers <code>ENUM('Adult','Student','Senior')</code>, which SQLite does not have. MySQL enforces CHECK constraints from version 8.0.16; older versions parsed and ignored them.</span></div>`,
refs:"Chen, \"The Entity-Relationship Model: Toward a Unified View of Data\", <i>ACM Transactions on Database Systems</i> 1(1), 1976 · Elmasri & Navathe (2016), ch. 3 (ER modelling) and ch. 9 (ER-to-relational mapping) · Silberschatz, Korth & Sudarshan (2019), ch. 6 · Laudon & Laudon (2022), ch. 6 (entity-relationship diagramming).",
lab:root=>{labER(root);},

L.push({id:"l5",badge:"Statement Sorter",code:"File 5",title:"Talking to the database",topics:"SQL as a declarative language, its sublanguages DDL, DML, DQL, DCL and TCL, how a query travels through the DBMS (parser, optimiser, executor), a first look at transactions",
story:`<b>Training the desk staff.</b> Branch staff will add members, issue books and print lists, and the information technology (IT) team will add new tables and decide who may see fines. The chief librarian wants one page that says what kinds of SQL (Structured Query Language) statements exist, who uses which, and what happens between pressing Run and seeing a result.`,
brief:`<p><span class="term">SQL</span> (Structured Query Language) is <span class="term">declarative</span>: you say <i>what</i> you want, and the DBMS decides <i>how</i> to get it. It grew from Codd's relational model; Chamberlin and Boyce designed its ancestor SEQUEL (Structured English Query Language) at IBM in 1974, and the American National Standards Institute (ANSI, 1986) and the International Organization for Standardization (ISO, 1987) standardised it. Each product adds its own extensions, its <span class="term">dialect</span>; this course writes standard SQL and flags where MySQL and SQLite differ.</p>
<p>SQL statements are usually grouped into five sublanguages:</p>
<div class="formula">DDL  Data Definition Language     CREATE, ALTER, DROP, TRUNCATE  structure
DML  Data Manipulation Language   INSERT, UPDATE, DELETE         change rows
DQL  Data Query Language          SELECT                         read rows
DCL  Data Control Language        GRANT, REVOKE                  permissions
TCL  Transaction Control Language BEGIN, COMMIT, ROLLBACK,       group changes
                                  SAVEPOINT                      safely</div>
<p>Some textbooks count SELECT as part of DML; both groupings are common. Templates for the DML you will use in the challenges (File 6 covers SELECT and WHERE fully):</p>
<div class="formula">INSERT INTO branch (branch_code, name, address, phone)
VALUES ('B005', 'Riverside Branch', 'Ferry Road', '080-2200005');
UPDATE branch SET phone = '080-2299001' WHERE branch_code = 'B001';
DELETE FROM branch WHERE branch_code = 'B005';
CREATE TABLE shelf (shelf_id INTEGER PRIMARY KEY, label TEXT NOT NULL);</div>
<p>An UPDATE or DELETE without WHERE changes every row. A <span class="term">transaction</span> groups statements into one unit: <code>BEGIN; … COMMIT;</code> keeps them all, <code>ROLLBACK;</code> undoes them all.</p>
<p>What happens to a query: the client sends text; the <span class="term">parser</span> checks the grammar and splits it into tokens; the names are checked against the data dictionary; the <span class="term">query optimiser</span> picks an execution plan (for example, jump straight to one row by its key, or scan the whole table); the <span class="term">executor</span> runs the plan against storage and returns rows. <code>EXPLAIN QUERY PLAN</code> shows SQLite's chosen plan.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>TRUNCATE TABLE, GRANT and REVOKE exist in MySQL but not in SQLite (here write <code>DELETE FROM t;</code>; SQLite has no user accounts). MySQL starts a transaction with <code>START TRANSACTION;</code> or <code>BEGIN;</code>; SQLite accepts <code>BEGIN;</code> (or <code>BEGIN TRANSACTION;</code>) but not START TRANSACTION. In MySQL, DDL statements such as CREATE TABLE commit the open transaction implicitly; in SQLite they can be rolled back. MySQL shows plans with <code>EXPLAIN SELECT …</code>.</span></div>`,
refs:"Chamberlin & Boyce, \"SEQUEL: A Structured English Query Language\", <i>Proc. ACM SIGFIDET Workshop</i> (1974) · Silberschatz, Korth & Sudarshan (2019), ch. 3 and ch. 15–16 (query processing and optimisation) · Elmasri & Navathe (2016), ch. 6 · MySQL 8.0 Reference Manual, \"SQL Statements\" and \"Statements That Cause an Implicit Commit\" · SQLite documentation, \"EXPLAIN QUERY PLAN\" and \"SQL As Understood By SQLite\" (sqlite.org/lang.html).",
lab:root=>{const a=el("div");root.appendChild(a);labJourney(a);const b=el("div",{style:"margin-top:22px;border-top:1px solid var(--line);padding-top:16px"});root.appendChild(b);labSorter(b);},
qs:[
{t:"sql",db:"sampark",check:"SELECT * FROM branch;",starter:"INSERT INTO branch (branch_code, name, address, phone)\nVALUES ('B00?', '…', '…', '…');",q:"DML. Sampark opens a fifth branch: code <code>B005</code>, name <code>Riverside Branch</code>, address <code>Ferry Road</code>, phone <code>080-2200005</code>. Insert it. (The checker compares the branch table afterwards.)",
 answer:"INSERT INTO branch (branch_code, name, address, phone) VALUES ('B005', 'Riverside Branch', 'Ferry Road', '080-2200005');",hint:"One row, four values in the column order, each text value in single quotes.",
 why:"<code>INSERT INTO branch (branch_code, name, address, phone) VALUES ('B005', 'Riverside Branch', 'Ferry Road', '080-2200005');</code> adds one row. Listing the columns is optional when you supply every value in table order, but it keeps the statement working if columns are added later."},
{t:"sql",db:"sampark",check:"SELECT * FROM branch;",starter:"UPDATE branch SET phone = '…' WHERE …;",q:"DML. North Branch (code <code>B002</code>) has a new phone number, <code>080-2299002</code>. Update it, and only it.",
 answer:"UPDATE branch SET phone = '080-2299002' WHERE branch_code = 'B002';",hint:"SET the new value, and use WHERE with the primary key so only one row changes.",
 why:"<code>UPDATE branch SET phone = '080-2299002' WHERE branch_code = 'B002';</code> changes one row. Without WHERE all four branches would get the new number; the checker would see four changed phones."},
{t:"sql",db:"sampark",check:"SELECT name, pk FROM pragma_table_info('reading_event');",starter:"CREATE TABLE reading_event (\n  \n);",q:"DDL. Create a table <code>reading_event</code> with four columns: <code>event_id</code> (an integer primary key), <code>branch_code</code> (text, a foreign key to branch), <code>event_date</code> (text) and <code>topic</code> (text). The checker compares the column names and which one is the primary key.",
 answer:"CREATE TABLE reading_event (event_id INTEGER PRIMARY KEY, branch_code TEXT REFERENCES branch(branch_code), event_date TEXT, topic TEXT);",hint:"CREATE TABLE name (column type, column type, …); add PRIMARY KEY after event_id's type and REFERENCES branch(branch_code) after branch_code's.",
 why:"<code>CREATE TABLE reading_event (event_id INTEGER PRIMARY KEY, branch_code TEXT REFERENCES branch(branch_code), event_date TEXT, topic TEXT);</code> defines structure only; it holds no rows yet. In MySQL write <code>event_id INT AUTO_INCREMENT PRIMARY KEY</code> and VARCHAR or DATE types."},
{t:"sql",db:"sampark",setup:"INSERT INTO branch VALUES ('B005','Riverside Branch','Ferry Road','080-2200005');",check:"SELECT * FROM branch;",starter:"DELETE FROM branch WHERE …;",q:"DML. In this challenge Riverside Branch (<code>B005</code>) has already been inserted, and the trustees have changed their minds. Delete that branch and nothing else.",
 answer:"DELETE FROM branch WHERE branch_code = 'B005';",hint:"DELETE FROM table WHERE key = value.",
 why:"<code>DELETE FROM branch WHERE branch_code = 'B005';</code> removes one row. Try deleting B001 instead: the DBMS refuses, because members still reference it (referential integrity from File 3)."},
{t:"mcq",q:"Interview classic. What is the difference between DELETE, TRUNCATE and DROP?",opts:["DELETE (DML) removes chosen rows; TRUNCATE (DDL) removes all rows but keeps the table; DROP (DDL) removes the table itself","All three remove the table","DELETE removes the table; DROP removes rows","TRUNCATE removes one row; DELETE removes all rows"],a:0,
 hint:"Which one leaves an empty table, and which leaves nothing at all?",why:"DELETE can take a WHERE and removes matching rows. TRUNCATE empties the whole table quickly. DROP removes the table and its definition. SQLite has no TRUNCATE: DELETE FROM t without WHERE does the same job."},
{t:"mcq",q:"IT wants the desk staff to read the member table but not change it. Which kind of statement does that?",opts:["DCL: GRANT SELECT ON member TO the desk staff","DDL: ALTER TABLE member","TCL: COMMIT","DQL: SELECT * FROM member"],a:0,
 hint:"Permissions are \"control\".",why:"GRANT and REVOKE form the Data Control Language. They exist in MySQL (with user accounts) but not in SQLite, which is a single-user file."},
{t:"mcq",q:"A clerk runs BEGIN; DELETE FROM loan; ROLLBACK; and then SELECT COUNT(*) FROM loan;, which returns the number of rows in loan (File 7 covers COUNT). What does the count show?",opts:["3000: ROLLBACK undid the DELETE","0: the rows were deleted","An error: DELETE cannot run inside a transaction","1: one statement was rolled back"],a:0,
 hint:"ROLLBACK undoes everything since BEGIN.",why:"The transaction grouped the DELETE; ROLLBACK discarded it, so all 3,000 loans remain. Try it with the “A transaction undone” button in File 2's sandbox. TCL is what makes risky changes safe."}
]});

L.push({id:"l6",badge:"First Query",code:"File 6",title:"Asking for rows",topics:"SELECT and FROM, SELECT *, choosing columns, WHERE with =, <>, <, >, <=, >=, IS NULL, AND, column and table aliases, ORDER BY, LIMIT, the logical order of a query",
story:`<b>Opening day.</b> The database is live. The questions arrive at once: the poetry shelf wants its list, the senior citizens' club wants members to invite, the fines clerk wants the large fines. Each is one SELECT statement.`,
brief:`<p>The basic query reads rows from one table:</p>
<div class="formula">SELECT column1, column2      -- which columns (projection); * = all
FROM   table                 -- which table
WHERE  condition             -- which rows (selection)
ORDER BY column [DESC]       -- sort, ascending unless DESC
LIMIT  n;                    -- keep the first n rows</div>
<p><code>WHERE</code> compares a column with a value: <code>=</code>, <code>&lt;&gt;</code> (not equal; <code>!=</code> also works), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. Join conditions with <code>AND</code> (both must hold). Text goes in single quotes, numbers do not: <code>WHERE genre = 'Poetry'</code>, <code>WHERE fine &gt; 100</code>. Missing values need <code>IS NULL</code>: <code>WHERE email = NULL</code> is never true, because NULL is not equal to anything, not even NULL.</p>
<p>An <span class="term">alias</span> renames a column or table inside one query: <code>SELECT name AS member_name FROM member AS m</code>. Column aliases label the output; table aliases shorten long queries (File 7).</p>
<p>The clauses are written SELECT, FROM, WHERE, ORDER BY, LIMIT, but the DBMS processes them in a different <span class="term">logical order</span>:</p>
<div class="formula">FROM → WHERE → SELECT → ORDER BY → LIMIT</div>
<p>Find the table, keep the matching rows, keep the chosen columns, sort, cut. Without ORDER BY a relation has no row order, so <code>LIMIT 5</code> returns whichever five rows the engine meets first. In this database, <code>SELECT member_id FROM member LIMIT 5;</code> returns 83, 73, 3, 432, 404, because SQLite happens to read the phone index. Always pair LIMIT with ORDER BY, and add a tiebreaker such as the key.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>In SQLite, <code>=</code> on text is case-sensitive: <code>WHERE genre = 'poetry'</code> finds 0 titles. MySQL's default collation is case-insensitive, so it finds 31. Write values exactly as stored. Use single quotes for text in both: SQLite reads "Poetry" in double quotes as a column name first, MySQL as text. <code>LIMIT 5 OFFSET 10</code> and <code>LIMIT 10, 5</code> both work in both. One more: SQLite lets WHERE use a column alias made in SELECT (<code>SELECT name AS member_name … WHERE member_name = 'Dev Shah'</code> runs here), while MySQL, following standard SQL, rejects it with "Unknown column"; in WHERE, write the column itself.</span></div>`,
refs:"Beaulieu, <i>Learning SQL</i> (3rd ed., O'Reilly, 2020), ch. 3–4 · Silberschatz, Korth & Sudarshan (2019), ch. 3 · MySQL 8.0 Reference Manual, \"SELECT Statement\" and \"Character Sets, Collations, Unicode\" · SQLite documentation, \"SELECT\" (sqlite.org/lang_select.html).",
lab:root=>{labClauses(root);sbL6(root);},

{t:"sql",db:"sampark",starter:"SELECT * FROM title;",q:"The poetry shelf: book_title and pub_year of every title in the genre <code>Poetry</code>.",
 answer:"SELECT book_title, pub_year FROM title WHERE genre = 'Poetry';",hint:"Two columns after SELECT, then WHERE genre = 'Poetry'. Mind the capital P.",
 why:"<code>SELECT book_title, pub_year FROM title WHERE genre = 'Poetry';</code> returns 31 titles. With 'poetry' in lower case SQLite returns none."},
{t:"sql",db:"sampark",starter:"SELECT * FROM member;",q:"The senior citizens' club: member_id and name of every member in the category <code>Senior</code>. Label the name column <code>member_name</code>.",
 answer:"SELECT member_id, name AS member_name FROM member WHERE category = 'Senior';",hint:"name AS member_name renames the output column.",
 why:"<code>SELECT member_id, name AS member_name FROM member WHERE category = 'Senior';</code> returns 71 members. The alias changes only the label in the output, not the table."},
{t:"sql",db:"sampark",starter:"SELECT * FROM loan;",q:"Large fines: loan_id, member_id and fine of every loan whose fine is more than ₹100.",
 answer:"SELECT loan_id, member_id, fine FROM loan WHERE fine > 100;",hint:"\"More than\" is &gt;, not &gt;=.",
 why:"<code>SELECT loan_id, member_id, fine FROM loan WHERE fine &gt; 100;</code> returns 110 loans. With <code>&gt;= 100</code> you would also get the 24 loans of exactly ₹100."},
{t:"sql",db:"sampark",ordered:true,starter:"SELECT isbn, book_title, pub_year FROM title;",q:"New arrivals display: isbn, book_title and pub_year of the 5 most recently published titles, newest first; break ties by isbn (ascending).",
 answer:"SELECT isbn, book_title, pub_year FROM title ORDER BY pub_year DESC, isbn LIMIT 5;",hint:"ORDER BY pub_year DESC, isbn, then LIMIT 5.",
 why:"<code>SELECT isbn, book_title, pub_year FROM title ORDER BY pub_year DESC, isbn LIMIT 5;</code> Seven titles are from 2026, so without the isbn tiebreaker the five returned could change between runs."},
{t:"sql",db:"sampark",starter:"SELECT member_id, name FROM member WHERE email = NULL;",q:"Interview classic: the starter looks right but returns nothing. Show member_id and name of every member with no email address.",
 answer:"SELECT member_id, name FROM member WHERE email IS NULL;",hint:"NULL is never equal to anything. There is a special operator for it.",
 why:"<code>SELECT member_id, name FROM member WHERE email IS NULL;</code> returns 36 members. <code>email = NULL</code> evaluates to unknown for every row, so no row passes. The opposite test is IS NOT NULL."},
{t:"mcq",q:"A colleague runs SELECT COUNT(*) FROM title WHERE genre = 'poetry'; and gets 0 here, while the same query on MySQL gave 31. Why?",opts:["SQLite compares text case-sensitively with =; MySQL's default collation ignores case","The MySQL copy has more data","COUNT(*) ignores lower-case values","SQLite does not support WHERE on text"],a:0,
 hint:"The stored value is 'Poetry'.",why:"SQLite's = is case-sensitive for text; MySQL's default collation is not. Match the stored spelling, or (in a later module) use LIKE or LOWER()."},
{t:"mcq",q:"In which order does the DBMS logically process SELECT name FROM member WHERE category = 'Senior' ORDER BY name LIMIT 3?",opts:["FROM → WHERE → SELECT → ORDER BY → LIMIT","SELECT → FROM → WHERE → ORDER BY → LIMIT","FROM → SELECT → WHERE → LIMIT → ORDER BY","LIMIT → FROM → WHERE → SELECT → ORDER BY"],a:0,
 hint:"You cannot filter rows before you know the table, and you cannot cut the top 3 before sorting.",why:"FROM finds the table, WHERE keeps matching rows, SELECT keeps the chosen columns, ORDER BY sorts, LIMIT cuts. That is why standard SQL, and MySQL, do not let WHERE use a column alias defined in SELECT. SQLite accepts it as an extension, so it runs in this game; do not rely on it."}
]});

L.push({id:"l7",badge:"Key Follower",code:"File 7",title:"Following the keys",topics:"Foreign keys as lookups, two-step lookups, a first INNER JOIN with ON, table aliases, counting rows with COUNT(*), how many rows a join returns",
story:`<b>The fines desk asks for names.</b> The loan table says member 361 borrowed copy 4 of the title with ISBN (International Standard Book Number) 9781000087109. The clerk wants a list with people's names and book titles, not numbers. Every number in loan is a foreign key, a pointer to the one row that holds the details. Time to follow the pointers.`,
brief:`<p>A <span class="term">foreign key</span> is a lookup: loan.member_id points at member.member_id. You can follow it in two steps:</p>
<div class="formula">SELECT member_id FROM loan WHERE loan_id = 1;     -- 361
SELECT name FROM member WHERE member_id = 361;    -- Dev Shah</div>
<p>An <span class="term">INNER JOIN</span> does the matching for every row at once. It pairs each row of the first table with each row of the second that satisfies the <code>ON</code> condition, usually foreign key = primary key:</p>
<div class="formula">SELECT l.loan_id, m.name
FROM loan AS l
JOIN member AS m ON l.member_id = m.member_id
WHERE l.loan_id = 1;</div>
<p><code>JOIN</code> means INNER JOIN. The table aliases <code>l</code> and <code>m</code> say which table each column comes from (both tables could have a column called name). Rows with no partner on the other side are dropped; outer joins, which keep them, come in Module 3. Because each loan matches exactly one member (foreign key to primary key), the join has exactly as many rows as loan.</p>
<p>Counting: <code>COUNT(*)</code> returns the number of rows that reach it. <code>SELECT COUNT(*) FROM loan WHERE return_date IS NULL;</code> counts the books still out. <code>COUNT(column)</code> counts only non-NULL values of that column, a difference that matters when the column has NULLs.</p>
<p>Older books write a join with a comma and WHERE: <code>FROM loan, member WHERE loan.member_id = member.member_id</code>. It returns the same rows; the JOIN … ON form keeps the matching condition apart from the filters.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>JOIN … ON, table aliases and COUNT(*) are written identically in MySQL and SQLite. One related difference: to glue text together, SQLite uses <code>a || ' ' || b</code>, while in MySQL <code>||</code> means OR by default; write <code>CONCAT(a, ' ', b)</code> there. CONCAT also works in this game.</span></div>`,
refs:"Codd (1970) on the join operation · Beaulieu (2020), ch. 5 (querying multiple tables) · Silberschatz, Korth & Sudarshan (2019), ch. 3–4 · Laudon & Laudon (2022), ch. 6 (select, join and project) · SQLite documentation, \"SELECT\" (join operators) and \"Built-in Aggregate Functions\".",
lab:root=>{labFollow(root);sbL7(root);},
qs:[
{t:"sql",db:"sampark",starter:"SELECT COUNT(*) FROM loan;",q:"How many loans are still out (no return date yet)? Return one number.",
 answer:"SELECT COUNT(*) FROM loan WHERE return_date IS NULL;",hint:"COUNT(*) with WHERE return_date IS NULL.",
 why:"<code>SELECT COUNT(*) FROM loan WHERE return_date IS NULL;</code> gives 58. <code>COUNT(return_date)</code> would give 0, because COUNT(column) skips NULLs."},
{t:"sql",db:"sampark",starter:"SELECT COUNT(*) FROM member;",q:"How many members are registered at Lakeside Branch (branch code <code>B003</code>)?",
 answer:"SELECT COUNT(*) FROM member WHERE branch_code = 'B003';",hint:"The foreign key member.branch_code holds the code.",
 why:"<code>SELECT COUNT(*) FROM member WHERE branch_code = 'B003';</code> gives 104. The four branch counts (124, 123, 104, 99) add to 450."},
{t:"sql",db:"sampark",starter:"SELECT * FROM loan WHERE loan_id = 1;",q:"Who borrowed in loan 1? Show only the member's name.",
 answer:"SELECT m.name FROM loan AS l JOIN member AS m ON l.member_id = m.member_id WHERE l.loan_id = 1;",hint:"Either two steps (find member_id in loan, then the name in member), or one JOIN.",

{t:"sql",db:"sampark",starter:"SELECT l.loan_id, l.member_id FROM loan AS l WHERE l.fine = 125;",q:"The ₹125 club: for every loan with a fine of exactly 125, show loan_id and the member's name.",
 answer:"SELECT l.loan_id, m.name FROM loan AS l JOIN member AS m ON l.member_id = m.member_id WHERE l.fine = 125;",hint:"JOIN member ON the member_id columns, then filter on fine.",
 why:"<code>SELECT l.loan_id, m.name FROM loan AS l JOIN member AS m ON l.member_id = m.member_id WHERE l.fine = 125;</code> returns 25 rows. ₹125 is 25 days late at ₹5 a day, the largest fine on file."},
{t:"sql",db:"sampark",starter:"SELECT * FROM book_copy WHERE copy_condition = 'Withdrawn';",q:"Withdrawn copies, with their titles: book_title, isbn and copy_no of every copy whose condition is <code>Withdrawn</code>.",
 answer:"SELECT t.book_title, c.isbn, c.copy_no FROM book_copy AS c JOIN title AS t ON c.isbn = t.isbn WHERE c.copy_condition = 'Withdrawn';",hint:"book_copy.isbn is a foreign key to title.isbn.",

<div class="formula">SELECT columns | * | COUNT(*)
FROM   table AS t
JOIN   other AS o ON t.foreign_key = o.primary_key
WHERE  condition AND condition
ORDER BY column [DESC], tiebreaker
LIMIT  n;</div>
<p>Before writing, ask three questions. Which table holds the rows I want (the entity)? Which tables hold the details I must show (follow the foreign keys)? Which rows qualify (the WHERE conditions)? Then check the result's size against common sense: a lookup by primary key returns one row, an M:N lookup returns several.</p>
<p>Dates in Sampark are stored as text in the ISO 8601 format of the International Organization for Standardization (ISO), <code>YYYY-MM-DD</code>. Because the year comes first, text order is date order, so <code>due_date &lt; '2026-09-30'</code> works as a date comparison.</p>
<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>For "today", MySQL has <code>CURDATE()</code>; SQLite writes <code>date('now')</code>. This capstone uses the fixed date '2026-09-30', the end of the data, so the answers never change. MySQL stores dates in a DATE type; SQLite stores them as text, which is why the ISO format matters here.</span></div>`,

    `SELECT loan_id, issue_date, due_date, return_date, fine FROM loan WHERE loan_id = ${id};`,

    `SELECT c.isbn, c.copy_no, c.copy_condition FROM loan AS l JOIN book_copy AS c ON l.isbn = c.isbn AND l.copy_no = c.copy_no WHERE l.loan_id = ${id};`,
    `SELECT b.branch_code, b.name FROM loan AS l JOIN book_copy AS c ON l.isbn = c.isbn AND l.copy_no = c.copy_no JOIN branch AS b ON c.branch_code = b.branch_code WHERE l.loan_id = ${id};`,

  formulas:[
   ["Data hierarchy","bit → byte (8 bits, 1 character)\n→ field → record → file (table)\n→ database (related files)"],

const fmt=(x,d=4)=>Number(x).toFixed(d);

function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffled(n,seed){const o=[...Array(n).keys()];const r=rng(seed);for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[o[k],o[j]]=[o[j],o[k]];}return o;}
const lnFact=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s;};
const binomPMF=(k,n,p)=>Math.exp(lnFact(n)-lnFact(k)-lnFact(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p));
const poisPMF=(k,l)=>Math.exp(k*Math.log(l)-l-lnFact(k));
const normPDF=(x,m,s)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
function sampleAmount(r){const u=r()*100;let lo=0,hi=AMTK.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(AMTK[m]<=u)lo=m;else hi=m;}const t=(u-AMTK[lo])/(AMTK[hi]-AMTK[lo]);return AMTV[lo]+(AMTV[hi]-AMTV[lo])*t;}
function sampleDaily(r){const u=r()*90;let c=0;for(const x of Object.keys(DAILY)){c+=DAILY[x];if(u<c)return +x;}return 17;}

const runners=new Set(); // active animation loops, stopped on navigation

function toast(html){const t=el("div",{class:"toast"},html);$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3200);}
function addXP(n,why){if(n<=0)return;S.xp+=n;save();toast(`<b>+${n} XP</b> · ${why}`);renderStrip();}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);save();const b=BADGES.find(x=>x[0]===id);toast(`Badge earned: <b>${b[1]}</b>`);renderStrip();}
function rankOf(){if(S.badges.includes("board"))return [COURSE.topRank,null];let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null;}}return [r[1],nx];}
function renderStrip(){const [r,nx]=rankOf();$("#rank").textContent=r;$("#xptext").textContent=ind(S.xp)+" XP";

  else{$("#xpfill").style.width="100%";$("#xpnext").textContent=S.badges.includes("board")?"Top rank reached":"Pass the board meeting for "+COURSE.topRank;}

function speedSeg(root,onchange,opts=[1,4,16]){const s=el("div",{class:"seg",role:"group","aria-label":"Speed"});opts.forEach((v,i)=>{const b=el("button",{type:"button","aria-pressed":i===0},v+"×");b.addEventListener("click",()=>{s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));onchange(v);});s.appendChild(b);});root.appendChild(s);return s;}

/* ---------- unlocking and progress ---------- */
function qstate(lid,i){S.ans[lid]=S.ans[lid]||{};S.ans[lid][i]=S.ans[lid][i]||{tries:0,done:false,first:false,hint:false,got:0};return S.ans[lid][i];}
function levelDone(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done);}
function levelStars(lv){if(!levelDone(lv))return 0;const f=lv.qs.filter((q,i)=>S.ans[lv.id][i].first).length;return f===lv.qs.length?3:(f>=lv.qs.length/2?2:1);}
function attempted(lv){return lv.qs.every((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].tries>0);}
function unlocked(idx){if(S.unlockAll||idx===0)return true;const prev=L[idx-1];return levelDone(prev)||attempted(prev);}
function boardUnlocked(){return S.unlockAll||L.filter(levelDone).length>=COURSE.boardUnlock;}

function level(lv){
  stopAll();const idx=L.indexOf(lv);
  if(!unlocked(idx)){location.hash="";return;}
  const app=$("#app");app.innerHTML="";
  const d=el("div",{class:"dossier"});

  const p0=el("section",{class:"panel"});p0.innerHTML=`<h3><span class="eyebrow">The case</span></h3><p class="story">${lv.story}</p>`;d.appendChild(p0);
  const p1=el("section",{class:"panel"});p1.innerHTML=`<h3><span class="eyebrow">Theory, briefly</span></h3><div class="brief">${lv.brief}</div><p class="refs">Further reading: ${lv.refs}</p>`;d.appendChild(p1);
  const p2=el("section",{class:"panel"});p2.innerHTML=`<h3><span class="eyebrow">Lab</span></h3>`;const lb=el("div");p2.appendChild(lb);d.appendChild(p2);
  const p3=el("section",{class:"panel"});p3.innerHTML=`<h3><span class="eyebrow">Challenges</span> <span class="note" id="qprog"></span></h3>`;
  lv.qs.forEach((q,i)=>p3.appendChild(question(lv,q,i)));

  else{const b=el("button",{class:"btn",type:"button"},"Go to the board meeting →");b.addEventListener("click",()=>{if(boardUnlocked())location.hash="board";else toast("Clear "+COURSE.boardUnlock+" case files to unlock the board");});nx.appendChild(b);}
  d.appendChild(nx);
  app.appendChild(d);

function updProg(lv){const n=lv.qs.filter((q,i)=>S.ans[lv.id]&&S.ans[lv.id][i]&&S.ans[lv.id][i].done).length;const e=$("#qprog");if(e)e.textContent=`${n} of ${lv.qs.length} solved`;}

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/[₹,\s]/g,"");let isPct=false;if(s.endsWith("%")){isPct=true;s=s.slice(0,-1);}let v=parseFloat(s);if(isPct)v/=100;return v;}
function needDec(q){return Math.max(0,Math.ceil(Math.log10(0.5/q.tol)-1e-9));}
function tooRounded(raw,v,q){if(Number.isNaN(v)||!(q.tol>0))return false;let t=String(raw).trim().replace(/[₹,\s]/g,"");const pct=t.endsWith("%");if(pct)t=t.slice(0,-1);const m=t.match(/\.(\d+)$/);const d=m?m[1].length:0;let a=q.a,w=v;if(pct||(q.a<1&&v>1&&!pct)){a=q.a*100;w=pct?v*100:v;}const unit=Math.pow(10,-d),tolS=(a===q.a)?q.tol:q.tol*100;if(unit<=tolS*2)return false;return Math.abs(w-a)<=unit/2+1e-9;}
function roundMsg(q){const n=needDec(q);return `Your number is the right value rounded too far. Give it to ${n} decimal place${n===1?"":"s"}${q.a<1&&n>2?` (or as a percentage to ${n-2} decimal place${n-2===1?"":"s"})`:""}.`;}
function numOK(v,q){if(Number.isNaN(v))return false;if(Math.abs(v-q.a)<=q.tol)return true;if(q.a<1&&v>1&&Math.abs(v/100-q.a)<=q.tol)return true;return false;}

function question(lv,q,i){
  const st=qstate(lv.id,i);
  const box=el("div",{class:"q"});
  box.innerHTML=`<div class="qhead"><span class="eyebrow">Challenge ${i+1}</span><span class="eyebrow" data-x></span></div><p class="qtext">${q.q}</p>`;
  const fb=el("div");
  const tag=box.querySelector("[data-x]");
  const setTag=()=>{tag.textContent=st.done?`+${st.got} XP`:(st.hint?"hint used · 75 XP":"100 XP");};
  setTag();
  const solve=(correct)=>{
    st.tries++;
    if(correct){
      st.done=true;st.first=(st.tries===1&&!st.hint);
      let gain=st.tries===1?100:st.tries===2?50:20; if(st.hint)gain=Math.max(0,gain-25); st.got=gain;
      if(st.tries===1){S.streak++;S.best=Math.max(S.best,S.streak);if(S.streak>=5)award("streak5");}
      save(); addXP(gain,"Challenge "+(i+1));
      fb.innerHTML=`<div class="fb ok"><b>Correct.</b><span>${q.why}</span></div>`;
      setTag(); updProg(lv); checkLevel(lv); const hbx=box.querySelector("[data-hint]"); if(hbx)hbx.hidden=true;
    } else {
      S.streak=0;save();renderStrip();
      fb.innerHTML=`<div class="fb no"><b>Not yet.</b><span>${st.tries>=2?"Look at the hint, or rework it in the lab, then try again.":"Try again; the lab above has what you need."}</span></div>`;
    }
  };
  if(q.t==="sql"){
    SQLX.challenge(box,q,st,solve,fb);
  } else if(q.t==="mcq"){
    const order=shuffled(q.opts.length,lv.id.charCodeAt(1)*31+i*17);
    const opts=el("div",{class:"opts"});
    order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);
      if(st.done){b.disabled=true;if(k===q.a)b.classList.add("right");}
      b.addEventListener("click",()=>{if(st.done)return;const c=(k===q.a);b.classList.add(c?"right":"wrong");if(c)opts.querySelectorAll("button").forEach(x=>x.disabled=true);else b.disabled=true;solve(c);});
      opts.appendChild(b);});
    box.appendChild(opts);
  } else {
    const row=el("div",{class:"numrow"});
    const inp=el("input",{type:"text",inputmode:"decimal",id:`in-${lv.id}-${i}`,"aria-label":"Your answer",placeholder:q.ph||"e.g. 0.123"});
    const go=el("button",{class:"btn small",type:"button"},"Check");
    if(st.done){inp.disabled=true;go.disabled=true;inp.value=String(+q.a.toFixed(4));}
    const check=()=>{if(st.done)return;const v=parseNum(inp.value);if(Number.isNaN(v)){fb.innerHTML=`<div class="fb no"><b>Enter a number.</b><span>Decimals (0.25) and percentages (25%) both work.</span></div>`;return;}const c=numOK(v,q);if(!c&&tooRounded(inp.value,v,q)){fb.innerHTML=`<div class="fb no"><b>Close.</b><span>${roundMsg(q)} This try is not counted.</span></div>`;return;}if(c){inp.disabled=true;go.disabled=true;}solve(c);};
    go.addEventListener("click",check);inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
    row.append(inp,go);box.appendChild(row);
  }
  if(q.hint){const hb=el("button",{class:"btn ghost small",type:"button","data-hint":"1"},"Show hint (−25 XP)");
    if(st.done)hb.hidden=true;
    hb.addEventListener("click",()=>{st.hint=true;save();setTag();hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;});
    const r=el("div",{class:"btnrow"});r.appendChild(hb);box.appendChild(r);
    if(st.hint&&!st.done){hb.hidden=true;fb.innerHTML=`<div class="fb hint"><b>Hint.</b><span>${q.hint}</span></div>`;}
  }
  if(st.done)fb.innerHTML=`<div class="fb ok"><b>Solved.</b><span>${q.why}</span></div>`;
  box.appendChild(fb);
  return box;
}
function checkLevel(lv){if(!levelDone(lv))return;const was=S.badges.includes(lv.id);award(lv.id);
  if(lv.qs.every((q,i)=>S.ans[lv.id][i].first))award("clean");
  if(!was){addXP(150,"Case file cleared");}}

function board(){
  stopAll();if(!boardUnlocked()){location.hash="";return;}
  const app=$("#app");app.innerHTML="";
  const d=el("div",{class:"dossier"});
  const back=el("button",{class:"back",type:"button"},"← Back to the desk");back.addEventListener("click",()=>{location.hash="";});d.appendChild(back);
  d.appendChild(el("div",{},`<p class="eyebrow">Final</p><h1 style="margin-top:8px">${COURSE.boardTitle||"The board meeting"}</h1><p class="note" style="margin-top:8px">${BOARD.length} questions from across the files. One attempt each, no hints. Score ${COURSE.boardPass} or more to earn ${COURSE.topRank}. XP is awarded on your first sitting only.</p>`));
  const p=el("section",{class:"panel"});d.appendChild(p);app.appendChild(d);
  const run={i:0,score:0,first:!S.board};
  const show=()=>{
    if(run.i>=BOARD.length){
      const pass=run.score>=COURSE.boardPass;
      S.board={score:Math.max(run.score,S.board?S.board.score:0)};save();
      if(run.first)addXP(run.score*100,"Board meeting");
      if(pass)award("board");
      p.innerHTML=`<h2>${pass?"The board is satisfied.":"The board wants another look."}</h2><p>You scored <b class="mono">${run.score} / ${BOARD.length}</b>. ${pass?"You are now "+COURSE.topRank+".":"Revisit the case files, then reconvene."}</p>`;
      const r=el("div",{class:"btnrow"});const a=el("button",{class:"btn",type:"button"},"Reconvene");a.addEventListener("click",board);const b=el("button",{class:"btn ghost",type:"button"},"Back to the desk");b.addEventListener("click",()=>{location.hash="";});r.append(a,b);p.appendChild(r);renderStrip();return;}
    const q=BOARD[run.i];p.innerHTML=`<div class="qhead"><span class="eyebrow">Question ${run.i+1} of ${BOARD.length}</span><span class="eyebrow">Score ${run.score}</span></div><p class="qtext">${q.q}</p>`;
    const fb=el("div");const next=el("button",{class:"btn",type:"button"},run.i<BOARD.length-1?"Next question →":"See the verdict");next.hidden=true;next.addEventListener("click",()=>{run.i++;show();});
    const done=(c)=>{if(c)run.score++;fb.innerHTML=`<div class="fb ${c?"ok":"no"}"><b>${c?"Correct.":"Not quite."}</b><span>${q.why}</span></div>`;next.hidden=false;};
    if(q.t==="mcq"){const o=el("div",{class:"opts"});const order=shuffled(q.opts.length,run.i*7+3);
      order.forEach(k=>{const b=el("button",{class:"opt",type:"button"},q.opts[k]);b.addEventListener("click",()=>{o.querySelectorAll("button").forEach((x,ix)=>{x.disabled=true;if(order[ix]===q.a)x.classList.add("right");});if(k!==q.a)b.classList.add("wrong");done(k===q.a);});o.appendChild(b);});p.appendChild(o);}
    else{const r=el("div",{class:"numrow"});const inp=el("input",{type:"text",inputmode:"decimal",id:"board-in-"+run.i,"aria-label":"Your answer",placeholder:"e.g. 0.5"});const g=el("button",{class:"btn small",type:"button"},"Submit");
      const sub=()=>{const v=parseNum(inp.value);if(Number.isNaN(v))return;if(!numOK(v,q)&&tooRounded(inp.value,v,q)){fb.innerHTML=`<div class="fb no"><b>Close.</b><span>${roundMsg(q)} Not submitted yet.</span></div>`;return;}inp.disabled=true;g.disabled=true;done(numOK(v,q));};g.addEventListener("click",sub);inp.addEventListener("keydown",e=>{if(e.key==="Enter")sub();});r.append(inp,g);p.appendChild(r);}
    p.appendChild(fb);p.appendChild(next);
  };
  show();window.scrollTo(0,0);
}
/* ---------- router ---------- */
function route(){const h=location.hash.replace("#","");const lv=L.find(x=>x.id===h);if(lv)level(lv);else if(h==="board")board();else home();}
window.addEventListener("hashchange",route);
renderStrip();route();
try{window.__course={L,BOARD};}catch(e){}

})();
</script>
