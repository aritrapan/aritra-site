<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>SaralMart Query Counter</title>
<meta name="description" content="Retrieve, filter, sort and label rows: WHERE, IN, BETWEEN, LIKE, NULL, DISTINCT, ORDER BY, LIMIT, CASE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case desk. Sticky status strip (rank, XP, streak); a live transaction-flow
   simulation as the hero; case files as a grid; an opened file is a single-column dossier:
   story, theory, lab, challenges. */
:root{
  --bg:#EAEFF4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#13233A; --muted:#566880; --line:#C9D3DF;
  --accent:#1F5FA8; --accent-soft:#DCE7F5; --gold:#A86E06; --gold-soft:#F6E7C8;
  --fraud:#B3263E; --fraud-soft:#F7DCE1; --ok:#1B7349; --ok-soft:#D7EFE2;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172232; --sunk:#121C29; --ink:#E3E9F1; --muted:#97A7BB; --line:#2B3B51;
  --accent:#73AAE9; --accent-soft:#1C3150; --gold:#E3AA3E; --gold-soft:#3A2C12;
  --fraud:#F06D82; --fraud-soft:#3D1A22; --ok:#52C78E; --ok-soft:#14352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.strip .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .rank{font:700 1.05rem/1.1 var(--display)}
.xpbox{flex:1 1 220px;display:flex;flex-direction:column;gap:5px;min-width:0}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
.xpmeta{display:flex;justify-content:space-between;font:400 .8rem/1 var(--mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 11px;font:600 .82rem/1.2 var(--mono);white-space:nowrap}
a.chip{text-decoration:none;color:var(--accent)}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}

/* hero */
.hero{display:grid;gap:18px;padding-block:30px 10px}
.hero p.lede{font-size:1.08rem;max-width:62ch;margin-top:12px}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:8px;max-width:62ch}
.herotop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:720px){.herotop{grid-template-columns:1fr}}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:.92rem}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ticket .row:last-child{border-bottom:0;padding-bottom:0}
.ticket .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* flow simulation */
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;min-width:0}
.flow canvas{width:100%;height:auto;display:block;max-width:100%;border-radius:6px}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.flowbar .ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.flowstats div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:1px}
.flowstats span{font-size:.72rem;color:var(--muted)}
.flowstats b{font:600 1.05rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font:600 .8rem/1.2 var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* case grid */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:transform .15s,border-color .15s}
.case:hover:not([disabled]){transform:translateY(-2px);border-color:var(--accent)}
.case[disabled]{cursor:not-allowed;opacity:.55}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .tag{font:600 .72rem/1 var(--mono);letter-spacing:.1em;color:var(--accent)}
.case h3{font-size:1.25rem}
.case .nick{font-size:.9rem;color:var(--muted)}
.case .topics{font-size:.85rem;color:var(--muted);margin-top:auto}
.stars{font-size:1rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.stamp{font:700 .7rem/1 var(--mono);letter-spacing:.1em;padding:4px 7px;border-radius:4px;border:1.5px solid currentColor}
.stamp.ok{color:var(--ok)} .stamp.lock{color:var(--muted)} .stamp.open{color:var(--accent)}
.case.boss{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case.boss .tag,.case.boss .nick,.case.boss .topics{color:var(--bg);opacity:.8}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.badge b{font:600 .95rem/1.2 var(--display);color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.badge.got b{color:var(--ink)}
.badge .seal{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em}

/* dossier */
.dossier{display:grid;gap:22px;padding-block:24px}
.back{justify-self:start;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);display:grid;gap:14px;min-width:0}
.panel>h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .eyebrow{color:var(--accent)}
.brief{display:grid;gap:12px;max-width:70ch}
.brief .term{font-weight:600}
.story{border-left:3px solid var(--gold);padding-left:14px;font-style:italic;max-width:70ch}
.story b{font-style:normal}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.92rem;white-space:pre;line-height:1.5}
.refs{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* labs */
.labgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.labgrid{grid-template-columns:1fr}}
svg text{fill:var(--ink);font-family:var(--mono)}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
.ctrl{display:grid;gap:6px}
.ctrl label{font-size:.88rem;color:var(--muted)}
.ctrl output{font-family:var(--mono);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.readout span{font-size:.76rem;color:var(--muted)}
.readout b{font:600 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font:600 .75rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.up{color:var(--fraud);font-weight:600}.down{color:var(--ok);font-weight:600}
.target{font:700 1.6rem/1.1 var(--mono);color:var(--accent)}
.regbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regbtn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;font-size:.86rem}
.regbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.door{width:30%;aspect-ratio:3/4;max-width:120px;border:2px solid var(--line);background:var(--sunk);border-radius:8px 8px 2px 2px;
  font:700 1.4rem/1 var(--display);display:grid;place-items:center}
.door.pick{border-color:var(--accent);background:var(--accent-soft)}
.door.open{background:var(--bg);color:var(--muted);border-style:dashed}
.door.prize{border-color:var(--gold);background:var(--gold-soft)}
.doors{display:flex;gap:10px;justify-content:flex-start}
.mixbar{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:.85rem}
.mixtrack{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mixtrack i{display:block;height:100%;transition:width .8s ease;font:600 .72rem/30px var(--mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink)}
.mixtrack i.u{background:var(--accent-soft)}.mixtrack i.c{background:var(--line)}.mixtrack i.n{background:var(--fraud);color:var(--surface)}

/* challenges */
.q{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.q:first-of-type{border-top:0;padding-top:0}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qhead .eyebrow{white-space:nowrap}
.qtext{font-weight:500;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fraud);background:var(--fraud-soft)}
.opt[disabled]{cursor:default}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:12em}
.fb{border-radius:8px;padding:10px 12px;font-size:.93rem;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--fraud-soft);border:1px solid var(--fraud)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b{font-family:var(--display);font-size:1rem}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;max-width:min(320px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s ease}
.toast b{color:var(--gold-soft)}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sheet .formula{font-size:.84rem}
.sheet h3{font-size:1rem;margin-bottom:6px}
.sandbox{border:1px dashed var(--accent);border-radius:var(--r);padding:14px clamp(12px,2vw,18px);display:grid;gap:10px;background:var(--sunk);min-width:0;margin-top:14px}
.sb-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sb-head .eyebrow{color:var(--accent)}
.sb-tabs button{border:0;background:transparent;padding:5px 12px;font:600 .8rem/1.2 var(--mono)}
.sb-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sb-pane{display:grid;gap:10px;min-width:0}
.sb-params{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.sb-params label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sb-params input,.sb-params select{width:9.5em;max-width:100%}
.sandbox textarea{width:100%;max-width:100%;font:400 .88rem/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.sandbox input[type=file]{font-size:.82rem;max-width:100%}
.sqlx-console{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.sqlx-console{grid-template-columns:1fr}}
.sqlx-main{display:grid;gap:8px;min-width:0}
.sqlx-editor{width:100%;max-width:100%;font:400 .92rem/1.5 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;tab-size:2}
.sqlx-editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.sqlx-out{display:grid;gap:8px;min-width:0}
.sqlx-grid{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sqlx-grid table{font:400 .84rem/1.35 var(--mono)}
.sqlx-grid th{position:sticky;top:0;background:var(--sunk);text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--ink)}
.sqlx-grid td,.sqlx-grid th{white-space:nowrap;text-align:left}
.sqlx-grid td.num{text-align:right}
.sqlx-null{color:var(--muted);font-style:italic}
.sqlx-schema{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}
.sqlx-table summary{cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sqlx-table ul{margin:4px 0 6px;padding-left:12px;list-style:none;display:grid;gap:2px}
.sqlx-col{all:unset;cursor:pointer;font:600 .8rem/1.3 var(--mono);color:var(--accent)}
.sqlx-col:focus-visible{outline:2px solid var(--accent)}
.sqlx-ch{display:grid;gap:8px;min-width:0}
.mysqlnote{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-size:.9rem}
.mysqlnote b{font:600 .72rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
code,.code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.stage svg{width:100%;height:auto;display:block}
.stagecap{font-size:.9rem;min-height:2.6em;color:var(--ink)}
.qline{font-family:var(--mono);font-size:.86rem;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.7;overflow-wrap:anywhere}
.qline span{border-radius:4px;padding:1px 3px}
.qline span.on{background:var(--gold-soft);outline:1px solid var(--gold)}
.qline b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{font:400 .78rem/1.3 var(--mono);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);background:var(--surface)}
.chip2.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ink);font-weight:600}
.brief code{white-space:normal}
.flowbar .ctrls{flex-wrap:wrap}
.panel>div{min-width:0}
.btnrow select{max-width:100%;min-width:0;text-overflow:ellipsis}
.btnrow .mono{overflow-wrap:anywhere;min-width:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="strip" id="strip">
    <div class="who"><span class="eyebrow">Analyst rank</span><span class="rank" id="rank">Trainee Analyst</span></div>
    <div class="xpbox"><div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
      <div class="xpmeta"><span id="xptext">0 XP</span><span id="xpnext"></span></div></div>
    <span class="chip" id="streakchip" title="Correct first-try answers in a row">Streak <b id="streak">0</b></span>
    <span class="chip" title="Badges earned">Badges <b id="badgecount">0</b></span>
    <a class="chip" href="../" id="hublink">All modules</a>
  </div>
  <main id="app"></main>
  <div class="foot">
    <span>SaralMart Query Counter · part of <a href="../">SQL, played</a>, a free course you play. Built by <a href="https://aritra.ai" target="_blank" rel="noopener">Aritra Pan</a>. Free to use in teaching.</span>
    <span>Module 1 · Retrieving data</span>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>window.SQLX_LIB="../lib/";</script>
<script>
(function(){
"use strict";
/* ---------- sandbox toolkit (shared by every module) ----------
   Three levels of free play next to a lab:
     1. controls on the real data   2. generate your own data   3. bring your own data
   SAFETY: everything runs in the visitor's browser. Uploaded or pasted text is never sent anywhere,
   never stored, never put in the URL, and never inserted as HTML: it is only parsed into numbers and
   short labels, which are always displayed with textContent (SB.text / SB.table). Size caps keep phones responsive. */
const SB=(function(){
  const MAX_BYTES=2*1024*1024, MAX_ROWS=5000, MAX_COLS=50, MAX_LABEL=40;
  const used=()=>{try{award("explorer");}catch(e){}};
  /* safe text node helpers */
  function text(tag,str,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(str);return e;}
  /* control characters, bidirectional embedding/override/isolate controls (U+202A–202E, U+2066–2069, which could
     reorder the surrounding sentence on screen) and invisible U+200B, U+2060, U+FEFF are removed; ZWJ/ZWNJ stay (Indic scripts) */

    [/\bCURDATE\s*\(\s*\)|\bCURRENT_DATE\s*\(\s*\)/i,"CURDATE() is MySQL. In SQLite write date('now') (or CURRENT_DATE without brackets)."],
    [/\bDATE_FORMAT\s*\(/i,"DATE_FORMAT(d, '%Y-%m') is MySQL. In SQLite write strftime('%Y-%m', d). Most % codes match; minutes are %M in SQLite but %i in MySQL."],

    [/\bDATE_ADD\s*\(|\bDATE_SUB\s*\(|\bINTERVAL\s+\d/i,"DATE_ADD(d, INTERVAL 7 DAY) is MySQL. In SQLite write date(d, '+7 days') (or '-1 month', '+1 year')."],

    [/\bENUM\s*\(/i,"ENUM(...) is MySQL. In SQLite use TEXT with CHECK (col IN ('a','b','c'))."],
    [/\bSHOW\s+(TABLES|DATABASES|COLUMNS|CREATE)/i,"SHOW TABLES is MySQL. Here use the schema panel, or: SELECT name FROM sqlite_master WHERE type = 'table';  For columns: PRAGMA table_info(table_name);"],

    [/^\s*USE\s+\w/im,"USE database is MySQL. This game has one database open at a time, so leave it out."],
    [/\bWITH\s+ROLLUP\b/i,"GROUP BY ... WITH ROLLUP is MySQL. SQLite has no ROLLUP: add the subtotal rows with UNION ALL of a second, less detailed GROUP BY."],
    [/\bGROUP_CONCAT\s*\([^)]*\bSEPARATOR\b/i,"GROUP_CONCAT(x SEPARATOR ', ') is MySQL. In SQLite the separator is the second argument: GROUP_CONCAT(x, ', ')."],

SQLX.addDB("saralmart",DB_SARALMART);
/* ===== Module 1: SaralMart Query Counter — SELECT and filtering ===== */
/* Every number shown in the labs comes from a real query run on the saralmart database in the visitor's browser.
   SECURITY: database values and anything a visitor types are shown only through textContent (SQLX.txt, SB.text,
   SVG <text>.textContent) or SQLX.grid; visitor text never enters SQL that this file builds. */
const SM="saralmart";
const MN=t=>`<div class="mysqlnote"><b>MySQL vs this game (SQLite)</b><span>${t}</span></div>`;
async function rowsOf(sql,db){const r=await SQLX.exec(db||SM,sql);const s=r.results.filter(x=>x.columns.length);return s.length?s[s.length-1]:{columns:[],values:[],total:0};}
function fv(v){if(v===null||v===undefined)return "NULL";if(typeof v==="number")return String(Math.round(v*100)/100);return String(v);}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+"…":s;}
function mkBtn(t,cls){const b=SQLX.txt("button",t,cls||"btn small");b.type="button";return b;}
function loading(root){const p=SQLX.txt("p","Loading rows from the SaralMart database…","note");root.appendChild(p);return p;}
function failBox(root,e){const d=el("div");root.appendChild(d);SQLX.errorBox(d,e&&e.message?e.message:String(e),"");}
function selectBox(opts,label){const s=el("select",{"aria-label":label});opts.forEach(([v,t])=>{const o=el("option",{value:v});o.textContent=t;s.appendChild(o);});return s;}
function starters(root,con,list){const r=el("div",{class:"btnrow"});r.appendChild(SQLX.txt("span","Try:","note"));
  list.forEach(([lab,sql])=>{const b=mkBtn(lab,"btn ghost small");b.addEventListener("click",()=>{con.set(sql);con.run();});r.appendChild(b);});root.insertBefore(r,root.firstChild);}
function freeConsole(root,starter,list,db){const host=el("div");root.appendChild(host);const con=SQLX.console(host,{db:db||SM,starter,rows:4});if(list)starters(host,con,list);return con;}

  const cap=el("p",{class:"stagecap"});cap.setAttribute("aria-live","polite");box.appendChild(cap);

    item(x,y,op){const g=sv("g",{});svg.appendChild(g);const v=op==null?1:op;const it={g,x,y,o:v,tx:x,ty:y,to:v};items.push(it);place(it);return it;},

  function next(){if(k>=steps.length-1)return false;k++;show();return true;}
  function stop(){playing=false;bPlay.textContent="Play";}
  function reset(){stop();if(anim){anim.stop();anim=null;}holder.textContent="";svg=sv("svg",{viewBox:`0 0 ${o.W} ${o.H}`,role:"img","aria-label":o.aria});holder.appendChild(svg);items=[];steps=build(api);k=0;show();snap();}

/* ---------- File 4 lab: how a LIKE pattern consumes a text ---------- */
const LIKE_PRESETS=["C%","%Board%","% kg","%a_e%","c%","_o%","%0%"];
function likeTokens(p){return Array.from(p).slice(0,30);}
function likeEq(a,b){if(a===b)return true;return /^[A-Za-z]$/.test(a)&&/^[A-Za-z]$/.test(b)&&a.toLowerCase()===b.toLowerCase();}
function likeTrace(text,pat){ // reachable positions after each token (SQLite rule: ASCII letters ignore case); returns per-token ranges
  const s=Array.from(text),t=likeTokens(pat),n=s.length;const R=[new Set([0])];let failAt=-1;
  for(let i=0;i<t.length;i++){const prev=R[i],nx=new Set();
    if(t[i]==="%"){const m=Math.min(...prev);for(let j=m;j<=n;j++)nx.add(j);}
    else prev.forEach(j=>{if(j<n&&(t[i]==="_"||likeEq(t[i],s[j])))nx.add(j+1);});
    R.push(nx);if(!nx.size){failAt=i;break;}}
  const ok=failAt<0&&R[t.length].has(n);const ranges=[];
  const upto=failAt<0?t.length:failAt;let end=ok?n:Math.max(...R[upto]);
  let p=end;for(let i=upto-1;i>=0;i--){let q;if(t[i]==="%"){q=Math.max(...[...R[i]].filter(x=>x<=p));}else q=p-1;ranges[i]=[q,p];p=q;}
  return {s,t,ok,failAt,ranges,end,hasPct:t.slice(0,upto).includes("%"),leftover:failAt<0&&!ok};
}

function genInputs(root,specs){const row=el("div",{class:"sb-params"});const ins={};specs.forEach(([k,lab,v,mn,mx])=>{const l=el("label");l.appendChild(SQLX.txt("span",lab));const i=el("input",{type:"number",min:String(mn),max:String(mx),step:"1",value:String(v)});l.appendChild(i);row.appendChild(l);ins[k]={i,mn,mx,v};});root.appendChild(row);
  return {row,get(){const o={};for(const k in ins){let x=parseInt(ins[k].i.value,10);if(!Number.isFinite(x))x=ins[k].v;x=Math.max(ins[k].mn,Math.min(ins[k].mx,x));ins[k].i.value=x;o[k]=x;}return o;}};}
function genPane(root,o){ // o: {specs, make(params)->sql text built from numbers and fixed words, starter, note, list}
  root.appendChild(SQLX.txt("p",o.note,"note"));const f=genInputs(root,o.specs);const b=mkBtn("Generate table","btn small");f.row.appendChild(b);
  const status=SQLX.txt("p","","note");status.setAttribute("role","status");root.appendChild(status);const host=el("div");root.appendChild(host);let con=null;
  b.addEventListener("click",async()=>{const p=f.get();try{await SQLX.addDBText("gen_select",o.make(p));SB.used();status.textContent=o.done(p);
      if(!con){con=SQLX.console(host,{db:"gen_select",starter:o.starter,rows:4});if(o.list)starters(host,con,o.list);}else con.set(o.starter);con.run();}catch(e){status.textContent="Could not generate: "+e.message;}});
}
const GEN_WORDS=["Kettle","Lamp","Mug","Bottle","Pen Set","Notebook","Table Fan","Cushion","Charger","Basket","Tiffin","Towel"];
const GEN_CATS=["Home","Kitchen","Stationery","Electronics"];
function genProducts(p){const r=rng(p.seed);let s="CREATE TABLE gen_products (item_id INTEGER PRIMARY KEY, item_name TEXT NOT NULL, category TEXT NOT NULL, price INTEGER NOT NULL, cost REAL NOT NULL);\n";
  for(let i=1;i<=p.n;i++){const w=GEN_WORDS[Math.floor(r()*GEN_WORDS.length)],c=GEN_CATS[Math.floor(r()*GEN_CATS.length)];const pr=20+Math.floor(r()*(p.maxp-19));const cost=Math.round(pr*(0.45+0.35*r())*100)/100;
    s+=`INSERT INTO gen_products VALUES (${i}, '${w} ${i}', '${c}', ${pr}, ${cost});\n`;}return s;}
const GEN_FIRST=["Asha","Ravi","Meera","Kabir","Nisha","Arjun","Leela","Farid","Tara","Vikram","Sana","Joseph"],GEN_LAST=["Rao","Das","Nair","Singh","Pillai","Bose","Khan","Menon","Dutta","Mathew"],GEN_CITY=["Pune","Kochi","Indore","Patna","Surat","Ranchi"];
function genCustomers(p){const r=rng(p.seed);let s="CREATE TABLE gen_customers (cust_id INTEGER PRIMARY KEY, cust_name TEXT NOT NULL, email TEXT, city TEXT);\n";
  for(let i=1;i<=p.n;i++){const f=GEN_FIRST[Math.floor(r()*GEN_FIRST.length)],l=GEN_LAST[Math.floor(r()*GEN_LAST.length)];const em=r()*100<p.pe?"NULL":`'${f.toLowerCase()}.${l.toLowerCase()}${i}@mail.example'`;const ci=r()*100<p.pc?"NULL":`'${GEN_CITY[Math.floor(r()*GEN_CITY.length)]}'`;
    s+=`INSERT INTO gen_customers VALUES (${i}, '${f} ${l}', ${em}, ${ci});\n`;}return s;}
function genScores(p){const r=rng(p.seed);let s="CREATE TABLE gen_scores (player_id INTEGER PRIMARY KEY, player_name TEXT NOT NULL, score INTEGER NOT NULL);\n";
  for(let i=1;i<=p.n;i++)s+=`INSERT INTO gen_scores VALUES (${i}, 'Player ${i}', ${10*(1+Math.floor(r()*p.d))});\n`;return s;}
function sbSelect(root){

    controls:el=>freeConsole(el,"SELECT product_name, price, cost,\n       ROUND(price - cost, 2) AS margin,\n       product_name || ' (' || category || ')' AS label\nFROM products;",

      make:genProducts,done:p=>`Table gen_products created with ${ind(p.n)} rows.`,starter:"SELECT item_name, price, cost, ROUND(price - cost, 2) AS margin,\n       ROUND((price - cost) * 100.0 / price, 1) AS margin_pct\nFROM gen_products;",
      list:[["Integer division","SELECT price, price / 7 AS int_div, price / 7.0 AS real_div FROM gen_products;"]]}),

  },"Free practice on SaralMart, on a table you generate, or on a table you paste.");
}

const L=[];
L.push({id:"l1",badge:"Column Picker",code:"File 1",title:"What goes on the counter",topics:"SELECT lists, column order, expressions and arithmetic, aliases with AS, ROUND, integer division, joining text with || and CONCAT()",
story:`<b>Monday, 9:40, the query counter opens.</b> SaralMart, an online retailer shipping groceries, kitchenware and gadgets to fourteen cities, has one analytics desk and a queue of requests. Merchandising is first: "Every product with its price and its margin, before the pricing meeting at eleven. Not the whole table, only what we use, and please give the columns proper names."`,
brief:`<p>A <span class="term">SELECT list</span> says which columns the result has and in what order. SQL (Structured Query Language) reads it left to right: <code>SELECT product_name, price FROM products</code> returns two columns, name first. <code>SELECT *</code> returns every column in table order; it is fine for a look, poor in a report, because the report breaks when the table gains a column.</p>
<p>A column in the list can be an <span class="term">expression</span>, computed for each row from that row's values: arithmetic with <code>+ - * /</code> and <code>%</code> (remainder), text, or a constant (a <span class="term">literal</span>, such as <code>18</code> or <code>'SaralMart'</code>, which repeats on every row). An <span class="term">alias</span> names a result column: <code>price - cost AS margin</code>. The word AS is optional but clearer; an alias with a space needs double quotes, <code>AS "gross margin"</code>, so most people use snake_case instead. <code>ROUND(x, 2)</code> rounds to 2 decimals; it is a function, and the next module has many more.</p>
<div class="formula">SELECT product_name,
       price,
       price - cost              AS margin,
       ROUND(price * 1.18, 2)    AS price_with_tax,
       product_name || ' (' || category || ')' AS label
FROM   products;</div>
<p>The expression never changes the table: the new columns exist only in the result. Two traps. <span class="term">Integer division</span>: when both numbers are integers, this game's engine drops the remainder, so <code>7 / 2</code> is 3; make one of them real, <code>7 / 2.0</code>, to get 3.5. And <span class="term">concatenation</span>, joining text: standard SQL uses <code>||</code>; numbers are turned into text on the way.</p>
${MN("Division: in this game (SQLite), 7 / 2 = 3 because both are integers; write 7 / 2.0 or CAST(7 AS REAL) / 2. In MySQL, / always gives a decimal (7 / 2 = 3.5000) and DIV is the integer division operator.")}
${MN("Joining text: here a || b works (standard SQL). In MySQL, || means OR unless the PIPES_AS_CONCAT SQL mode is switched on, so MySQL code uses CONCAT(a, b). This game's SQLite (3.45) also has concat(), so CONCAT() runs in both, with one difference: here concat() skips NULL arguments, while in MySQL CONCAT() returns NULL if any argument is NULL. With ||, a NULL anywhere makes the whole result NULL.")}`,
refs:"SQLite documentation, \"SELECT\" (sqlite.org/lang_select.html) and \"SQL Language Expressions\" (sqlite.org/lang_expr.html) · MySQL 8.0 Reference Manual, \"SELECT Statement\", \"Arithmetic Operators\" and \"String Functions and Operators\" · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Query Primer\" · Silberschatz, Korth &amp; Sudarshan, <i>Database System Concepts</i> (7th ed., 2019), chapter \"Introduction to SQL\".",
lab:root=>{labCalc(root);sbSelect(root);},

{t:"sql",db:SM,q:"Merchandising wants every product's name, category and price, in exactly that column order.",answer:"SELECT product_name, category, price FROM products",
 hint:"List the three columns after SELECT, separated by commas, in the order asked.",why:"<code>SELECT product_name, category, price FROM products;</code> The SELECT list fixes both which columns appear and their order. All 41 products come back, because there is no WHERE."},
{t:"sql",db:SM,q:"For each product, show product_id, product_name and the margin, price minus cost, rounded to 2 decimals.",answer:"SELECT product_id, product_name, ROUND(price - cost, 2) AS margin FROM products",
 hint:"ROUND(price - cost, 2), and name it with AS margin.",why:"<code>SELECT product_id, product_name, ROUND(price - cost, 2) AS margin FROM products;</code> The subtraction is done once per row with that row's price and cost. The alias is for the reader; the checker does not compare column names."},
{t:"sql",db:SM,q:"The website shows prices including 18% tax. Return product_id, price and the price including tax, price × 1.18, rounded to 2 decimals.",answer:"SELECT product_id, price, ROUND(price * 1.18, 2) AS price_with_tax FROM products",
 hint:"Multiply price by 1.18 inside ROUND(…, 2). Price × 0.18 would be the tax alone.",why:"<code>SELECT product_id, price, ROUND(price * 1.18, 2) AS price_with_tax FROM products;</code> Multiplying by 1.18 adds 18% in one step. Because 1.18 is a real number, the result keeps its decimals."},
{t:"mcq",q:"In this game, what does <code>SELECT 1450 / 100;</code> return, and what would MySQL return?",opts:["14 here; 14.5000 in MySQL","14.5 here; 14.5000 in MySQL","14 in both","14.5 here; 14 in MySQL"],a:0,
 hint:"Both numbers are integers. Look at the MySQL vs SQLite note in the theory.",why:"SQLite divides two integers as integers and drops the fraction: 14. MySQL's / always returns a decimal, 14.5000 (its integer division is DIV). Write 1450 / 100.0 here to get 14.5."},
{t:"sql",db:SM,q:"Make one label per product for the shelf printer: product_id, then a single text column such as <code>Basmati Rice 5 kg (Grocery)</code>, the name, a space, and the category in brackets.",answer:"SELECT product_id, product_name || ' (' || category || ')' AS label FROM products",

L.push({id:"l2",badge:"Gatekeeper",code:"File 2",title:"Only the rows that qualify",topics:"WHERE with =, &lt;&gt;, &lt;, &gt;, &lt;=, &gt;=; AND, OR, NOT; operator precedence and brackets; comparing text with numbers (type affinity)",
story:`<b>Support's call-back list.</b> "Every phone order that went wrong, cancelled or returned. We call each customer personally." The first draft of the query returned 237 orders, which would take support a fortnight. SaralMart only took 235 phone orders in fifteen months, and most of them were delivered without trouble. Something in the WHERE clause is letting the wrong rows through.`,
brief:`<p>SQL (Structured Query Language) filters rows with <span class="term">WHERE</span>: the condition is tested on each row, and only rows for which it is TRUE stay. <span class="term">Comparison operators</span>: <code>=</code>, <code>&lt;&gt;</code> (also written <code>!=</code>), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. Text goes in single quotes and must match exactly: <code>status = 'Returned'</code>.</p>
<p><span class="term">Logical operators</span> combine conditions: <code>AND</code> (both true), <code>OR</code> (at least one), <code>NOT</code> (reverses). They have a <span class="term">precedence</span>, an order of binding, like × before + in arithmetic: <b>NOT</b> first, then <b>AND</b>, then <b>OR</b>. So</p>
<div class="formula">WHERE channel = 'Phone' AND status = 'Cancelled' OR status = 'Returned'
   is read as
WHERE (channel = 'Phone' AND status = 'Cancelled') OR status = 'Returned'</div>
<p>which lets in returned orders from every channel. Brackets say what you mean: <code>WHERE channel = 'Phone' AND (status = 'Cancelled' OR status = 'Returned')</code>. Whenever AND and OR meet in one WHERE, add brackets even if you think you know the precedence.</p>
<p><span class="term">Comparing text with numbers.</span> Each column has a <span class="term">type affinity</span>, a preferred type. When a numeric column is compared with a quoted number, this game converts the text, so <code>price = '650'</code> works. Two bare values get no conversion: <code>'10' = 10</code> is FALSE (0) here, and <code>10 &lt; '9'</code> is TRUE, because in SQLite every number sorts before every text. That is why <code>order_date &gt; 2025</code> returns every order: the dates are text, and any text is larger than any number. Compare dates with dates: <code>order_date &gt;= '2026-01-01'</code>.</p>
${MN("'10' = 10 is 0 (FALSE) in this game; MySQL converts the string to a number and returns 1. In MySQL, order_date > 2025 also triggers an implicit conversion, which depends on the column's type and can raise warnings; the answer differs from SQLite's and is just as unintended. Compare like with like and both engines agree.")}
${MN("Use single quotes for text. In SQLite, double quotes mean a name (a column or table); \"Toys\" only works because no column is called Toys and SQLite then falls back to treating it as text. MySQL treats double quotes as text by default. Single quotes are correct in both and in standard SQL.")}`,
refs:"SQLite documentation, \"SQL Language Expressions\" (operators and precedence, sqlite.org/lang_expr.html) and \"Datatypes In SQLite\" (type affinity, sqlite.org/datatype3.html) · MySQL 8.0 Reference Manual, \"Operator Precedence\", \"Comparison Functions and Operators\" and \"Type Conversion in Expression Evaluation\" · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Filtering\".",
lab:labGate,

L.push({id:"l3",badge:"Range Finder",code:"File 3",title:"Lists and ranges",topics:"IN and NOT IN, BETWEEN and NOT BETWEEN with inclusive ends, ranges of dates stored as text, ranges of text",
story:`<b>Two requests before lunch.</b> Merchandising is planning a "mid-price shelf" for everything from ₹540 to ₹899, both included, and wants to know what goes on it. Finance needs January 2026's orders for the month-end close, and the auditor has a habit of asking about the 31st.`,
brief:`<p>SQL (Structured Query Language) has two shorthands for common WHERE conditions. <span class="term">IN</span> tests membership in a list: <code>category IN ('Toys', 'Stationery')</code> means <code>category = 'Toys' OR category = 'Stationery'</code>. <code>NOT IN</code> is the opposite. (A NULL inside the list causes a surprise; File 5 explains.)</p>
<p><span class="term">BETWEEN</span> tests a range, and both ends are included:</p>
<div class="formula">price BETWEEN 540 AND 899   ≡   price &gt;= 540 AND price &lt;= 899
price NOT BETWEEN 540 AND 899   ≡   price &lt; 540 OR price &gt; 899</div>
<p>The smaller bound comes first: <code>BETWEEN 899 AND 540</code> is never TRUE. BETWEEN works on anything that can be compared. <span class="term">Dates</span> in this database are text in the form <code>'YYYY-MM-DD'</code>, which sorts exactly like the calendar, so <code>order_date BETWEEN '2026-01-01' AND '2026-01-31'</code> gives January. If a column holds date and time, <code>'2026-01-31 14:05'</code> is larger than <code>'2026-01-31'</code> and is missed; the half-open range <code>&gt;= '2026-01-01' AND &lt; '2026-02-01'</code> is safe in every case.</p>
<p>On <span class="term">text</span>, BETWEEN compares in dictionary order: <code>city_name BETWEEN 'B' AND 'C'</code> returns Bhubaneswar but not Chandigarh or Coimbatore, because 'Chandigarh' sorts after the one-letter text 'C'.</p>
${MN("SQLite has no separate DATE type; dates are stored as TEXT (or numbers) and compared as such. MySQL has DATE and DATETIME types. BETWEEN '2026-01-01' AND '2026-01-31' on a MySQL DATETIME column also misses everything on the 31st after 00:00:00, because the bare date means 2026-01-31 00:00:00.")}`,
refs:"SQLite documentation, \"SQL Language Expressions\" (BETWEEN and IN, sqlite.org/lang_expr.html) and \"Date And Time Functions\" (sqlite.org/lang_datefunc.html) · MySQL 8.0 Reference Manual, \"Comparison Functions and Operators\" and \"The DATE, DATETIME, and TIMESTAMP Types\" · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), chapter \"Retrieving Records\".",
lab:labRange,
qs:[
{t:"sql",db:SM,q:"Products in the Toys, Stationery or Electronics categories: product_name, category.",answer:"SELECT product_name, category FROM products WHERE category IN ('Toys', 'Stationery', 'Electronics')",
 hint:"category IN ( … three quoted values … ).",why:"<code>SELECT product_name, category FROM products WHERE category IN ('Toys', 'Stationery', 'Electronics');</code> 15 products. A chain of three ORs gives the same rows; AND would give none, since a product has one category."},
{t:"sql",db:SM,q:"The mid-price shelf: products priced from ₹540 to ₹899, both included. Return product_name and price.",answer:"SELECT product_name, price FROM products WHERE price BETWEEN 540 AND 899",
 hint:"BETWEEN includes both ends.",why:"<code>SELECT product_name, price FROM products WHERE price BETWEEN 540 AND 899;</code> 11 products, including the two priced exactly 540 and the two at 899. With &gt; and &lt; those four would be lost."},
{t:"sql",db:SM,q:"Finance: every order placed in January 2026 (1st to 31st). Return order_id and order_date.",answer:"SELECT order_id, order_date FROM orders WHERE order_date BETWEEN '2026-01-01' AND '2026-01-31'",
 hint:"Dates are quoted text, 'YYYY-MM-DD'. Make sure the 31st is in.",why:"<code>SELECT order_id, order_date FROM orders WHERE order_date BETWEEN '2026-01-01' AND '2026-01-31';</code> 267 orders, 7 of them on the 31st. <code>order_date &gt;= '2026-01-01' AND order_date &lt; '2026-02-01'</code> gives the same rows and also survives a column with times."},
{t:"mcq",q:"What does <code>SELECT product_name FROM products WHERE price BETWEEN 899 AND 540;</code> return?",opts:["No rows","The same 11 rows as BETWEEN 540 AND 899","Every product outside the range","An error"],a:0,
 hint:"Rewrite it as price &gt;= 899 AND price &lt;= 540.",why:"BETWEEN a AND b means &gt;= a AND &lt;= b. No price is both at least 899 and at most 540, so the result is empty, without any error to warn you."},
{t:"sql",db:SM,q:"Logistics wants the cities outside the North and South regions: city_name, region.",answer:"SELECT city_name, region FROM cities WHERE region NOT IN ('North', 'South')",
 hint:"NOT IN with a two-item list.",why:"<code>SELECT city_name, region FROM cities WHERE region NOT IN ('North', 'South');</code> 8 cities, from the West, East, Central and North-East regions. 'North-East' is a different value from 'North', so it stays."},
{t:"sql",db:SM,q:"Payments from ₹100 to ₹200 inclusive whose method is <code>UPI</code> (Unified Payments Interface, an instant bank transfer) or <code>Wallet</code>: payment_id, method, amount.",answer:"SELECT payment_id, method, amount FROM payments WHERE amount BETWEEN 100 AND 200 AND method IN ('UPI', 'Wallet')",
 hint:"Combine a BETWEEN and an IN with AND.",why:"<code>SELECT payment_id, method, amount FROM payments WHERE amount BETWEEN 100 AND 200 AND method IN ('UPI', 'Wallet');</code> 105 payments, among them a Wallet payment of exactly ₹200 that &lt; 200 would drop."},
{t:"mcq",q:"Which cities does <code>SELECT city_name FROM cities WHERE city_name BETWEEN 'B' AND 'C';</code> return? (The list includes Bhubaneswar, Chandigarh and Coimbatore.)",opts:["Bhubaneswar only","Bhubaneswar, Chandigarh and Coimbatore","Chandigarh and Coimbatore","No rows: BETWEEN needs numbers"],a:0,
 hint:"In dictionary order, is 'Chandigarh' before or after the one-letter text 'C'?",why:"Text is compared character by character; 'C' is a prefix of 'Chandigarh', and the shorter text sorts first, so 'Chandigarh' &gt; 'C' and falls outside. To get all cities starting with B or C, write <code>city_name &gt;= 'B' AND city_name &lt; 'D'</code>."}
]});

L.push({id:"l4",badge:"Pattern Reader",code:"File 4",title:"Search by pattern",topics:"LIKE with % and _, NOT LIKE, case sensitivity in SQLite and MySQL, LIKE on dates stored as text, ESCAPE for a literal % or _",
story:`<b>A customer on the phone.</b> "I bought something from you in December. The name started with C, I think, and it was some kind of board." Meanwhile marketing wants everyone with an inbox.co address, and merchandising wants all products sold by the kilogram. None of these is an exact value, so = will not do.`,
brief:`<p>SQL (Structured Query Language) matches text against a <span class="term">pattern</span> with <span class="term">LIKE</span>. Two wildcards: <code>%</code> stands for any run of characters, including none, and <code>_</code> stands for exactly one character. The pattern must cover the whole text:</p>
<div class="formula">'C%'       starts with C                 'Chopping Board'  ✓
'%Board%'  contains Board anywhere       'Chopping Board'  ✓
'% kg'     ends with a space and kg      'Atta 10 kg'      ✓
'_____'    exactly five characters       'Kochi'           ✓
'%-12-%'   a December date (YYYY-MM-DD)  '2025-12-17'      ✓</div>
<p><code>NOT LIKE</code> reverses the test. To search for a real % or _, name an <span class="term">escape character</span>: <code>LIKE '10\\%%' ESCAPE '\\'</code> means "starts with 10%".</p>
<p><span class="term">Case.</span> In this game LIKE ignores the case of the letters A to Z (<code>'abc' LIKE 'ABC'</code> is TRUE) but not of other letters (<code>'Ä' LIKE 'ä'</code> is FALSE), while <code>=</code> is case-sensitive. So <code>product_name = 'ceiling fan'</code> finds nothing, but <code>product_name LIKE 'ceiling fan'</code> finds the Ceiling Fan.</p>
${MN("In MySQL, both = and LIKE follow the column's collation. With the default utf8mb4_0900_ai_ci collation they ignore case and accents, so = 'ceiling fan' does match there; with a binary or _cs collation they are case-sensitive. In SQLite, LIKE ignores case for the letters A–Z only and = is case-sensitive. MySQL's default escape character for LIKE is the backslash, so there LIKE '10\\%%' works without an ESCAPE clause; in SQLite there is no escape character unless you write ESCAPE.")}`,
refs:"SQLite documentation, \"SQL Language Expressions\", section on the LIKE, GLOB, REGEXP and MATCH operators (sqlite.org/lang_expr.html) · MySQL 8.0 Reference Manual, \"String Comparison Functions and Operators\" and \"Character Sets, Collations, Unicode\" · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Filtering\".",
lab:labLike,
qs:[
{t:"sql",db:SM,q:"The caller's product started with C. List the product_name of every product whose name starts with C.",answer:"SELECT product_name FROM products WHERE product_name LIKE 'C%'",
 hint:"'C%': a C, then anything.",why:"<code>SELECT product_name FROM products WHERE product_name LIKE 'C%';</code> Five products, among them the Chopping Board. '%C%' would also catch names with a c anywhere, such as Basmati Rice and Face Wash, because LIKE ignores case here."},
{t:"sql",db:SM,q:"Marketing: customers whose email address is at the domain inbox.co. Return cust_id and email.",answer:"SELECT cust_id, email FROM customers WHERE email LIKE '%@inbox.co'",
 hint:"Anything, then @inbox.co at the very end.",why:"<code>SELECT cust_id, email FROM customers WHERE email LIKE '%@inbox.co';</code> 196 customers. Anchoring the end with no trailing % rules out an address such as name@inbox.com, should one appear."},
{t:"sql",db:SM,q:"Products sold by the kilogram: product_id and product_name of every product whose name ends with a space followed by kg.",answer:"SELECT product_id, product_name FROM products WHERE product_name LIKE '% kg'",
 hint:"The pattern ends the text, so the wildcard goes in front only.",why:"<code>SELECT product_id, product_name FROM products WHERE product_name LIKE '% kg';</code> Four products: rice, dal, atta and jaggery. 'kg%' would ask for names that start with kg."},
{t:"sql",db:SM,q:"For a quiz on the delivery app: city_name of every city whose name has exactly five characters.",answer:"SELECT city_name FROM cities WHERE city_name LIKE '_____'",
 hint:"Five underscores, no %.",why:"<code>SELECT city_name FROM cities WHERE city_name LIKE '_____';</code> Kochi, Patna and Surat. Each _ takes exactly one character, and without % nothing else may follow."},
{t:"mcq",q:"In this game, how many rows do these return? (1) <code>WHERE product_name = 'ceiling fan'</code> (2) <code>WHERE product_name LIKE 'ceiling fan'</code>",opts:["(1) 0 rows, (2) 1 row","(1) 1 row, (2) 1 row","(1) 0 rows, (2) 0 rows","(1) 1 row, (2) 0 rows"],a:0,
 hint:"The stored name is 'Ceiling Fan'. Which operator ignores case in SQLite?",why:"In SQLite = is case-sensitive and LIKE ignores the case of A–Z, so only (2) finds 'Ceiling Fan'. In MySQL with the default case-insensitive collation, both would return 1 row."},
{t:"sql",db:SM,q:"The caller ordered in December. Using LIKE on the date text, list order_id and order_date of every order placed in any December.",answer:"SELECT order_id, order_date FROM orders WHERE order_date LIKE '%-12-%'",
 hint:"Dates look like 2025-12-17. Which characters surround the month?",why:"<code>SELECT order_id, order_date FROM orders WHERE order_date LIKE '%-12-%';</code> 280 orders. '%12%' would also catch 12 January, 12 March and every other 12th: 412 rows."}
]});

L.push({id:"l5",badge:"Null Hunter",code:"File 5",title:"The values that are not there",topics:"NULL, three-valued logic (TRUE, FALSE, UNKNOWN), IS NULL and IS NOT NULL, the = NULL trap, NULL with &lt;&gt; and NOT IN, COALESCE and IFNULL",
story:`<b>The bounced campaign.</b> Support's email campaign reached fewer customers than the customer count promised. The intern checked for customers without an email using <code>WHERE email = NULL</code>, got zero rows, and reported that everyone has an address. Logistics has a similar puzzle: orders "with no partner" do not show up in any of their lists.`,
brief:`<p><span class="term">NULL</span> marks a value that is missing or unknown: a customer who gave no email, a guest order with no customer, an order with no delivery partner yet. NULL is not zero and not the empty text ''; it is the absence of a value.</p>
<p>Because the value is unknown, a comparison with NULL is neither TRUE nor FALSE but <span class="term">UNKNOWN</span>. SQL (Structured Query Language) therefore uses <span class="term">three-valued logic</span>:</p>
<div class="tbl"><table><thead><tr><th>x</th><th>y</th><th>x AND y</th><th>x OR y</th><th>NOT x</th></tr></thead><tbody>
<tr><td>TRUE</td><td>UNKNOWN</td><td>UNKNOWN</td><td>TRUE</td><td>FALSE</td></tr>
<tr><td>FALSE</td><td>UNKNOWN</td><td>FALSE</td><td>UNKNOWN</td><td>TRUE</td></tr>
<tr><td>UNKNOWN</td><td>UNKNOWN</td><td>UNKNOWN</td><td>UNKNOWN</td><td>UNKNOWN</td></tr></tbody></table></div>
<p>WHERE keeps a row only when the condition is TRUE; UNKNOWN is dropped just like FALSE. Hence the traps:</p>
<div class="formula">WHERE email = NULL          UNKNOWN for every row → no rows, ever
WHERE email IS NULL         the correct test (and IS NOT NULL)
WHERE brand &lt;&gt; 'Kiran'      skips the unbranded products too
WHERE price NOT IN (95, NULL)  no rows: 'not 95 and not unknown' is never TRUE
5 + NULL                    NULL: arithmetic with an unknown is unknown</div>
<p>To replace a NULL in the output, <span class="term">COALESCE(a, b, …)</span> returns the first argument that is not NULL: <code>COALESCE(brand, 'Unbranded')</code>. <code>IFNULL(a, b)</code> is the two-argument version. Both are functions; the next module covers many more.</p>
${MN("IFNULL() and COALESCE() work the same in MySQL and here. MySQL also has a NULL-safe equality operator, a &lt;=&gt; b, which is TRUE when both are NULL; in SQLite write a IS b (and a IS NOT b). IS NULL and IS NOT NULL are identical in both.")}`,
refs:"Codd, \"A Relational Model of Data for Large Shared Data Banks\", <i>Communications of the ACM</i> 13(6), 1970 · SQLite documentation, \"NULL Handling in SQLite Versus Other Database Engines\" (sqlite.org/nulls.html) and \"Built-In Scalar SQL Functions\" (sqlite.org/lang_corefunc.html) · MySQL 8.0 Reference Manual, \"Working with NULL Values\" and \"Problems with NULL Values\" · Elmasri &amp; Navathe, <i>Fundamentals of Database Systems</i> (7th ed., 2016).",
lab:root=>{labNull(root);sbNull(root);},
qs:[
{t:"sql",db:SM,q:"Interview classic: customers with a missing email. Return cust_id and cust_name.",answer:"SELECT cust_id, cust_name FROM customers WHERE email IS NULL",
 hint:"Not = NULL.",why:"<code>SELECT cust_id, cust_name FROM customers WHERE email IS NULL;</code> 23 customers. <code>email = NULL</code> is UNKNOWN on every row and returns nothing, which is exactly the intern's mistake."},
{t:"sql",db:SM,q:"Merchandising wants all products that are not Kiran-branded, and the unbranded ones count as not Kiran. Return product_name and brand.",answer:"SELECT product_name, brand FROM products WHERE brand <> 'Kiran' OR brand IS NULL",
 hint:"brand &lt;&gt; 'Kiran' is UNKNOWN when brand is NULL. Add those rows explicitly.",why:"<code>SELECT product_name, brand FROM products WHERE brand &lt;&gt; 'Kiran' OR brand IS NULL;</code> 35 products. Without the OR, the 7 unbranded products disappear, because NULL &lt;&gt; 'Kiran' is UNKNOWN."},
{t:"sql",db:SM,q:"Guest checkouts: delivered orders that have no customer attached. Return order_id and order_date.",answer:"SELECT order_id, order_date FROM orders WHERE cust_id IS NULL AND status = 'Delivered'",
 hint:"A guest order has cust_id NULL.",why:"<code>SELECT order_id, order_date FROM orders WHERE cust_id IS NULL AND status = 'Delivered';</code> 181 orders. IS NULL is never UNKNOWN, so it combines with AND safely."},
{t:"num",q:"How many rows does <code>SELECT * FROM customers WHERE email = NULL;</code> return, given that 23 customers have no email?",a:0,tol:0,ph:"e.g. 23",
 hint:"What is NULL = NULL?",why:"Zero. For a missing email, NULL = NULL is UNKNOWN; for a present one, 'x' = NULL is UNKNOWN too. WHERE keeps only TRUE rows, so nothing survives."},
{t:"sql",db:SM,q:"For the Electronics shelf labels: product_name and the brand, showing <code>Unbranded</code> where the brand is missing.",answer:"SELECT product_name, COALESCE(brand, 'Unbranded') AS brand_label FROM products WHERE category = 'Electronics'",
 hint:"COALESCE(brand, 'Unbranded') or IFNULL(brand, 'Unbranded').",why:"<code>SELECT product_name, COALESCE(brand, 'Unbranded') AS brand_label FROM products WHERE category = 'Electronics';</code> Six rows, three of them labelled Unbranded. COALESCE changes only the output, never the stored NULL."},
{t:"sql",db:SM,q:"Logistics: orders still In transit that have no delivery partner assigned. Return order_id.",answer:"SELECT order_id FROM orders WHERE status = 'In transit' AND partner_id IS NULL",
 hint:"partner_id is NULL when no partner is assigned.",why:"<code>SELECT order_id FROM orders WHERE status = 'In transit' AND partner_id IS NULL;</code> 90 orders waiting for a partner, the ones logistics could not see with = NULL."},
{t:"mcq",q:"What is the value of <code>2 NOT IN (1, NULL)</code>?",opts:["UNKNOWN (NULL), so such a row is not kept","TRUE, because 2 is neither 1 nor NULL","FALSE","An error"],a:0,
 hint:"NOT IN means 2 &lt;&gt; 1 AND 2 &lt;&gt; NULL.",why:"2 &lt;&gt; 1 is TRUE, 2 &lt;&gt; NULL is UNKNOWN, and TRUE AND UNKNOWN is UNKNOWN. One NULL in a NOT IN list makes the condition fail for every row; the same trap returns with subqueries in a later module."}
]});

L.push({id:"l6",badge:"Sort Master",code:"File 6",title:"No duplicates, in order",topics:"DISTINCT on one and several columns, ORDER BY with several keys, ASC and DESC, sorting by alias or position, where NULLs sort, NULLS FIRST and LAST, ties",
story:`<b>The printed price list.</b> Merchandising is sending a catalogue to business customers: grouped by category, most expensive first inside each group, unbranded items at the end. Logistics, meanwhile, asks a question that sounds simpler: "Which combinations of channel and status exist at all? We are redesigning the status board."`,
brief:`<p>SQL (Structured Query Language) returns rows in no particular order unless you ask. <span class="term">ORDER BY</span> sorts the result: <code>ASC</code> (ascending, the default) or <code>DESC</code> per key. With several keys, the second key only orders rows that tie on the first, the third only rows tied on both, and so on:</p>
<div class="formula">SELECT product_name, category, price
FROM   products
ORDER  BY category ASC, price DESC, product_id;</div>
<p>You may sort by an alias from the SELECT list (<code>ORDER BY margin</code>) or by column position (<code>ORDER BY 2</code>, legal but fragile). Rows that tie on every key come back in no promised order, so a report or a top-N list should end with a unique key such as product_id.</p>
<p><span class="term">NULLs in a sort.</span> Both this game and MySQL treat NULL as smaller than every value: NULLs come first with ASC and last with DESC. To force them last in an ascending sort, sort on the test first: <code>ORDER BY brand IS NULL, brand</code> (FALSE = 0 before TRUE = 1).</p>
<p><span class="term">DISTINCT</span> removes duplicate rows from the result. It applies to the whole row of selected columns: <code>SELECT DISTINCT channel, status</code> gives each combination once. For DISTINCT, all NULLs count as one value, so <code>SELECT DISTINCT brand</code> has one NULL row.</p>
${MN("SQLite (3.30 and later, as in this game) accepts ORDER BY brand NULLS LAST and NULLS FIRST. MySQL 8.0 does not; use ORDER BY brand IS NULL, brand, which works in both.")}
${MN("Text is sorted and de-duplicated by character code in this game, so capital letters come before small ones ('Zebra' sorts before 'apple') and DISTINCT keeps 'Pune' and 'pune' as two values. MySQL's default collation ignores case: it sorts 'apple' first and DISTINCT returns one of the two. With consistently capitalised data, such as SaralMart's, both give the same result.")}`,
refs:"SQLite documentation, \"SELECT\", sections on the ORDER BY clause and DISTINCT (sqlite.org/lang_select.html) · MySQL 8.0 Reference Manual, \"Sorting Rows\" and \"SELECT Statement\" · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), chapter \"Sorting Query Results\".",
lab:labSort,
qs:[
{t:"sql",db:SM,q:"Which product categories exist? One row per category, one column.",answer:"SELECT DISTINCT category FROM products",
 hint:"SELECT DISTINCT …",why:"<code>SELECT DISTINCT category FROM products;</code> Seven categories. Without DISTINCT you get 41 rows, one per product."},
{t:"sql",db:SM,q:"Logistics: every combination of channel and status that occurs in orders, each once. Return channel, status.",answer:"SELECT DISTINCT channel, status FROM orders",
 hint:"DISTINCT applies to the pair of columns together.",why:"<code>SELECT DISTINCT channel, status FROM orders;</code> 12 combinations: 3 channels × 4 statuses, all of which occur. DISTINCT channel alone would give 3 rows."},
{t:"sql",db:SM,ordered:true,q:"The price list: product_name, category, price, sorted by category A to Z, then by price from highest to lowest, then by product_id.",answer:"SELECT product_name, category, price FROM products ORDER BY category ASC, price DESC, product_id",
 hint:"Three keys in that order; DESC only on price.",why:"<code>SELECT product_name, category, price FROM products ORDER BY category ASC, price DESC, product_id;</code> Electronics comes first (alphabetically), its Bluetooth Speaker at the top. Swapping the keys, price first, would mix the categories."},
{t:"sql",db:SM,ordered:true,q:"Business customers, newest sign-up first; ties by cust_id. Return cust_id, cust_name, signup_date.",answer:"SELECT cust_id, cust_name, signup_date FROM customers WHERE segment = 'Business' ORDER BY signup_date DESC, cust_id",
 hint:"Text dates in 'YYYY-MM-DD' sort correctly; DESC for newest first.",why:"<code>SELECT cust_id, cust_name, signup_date FROM customers WHERE segment = 'Business' ORDER BY signup_date DESC, cust_id;</code> 58 rows, customer 146 (2026-06-27) first. WHERE filters before the sort."},
{t:"mcq",q:"Seven products have no brand. With <code>ORDER BY brand</code> (ascending), where do they appear, in this game and in MySQL?",opts:["First, in both","Last, in both","First here, last in MySQL","They are left out of the result"],a:0,
 hint:"Both engines treat NULL as the smallest value.",why:"NULL sorts as smaller than any value in both SQLite and MySQL, so NULLs lead an ascending sort and trail a descending one. Sorting never removes rows."},
{t:"sql",db:SM,ordered:true,q:"Products by brand A to Z with the unbranded ones at the end, ties by product_id. Return product_name, brand. Write it so that it would also run in MySQL.",answer:"SELECT product_name, brand FROM products ORDER BY brand IS NULL, brand, product_id",
 hint:"Sort first on brand IS NULL (0 for branded, 1 for unbranded), then on brand.",why:"<code>SELECT product_name, brand FROM products ORDER BY brand IS NULL, brand, product_id;</code> brand IS NULL is 0 or 1, so branded rows come first. <code>ORDER BY brand NULLS LAST, product_id</code> gives the same order here but does not run in MySQL 8.0."},
{t:"num",q:"How many rows does <code>SELECT DISTINCT brand FROM products;</code> return? There are 6 brand names and 7 unbranded products.",a:7,tol:0,ph:"e.g. 13",
 hint:"For DISTINCT, all NULLs count as one value.",why:"Seven: the six brand names and one NULL row standing for all seven unbranded products."}
]});

L.push({id:"l7",badge:"Page Turner",code:"File 7",title:"Top N and pages",topics:"LIMIT and OFFSET, LIMIT offset, count, top-N lists, pagination, the Nth highest value with DISTINCT, why LIMIT needs ORDER BY",
story:`<b>The website team arrives.</b> "The catalogue page shows ten products at a time, most expensive first. Page 3 sometimes shows a product that was already on page 2." And a job candidate the desk is interviewing this afternoon will be asked the most famous SQL question of all: find the second highest price.`,
brief:`<p><span class="term">LIMIT n</span> keeps the first n rows of the result; <span class="term">OFFSET m</span> skips m rows first. Together they make <span class="term">pagination</span>: page p with s rows per page is</p>
<div class="formula">ORDER BY price DESC, product_id
LIMIT s OFFSET (p − 1) × s          page 3 of 10: LIMIT 10 OFFSET 20
LIMIT (p − 1) × s, s                the same, offset first (MySQL and SQLite)</div>
<p>LIMIT acts on the rows in their final order, so without ORDER BY the rows you get are whatever the engine reaches first, and that may change between runs or after an update. With ORDER BY but ties at the cut, the tied rows may swap between pages: the website team's bug. The cure is the same as in File 6: end the ORDER BY with a unique key.</p>
<p>The <span class="term">Nth highest value</span>: remove duplicates first, then skip N − 1 values:</p>
<div class="formula">SELECT DISTINCT price FROM products
ORDER BY price DESC
LIMIT 1 OFFSET 1;                   -- the second highest price</div>
<p>Without DISTINCT, two products sharing the top price would make the "second highest" equal to the highest. If there are fewer than N distinct values, the result is empty. Standard SQL (Structured Query Language) spells the same idea <code>OFFSET 1 ROWS FETCH FIRST 1 ROWS ONLY</code>; MySQL and SQLite use LIMIT.</p>
${MN("LIMIT n OFFSET m and the short form LIMIT m, n (offset first) both work in MySQL and in this game. Note the order in the short form: LIMIT 20, 10 skips 20 rows and returns 10.")}`,
refs:"SQLite documentation, \"SELECT\", section on the LIMIT clause (sqlite.org/lang_select.html) · MySQL 8.0 Reference Manual, \"SELECT Statement\" and \"LIMIT Query Optimization\" · Molinaro &amp; de Graaf, <i>SQL Cookbook</i> (2nd ed., 2020), chapter \"Retrieving Records\".",
lab:root=>{labPage(root);sbPage(root);},
qs:[
{t:"sql",db:SM,ordered:true,q:"The homepage banner: the 5 most expensive products, ties by product_id. Return product_name, price.",answer:"SELECT product_name, price FROM products ORDER BY price DESC, product_id LIMIT 5",
 hint:"ORDER BY price DESC, product_id, then LIMIT 5.",why:"<code>SELECT product_name, price FROM products ORDER BY price DESC, product_id LIMIT 5;</code> Mixer Grinder (₹3,200) down to Curtain Pair (₹1,250). LIMIT without the ORDER BY would give five arbitrary products."},
{t:"sql",db:SM,q:"Interview classic: the second highest price among all products. One column, one row.",answer:"SELECT DISTINCT price FROM products ORDER BY price DESC LIMIT 1 OFFSET 1",
 hint:"Remove duplicate prices, sort high to low, skip one, take one.",why:"<code>SELECT DISTINCT price FROM products ORDER BY price DESC LIMIT 1 OFFSET 1;</code> ₹2,650. Here the top prices happen to be unique, so the version without DISTINCT also gives 2,650, but it breaks as soon as two products share the top price. Interviewers check for DISTINCT."},
{t:"sql",db:SM,ordered:true,q:"Interview classic: page 3 of the catalogue sorted by product_name A to Z, 10 products per page. Return product_name.",answer:"SELECT product_name FROM products ORDER BY product_name LIMIT 10 OFFSET 20",
 hint:"Page 3 skips 2 × 10 rows.",why:"<code>SELECT product_name FROM products ORDER BY product_name LIMIT 10 OFFSET 20;</code> Rows 21 to 30, Herbal Shampoo to Power Bank. <code>LIMIT 20, 10</code> is the same. Product names are unique, so no tiebreaker is needed."},
{t:"sql",db:SM,ordered:true,q:"The 4 cheapest Grocery products, cheapest first, ties by product_id. Return product_name, price.",answer:"SELECT product_name, price FROM products WHERE category = 'Grocery' ORDER BY price, product_id LIMIT 4",
 hint:"WHERE first, then ORDER BY price ascending, then LIMIT.",why:"<code>SELECT product_name, price FROM products WHERE category = 'Grocery' ORDER BY price, product_id LIMIT 4;</code> Jaggery (₹95), sunflower oil, toor dal and masala oats."},
{t:"mcq",q:"What does <code>SELECT order_id FROM orders LIMIT 5;</code> promise?",opts:["Five rows, but which five is not defined","The five oldest orders","The five lowest order_id values","The five most recent orders"],a:0,
 hint:"Is there an ORDER BY?",why:"Without ORDER BY, SQL promises no order, so LIMIT takes whichever rows the engine produces first. It often looks like key order, which is exactly why the bug survives until it bites."},
{t:"sql",db:SM,ordered:true,q:"The 5 most recent orders: order_id and order_date, newest date first, and for the same date the higher order_id first.",answer:"SELECT order_id, order_date FROM orders ORDER BY order_date DESC, order_id DESC LIMIT 5",
 hint:"Two DESC keys, then LIMIT 5.",why:"<code>SELECT order_id, order_date FROM orders ORDER BY order_date DESC, order_id DESC LIMIT 5;</code> All five fall on 2026-09-30, the last day of the data; the tiebreaker decides which five."},
{t:"mcq",q:"A MySQL query ends with <code>LIMIT 20, 10</code>. Which rows does it return?",opts:["Rows 21 to 30","Rows 20 to 30","Rows 1 to 20, then 10 more","Rows 11 to 30"],a:0,
 hint:"In the short form, the first number is the offset.",why:"LIMIT 20, 10 means OFFSET 20 LIMIT 10: skip 20 rows, return the next 10, rows 21 to 30. SQLite reads it the same way."}
]});

L.push({id:"l8",badge:"Label Maker",code:"File 8",title:"Labels and the order of execution",topics:"CASE WHEN for labels, searched and simple CASE, the logical processing order FROM → WHERE → SELECT → ORDER BY → LIMIT, why an alias cannot be used in WHERE",
story:`<b>Friday's report.</b> Merchandising wants every product tagged Budget, Mid or Premium, and support wants each order marked Closed or Needs follow-up. A colleague's query used its own alias in WHERE; it ran perfectly on the desk's laptop and failed on the company's MySQL server with "Unknown column". Both problems are about what the engine does, and when.`,
brief:`<p><span class="term">CASE</span> builds a value from conditions, row by row. The <span class="term">searched CASE</span> tests conditions in order and returns the result of the first that is TRUE; ELSE covers the rest, and without ELSE the result is NULL:</p>
<div class="formula">CASE WHEN price &lt; 300  THEN 'Budget'
     WHEN price &lt; 1000 THEN 'Mid'
     ELSE 'Premium'
END AS band</div>
<p>Order matters: a price of 200 meets both conditions, and the first wins. The <span class="term">simple CASE</span> compares one expression with values: <code>CASE status WHEN 'Delivered' THEN 'Closed' … END</code>.</p>
<p><span class="term">Logical processing order.</span> SQL (Structured Query Language) is written SELECT … FROM … WHERE … ORDER BY … LIMIT, but it is evaluated, logically, as</p>
<div class="formula">FROM  →  WHERE  →  SELECT  →  ORDER BY  →  LIMIT</div>
<p>(two more clauses, GROUP BY and HAVING, fit between WHERE and SELECT; they arrive in the next module). An alias is created in SELECT, so WHERE, which runs earlier, has not heard of it, while ORDER BY, which runs later, has. The portable rule: in WHERE, repeat the expression; in ORDER BY, use the alias freely. The engine may execute things differently for speed, but the result must be as if it followed this order.</p>
${MN("An alias in WHERE: MySQL rejects WHERE margin &gt; 500 with \"Unknown column 'margin' in 'where clause'\", as standard SQL requires. SQLite accepts it as an extension, so it runs in this game; do not rely on it. Also: MySQL's IF(cond, a, b) is IIF(cond, a, b) in SQLite; CASE works in both.")}`,
refs:"SQLite documentation, \"SELECT\" (sqlite.org/lang_select.html) and \"SQL Language Expressions\", section on the CASE expression (sqlite.org/lang_expr.html) · MySQL 8.0 Reference Manual, \"Flow Control Functions\" and \"Problems with Column Aliases\" · Beaulieu, <i>Learning SQL</i> (3rd ed., 2020), chapter \"Conditional Logic\" · Ramakrishnan &amp; Gehrke, <i>Database Management Systems</i> (3rd ed., 2003).",
lab:root=>{root.appendChild(SQLX.txt("p","Pick a query and replay it in the order the engine evaluates it. The third query uses an alias in WHERE: watch what exists at that moment.","note"));
  const sel=selectBox(Object.entries(PIPES).map(([k,v])=>[k,v.label]),"Query");const r0=el("div",{class:"btnrow"});r0.appendChild(sel);root.appendChild(r0);

  freeConsole(root,"SELECT product_name, price,\n       CASE WHEN price < 300 THEN 'Budget'\n            WHEN price < 1000 THEN 'Mid'\n            ELSE 'Premium' END AS band\nFROM products\nORDER BY band, price;",
    [["Alias in WHERE","SELECT product_name, price - cost AS margin FROM products WHERE margin > 500 ORDER BY margin DESC;"],["Portable","SELECT product_name, price - cost AS margin FROM products WHERE price - cost > 500 ORDER BY margin DESC;"],["CASE without ELSE","SELECT product_name, CASE WHEN price >= 2000 THEN 'Big ticket' END AS flag FROM products;"],["IIF","SELECT product_name, IIF(brand IS NULL, 'Unbranded', brand) AS brand_label FROM products;"]]);},
qs:[
{t:"sql",db:SM,q:"Tag every product: product_name, price, and a band that is <code>Budget</code> below ₹300, <code>Mid</code> from ₹300 up to but not including ₹1,000, and <code>Premium</code> from ₹1,000.",answer:"SELECT product_name, price, CASE WHEN price < 300 THEN 'Budget' WHEN price < 1000 THEN 'Mid' ELSE 'Premium' END AS band FROM products",
 hint:"Test the smallest band first; the first TRUE WHEN wins.",why:"<code>SELECT product_name, price, CASE WHEN price &lt; 300 THEN 'Budget' WHEN price &lt; 1000 THEN 'Mid' ELSE 'Premium' END AS band FROM products;</code> If price &lt; 1000 came first, every cheap product would be labelled Mid, because that condition is also TRUE for them."},
{t:"sql",db:SM,q:"Support: for phone orders, return order_id, status and a column that says <code>Closed</code> for Delivered or Cancelled orders and <code>Needs follow-up</code> for all others.",answer:"SELECT order_id, status, CASE WHEN status IN ('Delivered', 'Cancelled') THEN 'Closed' ELSE 'Needs follow-up' END AS follow_up FROM orders WHERE channel = 'Phone'",
 hint:"CASE WHEN status IN (…) THEN … ELSE … END, and WHERE channel = 'Phone'.",why:"<code>SELECT order_id, status, CASE WHEN status IN ('Delivered', 'Cancelled') THEN 'Closed' ELSE 'Needs follow-up' END AS follow_up FROM orders WHERE channel = 'Phone';</code> 235 rows. The simple form <code>CASE status WHEN 'Delivered' THEN 'Closed' WHEN 'Cancelled' THEN 'Closed' ELSE 'Needs follow-up' END</code> is equivalent."},
{t:"mcq",q:"In which logical order are these clauses evaluated?",opts:["FROM, WHERE, SELECT, ORDER BY, LIMIT","SELECT, FROM, WHERE, ORDER BY, LIMIT","FROM, SELECT, WHERE, LIMIT, ORDER BY","WHERE, FROM, SELECT, ORDER BY, LIMIT"],a:0,
 hint:"You need rows before you can filter them, and a sorted list before you can cut it.",why:"FROM supplies the rows, WHERE filters them, SELECT computes the output columns, ORDER BY sorts them and LIMIT cuts the sorted list. The written order puts SELECT first only for the reader's convenience."},
{t:"sql",db:SM,ordered:true,q:"Products whose margin, price minus cost, exceeds ₹500: product_name and the margin rounded to 2 decimals, largest margin first, ties by product_id. Write the WHERE so that it would also run in MySQL.",answer:"SELECT product_name, ROUND(price - cost, 2) AS margin FROM products WHERE price - cost > 500 ORDER BY margin DESC, product_id",
 hint:"Repeat the expression in WHERE; the alias is fine in ORDER BY.",why:"<code>SELECT product_name, ROUND(price - cost, 2) AS margin FROM products WHERE price - cost &gt; 500 ORDER BY margin DESC, product_id;</code> Five products, the Mixer Grinder first. <code>WHERE margin &gt; 500</code> also runs here, because SQLite looks the alias up, but MySQL rejects it."},
{t:"mcq",q:"On MySQL 8.0, what happens with <code>SELECT product_name, price - cost AS margin FROM products WHERE margin &gt; 500;</code>?",opts:["An error: Unknown column 'margin' in 'where clause'","It returns the five high-margin products","It returns all products, because margin is NULL","It returns no rows"],a:0,
 hint:"When does the alias come into existence?",why:"WHERE is evaluated before SELECT, so the alias does not exist yet and MySQL reports an unknown column. This game's SQLite accepts it as an extension, which is how the colleague's query ran on the laptop."},
{t:"sql",db:SM,ordered:true,q:"Interview classic: Premium customers' contact list. Return cust_id, cust_name and a contact column holding the email, or the text <code>NO EMAIL</code> when it is missing. Sort by cust_id.",answer:"SELECT cust_id, cust_name, CASE WHEN email IS NULL THEN 'NO EMAIL' ELSE email END AS contact FROM customers WHERE segment = 'Premium' ORDER BY cust_id",
 hint:"CASE WHEN email IS NULL THEN … ELSE email END, or COALESCE.",why:"<code>SELECT cust_id, cust_name, CASE WHEN email IS NULL THEN 'NO EMAIL' ELSE email END AS contact FROM customers WHERE segment = 'Premium' ORDER BY cust_id;</code> 122 rows. <code>COALESCE(email, 'NO EMAIL')</code> is the short form. <code>CASE WHEN email = NULL …</code> never fires, so the missing emails would stay NULL."},

 hint:"LIMIT is the last step.",why:"Four. WHERE keeps the 4 Toys rows, SELECT and ORDER BY work on all four, and only then does LIMIT keep 2."}
]});
